<!DOCTYPE html>
<html lang="zh-Hant">

<title>圖解營養學</title>
<style>
  :root {

  }

  .bk { position: absolute; transform: translate(-50%, -50%) scale(var(--s, .75)); transform-origin: center; }
  /* 空格：看得到的是 .face，真正的下拉選單透明地蓋在上面（字級 16px，iPhone 點選時畫面才不會自動放大） */

  .face::after { content: ""; position: absolute; right: 11px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  .face b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; } .face small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .pick.has .face { border-style: solid; background: var(--brand-soft); }
  .pick.ok .face { border: 2px solid var(--ok); background: var(--ok-soft); }
  .pick:focus-within .face { outline: 2px solid var(--brand); outline-offset: 2px; }
  .bk .pick { display: flex; width: 100%; height: 100%; }

  .bk .face::after { display: none; }

  .mk { position: absolute; right: -8px; top: -10px; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; font-size: 13px; font-weight: 700; font-style: normal; color: #fff; }

  .st { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }

  .cz { margin: 0; padding: 0; list-style: none; } .cz li { padding: 12px 0; border-top: 1px solid var(--line); line-height: 2; margin: 0; } .cz li:first-child { border-top: 0; }
  .cz .pick { margin: 3px 2px; } .cz .face { min-height: 36px; }

  .res.ok b { color: var(--ok); } .res.bad b { color: var(--bad); }

  /* 顏色的意思：名稱框的底色＝碳數；小標籤＝這一步花掉或產生什麼；實心編號＝不可逆步驟 */
  .dia rect.k6 { fill: var(--k6); stroke: var(--k6s); } .dia rect.k5 { fill: var(--k5); stroke: var(--k5s); } .dia rect.k4 { fill: var(--k4); stroke: var(--k4s); }
  .dia rect.k3 { fill: var(--k3); stroke: var(--k3s); } .dia rect.k2 { fill: var(--k2); stroke: var(--k2s); }
  .dia .num.irr circle { fill: var(--brand); } .dia .num.irr text { fill: var(--on-brand); }
  .dia .tag rect { stroke-width: 1.2; } .dia .tag text { fill: var(--on-tag); font-weight: 700; }
  .dia .tag.atp rect { fill: var(--e-atp); stroke: var(--e-atp); } .dia .tag.nadh rect { fill: var(--e-nadh); stroke: var(--e-nadh); } .dia .tag.fad rect { fill: var(--e-fad); stroke: var(--e-fad); }
  .dia .tag.co2 rect { fill: var(--e-co2); stroke: var(--e-co2); } .dia .tag.sp rect { fill: var(--card); stroke: var(--e-atp); } .dia .tag.sp text { fill: var(--w-k); }
  .dia .tag.spn rect { fill: var(--card); stroke: var(--e-nadh); } .dia .tag.spn text { fill: var(--w-d); }
  .dia .tag.nadph rect { fill: var(--k4s); stroke: var(--k4s); } .dia .tag.spp rect { fill: var(--card); stroke: var(--k4s); } .dia .tag.spp text { fill: var(--k4s); } .dia .tag.mol rect, .dia .tag.out rect { fill: var(--card); stroke: var(--muted); } .dia .tag.mol text, .dia .tag.out text { fill: var(--ink); }
  .dia text.nt { fill: var(--muted); }
  .pick .face.k6 { background: var(--k6); } .pick .face.k5 { background: var(--k5); } .pick .face.k4 { background: var(--k4); } .pick .face.k3 { background: var(--k3); } .pick .face.k2 { background: var(--k2); }
  .pick:not(.ok):not(.no) .face.k6 { border-color: var(--k6s); } .pick:not(.ok):not(.no) .face.k5 { border-color: var(--k5s); } .pick:not(.ok):not(.no) .face.k4 { border-color: var(--k4s); }
  .pick:not(.ok):not(.no) .face.k3 { border-color: var(--k3s); } .pick:not(.ok):not(.no) .face.k2 { border-color: var(--k2s); }
  .pick.no .face { border: 2px solid var(--bad); background: var(--bad-soft); }
  .face.tk { box-shadow: inset 6px 0 0 var(--e-atp); padding-left: 16px; } .face.td { box-shadow: inset 6px 0 0 var(--e-nadh); padding-left: 16px; } .face.tf { box-shadow: inset 6px 0 0 var(--e-fad); padding-left: 16px; } .face.tp { box-shadow: inset 6px 0 0 var(--k4s); padding-left: 16px; }
  .lgd { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .lgd span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lgd i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; font-style: normal; font-size: 9px; font-weight: 700; }
  .lgd i.k6 { background: var(--k6); border-color: var(--k6s); } .lgd i.k5 { background: var(--k5); border-color: var(--k5s); } .lgd i.k4 { background: var(--k4); border-color: var(--k4s); }
  .lgd i.k3 { background: var(--k3); border-color: var(--k3s); } .lgd i.k2 { background: var(--k2); border-color: var(--k2s); }
  .lgd i.irr { border-radius: 50%; background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .lgd i.tk { background: var(--e-atp); border-color: var(--e-atp); } .lgd i.td { background: var(--e-nadh); border-color: var(--e-nadh); } .lgd i.tf { background: var(--e-fad); border-color: var(--e-fad); } .lgd i.tp { background: var(--k4s); border-color: var(--k4s); }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }
  .wk { color: var(--w-k); font-weight: 700; } .wd { color: var(--w-d); font-weight: 700; }
  .glab.k6 { color: var(--k6s); } .glab.k5 { color: var(--k5s); } .glab.k4 { color: var(--k4s); } .glab.k3 { color: var(--k3s); } .glab.k2 { color: var(--k2s); }
  .item.k6 { border-left: 5px solid var(--k6s); } .item.k5 { border-left: 5px solid var(--k5s); } .item.k4 { border-left: 5px solid var(--k4s); } .item.k3 { border-left: 5px solid var(--k3s); } .item.k2 { border-left: 5px solid var(--k2s); }
  /* 分生：底色與線的顏色＝分子種類（DNA 藍、新合成的 DNA 青、RNA 玫瑰、蛋白質琥珀） */
  .dia rect.kD, .dia .kD { fill: var(--k5); stroke: var(--k5s); } .dia rect.kN, .dia .kN { fill: var(--k4); stroke: var(--k4s); } .dia rect.kR, .dia .kR { fill: var(--k3); stroke: var(--k3s); } .dia rect.kP, .dia .kP { fill: var(--k6); stroke: var(--k6s); }
  .pick .face.kD { background: var(--k5); } .pick .face.kN { background: var(--k4); } .pick .face.kR { background: var(--k3); } .pick .face.kP { background: var(--k6); }
  .pick:not(.ok):not(.no) .face.kD { border-color: var(--k5s); } .pick:not(.ok):not(.no) .face.kN { border-color: var(--k4s); } .pick:not(.ok):not(.no) .face.kR { border-color: var(--k3s); } .pick:not(.ok):not(.no) .face.kP { border-color: var(--k6s); }
  .lgd i.kD { background: var(--k5); border-color: var(--k5s); } .lgd i.kN { background: var(--k4); border-color: var(--k4s); } .lgd i.kR { background: var(--k3); border-color: var(--k3s); } .lgd i.kP { background: var(--k6); border-color: var(--k6s); }
  .lgd i.sD { background: var(--k5s); border-color: var(--k5s); } .lgd i.sN { background: var(--k4s); border-color: var(--k4s); } .lgd i.sR { background: var(--k3s); border-color: var(--k3s); } .lgd i.sP { background: var(--k6s); border-color: var(--k6s); }
  .glab.kD { color: var(--k5s); } .glab.kR { color: var(--k3s); } .glab.kP { color: var(--k6s); } .glab.kN { color: var(--k4s); }
  .item.kD { border-left: 5px solid var(--k5s); } .item.kR { border-left: 5px solid var(--k3s); } .item.kP { border-left: 5px solid var(--k6s); } .item.kN { border-left: 5px solid var(--k4s); }
  .wD { color: var(--k5s); font-weight: 700; } .wN { color: var(--k4s); font-weight: 700; } .wR { color: var(--k3s); font-weight: 700; } .wP { color: var(--w-k); font-weight: 700; }
  /* 生理：E＝興奮、交感、去極化（玫瑰）；I＝抑制、副交感、再極化（藍）；H＝激素、耗能（琥珀）；C＝鈣與第二傳訊者（紫）；T＝被動、水（青） */
  .dia rect.kE, .dia .kE { fill: var(--k3); stroke: var(--k3s); } .pick .face.kE { background: var(--k3); } .pick:not(.ok):not(.no) .face.kE { border-color: var(--k3s); } .lgd i.kE { background: var(--k3); border-color: var(--k3s); } .lgd i.sE { background: var(--k3s); border-color: var(--k3s); } .glab.kE { color: var(--k3s); } .item.kE { border-left: 5px solid var(--k3s); } .wE { color: var(--k3s); font-weight: 700; }
  .dia rect.kI, .dia .kI { fill: var(--k5); stroke: var(--k5s); } .pick .face.kI { background: var(--k5); } .pick:not(.ok):not(.no) .face.kI { border-color: var(--k5s); } .lgd i.kI { background: var(--k5); border-color: var(--k5s); } .lgd i.sI { background: var(--k5s); border-color: var(--k5s); } .glab.kI { color: var(--k5s); } .item.kI { border-left: 5px solid var(--k5s); } .wI { color: var(--k5s); font-weight: 700; }
  .dia rect.kH, .dia .kH { fill: var(--k6); stroke: var(--k6s); } .pick .face.kH { background: var(--k6); } .pick:not(.ok):not(.no) .face.kH { border-color: var(--k6s); } .lgd i.kH { background: var(--k6); border-color: var(--k6s); } .lgd i.sH { background: var(--k6s); border-color: var(--k6s); } .glab.kH { color: var(--k6s); } .item.kH { border-left: 5px solid var(--k6s); } .wH { color: var(--w-k); font-weight: 700; }
  .dia rect.kC, .dia .kC { fill: var(--k2); stroke: var(--k2s); } .pick .face.kC { background: var(--k2); } .pick:not(.ok):not(.no) .face.kC { border-color: var(--k2s); } .lgd i.kC { background: var(--k2); border-color: var(--k2s); } .lgd i.sC { background: var(--k2s); border-color: var(--k2s); } .glab.kC { color: var(--k2s); } .item.kC { border-left: 5px solid var(--k2s); } .wC { color: var(--k2s); font-weight: 700; }
  .dia rect.kT, .dia .kT { fill: var(--k4); stroke: var(--k4s); } .pick .face.kT { background: var(--k4); } .pick:not(.ok):not(.no) .face.kT { border-color: var(--k4s); } .lgd i.kT { background: var(--k4); border-color: var(--k4s); } .lgd i.sT { background: var(--k4s); border-color: var(--k4s); } .glab.kT { color: var(--k4s); } .item.kT { border-left: 5px solid var(--k4s); } .wT { color: var(--k4s); font-weight: 700; }
  /* 首頁的分頁 */
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); margin: 4px 0 0; }
  .tabs button { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--muted); }

<script>

var LANG = 'bi', FORCE = null;                       // FORCE：某一關固定用某種語言（總複習固定英文）

    L.blanks.forEach(function (k) { var p = pos(U, k); B.push({ id: 'n_' + k, where: 'node', ans: k, src: U.map, enFirst: true, opts: shuffle(keys), x: p.x, y: p.y, w: p.w, c: L.plain ? null : U.map[k].c }); });
    if (L.rows) { var A = allSteps(U), fld = L.rows === 'enz' ? 'e' : 'p', d = L.rows === 'enz' ? U.enz : U.prod, ks = Object.keys(d).filter(function (k) { return A.some(function (t) { return t[fld] === k; }) || (U.rowExtra || []).indexOf(k) >= 0; });      // rowExtra：額外的干擾選項
      A.forEach(function (s, i) { if (s[fld]) B.push({ id: 'r' + i, where: 'row', ans: s[fld], src: d, enFirst: true, opts: shuffle(ks), step: i, st: s }); }); }
  }
  (L.list || []).forEach(function (it, i) { var x = it[1]; B.push({ id: 'l' + i, where: 'row', li: i, desc: it[0], ans: x.a, lang: x.lang, src: x.src === 'enz' ? U.enz : U.dict, enFirst: x.src === 'enz', opts: shuffle(x.o) }); });
  (L.counts || []).forEach(function (c, i) { B.push({ id: 'c' + i, where: 'count', ans: c[1], label: c[0], opts: c[2] }); });
  if (L.kind === 'cloze') L.cloze.forEach(function (row, i) { row.forEach(function (x) { if (typeof x === 'object') B.push({ id: 'z' + i, where: 'cloze', ans: x.a, lang: x.lang, src: x.src === 'enz' ? U.enz : U.dict, enFirst: x.src === 'enz', opts: shuffle(x.o) }); }); });
  return B;
}
function label(b, v) { return b.src ? one(b.src[v], b.lang, b.enFirst) : v; }
/* 空格上看得到的字 */
function face(b) {
  var v = ST.ans[b.id] || '';
  if (b.where === 'node') { if (!v) return '<b style="font-size:17px">？</b>'; var L = two(b.src[v], b.lang, b.w);
    return '<b style="font-size:' + (fit(L[0], b.w - 8, L[1] ? 11.5 : 12.5) / .75).toFixed(1) + 'px">' + esc(L[0]) + '</b>' + (L[1] ? '<small style="font-size:' + (fit(L[1], b.w - 4, 10) / .75).toFixed(1) + 'px">' + esc(L[1]) + '</small>' : ''); }
  if (!v) return '<b class="muted" style="font-weight:400">請選擇</b>';
  if (b.where === 'row' || b.enFirst) { var R = two(b.src[v], b.lang); return '<b>' + esc(R[0]) + '</b>' + (R[1] ? '<small>' + esc(R[1]) + '</small>' : ''); }
  return '<b>' + esc(label(b, v)) + '</b>';
}
/* 空格的顏色：圖上的空格＝這個位置的碳數；圖下的空格＝選到的答案是哪一類
   （激酶與 ATP、GTP 橘色；去氫酶與 NADH 藍色；FADH₂ 紫色；NADPH 青色） */
function kind(e) { e = e || ''; return /NADPH/.test(e) ? 'tp' : /kinase|ATP|GTP|UTP/.test(e) ? 'tk' : /dehydrogenase|NADH/.test(e) ? 'td' : /FADH/.test(e) ? 'tf' : ''; }
function faceCls(b) {
  var v = ST.ans[b.id] || '', c = 'face';
  if (b.where === 'node' && b.c) c += ' k' + b.c;
  if (b.where === 'row' && b.li == null && v) c += ' ' + kind(b.src[v].en);
  return c;
}
function sel(b) {
  var v = ST.ans[b.id] || '';
  return '<span class="pick' + (v ? ' has' : '') + '"><span class="' + faceCls(b) + '">' + face(b) + '</span><select data-b="' + b.id + '" aria-label="空格"><option value="">' + (b.where === 'node' ? '？' : '請選擇') + '</option>' +
    b.opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(label(b, o)) + '</option>'; }).join('') + '</select></span>';
}

/* ---------- 一關的畫面 ---------- */
var KLAB = { enz: { tk: '激酶 kinase', td: '去氫酶 dehydrogenase' }, prod: { tk: 'ATP、GTP', td: 'NADH', tf: 'FADH₂', tp: 'NADPH' } };
function level() {
  var P = CUR, L = P.levels[LV], U = L.sub ? P.subs[L.sub] : P, n = P.levels.length; FORCE = L.force || null;
  if (!ST) ST = { blanks: buildBlanks(U, L), ans: {}, checked: false, shown: false };
  $('title').textContent = P.zh; $('subtitle').textContent = '第 ' + (LV + 1) + ' 關，共 ' + n + ' 關・' + L.t;
  $('back').hidden = false; seg();
  $('lv').hidden = false; $('lv').innerHTML = P.levels.map(function (_, i) { var d = isDone(P.id, i); return '<button type="button" data-i="' + i + '" class="' + (i === LV ? 'on' : '') + (d ? ' done' : '') + '" aria-label="第 ' + (i + 1) + ' 關' + (d ? '（已完成）' : '') + '">' + (i + 1) + (d ? ' ✓' : '') + '</button>'; }).join('');
  $('lv').querySelectorAll('button').forEach(function (b) { b.onclick = function () { open(P, +b.getAttribute('data-i')); }; });
  var on = $('lv').querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });

  var h = '<div class="card pad"><h2>' + esc(L.t) + '</h2>' + L.intro.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') + (L.tip ? '<div class="tip">' + fmt(esc(L.tip)) + '</div>' : '') + '</div>';
  var by = function (w) { return ST.blanks.filter(function (b) { return b.where === w; }); }, nodes = by('node'), rows = by('row').filter(function (b) { return b.li == null; }), lst = by('row').filter(function (b) { return b.li != null; }), cnt = by('count');
  var passed = ST.checked && !ST.shown && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; });
  var E = L.energy || (L.rows === 'prod' && (ST.shown || passed)) ? 'all' : L.carbon ? 'co2' : '';      // 算帳那一關：全對或看答案後，圖上才出現能量標籤
  var lgS = L.legend || (L.kind === 'map' && !L.plain ? U.nodes.map(function (n) { return n.c; }).concat(U.top ? [U.top.c] : []).filter(function (c, i, a) { return c && a.indexOf(c) === i; }).sort(function (a, b) { return b - a; }) : []);
  var lg = lgS.map(function (c) { return typeof c === 'object' ? '<span><i class="' + c[0] + '"></i>' + esc(c[1]) + '</span>' : '<span><i class="k' + c + '"></i>' + c + ' 碳</span>'; });      // 圖例：數字＝碳數；[樣式, 文字]＝自訂
  if (lg.length && (L.legendTitle || typeof lgS[0] !== 'object')) lg.unshift('<span>' + esc(L.legendTitle || '底色＝碳數') + '</span>');
  if (L.kind === 'map' && L.rows && allSteps(U).some(function (s) { return s.irr && asked(L, s); })) lg.push('<span><i class="irr">1</i>實心編號＝不可逆步驟</span>');
  if (L.kind === 'ov' || L.kind === 'map') { var H = L.kind === 'ov' ? L.h : mapH(U), fh = Math.round(PH() / .75);
    h += '<div class="card pad"><div class="dia" id="dia"><svg viewBox="0 0 360 ' + H + '" role="img" aria-label="' + esc(P.zh) + '路徑圖">' + (L.kind === 'ov' ? L.svg() : mapSvg(U, L, E)) + '</svg>' +
      nodes.map(function (b) { return '<span class="bk" data-k="' + b.id + '" style="left:' + (b.x / 360 * 100) + '%;top:' + (b.y / H * 100) + '%"><span style="display:block;width:' + Math.round(b.w / .75) + 'px;height:' + fh + 'px">' + sel(b) + '</span><i class="mk"></i></span>'; }).join('') + '</div>' +
      (lg.length ? '<div class="lgd">' + lg.join('') + '</div>' : '') + (nodes.length ? '<div class="small muted" style="text-align:center;margin-top:6px">點虛線框選答案</div>' : '') + '</div>'; }
  if (rows.length) { var seen = {}, kl = ''; rows[0].opts.forEach(function (o) { var k = kind(rows[0].src[o].en); if (k && !seen[k] && KLAB[L.rows][k]) { seen[k] = 1; } });
    ['tk', 'td', 'tf', 'tp'].forEach(function (k) { if (seen[k]) kl += '<span><i class="' + k + '"></i>' + KLAB[L.rows][k] + '</span>'; });
    h += '<div class="card pad"><h2>' + esc(L.rowsTitle || '') + '</h2>' + (kl ? '<div class="lgd" style="justify-content:flex-start;margin:0 0 4px">' + kl + '</div>' : '') + rows.map(function (b) { var s = b.st;
      var d = s.desc ? T(s.desc.zh, s.desc.en) : short(U.map[s.f]) + ' → ' + short(U.map[s.t]) + (s.also ? ' ＋ ' + short(U.map[s.also]) : '');
      return '<div class="st" data-k="' + b.id + '"><span class="n">' + (b.step + 1) + '</span><span class="d">' + esc(d) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>'; }
  if (lst.length) h += '<div class="card pad"><h2>' + esc(L.listTitle || '') + '</h2>' + lst.map(function (b) {
    return '<div class="st" data-k="' + b.id + '"><span class="n">' + (b.li + 1) + '</span><span class="d" style="font-size:14px;color:var(--ink)">' + fmt(esc(b.desc)) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (cnt.length) h += '<div class="card pad"><h2>' + esc(L.countsTitle || '') + '</h2>' + cnt.map(function (b) {
    return '<div class="st c" data-k="' + b.id + '"><span class="d">' + esc(b.label) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (L.kind === 'cloze') { var zb = by('cloze'); h += '<div class="card pad"><ol class="cz">' + L.cloze.map(function (row, i) {
    return '<li data-k="z' + i + '">' + row.map(function (x) { return typeof x === 'string' ? (x === '。' ? '' : esc(x)) : sel(zb[i]); }).join('') + '<div class="r"></div></li>'; }).join('') + '</ol></div>'; }
  h += '<div id="res"></div><div class="foot"><div class="row" id="acts"></div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.pick select').forEach(function (el) { el.onchange = function () {
    var id = el.getAttribute('data-b'), b = ST.blanks.filter(function (x) { return x.id === id; })[0];
    ST.ans[id] = el.value; el.parentNode.classList.toggle('has', !!el.value); var fe = el.parentNode.querySelector('.face'); fe.className = faceCls(b); fe.innerHTML = face(b);
    if (ST.checked) { ST.checked = false; clearMarks(); acts(); }
  }; });
  if (ST.shown) document.querySelectorAll('.pick select').forEach(function (el) { el.disabled = true; });
  scaleDia(); if (ST.checked) mark(); acts();
}
function scaleDia() { var d = $('dia'); if (d) d.style.setProperty('--s', (d.clientWidth / 360 * .75).toFixed(3)); }
window.addEventListener('resize', scaleDia);
function holder(b) { return document.querySelector('[data-k="' + b.id + '"]'); }
function clearMarks() {
  document.querySelectorAll('.pick').forEach(function (el) { el.classList.remove('ok', 'no'); });
  document.querySelectorAll('[data-k]').forEach(function (el) { el.classList.remove('ok', 'no'); var r = el.querySelector('.r'); if (r) r.textContent = ''; var m = el.querySelector('.mk'); if (m) m.textContent = ''; });
  $('res').innerHTML = '';
}
function mark() {
  var right = 0, total = ST.blanks.length, L = CUR.levels[LV];
  ST.blanks.forEach(function (b) {
    var v = ST.ans[b.id] || '', ok = v === b.ans, el = holder(b), s = el.querySelector('.pick');
    if (ok) right++;
    s.classList.remove('ok', 'no'); el.classList.remove('ok', 'no'); s.classList.add(ok ? 'ok' : 'no'); el.classList.add(ok ? 'ok' : 'no');
    var m = el.querySelector('.mk'); if (m) m.textContent = ok ? '✓' : '✕';
    var o = b.src && b.src[b.ans], zh = o && (b.lang || M()) === 'en' && o.zh !== (o.en || o.zh) ? o.zh : '';      // 用英文作答的空格，答對後補上中文
    var r = el.querySelector('.r'); if (r) r.textContent = ok ? '✓ 正確' + (zh ? '：' + zh : '') : (v ? '✕ 再想想' : '✕ 還沒填');
  });
  var all = right === total, last = LV === CUR.levels.length - 1;
  if (all && !ST.shown) { if (!SAVE.done[CUR.id]) SAVE.done[CUR.id] = {}; SAVE.done[CUR.id][LV] = 1; save(); var c = $('lv').querySelectorAll('button')[LV]; c.classList.add('done'); if (c.textContent.indexOf('✓') < 0) c.textContent += ' ✓'; }
  $('res').innerHTML = '<div class="res ' + (all ? 'ok' : 'bad') + '"><b>' + (ST.shown ? '這是正確答案' : all ? '全對！' : '答對 ' + right + ' ／ ' + total) + '</b>　' +
    (ST.shown ? '看熟之後按「重來」，自己再填一次才算過關。' : all ? (last ? '這個單元完成了。' : '可以進下一關了。') : '紅色的空格再改一次，改完再按「對答案」。') + '</div>' +
    (all && !ST.shown && L.done ? '<div class="card pad"><h2>記住這幾件事</h2><ul>' + L.done.map(function (t) { return '<li>' + fmt(esc(t)) + '</li>'; }).join('') + '</ul></div>' : '');
  return all;
}
function acts() {
  var last = LV === CUR.levels.length - 1, all = ST.checked && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; }) && !ST.shown, h = '';
  if (all) h = '<button type="button" class="btn plain" id="redo">重來</button><button type="button" class="btn" id="next">' + (last ? '回目錄' : '下一關') + '</button>';
  else if (ST.checked) h = '<button type="button" class="btn plain" id="' + (ST.shown ? 'redo' : 'show') + '">' + (ST.shown ? '重來' : '看正確答案') + '</button><button type="button" class="btn" id="chk"' + (ST.shown ? ' disabled' : '') + '>對答案</button>';
  else h = '<button type="button" class="btn" id="chk">對答案</button>';
  $('acts').innerHTML = h;
  if ($('chk')) $('chk').onclick = function () { ST.checked = true; var L = CUR.levels[LV]; if (L.rows === 'prod' && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; })) level(); else { mark(); acts(); } var r = $('res'); if (r.scrollIntoView) r.scrollIntoView({ block: 'nearest' }); };
  if ($('show')) $('show').onclick = function () { ST.shown = true; ST.blanks.forEach(function (b) { ST.ans[b.id] = b.ans; }); level(); };
  if ($('redo')) $('redo').onclick = function () { ST = null; level(); window.scrollTo(0, 0); };
  if ($('next')) $('next').onclick = function () { if (last) home(); else open(CUR, LV + 1); };
}

$('back').onclick = home;
$('lang').querySelectorAll('button').forEach(function (b) { b.onclick = function () { LANG = b.getAttribute('data-l'); SAVE.lang = LANG; save(); if (CUR) { var y = window.pageYOffset; level(); window.scrollTo(0, y); } else home(); }; });
(function () { var m = (location.search.match(/[?&]p=([a-z]+)/) || [])[1]; if (m && UNITS[m]) open(UNITS[m], firstTodo(UNITS[m])); else home(); })();
</script>
