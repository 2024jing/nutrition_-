<!DOCTYPE html>
<html lang="zh-Hant">

<title>圖解生理生化</title>
<style>
  :root {

  }

  .bk { position: absolute; transform: translate(-50%, -50%) scale(var(--s, .75)); transform-origin: center; }
  /* 空格：看得到的是 .face，真正的下拉選單透明地蓋在上面（字級 16px，iPhone 點選時畫面才不會自動放大） */

  .face::after { content: ""; position: absolute; right: 11px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  .face b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; } .face small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .pick.has .face { border-style: solid; background: var(--brand-soft); }

  .pick:focus-within .face { outline: 2px solid var(--brand); outline-offset: 2px; }
  .bk .pick { display: flex; width: 100%; height: 100%; }

  .bk .face::after { display: none; }

  .mk { position: absolute; right: -8px; top: -10px; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; font-size: 13px; font-weight: 700; font-style: normal; color: #fff; }

  .st { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }

  .cz { margin: 0; padding: 0; list-style: none; } .cz li { padding: 12px 0; border-top: 1px solid var(--line); line-height: 2; margin: 0; } .cz li:first-child { border-top: 0; }
  .cz .pick { margin: 3px 2px; } .cz .face { min-height: 36px; }

  .res.ok b { color: var(--ok); } .res.bad b { color: var(--bad); }

  /* 顏色的意思：名稱框的底色＝碳數；小標籤＝這一步花掉或產生什麼；實心編號＝不可逆步驟 */
  .dia rect.k6 { fill: var(--k6); stroke: var(--k6s); } .dia rect.k5 { fill: var(--k5); stroke: var(--k5s); } .dia rect.k4 { fill: var(--k4); stroke: var(--k4s); }
  .dia rect.k3 { fill: var(--k3); stroke: var(--k3s); } .dia rect.k2 { fill: var(--k2); stroke: var(--k2s); }
  .dia .num.irr circle { fill: var(--brand); } .dia .num.irr text { fill: var(--on-brand); }
  .dia .tag rect { stroke-width: 1.2; } .dia .tag text { fill: var(--on-tag); font-weight: 700; }
  .dia .tag.atp rect { fill: var(--e-atp); stroke: var(--e-atp); } .dia .tag.nadh rect { fill: var(--e-nadh); stroke: var(--e-nadh); } .dia .tag.fad rect { fill: var(--e-fad); stroke: var(--e-fad); }
  .dia .tag.co2 rect { fill: var(--e-co2); stroke: var(--e-co2); } .dia .tag.sp rect { fill: var(--card); stroke: var(--e-atp); } .dia .tag.sp text { fill: var(--w-k); }
  .dia .tag.spn rect { fill: var(--card); stroke: var(--e-nadh); } .dia .tag.spn text { fill: var(--w-d); }
  .dia .tag.nadph rect { fill: var(--k4s); stroke: var(--k4s); } .dia .tag.spp rect { fill: var(--card); stroke: var(--k4s); } .dia .tag.spp text { fill: var(--k4s); } .dia .tag.mol rect, .dia .tag.out rect { fill: var(--card); stroke: var(--muted); } .dia .tag.mol text, .dia .tag.out text { fill: var(--ink); }
  .dia text.nt { fill: var(--muted); }
  .pick .face.k6 { background: var(--k6); } .pick .face.k5 { background: var(--k5); } .pick .face.k4 { background: var(--k4); } .pick .face.k3 { background: var(--k3); } .pick .face.k2 { background: var(--k2); }
  .pick:not(.ok):not(.no) .face.k6 { border-color: var(--k6s); } .pick:not(.ok):not(.no) .face.k5 { border-color: var(--k5s); } .pick:not(.ok):not(.no) .face.k4 { border-color: var(--k4s); }
  .pick:not(.ok):not(.no) .face.k3 { border-color: var(--k3s); } .pick:not(.ok):not(.no) .face.k2 { border-color: var(--k2s); }
  .pick.no .face { border: 2px solid var(--bad); background: var(--bad-soft); }
  .face.tk { box-shadow: inset 6px 0 0 var(--e-atp); padding-left: 16px; } .face.td { box-shadow: inset 6px 0 0 var(--e-nadh); padding-left: 16px; } .face.tf { box-shadow: inset 6px 0 0 var(--e-fad); padding-left: 16px; } .face.tp { box-shadow: inset 6px 0 0 var(--k4s); padding-left: 16px; }
  .lgd { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .lgd span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lgd i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; font-style: normal; font-size: 9px; font-weight: 700; }
  .lgd i.k6 { background: var(--k6); border-color: var(--k6s); } .lgd i.k5 { background: var(--k5); border-color: var(--k5s); } .lgd i.k4 { background: var(--k4); border-color: var(--k4s); }
  .lgd i.k3 { background: var(--k3); border-color: var(--k3s); } .lgd i.k2 { background: var(--k2); border-color: var(--k2s); }
  .lgd i.irr { border-radius: 50%; background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .lgd i.tk { background: var(--e-atp); border-color: var(--e-atp); } .lgd i.td { background: var(--e-nadh); border-color: var(--e-nadh); } .lgd i.tf { background: var(--e-fad); border-color: var(--e-fad); } .lgd i.tp { background: var(--k4s); border-color: var(--k4s); }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }
  .wk { color: var(--w-k); font-weight: 700; } .wd { color: var(--w-d); font-weight: 700; }
  .glab.k6 { color: var(--k6s); } .glab.k5 { color: var(--k5s); } .glab.k4 { color: var(--k4s); } .glab.k3 { color: var(--k3s); } .glab.k2 { color: var(--k2s); }
  .item.k6 { border-left: 5px solid var(--k6s); } .item.k5 { border-left: 5px solid var(--k5s); } .item.k4 { border-left: 5px solid var(--k4s); } .item.k3 { border-left: 5px solid var(--k3s); } .item.k2 { border-left: 5px solid var(--k2s); }
  /* 分生：底色與線的顏色＝分子種類（DNA 藍、新合成的 DNA 青、RNA 玫瑰、蛋白質琥珀） */
  .dia rect.kD, .dia .kD { fill: var(--k5); stroke: var(--k5s); } .dia rect.kN, .dia .kN { fill: var(--k4); stroke: var(--k4s); } .dia rect.kR, .dia .kR { fill: var(--k3); stroke: var(--k3s); } .dia rect.kP, .dia .kP { fill: var(--k6); stroke: var(--k6s); }
  .pick .face.kD { background: var(--k5); } .pick .face.kN { background: var(--k4); } .pick .face.kR { background: var(--k3); } .pick .face.kP { background: var(--k6); }
  .pick:not(.ok):not(.no) .face.kD { border-color: var(--k5s); } .pick:not(.ok):not(.no) .face.kN { border-color: var(--k4s); } .pick:not(.ok):not(.no) .face.kR { border-color: var(--k3s); } .pick:not(.ok):not(.no) .face.kP { border-color: var(--k6s); }
  .lgd i.kD { background: var(--k5); border-color: var(--k5s); } .lgd i.kN { background: var(--k4); border-color: var(--k4s); } .lgd i.kR { background: var(--k3); border-color: var(--k3s); } .lgd i.kP { background: var(--k6); border-color: var(--k6s); }
  .lgd i.sD { background: var(--k5s); border-color: var(--k5s); } .lgd i.sN { background: var(--k4s); border-color: var(--k4s); } .lgd i.sR { background: var(--k3s); border-color: var(--k3s); } .lgd i.sP { background: var(--k6s); border-color: var(--k6s); }
  .glab.kD { color: var(--k5s); } .glab.kR { color: var(--k3s); } .glab.kP { color: var(--k6s); } .glab.kN { color: var(--k4s); }
  .item.kD { border-left: 5px solid var(--k5s); } .item.kR { border-left: 5px solid var(--k3s); } .item.kP { border-left: 5px solid var(--k6s); } .item.kN { border-left: 5px solid var(--k4s); }
  .wD { color: var(--k5s); font-weight: 700; } .wN { color: var(--k4s); font-weight: 700; } .wR { color: var(--k3s); font-weight: 700; } .wP { color: var(--w-k); font-weight: 700; }
  /* 生理：E＝興奮、交感、去極化（玫瑰）；I＝抑制、副交感、再極化（藍）；H＝激素、耗能（琥珀）；C＝鈣與第二傳訊者（紫）；T＝被動、水（青） */
  .dia rect.kE, .dia .kE { fill: var(--k3); stroke: var(--k3s); } .pick .face.kE { background: var(--k3); } .pick:not(.ok):not(.no) .face.kE { border-color: var(--k3s); } .lgd i.kE { background: var(--k3); border-color: var(--k3s); } .lgd i.sE { background: var(--k3s); border-color: var(--k3s); } .glab.kE { color: var(--k3s); } .item.kE { border-left: 5px solid var(--k3s); } .wE { color: var(--k3s); font-weight: 700; }
  .dia rect.kI, .dia .kI { fill: var(--k5); stroke: var(--k5s); } .pick .face.kI { background: var(--k5); } .pick:not(.ok):not(.no) .face.kI { border-color: var(--k5s); } .lgd i.kI { background: var(--k5); border-color: var(--k5s); } .lgd i.sI { background: var(--k5s); border-color: var(--k5s); } .glab.kI { color: var(--k5s); } .item.kI { border-left: 5px solid var(--k5s); } .wI { color: var(--k5s); font-weight: 700; }
  .dia rect.kH, .dia .kH { fill: var(--k6); stroke: var(--k6s); } .pick .face.kH { background: var(--k6); } .pick:not(.ok):not(.no) .face.kH { border-color: var(--k6s); } .lgd i.kH { background: var(--k6); border-color: var(--k6s); } .lgd i.sH { background: var(--k6s); border-color: var(--k6s); } .glab.kH { color: var(--k6s); } .item.kH { border-left: 5px solid var(--k6s); } .wH { color: var(--w-k); font-weight: 700; }
  .dia rect.kC, .dia .kC { fill: var(--k2); stroke: var(--k2s); } .pick .face.kC { background: var(--k2); } .pick:not(.ok):not(.no) .face.kC { border-color: var(--k2s); } .lgd i.kC { background: var(--k2); border-color: var(--k2s); } .lgd i.sC { background: var(--k2s); border-color: var(--k2s); } .glab.kC { color: var(--k2s); } .item.kC { border-left: 5px solid var(--k2s); } .wC { color: var(--k2s); font-weight: 700; }
  .dia rect.kT, .dia .kT { fill: var(--k4); stroke: var(--k4s); } .pick .face.kT { background: var(--k4); } .pick:not(.ok):not(.no) .face.kT { border-color: var(--k4s); } .lgd i.kT { background: var(--k4); border-color: var(--k4s); } .lgd i.sT { background: var(--k4s); border-color: var(--k4s); } .glab.kT { color: var(--k4s); } .item.kT { border-left: 5px solid var(--k4s); } .wT { color: var(--k4s); font-weight: 700; }
  /* 首頁的分頁 */
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); margin: 4px 0 0; }
  .tabs button { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--muted); }

    { t: '先看全貌：兩公尺的 DNA 怎麼收進細胞核', kind: 'map', sub: 'pack', plain: 1, blanks: ['dh', 'ns', 'f30'],
      intro: ['上一個單元說，遺傳訊息寫在 {D:DNA} 上。這個單元看的是「載體」本身長什麼樣子：一個單位是什麼、怎麼串成一條、兩條怎麼配成螺旋，最後怎麼收進細胞核。',
        '一個人體細胞的 DNA 拉直大約兩公尺，細胞核的直徑卻只有幾微米。能裝進去，是因為 DNA 一層一層地纏繞在{P:蛋白質}上。',
        '由小到大看一次，把中間的層次填出來。'],
      countsTitle: '雙螺旋（B 型）的幾個數字', counts: [['螺旋的直徑', '2 nm', ['0.34 nm', '2 nm', '10 nm', '30 nm']], ['轉一圈大約有幾個鹼基對', '10', ['3', '10', '20', '146']],

    { t: '核苷酸：三個零件怎麼接', kind: 'ov', h: 300, svg: NUC_NT,
      intro: ['核酸的單位是核苷酸（nucleotide），有三個零件。中間是五碳糖，糖上的碳從 1′ 編到 5′。',
        '鹼基接在 1′ 碳，磷酸接在 5′ 碳。只有「糖＋鹼基」、還沒接磷酸的叫核苷（nucleoside）；接上磷酸才是核苷酸。',
        '名字也跟著變：腺嘌呤（adenine，鹼基）→ 腺苷（adenosine，核苷）→ AMP、ADP、ATP（核苷酸）。所以 ATP 本身就是一個核苷酸。',

        ['把鹼基接在糖上的鍵', { a: 'gly', o: ['gly', 'pde', 'hb', 'pep'] }], ['把核苷酸一個一個串起來的鍵', { a: 'pde', o: ['gly', 'pde', 'hb', 'pep'] }],

      done: ['[[核苷＝糖＋鹼基；核苷酸＝糖＋鹼基＋磷酸。]]', '鹼基接 1′ 碳（N-醣苷鍵）、磷酸接 5′ 碳；核苷酸之間用 3′,5′-磷酸二酯鍵相連。',
        'DNA 的糖在 2′ 碳少一個氧（去氧核糖）。RNA 多了 2′-OH，在鹼性環境下容易自己斷掉，所以 RNA 比 DNA 不穩定。',
        'DNA 用 T、RNA 用 U。T 就是多一個甲基的 U（5-甲基尿嘧啶），這個甲基由葉酸提供，所以缺葉酸會影響 DNA 的合成。'] },
    { t: '雙螺旋：B、A、Z 三種型態', kind: 'list',
      intro: ['兩股 DNA 靠鹼基配對纏成螺旋。糖和磷酸組成的骨架帶負電、親水，在外側；鹼基疏水，一層一層疊在內側。',
        '把兩股維持在一起的力量有兩種：鹼基對之間的氫鍵，以及上下鹼基互相堆疊的疏水作用力。',
        '螺旋表面有兩條溝，一寬一窄。調控基因的蛋白質不必拉開雙股，從大凹溝就能「讀」到裡面的鹼基。',
        '細胞裡的 DNA 幾乎都是 Watson 和 Crick 描述的 B 型；另外還有兩種型態，考試常拿來比較。'],
      listTitle: '型態與構造',
      list: [['細胞內 DNA 最主要的型態', { a: 'fb', o: NUC_F }], ['唯一的左旋螺旋，骨架呈鋸齒狀', { a: 'fz', o: NUC_F }], ['水分少時出現；DNA-RNA 雜合體和雙股 RNA 也是這種型態', { a: 'fa', o: NUC_F }],
        ['容易出現在 G、C 交替重複的序列', { a: 'fz', o: NUC_F }], ['右旋，一圈約 10 個鹼基對', { a: 'fb', o: NUC_F }], ['右旋，一圈約 11 個鹼基對，比較短胖', { a: 'fa', o: NUC_F }],
        ['糖－磷酸骨架的位置', { a: 'out', o: ['out', 'ins'] }], ['鹼基對的位置', { a: 'ins', o: ['out', 'ins'] }], ['兩股的方向', { a: 'anti', o: ['anti', 'para'] }], ['B 型 DNA 的旋轉方向', { a: 'right', o: ['right', 'left'] }],
        ['蛋白質辨認特定鹼基序列，主要從哪裡', { a: 'major', o: ['major', 'minor'] }], ['鹼基對之間的鍵', { a: 'hb', o: ['hb', 'pde', 'gly', 'pep'] }], ['除了氫鍵，另一個穩定雙螺旋的主要力量', { a: 'stack', o: ['stack', 'ionic', 'pep'] }],
        ['骨架在生理 pH 下帶', { a: 'negc', o: ['posc', 'negc'] }]],
      done: ['[[B 型：右旋，細胞內最常見。A 型：右旋，較短胖，雙股 RNA 和 DNA-RNA 雜合體。Z 型：左旋，鋸齒狀，G-C 交替序列。]]',
        '骨架在外、鹼基在內；兩股反向平行。', '穩定雙螺旋的力量：氫鍵＋鹼基堆疊（疏水作用）。', '骨架帶負電，所以和 DNA 結合的蛋白質（例如組蛋白）多半帶正電。', '大凹溝露出的鹼基邊緣資訊比較多，轉錄因子多半從這裡辨認序列。'] },
    { t: '變性與復性：Tm 是什麼', kind: 'ov', h: 280, legend: [['sD', 'DNA 溶液對 260 nm 紫外光的吸收']], svg: NUC_TM,
      intro: ['把 DNA 溶液慢慢加熱，氫鍵斷開，雙股分成兩條單股，這叫變性（denaturation），也叫熔解。斷的只是兩股之間的氫鍵，每一股本身的磷酸二酯鍵沒有斷，所以序列不變。',
        '鹼基會吸收波長 260 nm 的紫外光。雙股時鹼基疊在裡面，吸得比較少；拉成單股後鹼基露出來，吸光值上升，這叫增色效應。所以量 260 nm 的吸光值，就知道拉開了多少。',
        '有一半的 DNA 被拉開時的溫度，叫做熔解溫度 Tm。溫度降回來，互補的兩股會重新配對，叫做復性或黏合（annealing）。PCR 和各種雜交技術都靠這個性質。'],
      blanks: [{ id: 'a', x: 102, y: 140, w: 96, c: 'D', a: 'ds', o: ['ds', 'ss'] }, { id: 'b', x: 284, y: 88, w: 96, c: 'D', a: 'ss', o: ['ds', 'ss'] }, { id: 'c', x: 190, y: 230, w: 156, a: 'tm', o: ['tm', 'topt', 'bp'] }],
      listTitle: '什麼會影響 Tm',
      list: [['G、C 的比例越高，Tm', { a: 'hi', o: ['hi', 'lo'] }], ['溶液裡的鹽（陽離子）濃度越高，Tm', { a: 'hi', o: ['hi', 'lo'] }], ['加入尿素、甲醯胺這類會破壞氫鍵的藥劑，Tm', { a: 'lo', o: ['hi', 'lo'] }],
        ['DNA 變性後，溶液在 260 nm 的吸光值', { a: 'up', o: ['up', 'down', 'same'] }], ['DNA 變性後，溶液的黏度', { a: 'down', o: ['up', 'down', 'same'] }], ['變性時沒有被破壞的是', { a: 'primary', o: ['primary', 'hb', 'stack'] }],
        ['核酸吸收最強的波長', { a: 'nm260', o: ['nm260', 'nm280', 'nm340'] }], ['蛋白質吸收最強的波長（色胺酸、酪胺酸）', { a: 'nm280', o: ['nm260', 'nm280', 'nm340'] }]],
      done: ['[[Tm：一半的 DNA 變成單股時的溫度。G-C 越多、鹽濃度越高，Tm 越高。]]', 'G-C 有三個氫鍵、堆疊也比較穩；陽離子可以中和骨架上磷酸的負電，減少兩股互相排斥。',
        '變性 → 260 nm 吸光值上升（增色效應）、黏度下降；一級結構不變。', '核酸看 260 nm，蛋白質看 280 nm。A260/A280 大約 1.8 表示 DNA 純度好，比值偏低表示混有蛋白質。'] },
    { t: '超螺旋與拓撲異構酶', kind: 'list',
      intro: ['電話線本身是一條螺旋，整條線還會再扭成一圈一圈，那就是超螺旋（supercoil）。DNA 也一樣：雙螺旋本身可以再扭轉。',
        '細胞裡的 DNA 大多是負超螺旋，也就是纏得比標準的鬆一點，這樣要複製或轉錄時比較容易打開。',
        '複製叉往前解開雙股時，前方會越纏越緊。負責「切開、放鬆、再接回去」的酵素叫拓撲異構酶（topoisomerase）。細胞沒有它就不能複製，所以它是抗生素和抗癌藥的好目標。'],
      listTitle: '兩型的差別與抑制它們的藥',
      list: [['一次切斷幾股：第一型', { a: 'one', o: ['one', 'two'] }], ['一次切斷幾股：第二型', { a: 'two', o: ['one', 'two'] }], ['第一型需不需要 ATP', { a: 'noneed', o: ['need', 'noneed'] }], ['第二型需不需要 ATP', { a: 'need', o: ['need', 'noneed'] }],
        ['細菌特有、能主動加入負超螺旋的酵素', { a: 'gyr', o: NUC_T }], ['細胞內 DNA 平常的狀態', { a: 'neg', o: ['neg', 'pos', 'relax'] }],
        ['抑制細菌的 DNA 旋轉酶，當抗生素用', { a: 'quin', o: NUC_DR }], ['抑制人類第一型拓撲異構酶，治療大腸癌、卵巢癌', { a: 'campt', o: NUC_DR }], ['抑制人類第二型拓撲異構酶的抗癌藥', { a: 'doxo', o: NUC_DR }],
        ['不是拓撲異構酶抑制劑，而是抑制細菌的 RNA 聚合酶', { a: 'rifa', o: NUC_DR }]],
      done: ['[[第一型：切一股、不用 ATP。第二型：切兩股、要 ATP。細菌的 DNA 旋轉酶（gyrase）屬於第二型。]]',
        '喹諾酮類抗生素（ciprofloxacin、nalidixic acid）抑制細菌的 DNA 旋轉酶和第四型拓撲異構酶，不影響人的酵素。',
        '抗癌藥：喜樹鹼類（irinotecan、topotecan）抑制人的第一型；doxorubicin（小紅莓）、etoposide 抑制人的第二型。它們讓 DNA 切開後接不回去，分裂快的細胞先死。', '抗生素要選「細菌有、人沒有或不一樣」的目標：細菌的 DNA 旋轉酶、細菌的 RNA 聚合酶、細菌的 70S 核糖體都是。'] },
    { t: 'RNA 的種類', kind: 'list',
      intro: ['{R:RNA} 多半是單股，但會自己折回來，局部配對成髮夾狀，所以 RNA 也有立體構造，有的甚至能當酵素用。',
        '直接參與做蛋白質的有三種：mRNA 帶著訊息，tRNA 帶著胺基酸，rRNA 是核糖體的骨幹。其中 rRNA 的量最多，大約占細胞 RNA 的八成。',
        '另外有幾種不做蛋白質的小 RNA，專門管加工和調控。'],
      listTitle: '這是哪一種 RNA',
      list: [['帶著 DNA 的訊息到核糖體，決定胺基酸的順序', { a: 'mrna', o: NUC_R }], ['一頭有反密碼子、一頭接胺基酸；最小，約 75 到 90 個核苷酸', { a: 'trna', o: NUC_R }], ['細胞裡含量最多；和蛋白質組成核糖體', { a: 'rrna', o: NUC_R }],
        ['在細胞核裡組成剪接體，把插入子剪掉', { a: 'snrna', o: NUC_R }], ['約 22 個核苷酸，和 mRNA 配對後抑制轉譯或促使它被分解', { a: 'mirna', o: NUC_R }],
        ['催化肽鍵形成的肽基轉移酶，其實是哪一種 RNA', { a: 'rrna', o: NUC_R }]],
      countsTitle: 'rRNA 的種類', counts: [['原核細胞的 rRNA', '5S、16S、23S', ['5S、16S、23S', '5S、5.8S、18S、28S', '30S、50S']], ['真核細胞的 rRNA', '5S、5.8S、18S、28S', ['5S、16S、23S', '5S、5.8S、18S、28S', '40S、60S']]],
      done: ['[[mRNA 傳訊息、tRNA 送胺基酸、rRNA 組成核糖體（量最多）。]]', '有催化能力的 RNA 叫核酸酵素（ribozyme）。核糖體裡接肽鍵的是 rRNA（原核 23S、真核 28S），不是蛋白質。',
        '真核細胞三種 RNA 聚合酶的分工：I 做大部分的 rRNA，II 做 mRNA（和 miRNA、多數 snRNA），III 做 tRNA 和 5S rRNA。', 'S 是沉降係數，不能直接相加：30S＋50S＝70S，40S＋60S＝80S。'] },
    { t: '染色質：核小體與組蛋白', kind: 'ov', h: 300, legend: [['sD', 'DNA'], ['kP', '組蛋白']], svg: NUC_BEAD,
      intro: ['真核細胞的 {D:DNA} 繞在一種叫{P:組蛋白}（histone）的蛋白質上。繞好的一個單位叫核小體（nucleosome），在電子顯微鏡下像一串珠子。',
        'DNA 的骨架帶負電，所以組蛋白要帶正電才抓得住它：組蛋白含有很多離胺酸和精胺酸這兩種鹼性胺基酸。',
        '每顆珠子的核心是八個組蛋白：H2A、H2B、H3、H4 各兩個。第五種組蛋白 H1 不在核心裡，它扣在 DNA 進出珠子的地方，並幫忙把珠子再捲成 30 nm 纖維。'],
      blanks: [{ id: 'a', x: 262, y: 176, w: 170, c: 'P', a: 'oct', o: ['oct', 'tet', 'ribo'] }, { id: 'b', x: 262, y: 222, w: 170, c: 'D', a: 'bp146', o: ['bp146', 'bp10', 'bp3000'] }, { id: 'c', x: 262, y: 268, w: 170, c: 'P', a: 'h1', o: ['h1', 'h3', 'h2a', 'h4'] }],
      listTitle: '組蛋白與染色質',
      list: [['組蛋白含量特別多的胺基酸', { a: 'lysarg', o: ['lysarg', 'aspglu', 'leuval'] }], ['所以組蛋白在生理 pH 下帶', { a: 'posc', o: ['posc', 'negc'] }], ['不屬於核小體核心的組蛋白', { a: 'h1', o: ['h1', 'h3', 'h2a', 'h4'] }],
        ['纏得鬆、基因可以被轉錄的染色質', { a: 'eu', o: ['eu', 'het'] }], ['纏得緊、基因不表現的染色質', { a: 'het', o: ['eu', 'het'] }],
        ['組蛋白尾巴的離胺酸被乙醯化後，正電被中和，染色質變', { a: 'eu', o: ['eu', 'het'] }], ['染色體上讓紡錘絲附著的位置', { a: 'cen', o: ['cen', 'telo', 'ori'] }], ['線狀染色體兩端的重複序列', { a: 'telo', o: ['cen', 'telo', 'ori'] }]],
      done: ['[[核小體＝組蛋白八聚體（H2A、H2B、H3、H4 各兩個）＋繞在外面約 146 個鹼基對的 DNA。H1 是連結組蛋白。]]', '組蛋白富含離胺酸（Lys）和精胺酸（Arg），帶正電，和帶負電的 DNA 結合。',
        '組蛋白乙醯化 → 染色質鬆開 → 基因容易被轉錄；去乙醯化則相反。這是後面「基因表現的調控」的重點。', '真染色質鬆、有活性；異染色質緊、沒有活性。'] },
    { t: '怎麼知道遺傳物質是 DNA', kind: 'list',
      intro: ['二十世紀前半，多數人以為遺傳物質是蛋白質，因為蛋白質有二十種胺基酸，看起來比只有四種鹼基的 DNA 複雜。幾個實驗改變了這個看法。',
        'Griffith 發現，把殺死的致病型肺炎鏈球菌和活的無害型混在一起，無害型會變成致病型，他稱為轉形（transformation），但不知道是什麼物質造成的。',
        'Avery 等人把死菌的成分一一去除，發現只有把 DNA 分解掉，轉形才會消失。',
        'Hershey 和 Chase 用放射性同位素分別標記噬菌體的 DNA 和蛋白質外殼，看哪一個進到細菌裡。磷只在 DNA 裡有，硫只在蛋白質裡有。'],
      listTitle: '誰做了什麼',
      list: [['發現「轉形」現象，但還不知道轉形物質是什麼', { a: 'grif', o: NUC_X }], ['用酵素一一去除，證明轉形物質是 DNA', { a: 'avery', o: NUC_X }], ['用同位素標記噬菌體，證明進入細菌的是 DNA', { a: 'hc', o: NUC_X }],
        ['A 的量等於 T，G 的量等於 C', { a: 'charg', o: NUC_X }], ['提出 DNA 的雙螺旋模型', { a: 'wc', o: NUC_X }],
        ['Hershey 和 Chase 的實驗中，跟著進入細菌的同位素是', { a: 'p32', o: ['p32', 's35', 'n15', 'c14'] }], ['留在細菌外面的同位素是', { a: 's35', o: ['p32', 's35', 'n15', 'c14'] }]],
      done: ['Griffith：轉形。Avery：轉形物質是 DNA。Hershey 和 Chase：³²P（DNA）進入細菌，³⁵S（蛋白質）留在外面。',

  levels: [
    { t: '先看全貌：損傷不一定變成突變', kind: 'map', sub: 'ner', plain: 1, blanks: ['cut', 'pol', 'lig'],
      intro: ['DNA 複製的準確度很高，但 {D:DNA} 每天還是不斷受傷：複製時偶爾放錯鹼基、鹼基自己掉下來或起化學變化、紫外線和化學物質的破壞。一個細胞一天有上萬處損傷。',
        '<b>損傷（damage）不等於突變（mutation）。</b>損傷是 DNA 的構造壞了，還修得回來；如果沒修好就拿去複製，錯誤被抄進新的一股，兩股都「正確地」配對了，細胞再也認不出哪裡有錯，這才是永久的突變。',
        '所以細胞有好幾套修補系統。多數系統的邏輯一樣，都利用「DNA 有兩股」這件事：<b>認出壞的地方 → 把壞的那一段切掉 → 照著另一股補回來 → 封口</b>。',
        '下面用修補紫外線損傷的過程當例子，把步驟填出來。後面的關卡會再細看每一套系統。'],
      listTitle: '修補的四個動作各由誰做',
      list: [['把受損的片段切下來', { a: 'uvrabc', o: ['uvrabc', 'pol', 'lig', 'photo'], src: 'enz' }], ['照著完好的那一股，把缺口補上', { a: 'pol', o: ['uvrabc', 'pol', 'lig', 'photo'], src: 'enz' }], ['把最後的切口接起來', { a: 'lig', o: ['uvrabc', 'pol', 'lig', 'photo'], src: 'enz' }],
        ['損傷沒修好、又經過複製，結果是', { a: 'mutation', o: ['repair', 'mutation'] }], ['損傷太嚴重修不了，細胞通常會啟動', { a: 'apop', o: ['apop', 'repair'] }]],
      done: ['[[損傷可以修；沒修好又被複製，才變成永久的突變。]]', '修補的共同邏輯：認出 → 切掉 → 照另一股補上（DNA 聚合酶）→ 封口（DNA 連接酶）。雙股的好處就是永遠有一份備份。',
        '突變發生在體細胞可能致癌；發生在生殖細胞才會傳給下一代。修補系統有缺陷的人，癌症風險特別高。'] },
    { t: '點突變：改一個鹼基的四種結果', kind: 'ov', h: 268, legend: [['kD', 'DNA 的編碼股']], svg: MUT_PT,
      intro: ['只改變一個（或少數幾個）鹼基的突變叫點突變。嘌呤換嘌呤、嘧啶換嘧啶叫轉換（transition）；嘌呤和嘧啶互換叫顛換（transversion）。',
        '同樣是換一個鹼基，對蛋白質的影響可以差很多，要看它把密碼子改成什麼。',
        '圖上用同一個密碼子 GAG（麩胺酸）做四種改變，判斷各是哪一種突變。'],
      blanks: [{ id: 'a', x: 262, y: 100, w: 170, a: 'sil', o: MUT_K }, { id: 'b', x: 262, y: 146, w: 170, a: 'mis', o: MUT_K }, { id: 'c', x: 262, y: 192, w: 170, a: 'non', o: MUT_K }, { id: 'd', x: 262, y: 238, w: 170, a: 'fs', o: MUT_K }],
      listTitle: '再想一下',
      list: [['A 換成 G（嘌呤換嘌呤）', { a: 'ts', o: ['ts', 'tv'] }], ['A 換成 T（嘌呤換嘧啶）', { a: 'tv', o: ['ts', 'tv'] }], ['蛋白質提早結束、變短，通常沒有功能', { a: 'non', o: MUT_K }],
        ['密碼子的第三個鹼基改變，最常見的結果', { a: 'sil', o: MUT_K }], ['插入或缺失的鹼基數是多少時，會造成框移', { a: 'notthree', o: ['three', 'notthree'] }], ['整段基因缺失、完全做不出產物', { a: 'nul', o: ['nul', 'sil', 'mis'] }]],
      done: ['[[靜默：胺基酸不變。誤義：換成另一個胺基酸。無義：變成終止密碼子。框移：插入或缺失的數目不是 3 的倍數，後面全部讀錯。]]',
        '密碼子有簡併性，第三個鹼基改變常常還是同一個胺基酸，所以多半是靜默突變。', '轉換：嘌呤 ↔ 嘌呤、嘧啶 ↔ 嘧啶。顛換：嘌呤 ↔ 嘧啶。'] },
    { t: '兩種血紅素的遺傳病', kind: 'cloze',
      intro: ['國考最愛用血紅素當突變的例子，而且會把兩種病混在一起考。',
        '<b>鐮刀型貧血</b>是「質」的問題：β 球蛋白基因一個鹼基改變（GAG → GTG），第 6 個胺基酸由帶負電的麩胺酸換成疏水的纈胺酸。血紅素放掉氧之後，表面多出來的疏水點讓分子一個黏一個，聚成長纖維，把紅血球撐成鐮刀狀。',
        '<b>地中海型貧血</b>是「量」的問題：α 或 β 球蛋白鏈做得太少或做不出來。紅血球變小、顏色變淡，但不是鐮刀狀。'],
      cloze: [['鐮刀型貧血是哪一種蛋白質異常？', { a: 'hb', o: ['hb', 'alb', 'ifac', 'crp'] }, '。'],
        ['突變發生在血紅素的', { a: 'bchain', o: ['bchain', 'achain'] }, '。'],
        ['是這條鏈的', { a: 'p6', o: ['p1', 'p6', 'p26'] }, '胺基酸改變。'],
        ['原本的胺基酸是', { a: 'glu', o: ['glu', 'val', 'lys', 'gly'] }, '。'],
        ['被換成', { a: 'val', o: ['glu', 'val', 'lys', 'gly'] }, '。'],
        ['這屬於哪一種點突變？', { a: 'mis', o: MUT_K }, '。'],
        ['異常的血紅素在什麼時候聚合？', { a: 'deoxy', o: ['deoxy', 'oxy'] }, '，所以登高山或劇烈運動時容易發作。'],
        ['只帶一個突變基因的人，對哪一種傳染病比較有抵抗力？', { a: 'malaria', o: ['malaria', 'tb'] }, '。'],
        ['地中海型貧血的問題是球蛋白鏈', { a: 'quan', o: ['qual', 'quan'] }, '。'],
        ['地中海型貧血的紅血球型態是', { a: 'micro', o: ['micro', 'macro', 'sickshape'] }, '。'],
        ['紅血球變長、變薄、呈鐮刀狀的是', { a: 'sickle', o: ['sickle', 'thal', 'perni'] }, '。']],
      done: ['[[鐮刀型貧血：血紅素 β 鏈第 6 個胺基酸，麩胺酸（Glu）→ 纈胺酸（Val），誤義突變。]]', '地中海型貧血分 α 型和 β 型，是球蛋白鏈製造量不足；紅血球是小球性、低色素性，不是鐮刀狀。國考拿這一點當錯誤選項。',
        '地中海型貧血的突變種類很多：α 型多半是整個基因缺失，β 型多半是點突變（無義、框移或影響剪接）。', '地中海型貧血和缺鐵性貧血的紅血球都是小球性，但前者不缺鐵，不可以隨便補鐵。'] },
    { t: '誘變劑：誰造成哪一種損傷', kind: 'list',
      intro: ['會提高突變率的因子叫誘變劑（mutagen），很多誘變劑同時是致癌物。先分兩大類：細胞自己代謝產生的，和外來的。',
        '細胞自己就會出的狀況：複製時放錯鹼基；鹼基自己從糖上掉下來（去嘌呤）；胞嘧啶自己掉了胺基變成尿嘧啶（去胺）；代謝產生的活性氧把鹼基氧化。',
        '外來的有物理性的（紫外線、游離輻射）和化學性的（亞硝酸、烷化劑、黃麴毒素等）。'],
      listTitle: '最典型的損傷是什麼',
      list: [['紫外線', { a: 'dimer', o: MUT_L }], ['X 光、γ 射線', { a: 'dsb', o: MUT_L }], ['亞硝酸', { a: 'deam', o: MUT_L }], ['烷化劑', { a: 'o6', o: MUT_L }], ['活性氧（自由基）', { a: 'oxo', o: MUT_L }],
        ['黃麴毒素 B1（接在鳥嘌呤上）', { a: 'addu', o: MUT_L }], ['嵌入劑（夾在鹼基對之間）', { a: 'indel', o: MUT_L }],
        ['胞嘧啶（C）去胺後變成', { a: 'ura', o: ['ura', 'thy', 'hx'] }], ['5-甲基胞嘧啶去胺後變成', { a: 'thy', o: ['ura', 'thy', 'hx'] }], ['黃麴毒素 B1 最相關的癌症', { a: 'liver', o: ['liver', 'skin', 'colon', 'leuk'] }]],
      done: ['[[紫外線 → 相鄰的兩個嘧啶以共價鍵接在一起，形成嘧啶二聚體（最常見的是胸腺嘧啶二聚體）。]]', '游離輻射能量高，可以直接打斷 DNA 的股，也會產生自由基。',
        '胞嘧啶去胺變成尿嘧啶。DNA 用 T 不用 U，細胞才分得出「這個 U 是壞掉的 C」。5-甲基胞嘧啶去胺變成 T，就不容易被發現，所以是突變的熱點。',
        '黃麴毒素由黃麴黴產生，常見於儲存不當的花生、玉米和穀類，耐熱，一般烹調破壞不了；在肝臟被活化後接到 DNA 的鳥嘌呤上，和肝癌有關。食品安全常考。',
        '醃漬、加工肉品裡的亞硝酸鹽可以和胺類形成亞硝胺，是烷化劑的來源之一。'] },
    { t: '第一道防線：校對與錯誤配對修補', kind: 'list',
      intro: ['複製時放錯鹼基，有兩次機會改回來。',
        '第一次是當場改：DNA 聚合酶發現剛接上去的核苷酸配不起來，就倒退一步，用自己的 3′→5′ 核酸外切酶活性把它切掉重放。這叫校對（proofreading）。',
        '漏網的由錯誤配對修補（mismatch repair）處理。難題是：兩個鹼基都是正常的鹼基，只是配錯了，要切哪一個？答案是切「新合成的那一股」，因為模板股才是原稿。',
        '大腸桿菌用甲基來分辨：舊股上的 GATC 序列已經被甲基化，新股剛做好還沒有。MutS 認出配錯的地方，MutL 把 MutS 和 MutH 連起來，MutH 在沒有甲基的新股上切一刀。'],
      listTitle: '誰負責什麼',
      list: [['DNA 聚合酶用來校對的活性', { a: 'exo35', o: ['exo35', 'exo53', 'lig'], src: 'enz' }], ['認出配錯的鹼基', { a: 'muts', o: ['muts', 'mutl', 'muth'], src: 'enz' }], ['在新股的 GATC 切開一刀', { a: 'muth', o: ['muts', 'mutl', 'muth'], src: 'enz' }],
        ['把另外兩個蛋白質連在一起', { a: 'mutl', o: ['muts', 'mutl', 'muth'], src: 'enz' }], ['錯誤配對修補切掉的是', { a: 'newst', o: ['newst', 'oldst'] }], ['大腸桿菌分辨新股和舊股，靠的是', { a: 'meth', o: ['meth', 'len'] }],
        ['人類這套系統的基因（MSH2、MLH1）有缺陷，會得', { a: 'lynch', o: MUT_D }]],
      done: ['[[校對：DNA 聚合酶的 3′→5′ 核酸外切酶。錯誤配對修補：MutS 認、MutL 連、MutH 切新股。]]', '聚合酶本身大約每十萬個鹼基錯一個；加上校對和錯誤配對修補，最後大約每十億個才錯一個。',
        '人類的錯誤配對修補基因有缺陷 → 遺傳性非瘜肉性大腸癌（Lynch 症候群）。'] },
    { t: '切除修補一：鹼基切除修補', kind: 'map', sub: 'ber', plain: 1, blanks: ['gly', 'ape', 'pol', 'lig'],
      intro: ['切除修補有兩種，名字很像，差別在「切多大」。',
        '<b>鹼基切除修補（base excision repair）</b>處理小毛病：單一個鹼基被氧化、烷化、去胺，或是掉了。螺旋的形狀沒有明顯改變。',
        '做法是先由專門的 DNA 醣苷酶把壞的鹼基從糖上切下來，留下一個沒有鹼基的位置（AP 位），再把骨架切開、補上、封口。每一種壞鹼基有自己的醣苷酶，例如尿嘧啶-DNA 醣苷酶專門找 DNA 上的 U。'],
      listTitle: '適不適用這一套',
      list: [['胞嘧啶去胺變成的尿嘧啶', { a: 'ber', o: ['ber', 'ner', 'mmr'] }], ['活性氧造成的 8-氧鳥嘌呤', { a: 'ber', o: ['ber', 'ner', 'mmr'] }], ['紫外線造成的嘧啶二聚體', { a: 'ner', o: ['ber', 'ner', 'mmr'] }],
        ['複製時放錯、但鹼基本身正常的配對', { a: 'mmr', o: ['ber', 'ner', 'mmr'] }], ['這條路徑第一個上場的酵素', { a: 'glyc', o: ['glyc', 'ape', 'uvrabc'], src: 'enz' }]],
      done: ['[[鹼基切除修補：DNA 醣苷酶 → AP 核酸內切酶 → DNA 聚合酶 → DNA 連接酶。]]對象是單一個受損的鹼基。', 'AP 是 apurinic／apyrimidinic 的縮寫，意思是「沒有嘌呤或沒有嘧啶」的位置。'] },
    { t: '切除修補二：核苷酸切除修補', kind: 'map', sub: 'ner', plain: 1, blanks: ['rec', 'cut', 'hel', 'pol'],
      intro: ['<b>核苷酸切除修補（nucleotide excision repair）</b>處理大毛病：嘧啶二聚體、黃麴毒素這類大型加成物，共同點是讓雙螺旋變形。它不認特定的鹼基，認的是「形狀不對」。',
        '做法是在損傷的兩側各切一刀，把一小段單股（細菌約 12 到 13 個核苷酸，人類約 24 到 32 個）整段拿掉，再補上、封口。',
        '大腸桿菌負責的是 UvrA、UvrB、UvrC，合稱 ABC 切除核酸酶（excinuclease）。考題出現「ABC excinuclease」，答案就是核苷酸切除修補。'],
      listTitle: '相關的考點',
      list: [['ABC excinuclease 參與的修補', { a: 'ner', o: ['ber', 'mmr', 'ner', 'sos'] }], ['人類這套系統有遺傳缺陷，對陽光極度敏感、容易得皮膚癌', { a: 'xp', o: MUT_D }],
        ['用可見光的能量直接把嘧啶二聚體打開的酵素（人類沒有）', { a: 'photo', o: ['photo', 'mgmt', 'glyc'], src: 'enz' }], ['直接把鳥嘌呤上的甲基拿走的酵素', { a: 'mgmt', o: ['photo', 'mgmt', 'glyc'], src: 'enz' }],

    { t: '先看全貌：轉錄的四件事', kind: 'ov', h: 236, legend: [['sD', 'DNA'], ['sR', '新合成的 RNA'], ['kP', 'RNA 聚合酶']], svg: TRC_BUB,
      intro: ['轉錄（transcription）是把 {D:DNA} 上某一段基因的訊息抄成 {R:RNA}。和複製最大的不同：複製是整套 DNA 全部抄一次；轉錄只抄當下需要的基因，而且只用兩股中的一股當模板。',

    { t: '啟動子：轉錄從哪裡開始', kind: 'ov', h: 176, legend: [['kD', 'DNA 上的調控序列'], ['kR', '會被抄成 RNA 的區域']], svg: TRC_GENE,

        '位置的講法：RNA 第一個核苷酸對應的位置叫 +1（轉錄起始點）。往基因前面是上游，編號是負的；往後是下游，編號是正的。',
        '真核基因的啟動子裡最有名的是 −25 附近的 TATA 盒，再往上游還有 CCAAT 盒、GC 盒等。更遠的地方還有促進子（enhancer），可以離基因幾千個鹼基對，正著放反著放都有效。',

        '促進子（enhancer）沒有方向和距離的限制；DNA 可以彎成一個環，讓遠處的促進子靠到啟動子旁邊。靜止子（silencer）則是抑制。',

    { t: '真核細胞的三種 RNA 聚合酶', kind: 'list',

        '<b>I</b> 在核仁，做大部分的 rRNA（先做成一條 45S 的前驅物，再切成 18S、5.8S、28S）。<b>II</b> 在核質，做 mRNA 的前驅物，也做 miRNA 和多數 snRNA。<b>III</b> 在核質，做 tRNA、5S rRNA 和其他小 RNA。',
        '毒菇（毒鵝膏）的 α-瓢蕈素可以用來分辨這三種酵素：II 最怕，很低的濃度就被抑制；III 要高濃度；I 不受影響。吃到毒菇會肝衰竭，就是因為 mRNA 做不出來。'],

        'rifampin 抑制細菌的 RNA 聚合酶，不影響人的；放線菌素 D 夾在 DNA 裡，兩邊都抑制，所以只能當抗癌藥。', '國考的錯誤選項：把「I 做小分子 RNA」、「III 做主要的 rRNA」寫反。'] },
    { t: '起始：一般轉錄因子怎麼把聚合酶請上來', kind: 'map', sub: 'pic', plain: 1, blanks: ['d', 'f', 'eh', 'ctd'],
      intro: ['真核的 RNA 聚合酶自己認不出啟動子，要靠一群蛋白質先到位，再把它請上來。這群每個基因都要用到的蛋白質叫一般轉錄因子，幫聚合酶 II 的就叫 TFII，後面再加字母。',

/* 前驅 mRNA → 成熟 mRNA */
function RNP_OV() {

      intro: ['肝細胞和神經細胞的 DNA 一模一樣，卻長得完全不同，因為它們打開的基因不一樣。「基因表現」指的是一個基因最後做出多少有功能的產物；調控它，就是決定哪些基因開、開多大。',
        '從 DNA 到有功能的蛋白質有好幾個步驟，每一步都可以管。圖上由上到下就是這幾層。',
        '其中最重要的是<b>轉錄的起始</b>：在最源頭就決定要不要抄，最不浪費。真核細胞還多了一層細菌沒有的：DNA 纏在組蛋白上，要先鬆開才抄得到。',
        '有些基因每個細胞隨時都要用（例如糖解作用的酵素），一直開著，叫管家基因；有些只在特定組織、特定時候才開。'],
      listTitle: '先確認觀念',
      list: [['調控基因表現最主要、最省資源的一層', { a: 'trcinit', o: ['trcinit', 'trlinit', 'degr'] }], ['每個細胞隨時都在表現的基因', { a: 'consti', o: ['consti', 'induc'] }], ['同一個人的肝細胞和神經細胞，DNA 序列', { a: 'samedna', o: ['samedna', 'diffdna'] }],
        ['不改變 DNA 序列，卻能改變基因表現、而且細胞分裂後還記得', { a: 'epi', o: ['epi', 'mutat'] }]],
      done: ['[[基因表現可以在染色質、轉錄起始、RNA 加工、mRNA 穩定度與轉譯、蛋白質修飾與分解各層調控；最主要的是轉錄起始。]]', '表觀遺傳（epigenetics）：不改變鹼基序列的可遺傳改變，主要是 DNA 甲基化和組蛋白修飾。',
        '營養素也是訊號：脂肪酸、膽固醇、葡萄糖、維生素 A 和 D、鐵，都會直接或間接改變基因表現。這是「營養基因體學」的基礎。'] },
    { t: '轉錄因子怎麼把基因打開', kind: 'ov', h: 236, legend: [['sD', 'DNA'], ['kP', '蛋白質'], ['sR', 'RNA']], svg: REG_LOOP,
      intro: ['上一個單元說，一般轉錄因子加上 RNA 聚合酶 II 只能做到很低的基本量。要把基因開大，需要另一群蛋白質，叫特異性轉錄因子。其中幫忙打開的叫活化蛋白，幫忙關掉的叫抑制蛋白。',
        '活化蛋白結合的 DNA 序列（促進子）可能離基因很遠。它碰得到啟動子，是因為中間的 DNA 彎成一個環。',
        '活化蛋白通常不直接碰聚合酶，而是透過中間的輔助活化因子（最主要的一組叫媒介子，Mediator）把訊息傳過去；有的輔助活化因子本身就是組蛋白乙醯轉移酶，順便把染色質鬆開。',
        '轉錄因子是「模組化」的蛋白質：一個區域負責認 DNA（DNA 結合區），另一個區域負責把基因打開（活化區），很多還有一個區域用來兩兩配對（二聚化區）。'],
      blanks: [],
      listTitle: '圖上的編號與模組',
      list: [['1：活化蛋白結合的 DNA 序列', { a: 'enh', o: REG_L }], ['2：結合在這段序列上的蛋白質', { a: 'act', o: REG_L }], ['3：夾在中間傳話的蛋白質', { a: 'coact', o: REG_L }], ['4：停在啟動子上的一組', { a: 'pol2', o: REG_L }],
        ['轉錄因子上負責辨認 DNA 序列的區域', { a: 'dbd', o: ['dbd', 'ad', 'dimer', 'lbd'] }], ['負責和其他蛋白質作用、促進轉錄的區域', { a: 'ad', o: ['dbd', 'ad', 'dimer', 'lbd'] }], ['激素受器上讓激素結合的區域', { a: 'lbd', o: ['dbd', 'ad', 'dimer', 'lbd'] }],
        ['轉錄因子是蛋白質，屬於', { a: 'transf', o: ['cis', 'transf'] }], ['轉錄因子多半從 DNA 的哪裡辨認鹼基序列', { a: 'majorg', o: ['majorg', 'minorg'] }]],
      done: ['[[活化蛋白結合在促進子上，DNA 彎成環，經由輔助活化因子（媒介子）促進啟動子上的 RNA 聚合酶 II 開始轉錄。]]', '轉錄因子的模組：DNA 結合區、活化區，常有二聚化區；核受器另有配體結合區。',
        '同一個基因的促進子上可以結合好幾種轉錄因子，不同的組合決定這個基因在哪個組織、什麼時候表現。'] },
    { t: 'DNA 結合區的四種構造', kind: 'list',
      intro: ['轉錄因子很多，但抓 DNA 的構造歸納起來只有幾種。名字都是照形狀取的。',
        '<b>螺旋－轉折－螺旋</b>：兩段 α 螺旋中間一個轉折，其中一段卡進大凹溝。決定身體藍圖的同源區（homeodomain）蛋白屬於這一類。',
        '<b>鋅指</b>：用半胱胺酸和組胺酸夾住一個鋅離子，撐出像手指的突起。這是人體數量最多的一類；類固醇激素、維生素 D、視網酸的受器都是鋅指蛋白。缺鋅影響生長和性發育，和這有關。',
        '<b>白胺酸拉鍊</b>：一段 α 螺旋上每隔 7 個胺基酸就有一個白胺酸，兩條螺旋靠白胺酸像拉鍊一樣扣成二聚體；旁邊帶正電的鹼性區去抓 DNA，所以也叫 bZIP。',
        '<b>螺旋－環－螺旋</b>：兩段螺旋中間一個環，也是先形成二聚體；辨認的序列叫 E 盒。和肌肉、神經的分化有關。'],
      listTitle: '這是哪一種構造',
      list: [['需要鋅離子來維持形狀', { a: 'zf', o: REG_M }], ['類固醇激素受器、維生素 D 受器、Sp1', { a: 'zf', o: REG_M }], ['靠每隔 7 個出現一次的白胺酸形成二聚體', { a: 'bzip', o: REG_M }], ['C/EBP、CREB、Fos 和 Jun（AP-1）', { a: 'bzip', o: REG_M }],
        ['同源區（homeodomain）蛋白', { a: 'hth', o: REG_M }], ['MyoD、Myc；辨認 E 盒', { a: 'bhlh', o: REG_M }], ['鋅指用哪些胺基酸抓住鋅', { a: 'cyshis', o: ['cyshis', 'leu', 'lysarg'] }], ['白胺酸拉鍊旁邊去抓 DNA 的區域富含', { a: 'lysarg', o: ['cyshis', 'leu', 'lysarg'] }]],
      done: ['[[四種 DNA 結合構造：螺旋－轉折－螺旋、鋅指、白胺酸拉鍊、螺旋－環－螺旋。]]', '鋅指：半胱胺酸（Cys）和組胺酸（His）配位一個 Zn²⁺。C2H2 型（Sp1、TFIIIA）；C4 型（核受器）。',
        '白胺酸拉鍊和螺旋－環－螺旋都要先形成二聚體才能結合 DNA。不同成員互相配對，組合就變多。'] },
    { t: '核受器：脂溶性激素和營養素直接調控基因', kind: 'list',
      intro: ['有一大類轉錄因子本身就是受器：脂溶性的小分子穿過細胞膜，直接接到它身上，它就去結合 DNA 上的反應元件，把目標基因打開或關掉。這一類叫核受器，DNA 結合區是兩個鋅指。',
        '第一種：類固醇激素的受器（糖皮質素、性激素）。平常待在細胞質，被熱休克蛋白抓著；激素接上後才放開、進到細胞核，以兩個相同的受器配成一對。',
        '第二種：甲狀腺素、維生素 D、視網酸、脂肪酸的受器。平常就待在核裡的 DNA 上，而且都和同一個夥伴 RXR 配成一對。沒有配體時它們壓著基因；配體一接上，換成輔助活化因子，基因就打開。',
        '和營養最有關的是 PPAR（過氧化體增殖劑活化受器），它的配體是脂肪酸。PPARα 主要在肝臟，飢餓時把脂肪酸氧化和酮體生成的基因打開。PPARγ 主要在脂肪組織，促進脂肪細胞分化和儲存脂肪，並提高胰島素敏感性。'],
      listTitle: '誰管什麼',
      list: [['飢餓時在肝臟打開脂肪酸 β-氧化和酮體生成的基因', { a: 'ppara', o: REG_N }], ['促進脂肪細胞分化，提高胰島素敏感性', { a: 'pparg', o: REG_N }], ['PPAR 的天然配體', { a: 'fa', o: ['fa', 'glc', 'chol', 'aa'] }],
        ['fibrate 類降三酸甘油酯的藥，活化的是', { a: 'ppara', o: REG_N }], ['thiazolidinedione 類降血糖藥，活化的是', { a: 'pparg', o: REG_N }], ['PPAR、維生素 D 受器、甲狀腺素受器共同的配對夥伴', { a: 'rxr', o: ['rxr', 'hsp', 'hre'] }],
        ['沒有激素時，把糖皮質素受器留在細胞質的蛋白質', { a: 'hsp', o: ['rxr', 'hsp', 'hre'] }], ['細胞內膽固醇不足時被活化，打開膽固醇合成和 LDL 受器的基因', { a: 'srebp', o: ['srebp', 'chrebp'] }], ['葡萄糖多的時候被活化，打開糖解和脂肪合成的基因', { a: 'chrebp', o: ['srebp', 'chrebp'] }]],
      done: ['[[PPARα：肝臟、脂肪酸氧化（fibrate）。PPARγ：脂肪組織、脂肪細胞分化與胰島素敏感性（thiazolidinedione）。配體都是脂肪酸。]]', 'PPAR、維生素 D 受器、甲狀腺素受器、視網酸受器都和 RXR 配成異質二聚體。RXR 的配體是 9-順式視網酸，也就是維生素 A 的衍生物。',
        '類固醇受器沒有激素時在細胞質，和熱休克蛋白結合。', 'SREBP 管膽固醇和脂肪酸的合成，ChREBP 對葡萄糖有反應。它們不是核受器，但都是「營養素調控基因」的例子。'] },
    { t: '表觀遺傳一：組蛋白乙醯化', kind: 'cloze',
      intro: ['轉錄因子要碰得到 DNA，染色質得先鬆開。細胞用化學修飾來調整鬆緊，最重要的是組蛋白的乙醯化。',
        '組蛋白的尾巴伸在核小體外面，上面的離胺酸帶正電，緊緊吸住帶負電的 DNA。組蛋白乙醯轉移酶（HAT）把乙醯基接到離胺酸上，正電就沒有了，組蛋白抓不緊，染色質鬆開，基因可以轉錄。組蛋白去乙醯酶（HDAC）把乙醯基拿掉，染色質又收緊。',
        '乙醯基來自乙醯輔酶 A，所以這個修飾和細胞的能量狀態連在一起。'],
      cloze: [['乙醯基接在組蛋白的哪一種胺基酸上？', { a: 'lys', o: ['lys', 'ser', 'cys'] }, '。'],
        ['乙醯基的來源是', { a: 'acoa', o: ['acoa', 'sam', 'atp'] }, '。'],
        ['乙醯化之後，組蛋白尾巴的電荷', { a: 'posl', o: ['posl', 'posm'] }, '。'],
        ['所以染色質', { a: 'loose', o: ['loose', 'tight'] }, '。'],
        ['負責接上乙醯基的酵素是', { a: 'hat', o: ['hat', 'hdac', 'dnmt'] }, '。'],
        ['負責拿掉乙醯基的酵素是', { a: 'hdac', o: ['hat', 'hdac', 'dnmt'] }, '。'],
        ['HDAC 活性高的區域，基因通常被', { a: 'off', o: ['on', 'off'] }, '。'],
        ['很多輔助活化因子本身帶有哪一種酵素活性？', { a: 'hat', o: ['hat', 'hdac', 'dnmt'] }, '。'],
        ['膳食纖維在大腸發酵產生的哪一種短鏈脂肪酸，是 HDAC 的抑制劑？', { a: 'but', o: ['but', 'acoa', 'nad'] }, '。'],
        ['有一類去乙醯酶（sirtuin）需要哪一個輔酶，因此和能量狀態有關？', { a: 'nad', o: ['nad', 'acoa', 'sam'] }, '。']],
      done: ['[[組蛋白乙醯化（HAT）→ 離胺酸的正電被中和 → 染色質鬆開 → 轉錄增加。去乙醯化（HDAC）→ 染色質收緊 → 轉錄減少。]]', '乙醯基來自乙醯輔酶 A。',
        '丁酸（butyrate）是 HDAC 抑制劑；這是膳食纖維、腸道菌和基因表現之間的一條連結。', 'sirtuin 是需要 NAD⁺ 的去乙醯酶，熱量限制時活性上升。'] },
    { t: '表觀遺傳二：DNA 甲基化', kind: 'list',
      intro: ['另一種標記直接做在 DNA 上：在胞嘧啶的 5 號碳接一個甲基，變成 5-甲基胞嘧啶。被甲基化的幾乎都是後面緊接著 G 的 C，寫成 CpG（p 是中間的磷酸）。',
        '很多基因的啟動子附近 CpG 特別密集，叫 CpG 島。正在表現的基因，CpG 島沒有甲基化；CpG 島一旦被甲基化，這個基因就被關掉：甲基會擋住轉錄因子，還會招來專門認甲基的蛋白質，它們再把 HDAC 找來，把染色質收緊。',
        '甲基由 S-腺苷甲硫胺酸（SAM）提供，而 SAM 的再生需要葉酸、維生素 B12、膽鹼和甲硫胺酸。所以飲食裡的甲基供應者會影響 DNA 的甲基化，懷孕期間尤其重要。',
        'DNA 複製後，新的一股還沒有甲基。DNMT1 會照著舊股的樣式把新股補上甲基，所以甲基化的樣式可以傳給子細胞，這就是「細胞記得自己是誰」的方法。'],
      listTitle: '甲基化的觀念與例子',
      list: [['被甲基化的鹼基', { a: 'cyt', o: ['cyt', 'ade', 'gua'] }], ['甲基化發生在哪一種雙核苷酸序列', { a: 'cpg', o: ['cpg', 'tata', 'cca'] }], ['CpG 島最常出現在基因的', { a: 'prom', o: ['prom', 'intr', 'telo'] }],
        ['啟動子的 CpG 島被甲基化，這個基因會', { a: 'off', o: ['on', 'off'] }], ['甲基的直接來源', { a: 'sam', o: ['sam', 'acoa', 'atp'] }], ['飲食中和甲基供應最有關的營養素', { a: 'folb12', o: ['folb12', 'vitc', 'vitk'] }],
        ['複製後照著舊股把新股補上甲基的酵素', { a: 'dnmt1', o: ['dnmt1', 'dnmt3'] }], ['女性兩條 X 染色體中有一條整條被關掉', { a: 'xin', o: ['xin', 'impr'] }], ['只表現來自父親（或只表現來自母親）的那一份基因', { a: 'impr', o: ['xin', 'impr'] }],
        ['被關掉的 X 染色體濃縮成的構造', { a: 'barr', o: ['barr', 'cpgi', 'xist'] }], ['癌細胞常見哪一類基因的啟動子被過度甲基化而關掉', { a: 'tsg', o: ['tsg', 'onc'] }]],
      done: ['[[DNA 甲基化：CpG 的胞嘧啶被甲基化；啟動子的 CpG 島甲基化 → 基因關閉。甲基來自 SAM。]]', '甲基化不改變鹼基序列，卻能在細胞分裂後維持（DNMT1），所以是表觀遺傳。',
        'X 染色體去活化：由 Xist RNA 啟動，被關掉的那條高度甲基化、組蛋白低度乙醯化，濃縮成巴爾氏體。', '基因印記：某些基因依來源（父親或母親）被甲基化而只表現一份。',
        '葉酸、維生素 B12、膽鹼、甲硫胺酸、甜菜鹼是甲基供應者。母親懷孕時的營養可以經由甲基化影響孩子日後的健康，這是「健康與疾病的發育起源」的分子基礎之一。'] },
    { t: 'RNA 干擾：用小 RNA 把 mRNA 關掉', kind: 'map', sub: 'rnai', plain: 1, blanks: ['dicer', 'risc', 'pair', 'sil'],
      intro: ['前面幾關都是管「要不要抄」。RNA 干擾（RNA interference）管的是抄出來之後：用一小段 RNA 去找序列互補的 mRNA，把它毀掉或讓它不能轉譯。因為發生在轉錄之後，也叫轉錄後基因沉默。',
        '小 RNA 有兩個來源。{R:微小 RNA（miRNA）}是細胞自己的基因抄出來的，RNA 自己折成髮夾；{R:小干擾 RNA（siRNA）}來自外來的長雙股 RNA，例如病毒，或是實驗室放進去的。',
        '兩者後面走同一條路：先被 Dicer 這個酵素切成二十幾個核苷酸的小段，再裝進 RISC 這個蛋白質複合體，只留下一股當嚮導去找目標。',
        '差別在配對的程度：siRNA 和目標完全互補，RISC 直接把 mRNA 切斷；miRNA 通常只有部分互補，結合在 mRNA 的 3′ 非轉譯區，主要是擋住轉譯。'],
      listTitle: '相關的考點',
      list: [['把雙股 RNA 切成小段的酵素', { a: 'dicer', o: REG_R }], ['帶著嚮導股去找目標 mRNA 的複合體', { a: 'risc', o: REG_R }], ['RISC 裡負責切斷 mRNA 的蛋白質', { a: 'ago', o: REG_R }], ['在細胞核裡先修剪 miRNA 前驅物的酵素', { a: 'drosha', o: REG_R }],
        ['由細胞自己的基因轉錄、折成髮夾而來', { a: 'mirna', o: ['sirna', 'mirna', 'snrna', 'trna'] }], ['來自外來的長雙股 RNA，和目標完全互補', { a: 'sirna', o: ['sirna', 'mirna', 'snrna', 'trna'] }], ['完全互補時的結果', { a: 'cleave', o: ['cleave', 'blockt'] }],
        ['miRNA 通常結合在目標 mRNA 的', { a: 'utr3', o: ['utr3', 'utr5'] }], ['這些小 RNA 的長度', { a: 'n22', o: ['n22', 'n200', 'n3k'] }], ['RNA 干擾屬於哪一個層次的調控', { a: 'ptgs', o: ['ptgs', 'pretr'] }]],
      done: ['[[雙股 RNA → Dicer 切成約 22 個核苷酸 → 裝進 RISC → 嚮導股和 mRNA 配對 → 切斷 mRNA 或擋住轉譯。]]', 'siRNA：外來、完全互補、切斷 mRNA。miRNA：自己的基因、部分互補、抑制轉譯。',
        'Dicer 是一種 RNase III；RISC 裡動手切的是 Argonaute。', '研究上用 siRNA 把特定基因「關小」來看它的功能；也已經有 siRNA 做成的藥，例如降低 LDL 膽固醇的 inclisiran，作用是把肝臟 PCSK9 的 mRNA 毀掉。'] },
    { t: '補充：細菌的操縱組', kind: 'list',
      intro: ['這一關簡報沒有，但生化考題偶爾會出，放在這裡當補充。',

        '這件事需要三種 RNA 合作：一種是設計圖；一種是搬運工兼翻譯員，一頭認得設計圖、另一頭帶著胺基酸；還有一種是工廠的主體。',
        '先回答四件事：模板、原料的搬運者、機器，還有方向。'],
      blanks: [{ id: 'r1', x: 262, y: 300, w: 170, c: 'R', a: 'mrna', o: TRL_RO }, { id: 'r2', x: 262, y: 348, w: 170, c: 'R', a: 'trna', o: TRL_RO }, { id: 'r3', x: 262, y: 396, w: 170, c: 'R', a: 'rrna', o: TRL_RO },
        { id: 'd1', x: 262, y: 444, w: 170, a: 'd53', o: ['d53', 'd35'] }, { id: 'd2', x: 262, y: 492, w: 170, c: 'P', a: 'nc', o: ['nc', 'cn'] }],
      done: ['mRNA 是模板，tRNA 把胺基酸帶來，核糖體（rRNA 加上蛋白質）是機器。', '核糖體沿著 mRNA [[5′→3′]] 讀；多肽鏈從 [[N 端往 C 端]]長。先做出來的是 N 端。',
        '位置：細胞質裡的核糖體，有些游離、有些附在粗糙內質網上。', '細胞裡的 RNA，數量最多的是 rRNA（大約八成），其次是 tRNA，mRNA 最少。'] },
    { t: '遺傳密碼：三個鹼基一個字', kind: 'list',
      intro: ['mRNA 上每三個鹼基是一個字，叫做密碼子（codon）。一個密碼子對應一個胺基酸。',
        '四種鹼基、三個一組，一共有 4×4×4＝64 種組合。可是胺基酸只有 20 種，所以大部分的胺基酸都不只一個密碼子。',
        '64 個裡面有 3 個不對應任何胺基酸，意思是「到這裡結束」；另外有一個身兼二職，既代表一種胺基酸，也是「從這裡開始」。',
        '國考不會要你背整張密碼表，但[[起始密碼子和三個終止密碼子一定要背]]。'],
      tip: '起始：AUG。終止：UAA、UAG、UGA（可以記成 U Are Away、U Are Gone、U Go Away）。',
      listTitle: '密碼的性質',
      list: [['下列哪一個是起始密碼子', { a: 'AUG', o: ['AUG', 'UAA', 'UGG', 'GUA'] }], ['起始密碼子對應的胺基酸', { a: 'met', o: ['met', 'trp', 'leu'] }], ['下列哪一個是終止密碼子', { a: 'UGA', o: ['AUG', 'UGA', 'UGG', 'UAC'] }],
        ['一種胺基酸可以對應好幾個密碼子，這個性質叫', { a: 'degen', o: ['degen', 'univ', 'nonov'] }], ['從細菌到人類幾乎都用同一套密碼，這個性質叫', { a: 'univ', o: ['degen', 'univ', 'nonov'] }],
        ['三個一組連著讀，中間沒有空格，同一個鹼基也不會用兩次', { a: 'nonov', o: ['degen', 'univ', 'nonov'] }], ['同一種胺基酸的幾個密碼子，通常只差在', { a: 'b3', o: ['b1', 'b2', 'b3'] }],
        ['只有一個密碼子的胺基酸是哪兩種', { a: 'mt', o: ['mt', 'ls', 'rg'] }], ['三個一組的分法叫做讀框。多插入或少掉一個鹼基，後面的分法全部跑掉，叫做', { a: 'fs', o: ['fs', 'ms', 'sm'] }]],
      countsTitle: '數字', counts: [['密碼子一共有幾種', '64', ['20', '61', '64']], ['對應胺基酸的密碼子有幾種', '61', ['20', '61', '64']], ['終止密碼子有幾種', '3', ['1', '3', '4']]],
      done: ['[[AUG]] 是起始密碼子，同時也是甲硫胺酸（Met）的密碼子。', '[[UAA、UAG、UGA]] 是終止密碼子，不對應任何胺基酸，又叫無意義密碼子（nonsense codon）。',
        '簡併性（degeneracy）：多個密碼子對應同一種胺基酸，多半只差第三個鹼基。所以第三個鹼基突變，胺基酸常常不變。', '只有甲硫胺酸（AUG）和色胺酸（UGG）各只有一個密碼子。'] },
    { t: 'tRNA：一頭認密碼、一頭帶胺基酸', kind: 'ov', h: 392, legend: [['sR', 'RNA'], ['kP', '胺基酸']], svg: TRL_CL,
      intro: ['tRNA 是一條只有 70 到 80 個核苷酸的小 RNA。同一條鏈上有幾段序列互補，自己和自己配對，折成像三葉草的形狀。',
        '它有兩個工作的地方。一個是三個鹼基的[[反密碼子（anticodon）]]，和 mRNA 上的密碼子互補配對；另一個是胺基酸接上去的那一端。',
        '所以 tRNA 才是真正的翻譯員：它同時認得核酸的語言和胺基酸的語言。',
        '配對時兩條鏈方向相反。圖上黃底的那一對，配對規則比較寬鬆，下面的題目會問到。'],
      blanks: [{ id: 'aa', x: 84, y: 44, w: 136, c: 'R', a: 'e3', o: ['e3', 'e5', 'dl', 'al'] }, { id: 'ac', x: 284, y: 298, w: 128, c: 'R', a: 'acodon', o: ['codon', 'acodon', 'dl', 'al'] }],
      listTitle: '配對的規則',
      list: [['黃底那一對比較寬鬆。它是密碼子的', { a: 'b3', o: ['b1', 'b2', 'b3'] }], ['這種比較寬鬆的配對叫做', { a: 'wob', o: ['wob', 'wc'] }],
        ['反密碼子的第 1 個鹼基如果是肌苷（I，inosine），可以配密碼子的', { a: 'i_uca', o: ['i_uca', 'i_c', 'i_ag'] }],
        ['tRNA 有很多修飾過的鹼基。TψC 環的 ψ 是', { a: 'psu', o: ['psu', 'ino', 'thy'] }], ['真核細胞的 tRNA 基因由誰轉錄', { a: 'pol3', o: ['pol1', 'pol2', 'pol3'] }]],
      done: ['胺基酸接在 tRNA 的 [[3′ 端]]，那裡的序列固定是 CCA。', '[[搖擺配對（wobble）]]：密碼子的第 3 個鹼基，和反密碼子的第 1 個鹼基之間，配對規則比較寬鬆。所以一種 tRNA 可以認好幾個密碼子，細胞不需要準備 61 種 tRNA。',
        'RNA 的雙股區域，是同一條單股 RNA 自己互補的地方折出來的。tRNA 的三葉草就是例子。國考考過。', '起始用的 tRNA 很特別：細菌帶的是甲醯甲硫胺酸（fMet），真核細胞帶的是一般的甲硫胺酸（Met）。'] },
    { t: '胺基酸上車：胺醯-tRNA 合成酶', kind: 'ov', h: 244, legend: [['kP', '胺基酸']],
      intro: ['胺基酸不會自己找到對的 tRNA，要靠酵素把它接上去。這個酵素叫[[胺醯-tRNA 合成酶（aminoacyl-tRNA synthetase）]]。',
        '接好胺基酸的 tRNA 叫胺醯-tRNA（aminoacyl-tRNA），也有人說是「充電」過的 tRNA。簡報上寫的「胺基酸乙醯 tRNA」是同一個東西；國考和課本多半寫胺醯-tRNA。',
        '反應分兩步，能量來自 ATP。注意這裡的 ATP 不是變成 ADP。'],
      svg: function () { var h = PH() / 2; return pill(120, 34, 124, { zh: '胺基酸', en: 'Amino acid' }, 'pill kP') + arrow(120, 35 + h, 120, 118 - h) + arrow(120, 121 + h, 120, 204 - h) + pill(120, 206, 150, { zh: '胺醯-tRNA', en: 'Aminoacyl-tRNA' }, 'src') +
        tagC(158, 76, { zh: '用掉 ATP', en: 'uses ATP' }, 'sp') + tx(214, 60, T('同時放出', 'releasing'), 'm', 10, 'start') + tagC(158, 163, { zh: '接上 tRNA', en: '+ tRNA' }, 'mol') + tagC(232, 163, { zh: '放出 AMP', en: 'AMP out' }, 'mol'); },
      blanks: [{ id: 'mid', x: 120, y: 120, w: 150, c: 'P', a: 'aamp', o: ['aamp', 'aadp', 'ptrna'] }, { id: 'out', x: 284, y: 82, w: 132, a: 'ppi', o: ['ppi', 'pi', 'adp'] }],
      listTitle: '這個酵素的重點',
      list: [['胺基酸和 tRNA 之間的鍵結', { a: 'est', o: ['est', 'pep', 'pde', 'hb'] }], ['負責「對的胺基酸接到對的 tRNA」的是', { a: 'aars', o: ['aars', 'ribo', 'pt'] }]],
      countsTitle: '數字', counts: [['這種酵素一共有幾種（每種胺基酸一種）', '20', ['1', '20', '61', '64']], ['活化一個胺基酸，用掉幾個高能磷酸鍵', '2', ['1', '2', '3', '4']]],
      done: ['ATP → AMP ＋ PPi，一次斷掉兩個高能磷酸鍵，所以算[[用掉 2 個高能磷酸鍵]]。', '胺基酸以酯鍵接在 tRNA 的 3′ 端。這個鍵的能量，之後用來形成肽鍵。',
        '轉譯要正確，有兩道關卡：這個酵素把對的胺基酸接到對的 tRNA 上；之後核糖體上密碼子和反密碼子要配對正確。核糖體只認反密碼子，不會檢查 tRNA 上載的是哪一種胺基酸。'] },
    { t: '核糖體：大小兩個次單元', kind: 'ov', h: 196, legend: [['kP', '核糖體（rRNA 加蛋白質）']],
      intro: ['核糖體是 rRNA 加上許多蛋白質組成的大型複合體，分成大、小兩個次單元。平常分開，要轉譯時才合起來。',
        '分工：小次單元抓住 mRNA、負責對密碼；大次單元負責把胺基酸一個一個接起來。',
        '大小用沉降係數 S 表示，數字越大、沉得越快。S 和形狀也有關係，所以[[不能直接相加]]。'],
      svg: function () { return tx(95, 22, T('原核細胞（細菌）', 'Prokaryote (bacteria)'), 'b', 12) + tx(265, 22, T('真核細胞', 'Eukaryote'), 'b', 12) + blob(95, 84, 56, 40) + blob(95, 152, 48, 23) + blob(265, 84, 62, 44) + blob(265, 154, 54, 25) +
        tx(180, 88, T('大次單元', 'large'), 'm', 10) + tx(180, 158, T('小次單元', 'small'), 'm', 10); },
      blanks: [{ id: 'pl', x: 95, y: 84, w: 84, a: 's50', o: ['s30', 's40', 's50', 's60'] }, { id: 'ps', x: 95, y: 152, w: 84, a: 's30', o: ['s30', 's40', 's50', 's60'] },
        { id: 'el', x: 265, y: 84, w: 84, a: 's60', o: ['s30', 's40', 's50', 's60'] }, { id: 'es', x: 265, y: 154, w: 84, a: 's40', o: ['s30', 's40', 's50', 's60'] }],
      countsTitle: '合起來，以及裡面的 rRNA',
      counts: [['原核細胞完整的核糖體', '70S', ['70S', '80S', '90S']], ['真核細胞質裡完整的核糖體', '80S', ['70S', '80S', '100S']],
        ['原核小次單元裡的 rRNA', '16S', ['16S', '18S', '23S', '28S']], ['真核小次單元裡的 rRNA', '18S', ['16S', '18S', '23S', '28S']],
        ['原核大次單元裡有 5S 和', '23S', ['16S', '18S', '23S', '28S']], ['真核大次單元裡有 5S、5.8S 和', '28S', ['16S', '18S', '23S', '28S']]],
      done: ['細菌：[[30S ＋ 50S ＝ 70S]]。真核：[[40S ＋ 60S ＝ 80S]]。', '小次單元的 rRNA：細菌 16S、真核 18S。大次單元最大的那條：細菌 23S、真核 28S。',
        '抗生素能殺細菌又不太傷人，就是因為細菌的核糖體和人的不一樣。', '粒線體有自己的核糖體，比較像細菌的。所以有些抗生素（例如氯黴素）會有副作用。'] },
    { t: '起始：從哪裡開始讀', kind: 'list',
      intro: ['核糖體要先找到正確的 AUG，才知道從哪裡開始、三個三個怎麼分組。',
        '<b>細菌</b>：mRNA 的起始密碼子前面有一段 Shine-Dalgarno 序列，和小次單元裡 16S rRNA 的 3′ 端互補。一配對，AUG 就剛好對在正確的位置。',
        '<b>真核細胞</b>：mRNA 的 5′ 端有帽蓋（cap）。小次單元先靠起始因子認出帽蓋，再沿著 mRNA 往 3′ 方向掃描，通常遇到的第一個 AUG 就是起點。',
        '兩邊的共通點：小次單元先和 mRNA、起始 tRNA 組好，大次單元最後才蓋上來；起始 tRNA 直接進 P 位；過程要用 GTP。',
        '幫忙的蛋白質叫起始因子（initiation factor），細菌的寫 IF，真核的前面多一個 e，寫 eIF。'],
      listTitle: '細菌和真核細胞的起始',
      list: [['細菌的第一個胺基酸', { a: 'fmet', o: ['fmet', 'met', 'trp'] }], ['真核細胞的第一個胺基酸', { a: 'met', o: ['fmet', 'met', 'trp'] }],
        ['細菌 mRNA 上讓核糖體定位的序列', { a: 'sd', o: ['sd', 'kozak', 'tata', 'polya'] }], ['和這段序列配對的是', { a: 'r16', o: ['r16', 'r23', 'r5'] }],
        ['真核細胞的小次單元，先認 mRNA 的', { a: 'cap5', o: ['cap5', 'polya', 'sd', 'tata'] }], ['認出帽蓋的真核起始因子', { a: 'eif4e', o: ['eif4e', 'eif2', 'eef2', 'if3'] }],
        ['帶著 GTP、把起始 tRNA 送到小次單元的真核起始因子', { a: 'eif2', o: ['eif4e', 'eif2', 'eef2', 'if3'] }], ['起始 tRNA 進入核糖體的哪個位置', { a: 'sp_', o: TRL_SO }],
        ['起始階段使用的能量', { a: 'gtp', o: ['atp', 'gtp', 'ctp'] }], ['細菌可以一邊轉錄、一邊轉譯；真核細胞不行，因為多了', { a: 'nenv', o: ['nenv', 'cw', 'mito'] }]],
      done: ['細菌：Shine-Dalgarno 序列配 16S rRNA，第一個胺基酸是 fMet。', '真核：認 5′ 帽蓋、往下掃描到第一個 AUG（周圍的序列叫 Kozak 序列），第一個胺基酸是 Met。',
        '起始 tRNA 是唯一直接進 [[P 位]]的 tRNA，之後的都從 A 位進來。', '和營養有關：胰島素和白胺酸（leucine）會活化 mTOR，讓 eIF4E 可以工作，轉譯的起始增加，蛋白質合成就上升。'] },
    { t: '延長：A、P、E 三個位置', kind: 'ov', h: 340, legend: [['sR', 'RNA'], ['kP', '核糖體、胺基酸']], svg: TRL_APE,
      intro: ['大小次單元合起來之後，中間有三個放 tRNA 的位置，順著 mRNA 的 5′→3′ 排成一列。名字取自英文的第一個字母：',
        '<b>A 位</b>（aminoacyl）：新來的、帶著一個胺基酸的 tRNA 進來的地方。<b>P 位</b>（peptidyl）：拿著整條多肽鏈的 tRNA 待的地方。<b>E 位</b>（exit）：卸完貨的空 tRNA 離開前待的地方。',
        '每多接一個胺基酸，就重複三個動作，圖上有編號：1 進位，新的胺醯-tRNA 進來；2 成肽，形成肽鍵；3 移位，核糖體往前走一個密碼子。',
        '成肽的時候，是 P 位那整條多肽鏈被搬過去，接到新來的那個胺基酸上。移位之後，原本拿著鏈的 tRNA 變成空的，往出口移動。',
        '看圖上三個位置的 tRNA 各拿著什麼，把三個位置的名字填出來。'],
      blanks: [{ id: 'e', x: 124, y: 82, w: 52, a: 'se', o: TRL_SO }, { id: 'p', x: 180, y: 82, w: 52, a: 'sp_', o: TRL_SO }, { id: 'a', x: 236, y: 82, w: 52, a: 'sa', o: TRL_SO }],
      listTitle: '三個動作各靠誰',
      list: [['進位（圖上的 1）：細菌把胺醯-tRNA 送進來的延長因子', { a: 'eftu', o: TRL_FO }], ['成肽（圖上的 2）：催化肽鍵形成的酵素活性', { a: 'pt', o: ['pt', 'aars', 'ribo'] }],
        ['這個酵素活性來自大次單元裡的', { a: 'rz', o: ['rz', 'rprot'] }], ['移位（圖上的 3）：細菌推動核糖體前進的延長因子', { a: 'efg', o: TRL_FO }],
        ['真核細胞負責移位的因子', { a: 'eef2', o: ['eef2', 'eif2', 'eif4e', 'erf1'] }], ['進位和移位各用掉一個', { a: 'gtp', o: ['atp', 'gtp', 'ctp'] }]],
      done: ['順序可以記成：A 進、P 接、E 出。', '[[肽基轉移酶（peptidyl transferase）是 rRNA]]，不是蛋白質。細菌是 23S rRNA，真核是 28S rRNA。會催化反應的 RNA 叫核糖酶（ribozyme）。',
        '細菌的 EF-Tu 管進位、EF-G 管移位；真核細胞對應的是 eEF1A 和 eEF2。', '成肽這一步本身不另外用 ATP 或 GTP，能量來自胺基酸和 tRNA 之間的那個酯鍵。'] },
    { t: '終止與能量總帳', kind: 'list',
      intro: ['核糖體走到終止密碼子（UAA、UAG、UGA）時，沒有任何 tRNA 認得它。這時進到 A 位的是一種蛋白質，叫釋放因子（release factor）。',
        '釋放因子讓 P 位上的多肽鏈被切下來。接著大小次單元分開、離開 mRNA，可以再拿去用。',
        '一條 mRNA 上通常同時有好幾個核糖體排著隊在讀，同一份設計圖可以同時做出很多條蛋白質。',
        '最後算能量。蛋白質合成是細胞裡最花能量的工作之一，每接一個胺基酸要付三筆。'],
      listTitle: '終止',
      list: [['認得終止密碼子的是', { a: 'rf', o: ['rf', 'stRNA', 'rprot'] }], ['細菌的 RF1 認 UAA 和', { a: 'UAG', o: ['UAG', 'UGA', 'AUG'] }], ['細菌的 RF2 認 UAA 和', { a: 'UGA', o: ['UAG', 'UGA', 'AUG'] }],
        ['真核細胞只用一種釋放因子認全部三種終止密碼子，它是', { a: 'erf1', o: ['erf1', 'eef2', 'eif2'] }], ['一條 mRNA 上同時掛著許多核糖體，叫做', { a: 'poly', o: ['poly', 'nucs', 'splc'] }]],
      countsTitle: '每形成一個肽鍵，用掉幾個高能磷酸鍵',
      counts: [['胺基酸活化（ATP → AMP ＋ PPi）', '2', ['1', '2', '3']], ['進位（GTP）', '1', ['1', '2', '3']], ['移位（GTP）', '1', ['1', '2', '3']], ['合計', '4', ['2', '3', '4', '6']]],
      done: ['[[每形成一個肽鍵，一共用掉 4 個高能磷酸鍵]]：活化 2 個，進位 1 個，移位 1 個。', '終止密碼子是由蛋白質（釋放因子）辨識的，不是 tRNA。',
        '聚核糖體（polysome）：越靠近 mRNA 3′ 端的核糖體，身上的多肽鏈越長。'] },
    { t: '抗生素與毒素：卡在哪一步', kind: 'list',

        ['糖解作用的酵素', { a: 'free', o: ['free', 'bound'] }], ['組蛋白、轉錄因子', { a: 'free', o: ['free', 'bound'] }], ['粒線體大部分的蛋白質', { a: 'free', o: ['free', 'bound'] }]],
      done: ['[[游離的核糖體 → 細胞質、細胞核、粒線體、過氧化體。粗糙內質網上的核糖體 → 內質網 → 高基氏體 → 溶體、細胞膜、分泌。]]', '兩種核糖體其實是同一種，差別只在正在做的那條蛋白質有沒有訊號肽。',
        '粒線體雖然有自己的 DNA 和核糖體，但只做得出十幾種蛋白質，九成以上要從細胞質送進去。', '分泌旺盛的細胞（胰臟腺泡細胞、漿細胞、肝細胞）粗糙內質網特別發達。'] },
    { t: '摺疊：伴護蛋白', kind: 'list',
      intro: ['蛋白質要摺成什麼形狀，資訊都在胺基酸序列裡（一級結構決定高級結構）。但細胞裡很擠，剛做出來的鏈上那些疏水的區段還露在外面，很容易和別的鏈黏成一團。',
        '伴護蛋白（chaperone）就是來防止這件事的：它們暫時抓住露在外面的疏水區段，給這條鏈時間和空間慢慢摺好。它們不決定最後的形狀，只是防止摺錯和亂黏。',
        '伴護蛋白大多屬於熱休克蛋白（heat shock protein）：細胞受熱時蛋白質容易變性，這群蛋白質就大量增加來搶救，因此得名。Hsp70 在多肽還在核糖體上時就抓住它；伴護素（Hsp60，細菌叫 GroEL 和 GroES）是一個桶子，把整條鏈關在裡面摺。兩者都要消耗 ATP。',
        '在內質網裡還有蛋白質雙硫鍵異構酶，幫忙把雙硫鍵接對。摺不好的蛋白質會被送去分解；分解不掉而堆積起來，就會生病。'],
      listTitle: '摺疊的幫手',
      list: [['又稱分子伴護蛋白，防止蛋白質不當摺疊', { a: 'hsp', o: ['hsp', 'elastin', 'trypsin', 'collagen'] }], ['多肽還在核糖體上就先抓住它的疏水區段', { a: 'hsp70', o: PTM_C }], ['桶狀，把整條多肽關在裡面摺', { a: 'chapn', o: PTM_C }], ['在內質網裡把接錯的雙硫鍵重新接對', { a: 'pdi', o: PTM_C }],
        ['伴護蛋白抓住的是多肽上的', { a: 'hphob', o: ['hphob', 'hphil'] }], ['伴護蛋白工作時消耗', { a: 'atp', o: ['atp', 'noen'] }], ['決定蛋白質最後形狀的是', { a: 'prim', o: ['prim', 'sec', 'tert', 'quat'] }],
        ['蛋白質變性時沒有被破壞的鍵', { a: 'pepb', o: ['hbond', 'ssb', 'pepb'] }], ['摺錯的蛋白質會誘導正常的同類蛋白質也跟著摺錯', { a: 'prion', o: ['prion', 'scurvy', 'cf'] }]],
      done: ['[[熱休克蛋白（heat shock protein）是分子伴護蛋白：幫助蛋白質正確摺疊、防止不當聚集。]]國考考過。', 'Hsp70 抓住新生多肽的疏水區段；伴護素（Hsp60／GroEL-GroES）提供隔離的空間；都需要 ATP。',
        '變性破壞的是二級到四級結構（氫鍵、疏水作用、離子鍵、雙硫鍵），肽鍵不斷，一級結構不變。', '和摺疊有關的疾病：普里昂病、阿茲海默症的類澱粉堆積；囊狀纖維化最常見的突變則是蛋白質摺不好、還沒到細胞膜就被分解掉。'] },
    { t: '化學修飾：接上或切掉一些東西', kind: 'list',
      intro: ['摺好之後，很多蛋白質還要在特定的胺基酸上接東西，或被切掉一段，才有活性、才到得了定位。這些都叫轉譯後修飾。',
        '最普遍的是磷酸化：激酶把 ATP 的磷酸接到絲胺酸、酥胺酸或酪胺酸的 −OH 上，磷酸酶再把它拿掉。它可以逆轉，所以是細胞最常用的開關，生化裡升糖素和胰島素調節酵素靠的就是這個。',
        '有幾種修飾需要維生素當輔因子，和營養直接相關：膠原蛋白的脯胺酸和離胺酸要羥化，需要<b>維生素 C</b>；凝血因子的麩胺酸要多接一個羧基才抓得住鈣，需要<b>維生素 K</b>。',
        '醣基化分兩種：接在天門冬醯胺酸的氮上叫 N-連結，從內質網開始、到高基氏體完成；接在絲胺酸或酥胺酸的氧上叫 O-連結，在高基氏體進行。'],
      listTitle: '這是哪一種修飾',
      list: [['由激酶催化，最常見的可逆開關', { a: 'phos', o: PTM_M }], ['分泌蛋白和膜蛋白接上寡醣鏈', { a: 'glyc', o: PTM_M }], ['需要維生素 C；膠原蛋白才能形成穩定的三股螺旋', { a: 'hydrox', o: PTM_M }], ['需要維生素 K；凝血因子才能結合鈣', { a: 'carbox', o: PTM_M }],
        ['組蛋白尾巴的離胺酸被修飾後，染色質鬆開', { a: 'acet', o: PTM_M }], ['接上脂肪酸或異戊二烯基，讓蛋白質掛在細胞膜上', { a: 'lipid', o: PTM_M }], ['貼上之後會被送去蛋白酶體分解', { a: 'ubiq', o: PTM_M }],
        ['胰島素原變成胰島素；酶原變成有活性的酵素', { a: 'cleave', o: PTM_M }], ['兩個半胱胺酸之間形成的共價連結', { a: 'disulf', o: PTM_M }],
        ['磷酸化發生在哪些胺基酸', { a: 'ste', o: ['ste', 'asn', 'lysi'] }], ['N-連結醣基化接在哪一個胺基酸', { a: 'asn', o: ['asn', 'sert', 'lysi'] }], ['O-連結醣基化接在', { a: 'sert', o: ['asn', 'sert', 'lysi'] }], ['N-連結醣基化從哪裡開始', { a: 'er', o: ['er', 'golgi', 'cytos'] }]],
      done: ['[[磷酸化：激酶，接在 Ser、Thr、Tyr。醣基化：N-連結接 Asn（內質網開始），O-連結接 Ser、Thr（高基氏體）。]]', '[[維生素 C → 脯胺酸、離胺酸的羥化（膠原蛋白）。維生素 K → 麩胺酸的 γ-羧化（凝血因子 II、VII、IX、X，以及骨鈣素）。]]',
        '缺維生素 C，膠原蛋白不穩定，造成壞血病。抗凝血藥 warfarin 就是讓維生素 K 不能再生，凝血因子做出來卻不能用。', '其他和營養有關的修飾：甲狀腺球蛋白的碘化（碘）、羧化酶接上生物素。'] },
    { t: '例子：胰島素是怎麼做出來的', kind: 'map', sub: 'ins', plain: 1, blanks: ['prepro', 'pro', 'cut'],
      intro: ['胰島素是國考最常用的例子，因為它把「訊號肽、雙硫鍵、切割」三種加工都用上了。',
        '胰臟 β 細胞先做出一條很長的鏈，叫前胰島素原（preproinsulin），最前面帶著訊號肽。「pre」指的就是訊號肽。',
        '進了內質網，訊號肽被切掉，剩下的叫胰島素原（proinsulin）；它摺起來，形成三個雙硫鍵。',
        '到了高基氏體和分泌顆粒裡，中間那一段連接用的 C 肽被切掉，剩下 A 鏈（21 個胺基酸）和 B 鏈（30 個胺基酸），靠雙硫鍵連在一起，這才是有活性的胰島素。'],
      listTitle: '胰島素的數字與應用',
      list: [['成熟的胰島素有幾條多肽鏈', { a: 'n2', o: ['n1', 'n2'] }], ['總共幾個胺基酸', { a: 'n51', o: ['n51', 'n86'] }], ['總共幾個雙硫鍵', { a: 'n3', o: ['n1', 'n2', 'n3'] }], ['前胰島素原比胰島素原多了', { a: 'sigp', o: ['sigp', 'cpep'] }],
        ['胰島素原比胰島素多了', { a: 'cpep', o: ['sigp', 'cpep'] }], ['β 細胞分泌的胰島素和 C 肽，分子數的比例', { a: 'equi', o: ['equi', 'r21', 'r12'] }], ['打胰島素的病人，抽血驗 C 肽可以知道', { a: 'endog', o: ['endog', 'exog'] }]],
      done: ['[[前胰島素原 →（切掉訊號肽）→ 胰島素原 →（切掉 C 肽）→ 胰島素。]]', '胰島素：A 鏈 21 個＋B 鏈 30 個，共 51 個胺基酸；兩個鏈間雙硫鍵、一個 A 鏈內的雙硫鍵。',
        'C 肽和胰島素以一比一的量一起分泌，注射用的胰島素不含 C 肽，所以血中的 C 肽可以反映病人自己 β 細胞的功能。',
        '很多肽類激素和消化酵素都是先做成沒有活性的前驅物，到了該作用的地方才切開活化，例如胃蛋白酶原、胰蛋白酶原。'] },
    { t: '訊號序列：蛋白質的郵遞區號', kind: 'list',
      intro: ['細胞怎麼知道每個蛋白質要送去哪裡？蛋白質自己帶著一小段胺基酸序列當地址，各個胞器的入口有受器認這些地址。沒有任何地址的蛋白質就留在細胞質。',
        '往內質網的地址在最前端，是一段疏水的訊號肽，進去之後會被切掉。往粒線體的也在前端，但帶正電，進去之後也會被切掉。',
        '往細胞核的地址是一小段富含離胺酸和精胺酸的序列，可以在蛋白質的任何位置，而且不會被切掉，因為細胞分裂後核膜重組，蛋白質還要再進去一次。',
        '溶體的酵素比較特別，地址不是胺基酸序列，而是在高基氏體被接上的一個醣類標記：甘露糖-6-磷酸。'],
      listTitle: '這個地址是去哪裡',
      list: [['N 端的疏水訊號肽', { a: 'er', o: PTM_O }], ['N 端帶正電的前導序列', { a: 'mitoc', o: PTM_O }], ['富含離胺酸、精胺酸的一小段，不會被切掉', { a: 'nucl', o: PTM_O }], ['C 端的 SKL 三個胺基酸', { a: 'perox', o: PTM_O }],
        ['醣鏈上的甘露糖-6-磷酸', { a: 'lyso', o: PTM_O }], ['C 端的 KDEL：跑到高基氏體的會被送回', { a: 'er', o: PTM_O }], ['沒有任何訊號序列', { a: 'cytos', o: PTM_O }],
        ['甘露糖-6-磷酸是在哪裡接上的', { a: 'cisg', o: ['cisg', 'transg'] }], ['接不上甘露糖-6-磷酸，溶體酵素被錯送到細胞外', { a: 'icell', o: ['icell', 'cf', 'scurvy'] }], ['蛋白質進出細胞核經過的構造', { a: 'npc', o: ['npc', 'sec61', 'srp'] }]],
      done: ['[[內質網：N 端疏水訊號肽。粒線體：N 端帶正電的序列。細胞核：核定位訊號（Lys、Arg）。過氧化體：C 端 SKL。溶體：甘露糖-6-磷酸。]]', '往內質網和粒線體的訊號用完就切掉；核定位訊號不切。',
        '溶體酵素在高基氏體順面被接上甘露糖-6-磷酸，反面的受器認出它，把酵素包進往溶體的囊泡。這一步有缺陷就是 I 細胞病。'] },
    { t: '分泌路徑：訊號肽與 SRP', kind: 'map', sub: 'secr', plain: 1, blanks: ['srp', 'dock', 'tl', 'cut'],
      intro: ['要分泌出去的蛋白質怎麼進到內質網？它是「一邊轉譯、一邊穿進去」的。',
        '轉譯一開始和其他蛋白質一樣，在游離的核糖體上。等最前面的訊號肽從核糖體冒出來，細胞質裡的訊號辨識顆粒（SRP，由 RNA 和蛋白質組成）立刻抓住它，並讓轉譯先暫停。',
        'SRP 把整個核糖體帶到內質網膜上，交給膜上的 SRP 受器，核糖體就停靠在一個通道上。SRP 離開（這一步消耗 GTP），轉譯恢復，新做出來的鏈直接穿過通道進到內質網腔。',
        '進去之後訊號肽被切掉，蛋白質在裡面摺疊、接上醣鏈，再用囊泡送往高基氏體。'],
      listTitle: '相關的考點',
      list: [['認出訊號肽的是', { a: 'srp', o: ['srp', 'sec61', 'spase'] }], ['多肽穿過內質網膜走的是', { a: 'sec61', o: ['srp', 'sec61', 'spase'] }], ['切掉訊號肽的是', { a: 'spase', o: ['srp', 'sec61', 'spase'] }], ['SRP 抓住訊號肽後，轉譯會', { a: 'pause', o: ['pause', 'faster'] }],
        ['分泌蛋白的 N-連結醣基化從哪裡開始', { a: 'er', o: ['er', 'golgi', 'cytos'] }], ['蛋白質最後的修飾、分類和包裝在', { a: 'golgi', o: ['er', 'golgi', 'cytos'] }]],
      done: ['[[訊號肽 → SRP 結合、轉譯暫停 → 停靠在內質網的 SRP 受器 → 多肽穿過轉位通道 → 訊號肽酶切掉訊號肽。]]', '分泌路徑：粗糙內質網 → 高基氏體（順面進、反面出）→ 分泌囊泡 → 細胞膜（胞吐）。',
        '高基氏體像物流中心：把醣鏈修完、依標記分類，分別送往溶體、細胞膜或細胞外。'] },
    { t: '分解：泛素與蛋白酶體', kind: 'map', sub: 'ubp', plain: 1, blanks: ['e1', 'e3', 'chain', 'pro'],
      intro: ['蛋白質不是做出來就一直留著。摺錯的、受損的、任務完成的（例如推動細胞週期的蛋白質），都要及時清掉。細胞有兩套分解系統。',
        '<b>溶體</b>：處理從細胞外吞進來的東西、膜蛋白，以及老舊的胞器（自噬作用）。',
        '<b>泛素－蛋白酶體系統</b>：處理細胞質和細胞核裡的個別蛋白質，很有選擇性。要分解的蛋白質先被貼上一種小蛋白質「泛素」（ubiquitin）當標籤，而且要貼成一串；蛋白酶體是一個桶狀的大型蛋白酶，只收有這串標籤的蛋白質。',
        '貼標籤要三個酵素接力：E1 用 ATP 把泛素活化，交給 E2，E3 負責認出該分解的目標，把泛素接上去。E3 的種類最多，專一性就靠它。'],
      listTitle: '相關的考點',
      list: [['泛素接在目標蛋白質的哪一種胺基酸上', { a: 'lysi', o: ['lysi', 'cysc', 'gluc'] }], ['決定「哪個蛋白質該被分解」的是', { a: 'e3', o: ['e1', 'e2', 'e3'] }], ['消耗 ATP 把泛素活化的是', { a: 'e1', o: ['e1', 'e2', 'e3'] }], ['蛋白酶體認的標籤是', { a: 'poly', o: ['poly', 'mono'] }],
        ['蛋白質被分解後，泛素本身', { a: 'recyc', o: ['recyc', 'eaten'] }], ['分解老舊胞器的途徑', { a: 'autoph', o: ['autoph', 'psome'] }], ['長期臥床、惡病質時，肌肉蛋白質大量流失，主要經由', { a: 'psome', o: ['autoph', 'psome'] }]],
      done: ['[[泛素化：E1 活化（用 ATP）→ E2 → E3 認目標，把泛素接到離胺酸上；貼成一串後由蛋白酶體分解。]]', '細胞內蛋白質的兩條分解途徑：溶體（吞進來的、膜蛋白、胞器）和泛素－蛋白酶體（細胞質和核內的個別蛋白質）。',
        '飢餓、臥床、癌症惡病質時，肌肉的泛素－蛋白酶體系統活性上升，是肌肉流失的主要原因；足夠的蛋白質和阻力運動可以對抗它。'] },
    { t: '國考重點', kind: 'cloze',
      intro: ['把這個單元考過和常考的敘述再走一遍。'],
      cloze: [['又稱分子伴護蛋白（molecular chaperone）、幫助蛋白質正確摺疊的是', { a: 'hsp', o: ['hsp', 'elastin', 'trypsin', 'collagen'], lang: 'en' }, '。'],
        ['要分泌到細胞外的蛋白質，由哪裡的核糖體合成？', { a: 'bound', o: ['free', 'bound'] }, '。'],
        ['引導蛋白質進入內質網的序列位在多肽的 N 端，稱為', { a: 'sigp', o: ['sigp', 'cpep'], lang: 'en' }, '。'],
        ['辨認訊號肽並把核糖體帶到內質網的是', { a: 'srp', o: ['srp', 'sec61', 'spase'], lang: 'en' }, '。'],
        ['N-連結醣基化的醣鏈接在哪一個胺基酸上？', { a: 'asn', o: ['asn', 'sert', 'lysi'], lang: 'en' }, '。'],
        ['把溶體酵素送往溶體的標記是', { a: 'm6p', o: ['m6p', 'kdel', 'pts'], lang: 'en' }, '。'],
        ['膠原蛋白中脯胺酸的羥化需要', { a: 'vitc', o: ['vitc', 'vitk', 'vitd', 'vitb6'] }, '。'],
        ['凝血因子中麩胺酸的 γ-羧化需要', { a: 'vitk', o: ['vitc', 'vitk', 'vitd', 'vitb6'] }, '。'],
        ['胰島素原（proinsulin）切掉什麼之後變成胰島素？', { a: 'cpep', o: ['sigp', 'cpep'], lang: 'en' }, '。'],
        ['成熟的胰島素由 A、B 兩條鏈組成，靠什麼連在一起？', { a: 'ssb', o: ['hbond', 'ssb', 'pepb'], lang: 'en' }, '。'],

    { t: 'DNA 定序：Sanger 的雙去氧法', kind: 'list',

  levels: [
    { t: '先看全貌：四條過膜的路', kind: 'ov', h: 344, legend: [['sT', '順著濃度差（不花能量）'], ['sH', '逆著濃度差（花能量）']], svg: function () { return MEM_OV(1); },
      intro: ['細胞膜的主體是磷脂雙層，中間那一層是油性的。所以它只讓一部分分子自由通過，叫做選擇性通透。',
        '一個分子過不過得去，看兩件事：它溶不溶於油（脂溶性的、不帶電的小分子可以直接穿過去），以及膜上有沒有專門給它走的蛋白質。',
        '圖上畫了四條路，由左到右：直接穿過磷脂雙層；走通道（像一條隧道）；靠載體蛋白（像旋轉門，一次載一個）；靠幫浦。',
        '前三條都是從多的地方往少的地方走，不花能量。第四條是硬把分子從少的地方搬到多的地方，要用 ATP。先把這兩大類的名字填出來。'],
      blanks: [{ id: 'p', x: 252, y: 276, w: 150, c: 'T', a: 'pas', o: ['pas', 'act'] }, { id: 'a', x: 252, y: 322, w: 150, c: 'H', a: 'act', o: ['pas', 'act'] }],
      listTitle: '圖上的編號，還有另外三種',
      list: [['編號 1：脂溶性的小分子直接穿過磷脂雙層', { a: 'sd', o: MEM_R }], ['編號 2：離子順著濃度差穿過通道蛋白', { a: 'ch', o: MEM_R }], ['編號 3：靠載體蛋白順著濃度差進出，不花能量', { a: 'fd', o: MEM_R }],
        ['編號 4：幫浦直接分解 ATP，逆著濃度差搬運', { a: 'pat', o: MEM_R }], ['不直接用 ATP，而是借用 Na⁺ 往細胞內衝的力量，順便帶別的分子', { a: 'sat', o: MEM_R }],
        ['水順著自己的濃度差通過膜', { a: 'osm', o: MEM_R }], ['用膜做成的囊泡一次搬很多、很大的分子', { a: 'bulk', o: MEM_R }]],
      done: ['[[被動運輸不花能量、順著濃度差]]：簡單擴散、經由通道的擴散、促進性擴散、滲透。', '[[主動運輸要花能量、逆著濃度差]]：初級（直接用 ATP）和次級（借用 Na⁺ 梯度）。',
        '另一種分法是看需不需要載體蛋白：促進性擴散和主動運輸都需要載體，所以都有專一性、會飽和。', '「促進性擴散」名字裡有擴散，所以是被動的，不要和主動運輸弄混。'] },
    { t: '擴散：誰可以直接過，誰要走門', kind: 'list',
      intro: ['擴散（diffusion）是分子因為自己的熱運動，從濃度高的地方往濃度低的地方淨移動。不需要細胞出力。',
        '國考常問「下列何者不是以擴散方式通過細胞膜」。判斷的方法就是看這個分子的性質：',
        '<b>不帶電、脂溶性</b>的（O₂、CO₂、類固醇激素、酒精）直接穿過磷脂雙層。<b>帶電的離子</b>一定要走通道。<b>水</b>主要走水孔蛋白。<b>葡萄糖、胺基酸</b>又大又極性，要靠載體。',
        '擴散只適合很短的距離。距離變兩倍，時間要四倍。所以身體長距離的運送要靠血液循環。'],
      listTitle: '它怎麼過細胞膜',
      list: [['氧氣和二氧化碳', { a: 'lip', o: ['lip', 'chn', 'aqp', 'car'] }], ['類固醇激素', { a: 'lip', o: ['lip', 'chn', 'aqp', 'car'] }], ['Na⁺、K⁺、Ca²⁺、Cl⁻', { a: 'chn', o: ['lip', 'chn', 'aqp', 'car'] }],
        ['水（大部分）', { a: 'aqp', o: ['lip', 'chn', 'aqp', 'car'] }], ['葡萄糖', { a: 'car', o: ['lip', 'chn', 'aqp', 'car'] }], ['胺基酸', { a: 'car', o: ['lip', 'chn', 'aqp', 'car'] }]],
      countsTitle: '擴散的速度', counts: [['膜兩邊的濃度差越大，擴散', '變快', ['變快', '變慢']], ['膜的表面積越大（例如小腸的微絨毛），擴散', '變快', ['變快', '變慢']],
        ['溫度越高，擴散', '變快', ['變快', '變慢']], ['要走的距離越長，擴散', '變慢', ['變快', '變慢']]],
      done: ['擴散速率和濃度差、膜的通透性、表面積、溫度成正比；和距離成反比。', '肺泡壁很薄、小腸有微絨毛，都是為了讓擴散更快：一個縮短距離，一個增加面積。', '離子通道很多是有閘門的（gated），平常關著，受到刺激才開。神經和肌肉的訊號就靠這個。'] },
    { t: '滲透與張力：紅血球泡在不同的水裡', kind: 'ov', h: 268, legend: [['kE', '紅血球'], ['sT', '水移動的方向']],
      intro: ['滲透（osmosis）就是水的擴散。水也是從「水多」的地方往「水少」的地方跑；溶質越濃的地方，水就越少。所以[[水會往溶質濃的那一邊跑]]。',
        '條件是膜讓水過、卻不讓溶質過。如果溶質自己也過得去，兩邊很快就一樣濃，水就不必搬家了。',
        '血漿的濃度大約是 300 mOsm。把紅血球泡進溶液裡，比較溶液和細胞內哪一邊濃，就知道水往哪邊跑、細胞會怎麼變。這種比較叫做張力（tonicity）。',
        '0.9% 的食鹽水和 5% 的葡萄糖水，濃度都和血漿一樣，所以是點滴最常用的溶液。'],
      svg: function () { var s = '', X = [62, 180, 298], lab = [['0.9% 食鹽水', '0.9% NaCl'], ['純水', 'Pure water'], ['濃鹽水', 'Strong saline']];
        X.forEach(function (x, i) { s += '<path d="M' + (x - 44) + ',40 L' + (x - 44) + ',136 Q' + (x - 44) + ',148 ' + (x - 32) + ',148 L' + (x + 32) + ',148 Q' + (x + 44) + ',148 ' + (x + 44) + ',136 L' + (x + 44) + ',40" fill="var(--k4)" stroke="var(--k4s)" stroke-width="1.5"/>' + MEM_RBC(x, 96, i) + tx(x, 28, T(lab[i][0], lab[i][1]), '', 11) + tx(x, 222, T('這種溶液是', 'this solution is'), 'm', 9.5); });
        s += sl('134,96 150,96', 'T', 3) + hd(155, 96, 0, 'T') + sl('226,96 210,96', 'T', 3) + hd(205, 96, 180, 'T') + sl('280,96 262,96', 'T', 3) + hd(257, 96, 180, 'T') + sl('316,96 334,96', 'T', 3) + hd(339, 96, 0, 'T');
        return s + tx(62, 166, T('水進出一樣多', 'no net water movement'), 'm', 9.5) + tx(180, 166, T('水進入細胞', 'water enters the cell'), 'm', 9.5) + tx(298, 166, T('水離開細胞', 'water leaves the cell'), 'm', 9.5); },
      blanks: [{ id: 't1', x: 62, y: 244, w: 104, a: 'iso', o: MEM_TO }, { id: 't2', x: 180, y: 244, w: 104, a: 'hypo', o: MEM_TO }, { id: 't3', x: 298, y: 244, w: 104, a: 'hyper', o: MEM_TO }],
      listTitle: '結果會怎樣',
      list: [['紅血球泡在低張溶液裡', { a: 'hemo', o: ['hemo', 'cren', 'same'] }], ['紅血球泡在高張溶液裡', { a: 'cren', o: ['hemo', 'cren', 'same'] }],
        ['把水留在血管裡、撐住血漿滲透壓的主要蛋白質', { a: 'alb', o: ['alb', 'glob', 'fib', 'hb'] }]],
      countsTitle: '數字', counts: [['血漿的滲透濃度大約是（mOsm）', '300', ['150', '300', '600']], ['和血漿等張的食鹽水濃度', '0.9%', ['0.45%', '0.9%', '5%']],
        ['和血漿等張的葡萄糖水濃度', '5%', ['0.9%', '5%', '10%']], ['1 莫耳的 NaCl 溶在水裡，算幾個滲透莫耳', '2', ['1', '2', '3']]],
      done: ['[[低張：水進細胞，脹破（溶血）。高張：水出細胞，皺縮。等張：不變。]]', '算滲透濃度時數的是顆粒數。NaCl 會解離成 Na⁺ 和 Cl⁻ 兩顆，葡萄糖不解離，只算一顆。',
        '白蛋白過不了微血管壁，所以能把水拉在血管裡。肝硬化或營養不良時白蛋白太少，水留在組織，就是水腫。', '等滲透不一定等張：尿素溶液的濃度即使和血漿一樣，因為尿素自己會進到細胞裡，水跟著進去，紅血球還是會脹破。'] },
    { t: '載體蛋白：三個特性與 GLUT 家族', kind: 'list',
      intro: ['葡萄糖太大又太極性，穿不過磷脂雙層，要靠膜上的載體蛋白。載體像酵素一樣要先和分子結合，所以有三個和酵素很像的特性：',
        '<b>專一性</b>：一種載體只載特定的分子。<b>競爭性</b>：長得像的分子會搶同一個載體。<b>飽和性</b>：載體的數量有限，全部載滿之後，再多的分子也不會變快。這個上限叫最大運輸量（Tm）。',
        '可以想成公車：每班的座位數固定，等車的人再多，一小時能載走的人數也有上限。',
        '載葡萄糖的促進性擴散載體叫 GLUT，有好幾型，分布在不同的組織。其中一型平常收在細胞裡面，要有訊號才會搬到細胞膜上。'],
      listTitle: '載體的特性',
      list: [['葡萄糖的載體不會去載果糖', { a: 'spec', o: ['spec', 'comp', 'satu'] }], ['兩種構造相似的糖同時存在時，各自的運輸都變慢', { a: 'comp', o: ['spec', 'comp', 'satu'] }],
        ['濃度一直提高，運輸速率卻停在一個上限', { a: 'satu', o: ['spec', 'comp', 'satu'] }], ['血糖太高，腎小管的載體來不及把葡萄糖全部收回，結果是', { a: 'glyc', o: ['glyc', 'ket', 'prot'] }],
        ['神經系統主要的葡萄糖載體，不需要胰島素', { a: 'g1', o: MEM_G }], ['肝臟和胰島 β 細胞的載體，雙向、容量大', { a: 'g2', o: MEM_G }], ['骨骼肌和脂肪組織的載體，受胰島素調控', { a: 'g4', o: MEM_G }],
        ['除了胰島素，還有什麼能讓 GLUT4 移到細胞膜上', { a: 'exer', o: ['exer', 'fast', 'slp'] }], ['血糖只有 60 mg/dL 時，仍然能從血液拿到大量葡萄糖的組織', { a: 'brain', o: ['brain', 'musc', 'fat'] }]],
      done: ['載體三特性：專一性、競爭性、飽和性。通道沒有飽和的問題，載體才有。', '[[GLUT4 在骨骼肌和脂肪組織，受胰島素和運動調控]]。胰島素阻抗就是 GLUT4 上不了細胞膜，葡萄糖進不去，血糖居高不下。',
        '腦用的 GLUT1、GLUT3 不靠胰島素，而且對葡萄糖的親和力高，所以血糖偏低時腦仍然優先拿得到。國考考過。', '糖尿病的尿糖，原因是腎小管的葡萄糖載體飽和了。'] },
    { t: '主動運輸：鈉鉀幫浦', kind: 'ov', h: 330, legend: [['kH', 'Na⁺'], ['kC', 'K⁺']],
      intro: ['細胞內 K⁺ 多、細胞外 Na⁺ 多。可是這兩種離子一直順著濃度差慢慢漏，為什麼不會漏到兩邊一樣？',
        '因為膜上有鈉鉀幫浦（Na⁺/K⁺ pump）不停地把它們搬回去。這是逆著濃度差搬，每搬一次要分解一個 ATP。直接用 ATP 的叫[[初級主動運輸]]。',
        '這個幫浦很花能量：一個細胞休息時的 ATP，大約有三分之一用在它身上。',
        '看圖數一數：每一次往外送幾個、往內送幾個。'],
      svg: function () { var s = tx(14, 22, T('細胞外（Na⁺ 多）', 'Outside (high Na⁺)'), 'm', 11, 'start') + tx(14, 196, T('細胞內（K⁺ 多）', 'Inside (high K⁺)'), 'm', 11, 'start') + MEM_BAND(80, 56) + '<ellipse class="pill" cx="180" cy="108" rx="60" ry="44" stroke-width="1.5"/>';
        [146, 166, 186].forEach(function (x) { s += dot(x, 46, 9, 'H'); }); [204, 224].forEach(function (x) { s += dot(x, 170, 9, 'C'); });
        s += sl('156,150 156,70', 'H', 3.5) + hd(156, 64, -90, 'H') + sl('214,66 214,146', 'C', 3.5) + hd(214, 152, 90, 'C') + tagC(96, 150, 'ATP → ADP + Pi', 'sp') + tx(180, 112, T('幫浦', 'pump'), 'm', 10);
        return s + cap(226, '每次往細胞外送出', 'Pumped out each cycle') + cap(266, '每次往細胞內送入', 'Pumped in each cycle') + cap(306, '能量來源', 'Energy source'); },
      blanks: [{ id: 'o', x: 262, y: 226, w: 170, c: 'H', a: 'na3', o: ['na3', 'na2', 'k3', 'k2'] }, { id: 'i', x: 262, y: 266, w: 170, c: 'C', a: 'k2', o: ['na3', 'na2', 'k3', 'k2'] }, { id: 'e', x: 262, y: 306, w: 170, a: 'atp', o: ['atp', 'gtp', 'grad'] }],
      listTitle: '幫浦的用途',
      list: [['不直接用 ATP，而是利用鈉鉀幫浦造出來的 Na⁺ 梯度', { a: 'sat', o: ['pat', 'sat', 'fd'] }], ['把 Ca²⁺ 打出細胞或打回內質網的鈣幫浦，屬於', { a: 'pat', o: ['pat', 'sat', 'fd'] }],
        ['幫浦停擺時，Na⁺ 留在細胞內，水跟著進來，細胞的體積會', { a: 'more', o: ['more', 'less'] }]],
      done: ['[[鈉鉀幫浦：3 個 Na⁺ 出、2 個 K⁺ 入、用 1 個 ATP。]]', '三個功能：維持 Na⁺ 和 K⁺ 的濃度梯度（給次級主動運輸和神經衝動用）；讓細胞內稍微偏負；避免細胞吸水脹大。',
        '每次送出去的正電荷比送進來的多一個，所以它本身也讓細胞內變得更負一點。', '鈣幫浦把細胞質的 Ca²⁺ 壓得非常低，Ca²⁺ 一放進來就是訊號。肌肉收縮和神經傳遞物質的釋放都靠這個。'] },
    { t: '次級主動運輸：小腸怎麼吸收葡萄糖', kind: 'ov', h: 306, legend: [['sH', 'Na⁺'], ['sT', '葡萄糖'], ['sC', 'K⁺']], svg: MEM_EPI, blanks: [],
      intro: ['小腸要把腸腔裡的葡萄糖全部吸乾淨，連濃度比細胞裡還低的時候也要吸。這是逆著濃度差，光靠擴散辦不到。',
        '做法是搭便車。細胞外的 Na⁺ 很想衝進細胞，膜上有一種載體規定：Na⁺ 要進來，必須順便帶一個葡萄糖。Na⁺ 往下衝的力量，就把葡萄糖一起拖進來。',
        '這不直接用 ATP，但 Na⁺ 的梯度是鈉鉀幫浦花 ATP 造出來的，所以叫次級主動運輸。兩個分子同方向的叫同向運輸，反方向的叫反向運輸。',
        '葡萄糖進了細胞之後，還要從另一側出去才到得了血液。看圖上三個編號，各是哪一種運輸。'],
      listTitle: '圖上的三個編號',

    { t: '先看全貌：神經系統怎麼分工', kind: 'ov', h: 410, svg: NAP_TREE,

    { t: '神經元的構造', kind: 'ov', h: 236, legend: [['kT', '包在軸突外面的絕緣層']], svg: NAP_N, blanks: [],

        '一個神經元有三個部分。短而多分支的突起負責接收訊號；中間膨大的部分有細胞核，是代謝中心；一條很長的突起負責把訊號送出去，最長可以到一公尺。',

    { t: '神經膠細胞：六種幫手', kind: 'list',

      listTitle: '是哪一種細胞',

        ['中樞的免疫細胞，會吞噬外來物和壞死的碎片', { a: 'mic', o: NAP_G }], ['中樞數量最多；回收 K⁺ 和神經傳遞物質、供應養分、參與血腦障壁', { a: 'ast', o: NAP_G }],

    { t: '動作電位：一次神經衝動的四個階段', kind: 'ov', h: 320, legend: [['sE', '上升'], ['sI', '下降']], svg: function () { return NAP_AP(0); }, blanks: [],
      intro: ['上一個單元說，靜止時膜電位大約 −70 mV，靠近 K⁺ 的平衡電位（−90）；Na⁺ 的平衡電位是 +66。',
        '神經元的軸突膜上有兩種平常關著、[[膜電位一變就會打開]]的通道，叫電位閘控通道。一種給 Na⁺ 走，一種給 K⁺ 走。',
        '受到刺激時，如果膜電位升到一個門檻（閾值），第一種通道會突然大開。回想「誰的通道開，膜電位就往誰的平衡電位靠」，就能推出曲線為什麼往上衝。',
        '大約一毫秒後這種通道自己關上，換第二種通道打開，曲線就掉回來。因為第二種通道關得慢，還會掉得比原來更低一點。',

        ['編號 2 是因為哪一種離子流動', { a: 'nain', o: ['nain', 'kout', 'cain', 'clin'] }], ['編號 3 是因為哪一種離子流動', { a: 'kout', o: ['nain', 'kout', 'cain', 'clin'] }],
        ['編號 2 的時候，Na⁺ 進來使膜更去極化，又讓更多 Na⁺ 通道打開。這是', { a: 'posf', o: ['posf', 'negf'] }]],
      countsTitle: '從圖上讀數字（mV）', counts: [['靜止膜電位', '−70', ['−90', '−70', '−55', '+30']], ['要達到才會引發動作電位的閾值', '−55', ['−90', '−70', '−55', '+30']], ['動作電位的最高點大約', '+30', ['−55', '0', '+30', '+66']]],
      done: ['[[去極化＝Na⁺ 內流；再極化＝K⁺ 外流。]]兩者都是順著濃度差的擴散，不直接用 ATP。', '閾值大約 −55 mV。上升期是正回饋：越去極化，Na⁺ 通道開越多。',
        '最高點到不了 +66，是因為 Na⁺ 通道很快就自己關上（不活化），同時 K⁺ 通道開始打開。', '鈉鉀幫浦不參與動作電位本身。它的工作是事後慢慢把離子搬回去，長期維持濃度差。'] },
    { t: '全有全無與不反應期', kind: 'ov', h: 320, legend: [['kE', 'A'], ['kI', 'B']], svg: function () { return NAP_AP(1); }, blanks: [],
      intro: ['動作電位有幾個和一般電訊號不一樣的特性。',

        ['局部麻醉藥 procaine、河魨毒素、麻痺性貝毒都會阻斷電位閘控 Na⁺ 通道，結果是', { a: 'noap', o: ['noap', 'bigger', 'rmp0'] }]],
      done: ['[[全有全無律（all-or-none）]]：動作電位的大小固定，強度用頻率編碼。', '絕對不反應期：Na⁺ 通道不活化，完全不能再興奮。相對不反應期：K⁺ 還在外流，需要更強的刺激。',
        '阻斷電位閘控 Na⁺ 通道，動作電位就無法產生，但靜止膜電位幾乎不受影響（靜止膜電位靠的是 K⁺ 滲漏通道）。國考考過 procaine。', '吃到被麻痺性貝毒（saxitoxin）污染的貝類會麻痺，機制也是這個。'] },
    { t: '傳導：有沒有髓鞘差很多', kind: 'list',

        ['軸突被切斷後，哪裡的比較有機會再生', { a: 'pnsr', o: ['pnsr', 'cnsr'] }], ['腦和脊髓裡，有髓鞘的軸突聚集的地方看起來是', { a: 'white', o: ['white', 'gray'] }]],

    { t: '先看全貌：光怎麼走到視網膜', kind: 'ov', h: 216, legend: [['sT', '折射最多的地方'], ['kH', '可以調整焦距'], ['sC', '感光'], ['sE', '控制進光量']], svg: SENB_EYE, blanks: [],
      intro: ['眼睛的構造很像相機：前面有透明的鏡頭把光聚焦，中間有光圈控制進光量，最後面有感光的底片。',

      done: ['[[光的路徑：角膜 → 房水 → 瞳孔 → 水晶體 → 玻璃體 → 視網膜。]]', '[[折射最多的是角膜；能調整焦距的是水晶體。]]所以近視雷射手術改的是角膜的弧度。', '瞳孔：副交感神經使它縮小，交感神經使它放大。這在自主神經單元出現過。'] },
    { t: '看遠看近：調適與屈光異常', kind: 'cloze',

    { t: '視網膜：視桿與視錐', kind: 'list',
      intro: ['視網膜上有兩種感光細胞，名字來自它們的形狀，分工很清楚。',

        '另一種需要比較亮的光才工作，但能分辨顏色、看得清楚細節。它集中在視網膜正中央的一小塊，我們盯著看東西時，影像就落在這裡。',

      done: ['[[視桿細胞：暗視覺、黑白、周邊、很敏感。視錐細胞：明視覺、色彩、中央凹、很敏銳。]]', '訊號的方向：感光細胞 → 雙極細胞 → 神經節細胞 → 視神經。', '在暗處看微弱的星星，稍微偏開一點看反而清楚，因為中央凹只有視錐細胞。',
        '葉黃素和玉米黃素存在於深綠色蔬菜、玉米、蛋黃中，是黃斑色素的來源。'] },
    { t: '視紫質與維生素 A', kind: 'map', sub: 'rhod', plain: 1, blanks: ['l', 'g', 'c', 'h'],
      intro: ['視桿細胞裡的感光色素由兩部分組成：一個蛋白質，加上一個由維生素 A 做成的小分子。這個小分子平常是彎的。',
        '光子打到它，它就被拉直。這個形狀的改變讓蛋白質也跟著變形，啟動細胞裡的訊息傳遞。',
        '接下來的事情和直覺相反。感光細胞在黑暗中反而是活躍的：鈉離子通道開著，細胞處在去極化的狀態，一直在釋放神經傳遞物質。',
        '光的作用是把這一切關掉。拉直的小分子隨後和蛋白質分開，要重新變回彎的才能再用，過程中會損耗一些，必須由血液補充維生素 A。'],

        ['暗適應的過程中，感光色素的量', { a: 'up', o: ['up', 'down'] }], ['植物性食物中可以轉換成維生素 A 的色素', { a: 'bcar', o: ['bcar', 'lut'] }]],
      done: ['[[光 → 11-順式視黃醛變成全反式 → cGMP 下降 → Na⁺ 通道關閉 → 感光細胞過極化。]]', '[[視紫質＝視蛋白＋視黃醛（維生素 A 的醛型）。維生素 A 缺乏 → 夜盲症 → 乾眼症。]]', '暗適應才是敏感度增加（可達十萬倍）：在暗處，被光分解的色素慢慢重新合成。',

    { t: '聽覺：把空氣的振動變成電訊號', kind: 'map', sub: 'hear', plain: 1, blanks: ['tm', 'os', 'fl', 'bm'],
      intro: ['聲音是空氣的壓力波。耳朵要把這麼微弱的空氣振動，傳進充滿液體的內耳，中間有一個問題：聲波從空氣進到液體，絕大部分會被反彈掉。',
        '中耳解決了這個問題。一片薄膜接住聲波，後面連著三塊人體最小的骨頭，像槓桿一樣把振動集中到一個小很多的膜上，壓力就被放大了。',
        '內耳是一條捲成蝸牛殼形狀的管子。振動在裡面的液體中傳播，帶動管子裡的一片膜上下擺動。坐在這片膜上的感覺細胞，頂端的纖毛被彎曲，就產生電訊號。',
        '這片膜從頭到尾的寬窄和軟硬不同，所以不同音高的聲音會讓它不同的位置振動得最厲害。'],
      listTitle: '音高、響度與耳聾',
      list: [['聲音的高低取決於聲波的', { a: 'freq', o: ['freq', 'amp'] }], ['聲音的大小取決於聲波的', { a: 'amp', o: ['freq', 'amp'] }], ['高音讓基底膜的哪裡振動最大', { a: 'base', o: ['base', 'apex'] }], ['耳蝸裡的聽覺感覺構造', { a: 'corti', o: ['corti', 'oss'] }],
        ['毛細胞的纖毛彎曲時，流進細胞使它去極化的離子', { a: 'kplus', o: ['kplus', 'naplus'] }], ['連接中耳和咽、平衡鼓膜兩側氣壓的管道', { a: 'eust', o: ['eust', 'oss'] }], ['耳垢塞住、中耳炎、聽小骨硬化', { a: 'condd', o: ['condd', 'sensd'] }],
        ['長期噪音傷害毛細胞、老年性的聽力退化', { a: 'sensd', o: ['condd', 'sensd'] }], ['聽覺皮質的位置', { a: 'tem', o: ['occ', 'tem'] }]],
      done: ['[[鼓膜 → 聽小骨（錘骨、砧骨、鐙骨）→ 卵圓窗 → 耳蝸的液體 → 基底膜 → 毛細胞 → 聽神經。]]', '[[頻率決定音調；振幅決定響度。高音在耳蝸基部，低音在頂部。]]', '毛細胞泡在高鉀的內淋巴裡，所以纖毛上的通道一打開，是 K⁺ 流進來讓細胞去極化，和一般的細胞不同。',

      intro: ['肌肉放鬆的時候，細肌絲上能讓橫橋接上去的位置是被蓋住的。蓋住它的是一條長長的蛋白質，由另一個小蛋白質複合體把它固定在那個位置。',
        '要讓肌肉收縮，就是要把這個蓋子移開。移開的鑰匙是一種離子，平常被關在細胞裡一個特化的內質網裡。',
        '神經的命令怎麼傳到細胞深處的這個倉庫？肌細胞的膜往細胞內部凹進去，形成一條條小管子，剛好緊貼著倉庫。動作電位順著小管傳進去，倉庫的門就打開了。',
        '突觸那個單元學過神經肌肉接合處，這一關把它接到收縮。'],
      listTitle: '受器、放鬆與疾病',
      list: [['運動終板上的乙醯膽鹼受器是', { a: 'nic', o: ['nic', 'mus'] }], ['Ca²⁺ 結合的對象是', { a: 'tropo', o: ['tropo', 'tropm', 'calm'] }], ['平常蓋住肌動蛋白上結合位的是', { a: 'tropm', o: ['tropo', 'tropm', 'calm'] }], ['肌肉要放鬆，Ca²⁺ 怎麼離開細胞質', { a: 'pump', o: ['pump', 'diffu'] }],
        ['自體抗體破壞終板上的乙醯膽鹼受器，肌肉無力、容易疲勞', { a: 'mg', o: ['mg', 'dmd'] }], ['阻止運動神經元釋出乙醯膽鹼，造成肌肉麻痺', { a: 'botox', o: ['botox', 'curare'] }], ['占住終板上的受器、不讓乙醯膽鹼結合', { a: 'curare', o: ['botox', 'curare'] }]],
      done: ['[[動作電位 → 橫小管 → 肌漿網釋出 Ca²⁺ → Ca²⁺ 結合肌鈣蛋白（troponin）→ 原肌凝蛋白（tropomyosin）移開 → 橫橋形成。]]', '[[放鬆：鈣幫浦（Ca²⁺-ATPase）把 Ca²⁺ 主動運回肌漿網。]]', '骨骼肌收縮用的 Ca²⁺ 全部來自自己的肌漿網，不需要細胞外的鈣；心肌和平滑肌則需要細胞外的鈣流進來。',
        '血鈣太低時手足抽搐，不是因為肌肉缺鈣，而是神經細胞膜變得太容易興奮。'] },
    { t: '收縮的強弱：運動單位、加成與強直', kind: 'cloze',
      intro: ['單一條肌纖維只有兩種狀態：收縮或不收縮。但整塊肌肉卻可以輕輕拿起雞蛋，也可以用力舉起啞鈴。力量的調整靠兩個辦法。',
        '第一個辦法是改變動用的肌纖維數目。一個運動神經元和它管的所有肌纖維是一個單位，一起收縮。要出更大的力，就叫更多的單位加入。',
        '第二個辦法是提高刺激的頻率。一次刺激引起一次短暫的收縮；第二次刺激如果在還沒放鬆完就來，力量會疊上去。頻率高到完全沒有放鬆的空檔，就成了平穩、持續的收縮。',
        '另外，肌肉出了力不一定會縮短，要看對抗的負荷。'],
      cloze: [
        ['一個運動神經元和它所支配的全部肌纖維，稱為', { a: 'mu', o: ['mu', 'sarc'] }, '。'],
        ['負責精細動作的肌肉（例如眼球的肌肉），每個運動單位的肌纖維數', { a: 'small', o: ['small', 'large'] }, '。'],
        ['要增加收縮的力量，中樞神經的做法是', { a: 'recruit', o: ['recruit', 'twitch'] }, '。'],
        ['刺激的頻率高到肌肉沒有時間放鬆，形成平穩持續的收縮，稱為', { a: 'tetany', o: ['tetany', 'twitch', 'summ'] }, '。'],
        ['肌肉縮短、把重物舉起來，張力大致不變，是', { a: 'isot', o: ['isot', 'isom'] }, '。'],
        ['用力推牆，肌肉出了力但長度不變，是', { a: 'isom', o: ['isot', 'isom'] }, '。'],
        ['下樓梯、放下重物時，肌肉一邊出力一邊被拉長，是', { a: 'ecc', o: ['conc', 'ecc'] }, '。'],
        ['心肌因為不反應期很長，不會發生的是', { a: 'tetany', o: ['tetany', 'twitch'] }, '。']
      ],
      done: ['[[力量的調節：徵召更多運動單位，和提高刺激頻率（加成、強直）。]]', '[[等張收縮：長度改變。等長收縮：長度不變。]]', '運動單位越小，動作越精細；越大，力量越強。', '離心收縮（肌肉一邊出力一邊被拉長）最容易造成運動後的延遲性肌肉痠痛。'] },
    { t: '肌肉的能量：先用什麼、後用什麼', kind: 'list',
      intro: ['肌肉裡現成的 ATP 只夠用幾秒鐘，必須一邊用一邊補。補充的來源有三個，速度和續航力剛好相反。',
        '<b>最快</b>：肌肉裡存著一種高能磷酸化合物，可以直接把磷酸交給 ADP，一步就變回 ATP。但存量只夠十秒左右，是短跑和舉重的來源。',
        '<b>其次</b>：把葡萄糖或肝醣只分解到一半，不需要氧，速度快但產量少，還會堆積一種酸。可以撐一兩分鐘。',
        '<b>最慢但最持久</b>：在粒線體把燃料完全氧化。靜止和輕度活動時，燃料主要是脂肪酸；運動強度越高，用醣的比例越高。'],
      listTitle: '能量系統與燃料',
      list: [['運動剛開始的前幾秒，ATP 的主要來源', { a: 'pcr', o: MUS_E }], ['400 公尺賽跑這種一兩分鐘的全力運動，主要來源', { a: 'anaer', o: MUS_E }], ['馬拉松', { a: 'aer', o: MUS_E }], ['靜止和輕度活動時，肌肉最主要的燃料', { a: 'ffa', o: MUS_F }],
        ['中高強度運動時，最重要的燃料', { a: 'mglyc', o: MUS_F }], ['無氧糖解的終產物', { a: 'lact', o: ['lact', 'urea'] }], ['血中乳酸開始明顯上升時的運動強度', { a: 'lt', o: ['lt', 'vo2', 'debt'] }], ['一個人每分鐘最多能用掉多少氧', { a: 'vo2', o: ['lt', 'vo2', 'debt'] }],
        ['運動結束後呼吸還喘一陣子，多吸的氧', { a: 'debt', o: ['lt', 'vo2', 'debt'] }], ['肌酸的代謝產物，每天產生的量和肌肉量成正比', { a: 'crn', o: ['crn', 'urea'] }], ['肌肉的肝醣不能變成血糖，因為肌肉缺少', { a: 'g6p', o: ['g6p', 'hk'] }],
        ['運動時肌肉收縮本身就能讓哪個運輸蛋白移到細胞膜上，不需要胰島素', { a: 'g4', o: ['g4', 'g2'] }], ['耐力訓練之後，乳酸閾值會', { a: 'up', o: ['up', 'down'] }]],
      done: ['[[三個能量系統：磷酸肌酸（約 10 秒）→ 無氧糖解（1 到 2 分鐘）→ 有氧呼吸（長時間）。]]', '[[靜止時肌肉主要燒脂肪酸；運動強度越高，越依賴肝醣。肝醣用完就是「撞牆」。]]',
        '肌酸由肝臟和腎臟用精胺酸、甘胺酸、甲硫胺酸合成，肉類和魚也有。補充肌酸可以增加磷酸肌酸的存量，對短時間高強度的運動有幫助。', '肌肉缺乏葡萄糖-6-磷酸酶，所以肌肉的肝醣只能自己用。國考考過。',
        '運動讓 GLUT4 移到膜上、提高胰島素的敏感性，是運動改善血糖的原因。耐力賽前幾天提高醣類攝取，可以把肌肉肝醣存到比平常更高。'] },
    { t: '慢縮與快縮肌纖維，和訓練的適應', kind: 'list',
      intro: ['同一塊肌肉裡有不同類型的肌纖維，比例因人、因肌肉而異。',
        '一類收縮慢、力量小，但可以一直做下去不累。它靠有氧呼吸，所以配備了很多粒線體和微血管，還有儲存氧的紅色蛋白質，看起來是紅的。',
        '另一類收縮快、力量大，但很快就累。它靠無氧糖解，肝醣存得多，粒線體和微血管少，看起來比較白。',
        '雞腿是紅肉、雞胸是白肉，就是這個差別：雞整天站著走著，但很少飛。'],
      listTitle: '是哪一類',
      list: [['粒線體多、微血管多、肌紅素多', { a: 'slowf', o: MUS_FT }], ['肝醣多、糖解酵素多、容易疲勞', { a: 'fastf', o: MUS_FT }], ['維持姿勢的肌肉裡比較多', { a: 'slowf', o: MUS_FT }], ['短跑和舉重選手比較發達', { a: 'fastf', o: MUS_FT }], ['馬拉松選手比例比較高', { a: 'slowf', o: MUS_FT }],
        ['老化時流失得比較多', { a: 'fastf', o: MUS_FT }], ['讓紅肌呈現紅色、儲存氧的蛋白質', { a: 'mb', o: ['mb', 'hb'] }], ['重量訓練使肌肉變大，主要是因為', { a: 'hyper', o: ['hyper', 'hyperp'] }], ['修補受損肌纖維的幹細胞', { a: 'sat', o: ['sat', 'myost'] }],
        ['年紀大時肌肉量和肌力流失', { a: 'sarcop', o: ['sarcop', 'dmd'] }], ['刺激肌肉蛋白質合成最有效的胺基酸', { a: 'leu', o: ['leu', 'gly'] }]],
      done: ['[[慢縮肌（第 I 型，紅肌）：有氧、粒線體和肌紅素多、耐疲勞。快縮肌（第 II 型，白肌）：糖解、肝醣多、易疲勞。]]', '快縮肌的肝醣比較多、粒線體比較少；慢縮肌多見於維持姿勢的肌肉。',
        '耐力訓練：粒線體和微血管增加、更會用脂肪酸、乳酸閾值提高。肌力訓練：肌纖維變粗。', '肌少症的營養對策是足夠的蛋白質（每餐都要有、富含白胺酸）加上阻力運動，並注意維生素 D。'] },
    { t: '骨骼肌的反射', kind: 'list',
      intro: ['肌肉裡有兩種感覺器，隨時向脊髓報告肌肉的狀態，不需要經過大腦就能做出修正。',
        '一種藏在肌肉裡面，和肌纖維平行，偵測的是肌肉被拉長了多少。肌肉突然被拉長，它就叫同一塊肌肉收縮，把長度拉回來。醫師用小槌敲膝蓋下方就是在測這個。',
        '另一種在肌腱裡，和肌肉串聯，偵測的是張力。張力太大時，它叫肌肉放鬆，免得肌腱被扯斷。',
        '一塊肌肉收縮時，對側功能相反的那塊必須同時放鬆，動作才做得出來，這也是在脊髓裡安排好的。'],
      listTitle: '感覺器與反射',
      list: [['偵測肌肉長度的感覺器', { a: 'spin', o: ['spin', 'gto'] }], ['偵測肌腱張力的感覺器', { a: 'gto', o: ['spin', 'gto'] }], ['敲膝蓋下方的肌腱，小腿踢出去', { a: 'stretch', o: ['stretch', 'recip'] }], ['這個反射在脊髓裡經過幾個突觸', { a: 'mono', o: ['mono', 'poly'] }],
        ['支配一般肌纖維、讓肌肉出力的運動神經元', { a: 'alpha', o: ['alpha', 'gamma'] }], ['支配肌梭裡的小肌纖維、調整肌梭敏感度的運動神經元', { a: 'gamma', o: ['alpha', 'gamma'] }], ['主動肌收縮時，拮抗肌同時被抑制', { a: 'recip', o: ['stretch', 'recip'] }],
        ['脊髓前角的運動神經元或周邊神經受損：肌肉無力、張力低、反射消失、萎縮', { a: 'flac', o: ['flac', 'spas'] }], ['大腦皮質或下行路徑受損（例如中風）：肌肉張力高、反射過強', { a: 'spas', o: ['flac', 'spas'] }]],
      done: ['[[肌梭（muscle spindle）偵測長度 → 牽張反射，使肌肉收縮。高基氏肌腱器（Golgi tendon organ）偵測張力 → 使肌肉放鬆。]]', '膝跳反射是唯一的單突觸反射：感覺神經元直接接到運動神經元。', '下運動神經元受損是弛緩性麻痺；上運動神經元受損是痙攣性麻痺。'] },
    { t: '三種肌肉的比較', kind: 'list',
      intro: ['身體有三種肌肉。它們都靠肌動蛋白和肌凝蛋白的橫橋出力，也都由 Ca²⁺ 啟動，但在構造、控制和 Ca²⁺ 的用法上各不相同。',
        '<b>心肌</b>有橫紋，細胞之間有通道相連，一個細胞興奮就傳給全部，像一個細胞一樣同步收縮。',
        '<b>平滑肌</b>沒有橫紋，在血管、消化道、氣道、膀胱、子宮的壁上。它沒有肌鈣蛋白，Ca²⁺ 是接到另一個蛋白質上，再去活化一個激酶，把肌凝蛋白磷酸化之後才能形成橫橋。所以它收縮慢，但可以長時間維持、很省能量。',
        '平滑肌又分兩型。大部分是細胞之間通道很多的那一型，會自己產生節律。另一型的每個細胞要各自接受神經的指令，才能做很精細的控制。'],
      listTitle: '是哪一種',
      list: [['有橫紋、受意識控制、多核', { a: 'skm', o: MUS_T }], ['有橫紋、不隨意、細胞靠閏盤相連', { a: 'cam', o: MUS_T }], ['沒有橫紋、沒有肌節', { a: 'smm', o: MUS_T }], ['沒有肌鈣蛋白，Ca²⁺ 結合的是攜鈣素', { a: 'smm', o: MUS_T }],
        ['平滑肌裡，被 Ca²⁺ 和攜鈣素活化的酵素', { a: 'mlck', o: ['mlck', 'atpase'] }], ['收縮所需的 Ca²⁺ 完全來自肌漿網、不需要細胞外的鈣', { a: 'skm', o: MUS_T }], ['心肌和單一單元平滑肌的細胞之間，傳遞電訊號的構造', { a: 'gap', o: ['gap', 'tt'] }],
        ['消化道、子宮、膀胱的平滑肌屬於', { a: 'su', o: ['su', 'mu2'] }], ['每個細胞要有自己的神經支配、不會自發放電的是', { a: 'mu2', o: ['su', 'mu2'] }], ['多單元平滑肌的例子', { a: 'ciliary', o: ['ciliary', 'gut'] }],
        ['多單元平滑肌的特徵', { a: 'fewno', o: ['fewno', 'manyno', 'fewyes'] }]],
      done: ['[[多單元（multiunit）平滑肌：間隙接合很少，與神經末梢不會形成終板。]]國考考過。自主神經的末梢是一串膨大，傳遞物質灑向附近的細胞，沒有骨骼肌那種運動終板。', '[[平滑肌：Ca²⁺ → 攜鈣素（calmodulin）→ 肌凝蛋白輕鏈激酶（MLCK）→ 肌凝蛋白磷酸化 → 收縮。]]',
        '單一單元平滑肌間隙接合多，有節律點，被拉長時會收縮（例如腸道、膀胱）。', '心肌和平滑肌都需要細胞外的 Ca²⁺ 流進來，所以鈣離子通道阻斷劑對心臟和血管有效，對骨骼肌沒有影響。'] },
    { t: '國考重點', kind: 'cloze',
      intro: ['把這個單元最常考的觀念走一次。有幾題的選項只有英文。'],
      cloze: [
        ['多單元（multiunit）平滑肌的特徵是', { a: 'fewno', o: ['fewno', 'manyno', 'fewyes'] }, '。'],

        ['骨骼肌收縮時，Ca²⁺ 結合的蛋白質是', { a: 'tropo', o: ['tropo', 'tropm', 'calm'], lang: 'en' }, '。'],
        ['平滑肌收縮時，Ca²⁺ 結合的蛋白質是', { a: 'calm', o: ['tropo', 'tropm', 'calm'], lang: 'en' }, '。'],
        ['肌肉收縮時長度不變的是', { a: 'ab', o: ['ab', 'ib', 'hz'], lang: 'en' }, '。'],

        ['粒線體與肌紅素較多、不易疲勞的是', { a: 'slowf', o: MUS_FT, lang: 'en' }, '。'],
        ['偵測肌肉長度變化的感覺器是', { a: 'spin', o: ['spin', 'gto'], lang: 'en' }, '。'],

        ['骨骼肌的 Ca²⁺ 儲存在', { a: 'sr', o: ['sr', 'tt'], lang: 'en' }, '。'],
        ['肌肉出力但長度不變的收縮是', { a: 'isom', o: ['isot', 'isom'], lang: 'en' }, '。']

    { t: '總複習（英文作答）', kind: 'ov', h: 254, force: 'en', legend: [['sI', '細肌絲'], ['sE', '粗肌絲']], svg: MUS_SAR, blanks: [],
      intro: ['同一張肌節的圖，用英文把七個編號和相關的名詞填出來。'], tip: '這一關固定用英文作答。',
      listTitle: '肌節與名詞',

  [40, 102, 164, 228].forEach(function (y) { s += arrow(174, y, 186, y); });
