    { t: '先天性免疫的成員', kind: 'list',
      intro: ['病原體要先穿過物理和化學的屏障。穿過之後，守在組織裡的細胞靠著一類受器，認出細菌和病毒才有的分子樣式，立刻動手，同時發出警報。',
        '動手的主力是吞噬細胞：把病原體整個吞進去，用溶體裡的酵素和活性氧分解掉。',
        '血漿裡還有一群平常沒有活性的蛋白質，被活化後一個切一個，像凝血因子那樣連鎖反應。產物有的幫病原體「貼標籤」讓吞噬細胞更容易抓，有的召喚白血球過來，最後幾個在細菌的膜上打洞。',
        '對付病毒則另有辦法：被感染的細胞放出訊號，通知附近的細胞提高警戒。'],
      listTitle: '是哪一個',
      list: [['數量最多、最先到達感染處的吞噬細胞', { a: 'neut', o: ['neut', 'macro', 'nk', 'mast'] }], ['由單核球變成，吞噬力強、壽命長，也負責清理善後', { a: 'macro', o: ['neut', 'macro', 'nk', 'mast'] }], ['不需要認得特定抗原，就能殺死被病毒感染的細胞和腫瘤細胞', { a: 'nk', o: ['neut', 'macro', 'nk', 'mast'] }],
        ['細胞表面辨識病原體共同分子樣式的受器', { a: 'tlr', o: ['tlr', 'mhc2'] }], ['被病毒感染的細胞分泌，讓鄰近的細胞抵抗病毒複製', { a: 'ifn', o: ['ifn', 'comp', 'il1'] }], ['血漿中一群連鎖活化的蛋白質', { a: 'comp', o: ['ifn', 'comp', 'il1'] }],
        ['補體片段包在細菌表面，讓吞噬細胞更容易抓住', { a: 'opson', o: ['opson', 'chemo', 'mac'] }], ['補體最後幾個成分在細菌的膜上打洞', { a: 'mac', o: ['opson', 'chemo', 'mac'] }], ['巨噬細胞分泌、作用在下視丘引起發燒的細胞介素', { a: 'il1', o: ['ifn', 'comp', 'il1'] }]],
      done: ['[[吞噬細胞：嗜中性球最先到，巨噬細胞隨後。自然殺手細胞（NK）屬於先天性免疫。]]', '[[補體的三個作用：調理作用、趨化作用、膜攻擊複合體。]]', '發燒是有用的：體溫高一點，白血球比較活躍，細菌比較難長。', '吞噬細胞用來殺菌的活性氧，要靠 NADPH 來產生，所以五碳糖磷酸途徑對白血球很重要。'] },
    { t: '發炎：紅、熱、腫、痛', kind: 'map', sub: 'infl', plain: 1, blanks: ['mast', 'vas', 'neu', 'mon'],
      intro: ['組織受傷或被感染時，局部會出現四個典型的現象：紅、熱、腫、痛。發炎不是壞事，它是把血液裡的援軍送到現場的辦法。',
        '守在組織裡的細胞先放出一些化學物質。其中最有名的一個讓附近的小血管擴張，血流變多；又讓微血管的壁變鬆，血漿和蛋白質滲出來。',
        '血流多，所以紅和熱；血漿滲出，所以腫；另外一些化學物質刺激痛覺神經，所以痛。',
        '白血球順著化學物質的濃度爬過來，從血管壁的縫隙鑽進組織。誰先到、誰後到有固定的順序。'],
      listTitle: '症狀、指標與營養',
      list: [['發炎的紅和熱，原因是', { a: 'vd', o: ['vd', 'perm'] }], ['發炎的腫，原因是', { a: 'perm', o: ['vd', 'perm'] }], ['使血管擴張、通透性增加的主要物質', { a: 'hist', o: ['hist', 'ifn'] }], ['讓痛覺神經變敏感、阿斯匹靈可以抑制其合成的物質', { a: 'pge', o: ['pge', 'hist'] }],
        ['發炎時由肝臟大量製造、常用來當發炎指標的蛋白質', { a: 'crp', o: ['crp', 'alb'] }], ['發炎時肝臟減少製造、血中濃度下降的蛋白質', { a: 'alb', o: ['crp', 'alb'] }], ['發炎時上升、把鐵鎖在細胞裡不讓細菌利用的激素', { a: 'hepc', o: ['hepc', 'epo'] }]],
      done: ['[[發炎的順序：組織胺 → 血管擴張和通透性增加 → 嗜中性球先到 → 單核球變成巨噬細胞 → 修復。]]', '[[發炎時 C 反應蛋白（CRP）上升；白蛋白、前白蛋白、運鐵蛋白下降。]]',
        '所以住院病人的白蛋白偏低，不一定是營養不良，可能只是有發炎。判讀白蛋白時要同時看 CRP。', '慢性發炎時鐵調素偏高，鐵被鎖住，造成慢性病貧血。這時補鐵效果不好。'] },
    { t: '體液性免疫：B 細胞與抗體', kind: 'ov', h: 208, legend: [['sI', '重鏈'], ['sH', '輕鏈'], ['sE', '可變區']], svg: IMM_AB, blanks: [],
      intro: ['每一個 B 細胞的表面帶著一種抗體當作受器，只認得一種抗原。全身有幾百萬種不同的 B 細胞，平常每種只有少數幾個。',
        '某個 B 細胞碰到它認得的抗原，又得到輔助型 T 細胞的許可之後，開始大量分裂。後代大部分變成專門製造抗體的工廠，一小部分留下來當記憶。',
        '抗體是 Y 字形的蛋白質，由四條多肽鏈組成。Y 的兩個尖端每種抗體都不同，用來結合抗原；Y 的柄決定這個抗體屬於哪一類、接下來會引發什麼反應。',
        '抗體本身不殺菌。它的作用是把病原體標記起來、黏成一團、蓋住毒素，再交給吞噬細胞和補體去處理。抗體分五類，各有分工。'],
      listTitle: '構造、細胞與五類抗體',
      list: [['圖上的 1：每種抗體都不一樣的尖端', { a: 'fab', o: ['fab', 'fc', 'heavy', 'light'] }], ['2：比較長的兩條', { a: 'heavy', o: ['fab', 'fc', 'heavy', 'light'] }], ['3：比較短的兩條', { a: 'light', o: ['fab', 'fc', 'heavy', 'light'] }], ['4：Y 的柄，決定抗體的種類', { a: 'fc', o: ['fab', 'fc', 'heavy', 'light'] }],
        ['大量分泌抗體的細胞', { a: 'plasma', o: ['plasma', 'mem'] }], ['血中最多、唯一能通過胎盤', { a: 'igg', o: IMM_IG }], ['在母乳、唾液、眼淚、腸道黏液等分泌物裡', { a: 'iga', o: IMM_IG }], ['第一次感染時最先出現', { a: 'igm', o: IMM_IG }],
        ['附在肥大細胞上，和過敏、寄生蟲感染有關', { a: 'ige', o: IMM_IG }], ['第二次感染時大量出現的主要抗體', { a: 'igg', o: IMM_IG }]],
      done: ['[[IgG：最多、通過胎盤。IgA：分泌物和母乳。IgM：最先出現。IgE：過敏。]]', '[[漿細胞分泌抗體；記憶細胞負責下一次更快的反應。]]', '抗體的作用：中和毒素和病毒、使病原體凝集、調理作用、活化補體。',
        '新生兒的保護來自兩個地方：出生前經胎盤得到的 IgG，和出生後從母乳（尤其是初乳）得到的 IgA。IgA 不被吸收，留在腸道表面保護黏膜。'] },
    { t: '細胞性免疫：T 細胞與抗原呈現', kind: 'list',
      intro: ['抗體只能對付細胞外的敵人。病毒一旦躲進細胞裡，抗體就碰不到了，這時要靠 T 細胞。',
        'T 細胞有個特別的規矩：它不認游離的抗原，只認被別的細胞切成小段、放在一個「托盤」上端出來的抗原片段。這個托盤是每個人獨有的一組蛋白質。',
        '托盤有兩類。第一類是幾乎所有的細胞都有的，用來展示細胞自己裡面正在做什麼蛋白質；如果裡面有病毒，病毒的片段就會被端出來。第二類只有專門負責呈現抗原的細胞才有，展示的是它們從外面吞進來的東西。',
        'T 細胞也對應地分兩種：一種看第二類托盤，負責指揮整個免疫反應；一種看第一類托盤，負責動手殺掉出問題的細胞。'],
      listTitle: '是哪一個',
      list: [['帶 CD4，分泌細胞介素去活化 B 細胞和其他 T 細胞', { a: 'th', o: IMM_TC }], ['帶 CD8，直接殺死被病毒感染的細胞和腫瘤細胞', { a: 'tc', o: IMM_TC }], ['抑制免疫反應、避免攻擊自己', { a: 'treg', o: IMM_TC }], ['輔助型 T 細胞辨識的是', { a: 'mhc2', o: ['mhc1', 'mhc2'] }],
        ['胞毒型 T 細胞辨識的是', { a: 'mhc1', o: ['mhc1', 'mhc2'] }], ['第一類 MHC 出現在', { a: 'allnuc', o: ['allnuc', 'onlyapc'] }], ['呈現抗原能力最強的細胞', { a: 'dend', o: ['dend', 'neut', 'mast'] }], ['胞毒型 T 細胞用來殺死目標的武器', { a: 'perf', o: ['perf', 'hist'] }],
        ['輔助型 T 細胞分泌、刺激 T 細胞增殖的細胞介素', { a: 'il2', o: ['il1', 'il2'] }], ['專門感染並破壞 CD4 T 細胞的病毒', { a: 'hiv', o: ['hiv', 'hbv'] }], ['器官移植會排斥，是因為每個人的什麼不同', { a: 'mhc1', o: ['mhc1', 'igg'] }]],
      done: ['[[輔助型 T 細胞：CD4，認第二類 MHC。胞毒型 T 細胞：CD8，認第一類 MHC。]]口訣：4 × 2＝8，8 × 1＝8。', '抗原呈現細胞有三種：樹突細胞、巨噬細胞、B 細胞。', '輔助型 T 細胞是整個適應性免疫的指揮官，所以愛滋病毒破壞它之後，兩支免疫都垮掉。',
        '愛滋病人常有體重減輕、肌肉流失和伺機性感染，營養照顧是治療的一部分。'] },
    { t: '免疫的記憶：疫苗、主動與被動免疫', kind: 'cloze',
      intro: ['第一次遇到一種病原體，要先找到少數認得它的淋巴球，讓它們分裂壯大，前後要五到十天，人在這段時間就生病了。',
        '但這一次留下了大量的記憶細胞。下次同一種病原體再來，反應在一兩天內就起來，抗體又多又好，人常常沒有感覺就過去了。',
        '疫苗就是用安全的方式製造「第一次」：給身體看病原體的樣子，但不讓它真的致病。',
        '另一種得到保護的方法是直接拿別人做好的抗體。這種保護立刻有效，但身體自己沒有學到東西，抗體代謝掉就沒有了。'],
      cloze: [
        ['第一次接觸抗原，抗體出現得又慢又少，稱為', { a: 'prim', o: ['prim', 'secd'] }, '。'],
        ['第二次接觸同一種抗原，反應', { a: 'fast', o: ['fast', 'slow'] }, '。'],
        ['次級反應比較快，是因為體內有', { a: 'mem', o: ['mem', 'plasma'] }, '。'],
        ['接種疫苗後，身體自己產生抗體和記憶細胞，屬於', { a: 'active', o: IMM_AP }, '。'],
        ['被毒蛇咬傷後注射抗蛇毒血清，屬於', { a: 'passive', o: IMM_AP }, '。'],
        ['胎兒從母親得到 IgG，屬於', { a: 'passive', o: IMM_AP }, '。'],
        ['被動免疫的保護力', { a: 'shortp', o: ['longp', 'shortp'] }, '。'],
        ['淋巴球在成熟過程中學會不攻擊自己的組織，稱為', { a: 'toler', o: ['toler', 'clonal'] }, '。'],
        ['抗原挑出認得它的那一株淋巴球、讓它大量增殖，稱為', { a: 'clonal', o: ['toler', 'clonal'] }, '。']
      ],
      done: ['[[主動免疫：自己產生抗體，慢但持久（感染、疫苗）。被動免疫：接受別人的抗體，快但短暫（胎盤、母乳、血清）。]]', '初級反應以 IgM 為主；次級反應以 IgG 為主。', '嬰兒出生後幾個月，來自母親的 IgG 逐漸用完，自己的還做得不夠，這段時間最容易生病，也是按時接種疫苗的原因。'] },
    { t: '免疫出錯：過敏與自體免疫', kind: 'list',
      intro: ['免疫系統有兩種出錯的方式：對無害的東西反應過度，或是把自己的組織當成敵人。',
        '過敏分快慢兩型。快的那一型是抗體惹的禍：第一次接觸過敏原時，身體做了一種特別的抗體，掛在肥大細胞上；下次再接觸，過敏原一搭上去，肥大細胞幾分鐘內就把裡面的顆粒全倒出來。',
        '慢的那一型和抗體無關，是 T 細胞引起的，要一兩天才出現。',
        '對營養師來說，最需要分清楚的是：同樣是「吃了某種食物不舒服」，有的是免疫反應，有的根本和免疫無關。'],
      listTitle: '是哪一種',
      list: [['花粉熱、蕁麻疹、花生或蝦蟹過敏', { a: 'imm1', o: IMM_HY }], ['接觸性皮膚炎、結核菌素皮膚試驗', { a: 'del4', o: IMM_HY }], ['立即型過敏的抗體', { a: 'ige', o: IMM_IG }], ['立即型過敏時，肥大細胞釋放的主要物質', { a: 'hist', o: ['hist', 'ifn'] }],
        ['全身性的立即型過敏：血壓驟降、呼吸道收縮，會致命', { a: 'anaph', o: ['anaph', 'autoi'] }], ['它的急救藥物', { a: 'epi', o: ['epi', 'antih'] }], ['乳糖不耐症', { a: 'intol', o: ['intol', 'immr'] }], ['對小麥的麩質產生免疫反應，破壞小腸絨毛', { a: 'celiac', o: ['celiac', 'anaph'] }],
        ['免疫系統攻擊自己的胰島 β 細胞', { a: 't1dm', o: ['t1dm', 't2dm'] }], ['免疫系統攻擊自己的關節滑膜', { a: 'ra', o: ['ra', 'oa'] }]],
      done: ['[[立即型過敏：IgE、肥大細胞、組織胺，幾分鐘內發生。遲發型過敏：T 細胞，一到三天後發生。]]', '食物過敏是免疫反應，極少量就可能引發，嚴重時致命，要完全避免並注意標示。食物不耐（例如乳糖不耐）和免疫無關，和吃的量有關。',
        '常見的食物過敏原：花生、堅果、牛奶、蛋、小麥、大豆、魚、甲殼類。國內的食品標示規定要標出過敏原。', '自體免疫疾病的例子：第一型糖尿病、葛瑞夫茲氏病、橋本氏甲狀腺炎、類風濕性關節炎、紅斑性狼瘡、重症肌無力、乳糜瀉。'] },
    { t: '營養與免疫', kind: 'cloze',
      intro: ['免疫細胞分裂得很快，要做大量的蛋白質，所以免疫系統對營養狀況非常敏感。營養不良和感染會互相惡化：營養不良的人容易感染，感染又讓人吃不下、消耗更多。',
        '這一關的內容不在生理簡報裡，是把營養學和膳食療養裡與免疫有關的重點先放在這裡，讓前面學的構造有地方掛。',
        '全身最大的免疫器官其實是腸道。腸壁裡的淋巴組織聚集了身體大部分的免疫細胞，腸道上皮和腸道菌則構成屏障。',
        '所以「腸道能用就用腸道」：長期不經腸道進食，腸黏膜會萎縮，屏障變差，細菌容易跑進血液。'],
      cloze: [
        ['熱量和蛋白質長期攝取不足，免疫力下降，稱為', { a: 'pem', o: ['pem', 'celiac'] }, '。'],
        ['這時萎縮得特別明顯、使 T 細胞減少的淋巴器官是', { a: 'thymus', o: ['thymus', 'spleen', 'liver'] }, '。'],
        ['缺乏時胸腺萎縮、傷口癒合變差、味覺改變的礦物質是', { a: 'zn', o: ['zn', 'fe'] }, '。'],
        ['維持皮膚和黏膜上皮完整、缺乏時容易呼吸道和腸道感染的維生素是', { a: 'va', o: ['va', 'vk'] }, '。'],
        ['小腸壁上成團的淋巴組織，稱為', { a: 'peyer', o: ['peyer', 'thymus'] }, '。'],
        ['腸細胞和淋巴球最愛用的胺基酸燃料，重症時消耗增加，是', { a: 'gln', o: ['gln', 'ala'] }, '。'],
        ['只要腸道功能還可以，營養支持應該優先選擇', { a: 'en', o: ['en', 'pn'] }, '。'],
        ['代謝後產物的發炎作用比較弱的是', { a: 'n3', o: ['n3', 'n6'] }, '。'],
        ['營養評估裡用來反映免疫功能的簡單指標是', { a: 'tlc', o: ['tlc', 'crp'] }, '。']
      ],
      done: ['[[蛋白質熱量營養不良 → 胸腺萎縮、T 細胞減少、抗體和補體下降 → 容易感染。]]', '和免疫關係最密切的微量營養素：鋅、鐵、硒、銅，維生素 A、C、D、E、B6、葉酸。缺乏和過量都會影響免疫。',
        '腸道相關淋巴組織（GALT）包含培氏斑和散布在黏膜裡的淋巴球，分泌大量的 IgA。', '這一關是補充內容，細節以營養學和膳食療養課本為準。'] },
    { t: '國考重點', kind: 'cloze',
      intro: ['把這個單元最常考的觀念走一次。有幾題的選項只有英文。'],
      cloze: [
        ['唯一能通過胎盤的抗體是', { a: 'igg', o: IMM_IG }, '。'],
        ['母乳中含量最多的抗體是', { a: 'iga', o: IMM_IG }, '。'],
        ['與立即型過敏反應有關的抗體是', { a: 'ige', o: IMM_IG }, '。'],

        '氣體往哪邊移動，看的不是濃度，而是分壓：混合氣體裡每一種氣體各自貢獻的壓力。氣體永遠從自己分壓高的地方，擴散到分壓低的地方。',
        '血液流過肺泡時，兩邊的氣體很快達到平衡，所以離開肺的動脈血，氧和二氧化碳的分壓幾乎和肺泡裡一樣。這些血一路送到組織之前都不會變。',

    { t: '氧的運輸：幾乎全靠血紅素', kind: 'list',
      intro: ['氧不太溶於水。光靠溶在血漿裡，每 100 毫升血只能帶 0.3 毫升的氧，遠遠不夠用。',
        '紅血球裡的血紅素解決了這個問題。每個血紅素由四條多肽鏈組成，各帶一個含鐵的血基質，每個血基質可以接一個氧分子。有了它，每 100 毫升血可以帶 20 毫升的氧。',
        '所以血液帶了多少氧，要看兩件事：血紅素有多少，以及其中有多少比例接上了氧（飽和度）。',

      done: ['[[血液的攜氧量取決於血紅素的濃度和氧飽和度；氧分壓只決定飽和度。]]', '[[能載氧的是 Fe²⁺。]]嬰兒吃到硝酸鹽含量太高的食物或水，血紅素的鐵被氧化成 Fe³⁺，會造成變性血紅素血症（藍嬰症）。',
        '靜止時血液流過組織只放掉四分之一左右的氧，靜脈血還有 75% 的飽和度，這是運動時可以動用的儲備。', '一氧化碳中毒時，動脈血氧分壓正常，但血紅素被占住了。'] },
    { t: '氧合血紅素解離曲線', kind: 'ov', h: 236, legend: [['sE', '正常'], ['sI', '右移']], svg: GAS_CV, blanks: [],

    { t: '二氧化碳的運輸，和它跟酸鹼的關係', kind: 'map', sub: 'co', plain: 1, blanks: ['ca', 'd', 'cl', 'h'],

        '其中帶負電的那個離子大量移到血漿裡，這就是血液運送二氧化碳的主要形式，同時也是血液最重要的緩衝物質。為了保持電中性，血漿裡的另一種陰離子換進紅血球。',

    { t: '四種酸鹼失衡', kind: 'ov', h: 220, svg: GAS_AB,

    moti: { zh: '運動素', en: 'Motilin' }, ghre: { zh: '飢餓素', en: 'Ghrelin' }, soma: { zh: '體抑素', en: 'Somatostatin' }, incr: { zh: '腸泌素效應', en: 'Incretin effect' }, leptin: { zh: '瘦體素', en: 'Leptin' },
    acidc: { zh: '酸性的食糜', en: 'Acidic chyme' }, fatp: { zh: '脂肪和蛋白質的消化產物', en: 'Fat and protein digestion products' }, glcf: { zh: '葡萄糖', en: 'Glucose' }, up: { zh: '增加' }, down: { zh: '減少' }
  },
  subs: {
    portal: { layout: 'chain', geo: { x: 180, w: 230 }, nodes: [{ k: 'cap', zh: '小腸的微血管', en: 'Intestinal capillaries' }, { k: 'pv', zh: '肝門靜脈', en: 'Hepatic portal vein' }, { k: 'sin', zh: '肝臟的竇狀隙', en: 'Liver sinusoids' },
      { k: 'cv', zh: '中央靜脈', en: 'Central vein' }, { k: 'hv', zh: '肝靜脈', en: 'Hepatic vein' }, { k: 'ivc', zh: '下腔靜脈（回心臟）', en: 'Inferior vena cava (to the heart)' }], extra: [{ k: 'ha', zh: '肝動脈', en: 'Hepatic artery' }, { k: 'bd', zh: '膽管', en: 'Bile duct' }] },
    bili: { layout: 'chain', geo: { x: 180, w: 236 }, nodes: [{ k: 'heme', zh: '血基質（來自老舊的紅血球）', en: 'Heme (from old red blood cells)' }, { k: 'bv', zh: '膽綠素', en: 'Biliverdin' }, { k: 'ub', zh: '非結合型膽紅素', en: 'Unconjugated bilirubin' },

  },
  levels: [
    { t: '先看全貌：三個附屬器官各送什麼到小腸', kind: 'ov', h: 346, legend: [['sT', '膽汁的路'], ['sH', '胰液的路']], svg: LPB_OV,
      intro: ['食糜從胃進到十二指腸時又酸又是大分子，小腸自己處理不了，需要兩種外來的消化液幫忙。',
        '一種是膽汁，由一個器官不停地製造，但不吃東西時用不到，就先存在另一個小袋子裡濃縮起來。',
        '另一種是胰液，裡面有三大營養素的消化酵素，還有用來中和胃酸的碳酸氫根。',
        '兩種消化液最後走同一個開口進入十二指腸，開口有括約肌管制。把四個器官填出來。'],
      blanks: [{ id: 'a', x: 89, y: 66, w: 120, a: 'liv', o: LPB_O }, { id: 'b', x: 89, y: 178, w: 120, a: 'gb', o: LPB_O }, { id: 'c', x: 271, y: 178, w: 120, a: 'pan', o: LPB_O }, { id: 'd', x: 180, y: 312, w: 140, a: 'duo', o: LPB_O }],
      listTitle: '想想看',
      list: [['膽汁裡有沒有消化酵素', { a: 'no', o: ['yes', 'no'] }], ['胰液裡有沒有消化酵素', { a: 'yes', o: ['yes', 'no'] }], ['管制膽汁和胰液進入十二指腸的構造', { a: 'oddi', o: ['oddi', 'pylo'] }],
        ['膽囊切除後，膽汁還是會由誰持續製造', { a: 'liv', o: LPB_O }]],
      done: ['[[肝臟製造膽汁，膽囊只是儲存和濃縮。]]所以膽囊切除的人還是有膽汁，只是沒辦法在吃大餐時一次放出很多，高脂的食物要分次吃。', '膽汁沒有酵素，它的工作是幫忙脂肪的消化和吸收。', '胰臟同時是外分泌腺（胰液）和內分泌腺（胰島素、升糖素）。'] },
    { t: '肝門系統：吸收的養分先到哪裡', kind: 'map', sub: 'portal', plain: 1, blanks: ['pv', 'sin', 'cv', 'hv'],
      intro: ['從胃、小腸、大腸、胰臟、脾臟回來的靜脈血，不是直接回心臟，而是先匯集成一條大靜脈送進肝臟，在肝臟裡再流過一次微血管，才回到心臟。',
        '兩組微血管中間夾著一條靜脈，這種安排叫門脈系統。',
        '這樣設計的好處是：剛吸收進來的東西，不管是養分、藥物還是毒物，都先經過肝臟檢查、加工、解毒，才放行到全身。',
        '有一類養分例外，它們吸收後不進微血管，而是走另一條路，繞過肝臟。'],
      listTitle: '肝臟的血液與首站',
      list: [['肝臟有兩條進來的血管。帶著養分、占大部分血流的是', { a: 'pv', o: ['pv', 'ha'] }], ['帶著氧氣的是', { a: 'ha', o: ['pv', 'ha'] }], ['食物中的水溶性物質經腸道吸收後，下一步到達的器官', { a: 'liv', o: ['liv', 'heart', 'kid', 'spleen'] }],
        ['長鏈脂肪酸和脂溶性維生素吸收後走的路', { a: 'lymph', o: ['pv', 'lymph'] }], ['住在肝臟竇狀隙裡、負責吞噬細菌和老舊血球的細胞', { a: 'kup', o: ['kup', 'hepc'] }]],
      done: ['[[腸道吸收的水溶性物質，經肝門靜脈先到肝臟。]]國考用蘇丹紅當例子考過這一題。', '肝臟的血有兩個來源：肝門靜脈（約四分之三，養分多）和肝動脈（氧氣多），兩者在竇狀隙混合。', '長鏈脂肪酸包成乳糜微粒後走淋巴，經胸管直接進入血液循環，不先經過肝臟。',
        '口服的藥物先被肝臟代謝掉一部分，叫首渡效應。肝硬化時門脈的壓力升高，會出現腹水和食道靜脈曲張。'] },
    { t: '肝臟的工作清單', kind: 'list',
      intro: ['肝臟是身體的化學工廠，生化學過的代謝路徑大半在這裡進行。把它的工作分成幾類來記：',
        '<b>分泌</b>膽汁。<b>解毒</b>：把有毒的東西改造成可以排掉的形式。<b>調節血糖</b>：吃飽時存、飢餓時放。<b>製造血漿裡的蛋白質</b>。<b>儲存</b>。',
        '這些功能壞掉時會出現什麼症狀，也就推得出來。這是膳食療養肝病飲食的基礎。'],
      listTitle: '肝臟做的事',
      list: [['胺基酸代謝產生的氨有毒，肝臟把它轉換成', { a: 'urea', o: ['urea', 'uric', 'crea'] }], ['肝臟製造、撐住血漿膠體滲透壓的蛋白質', { a: 'alb', o: ['alb', 'glob', 'hb'] }],
        ['肝硬化的病人容易出血，因為肝臟製造的什麼變少了', { a: 'clot', o: ['clot', 'glob', 'hb'] }], ['肝硬化時白蛋白太少、門脈壓力又高，水積在腹腔，叫做', { a: 'asc', o: ['asc', 'edema'] }],
        ['飢餓時肝臟釋放到血液的燃料', { a: 'glck', o: ['glck', 'lact'] }], ['肝臟把自己合成的三酸甘油酯包成什麼送出去', { a: 'vldl', o: ['vldl', 'chy'] }],
        ['維生素 D 在肝臟做第一次羥化，產物是', { a: 'vd25', o: ['vd25', 'vd125'] }], ['肝臟儲存量最多的維生素', { a: 'va', o: ['va', 'vc', 'vb1'] }]],
      done: ['氨 → 尿素（尿素循環，在肝臟）。肝功能很差時血氨升高，會引起肝腦病變，這時要調整蛋白質的攝取。', '白蛋白、大部分的凝血因子、血管收縮素原、運鐵蛋白、脂蛋白都是肝臟做的。',
        '肝臟儲存肝醣、鐵，以及維生素 A、D、B12。', '維生素 D 的活化：肝臟做成 25-羥基型，腎臟再做成有活性的 1,25-二羥基型。'] },
    { t: '膽紅素：老舊紅血球的血基質去了哪裡', kind: 'map', sub: 'bili', plain: 1, blanks: ['bv', 'ub', 'cb', 'ubg'],
      intro: ['紅血球活大約 120 天，老了之後被巨噬細胞吞掉。血紅素裡的鐵回收再用，剩下的環狀構造要丟掉。',
        '這個環先被打開，變成綠色的色素，再還原成黃色的色素。這個黃色的色素不溶於水，在血液裡要搭著白蛋白才能運送。',
        '到了肝臟，肝細胞幫它接上一個很親水的分子，讓它變成水溶性的，才能放進膽汁排到腸道。',
        '在腸道裡，細菌再把它改造一次。大部分隨糞便排出，一小部分被吸收回來、從尿液排出。'],
      listTitle: '位置與黃疸',
      list: [['血基質被分解成膽紅素，主要發生在', { a: 'res', o: ['res', 'hepc', 'kid'] }], ['非結合型膽紅素在血液中靠什麼運送', { a: 'alb', o: ['alb', 'glob', 'hb'] }], ['肝細胞幫膽紅素接上的分子', { a: 'gluc', o: ['gluc', 'glyt', 'sulf'] }],
        ['紅血球大量破壞，膽紅素來不及處理', { a: 'hemo', o: LPB_J }], ['膽管被結石或腫瘤堵住，膽汁排不出去', { a: 'obst', o: LPB_J }], ['膽管堵住時，血液中升高的主要是', { a: 'conj', o: ['uncj', 'conj'] }], ['膽管堵住時，糞便的顏色', { a: 'gray', o: ['gray', 'dark'] }]],
      done: ['[[血基質 → 膽綠素 → 非結合型膽紅素（脂溶性）→ 肝臟結合葡萄糖醛酸 → 結合型膽紅素（水溶性）→ 膽汁。]]', '血基質分解成膽紅素的地方是脾臟、肝臟、骨髓裡的巨噬細胞，以脾臟為主。國考考過。',
        '黃疸是血液裡膽紅素太多。溶血性：非結合型升高。阻塞性：結合型升高，糞便灰白、尿液變深。', '新生兒肝臟的結合能力還不夠，所以容易有生理性黃疸。'] },
    { t: '膽鹽與腸肝循環', kind: 'cloze',
      intro: ['膽汁裡真正幫忙消化的成分是膽鹽。它是肝臟用一種脂質當原料做成膽酸，再接上胺基酸，讓它一頭親水、一頭親油。',
        '膽鹽不是酵素，不會把脂肪切斷。它做兩件事：先把大油滴打散成小油滴，讓酵素有地方下手；之後再把消化好的產物包成更小的顆粒，帶到腸壁旁邊。',
        '膽鹽很珍貴，用完之後在小腸的末段幾乎全部被收回，經肝門靜脈回到肝臟，再分泌一次。一餐飯可以這樣循環好幾次。'],
      cloze: [
        ['肝臟合成膽酸的原料是', { a: 'chol', o: ['chol', 'heme', 'alb'] }, '。'],
        ['膽酸在肝臟和什麼結合，變成膽鹽？', { a: 'glyt', o: ['gluc', 'glyt', 'sulf'] }, '。'],
        ['膽鹽對脂肪的作用是', { a: 'emul', o: ['emul', 'digf'] }, '。'],
        ['膽鹽主要在哪裡被再吸收？', { a: 'ile', o: ['duo', 'jej', 'ile'] }, '。'],
        ['膽鹽被吸收後回到肝臟再分泌，這個循環叫做', { a: 'ehc', o: ['ehc', 'portc'] }, '。'],
        ['膽汁分泌不足時，哪一類維生素的吸收會變差？', { a: 'fatsol', o: ['fatsol', 'watsol'] }, '。'],
        ['迴腸切除的病人膽鹽大量流失，脂肪吸收不良，糞便中的脂肪會', { a: 'up', o: ['up', 'down'] }, '（脂肪瀉）。'],
        ['膽汁中的膽固醇相對太多、膽鹽和卵磷脂不夠時，容易形成', { a: 'stone', o: ['stone', 'asc'] }, '。'],
        ['把膽固醇排出體外的主要途徑，是把它變成膽酸後由哪裡排出？', { a: 'feces', o: ['feces', 'urine'] }, '。']
      ],
      done: ['[[膽鹽由膽固醇做成，功能是乳化脂肪和形成微膠粒；在迴腸再吸收，進行腸肝循環。]]', '膽汁的成分：膽鹽、膽色素（膽紅素）、膽固醇、卵磷脂、電解質。沒有酵素。',
        '水溶性膳食纖維會抓住膽酸一起排出，肝臟只好拿更多膽固醇來補做膽酸，這是它能降低血膽固醇的原因之一。', '迴腸同時是膽鹽和維生素 B12 的吸收位置，迴腸切除後兩者都要注意。'] },
    { t: '胰液：三大營養素的酵素都在這裡', kind: 'list',
      intro: ['胰液有兩個成分，由兩種細胞分泌。<b>腺泡細胞</b>做消化酵素；<b>導管細胞</b>分泌碳酸氫根，把從胃過來的酸中和掉，酵素才有適合的環境工作。',
        '消化蛋白質的酵素很危險，如果在胰臟裡就有活性，會把胰臟自己消化掉。所以它們都以不活化的形式分泌出來，到了小腸才被打開。',
        '打開的順序像骨牌：小腸壁上的一個酵素先活化第一個；第一個再去活化其他所有的。'],
      listTitle: '酵素與活化',
      list: [['把澱粉水解成麥芽糖和短鏈的糊精', { a: 'amyl', o: LPB_E }], ['把三酸甘油酯水解成脂肪酸和單酸甘油酯', { a: 'lipa', o: LPB_E }], ['從蛋白質的內部切斷肽鍵；也負責活化其他蛋白酶', { a: 'tryp', o: LPB_E }],
        ['從多肽的羧基端一個一個切下胺基酸', { a: 'carb', o: LPB_E }], ['水解 DNA 和 RNA', { a: 'nucl', o: LPB_E }], ['把胰蛋白酶原活化成胰蛋白酶的是', { a: 'ek', o: ['ek', 'hcl', 'bilex'] }],
        ['蛋白酶以不活化的形式分泌，這種形式叫做', { a: 'zym', o: ['zym', 'colip'] }], ['分泌碳酸氫根的是', { a: 'duct', o: ['acin', 'duct'] }], ['幫助胰脂酶在有膽鹽的環境下附著到油滴上的蛋白質', { a: 'colip', o: ['colip', 'zym'] }],
        ['酵素在胰臟裡提早被活化，把胰臟自己消化', { a: 'panc', o: ['panc', 'stone'] }]],
      done: ['[[腸激酶（enterokinase）活化胰蛋白酶原 → 胰蛋白酶再活化其他蛋白酶。]]腸激酶在小腸的刷狀緣上，不是胰臟分泌的。', '胰澱粉酶和胰脂酶分泌出來就有活性；蛋白酶才是酶原。',
        '胰液是三大營養素都能消化的消化液。胰臟功能不足（例如慢性胰臟炎、囊腫纖維化）時，受影響最大的是脂肪的消化。', '急性胰臟炎時血中的澱粉酶和脂酶會升高，可以用來診斷。'] },
    { t: '胃腸道激素：誰刺激、做什麼', kind: 'list',
      intro: ['胃和小腸的黏膜裡散布著內分泌細胞，偵測腸道裡的內容物，再放出激素協調各個器官。這是消化生理最常考的一張表。',
        '記的方法是抓住每個激素的「觸發條件」，它的作用通常就是去處理這個條件：',
        '酸進到十二指腸 → 需要鹼來中和。脂肪和蛋白質進到十二指腸 → 需要膽汁和酵素。葡萄糖進來 → 提早通知胰島準備。',
        '另外有幾個和食慾有關：一個在空腹時升高讓人想吃，幾個在進食後讓人覺得飽。'],
      listTitle: '是哪一個激素',
      list: [['胃竇的 G 細胞分泌；刺激胃酸分泌、促進胃黏膜生長', { a: 'gast', o: LPB_H }], ['酸性食糜進入十二指腸時分泌；刺激胰臟分泌大量碳酸氫根', { a: 'secr', o: LPB_H }],
        ['脂肪和蛋白質的消化產物進入十二指腸時分泌；讓膽囊收縮、胰臟分泌酵素', { a: 'cck', o: LPB_H }], ['同一個激素也會讓 Oddi 括約肌放鬆、延緩胃排空、帶來飽足感', { a: 'cck', o: LPB_H }],
        ['小腸上段分泌；葡萄糖和脂肪刺激；促進胰島素分泌', { a: 'gip', o: LPB_H }], ['小腸下段的 L 細胞分泌；促進胰島素、抑制升糖素、延緩胃排空', { a: 'glp', o: LPB_H }],
        ['空腹時由胃分泌，刺激食慾', { a: 'ghre', o: LPB_H }], ['空腹時促使胃腸產生一波一波的清掃式收縮', { a: 'moti', o: LPB_H }], ['幾乎抑制所有胃腸道激素和消化液的分泌', { a: 'soma', o: LPB_H }],
        ['口服葡萄糖引起的胰島素分泌，比靜脈注射同樣的量還多，這個現象叫做', { a: 'incr', o: ['incr', 'ehc'] }]],
      done: ['[[胃泌素：胃酸。胰泌素：胰臟的碳酸氫根。膽囊收縮素（CCK）：膽囊收縮＋胰臟酵素。]]', '腸泌素（incretin）有兩個：GIP 和 GLP-1。它們在吃進葡萄糖時提早叫胰島素出來。GLP-1 類的藥物現在用來治療糖尿病和肥胖。',
        '飢餓素（ghrelin）是目前已知唯一由胃腸道分泌、促進食慾的激素。', '胰泌素（secretin）是歷史上第一個被發現的激素。'] },
    { t: '國考重點', kind: 'cloze',

    { t: '脂肪：最麻煩的一條路', kind: 'map', sub: 'fat', plain: 1, blanks: ['emu', 'fm', 'mic', 'cm', 'lac'],
      intro: ['脂肪不溶於水，而消化液和血液都是水。所以脂肪從消化到運送，每一步都要想辦法讓它「待在水裡」。',

  levels: [
    { t: '先看全貌：一個腎元的五段', kind: 'ov', h: 214, legend: [['sH', '近曲小管'], ['sT', '只透水'], ['sI', '不透水、運出鹽'], ['sC', '受激素調節']], legendTitle: '腎小管各段的特性', svg: KID_OV, blanks: [],
      intro: ['腎臟的工作是把血液裡不要的東西做成尿排掉，同時把要的東西留下來，藉此維持體液的量、濃度、電解質和酸鹼度。每顆腎臟有一百萬個左右的工作單位，叫做腎元。',
        '每個腎元是一團微血管接上一條長長的小管。它的策略很特別：不是挑出廢物來排，而是<b>先把血漿大量地濾出來，再把有用的幾乎全部收回去</b>，收不回去的就是尿。',
        '所以尿的形成是三個過程：從微血管濾到小管裡；從小管收回血液；另外還有一些東西是由血液主動送進小管的。',
        '小管分成幾段，每段的管壁性質不同，負責的事也不同。先把五段的名字認出來。'],
      listTitle: '圖上的編號',
      list: [['1：一團微血管，包在囊裡，血漿從這裡濾出來', { a: 'glom', o: KID_S }], ['2：緊接在後面、彎彎曲曲的一段，大部分的再吸收在這裡', { a: 'pct', o: KID_S }], ['3：伸進髓質再折回來的 U 形管', { a: 'loop', o: KID_S }],
        ['4：回到皮質的另一段彎曲的小管', { a: 'dct', o: KID_S }], ['5：好幾個腎元共用，穿過髓質通往腎盂', { a: 'cd', o: KID_S }], ['血漿從腎絲球進入鮑氏囊', { a: 'filt', o: KID_P }], ['物質從小管回到血液', { a: 'reab', o: KID_P }], ['物質從血液被送進小管', { a: 'secr', o: KID_P }],
        ['每天濾出來的液體量', { a: 'l180', o: ['l180', 'l15', 'l5'] }], ['每天的尿量', { a: 'l15', o: ['l180', 'l15', 'l5'] }], ['所以濾出來的水，被再吸收的比例', { a: 'p99', o: ['p99', 'p50'] }]],
      done: ['[[腎絲球 → 近曲小管 → 亨利氏環 → 遠曲小管 → 集尿管。]]', '[[排出的量＝過濾的量－再吸收的量＋分泌的量。]]', '每天過濾約 180 公升，尿只有 1 到 2 公升，99% 以上的水都被收回去了。全身的血漿只有 3 公升左右，等於一天被濾了六十次。',
        '腎臟只占體重的不到百分之一，卻拿走心輸出量的五分之一，就是為了這麼大量的過濾。'] },
    { t: '腎絲球過濾：先大量濾出來', kind: 'cloze',
      intro: ['腎絲球的微血管壁上有很多小孔，外面再包一層有縫隙的細胞，像一個篩子。小分子通通可以過，大分子和細胞過不去。濾出來的液體成分幾乎就是沒有蛋白質的血漿。',
        '把液體推過篩子的力量是血壓。腎絲球很特別，前後各有一條小動脈，前面進、後面出。調整這兩條小動脈的口徑，就能改變腎絲球裡的血壓。',
        '每分鐘兩顆腎臟總共濾出多少液體，是評估腎功能最重要的數字，正常大約每分鐘 125 毫升。',
        '血壓在一定範圍內變動時，腎臟會自己調整入球小動脈的口徑，讓過濾的速度保持穩定。'],
      cloze: [
        ['正常情況下，不會被濾出來的是', { a: 'prot', o: ['prot', 'small'] }, '。'],
        ['推動過濾最主要的力量是', { a: 'bp', o: ['bp', 'onc'] }, '。'],
        ['入球小動脈收縮時，腎絲球過濾率會', { a: 'down', o: ['up', 'down'] }, '。'],
        ['出球小動脈收縮時，腎絲球裡的血壓上升，過濾率會', { a: 'up', o: ['up', 'down'] }, '。'],
        ['大出血、交感神經強烈興奮時，入球小動脈收縮，尿量會', { a: 'down', o: ['up', 'down'] }, '。'],
        ['尿液中出現大量的白蛋白，表示受損的是', { a: 'glom', o: ['glom', 'pct', 'cd'] }, '。'],
        ['入球小動脈旁邊、偵測血壓和小管液流量並分泌腎素的構造是', { a: 'jga', o: ['jga', 'bow'] }, '。'],
        ['血管收縮素 II 讓哪一條小動脈收縮得比較厲害，所以血壓低時還能維持過濾？', { a: 'eff', o: ['aff', 'eff'] }, '。']
      ],
      done: ['[[腎絲球過濾率（GFR）正常約每分鐘 125 毫升，每天約 180 公升。]]', '[[入球小動脈收縮 → 過濾率下降；出球小動脈收縮 → 過濾率上升。]]', '蛋白尿是腎絲球受損的訊號。糖尿病和高血壓是慢性腎臟病最主要的兩個原因，傷的都是腎絲球。',
        'ACE 抑制劑讓出球小動脈放鬆，降低腎絲球裡的壓力，所以能減少蛋白尿、保護腎臟。'] },
    { t: '近曲小管：有用的幾乎全收回來', kind: 'cloze',
      intro: ['濾出來的液體一進到小管，再吸收馬上開始。近曲小管的細胞有密密的刷狀緣，表面積很大，粒線體很多，是整條小管裡最賣力的一段。',
        '濾出來的鈉和水，大約三分之二在這裡就收回去了；葡萄糖和胺基酸在正常情況下則是百分之百收回。這一段的再吸收不受激素調節，濾多少就按比例收多少。',
        '葡萄糖是靠運輸蛋白搬的，方法和小腸上皮一模一樣。運輸蛋白的數量有限，血糖太高時來不及搬，剩下的就留在小管裡，最後出現在尿裡。',
        '留在小管裡的葡萄糖有滲透壓，會把水也拉住不讓它被收回，結果尿量變多。'],
      cloze: [
        ['葡萄糖在近曲小管的再吸收方式是', { a: 'sglt', o: ['sglt', 'diff'] }, '。'],
        ['血糖高到某個濃度，尿中開始出現葡萄糖，這個濃度叫做', { a: 'thr', o: ['thr', 'tm'] }, '。'],
        ['葡萄糖的腎閾值是', { a: 'm180', o: ['m100', 'm180', 'm300'] }, '。'],
        ['糖尿病控制不良時，近曲小管來不及回收葡萄糖，葡萄糖的排出', { a: 'up', o: ['up', 'down'] }, '。'],
        ['同時，水分的排出也', { a: 'up', o: ['up', 'down'] }, '。'],
        ['這種因為小管裡有太多溶質而造成的多尿，叫做', { a: 'osmd', o: ['osmd', 'wd'] }, '。'],
        ['濾出來的碳酸氫根，絕大部分在哪一段被再吸收？', { a: 'pct', o: ['pct', 'loop', 'cd'] }, '。'],
        ['被過濾的 Na⁺ 和 K⁺，在到達遠曲小管之前被再吸收的比例大約是', { a: 'p90', o: ['p90', 'p10'] }, '，這部分不需要激素調節。'],
        ['尿酸、藥物和一些有機酸，主要由近曲小管以什麼方式送進小管？', { a: 'secr', o: KID_P }, '。']
      ],
      done: ['[[近曲小管：再吸收約三分之二的鈉和水，以及幾乎全部的葡萄糖、胺基酸和碳酸氫根。]]', '[[糖尿病控制不良 → 血糖超過腎閾值（約 180 mg/dL）→ 葡萄糖留在小管 → 滲透性利尿，葡萄糖和水的排出都增加。]]國考考過。',
        '糖尿病的「三多」由此而來：多尿（滲透性利尿）→ 脫水而多喝；葡萄糖流失、細胞又用不到 → 多吃。', '[[被過濾的 Na⁺ 和 K⁺ 有將近九成在到達遠曲小管之前就被再吸收，這部分不受激素調節。]]國考考過。',
        '新一類的降血糖藥（SGLT2 抑制劑）就是擋住近曲小管回收葡萄糖，讓葡萄糖從尿排出。'] },
    { t: '亨利氏環與集尿管：尿可以多濃', kind: 'list',
      intro: ['陸地上的動物要省水，就得排出比血液還濃的尿。但細胞沒有辦法直接把水「打」出去，水只會跟著滲透壓走。腎臟的辦法是：先在髓質造出一個很鹹的環境，再讓尿流過那裡，水自然就被吸出去。',
        '造出這個環境的是亨利氏環。它的兩支管壁性質相反：{T:往下的那一支只讓水通過}；{I:往上的那一支完全不透水，但會主動把鹽運出去}。',
        '往上那支運出來的鹽讓髓質變鹹；往下那支的水因此被吸出去，管內的液體越往下越濃；濃的液體轉彎往上流，又有更多的鹽可以運出來。這樣一圈一圈放大，髓質越深的地方越鹹。',
        '最後，集尿管帶著尿從皮質往下穿過這個越來越鹹的髓質。這時水出不出得去，就看集尿管的壁透不透水，這由一個激素決定。'],
      listTitle: '尿液的濃縮',
      list: [['只對水有通透性的是亨利氏環的', { a: 'desc', o: ['desc', 'asc'] }], ['不透水、主動運出氯化鈉的是', { a: 'asc', o: ['desc', 'asc'] }], ['所以液體離開上行支、到達遠曲小管時是', { a: 'hypo', o: ['hyper', 'hypo'] }],
        ['亨利氏環讓髓質越深越鹹的機制叫', { a: 'cc', o: ['cc', 'osmd'] }], ['決定集尿管透不透水的激素', { a: 'adh', o: KID_HM }], ['它讓集尿管細胞的膜上多出', { a: 'aqp', o: ['aqp', 'sglt'] }],
        ['脫水時抗利尿激素很多，尿液', { a: 'hyper', o: ['hyper', 'hypo'] }], ['喝了大量的水，抗利尿激素很少，尿液', { a: 'hypo', o: ['hyper', 'hypo'] }], ['除了氯化鈉，哪一種含氮廢物也幫忙維持髓質的高滲透壓', { a: 'urea', o: ['urea', 'crea'] }],
        ['作用在上行支、擋住鹽的運出，利尿效果最強的藥', { a: 'loopd', o: ['loopd', 'thia', 'ksp'] }]],
      done: ['[[下行支只透水；上行支不透水、主動運出 NaCl。兩者合作造成髓質的高滲透壓（逆流倍增）。]]', '[[抗利尿激素（ADH）使集尿管對水通透，水被髓質吸出去，尿變濃、量變少。]]',
        '人的尿最濃可以到血漿的四倍左右。腎臟每天至少要排出約 500 毫升的尿才能把廢物帶走，這是「必需尿量」。', '蛋白質吃得多，尿素多，腎臟需要更多水來排；嬰兒和老人濃縮尿的能力差，高蛋白或高電解質的配方容易造成脫水。'] },
    { t: '遠端的微調：四個激素', kind: 'list',
      intro: ['液體流到遠曲小管和集尿管時，大部分的再吸收已經完成，剩下不到一成。但這最後一段是受激素控制的，身體就在這裡依當時的需要做最後的調整。',
        '記的方法是一個激素管一樣東西：一個管鹽（順便排掉另一種離子）、一個管水、一個管鈣和磷，還有一個專門唱反調，叫腎臟把鹽和水排掉。',
        '這四個激素在前面的單元都出現過，這裡把它們在腎臟的作用放在一起。'],
      listTitle: '是哪一個激素',
      list: [['讓遠曲小管和集尿管多回收 Na⁺、多排出 K⁺', { a: 'aldo', o: KID_HM }], ['讓集尿管多回收水', { a: 'adh', o: KID_HM }], ['讓腎臟多排出 Na⁺ 和水', { a: 'anp', o: KID_HM }], ['讓遠曲小管多回收 Ca²⁺、近曲小管少回收磷', { a: 'pth', o: KID_HM }],

  levels: [
    { t: '先看全貌：一天的能量花在哪裡', kind: 'ov', h: 272, legend: [['kH', '維持生命'], ['kE', '活動'], ['kT', '處理食物']], svg: METR_OV,
      intro: ['體重是能量收支的結果：吃進來的比用掉的多，多的存成脂肪；吃得比用的少，就動用庫存。收入只有一項，就是食物；支出則有三項。',
        '最大的一項是什麼都不做也要花的：心跳、呼吸、維持體溫、細胞裡的離子幫浦、合成和修補。大部分人以為運動才是主要的消耗，其實這一項就占了六七成。',
        '第二項是所有肌肉的活動，從運動到走路、做家事、坐不住的小動作都算。',
        '第三項最小：吃了東西之後，消化、吸收、運送和儲存這些養分本身也要花能量，所以飯後代謝率會暫時上升。'],
      blanks: [{ id: 'a', x: 254, y: 27, w: 188, a: 'tef', o: METR_C, c: 'T' }, { id: 'b', x: 254, y: 86, w: 188, a: 'pa', o: METR_C, c: 'E' }, { id: 'c', x: 254, y: 170, w: 188, a: 'bmr', o: METR_C, c: 'H' }],
      listTitle: '想想看',
      list: [['三項支出中占最多的', { a: 'bmr', o: METR_C }], ['三項支出中最能靠自己改變的', { a: 'pa', o: METR_C }], ['攝取的熱量長期超過消耗', { a: 'pos', o: ['pos', 'neg'] }], ['臨床上測量能量消耗最常用的方法', { a: 'ic', o: ['ic', 'dc'] }],
        ['節食一段時間後，身體為了省能量，基礎代謝率會', { a: 'down', o: ['up', 'down'] }]],
      done: ['[[總能量消耗＝基礎代謝率（60–70%）＋身體活動（15–30%）＋攝食產熱效應（約 10%）。]]', '每一項消耗的能量最後都變成熱，所以量產熱或耗氧量就能知道代謝率。',
        '節食時基礎代謝率下降，是減重遇到停滯期、以及復胖的原因之一。所以減重要搭配運動來保住肌肉。'] },
    { t: '基礎代謝率：誰高誰低', kind: 'list',
      intro: ['基礎代謝率是在清醒、平躺、空腹十二小時、室溫舒適的條件下量到的能量消耗。它反映的是身體裡「活躍的組織」有多少、運轉得多快。',
        '最主要的決定因素是肌肉和內臟的量。脂肪組織很不活躍，所以同樣體重的兩個人，肌肉多的那個消耗比較高。',
        '有一個激素是它的總開關，專門調整全身細胞的代謝速度。',
        '代謝率通常不是直接量熱，而是量耗氧量再換算。同時量呼出的二氧化碳，還能知道身體正在燒哪一種燃料。'],
      listTitle: '影響因素與測量',
      list: [['決定基礎代謝率最主要的因素', { a: 'lean', o: ['lean', 'fatm'] }], ['同樣體重和年齡，基礎代謝率比較高的是', { a: 'male', o: ['male', 'female'] }], ['年紀越大，基礎代謝率', { a: 'down', o: ['up', 'down'] }], ['調節基礎代謝率最重要的激素', { a: 'thy', o: METR_HM }],
        ['發燒時，基礎代謝率', { a: 'up', o: ['up', 'down'] }], ['長期飢餓或嚴格節食時，基礎代謝率', { a: 'down', o: ['up', 'down'] }], ['二氧化碳產生量除以耗氧量', { a: 'rq', o: ['rq', 'bmr'] }],
        ['只燃燒醣類時的呼吸商', { a: 'r10', o: ['r10', 'r08', 'r07'] }], ['只燃燒脂肪時的呼吸商', { a: 'r07', o: ['r10', 'r08', 'r07'] }], ['蛋白質的呼吸商', { a: 'r08', o: ['r10', 'r08', 'r07'] }]],
      done: ['[[基礎代謝率主要由瘦體組織的量決定；甲狀腺素是最重要的調節激素。]]', '[[呼吸商（RQ）：醣類 1.0、蛋白質約 0.8、脂肪 0.7。]]一般混合飲食大約 0.85。', '體溫每上升攝氏一度，代謝率大約增加一成多，所以發燒、燒燙傷、重大創傷的病人熱量需求會增加。',
        '甲狀腺功能亢進的人吃得多卻變瘦；功能低下的人吃得少卻變胖。'] },
    { t: '攝食產熱效應與產熱', kind: 'cloze',
      intro: ['吃完東西後的幾個小時，代謝率會比空腹時高。多出來的這一塊就是攝食產熱效應，三大營養素差很多。',
        '差別來自處理它們的代價：有一種營養素要先脫掉胺基、把氮做成尿素排掉，又要用來合成新的蛋白質，每一步都很耗能。另一種幾乎可以原封不動地存進脂肪組織，代價最低。',
        '身體還有一種專門用來產熱的組織。它的粒線體內膜上有一個蛋白質，讓質子不經過 ATP 合成酶就流回去，食物的能量因此不做成 ATP，直接變成熱。這在生化的電子傳遞鏈單元提過。',
        '天冷時，身體先收縮皮膚血管、再用這種組織產熱，還不夠才靠肌肉不自主地收縮。'],
      cloze: [
        ['攝取相同的量時，消化、吸收和儲存要消耗最多能量的營養素是', { a: 'prot', o: ['prot', 'cho', 'fat', 'mineral'] }, '。'],
        ['攝食產熱效應最低的是', { a: 'fat', o: METR_N }, '。'],
        ['專門用來產熱的組織是', { a: 'bat', o: ['bat', 'wat'] }, '。'],
        ['讓質子繞過 ATP 合成酶的蛋白質是', { a: 'ucp', o: ['ucp', 'atps'] }, '。'],
        ['這時食物的能量主要變成', { a: 'heat', o: ['heat', 'atp'] }, '。'],
        ['刺激棕色脂肪產熱的是', { a: 'symp', o: ['symp', 'para'] }, '。'],
        ['瘦體素經由下視丘和交感神經，使解偶聯蛋白 1 的合成', { a: 'up', o: ['up', 'down'] }, '。'],
        ['不靠肌肉顫抖的產熱方式，叫做', { a: 'nonsh', o: ['shiver', 'nonsh'] }, '。'],
        ['棕色脂肪相對比較多的是', { a: 'baby', o: ['baby', 'elder'] }, '。']
      ],
      done: ['[[攝食產熱效應：蛋白質最高（約 20–30%）＞醣類（約 5–10%）＞脂質（0–3%）。]]國考考過。', '[[棕色脂肪的解偶聯蛋白 1（UCP1）讓氧化和磷酸化脫鉤，能量變成熱。]]', '高蛋白飲食有助於體重控制，原因之一是攝食產熱效應高，另一個原因是比較有飽足感。',
        '嬰兒不太會顫抖，靠棕色脂肪保暖；成人在頸部和鎖骨附近仍有少量。'] },
    { t: '吃飽和空腹：兩種代謝狀態', kind: 'list',
      intro: ['人不是一直在吃，但細胞一直需要燃料。身體在兩種狀態之間切換，由胰島的兩個激素指揮。這一關是生化「代謝整合」的生理版。',
        '<b>吸收期</b>是進食後的三四個小時。養分正從腸道進來，血糖和胰島素都高，主題是「存」：肝臟和肌肉存肝醣，脂肪組織存脂肪，各組織合成蛋白質。這段時間大部分的細胞燒的是葡萄糖。',
        '<b>吸收後期</b>是腸道已經空了的時候。胰島素下降、升糖素上升，主題是「放」，而且有一個優先順序：血糖要留給大腦。',
        '所以肝臟負責把葡萄糖放出來；其他組織盡量改燒脂肪酸，把葡萄糖省下來。'],
      listTitle: '是哪一個',
      list: [['胰島素高、升糖素低', { a: 'absorp', o: ['absorp', 'postab'] }], ['肝臟分解肝醣、進行糖質新生', { a: 'postab', o: ['absorp', 'postab'] }], ['空腹的前十幾個小時，血糖最主要的來源', { a: 'liverg', o: ['liverg', 'musg'] }], ['肝醣用完之後，血糖靠什麼維持', { a: 'gng', o: ['gng', 'glgn'] }],
        ['空腹時，肌肉和大部分組織改用的燃料', { a: 'ffa', o: ['glc', 'ffa', 'aa'] }], ['不管吃飽或空腹，都必須優先得到葡萄糖的器官', { a: 'brain', o: ['brain', 'musc', 'adip'] }], ['血糖只有 60 mg/dL 時，仍能從血液獲取大量葡萄糖的器官', { a: 'brain', o: ['brain', 'musc', 'adip', 'liver'] }],
        ['飢餓好幾天之後，大腦改用一部分什麼來代替葡萄糖', { a: 'ket', o: ['ket', 'ffa', 'aa'] }], ['飢餓時，糖質新生的碳骨架主要來自哪裡分解出來的胺基酸', { a: 'musc', o: ['brain', 'musc', 'adip'] }]],
      done: ['[[吸收期：胰島素主導，儲存。吸收後期：升糖素主導，動用；葡萄糖留給大腦，其他組織燒脂肪酸。]]', '[[大腦攝取葡萄糖不需要胰島素；肌肉和脂肪要靠胰島素；肝臟在低血糖時是釋出葡萄糖。]]國考考過。',
        '肝臟的肝醣大約只夠撐半天到一天。之後要靠糖質新生，原料是肌肉蛋白質分解出來的胺基酸、乳酸和甘油。', '長期飢餓時大腦改用酮體，可以少用很多葡萄糖，肌肉蛋白質的分解才慢得下來。'] },
    { t: '調節代謝的六個激素', kind: 'list',
      intro: ['前面幾個內分泌單元一個一個學了這些激素，這裡把它們對代謝的作用放在一張表裡比。',
        '記的方法：只有一個是「吃飽的激素」，讓血糖下降、促進所有的儲存。其他都會讓血糖上升，但時機和手法不同。',
        '兩個是幾分鐘內就起作用的快速反應：一個在空腹時，一個在緊急狀況時。兩個是幾小時到幾天的慢速調整：一個在長期壓力下拆蛋白質來做糖，一個在睡眠和成長時把燃料從醣換成脂肪。',
        '最後一個不直接管血糖，而是決定全身代謝的速度。'],
      listTitle: '是哪一個激素',
      list: [['唯一讓血糖下降，促進肝醣、脂肪和蛋白質的合成', { a: 'ins', o: METR_HM }], ['空腹時由胰島 α 細胞分泌，叫肝臟分解肝醣和做糖質新生', { a: 'glu', o: METR_HM }], ['緊急狀況時分泌，分解肝醣和脂肪，心跳加快', { a: 'epi', o: METR_HM }],
        ['長期壓力下分泌，分解肌肉蛋白質、促進糖質新生', { a: 'cort', o: METR_HM }], ['促進蛋白質合成和脂肪分解，同時有抗胰島素的作用', { a: 'gh', o: METR_HM }], ['提高基礎代謝率和耗氧量', { a: 'thy', o: METR_HM }],
        ['六個裡面，促進蛋白質分解的', { a: 'cort', o: METR_HM }], ['升糖素主要作用的器官', { a: 'liver', o: ['liver', 'musc', 'brain'] }], ['運動時分泌減少的激素', { a: 'ins', o: ['ins', 'glu', 'epi'] }]],
      done: ['[[降血糖：只有胰島素。升血糖：升糖素、腎上腺素、皮質醇、生長激素。]]', '促進蛋白質合成（同化）：胰島素、生長激素、性激素。促進蛋白質分解（異化）：皮質醇。', '重大創傷、感染、手術後，升糖素、腎上腺素、皮質醇一起升高，造成壓力性高血糖和肌肉大量分解，這是重症營養支持的背景。'] },
    { t: '脂肪組織是內分泌器官', kind: 'list',
      intro: ['脂肪組織不只是倉庫。脂肪細胞會分泌好幾種激素，向大腦和其他組織報告能量的存量，也影響它們對胰島素的反應。',
        '其中一個是存量的回報：脂肪越多，分泌越多，告訴下視丘可以少吃一點、多消耗一點。',
        '另一個剛好相反：脂肪越多，它反而越少。它的工作是讓肌肉和肝臟對胰島素更敏感，還有抗發炎、保護血管的作用。',
        '脂肪細胞塞得太滿時，會吸引巨噬細胞進來，一起放出促發炎的物質，干擾胰島素的訊息傳遞。脂肪堆在哪裡也有差：堆在腹腔內臟周圍的最麻煩。'],
      listTitle: '脂肪激素與肥胖',

  return '<span class="pick' + (v ? ' has' : '') + '"><span class="' + faceCls(b) + '">' + face(b) + '</span><select data-b="' + b.id + '" aria-label="空格"><option value="">' + (b.where === 'node' ? '？' : '請選擇') + '</option>' +
    b.opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(label(b, o)) + '</option>'; }).join('') + '</select></span>';
}

/* ---------- 一關的畫面 ---------- */
var KLAB = { enz: { tk: '激酶 kinase', td: '去氫酶 dehydrogenase' }, prod: { tk: 'ATP、GTP', td: 'NADH', tf: 'FADH₂', tp: 'NADPH' } };
function level() {
  var P = CUR, L = P.levels[LV], U = L.sub ? P.subs[L.sub] : P, n = P.levels.length; FORCE = L.force || null;
  if (!ST) ST = { blanks: buildBlanks(U, L), ans: {}, checked: false, shown: false };
  $('title').textContent = P.zh; $('subtitle').textContent = '第 ' + (LV + 1) + ' 關，共 ' + n + ' 關・' + L.t;
  $('back').hidden = false; seg();
  $('lv').hidden = false; $('lv').innerHTML = P.levels.map(function (_, i) { var d = isDone(P.id, i); return '<button type="button" data-i="' + i + '" class="' + (i === LV ? 'on' : '') + (d ? ' done' : '') + '" aria-label="第 ' + (i + 1) + ' 關' + (d ? '（已完成）' : '') + '">' + (i + 1) + (d ? ' ✓' : '') + '</button>'; }).join('');
  $('lv').querySelectorAll('button').forEach(function (b) { b.onclick = function () { open(P, +b.getAttribute('data-i')); }; });
  var on = $('lv').querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });

  var h = '<div class="card pad"><h2>' + esc(L.t) + '</h2>' + L.intro.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') + (L.tip ? '<div class="tip">' + fmt(esc(L.tip)) + '</div>' : '') + '</div>';
  var by = function (w) { return ST.blanks.filter(function (b) { return b.where === w; }); }, nodes = by('node'), rows = by('row').filter(function (b) { return b.li == null; }), lst = by('row').filter(function (b) { return b.li != null; }), cnt = by('count');
  var passed = ST.checked && !ST.shown && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; });
  var E = L.energy || (L.rows === 'prod' && (ST.shown || passed)) ? 'all' : L.carbon ? 'co2' : '';      // 算帳那一關：全對或看答案後，圖上才出現能量標籤
  var lgS = L.legend || (L.kind === 'map' && !L.plain ? U.nodes.map(function (n) { return n.c; }).concat(U.top ? [U.top.c] : []).filter(function (c, i, a) { return c && a.indexOf(c) === i; }).sort(function (a, b) { return b - a; }) : []);
  var lg = lgS.map(function (c) { return typeof c === 'object' ? '<span><i class="' + c[0] + '"></i>' + esc(c[1]) + '</span>' : '<span><i class="k' + c + '"></i>' + c + ' 碳</span>'; });      // 圖例：數字＝碳數；[樣式, 文字]＝自訂
  if (lg.length && (L.legendTitle || typeof lgS[0] !== 'object')) lg.unshift('<span>' + esc(L.legendTitle || '底色＝碳數') + '</span>');
  if (L.kind === 'map' && L.rows && allSteps(U).some(function (s) { return s.irr && asked(L, s); })) lg.push('<span><i class="irr">1</i>實心編號＝不可逆步驟</span>');
  if (L.kind === 'ov' || L.kind === 'map') { var H = L.kind === 'ov' ? L.h : mapH(U), fh = Math.round(PH() / .75);
    h += '<div class="card pad"><div class="dia" id="dia"><svg viewBox="0 0 360 ' + H + '" role="img" aria-label="' + esc(P.zh) + '路徑圖">' + (L.kind === 'ov' ? L.svg() : mapSvg(U, L, E)) + '</svg>' +
      nodes.map(function (b) { return '<span class="bk" data-k="' + b.id + '" style="left:' + (b.x / 360 * 100) + '%;top:' + (b.y / H * 100) + '%"><span style="display:block;width:' + Math.round(b.w / .75) + 'px;height:' + fh + 'px">' + sel(b) + '</span><i class="mk"></i></span>'; }).join('') + '</div>' +
      (lg.length ? '<div class="lgd">' + lg.join('') + '</div>' : '') + (nodes.length ? '<div class="small muted" style="text-align:center;margin-top:6px">點虛線框選答案</div>' : '') + '</div>'; }
  if (rows.length) { var seen = {}, kl = ''; rows[0].opts.forEach(function (o) { var k = kind(rows[0].src[o].en); if (k && !seen[k] && KLAB[L.rows][k]) { seen[k] = 1; } });
    ['tk', 'td', 'tf', 'tp'].forEach(function (k) { if (seen[k]) kl += '<span><i class="' + k + '"></i>' + KLAB[L.rows][k] + '</span>'; });
    h += '<div class="card pad"><h2>' + esc(L.rowsTitle || '') + '</h2>' + (kl ? '<div class="lgd" style="justify-content:flex-start;margin:0 0 4px">' + kl + '</div>' : '') + rows.map(function (b) { var s = b.st;
      var d = s.desc ? T(s.desc.zh, s.desc.en) : short(U.map[s.f]) + ' → ' + short(U.map[s.t]) + (s.also ? ' ＋ ' + short(U.map[s.also]) : '');
      return '<div class="st" data-k="' + b.id + '"><span class="n">' + (b.step + 1) + '</span><span class="d">' + esc(d) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>'; }
  if (lst.length) h += '<div class="card pad"><h2>' + esc(L.listTitle || '') + '</h2>' + lst.map(function (b) {
    return '<div class="st" data-k="' + b.id + '"><span class="n">' + (b.li + 1) + '</span><span class="d" style="font-size:14px;color:var(--ink)">' + fmt(esc(b.desc)) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (cnt.length) h += '<div class="card pad"><h2>' + esc(L.countsTitle || '') + '</h2>' + cnt.map(function (b) {
    return '<div class="st c" data-k="' + b.id + '"><span class="d">' + esc(b.label) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (L.kind === 'cloze') { var zb = by('cloze'); h += '<div class="card pad"><ol class="cz">' + L.cloze.map(function (row, i) {
    return '<li data-k="z' + i + '">' + row.map(function (x) { return typeof x === 'string' ? (x === '。' ? '' : esc(x)) : sel(zb[i]); }).join('') + '<div class="r"></div></li>'; }).join('') + '</ol></div>'; }
  h += '<div id="res"></div><div class="foot"><div class="row" id="acts"></div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.pick select').forEach(function (el) { el.onchange = function () {
    var id = el.getAttribute('data-b'), b = ST.blanks.filter(function (x) { return x.id === id; })[0];
    ST.ans[id] = el.value; el.parentNode.classList.toggle('has', !!el.value); var fe = el.parentNode.querySelector('.face'); fe.className = faceCls(b); fe.innerHTML = face(b);
    if (ST.checked) { ST.checked = false; clearMarks(); acts(); }
  }; });
  if (ST.shown) document.querySelectorAll('.pick select').forEach(function (el) { el.disabled = true; });
  scaleDia(); if (ST.checked) mark(); acts();
}
function scaleDia() { var d = $('dia'); if (d) d.style.setProperty('--s', (d.clientWidth / 360 * .75).toFixed(3)); }
window.addEventListener('resize', scaleDia);
function holder(b) { return document.querySelector('[data-k="' + b.id + '"]'); }
function clearMarks() {
  document.querySelectorAll('.pick').forEach(function (el) { el.classList.remove('ok', 'no'); });
  document.querySelectorAll('[data-k]').forEach(function (el) { el.classList.remove('ok', 'no'); var r = el.querySelector('.r'); if (r) r.textContent = ''; var m = el.querySelector('.mk'); if (m) m.textContent = ''; });
  $('res').innerHTML = '';
}
function mark() {
  var right = 0, total = ST.blanks.length, L = CUR.levels[LV];
  ST.blanks.forEach(function (b) {
    var v = ST.ans[b.id] || '', ok = v === b.ans, el = holder(b), s = el.querySelector('.pick');
    if (ok) right++;
    s.classList.remove('ok', 'no'); el.classList.remove('ok', 'no'); s.classList.add(ok ? 'ok' : 'no'); el.classList.add(ok ? 'ok' : 'no');
    var m = el.querySelector('.mk'); if (m) m.textContent = ok ? '✓' : '✕';
    var o = b.src && b.src[b.ans], zh = o && (b.lang || M()) === 'en' && o.zh !== (o.en || o.zh) ? o.zh : '';      // 用英文作答的空格，答對後補上中文
    var r = el.querySelector('.r'); if (r) r.textContent = ok ? '✓ 正確' + (zh ? '：' + zh : '') : (v ? '✕ 再想想' : '✕ 還沒填');
  });
  var all = right === total, last = LV === CUR.levels.length - 1;
  if (all && !ST.shown) { if (!SAVE.done[CUR.id]) SAVE.done[CUR.id] = {}; SAVE.done[CUR.id][LV] = 1; save(); var c = $('lv').querySelectorAll('button')[LV]; c.classList.add('done'); if (c.textContent.indexOf('✓') < 0) c.textContent += ' ✓'; }
  $('res').innerHTML = '<div class="res ' + (all ? 'ok' : 'bad') + '"><b>' + (ST.shown ? '這是正確答案' : all ? '全對！' : '答對 ' + right + ' ／ ' + total) + '</b>　' +
    (ST.shown ? '看熟之後按「重來」，自己再填一次才算過關。' : all ? (last ? '這個單元完成了。' : '可以進下一關了。') : '紅色的空格再改一次，改完再按「對答案」。') + '</div>' +
    (all && !ST.shown && L.done ? '<div class="card pad"><h2>記住這幾件事</h2><ul>' + L.done.map(function (t) { return '<li>' + fmt(esc(t)) + '</li>'; }).join('') + '</ul></div>' : '');
  return all;
}
function acts() {
  var last = LV === CUR.levels.length - 1, all = ST.checked && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; }) && !ST.shown, h = '';
  if (all) h = '<button type="button" class="btn plain" id="redo">重來</button><button type="button" class="btn" id="next">' + (last ? '回目錄' : '下一關') + '</button>';
  else if (ST.checked) h = '<button type="button" class="btn plain" id="' + (ST.shown ? 'redo' : 'show') + '">' + (ST.shown ? '重來' : '看正確答案') + '</button><button type="button" class="btn" id="chk"' + (ST.shown ? ' disabled' : '') + '>對答案</button>';
  else h = '<button type="button" class="btn" id="chk">對答案</button>';
  $('acts').innerHTML = h;
  if ($('chk')) $('chk').onclick = function () { ST.checked = true; var L = CUR.levels[LV]; if (L.rows === 'prod' && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; })) level(); else { mark(); acts(); } var r = $('res'); if (r.scrollIntoView) r.scrollIntoView({ block: 'nearest' }); };
  if ($('show')) $('show').onclick = function () { ST.shown = true; ST.blanks.forEach(function (b) { ST.ans[b.id] = b.ans; }); level(); };
  if ($('redo')) $('redo').onclick = function () { ST = null; level(); window.scrollTo(0, 0); };
  if ($('next')) $('next').onclick = function () { if (last) home(); else open(CUR, LV + 1); };
}

$('back').onclick = home;
$('lang').querySelectorAll('button').forEach(function (b) { b.onclick = function () { LANG = b.getAttribute('data-l'); SAVE.lang = LANG; save(); if (CUR) { var y = window.pageYOffset; level(); window.scrollTo(0, y); } else home(); }; });
(function () { var m = (location.search.match(/[?&]p=([a-z]+)/) || [])[1]; if (m && UNITS[m]) open(UNITS[m], firstTodo(UNITS[m])); else home(); })();
</script>
</body>
</html>
