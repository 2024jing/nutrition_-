磷的吸收；穀類與豆類的植酸磷不易被人體吸收。依標準答案 C 正確。"},{"id":"114-2-4102-42","p":"114-2-4102","n":42,"q":"下列何種食物不含goitrogen？","o":["西瓜","綠花椰菜","高麗菜","黃豆"],"a":"A","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"含致甲狀腺腫物質的食物","ex":"十字花科蔬菜（高麗菜、花椰菜、芥菜）含硫配醣體，黃豆含異黃酮，都屬致甲狀腺腫素的來源。西瓜不含。"},{"id":"114-2-4102-43","p":"114-2-4102","n":43,"q":"下列何種營養素可以增強selenium的抗氧化功能？","o":["chromium","維生素C","維生素E","維生素A"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"硒與維生素 E 的協同作用","ex":"維生素 E 在細胞膜上阻斷脂質過氧化，硒依賴的穀胱甘肽過氧化酶把已形成的過氧化物分解，兩者互相節省，協同抗氧化。"},{"id":"114-2-4102-44","p":"114-2-4102","n":44,"q":"有關幼兒喝牛奶後引發脹氣、腹痛和腹瀉之原因，下列何者正確？","o":["乳酸中毒","麩質不耐症","乳糖不耐症","酮酸中毒"],"a":"C","c":"生命期營養","c2":"營養學","ch":"幼兒與學齡期","ch2":"醣類","t":"乳糖不耐症","ex":"幼兒斷奶後乳糖酶活性下降，喝牛奶後乳糖未被消化，進入大腸被細菌發酵產氣並吸水，造成脹氣、腹痛和腹瀉。"},{"id":"114-2-4102-45","p":"114-2-4102","n":45,"q":"有關青少年長期吃全素最易缺乏的維生素，下列何者正確？","o":["葉酸","維生素B2","維生素B6","維生素B12"],"a":"D","c":"生命期營養","c2":"營養學","ch":"青春期","ch2":"維生素（水溶性）","t":"全素者易缺乏的維生素","ex":"維生素 B12 只存在於動物性食品，全素者長期不補充最容易缺乏，可能出現巨球性貧血與神經症狀。"},{"id":"114-2-4102-46","p":"114-2-4102","n":46,"q":"有關老化造成的變化，下列敘述何者正確？","o":["骨量不變","瘦體組織不變","體脂肪百分比增加","血壓降低"],"a":"C","c":"生命期營養","c2":"","ch":"老年期","ch2":"","t":"老化的身體組成變化","ex":"老化時骨量與瘦體組織減少、體脂肪百分比增加，血壓通常上升。"},{"id":"114-2-4102-47","p":"114-2-4102","n":47,"q":"下列何種組織或器官是在懷孕時的胚胎發育過程中最早開始發育？","o":["心臟","眼睛","外生殖器","中樞神經系統"],"a":"D","c":"生命期營養","c2":"","ch":"懷孕與哺乳期","ch2":"","t":"胚胎器官的發育順序","ex":"神經管在受孕後第 3～4 週形成，中樞神經系統最早開始發育，所以孕前與孕早期要補充葉酸預防神經管缺陷。心臟稍後在第 3 週末開始跳動。"},{"id":"114-2-4102-48","p":"114-2-4102","n":48,"q":"懷孕第一期及第二期時不建議增加，但至懷孕第三期時建議增加何種營養素的攝取？","o":["蛋白質、鈣","維生素D、磷","維生素A、鐵","維生素B1、鎂"],"a":"C","c":"生命期營養","c2":"營養學","ch":"懷孕與哺乳期","ch2":"維生素（脂溶性）","t":"懷孕第三期增加的營養素","ex":"國人 DRIs 第八版懷孕第三期維生素 A 增加 100 微克 RE、鐵增加 30 毫克（第一、二期不增加）。蛋白質第二期起增加；鈣、磷、維生素 D 懷孕各期都不增加。"},{"id":"114-2-4102-49","p":"114-2-4102","n":49,"q":"根據國人膳食營養素參考攝取量修訂第八版（DRIs），51歲以上的成年人維生素D建議攝取量為多少？","o":["5微克","5毫克","15微克","15毫克"],"a":"C","c":"營養學","c2":"生命期營養","ch":"維生素（脂溶性）","ch2":"老年期","t":"51 歲以上的維生素 D 攝取量","ex":"國人 DRIs 第八版 51 歲以上維生素 D 的足夠攝取量為 15 微克（600 IU），高於 50 歲以下的 10 微克。"},{"id":"114-2-4102-50","p":"114-2-4102","n":50,"q":"有關多酚物質（polyphenols）的敘述，下列何者錯誤？","o":["包含許多種類，其中flavonoid占最大的比例","綠茶或紅茶內的主要活性組成分，皆屬於多酚類","其具有降低心血管疾病及癌症發生的作用，這可能與其抗氧化及抗發炎活性有關","在食物內主要以游離的形式存在，可在胃腸道立即被有效的吸收"],"a":"D","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"多酚類","ex":"多酚種類很多，類黃酮占最大部分；茶的兒茶素、茶黃素都屬多酚，有抗氧化與抗發炎作用。食物中的多酚大多以醣苷或聚合物形式存在，要經腸道菌分解，吸收率低。"},{"id":"114-2-5102-1","p":"114-2-5102","n":1,"q":"依據第八版國人膳食營養素參考攝取量（Dietary Reference Intakes, DRIs），有關碘的建議何者正確？","o":["成年男性的RDA比同年齡層女性高，但比女性懷孕期及哺乳期低","哺乳期的RDA為200 μg/d","懷孕期的RDA為225 μg/d","懷孕期EAR比哺乳期高"],"a":"C","c":"公共衛生營養學","c2":"營養學","ch":"飲食指標與營養標示","ch2":"礦物質（微量）","t":"碘的 DRIs","ex":"國人 DRIs 第八版碘的建議量：成人男女都是 150 微克，懷孕期增加 75 微克（225 微克），哺乳期增加 100 微克（250 微克）。所以男女相同、哺乳期需要量高於懷孕期。"},{"id":"114-2-5102-2","p":"114-2-5102","n":2,"q":"下列有關每日飲食指南的規劃原則與目標，何者錯誤？","o":["將降低心臟血管代謝疾病及癌症風險的飲食原則列入考量","以預防營養素缺乏為目標，建議營養素攝取量須達97.5％ DRIs以上","以實證營養學的原則，試算多種飲食組成，最後提出適合多數國人的飲食建議","三大營養素占總熱量比例之範圍為：蛋白質10～20％、脂質20～30％、醣類50～60％"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"每日飲食指南的規劃原則","ex":"每日飲食指南以 DRIs 為基礎，目標是營養素攝取量達到 DRIs 的 100%（不是 97.5%），並把降低慢性病風險列入考量。97.5% 是 RDA 能滿足的人群比例，題目把兩者混在一起。"},{"id":"114-2-5102-3","p":"114-2-5102","n":3,"q":"下列何者為國民飲食指標對國人身體活動的建議量？","o":["每天至少60分鐘的中等費力身體活動","每天至少30分鐘的中等費力身體活動","每週累積至少150分鐘的中等費力身體活動","每週累積至少75分鐘的中等費力身體活動"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"身體活動的建議量","ex":"國民飲食指標建議成人每週累積至少 150 分鐘中等費力身體活動（例如每週 5 天、每天 30 分鐘），或 75 分鐘的費力身體活動。"},{"id":"114-2-5102-4","p":"114-2-5102","n":4,"q":"下列有關國民飲食指標中對飲食的敘述，何者錯誤？","o":["建議選用加碘鹽","若飲酒，每日不宜超過2杯（每杯酒精10公克）","每日飲食中「添加糖」的攝取量，不宜超過總熱量的10％","每日鈉的攝取量，應限制在2,400毫克以下，包括加工品、食物本身與調味料所含的鈉"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"國民飲食指標的內容","ex":"國民飲食指標建議：若飲酒，男性每天不宜超過 2 杯，女性不宜超過 1 杯（每杯 10 公克酒精）。B 沒有區分性別所以錯。其餘：選用加碘鹽、添加糖低於總熱量 10%、鈉 2,400 毫克以下。"},{"id":"114-2-5102-5","p":"114-2-5102","n":5,"q":"國人膳食營養素參考攝取量Dietary Reference Intakes（DRIs）中，對於成年人的建議量下列何項營養素為AI（Adequate Intakes）？","o":["鈣","鎂","葉酸","維生素C"],"a":"A","c":"公共衛生營養學","c2":"營養學","ch":"飲食指標與營養標示","ch2":"礦物質（巨量）","t":"DRIs 中的 AI 項目","ex":"國人 DRIs 第八版中，鈣、磷、氟、維生素 D、維生素 K、泛酸、生物素、膽鹼等是足夠攝取量（AI）；鎂、葉酸、維生素 C 有建議攝取量（RDA）。"},{"id":"114-2-5102-6","p":"114-2-5102","n":6,"q":"食品中何種成份可以列在營養標示中？","o":["糖醇","葡萄糖胺","膠原蛋白","比菲德士菌"],"a":"A","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"營養標示可列的成分","ex":"包裝食品營養標示可以自願標示糖醇、膳食纖維、反式脂肪等營養成分。葡萄糖胺、膠原蛋白、益生菌不是營養素，不能列在營養標示表格中，只能另外標示。"},{"id":"114-2-5102-7","p":"114-2-5102","n":7,"q":"臺灣的母乳庫之母乳優先使用對象，下列何者錯誤？","o":["低出生體重嬰兒（＜2,500 g）","經醫生評估需要之早產兒","經醫生評估手術過後重症嬰兒","母親因本身疾病或服藥而無法親自哺乳者"],"a":"A","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"母乳庫的優先使用對象","ex":"母乳庫優先提供給經醫師評估需要的早產兒、極低出生體重兒（＜1,500 公克）、術後或重症嬰兒、腸道疾病嬰兒等。一般的低出生體重兒（＜2,500 公克）不在優先之列。"},{"id":"114-2-5102-8","p":"114-2-5102","n":8,"q":"亞洲肌少症共識會（Asian Working Group for Sarcopenia, AWGS）2019年更新肌少症診斷，長者可採用自我檢測的SARC-F問卷進行篩檢。關於SARC-F的評估項目，下列何者錯誤？","o":["肌力（strength）","步行（assistance in walking）","食慾（appetite）","登階（climb stairs）"],"a":"C","c":"公共衛生營養學","c2":"營養評估","ch":"生命期與特殊族群政策","ch2":"臨床評估與篩檢工具","t":"SARC-F 問卷","ex":"SARC-F 的 5 個項目是：肌力（Strength）、行走輔助（Assistance in walking）、起身（Rise from a chair）、登階（Climb stairs）、跌倒（Falls）。沒有食慾。"},{"id":"114-2-5102-9","p":"114-2-5102","n":9,"q":"2020世界衛生大會（WHA）提出因應高齡化社會的整合性照護（Integrated Care for Older People, ICOPE），並以推廣至臺灣社區。下列ICOPE評估項目，何者錯誤？","o":["聽力","牙齒數量","體重突然降低","認知"],"a":"B","c":"公共衛生營養學","c2":"營養評估","ch":"生命期與特殊族群政策","ch2":"臨床評估與篩檢工具","t":"ICOPE 的評估項目","ex":"ICOPE 評估 6 項內在能力：認知、行動、營養（體重減輕、食慾）、視力、聽力、憂鬱。牙齒數量不是評估項目。"},{"id":"114-2-5102-10","p":"114-2-5102","n":10,"q":"為了協助民眾落實健康生活型態，政府於何時開始設立「社區營養推廣中心」，由營養師走入社區提供專業服務？","o":["民國105年","民國107年","民國109年","民國103年"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社區營養推廣中心","ex":"國民健康署自民國 107 年起補助各縣市設立社區營養推廣中心，由營養師進入社區提供營養教育與諮詢，特別是長者營養服務。"},{"id":"114-2-5102-11","p":"114-2-5102","n":11,"q":"目前國內推動學校午餐之具體做法，下列何者錯誤？","o":["推動學校午餐全面使用國產可溯源食材","實施校園午餐食材登錄","推動學校午餐使用三章一Q標章（示）食材","全面推動學校中央廚房計畫，供餐鄰近學校"],"a":"D","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"學校午餐的政策","ex":"學校午餐的具體作法包括推動國產可溯源食材、校園食材登錄平臺、三章一Q。中央廚房並沒有全面推動；學校可依規模選擇自設廚房、公辦公營或委外，D 錯。"},{"id":"114-2-5102-12","p":"114-2-5102","n":12,"q":"原住民申請長照居家營養服務年齡下限為：","o":["65歲","60歲","55歲","50歲"],"a":"C","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"長照服務的年齡","ex":"長照 2.0 的服務對象包括 65 歲以上失能長者、55 歲以上失能原住民、50 歲以上失智者，以及失能的身心障礙者。"},{"id":"114-2-5102-13","p":"114-2-5102","n":13,"q":"依食品安全衛生管理法第28條第3項，所訂之不適合兒童長期食用之食品廣告及促銷規範，下列何者正確？","o":["購買炸雞、薯條兒童餐可以贈送炭治郎公仔","晚間6點在兒童頻道刊播廣告，可處新臺幣4萬元至400萬元罰鍰","晚間8點以後就可以在兒童頻道刊播廣告，不會受罰","洋芋片的廣告若以鮮奶配洋芋片當早餐，可推廣兒童多喝牛奶，就符合規範"],"a":"B","c":"公共衛生營養學","c2":"食品衛生與安全","ch":"營養政策與法規","ch2":"食品安全衛生法規","t":"不適合兒童長期食用之食品廣告及促銷","ex":"規範規定：每天 17 點到 21 點不得在兒童頻道播放不適合兒童長期食用食品的廣告；不得用玩具等贈品促銷；廣告不得以健康形象誤導。違反者依食安法處新臺幣 4 萬至 400 萬元罰鍰。"},{"id":"114-2-5102-14","p":"114-2-5102","n":14,"q":"下列何者不符合國民中小學校園一份飲品及點心食品之販售範圍？","o":["熱量應在250大卡以下","鈉含量應在400毫克以下","飽和脂肪所提供之熱量應在10%以下","糖個別所占之熱量不得超過總熱量之10%"],"a":"D","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"校園飲品與點心販售範圍","ex":"校園販售的一份點心：熱量 250 大卡以下、脂肪熱量 30% 以下、飽和脂肪熱量 10% 以下、添加糖熱量 10% 以下、鈉 400 毫克以下。D 把限制說成「糖個別」所占熱量，和規定的寫法不同，依標準答案 D 不符合。"},{"id":"114-2-5102-15","p":"114-2-5102","n":15,"q":"學校應加強辦理健康促進及建立健康生活行為等活動，其法源依據為何？","o":["學校餐廳廚房員生消費合作社衛生管理辦法","發展與改進學校午餐計畫","學校衛生法","營養師法"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"學校健康促進的法源","ex":"學校衛生法規定學校應加強辦理健康促進與建立健康生活行為等活動。"},{"id":"114-2-5102-16","p":"114-2-5102","n":16,"q":"有關主觀整體營養評估（Subjective Global Assessment, SGA）之敘述何者正確？","o":["一般照顧者即可使用","評估後以量表得分評估營養狀況","以病史記錄與身體臨床檢查為評估項目","適用於早期偵測評估工具"],"a":"C","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"主觀整體營養評估（SGA）","ex":"SGA 由受過訓練的醫療人員執行，評估項目是病史（體重變化、飲食攝取、腸胃症狀、功能、疾病）與身體檢查（皮下脂肪、肌肉耗損、水腫），最後主觀分為 A、B、C 三級，不計分。"},{"id":"114-2-5102-17","p":"114-2-5102","n":17,"q":"有關膳食調查之敘述，下列何者錯誤？","o":["肥胖者使用24小時回憶法，易傾向低估","使用24小時回憶法，健康的食物易傾向高估","飲食記錄法常會高估或出現遺漏","估計式飲食記錄法常使用家用量器進行記錄"],"a":"C","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"膳食調查的誤差","ex":"飲食記錄法常因受試者改變飲食或遺漏記錄而「低估」攝取量，不會高估。24 小時回憶法則容易低估肥胖者的攝取、高估健康食物。"},{"id":"114-2-5102-18","p":"114-2-5102","n":18,"q":"關於Histidine loading test係用以評估下列何種維生素之狀況？","o":["Vitamin B6","Vitamin B12","Folacin","Biotin"],"a":"C","c":"營養評估","c2":"營養學","ch":"生化評估","ch2":"維生素（水溶性）","t":"組胺酸負荷試驗","ex":"葉酸是組胺酸代謝中亞胺甲基轉移酶的輔酶。給予組胺酸後若尿中 FIGLU（亞胺甲基麩胺酸）增加，表示葉酸（或 B12）不足。"},{"id":"114-2-5102-19","p":"114-2-5102","n":19,"q":"Beriberi與下列何種營養素缺乏有關？","o":["Vitamin B1","Vitamin B2","Vitamin B3","Vitamin B12"],"a":"A","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"維生素（水溶性）","t":"腳氣病","ex":"腳氣病（beriberi）是維生素 B1（硫胺）缺乏，有乾性（神經病變）與濕性（心臟衰竭、水腫）兩型。"},{"id":"114-2-5102-20","p":"114-2-5102","n":20,"q":"有關營養素缺乏與皮膚異常之敘述，下列何者正確？","o":["必需脂肪酸缺乏與異位性皮膚炎有關","維生素D缺乏與水腫有關","鋅缺乏與紫斑症有關","維生素K缺乏與剝落式皮膚炎有關"],"a":"A","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"脂質","t":"營養缺乏的皮膚症狀","ex":"必需脂肪酸缺乏會造成皮膚乾燥、脫屑，與異位性皮膚炎有關。維生素 K 缺乏是紫斑與出血；鋅缺乏是皮膚炎與傷口癒合差；水腫與蛋白質或 B1 缺乏有關。"},{"id":"114-2-5102-21","p":"114-2-5102","n":21,"q":"關於兒童與青少年肥胖定義，是以BMI高於同年齡層多少百分位來判別為過重的切點？","o":["75","85","95","99"],"a":"B","c":"營養評估","c2":"生命期營養","ch":"體位評估","ch2":"幼兒與學齡期","t":"兒童過重與肥胖的切點","ex":"兒童與青少年以同年齡、同性別 BMI 的百分位判斷：第 85 百分位以上為過重，第 95 百分位以上為肥胖。"},{"id":"114-2-5102-22","p":"114-2-5102","n":22,"q":"評估7歲兒童生長狀況，下列何者正確？","o":["利用「兒童與青少年生長身體質量指數建議值」可了解生長趨勢","利用「兒童與青少年生長身體質量指數建議值」可評估體位狀況","利用「兒童生長曲線百分位圖」可了解飲食營養攝取狀況","利用「兒童生長曲線百分位圖」可了解體適能狀況"],"a":"B","c":"營養評估","c2":"生命期營養","ch":"體位評估","ch2":"幼兒與學齡期","t":"兒童生長的評估工具","ex":"兒童與青少年 BMI 建議值是評估當下體位（過輕、正常、過重、肥胖）。生長曲線百分位圖要多次測量才能看出生長趨勢；兩者都無法直接了解飲食攝取或體適能。"},{"id":"114-2-5102-23","p":"114-2-5102","n":23,"q":"下列那些飲食評估方法屬於個人短期飲食調查？①家戶盤存法　②24小時飲食回憶法　③食物攝取頻率法　④飲食記錄法","o":["僅②④","僅①②④","僅①③④","①②③④"],"a":"A","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"個人短期飲食調查","ex":"24 小時回憶法與飲食記錄法是調查個人短期攝取。家戶盤存法是調查家庭；食物頻率問卷評估長期飲食型態。"},{"id":"114-2-5102-24","p":"114-2-5102","n":24,"q":"使用短版迷你營養評估量表（Short-Form Mini Nutritional Assessment, MNA-SF）時，若無法取得個案之身體質量指數，可用那一項人體測量替代？","o":["三頭肌皮層厚度","上臂中圍","小腿圍","腰圍"],"a":"C","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"MNA-SF 的替代測量","ex":"MNA-SF 在無法取得 BMI 時，可用小腿圍代替：小於 31 公分為 0 分，31 公分以上為 3 分。"},{"id":"114-2-5102-25","p":"114-2-5102","n":25,"q":"有關營養篩檢（nutritional screening）工具，下列敘述何者錯誤？","o":["迷你營養評估適用於老人","迷你營養評估表，第一階段呈現營養狀況佳者，不須進行第二階段評估","主觀性綜合評估（subjective global assessment, SGA）含身體臨床檢查及病史","使用DETERMINE Your Nutritional Health Checklist，需要良好訓練的專業人員執行才具信度"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"營養篩檢工具","ex":"DETERMINE 是給社區長者或家屬自行填寫的篩檢表，不需要專業人員。MNA 適用老人，第一階段篩檢正常就不必做第二階段；SGA 包括病史與身體檢查。"},{"id":"114-2-5102-26","p":"114-2-5102","n":26,"q":"某份試卷進行預試時，高分組和低分組各100人，答對某題之高分組85人，低分組45人，其鑑別度為何？","o":["0.2","0.4","0.65","1.3"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"試題鑑別度","ex":"鑑別度 ＝ 高分組答對率 − 低分組答對率 ＝ 85% − 45% ＝ 0.4。"},{"id":"114-2-5102-27","p":"114-2-5102","n":27,"q":"下列何種訪問調查的型態，最適合在研究初期階段實施？","o":["無結構性訪問（unstructured interview）","半無結構性訪問（semi-unstructured interview）","半結構性訪問（semi-structured interview）","結構性訪問（structured interview）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"訪問調查的類型","ex":"研究初期對議題還不了解，適合用無結構性訪問，讓受訪者自由說，收集多種想法；研究後期再用結構性訪問做量化。"},{"id":"114-2-5102-28","p":"114-2-5102","n":28,"q":"以學校為場域，提升同校學生認同多吃蔬果，屬於計畫行為理論（The Theory of Planned Behavior）中的那個因素？","o":["行為態度","主觀規範","知覺行為控制","行為動力"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"計畫行為理論","ex":"主觀規範是個人感受到重要他人（同學、家人、老師）對某行為的期待。在學校營造同儕都認同多吃蔬果的氛圍，屬於主觀規範。"},{"id":"114-2-5102-29","p":"114-2-5102","n":29,"q":"溝通理論強調諮商應該注重有效的溝通，下列何者錯誤？","o":["講述是語言溝通中最重要的技巧","面部表情、講話手勢、講述語調皆屬於非語言溝通","非語言溝通有時比語言溝通更能表達人的態度","營養師可用語言表達同理心，以建立良好諮商關係"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"諮商的溝通技巧","ex":"諮商中最重要的語言溝通技巧是「傾聽」，不是講述。非語言溝通（表情、手勢、語調）有時更能傳達態度；營養師可用語言表達同理心。"},{"id":"114-2-5102-30","p":"114-2-5102","n":30,"q":"教學目標中的認知領域（cognitive domain），有下列四項學習思考層次，由低至高的排列何者正確？①應用（application）　②分析（analysis）　③整合（synthesis）　④理解（comprehension）","o":["④③②①","②④③①","②④①③","④①②③"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"認知領域的層次","ex":"布魯姆（Bloom）的認知領域由低到高為：知識、理解、應用、分析、綜合、評鑑。所以是理解 → 應用 → 分析 → 整合。"},{"id":"114-2-5102-31","p":"114-2-5102","n":31,"q":"講述教學是最常用的教學方法，缺點是時間一長，聽眾就無法專注。對於高中生來說，時間最好控制在多久？","o":["10分鐘","20分鐘","30分鐘","50分鐘"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"講述教學的時間","ex":"高中生專注時間有限，講述教學最好控制在約 20 分鐘，再穿插討論或活動。"},{"id":"114-2-5102-32","p":"114-2-5102","n":32,"q":"社會支持是指個人可以感受、察覺或接受來自他人的關心或協助，例如「一時無法改變飲食習慣，不代表你無能」，是屬於下列何種社會支持？","o":["自尊（esteem）","情感（emotional）","網絡支持（network）","實質性或工具性（tangible or instrumental）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"社會支持的類型","ex":"自尊支持是肯定對方的能力與價值，例如「一時改不過來不代表你無能」。情感支持是表達關心與同理；工具性支持是給予實際協助。"},{"id":"114-2-5102-33","p":"114-2-5102","n":33,"q":"策略行銷觀念應用在社區營養計畫，有8個步驟，下列何者應列在最後？","o":["市場區隔","產品定位","市場混合多樣性","設定目標"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"策略行銷的步驟","ex":"策略行銷的順序大致是：分析環境 → 設定目標 → 市場區隔 → 選擇目標市場 → 產品定位 → 最後擬定行銷組合（4P，市場混合）。"},{"id":"114-2-5102-34","p":"114-2-5102","n":34,"q":"某血糖控制方案花費25萬元，該方案參與者的糖尿病併發症因而下降節省80萬元的醫療費用，二者相減之差異為55萬元，其屬於下列何種經濟成本分析？","o":["成本利益分析","成本效益分析","成本價值分析","成本最小值分析"],"a":"A","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"經濟評估的方法","ex":"成本利益分析是把成本與結果都換成金錢比較，例如花 25 萬元、省下 80 萬元，淨利益 55 萬元。成本效益分析的結果是健康單位（如每降低 1% 糖化血色素的成本）。"},{"id":"114-2-5102-35","p":"114-2-5102","n":35,"q":"社區營養計畫，訂出七成的肥胖民眾參加減重計畫6個月後，體重降低5％之目標，此屬於下列何種計畫目標？","o":["過程","結構","結果","中期"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫目標的類型","ex":"結果目標是計畫要達到的成效，例如「七成參加者 6 個月後體重降低 5%」。過程目標是執行的活動量（如辦幾場課）；結構目標是資源與人力。"},{"id":"114-2-5102-36","p":"114-2-5102","n":36,"q":"編列高血壓社區防治營養計畫預算時，下列何項支出不屬於業務費？","o":["水電費","文具紙張","臨時工資","專家出席費"],"a":"A","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫預算的分類","ex":"政府計畫的業務費包括文具紙張、臨時工資、出席費、印刷、差旅等執行計畫所需的費用。水電費屬於行政管理費（或由機關支應），不是業務費。"},{"id":"114-2-5102-37","p":"114-2-5102","n":37,"q":"營養師以SWOT分析社區營養服務據點的現況，其中政府目前正挹注經費大力推動「長照2.0」，此部分應屬於SWOT分析法中的：","o":["S（Strength）","W（Weakness）","O（Opportunity）","T（Threat）"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"SWOT 分析","ex":"S、W 是組織內部的優勢與弱勢；O、T 是外部環境的機會與威脅。政府大力推動長照 2.0、挹注經費，是外部的機會。"},{"id":"114-2-5102-38","p":"114-2-5102","n":38,"q":"依據民國102～105年國民營養健康狀況變遷調查調查結果顯示，以血清濃度判別兩性19歲以上者之維生素A、D、E、B6、B 12與葉酸缺乏盛行率，下列敘述何者正確？","o":["六項維生素缺乏盛行率以維生素B12最高","葉酸缺乏盛行率高於維生素B6","三項脂溶性維生素缺乏盛行率以維生素E最高","維生素A缺乏盛行率高於維生素D"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人維生素缺乏盛行率","ex":"依標準答案，102～105 年調查中 19 歲以上者六項維生素的血清缺乏盛行率以 B12 最高。"},{"id":"114-2-5102-39","p":"114-2-5102","n":39,"q":"有關國民營養健康狀況變遷調查，維生素D的營養狀況，下列何者正確？","o":["歷年來國民營養健康狀況變遷調查皆使用臺灣食品成分資料庫中維生素D的含量資料，推算國人維生素D的攝取狀況","根據1993～2002年間的營養調查顯示，魚、魚肉製品、奶類及蕈類是國人最重要的維生素D來源","比較2013～2015年與1993～2001年，國人的維生素D平均攝取量未改善","血清中25-hydroxyvitamin D的濃度，不包含內源性的維生素D"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人維生素 D 的來源","ex":"依標準答案，1993～2002 年的營養調查顯示，國人維生素 D 主要來自魚與魚製品、奶類及蕈類。血清 25(OH)D 包括食物與皮膚合成的維生素 D。"},{"id":"114-2-5102-40","p":"114-2-5102","n":40,"q":"民國102年起，全國營養調查之敘述，下列何者正確？","o":["由衛生福利部食品藥物管理署接管","以5年為一期展開調查","改以全國分北中南三層調查","收集肺功能與體適能數據"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"民國 102 年起的國民營養調查","ex":"民國 102 年起國民營養健康狀況變遷調查改為連續性調查，由國民健康署主辦，每 4 年為一期，並加入肺功能、體適能等身體檢查項目。"},{"id":"114-2-5102-41","p":"114-2-5102","n":41,"q":"現階段的國民營養健康調查（NAHSIT），樣本抽樣方式最接近下列何者？","o":["分層多階段集束抽樣","分層隨機抽樣","簡單隨機抽樣","集束抽樣"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的抽樣方式","ex":"國民營養健康調查以分層多階段集束抽樣：先依地區分層，再依序抽鄉鎮市區、村里、戶與個人。"},{"id":"114-2-5102-42","p":"114-2-5102","n":42,"q":"自民國102年起，「國民營養健康狀況變遷調查」由衛生福利部所屬的那一個機關主責？","o":["中央健康保險署","食品藥物管理署","疾病管制署","國民健康署"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的主辦機關","ex":"民國 102 年起，國民營養健康狀況變遷調查由衛生福利部國民健康署主責。"},{"id":"114-2-5102-43","p":"114-2-5102","n":43,"q":"聯合國糧食及農業組織（Food and Agriculture Organization of the United Nations, FAO）建議各國應建立以食物為基礎的飲食指標（Food-based dietary guidelines），其目的未包含下列何者？","o":["公共衛生營養推廣的基礎","可作為農業政策制定之用","提供一般大眾促進健康的飲食建議","可節省膳食支出費用，提高糧食可獲性"],"a":"D","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"以食物為基礎的飲食指標","ex":"FAO 推動以食物為基礎的飲食指標（FBDG），作為公共衛生營養推廣、教育一般大眾、並可提供農業與糧食政策的參考。節省膳食支出、提高糧食可獲性不是它的目的。"},{"id":"114-2-5102-44","p":"114-2-5102","n":44,"q":"有關聯合國糧食及農業組織（Food And Agricalture Organization of the United Nations, FAO）所公告之2021年世界糧食安全和營養狀況，下列敘述何者錯誤？","o":["糧食安全程度使用家庭糧食不安全獲取量表（Household Food Insecurity Access Scale）評估","2020年，全球近三分之一的人無法獲得足夠的食物","女性中度或重度糧食不安全盛行率比男性高10％","營養不足人口最多的地區是亞洲"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"2021 年世界糧食安全與營養狀況","ex":"FAO 是以「糧食不安全經驗量表」（Food Insecurity Experience Scale, FIES）評估糧食安全，不是家庭糧食不安全獲取量表（HFIAS）。2020 年全球近三分之一人口無法取得足夠食物，營養不足人數以亞洲最多。"},{"id":"114-2-5102-45","p":"114-2-5102","n":45,"q":"我國於2011年召開之全國糧食安全會議訂定，我國之糧食自給率於2020年應達到多少？","o":["40%","50%","60%","70%"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"我國糧食自給率目標","ex":"2011 年全國糧食安全會議設定我國糧食自給率（以熱量計）於 2020 年達到 40%。"},{"id":"114-2-5102-46","p":"114-2-5102","n":46,"q":"內政部公布民國109年度國人平均壽命達81.3歲。下列那一個解讀正確？","o":["民國109年出生的嬰兒，預估可活至81.3歲","民國109年死亡的人當中，最高比率是在81.3歲時發生死亡","民國109年死亡的人，平均死亡年齡為81.3歲","民國109年，年齡超過82歲的人，無法估算還剩幾年壽命"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"平均壽命的意義","ex":"平均壽命是指 0 歲的平均餘命，表示該年出生的嬰兒在當年的死亡率條件下，預估平均可活到幾歲。不是當年死亡者的平均年齡。"},{"id":"114-2-5102-47","p":"114-2-5102","n":47,"q":"糖尿病人接受「臨床諮詢及教育」以遏止疾病惡化，此措施屬於公共衛生三段五級預防的那一個階段？","o":["促進健康","特殊保護","復健","限制失能"],"a":"D","c":"公共衛生營養學","c2":"膳食療養","ch":"流行病學與研究方法","ch2":"第6章 糖尿病","t":"三段五級預防","ex":"三段五級：初段預防為健康促進、特殊保護；次段預防為早期診斷與適當治療；三段預防為限制失能、復健。已經確診的糖尿病人接受諮詢與教育以避免惡化、併發症，屬於限制失能。"},{"id":"114-2-5102-48","p":"114-2-5102","n":48,"q":"某研究於2000～2020年間，共追蹤1,000名攝取高脂飲食及800名正常飲食者，在追蹤期間分別有30名及10名研究對象罹患大腸癌，攝取高脂飲食者產生大腸癌的相對危險性（relative risk, RR）是多少？","o":["0.03","0.42","2.4","1.2"],"a":"C","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"相對危險性的計算","ex":"RR ＝ 暴露組發生率 ÷ 非暴露組發生率 ＝（30 ÷ 1,000）÷（10 ÷ 800）＝ 0.03 ÷ 0.0125 ＝ 2.4。"},{"id":"114-2-5102-49","p":"114-2-5102","n":49,"q":"某社區健康中心調查資料顯示，該地區1,000名成年人中，民國110年初高血壓人數120名，民國111年初高血壓人數180名，據此可推估該地區民國110～111年間高血壓之狀況如何？","o":["盛行率為6.0%","盛行率為18.0%","發生率為6.0%","發生率為18.0%"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"盛行率與發生率","ex":"盛行率是某時間點的所有病例 ÷ 總人口：111 年初 180 ÷ 1,000 ＝ 18%。發生率要用新病例除以「原本沒病的人」：（180 − 120）÷ 880 ≈ 6.8%，不是 6%。"},{"id":"114-2-5102-50","p":"114-2-5102","n":50,"q":"召募某特定族群未罹癌者二萬人，評估其抗氧化營養素攝取量，預定在未來10年，監測其各種癌症的發生情形。此種研究方法稱為：","o":["世代研究（Cohort study）","生態學研究（Ecological study）","回溯性研究（Retrospective study）","病例對照研究（Case-control study）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的類型","ex":"先找一群未罹病的人，測量暴露（抗氧化營養素攝取）後往後追蹤疾病發生，是前瞻性世代研究。"},{"id":"114-2-6102-1","p":"114-2-6102","n":1,"q":"依據食品良好衛生規範準則之規定，有關物流業低溫食品之理貨及裝卸，應於攝氏幾度以下之場所進行？","o":["18","20","15","25"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"物流業低溫食品的理貨","ex":"食品良好衛生規範準則規定，物流業低溫食品的理貨及裝卸應在攝氏 15 度以下的場所進行，且應在短時間內完成，以免溫度上升。"},{"id":"114-2-6102-2","p":"114-2-6102","n":2,"q":"在HACCP系統使用CCP判定樹（CCP decision tree）評估一加工步驟是否為顯著危害的四個問題（4Qs）中，不包含下列何者？","o":["基於衛生安全的考量，評估本步驟是否需要控制","本步驟設計是否可以消除或降低可能發生的危害至可接受的水準","本顯著性危害所造成的污染若不加以管控，是否會造成不可接受的水準","持續步驟可將此顯著性危害消除或降低至可接受的水準"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"CCP 判定樹的四個問題","ex":"CCP 判定樹的四個問題依序是：Q1 此步驟是否有預防措施？（以及是否需要管制）Q2 此步驟的設計是否能消除或降低危害到可接受水準？Q3 污染是否可能超過可接受水準？Q4 後續步驟能否消除或降低此危害？依標準答案，A 不包含在內。"},{"id":"114-2-6102-3","p":"114-2-6102","n":3,"q":"依據食品良好衛生規範準則，下列何者可進入現場從事與食品接觸之工作？","o":["B型肝炎患者","A型肝炎患者","傷寒患者","結核病患者"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品從業人員的健康要求","ex":"準則規定患有 A 型肝炎、手部皮膚病、出疹、膿瘡、外傷、結核病、傷寒或其他可能造成食品污染的疾病者，不得從事與食品接觸的工作。B 型肝炎主要經血液與體液傳染，不經食物，可以從事。"},{"id":"114-2-6102-4","p":"114-2-6102","n":4,"q":"下列何種營養素屬於「可補充攝取」之營養素含量宣稱項目？","o":["鉻","單元不飽和脂肪酸","葉黃素","膳食纖維"],"a":"D","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"飲食指標與營養標示","t":"營養宣稱的「可補充攝取」","ex":"「可補充攝取」的營養宣稱項目包括膳食纖維、維生素 A、B1、B2、C、E、鈣、鐵等；要達到每 100 公克（毫升）一定含量以上才能宣稱「來源」或「高」。鉻、單元不飽和脂肪酸、葉黃素不在列表中。"},{"id":"114-2-6102-5","p":"114-2-6102","n":5,"q":"食品安全管制系統計畫之執行紀錄，應經下列何者的簽署及註記日期？","o":["負責人或其指定人員","廠長或經理","衛生管理人員或管理衛生人員","食品技師或營養師"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 紀錄的簽署","ex":"食品安全管制系統準則規定，執行紀錄應由負責人或其指定人員簽署，並註記日期。"},{"id":"114-2-6102-6","p":"114-2-6102","n":6,"q":"依據食品良好衛生規範準則之規定，下列針對餐飲業洗滌作業場所之敘述，何者錯誤？","o":["具有洗滌、沖洗及有效殺菌之三槽式餐具洗滌殺菌設施","若無充足之流動自來水者，應提供用畢即行丟棄之餐具","洗滌槽之水龍頭高度，應和水槽滿水位時等高，防水逆流污染","應有足夠之水量及供水設施"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"衛生與安全","t":"餐飲業的洗滌場所","ex":"洗滌槽的水龍頭出水口要高於水槽的滿水位，留出空氣間隔，避免水回流污染自來水管線。C 說「等高」是錯的。"},{"id":"114-2-6102-7","p":"114-2-6102","n":7,"q":"依據我國食品良好衛生規範準則，食品業者應指派管理衛生人員，該人員應符合下列何種資格或條件？","o":["每年應接受食品衛生相關機構舉辦之衛生講習8小時以上","經食品安全管制系統訓練60小時以上","專科以上學校之食品、營養等相關科系所畢業","沒有特別規定"],"a":"#","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"管理衛生人員的資格","ex":"本題考選部更正為「一律給分」，選哪一個都算對。考選部沒有公布更正理由；食品良好衛生規範準則要求業者指派管理衛生人員負責督導衛生管理，但對這個人員資格的規定和選項的寫法不完全一致，可能因此沒有唯一正確的答案。"},{"id":"114-2-6102-8","p":"114-2-6102","n":8,"q":"下列何者不屬於教育部與農業部推動國中小學營養午餐採用三章一Q之食材標章？","o":["臺灣有機農產品標章","吉園圃標章","產銷履歷農產品標章","臺灣農產品生產追溯QR Code"],"a":"B","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"生命期與特殊族群政策","t":"三章一 Q","ex":"三章一 Q 是 CAS 台灣優良農產品標章、產銷履歷標章、有機農產品標章，以及臺灣農產品生產追溯 QR Code。吉園圃（安全蔬果標章）已在民國 108 年後退場，不在其中。"},{"id":"114-2-6102-9","p":"114-2-6102","n":9,"q":"下列有關微生物對碳源利用之敘述，何者錯誤？","o":["微生物可利用酯類、醇類等碳源產生能量","當氮源較多時，會抑制微生物利用碳水化合物的能力","與細菌相較，黴菌可在糖濃度較高的環境中生長","大部分微生物利用葡萄糖作為碳源"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"微生物的碳源利用","ex":"大部分微生物以葡萄糖為碳源；有些可利用醇類、酯類、有機酸；黴菌比細菌耐高糖。氮源多寡並不會抑制微生物利用碳水化合物；B 錯。"},{"id":"114-2-6102-10","p":"114-2-6102","n":10,"q":"一般家庭式所製造之麵包會發生黏絲腐敗現象，主要是何種微生物所引起？","o":["產氣莢膜桿菌（Clostridium perfringens）","地衣桿菌（Bacillus licheniformis）","嗜酸乳酸桿菌（Lactobacillus acidophilus）","乳酸鏈球菌（Streptococcus lactis）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"麵包的黏絲病","ex":"麵包黏絲病由枯草桿菌（Bacillus subtilis）與地衣桿菌等芽孢桿菌引起，芽孢耐烘烤，在溫暖潮濕時生長，分解澱粉與蛋白質而產生黏絲。"},{"id":"114-2-6102-11","p":"114-2-6102","n":11,"q":"下列何種食品之腐敗或變質與假單胞菌屬（Pseudomonas）較無直接相關性？","o":["乳製品凝固且產生苦味","真空包裝肉品變綠","罐頭食品的平酸腐敗","蛋類食品黑變"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"假單胞菌的腐敗","ex":"假單胞菌是嗜冷性好氧菌，會造成冷藏乳品苦味凝固、肉品變綠或產生黏液、蛋類黑變與螢光。罐頭的平酸腐敗是嗜熱脂肪芽孢桿菌（Geobacillus stearothermophilus）產酸不產氣所致。"},{"id":"114-2-6102-12","p":"114-2-6102","n":12,"q":"依據食品中微生物衛生標準之規定，下列何項食品不需檢測腸桿菌科微生物？","o":["鮮乳","冷藏殺菌液蛋","食用冰塊","嬰兒配方食品"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸桿菌科的檢驗項目","ex":"依標準答案，冷藏殺菌液蛋不需檢測腸桿菌科。依我的記憶，蛋類液蛋的規定是檢驗沙門氏桿菌與生菌數。"},{"id":"114-2-6102-13","p":"114-2-6102","n":13,"q":"食品中自由水（free water）的含量遠低於微生物細胞內自由水含量時，微生物會產生什麼變化，而無法進行正常生理代謝？","o":["細胞脹大","細胞萎縮","細胞增生","細胞分化"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"水活性與微生物","ex":"食品的自由水比微生物細胞內少（高滲透壓）時，細胞內的水分向外滲出，細胞脫水萎縮（質壁分離），無法正常代謝。這是醃漬、糖漬保存食品的原理。"},{"id":"114-2-6102-14","p":"114-2-6102","n":14,"q":"以lauryl sulfate tryptose（LST）broth培養基測定飯糰中coliform菌數，所得數據之單位，下列何者正確？","o":["CFU/g","CFU/mL","MPN/g","MPN/mL"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"大腸桿菌群的 MPN 法","ex":"LST 培養液是用最確數（MPN）法以發酵產氣判定大腸桿菌群。飯糰是固體樣品，單位是 MPN/g；液體樣品用 MPN/mL。CFU 用在平板菌落計數。"},{"id":"114-2-6102-15","p":"114-2-6102","n":15,"q":"柑橘青黴菌（Penicillium citrinum）對柑橘水果會造成軟腐，與微生物產生的何種酵素有關？","o":["蛋白酶","溶菌酶","植酸酶","果膠酶"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"柑橘青黴菌的軟腐","ex":"黴菌分泌果膠酶分解植物細胞壁之間的果膠，使組織軟化、軟腐。"},{"id":"114-2-6102-16","p":"114-2-6102","n":16,"q":"下列有關安姆氏試驗（Ames test）之敘述何者錯誤？","o":["利用突變種沙門氏菌發生回復突變，突變回復成野生種沙門氏菌","野生種沙門氏菌無法自體合成組胺酸，是組胺酸需求菌","使用不同突變種沙門氏菌可用以鑑別突變原類型","致突變原物質可使突變種沙門氏菌發生回復突變"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"安姆氏試驗","ex":"安姆氏試驗使用「組胺酸需求型」的突變沙門氏菌（無法自己合成組胺酸）。若受試物有致突變性，會讓突變株回復突變成能自行合成組胺酸的野生型，在不含組胺酸的培養基上長出菌落。B 把野生型與突變型說反了。"},{"id":"114-2-6102-17","p":"114-2-6102","n":17,"q":"下列有關致畸試驗的敘述，何者錯誤？","o":["檢測試驗物質對於胚胎著床的影響","觀察實驗仔鼠的骨骼外觀作為畸形性的評估","於胎兒器官形成期間每天餵食試驗物質","檢測環境與試驗物質的交互作用對於胎兒存活率的影響"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"致畸試驗","ex":"致畸試驗在胚胎器官形成期每天給予受試物，觀察著床、胚胎死亡與吸收、胎兒外觀、內臟與骨骼畸形。試驗不是用來測環境與受試物的交互作用。"},{"id":"114-2-6102-18","p":"114-2-6102","n":18,"q":"在食品添加物安全試驗中，下列何者是由急性毒性試驗結果推算？","o":["無毒害作用劑量（NOAEL）","半致死劑量（LD 50）","生物安全劑量（VSD）","每日攝取容許量（ADI）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"急性毒性試驗","ex":"急性毒性試驗是單次大劑量給予，觀察 14 天內的死亡，用來推算半致死劑量（LD50）。NOAEL 由亞慢性或慢性試驗取得；ADI ＝ NOAEL ÷ 安全係數。"},{"id":"114-2-6102-19","p":"114-2-6102","n":19,"q":"在致癌試驗中，若試驗物質作用於生物體的器官或組織，使其形成容易癌化的條件，則該物質屬於下列何者？","o":["一級致癌物","二級致癌物","致癌起始劑","三級致癌物"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"致癌物的分類","ex":"依標準答案，這類物質稱為二級致癌物（promoter 促進劑）：不直接造成 DNA 突變，而是促進已起始的細胞增生形成腫瘤。一級致癌物（起始劑）直接作用於 DNA。"},{"id":"114-2-6102-20","p":"114-2-6102","n":20,"q":"有關健康食品安全性評估試驗，下列敘述何者錯誤？","o":["依據「分層試驗法（tiered approach）」概念，由急性毒性試驗取得NOEL量，得依序執行相關試驗","得依據經濟合作暨發展組織（OECD）化學品測試指引方法（Guidelines for the Testing of Chemicals）來實施","實驗動物的測試樣品每日介入量應低於每日總飲食攝取量的5％","應優先採用國際認可之減量、減低痛苦或縮短時程之活體試驗方法"],"a":"A","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"健康食品的安全性評估","ex":"分層試驗法是由基因毒性、28 天或 90 天餵食試驗等依序評估，不是由「急性毒性試驗」取得 NOEL。NOEL 要由重複劑量試驗求得。"},{"id":"114-2-6102-21","p":"114-2-6102","n":21,"q":"依據我國食品器具容器包裝衛生標準，若使用正版紙為食品包裝容器材料者，其紙質材料的保存期限最多為幾個月？","o":["6","12","18","24"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"紙類包裝的衛生標準","ex":"依標準答案，使用正版紙（原生紙漿）作為食品包裝材料時，紙質材料的保存期限最多 24 個月。"},{"id":"114-2-6102-22","p":"114-2-6102","n":22,"q":"有關清潔劑中界面活性劑壬基苯酚的敘述，下列何者錯誤？","o":["具雌激素效應，屬環境賀爾蒙","對免疫與神經系統具低劑量效應","屬於持久性環境污染物","水溶性極高，易被微生物分解"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"壬基苯酚","ex":"壬基苯酚是壬基苯酚聚乙氧基醇類界面活性劑分解後的產物，具有類雌激素作用，屬環境荷爾蒙；脂溶性高、不易被微生物分解，會在環境與生物體中累積。"},{"id":"114-2-6102-23","p":"114-2-6102","n":23,"q":"依據我國食品器具容器包裝衛生標準，食品容器與食品直接接觸面為金屬合金者，除鉛、鎘之外，還對下列何種重金屬的溶出量有限制標準？","o":["汞","鉻","砷","錫"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"金屬容器的溶出試驗","ex":"依標準答案，金屬容器直接接觸食品的部分，除鉛、鎘外，也限制砷的溶出量。"},{"id":"114-2-6102-24","p":"114-2-6102","n":24,"q":"下列何種添加物常用於麵包及蛋糕，使食品形成多孔性之膨脹效果？","o":["碳酸氫鈉（sodium bicarbonate）","去水醋酸（dehydroacetic acid）","亞硫酸鈉（sodium sulfite）","苯甲酸鹽（benzoate）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"膨脹劑","ex":"碳酸氫鈉（小蘇打）加熱或遇酸分解產生二氧化碳，使麵包與蛋糕膨鬆多孔。去水醋酸、苯甲酸是防腐劑；亞硫酸鈉是漂白劑。"},{"id":"114-2-6102-25","p":"114-2-6102","n":25,"q":"下列何種化合物曾被違法用於增加食品之彈性及保水性？","o":["乳酸鈣","硼砂","丁香醇","焦磷酸鈉"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"違法添加物","ex":"硼砂曾被違法加在年糕、油麵、魚丸等，增加彈性與保水性，但對腎臟有毒，禁止使用。焦磷酸鈉是合法的品質改良劑。"},{"id":"114-2-6102-26","p":"114-2-6102","n":26,"q":"下列何種洗潔劑適用於去除一般洗潔劑無法去除的礦物質沉澱和污漬？","o":["多用途洗潔劑","除油型洗潔劑","擦拭型洗潔劑","酸性型洗潔劑"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"洗潔劑的用途","ex":"酸性洗潔劑可溶解鹼性的礦物質沉積（水垢、鈣垢、鏽漬），一般中性或鹼性洗潔劑無法去除。"},{"id":"114-2-6102-27","p":"114-2-6102","n":27,"q":"使用食品用洗潔劑進行消毒以降低截切生鮮蔬果之微生物危害時，下列敘述何者正確？","o":["使用氯系食品用洗潔劑，洗淨後殘留之總氯濃度不得低於10 ppm","使用氯系食品用洗潔劑進行消毒時，須控制水中總氯濃度於100 ppm以下","火鍋店使用之截切蔬菜於截切製程應以氯系食品用洗潔劑消毒","直接生食之截切蔬果，截切後應使用食品用洗潔劑清洗與消毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"截切蔬果的消毒","ex":"依標準答案，使用氯系食品用洗潔劑消毒截切蔬果時，水中總氯濃度要控制在 100 ppm 以下，B 正確。洗淨後殘留應越低越好；火鍋店蔬菜會加熱，不一定要氯消毒。"},{"id":"114-2-6102-28","p":"114-2-6102","n":28,"q":"被海邊礁石割傷引起蜂窩性組織炎或菌血症，主要是何種病原菌所導致？","o":["創傷弧菌（Vibrio vulnificus）","霍亂弧菌（Vibrio cholerae）","志賀氏桿菌（Shigella spp.）","仙人掌桿菌（Bacillus cereus）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"創傷弧菌","ex":"創傷弧菌存在於溫暖海水中，經傷口感染會造成蜂窩性組織炎、壞死性筋膜炎；肝病患者生食海鮮也可能引起致死性敗血症。"},{"id":"114-2-6102-29","p":"114-2-6102","n":29,"q":"下列有關狂牛症的敘述，何者錯誤？","o":["可能因牛隻攝入病原污染之牛骨粉飼料所導致","感染牛隻會出現腦部組織空洞，呈現腦海綿狀病變","預防牛海綿狀腦病，首重源頭管理","狂牛症的病原普利昂（prion）可經煮沸加熱破壞"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"狂牛症","ex":"狂牛症（牛海綿狀腦病）由普利昂蛋白引起，牛隻吃到受污染的肉骨粉飼料而感染，腦部呈海綿狀空洞。普利昂非常耐熱，一般煮沸無法破壞。"},{"id":"114-2-6102-30","p":"114-2-6102","n":30,"q":"有關樹薯及竹筍中的含氰配醣體（cyanogenic glycosides〉，下列敘述何者錯誤？","o":["較常見的有苦杏素（amygdalin）、皇帝豆素（linamarin）等","煮沸無法破壞該類毒素","氰酸（HCN）為導致中毒的主要原因，會造成呼吸困難","以樹薯為主食可能發生神經萎縮、視覺失明"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"含氰配醣體","ex":"樹薯、竹筍、苦杏仁含氰配醣體，分解後釋出氫氰酸，抑制細胞色素氧化酶造成呼吸困難。氰配醣體與氫氰酸怕熱、易揮發，充分煮沸並去除煮汁可以破壞，B 錯。"},{"id":"114-2-6102-31","p":"114-2-6102","n":31,"q":"下列有關諾羅病毒性腸胃炎的敘述，何者正確？","o":["感染後即可產生完全的保護力","使用消毒用酒精能有效殺滅病毒","間接接觸被病患污染的物品就可能感染","在群聚感染事件中，食餘檢體一定能檢出諾羅病毒"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"諾羅病毒","ex":"諾羅病毒傳染力極強，接觸被污染的物品表面也會感染；感染後免疫力短暫，可能再感染；酒精效果差，要用含氯漂白水；群聚事件的食物檢體不一定能檢出病毒。"},{"id":"114-2-6102-32","p":"114-2-6102","n":32,"q":"食品從業人員手部有化膿傷口未適當處理，則容易帶有下列何種病原菌而造成食物中毒？","o":["病原性大腸桿菌","肉毒桿菌","沙門氏菌","金黃色葡萄球菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"金黃色葡萄球菌","ex":"金黃色葡萄球菌常見於人體皮膚、鼻腔與化膿傷口，經手污染食物後產生耐熱的腸毒素，造成嘔吐腹瀉。所以手部有傷口要包紮並戴手套。"},{"id":"114-2-6102-33","p":"114-2-6102","n":33,"q":"有關黃麴毒素（aflatoxins）之敘述，下列何者錯誤？","o":["對熱不穩定，對酸和鹼具安定性","對肝臟具有高度致癌性","毒性以B1型為最強","我國規定花生之總黃麴毒素限量為15 ppb以下"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"黃麴毒素","ex":"黃麴毒素相當耐熱，一般烹調無法破壞，但在強鹼下可被分解。B1 毒性最強，是強力肝癌致癌物；我國花生的總黃麴毒素限量為 15 ppb。"},{"id":"114-2-6102-34","p":"114-2-6102","n":34,"q":"下列那一種寄生蟲容易藉由生菜類經口攝入感染？","o":["鉤蟲","旋毛蟲","無鉤絛蟲","肺吸蟲"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"經生菜感染的寄生蟲","ex":"鉤蟲、蛔蟲的蟲卵隨人糞污染土壤與蔬菜，生吃沒洗乾淨的蔬菜就可能感染（鉤蟲也可經皮膚鑽入）。旋毛蟲來自豬肉；無鉤絛蟲來自牛肉；肺吸蟲來自淡水蝦蟹。"},{"id":"114-2-6102-35","p":"114-2-6102","n":35,"q":"依據我國歷年食品中毒發生狀況累計統計資料顯示，發生率最高的食品病原菌主要為何？","o":["金黃色葡萄球菌、肉毒桿菌","病原性大腸桿菌、李斯特菌","腸炎弧菌、曲狀桿菌","腸炎弧菌、金黃色葡萄球菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"國內常見的食品中毒病原","ex":"依我國歷年統計，已知病因的食品中毒以腸炎弧菌、金黃色葡萄球菌、仙人掌桿菌，以及近年的諾羅病毒最常見。"},{"id":"114-2-6102-36","p":"114-2-6102","n":36,"q":"下列有關非洲豬瘟之敘述，何者正確？","o":["非洲豬瘟病毒會傳染給人，造成人類的疾病","非洲豬瘟病毒傳染豬隻，造成豬隻發高熱，內臟出血","人攝食病畜製品會引發食物中毒","非洲豬瘟病毒容易傳染家禽，引起經濟重大的損失"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"非洲豬瘟","ex":"非洲豬瘟只感染豬科動物，造成高燒、內臟出血與高死亡率；不會傳染給人，人吃了病豬產品也不會中毒，也不會傳染家禽。"},{"id":"114-2-6102-37","p":"114-2-6102","n":37,"q":"肺吸蟲常見於下列那種食物中？","o":["未充分加熱之鰹魚","未澈底洗淨之雞蛋","未充分加熱之豬肉","未煮熟之淡水蝦蟹"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"肺吸蟲","ex":"肺吸蟲的中間宿主是淡水螺與淡水蝦蟹，生吃或吃未煮熟的蝦蟹（如醉蟹）就可能感染。"},{"id":"114-2-6102-38","p":"114-2-6102","n":38,"q":"有關低酸性罐頭食品之敘述，下列何者錯誤？","o":["殺菌指標是PA3679","殺菌條件是針對肉毒桿菌之毒素","產品屬於pH 4.6以上且Aw 0.85以上者","應高溫殺菌以防止腐敗及中毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"低酸性罐頭","ex":"低酸性罐頭是 pH 大於 4.6、水活性大於 0.85 的罐頭，要以高溫殺菌破壞肉毒桿菌的「芽孢」，殺菌效果以較耐熱的 PA3679 作指標。殺菌是針對芽孢，不是毒素。"},{"id":"114-2-6102-39","p":"114-2-6102","n":39,"q":"下列何種病原菌所引起的食物中毒症狀為腹痛、水瀉、血便，且大部分患者不會有發燒症狀，但嚴重時會引起溶血性貧血與腎功能障礙？","o":["痢疾桿菌","腸出血型大腸桿菌","李斯特菌","下痢型仙人掌桿菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸出血性大腸桿菌","ex":"腸出血性大腸桿菌（如 O157:H7）產生志賀毒素，引起腹痛、水瀉轉血便，通常不發燒；嚴重時併發溶血性尿毒症候群（溶血性貧血、血小板減少、腎衰竭）。"},{"id":"114-2-6102-40","p":"114-2-6102","n":40,"q":"依據我國食品中污染物質及毒素衛生標準，新鮮馬鈴薯的總配醣生物鹼（total glycoalkaloids）限量標準為多少ppm？","o":["20","50","100","200"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"馬鈴薯的配醣生物鹼限量","ex":"依標準答案，新鮮馬鈴薯的總配醣生物鹼（茄鹼等）限量為 200 ppm。"},{"id":"114-2-6102-41","p":"114-2-6102","n":41,"q":"依據食品安全衛生管理法規定，應設置衛生管理人員之食品製造工廠類別及規模，不包含下列何者？","o":["罐頭食品製造業且資本額5千萬","食品添加物製造業資本額3千萬且食品從業人員6人","肉類加工食品業且資本額1.5億元","即食餐食業資本額2千萬且食品從業人員4人"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"應設置衛生管理人員的工廠","ex":"依標準答案，D 不在規定範圍內。罐頭食品、食品添加物製造業與一定資本額以上的肉類加工、乳品等工廠都要設置衛生管理人員。"},{"id":"114-2-6102-42","p":"114-2-6102","n":42,"q":"碳酸鈉與碳酸氫鈉屬於下列何種性質的食品用洗潔劑？","o":["酸性","中性","鹼性","界面活性"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"鹼性洗潔劑","ex":"碳酸鈉（蘇打）與碳酸氫鈉溶於水呈鹼性，可皂化油脂、分解蛋白質，屬鹼性洗潔劑。"},{"id":"114-2-6102-43","p":"114-2-6102","n":43,"q":"下列有關廚房常用設備與器具材質之敘述，何者正確？","o":["常用不鏽鋼為304系列，為鎳鉻錳合金","不鏽鋼之特性為表面光滑易清洗、不易變形","食品容器適合使用的塑膠材質包括聚氯乙烯類（PVC）及聚碳酸鹽類（PC）","鋁質結構輕軟，不易被清潔劑腐蝕"],"a":"B","c":"食品衛生與安全","c2":"團體膳食製備","ch":"容器包裝與洗潔劑","ch2":"設備與器具","t":"廚房設備的材質","ex":"不鏽鋼表面光滑、易清洗、不易變形。常用的 304 不鏽鋼是鉻鎳合金（18-8），不是鎳鉻錳；PVC 與 PC 有塑化劑與雙酚 A 的疑慮；鋁質輕軟，容易被酸鹼清潔劑腐蝕。"},{"id":"114-2-6102-44","p":"114-2-6102","n":44,"q":"有關食材驗收與管理之敘述，下列何者正確？①所有食材要有供貨來源及流向的追溯系統　②不合格的食材僅須明確標示不用另外放置　③冷凍產品的運輸條件需要驗收　④倉庫內食材應分類貯放在棧板、貨架上","o":["①②④","②③④","①③④","①②③"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"採購與驗收","t":"食材的驗收與管理","ex":"食材要能追溯來源與流向；冷凍品要檢查運輸溫度；倉庫食材應分類放在棧板或貨架上，離地離牆。不合格的食材除了標示外，也要另外隔離放置，以免誤用。"},{"id":"114-2-6102-45","p":"114-2-6102","n":45,"q":"有關我國食品良好衛生規範準則之敘述，下列何者正確？","o":["次氯酸水為鹽水電解而得，安全性高，使用不需三專管理","用於清洗作業之洗衣粉應標明其毒性、使用及緊急處理方法","味精屬於調味料，不必記錄用量","市售居家用的殺蟲劑毒性較低，可置放於作業現場，方便病媒防治"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"準則中的化學物質管理","ex":"清潔劑、消毒劑等化學物質應標明毒性、使用方法與緊急處理方法，並專人、專櫃、專冊管理。次氯酸水也是消毒劑，要三專管理；味精屬食品添加物，要記錄用量；殺蟲劑不能放在作業場所。"},{"id":"114-2-6102-46","p":"114-2-6102","n":46,"q":"採購時可請供應商提供相關檢驗證明，下列配對何者錯誤？","o":["蜂蜜－農藥殘留","地瓜粉－順丁烯二酸酐","雞肉－動物用藥殘留","大豆油－單氯丙二醇"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"採購檢驗證明的對應","ex":"蜂蜜檢驗農藥殘留、地瓜粉檢驗順丁烯二酸酐（毒澱粉）、雞肉檢驗動物用藥殘留都正確。單氯丙二醇是酸水解醬油的檢驗項目，大豆油一般不以它作為檢驗證明。"},{"id":"114-2-6102-47","p":"114-2-6102","n":47,"q":"依據我國飲用水水質標準，飲用水總菌數應在多少CFU/mL以下？","o":["250","200","150","100"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"飲用水的總菌落數","ex":"依飲用水水質標準，總菌落數限值為 100 CFU/mL，大腸桿菌群為 6 CFU/100mL。"},{"id":"114-2-6102-48","p":"114-2-6102","n":48,"q":"利用碘試驗法主要是檢測餐具或容器之何種殘留物？","o":["清潔劑","蛋白質","澱粉","脂肪"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"衛生與安全","t":"餐具的殘留檢驗","ex":"碘試驗是把碘液滴在餐具上，若有澱粉殘留會呈藍紫色。脂肪殘留用蘇丹 IV 試驗；清潔劑殘留用甲基藍試驗。"},{"id":"114-2-6102-49","p":"114-2-6102","n":49,"q":"依據我國食品安全衛生管理法規定，食品原料中非故意攙入基因改造食品原料超過多少％即視為基因改造食品？","o":["0.3","1","2","3"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"基因改造食品的標示門檻","ex":"我國規定食品原料中非故意攙入基因改造原料超過 3% 時，即視為基因改造食品，應標示。"},{"id":"114-2-6102-50","p":"114-2-6102","n":50,"q":"下列有關食品過敏原標示規定之敘述，何者正確？","o":["餐廳菜單應揭露食品過敏原資訊","銷售給食品製造業者的花生醬，於外包裝得免標過敏原警語","若食品標示的內容物已展開過敏原成分，不需標示過敏原警語","蕎麥屬於含麩質穀物，應標示過敏原資訊"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"過敏原的標示","ex":"過敏原標示規定只用在直接販售給消費者的包裝食品；售給食品業者作為原料的產品可免標。餐廳菜單目前不強制揭露；即使內容物已列出過敏原，仍要另外標示警語；蕎麥屬過敏原，但不是含麩質穀物。"}]};

function inCourse(q, c) { return q.c === c || q.c2 === c; }
function inChapter(q, c, ch) { return (q.c === c && q.ch === ch) || (q.c2 === c && q.ch2 === ch); }
function groupOf(id) { for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i]; return null; }
function inGroup(q, g) { return g.courses.indexOf(q.c) >= 0 || (q.c2 && g.courses.indexOf(q.c2) >= 0); }
function pool() {

  if (S.chapter) return Q.filter(function (q) { return inChapter(q, S.course, S.chapter); });
  return Q.filter(function (q) { return inCourse(q, S.course); });
}

  var G = groupOf(S.group);
  SES = null; head('歷屆考題', (G ? G.name + '・' : '') + '營養師國考選擇題練習', false);
  var h = '<a class="jump" href="pathway.html"><b>圖解生理生化</b><span>看圖填空，一關一關把代謝路徑、DNA 複製、轉譯等過程記起來</span><i>›</i></a>' +
    '<div class="card pad"><div class="lab">出題範圍</div>' + seg('s_by', [['course', '依上課科目'], ['paper', '依國考試卷']], S.by);
  if (S.by === 'course') {
    var cnt = function (c) { return Q.filter(function (q) { return inCourse(q, c); }).length; };
    var all = G ? Q.filter(function (q) { return inGroup(q, G); }).length : Q.length;
    h += '<div class="lab">上課科目</div><div id="s_course"><div class="chips"><button type="button" data-v="" class="' + (S.course ? '' : 'on') + '">' + (G ? '這一類全部' : '全部') + '<span class="c">' + all + '</span></button></div>' +
      (G ? [G] : GROUPS).map(function (g) {
        return '<div class="glab">' + esc(g.name) + '</div><div class="chips">' + g.courses.map(function (c) { var n = cnt(c);
          return '<button type="button" data-v="' + esc(c) + '" class="' + (c === S.course ? 'on' : '') + '"' + (n ? '' : ' disabled') + '>' + esc(c) + '<span class="c">' + n + '</span></button>'; }).join('') + '</div>';
      }).join('') + '</div>' + (G ? '<button type="button" class="lnk" id="allg">看全部科目</button>' : '');
    var chs = S.course ? (CHAPTERS[S.course] || []).map(function (ch) { return [ch, Q.filter(function (q) { return inChapter(q, S.course, ch); }).length]; }).filter(function (x) { return x[1] > 0; }) : [];
    if (chs.length) h += '<div class="lab">章節</div><div class="chips" id="s_chapter"><button type="button" data-v="" class="' + (S.chapter ? '' : 'on') + '">全部</button>' +
      chs.map(function (x) { return '<button type="button" data-v="' + esc(x[0]) + '" class="' + (x[0] === S.chapter ? 'on' : '') + '">' + esc(x[0]) + '<span class="c">' + x[1] + '</span></button>'; }).join('') + '</div>';
  } else {
    h += '<div class="lab">國考試卷</div>' + PAPERS.map(function (p) { return '<button type="button" class="paper' + (p.id === S.paper ? ' on' : '') + '" data-p="' + esc(p.id) + '"><b>' + esc(paperName(p)) + '</b><span>' + Q.filter(function (q) { return q.p === p.id; }).length + ' 題</span></button>'; }).join('');
  }
  var n = pool().length, size = S.size === 'all' ? n : Math.min(+S.size, n);
  h += '<div class="lab">題數</div>' + seg('s_size', [[10, '10 題'], [20, '20 題'], ['all', '全部']], S.size) +
    '<div class="lab">出題順序</div>' + seg('s_order', [['rand', '隨機'], ['no', '照題號']], S.order) +
    '<div class="lab">對答案與看解析的時機</div>' + seg('s_mode', [['now', '每題作答後'], ['end', '全部寫完交卷後']], S.mode) +
    '<div style="margin-top:16px"><button type="button" class="btn" id="go"' + (n ? '' : ' disabled') + '>' + (n ? '開始測驗（' + size + ' 題）' : '這個範圍目前沒有題目') + '</button></div>' +
    '<div class="small muted" style="margin-top:8px;text-align:center">這個範圍共 ' + n + ' 題</div></div>';

  var done = Q.filter(function (q) { return REC[q.id]; }).length, wl = wrongList();
  h += '<div class="card pad"><h2>我的紀錄</h2>';
  if (!STORE_OK) h += '<div class="small muted">這個瀏覽器無法儲存資料，作答紀錄與錯題不會保留；請改用手機的 Chrome 或 Safari 開啟。</div>';
  else h += '<div class="grid3" style="margin-top:8px"><div class="stat"><span>做過的題目</span><b>' + done + '</b> ／' + Q.length + '</div><div class="stat"><span>目前錯題</span><b>' + wl.length + '</b> 題</div>' +
    '<div class="stat"><span>累計作答</span><b>' + Q.reduce(function (s, q) { return s + (REC[q.id] ? REC[q.id].n : 0); }, 0) + '</b> 次</div></div>' +
    '<div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="redo"' + (wl.length ? '' : ' disabled') + '>練習錯題</button><button type="button" class="btn warn" id="clr"' + (done ? '' : ' disabled') + '>清除紀錄</button></div>' +
    '<div class="small muted" style="margin-top:8px">錯題是最後一次答錯的題目，之後答對就會從錯題移除。</div>';
  h += '</div>';
  h += '<p class="note">試題與標準答案來源：考選部「考畢試題查詢平臺」。考選部只公布答案；上課科目與章節的分類、參考解析都是自行整理，不是官方內容，僅供複習使用，若與課本或老師的說明不同，以課本與老師為準。</p>' +
    (STORE_OK ? '<p class="note">作答紀錄只存在這支手機的瀏覽器。清除瀏覽器資料、LINE 清除快取、換手機，或 iPhone 超過一週沒打開，紀錄會消失；題目不受影響。</p>' : '');
  $('main').innerHTML = h;

  onSeg('s_by', function (v) { S.by = v; savePref(); home(); });
  onSeg('s_course', function (v) { S.course = v; S.chapter = ''; home(); });
  if ($('allg')) $('allg').onclick = function () { S.group = ''; S.course = ''; S.chapter = ''; home(); };
  onSeg('s_chapter', function (v) { S.chapter = v; home(); });
  onSeg('s_size', function (v) { S.size = v === 'all' ? 'all' : +v; savePref(); home(); });
  onSeg('s_order', function (v) { S.order = v; savePref(); home(); });
  onSeg('s_mode', function (v) { S.mode = v; savePref(); home(); });
  document.querySelectorAll('.paper').forEach(function (b) { b.onclick = function () { S.paper = b.getAttribute('data-p'); home(); }; });
  $('go').onclick = function () {
    var list = S.order === 'rand' ? shuffle(pool()) : byNo(pool());
    if (S.size !== 'all') list = list.slice(0, +S.size);
    if (S.order !== 'rand') list = byNo(list);
    start(list, S.mode);
  };
  if ($('redo')) $('redo').onclick = function () { start(shuffle(wrongList()), 'now'); };
  if ($('clr')) $('clr').onclick = function () { if (confirm('確定要清除所有作答紀錄與錯題嗎？清除後無法復原。')) { REC = {}; saveRec(); home(); } };
  window.scrollTo(0, 0);
}

/* ---------- 作答 ---------- */
function start(list, mode) { if (!list.length) return; SES = { qs: list, i: 0, picks: {}, mode: mode, done: false }; showQ(); }
function answered() { return SES.qs.filter(function (q) { return SES.picks[q.id]; }).length; }
function meta(q) {
  return '<div style="margin-top:8px"><span class="tag k">' + esc(q.c) + '</span><span class="tag">' + esc(q.ch) + '</span>' + (q.c2 ? '<span class="tag">也屬於 ' + esc(q.c2) + (q.ch2 ? '・' + esc(q.ch2) : '') + '</span>' : '') + '</div>' +
    (q.t ? '<div class="small muted" style="margin-top:4px">考點：' + esc(q.t) + '</div>' : '');
}
function optHtml(q, pick, reveal, lock) {
  return KEYS.map(function (k, i) {
    var cls = '', mark = '';
    if (reveal) { if (isRight(q, k)) { cls = ' right'; mark = '正確答案'; } else if (pick === k) { cls = ' wrong'; mark = '你的答案'; } if (pick === k && isRight(q, k)) mark = '你答對了'; }
    else if (pick === k) cls = ' sel';
    return '<button type="button" class="opt' + cls + '" data-k="' + k + '"' + (lock ? ' disabled' : '') + '><span class="k">' + k + '</span><span class="x">' + esc(q.o[i]) + '</span>' + (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');
}
function expl(q) { return q.ex ? '<div class="exp"><h3>參考解析</h3>' + esc(q.ex).replace(/\n/g, '<br>') + '</div>' : ''; }
function feedback(q, pick) {
  var ok = pick && isRight(q, pick);
  return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b class="v">' + (ok ? '答對了' : pick ? '答錯了' : '未作答') + '</b>　正確答案：<b>' + esc(ansText(q)) + '</b>' + meta(q) + '</div>' + expl(q);
}
function showQ() {
  var q = SES.qs[SES.i], n = SES.qs.length, pick = SES.picks[q.id], now = SES.mode === 'now', reveal = now && !!pick, last = SES.i === n - 1, p = paperOf(q);
  head('第 ' + (SES.i + 1) + ' ／ ' + n + ' 題', now ? '每題作答後對答案' : '已作答 ' + answered() + ' 題・交卷後對答案', true);
  $('progi').style.width = ((SES.i + (pick ? 1 : 0)) / n * 100) + '%';
  var h = '<div class="card pad"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' +
    '<div class="qt">' + esc(q.q) + '</div>' + optHtml(q, pick, reveal, reveal) + (reveal ? feedback(q, pick) : '') + '</div>';
  h += '<div class="foot"><div class="row">';
  if (now) h += '<button type="button" class="btn" id="nx"' + (pick ? '' : ' disabled') + '>' + (last ? '看成績' : '下一題') + '</button>';
  else h += '<button type="button" class="btn plain" id="pv"' + (SES.i ? '' : ' disabled') + '>上一題</button>' + (last ? '<button type="button" class="btn" id="fin">交卷</button>' : '<button type="button" class="btn" id="nx">下一題</button>');
  h += '</div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () {
    if (now && SES.picks[q.id]) return;
    SES.picks[q.id] = b.getAttribute('data-k'); if (now) record(q, SES.picks[q.id]);
    var y = window.pageYOffset; showQ(); window.scrollTo(0, y);
  }; });
  if ($('nx')) $('nx').onclick = function () { if (last) finish(); else { SES.i++; showQ(); window.scrollTo(0, 0); } };
  if ($('pv')) $('pv').onclick = function () { SES.i--; showQ(); window.scrollTo(0, 0); };
  if ($('fin')) $('fin').onclick = function () { var left = n - answered(); if (!left || confirm('還有 ' + left + ' 題沒有作答，確定要交卷嗎？')) finish(); };
}
$('quit').onclick = function () {
  if (!SES) return;
  var a = answered();
  if (!a) { home(); return; }
  if (SES.mode === 'now') { if (confirm('要結束這次測驗嗎？已作答的 ' + a + ' 題會算成績。')) finish(); }
  else if (confirm('要結束這次測驗嗎？\n\n按「確定」交卷看成績，按「取消」繼續作答。')) finish();
};
function finish() {
  if (SES.mode === 'end' && !SES.done) SES.qs.forEach(function (q) { if (SES.picks[q.id]) record(q, SES.picks[q.id]); });
  SES.done = true; SES.show = 'all'; result(); window.scrollTo(0, 0);
}

/* ---------- 成績 ---------- */
function result() {
  var qs = SES.qs, right = 0, wrong = 0, none = 0, by = {}, order = [];
  qs.forEach(function (q) {
    var k = SES.picks[q.id], key = q.c + '・' + q.ch; if (!by[key]) { by[key] = [0, 0]; order.push(key); }
    if (!k) { none++; return; } by[key][1]++; if (isRight(q, k)) { right++; by[key][0]++; } else wrong++;
  });
  var done = right + wrong, pct = done ? Math.round(right / done * 100) : 0;
  head('測驗結果', '共 ' + qs.length + ' 題', false);
  var h = '<div class="card pad"><div class="grid3"><div class="stat hl"><span>答對率</span><b>' + pct + '</b> %</div><div class="stat"><span>答對</span><b>' + right + '</b> 題</div><div class="stat"><span>答錯</span><b>' + wrong + '</b> 題</div></div>' +
    '<div class="small muted" style="margin-top:8px">答對率 ＝ 答對 ÷ 已作答的 ' + done + ' 題' + (none ? '；另有 ' + none + ' 題未作答，不列入計算' : '') + '。</div>' +
    '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="again"' + (wrong ? '' : ' disabled') + '>再練這次的錯題</button><button type="button" class="btn" id="back">回首頁</button></div></div>';
  var keys = order.filter(function (k) { return by[k][1]; });
  if (keys.length > 1) h += '<div class="card pad"><h2>各章節表現</h2><table style="margin-top:4px"><tr><th>科目・章節</th><th>答對</th><th>作答</th></tr>' +
    keys.sort(function (a, b) { return by[a][0] / by[a][1] - by[b][0] / by[b][1]; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + by[k][0] + '</td><td>' + by[k][1] + '</td></tr>'; }).join('') + '</table></div>';
  h += seg('r_show', [['all', '全部 ' + qs.length], ['bad', '答錯 ' + wrong]], SES.show);
  var list = qs.filter(function (q) { var k = SES.picks[q.id]; return SES.show === 'all' || (k && !isRight(q, k)); });
  h += '<div class="card">' + (list.length ? list.map(function (q) {
    var k = SES.picks[q.id], ok = k && isRight(q, k), p = paperOf(q);
    return '<details class="rv"><summary><span class="mk ' + (!k ? 'na' : ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (!k ? '－' : ok ? '○' : '✕') + '</span><div class="st"><div class="q1">' + esc(q.q) + '</div>' +
      '<div class="small muted" style="margin-top:2px">' + (!k ? '未作答' : ok ? '答對' : '答錯') + '・你的答案 ' + (k || '—') + '・正確答案 ' + esc(ansText(q)) + '</div></div></summary>' +
      '<div class="bd"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' + optHtml(q, k, true, true) + meta(q) + expl(q) + '</div></details>';
  }).join('') : '<div class="empty">這次沒有答錯的題目</div>') + '</div><p class="note">點題目可以看選項、正確答案與參考解析。</p>';
  $('main').innerHTML = h;
  onSeg('r_show', function (v) { SES.show = v; var y = window.pageYOffset; result(); window.scrollTo(0, y); });
  $('back').onclick = home;
  $('again').onclick = function () { start(shuffle(qs.filter(function (q) { var k = SES.picks[q.id]; return k && !isRight(q, k); })), 'now'); window.scrollTo(0, 0); };
}

home();
</script>
</body>
