o":["經專家審查並做問卷修改後","找背景相似的受試者進行預試後","經焦點團體訪談並編製問卷題目後","確認研究對象並有效抽樣後"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"量表的預試與信度檢驗","ex":"量表初稿完成後，要先找背景和正式對象相似的人做預試，再用預試的資料做項目分析與內部一致性（例如 Cronbach's α）的信度檢驗。"},{"id":"115-1-5102-28","p":"115-1-5102","n":28,"q":"教案設計中，下列敘述何者並非訂定教學目標時需考慮的事項？","o":["學習者的興趣能力","具體可行的評估方法","誘發學習動機","學習者的起點行為"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"教學目標的訂定","ex":"訂定教學目標要考慮學習者的起點行為、興趣和能力，目標也要具體、可以評量。誘發學習動機是教學活動的設計，不是訂定目標時考慮的事項。"},{"id":"115-1-5102-29","p":"115-1-5102","n":29,"q":"一減重班課程，講師提出統計數據說明肥胖會增加日後中風機率，並播放中風患者的血管阻塞影片。這個課程活動設計是針對那個飲食行為改變的中介因子？","o":["意識覺醒","自覺危機","社會規範","自我效能"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"健康信念模式的自覺危機","ex":"用統計數據和影片讓學員感受到「自己可能會得」而且「後果很嚴重」，是在提高健康信念模式中的自覺危機（自覺罹患性加上自覺嚴重性）。"},{"id":"115-1-5102-30","p":"115-1-5102","n":30,"q":"使用教學媒體（media）為營養教育的工具，其優點不包含下列那一項？","o":["可短時間傳遞內容給學習者，提高學習效率","記憶保留率較採用觀看法的教學方式高","教學者事先進行內容整理、組織，可節省教學時間","不受場地設備與空間大小影響"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"教學媒體的優缺點","ex":"使用教學媒體需要相對應的設備、電力和合適的場地，會受到場地設備與空間大小的限制。"},{"id":"115-1-5102-31","p":"115-1-5102","n":31,"q":"依據跨理論模式（Transtheoretical Model），如果一個人運動行為改變階段正處於無意圖期，下列那些有利於改變歷程的介入方法較適用？①增強管理　②自我再評估　③刺激控制　④戲劇慰藉　⑤環境再評估","o":["①④","④⑤","①②","②③"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"跨理論模式的改變階段與改變歷程","ex":"無意圖期的人還不認為自己需要改變，適合用認知與情感層面的歷程：意識覺醒、戲劇慰藉（情感喚起）和環境再評估。自我再評估用在意圖期；增強管理和刺激控制是行動期、維持期用的行為層面歷程。"},{"id":"115-1-5102-32","p":"115-1-5102","n":32,"q":"實施體重控制介入計畫中，「體重的改變」是屬於PRECEDE-PROCEED模式的那一種評價？","o":["過程評價（process evaluation）","結果評價（outcome evaluation）","衝擊評價（impact evaluation）","形式評價（format evaluation）"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"PRECEDE-PROCEED 模式的評價類型","ex":"過程評價看的是計畫有沒有照規劃執行；衝擊評價看知識、態度、行為等立即的改變；結果評價看健康狀況與生活品質等最終成效。體重的改變屬於健康狀況，是結果評價。"},{"id":"115-1-5102-33","p":"115-1-5102","n":33,"q":"針對社區老人進行健康促進計畫時，衛教肌少症的飲食與運動，此為計畫的那個步驟？","o":["確認問題","訂定目標","執行計畫","評價計畫"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社區營養計畫的步驟","ex":"實際對社區老人進行衛教，是在執行計畫。"},{"id":"115-1-5102-34","p":"115-1-5102","n":34,"q":"下列何者非社區營養計畫的策略性規劃可利用的4M？","o":["預算（Money）","期間（Meantime）","物質設備（Materials）","行銷（Marketing）"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫規劃可用的資源 4M","ex":"規劃計畫時可運用的資源 4M 是人力（Manpower）、預算（Money）、物質設備（Materials）和時間（Meantime）。行銷不在其中。"},{"id":"115-1-5102-35","p":"115-1-5102","n":35,"q":"社區關懷中心今年舉辦延緩失能講座，共花費300萬元，完成30場講座，拍攝2支宣導短片及舉辦一場園遊會，此為何種計畫評價？","o":["效果","效能","效率","效益"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫評價：效率","ex":"拿投入的資源（300 萬元）和產出（30 場講座、2 支短片、1 場園遊會）來比較，評的是效率。效果或效能看的是目標達成多少；效益是把成果換算成金錢價值。"},{"id":"115-1-5102-36","p":"115-1-5102","n":36,"q":"為了降低成人肥胖問題，在社區規劃為期三個月的「體重控制飲食與健康課程」，目標設立為三個月後有30％參與者體重下降2公斤或更多，這個目標屬於下列何者？","o":["願景","結果目標","過程目標","結構目標"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫目標的類型","ex":"結果目標描述的是計畫結束後，目標族群在健康或營養狀況上要達到的改變，例如體重下降多少。過程目標是活動的執行情形；結構目標是人力、經費、設備等資源。"},{"id":"115-1-5102-37","p":"115-1-5102","n":37,"q":"利用企業的策略行銷觀念應用在社區營養計畫，下列那一個步驟可以清楚了解目標族群的需求（needs & wants）？","o":["確認問題","區分特定族群","市場混合多樣化","對社區居民的研究與分析"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社會行銷的步驟","ex":"社會行銷以消費者為中心，要了解目標族群的需求，就必須先對社區居民做研究與分析。"},{"id":"115-1-5102-38","p":"115-1-5102","n":38,"q":"有關民國106～109年國民營養健康狀況變遷調查，骨質密度檢測的敘述，下列何者正確？","o":["停經後T-score為-1.5的個案，建議應適度運動，並多攝取含鈣及維生素D的食物或補充品","對於20歲以下個案，使用T-score與同性別、同年齡的骨質密度做比較","檢測後T-score為-2.0代表骨質疏鬆症（osteoporosis）","以「可攜式定量超音波骨密度儀（quantitative ultrasound, QUS）」進行骨質密度檢測"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"骨質密度的判讀","ex":"T 值在 −1.0 到 −2.5 之間是骨質缺乏，建議運動並補足鈣與維生素 D，A 正確。B：20 歲以下要用 Z 值和同齡者比較。C：T 值要低於或等於 −2.5 才是骨質疏鬆症。D：這次調查是用雙能量 X 光吸收儀檢測。"},{"id":"115-1-5102-39","p":"115-1-5102","n":39,"q":"比較民國102～105年與106～109年兩次國民營養健康狀況變遷調查，19歲以上成人慢性疾病罹患情形，下列敘述何者錯誤？","o":["高血壓盛行率小幅上升","糖尿病盛行率下降","高血脂盛行率上升","代謝症候群盛行率上升"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的慢性病盛行率變化","ex":"兩次調查相比，成人的高血壓、糖尿病、高血脂和代謝症候群盛行率都是上升，糖尿病並沒有下降。"},{"id":"115-1-5102-40","p":"115-1-5102","n":40,"q":"我國自那一年的全國營養調查首次採用實際食物測量進行家庭膳食攝取狀況、兒童身體發育調查？","o":["1972年","1980年","1986年","1993年"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次全國營養調查的沿革","ex":"依標準答案，是 1980 年（民國 69 年）開始的第一次全國營養調查。"},{"id":"115-1-5102-41","p":"115-1-5102","n":41,"q":"依據民國106～109年國民營養健康狀況變遷調查，下列何種營養素之攝取量依國人性別、年齡別均達到100％ DRIs之建議？","o":["維生素E","維生素B12","維生素B2","維生素D"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人營養素攝取狀況","ex":"國人維生素 B12 的攝取量在各性別與年齡層都超過建議量。維生素 D、維生素 E 和鈣是普遍攝取不足的營養素。"},{"id":"115-1-5102-42","p":"115-1-5102","n":42,"q":"有關歷次全國營養調查之敘述，下列何者錯誤？","o":["1986～1988年開始進行全國營養調查","1993～1996年將全國營養調查更名為「國民營養健康狀況變遷調查」","2012年以前由衛生福利部食品藥物管理署（原行政院衛生署食品衛生處）委辦調查","2013年後由衛生福利部國民健康署委辦"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次全國營養調查的沿革","ex":"臺灣第一次全國營養調查是 1980～1981 年，1986～1988 年已經是第二次，所以 A 說「開始進行」是錯的。"},{"id":"115-1-5102-43","p":"115-1-5102","n":43,"q":"世界衛生組織針對反式脂肪酸的六項行動REPLACE中的「A」代表什麼？","o":["Assess－評估食物供應鏈的反式脂肪酸與民眾反式脂肪酸攝取量","Aim－設定反式脂肪酸的目標","Accessibility－降低反式脂肪酸可近性","Affordability－透過課稅提高經濟負擔"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"世界衛生組織的反式脂肪 REPLACE 行動","ex":"REPLACE 六項行動是：REview 檢視來源、Promote 推廣替代油脂、Legislate 立法、Assess 評估與監測、Create awareness 提高意識、Enforce 落實執法。A 代表評估與監測。"},{"id":"115-1-5102-44","p":"115-1-5102","n":44,"q":"有關糧食不安全經驗量表（Food Insecurity Experience Scale, FIES），下列何者錯誤？","o":["能反映個人或家戶取得食物的能力","用來評估食品安全事件相關後遺症","具跨文化共同性，可提供國際比較","是聯合國農糧署針對永續發展目標2（Zero hunger）採用的監測指標之一"],"a":"B","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"糧食不安全經驗量表","ex":"這個量表衡量的是個人或家戶取得足夠食物的困難程度，也就是糧食安全（food security），和食品安全事件（food safety）無關。"},{"id":"115-1-5102-45","p":"115-1-5102","n":45,"q":"下列那一項不是世界衛生組織全球2025年母親與嬰幼兒營養的目標（Global 2025 Target）？","o":["增加出生6個月內完全哺育母乳率","降低5歲以下孩童生長遲緩（stunting）","降低兒童肥胖率","降低育齡婦女貧血比例"],"a":"C","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"世界衛生組織 2025 全球營養目標","ex":"2025 全球營養目標有六項：降低兒童生長遲緩、降低育齡婦女貧血、降低低出生體重、兒童過重「不再增加」、提高純母乳哺育率、降低兒童消瘦。兒童過重的目標是不增加，不是降低。"},{"id":"115-1-5102-46","p":"115-1-5102","n":46,"q":"政府呼籲國人每年接受季節性流感疫苗注射以降低感染風險，是屬於疾病預防措施的那一階段？","o":["第一段第一級","第一段第二級","第二段第三級","第三段第四級"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"三段五級預防","ex":"三段五級：第一段有第一級健康促進和第二級特殊保護；第二段是第三級早期診斷與早期治療；第三段有第四級限制殘障和第五級復健。接種疫苗是針對特定疾病的特殊保護，屬於第一段第二級。"},{"id":"115-1-5102-47","p":"115-1-5102","n":47,"q":"世界衛生組織歸納四個增加「非傳染性慢性疾病（Noncommunicable diseases）」風險的代謝危險因子，不包含下列何者？","o":["高血壓","體重過重與肥胖","高血糖","高尿酸"],"a":"D","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"非傳染性疾病的代謝危險因子","ex":"世界衛生組織列出的四個代謝危險因子是血壓升高、過重與肥胖、高血糖、高血脂。高尿酸不在其中。"},{"id":"115-1-5102-48","p":"115-1-5102","n":48,"q":"若要評估「我的餐盤」是否能有效降低血壓，下列那一種研究設計最具科學說服力？","o":["隨機臨床試驗","臨床個案報告","世代研究","準實驗設計"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的證據強度","ex":"隨機臨床試驗把受試者隨機分組，可以控制干擾因子，最能證明因果關係。證據強度依序是隨機試驗、準實驗、世代研究、個案報告。"},{"id":"115-1-5102-49","p":"115-1-5102","n":49,"q":"下列何者為糖尿病防治策略的二段預防（secondary prevention）工作？","o":["成人健檢","視網膜檢查","教導民眾壓力調適","推廣健康生活習慣"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"糖尿病的次段預防","ex":"次段預防是早期發現、早期治療，例如用成人健檢篩檢出血糖異常的人。視網膜檢查是已經罹病者的併發症防治，屬於三段預防；壓力調適和健康生活習慣是初段預防。"},{"id":"115-1-5102-50","p":"115-1-5102","n":50,"q":"某研究定期評估婦女之黃豆日常攝取量及是否罹癌，以了解黃豆與癌症發生之關係，下列何種研究設計最適當？","o":["世代研究法","實驗性研究法","橫斷性研究法","病例對照研究法"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的選擇","ex":"先定期記錄婦女的黃豆攝取量，再追蹤日後是否罹癌，是先有暴露資料、再觀察疾病發生的世代研究法。"},{"id":"115-1-6102-1","p":"115-1-6102","n":1,"q":"依據我國食品良好衛生規範準則，食品容器製造業所建立之紀錄，其保存之規定為何？","o":["製造日期後1年以上","製造日期後3年以上","有效日期後1年以上","有效日期後3年以上"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"食品良好衛生規範準則的紀錄保存","ex":"依標準答案，食品容器製造業的紀錄應保存到有效日期後 3 年以上。"},{"id":"115-1-6102-2","p":"115-1-6102","n":2,"q":"依據我國食品良好衛生規範準則，可以在常溫貯存及販賣之真空包裝即食食品之條件，不包括下列何者？","o":["水活性在0.85以下","pH值在9.0以上","pH值小於4.6之天然酸性食品","鹽濃度為5％之發酵食品"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"真空包裝即食食品的常溫貯存條件","ex":"準則規定可在常溫貯存販售的條件，包括水活性 0.85 以下、pH 值 9.0 以上、經商業滅菌、pH 值小於 4.6 的天然酸性食品，以及發酵後 pH 值小於 4.6 或鹽濃度大於 10% 的發酵食品。鹽濃度只有 5% 的發酵食品不符合。"},{"id":"115-1-6102-3","p":"115-1-6102","n":3,"q":"下列有關食品安全管制系統中管制界線之敘述，何者錯誤？","o":["需考量產品內部及環境因子","可防止病原菌毒素產生","可防止病原菌生長","加工上的管制界限足以影響冷卻速率"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 的管制界限","ex":"依標準答案，C 的敘述是錯的。管制界限是在重要管制點上區分可接受與不可接受的基準，例如溫度、時間、酸鹼值、水活性。"},{"id":"115-1-6102-4","p":"115-1-6102","n":4,"q":"食品安全管制系統計畫書中，須進行產品描述及貯運方式，下列何者不屬於產品特性？","o":["即食性","水活性","pH值","包裝方式"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 計畫書的產品描述","ex":"產品描述中的「產品特性」是指產品本身的性質，例如成分、酸鹼值、水活性、是否為即食食品。包裝方式是另外列出的項目，和貯存、運送方式一樣不屬於產品特性。"},{"id":"115-1-6102-5","p":"115-1-6102","n":5,"q":"依據我國包裝食品營養宣稱應遵行事項，包裝食品每100毫升液體之糖含量低於多少公克時，得標示為無糖？","o":["0.5","0.7","0.9","1.0"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"「無糖」的營養宣稱標準","ex":"每 100 公克固體或每 100 毫升液體所含的糖不超過 0.5 公克，才可以標示「無糖」。"},{"id":"115-1-6102-6","p":"115-1-6102","n":6,"q":"依據我國食品安全管制系統準則，下列何項符合「食品安全管制小組成員」之規定？","o":["食品業者負責人與其指定人員，共2人","食品業者負責人與專門職業人員，共2人","食品業者負責人、專門職業人員、生產線幹部，共3人","專門職業人員、衛生管理人員、品質管制人員，共3人"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品安全管制小組的成員","ex":"管制小組的成員至少 3 人，負責人或他指定的人員是必要成員，另外包括品保、生產、衛生管理人員或專門職業人員等。C 的組成符合規定。"},{"id":"115-1-6102-7","p":"115-1-6102","n":7,"q":"微生物之間可以同時存在，但不會幫助或阻礙彼此的生長，此種現象稱為下列何者？","o":["拮抗作用","共生作用","加乘作用","寄生作用"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"微生物之間的交互作用","ex":"依標準答案為共生作用。拮抗作用是互相抑制，加乘作用是互相促進，寄生作用是一方得利、另一方受害。"},{"id":"115-1-6102-8","p":"115-1-6102","n":8,"q":"食品安全性評估常利用動物實驗結果進行推估，因動物福祉科學，國際間針對實驗動物推動3R原則。下列何者不屬於3R原則的範疇？","o":["減量（Reduction）","負責（Responsibility）","精緻化（Refinement）","替代（Replacement）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"動物實驗的 3R 原則","ex":"實驗動物的 3R 是替代（Replacement）、減量（Reduction）、精緻化（Refinement）。負責不在其中。"},{"id":"115-1-6102-9","p":"115-1-6102","n":9,"q":"有關慢性毒性試驗結果的敘述，下列何者錯誤？","o":["可推算無毒害作用劑量","可推算最低毒害作用劑量","可推估物質的每日攝取容許量","可用來推算半致死劑量"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"慢性毒性試驗的用途","ex":"半致死劑量是由急性毒性試驗求得的。慢性毒性試驗可以得到無毒害作用劑量和最低毒害作用劑量，再除以安全係數推估每日攝取容許量。"},{"id":"115-1-6102-10","p":"115-1-6102","n":10,"q":"安全性屬於第三類的健康食品審查時，無須提供下列何項安全性評估試驗報告？","o":["基因毒性試驗","90天餵食毒性試驗","致畸胎試驗","致癌性試驗"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"健康食品安全性分類與試驗項目","ex":"健康食品的安全性分四類。第三類要做基因毒性試驗、90 天餵食毒性試驗和致畸胎試驗；致癌性試驗和繁殖試驗是第四類才需要。"},{"id":"115-1-6102-11","p":"115-1-6102","n":11,"q":"有關直接使用於消毒或洗滌食品、食品容器及食品包裝之洗潔劑的敘述，下列何者錯誤？","o":["我國以支鏈式烷基苯磺酸鹽的硬性洗潔劑為主","軟性洗潔劑毒性較硬性洗潔劑強，但在環境中易受微生物分解","部分洗潔劑會造成動物肝功能受損或皮膚的刺激","洗潔劑及其含有之輔助劑易造成生態污染"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"食品用洗潔劑的種類","ex":"我國使用的是直鏈式烷基苯磺酸鹽這類軟性洗潔劑，容易被微生物分解。支鏈式的硬性洗潔劑不易分解，會污染環境，早已不使用。"},{"id":"115-1-6102-12","p":"115-1-6102","n":12,"q":"有關我國食品業者使用漂白劑的敘述，下列何者符合法規？","o":["亞硫酸鹽用於免洗竹筷之漂白","吊白塊用於米粉之漂白及防腐","螢光增白劑用於洋菇及吻仔魚之增白","福馬林用於蘿蔔乾之漂白及防腐"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"漂白劑的合法使用","ex":"吊白塊、螢光增白劑和福馬林都不是合法的食品添加物，不得使用於食品。依標準答案，以亞硫酸鹽處理免洗竹筷是符合法規的做法，但二氧化硫的殘留量有限制。"},{"id":"115-1-6102-13","p":"115-1-6102","n":13,"q":"洗潔劑中之壬基苯酚（nonylphenol），對哺乳類動物主要造成下列何種系統損傷？","o":["消化系統","神經系統","生殖系統","循環系統"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"壬基苯酚的毒性","ex":"壬基苯酚是環境荷爾蒙，作用類似雌激素，會干擾內分泌，主要損害生殖系統。"},{"id":"115-1-6102-14","p":"115-1-6102","n":14,"q":"有機磷農藥抑制下列何種酵素活性，影響神經傳導作用，造成急性中毒？","o":["乙醯膽鹼轉化酶（choline acetyltransferase）","乙醯膽鹼酯酶（acetylcholinesterase）","多巴胺β-羥化酶（dopamine β-hydroxylase）","單胺氧化酶（monoamine oxidase）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"有機磷農藥的中毒機轉","ex":"有機磷農藥抑制乙醯膽鹼酯酶，使乙醯膽鹼無法分解而堆積在神經突觸，造成流涎、縮瞳、肌肉顫動、呼吸困難等急性中毒症狀。"},{"id":"115-1-6102-15","p":"115-1-6102","n":15,"q":"我國進口肉品中，下列何項動物組織不得檢出萊克多巴胺？","o":["牛脂","牛肌肉","豬脂","豬肌肉"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"萊克多巴胺的殘留容許量","ex":"我國只對牛的肌肉訂有萊克多巴胺的殘留容許量；豬則訂有肌肉、脂、肝、腎等部位的容許量。沒有訂定容許量的牛脂就是不得檢出。"},{"id":"115-1-6102-16","p":"115-1-6102","n":16,"q":"下列有關於鯖科魚類中毒症（scombrotoxicosis）之敘述，何者錯誤？","o":["食用保存不當之鰹魚、沙丁魚","通常具有致命性","主要是魚體遭受細菌污染所致","因魚體產生高量組織胺而造成中毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"組織胺（鯖魚）中毒","ex":"鯖魚、鮪魚、鰹魚、沙丁魚等保存不當時，細菌把魚肉中的組胺酸轉變成組織胺。中毒症狀像過敏，例如臉潮紅、起疹、頭痛、腹瀉，通常在一天內恢復，很少致命。"},{"id":"115-1-6102-17","p":"115-1-6102","n":17,"q":"下列有關餐飲作業場所清潔度區分之敘述，何者錯誤？","o":["內包裝室為清潔作業區","外包裝室為一般作業區","餐具洗滌區為清潔作業區","烹調區為準清潔作業區"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"作業場所的清潔度區分","ex":"餐具洗滌區屬於一般作業區。清潔作業區是內包裝室與配膳、盛裝的區域；準清潔作業區是烹調區；一般作業區包括驗收、洗滌、外包裝和倉庫。"},{"id":"115-1-6102-18","p":"115-1-6102","n":18,"q":"依據我國小包裝食品免一部標示規定，小包裝食品如以「QR Code」或其他電子化方式揭露應標示事項，仍需在外包裝標示下列何者？","o":["品名及有效日期","原產地及應標示之原料原產地","國內負責廠商名稱及電話號碼","過敏原等相關醒語資訊"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"小包裝食品的標示","ex":"小包裝食品用 QR Code 等電子方式揭露標示內容時，包裝上仍然要標示品名和有效日期。"},{"id":"115-1-6102-19","p":"115-1-6102","n":19,"q":"食品安全管制小組在訂定重要管制點監測計畫時，應包括下列那些內容？①項目　②方法　③頻率　④矯正措施　⑤操作人員","o":["①②③⑤","①②③④","②③④⑤","①②④⑤"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"重要管制點的監測計畫","ex":"監測計畫要寫明監測的項目、方法、頻率和執行的人員。矯正措施是管制界限發生偏離時才採取的行動，是 HACCP 的另一個原則，不在監測計畫內。"},{"id":"115-1-6102-20","p":"115-1-6102","n":20,"q":"依據我國食品添加物使用範圍及限量暨規格標準，以過氧化氫做為食品添加物時，下列敘述何者正確？","o":["主要用途是作為漂白劑","本品可使用於魚肉煉製品","本品可使用於麵粉及其製品等食品中","食品中之殘留限量為1 ppm（含）以下"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"過氧化氫的使用規定","ex":"過氧化氫在我國屬於殺菌劑，可以使用於魚肉煉製品和除了麵粉及其製品以外的其他食品，但食品中不得殘留。"},{"id":"115-1-6102-21","p":"115-1-6102","n":21,"q":"關於有機酸型防腐劑，下列敘述何者正確？","o":["未解離酸的濃度愈高，抗菌效果愈好","在pH4.0～6.0之間苯甲酸鹽的抑菌效果比己二烯酸好","有機酸能抑菌主要是因為干擾細菌DNA的複製","醋酸抑制革蘭氏陽性菌之效果優於革蘭氏陰性菌"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"有機酸型防腐劑的作用","ex":"有機酸要在未解離的狀態下才能穿過微生物的細胞膜、進入細胞內發揮作用，所以未解離酸的濃度越高，也就是酸鹼值越低，抗菌效果越好。在 pH 4.0～6.0 之間，己二烯酸未解離的比例比苯甲酸高，效果比較好。"},{"id":"115-1-6102-22","p":"115-1-6102","n":22,"q":"食用冰塊必須檢驗下列那2種微生物，以符合我國食品中微生物衛生標準之規定？","o":["總生菌數、大腸桿菌","腸桿菌科、沙門氏菌","綠膿桿菌、金黃色葡萄球菌","金黃色葡萄球菌、腸炎弧菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"食用冰塊的微生物衛生標準","ex":"依標準答案，食用冰塊要檢驗腸桿菌科和沙門氏菌。"},{"id":"115-1-6102-23","p":"115-1-6102","n":23,"q":"下列何者為低溫菌，並可在以巴斯徳殺菌之冷藏鮮奶中生長？","o":["李斯特菌","沙門氏菌","金黃色葡萄球菌","產氣莢膜桿菌"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"可在冷藏溫度生長的病原菌","ex":"李斯特菌是低溫菌，在 4℃ 的冷藏溫度下仍能生長，鮮奶殺菌後如果再受到污染，它可以在冷藏期間繁殖。"},{"id":"115-1-6102-24","p":"115-1-6102","n":24,"q":"依據我國食品中微生物衛生標準之規範，下列何者為牛乳需檢查之項目？","o":["大腸桿菌","金黃色葡萄球菌腸毒素","仙人掌桿菌","耶爾辛氏菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"乳品的微生物衛生標準","ex":"依標準答案，牛乳需要檢查金黃色葡萄球菌腸毒素。這種腸毒素耐熱，加熱殺菌無法破壞。"},{"id":"115-1-6102-25","p":"115-1-6102","n":25,"q":"有關絕對厭氧菌（obligate anaerobes）之敘述，下列何者錯誤？","o":["氧氣對此類細菌有毒害","啤酒酵母菌為絕對厭氧菌","梭菌屬（Clostridium spp.）為厭氧菌","可由發酵途徑生產能量"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"絕對厭氧菌","ex":"啤酒酵母菌是兼性厭氧菌，有氧時行有氧呼吸，無氧時行酒精發酵，不是絕對厭氧菌。梭菌屬才是絕對厭氧菌。"},{"id":"115-1-6102-26","p":"115-1-6102","n":26,"q":"低溫貯存的肉品產生綠變現象，是因為下列何種物質與肌紅素作用所致？","o":["乙酸","氫氣","硫化氫","碳酸鹽"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"肉品腐敗的綠變","ex":"低溫下某些細菌分解含硫胺基酸產生硫化氫，硫化氫和肌紅素結合成綠色的硫肌紅素，使肉品變綠。"},{"id":"115-1-6102-27","p":"115-1-6102","n":27,"q":"下列四種化學物質半有效劑量（ED50）與半致死劑量（LD50）資料中，請以治療指數（therapeutic index）判定何者於使用上最為安全？","o":["ED50：0.1；LD50：500","ED50：1；LD50：100","ED50：10；LD50：10","ED50：100；LD50：1"],"a":"A","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"治療指數","ex":"治療指數 ＝ 半致死劑量 ÷ 半有效劑量，數值越大越安全。A 是 500 ÷ 0.1 ＝ 5,000，B 是 100，C 是 1，D 是 0.01，所以 A 最安全。"},{"id":"115-1-6102-28","p":"115-1-6102","n":28,"q":"有關食品安全性評估之急性毒性試驗中，下列敘述何者錯誤？","o":["急毒性試驗結果通常為短期試驗，一般不超過14天","急毒性試驗結果可用半致死劑量（LD50）表示","評估產品時，半致死劑量（LD50）越大，產品的危險性越高","其結果可用於決定慢性毒性試驗的劑量"],"a":"C","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"急性毒性試驗與半致死劑量","ex":"半致死劑量越大，表示要吃到越多才會造成半數動物死亡，毒性越低，產品越安全。C 說反了。"},{"id":"115-1-6102-29","p":"115-1-6102","n":29,"q":"下列塑膠材料何者適合製成可微波之食品容器？","o":["聚乙烯（polyethylene）","聚苯乙烯（polystyrene）","聚丙烯（polypropylene）","聚氯乙烯（polyvinylchloride）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"塑膠材質的耐熱性","ex":"聚丙烯（PP）的耐熱溫度約 100～140℃，可以微波。聚乙烯和聚苯乙烯耐熱性較差；聚氯乙烯遇熱可能釋出有害物質。"},{"id":"115-1-6102-30","p":"115-1-6102","n":30,"q":"下列何者不是我國食品添加物中表列之防腐劑？","o":["聯苯（biphenyl）","苯甲酸（benzoic acid）","二丁基羥基甲苯（dibutyl hydroxy toluene）","去水醋酸（dehydroacetic acid）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"防腐劑與抗氧化劑的區分","ex":"二丁基羥基甲苯（BHT）是抗氧化劑，用來防止油脂氧化，不是防腐劑。聯苯、苯甲酸和去水醋酸都是表列的防腐劑。"},{"id":"115-1-6102-31","p":"115-1-6102","n":31,"q":"依據我國食品器具容器包裝衛生標準規定，與食品直接接觸面為金屬合金者，溶出試驗必須檢測下列那些項目？","o":["砷、鉛、鎘","錳、砷、鎘","銻、鉛、錫","錳、銻、汞"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"金屬容器的溶出試驗項目","ex":"依標準答案，金屬合金材質的食品接觸面要檢測砷、鉛、鎘的溶出量。"},{"id":"115-1-6102-32","p":"115-1-6102","n":32,"q":"依據食品用洗潔劑衛生標準規定，用於食品器具、容器及包裝等食品接觸面之主要消毒成分中，下列何者亦是我國准用於食品之殺菌劑？","o":["二氧化氯","過氧化氫","次氯酸鈉","乳酸"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"洗潔劑消毒成分與食品殺菌劑","ex":"依標準答案為過氧化氫，它也是我國准用的食品殺菌劑。"},{"id":"115-1-6102-33","p":"115-1-6102","n":33,"q":"評估農產品的農藥殘留容許量（maximum residue limits, MRLs），不需要下列那項基本資料？","o":["農藥的半致死劑量（LD50）","農藥的每日攝取容許量（ADI）","每類作物之國民平均攝食量","農藥在農作物之實際殘留量"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"農藥殘留容許量的訂定","ex":"訂定殘留容許量需要每日攝取容許量、國人對各類作物的取食量，以及田間試驗得到的實際殘留量。半致死劑量是急性毒性的指標，用不到。"},{"id":"115-1-6102-34","p":"115-1-6102","n":34,"q":"有關清洗蔬菜減少農藥殘留之敘述，下列何者錯誤？","o":["清水沖洗可以減少接觸型農藥的殘留","先切除不食用的部分再清洗","食鹽無法增加移除蔬菜殘留農藥之效果","先以清水浸泡數分鐘再以流水沖洗"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"清洗蔬菜去除農藥的方法","ex":"應該先清洗，再切除不吃的部分。先切的話，農藥會隨著水從切口滲進蔬菜裡。"},{"id":"115-1-6102-35","p":"115-1-6102","n":35,"q":"下列何者是最有效去除普利昂（prion）活性的方法？","o":["以消毒性酒精處理","136℃高壓蒸氣滅菌30分鐘","浸泡於次氯酸鈉溶液24小時","以250℃高溫燒烤"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"去除普利昂活性的方法","ex":"普利昂是構造異常的蛋白質，不含核酸，一般的加熱、酒精和常用消毒方法都無法去除活性，要用 134～138℃ 的高壓蒸氣滅菌才有效。"},{"id":"115-1-6102-36","p":"115-1-6102","n":36,"q":"有關熱帶性海魚毒中ciguatoxin的敘述，下列何者錯誤？","o":["內臟中毒素含量高於肌肉","中毒症狀有冷熱感覺異常和肌肉痠痛等","為水溶性物質，加熱可破壞","大型魚類含有較高毒素"],"a":"C","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"熱帶性海魚毒","ex":"雪卡毒素是脂溶性、耐熱的毒素，一般的烹煮、冷凍都無法破壞。它經由食物鏈累積，大型魚和魚的內臟含量較高。"},{"id":"115-1-6102-37","p":"115-1-6102","n":37,"q":"米飯若放在60℃以下保溫一段時間，易造成那一種病原性微生物生長？","o":["沙門氏菌","仙人掌桿菌","金黃色葡萄球菌","肉毒桿菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"仙人掌桿菌食品中毒","ex":"仙人掌桿菌的孢子耐熱，煮飯時不會被殺死；米飯放在 60℃ 以下保溫或在室溫放太久，孢子會發芽繁殖並產生毒素。"},{"id":"115-1-6102-38","p":"115-1-6102","n":38,"q":"下列那些病原菌主要是透過糞口感染而造成食物中毒？①沙門氏菌　②彎曲桿菌　③布魯士桿菌　④腸炎弧菌","o":["①②","③④","①③","②④"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"病原菌的傳染途徑","ex":"沙門氏菌和彎曲桿菌存在於動物和人的腸道中，經由糞便污染食物或飲水而傳染。布魯士桿菌主要來自未殺菌的乳品或接觸受感染的動物；腸炎弧菌來自海水和海產。"},{"id":"115-1-6102-39","p":"115-1-6102","n":39,"q":"在雞肉燒烤過程中，較不會產生下列何種有害物質？","o":["多環芳香羥化合物","丙烯醯胺","羊毛胺酸","異環胺類化合物"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"燒烤產生的有害物質","ex":"丙烯醯胺主要是富含澱粉的食物在高溫下，由天門冬醯胺和還原糖反應產生，例如炸薯條、洋芋片。肉類燒烤產生的主要是多環芳香烴和異環胺。"},{"id":"115-1-6102-40","p":"115-1-6102","n":40,"q":"下列關於腸炎弧菌（Vibrio parahaemolyticus）之敘述，何者錯誤？","o":["此菌屬於革蘭氏陽性菌，兼性厭氧","此菌具有鞭毛，不能產生孢子，屬好鹽性","可能透過生食魚類食品引起中毒","可經由器具、容器等造成交叉污染"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸炎弧菌的特性","ex":"腸炎弧菌是革蘭氏「陰性」菌，不是陽性菌。它是兼性厭氧、有鞭毛、不產孢子的好鹽菌，常經由生食海鮮或交叉污染引起中毒。"},{"id":"115-1-6102-41","p":"115-1-6102","n":41,"q":"長期攝取紅麴原料製成的食品，較可能有下列那種毒素中毒的風險？","o":["黃麴毒素","橘黴素","赭麴毒素","黃黴毒素"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"紅麴與橘黴素","ex":"紅麴菌在發酵過程中可能產生橘黴素（citrinin），對腎臟有毒性，所以紅麴製品訂有橘黴素的限量。"},{"id":"115-1-6102-42","p":"115-1-6102","n":42,"q":"下列那一種寄生蟲主要分布在熱帶地區，藉由被糞便污染的水或食物侵入並寄生於腸道，引發噁心嘔吐、潰瘍、水瀉，並伴隨疲倦、寒顫等症狀？","o":["中華肝吸蟲","痢疾阿米巴原蟲","廣節裂頭絛蟲","橫川吸蟲"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"經食物與水傳染的寄生蟲","ex":"痢疾阿米巴原蟲的囊體隨糞便排出，經由受污染的水或食物進入人體，寄生在大腸造成潰瘍和腹瀉。中華肝吸蟲、廣節裂頭絛蟲和橫川吸蟲都是吃了生的淡水魚而感染。"},{"id":"115-1-6102-43","p":"115-1-6102","n":43,"q":"依據我國食品良好衛生規範準則，食品業者應指派下列何種人員，就建築與設施及衛生管理情形，按日填報衛生管理紀錄？","o":["管理衛生人員","衛生管理人員","烹調技術人員","廚師"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"衛生管理紀錄的填報人員","ex":"準則規定食品業者應指派「管理衛生人員」，每天填報衛生管理紀錄。「衛生管理人員」是另一個名詞，指特定業別依法必須設置、具有資格的專門人員。"},{"id":"115-1-6102-44","p":"115-1-6102","n":44,"q":"依據我國食品良好衛生規範準則，食品業者之場區廁所應符合之規定，不包括下列何者？","o":["設置地點應防止污染水源","不得正面開向食品作業場所","照明光線應達200勒克斯（Lux）","應於明顯處標示如廁後應洗手"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"廁所的設置規定","ex":"準則對廁所的要求是設置地點要防止污染水源、不得正面開向食品作業場所、保持整潔，並在明顯的地方標示如廁後應洗手，沒有 200 勒克斯的照明規定。"},{"id":"115-1-6102-45","p":"115-1-6102","n":45,"q":"依據餐具清洗良好作業指引，下列何者不符合餐具洗滌作業中的有效殺菌槽條件？","o":["水溫72℃且浸泡3分鐘","121℃乾熱30分鐘","餘氯量200 ppm氯液且浸泡3分鐘","100℃以上蒸氣加熱3分鐘"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"餐具的有效殺菌條件","ex":"有效殺菌的方法包括煮沸、100℃ 蒸氣加熱 2 分鐘以上、80℃ 以上熱水浸泡 2 分鐘以上、有效餘氯 200 ppm 的氯液浸泡 2 分鐘以上、110℃ 以上乾熱 30 分鐘以上。72℃ 的水溫不夠。"},{"id":"115-1-6102-46","p":"115-1-6102","n":46,"q":"有關食材採購與驗收的敘述，下列何者錯誤？","o":["廠商採購食材須訂定採購原則","驗收冷凍品其表面溫度需低於零下7℃","為確保食材來源與品質需要供應商提出認證證明","須採源頭式的衛生安全管理"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食材的採購與驗收","ex":"冷凍食品驗收時，中心溫度應該在零下 18℃ 以下，表面溫度零下 7℃ 是不夠低的。"},{"id":"115-1-6102-47","p":"115-1-6102","n":47,"q":"含鐵氟龍（Teflon）塗層之不沾鍋，在高溫烹煮食物時可能釋出何種有害物質？","o":["氫氟酸（HF）","全氟辛酸銨（PFOA）","氟化氫（HF)","鄰苯二甲酸二丁酯（DBP）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"不沾鍋塗層的有害物質","ex":"鐵氟龍塗層在製造過程中曾使用全氟辛酸（PFOA），不沾鍋空燒或過度高溫時，塗層分解可能釋出這類全氟化合物。"},{"id":"115-1-6102-48","p":"115-1-6102","n":48,"q":"依據我國食品良好衛生規範準則，下列有關倉儲管理之敘述，何者錯誤？","o":["原材料、半成品及成品倉庫，依其作業性質或清潔程度，分別設置或予以適當區隔，並有足夠供搬運之空間","物品應予分類，採取有效措施離地貯放，並保持整潔及良好通風","倉庫管理需管制溫溼度者應建立管制方法及基準","倉儲過程中，原材料、半成品及成品，除有合理原因及依據，並作成紀錄者外，得改變原設定之貯存條件"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"倉儲管理規定","ex":"準則的規定是倉儲過程中「不得」改變原設定的貯存條件，只有在有合理原因和依據、並且做成紀錄時才是例外。D 把它說成「得改變」，意思相反。"},{"id":"115-1-6102-49","p":"115-1-6102","n":49,"q":"「若肉品中含有0.01 ppm的萊克多巴胺，成人連續每天吃33片（200公克／片），至少5年才可能超過安全攝取量。」以上敘述是屬於食品安全風險評估的那一項？","o":["危害辨識（hazard identification）","危害特徵描述（hazard characterization）","暴露評估（exposure assessment）","風險特徵描述（risk characterization）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"風險評估的四個步驟","ex":"風險評估有四步：危害辨識、危害特徵描述、暴露評估、風險特徵描述。把安全攝取量和實際的攝取情形放在一起比較，說明風險的大小，是風險特徵描述。"},{"id":"115-1-6102-50","p":"115-1-6102","n":50,"q":"依據我國食品安全衛生管理法及其相關規定，有關基因改造標示下列敘述何者正確？","o":["食品內基因改造生物（GMO）成分含量超過3％，必須標示","食品組成與天然物實質不同，但明確含有基因改造成分者，不須標示","食品組成與天然物實質等同，同時可檢測出含基因改造成分者，不須標示","經高度加工，無法檢驗出含有基因改造成分之DNA或蛋白質之食品，不須標示"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"基因改造食品的標示","ex":"非故意攙入的基因改造成分超過 3% 就視為基因改造食品，必須標示。高度加工、已經驗不出基因改造成分的產品，例如醬油、沙拉油，仍然要標示是用基因改造原料製成的。"},{"id":"114-2-1102-1","p":"114-2-1102","n":1,"q":"營養照顧紀錄是醫療團隊成員之間溝通的工具，有關營養紀錄的敘述，下列何者錯誤？","o":["營養介入內容要記錄在病歷中，但如果病人狀況良好飲食內容無調整可以不要記錄","病歷中的營養紀錄要簡明扼要地總結營養照顧內容","整個醫療團隊需要瞭解營養照顧之基本原則和方式，以提升照顧品質","營養紀錄模式可以POMR、SOAP或ADIME等方式呈現"],"a":"A","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養紀錄的原則","ex":"營養介入與後續監測都要記錄在病歷，即使病人狀況良好、飲食不調整，也要記錄評值結果，才能讓醫療團隊掌握照護進度。紀錄要簡明扼要，可用 POMR、SOAP 或 ADIME 格式。"},{"id":"114-2-1102-2","p":"114-2-1102","n":2,"q":"有關營養照護流程中營養評價（evaluation）的敘述，下列何者正確？","o":["病人每日熱量需要量為1,650大卡","建議病人每天最多5份豆魚蛋肉類攝取","病人過去偏愛水果，每次會吃一盤水果，一天吃兩次","病人未依營養師飲食計畫增加蔬菜量攝取"],"a":"D","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養照護流程的監測與評值","ex":"評值（evaluation）是比較病人的實際行為或指標與營養介入的目標，例如病人沒有依計畫增加蔬菜攝取。熱量需要量是評估資料，建議份數是介入，過去的飲食習慣是評估中的飲食史。"},{"id":"114-2-1102-3","p":"114-2-1102","n":3,"q":"營養照顧程序中，營養診斷之「PES」敘述，下列何者錯誤？","o":["P是problem","E是evaluation","S是signs","S是symptoms"],"a":"B","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養診斷的 PES 敘述","ex":"PES 是問題（Problem）、病因（Etiology）、徵候與症狀（Signs and Symptoms）。E 是 etiology，不是 evaluation。"},{"id":"114-2-1102-4","p":"114-2-1102","n":4,"q":"使用全靜脈營養輸液時，體重50公斤的病人，每日最大的葡萄糖供應量，下列範圍何者最適當？","o":["50～140公克","250～340公克","350～440公克","450～540公克"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"靜脈營養葡萄糖的最大輸注量","ex":"靜脈營養的葡萄糖輸注速率一般不超過每公斤每分鐘 4～5 毫克，約每公斤每天 7 公克。50 公斤 × 7 公克 ＝ 350 公克，所以 350～440 公克的範圍最接近上限。超過會造成高血糖、脂肪肝與二氧化碳產量增加。"},{"id":"114-2-1102-5","p":"114-2-1102","n":5,"q":"張先生83歲為腦中風患者，住院期間無法由口進食，則以鼻胃管提供營養，灌食結果消化情況尚可，出院前評估張先生至少半年無法拔管進食，下列營養介入方式，何者最佳？","o":["nasoduodenal（ND）feeding","nasojejunal（NJ）feeding","percutaneous endoscopic gastrostomy（PEG）feeding","percutaneous endoscopic jejunostomy（PEJ）feeding"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"長期管灌的途徑選擇","ex":"預期灌食超過 4～6 週應改用造口。病人腸胃消化尚可、灌到胃就能耐受，所以選經皮內視鏡胃造口（PEG）。鼻十二指腸、鼻空腸管都是短期用；空腸造口用在胃排空差或吸入風險高的病人。"},{"id":"114-2-1102-6","p":"114-2-1102","n":6,"q":"有關進行居家營養支持照顧的考慮因素，下列何者錯誤？","o":["家庭環境衛生可以保護病人的健康和降低感染風險","病人居家環境可提供充足的活動空間及設備","能夠理解營養支持所需的相關技術、設備和用品的使用方式","病人或家屬的財務和時間投入，可能導致的家庭經濟負擔"],"a":"B","c":"膳食療養","c2":"","ch":"第2章 營養支持","ch2":"","t":"居家營養支持的考量","ex":"居家營養支持要考慮家庭環境衛生、病人與照顧者能否學會操作、經濟與時間負擔等。居家空間「充足的活動空間及設備」不是必要條件。"},{"id":"114-2-1102-7","p":"114-2-1102","n":7,"q":"當病人考量停止靜脈營養前，經口攝入的營養素須持續可以滿足人體營養素需求的大約多少%？","o":["30","50","75","90"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"停止靜脈營養的時機","ex":"當經口或腸道攝取能持續達到營養需求的約 75%（約 60～75%）時，才考慮逐步停止靜脈營養，以免營養中斷。"},{"id":"114-2-1102-8","p":"114-2-1102","n":8,"q":"有關減重飲食控制的敘述，下列何者最不適當？","o":["不論低脂、低醣或均衡的限制熱量飲食，長期都會產生類似的減重效果","蛋白質攝取1.2公克／公斤體重，有助於降低lean body mass（LBM）的流失","低醣飲食可能顯著增加血液尿酸濃度","高脂低醣飲食通常含有較高的維生素B1、鈣及鎂"],"a":"D","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第3章 體重控制與管理","ch2":"4 調整熱量之飲食","t":"減重飲食的比較","ex":"高脂低醣飲食減少了全穀、豆類、蔬果與乳品，維生素 B1、鈣、鎂、纖維反而容易不足。不同組成的限制熱量飲食長期減重效果相近；蛋白質 1.2 g/kg 有助保留瘦體組織；低醣飲食產生酮體，會與尿酸競爭排出而使血尿酸上升。"},{"id":"114-2-1102-9","p":"114-2-1102","n":9,"q":"有關神經性暴食症（bulimia nervosa）病人的營養治療，下列敘述何者最不適當？","o":["若病人代謝率過低，以每日1,600～1,800大卡開始，再逐步達到DRI熱量建議","若病人體重過重或肥胖，應採取嚴格限制熱量飲食以減輕體重","提供非水溶性纖維以改善便秘","若病人便秘，避免補充鐵劑"],"a":"B","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"暴食症的營養治療","ex":"暴食症的治療目標是建立規律進食、打破暴食與清除的循環。嚴格限制熱量反而容易誘發暴食，所以即使體重過重也不應採嚴格限制。便秘時以纖維、水分改善，並避免會加重便秘的鐵劑。"},{"id":"114-2-1102-10","p":"114-2-1102","n":10,"q":"下列何者常出現在神經性厭食症（anorexia nervosa）病人的身上？","o":["enamel erosion","esophagitis","muscle wasting","Russell's sign"],"a":"C","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"厭食症的臨床表現","ex":"神經性厭食症長期熱量不足，肌肉耗損是常見表現。琺瑯質侵蝕、食道炎、手背因催吐摩擦形成的 Russell 徵象，都是反覆催吐的結果，較常見於暴食症。"},{"id":"114-2-1102-11","p":"114-2-1102","n":11,"q":"誘導gout發作的可能原因，下列何者錯誤？","o":["飢餓、快速減重","吃香菇豆腐餐","喝含糖飲料","喝啤酒"],"a":"B","c":"膳食療養","c2":"","ch":"第12章 內分泌與新陳代謝疾病","ch2":"","t":"誘發痛風發作的因素","ex":"飢餓或快速減重產生酮體、含果糖的含糖飲料、啤酒（含普林並增加尿酸生成）都會誘發痛風。植物性的高普林食物（香菇、豆腐）研究顯示不會明顯增加痛風風險。"},{"id":"114-2-1102-12","p":"114-2-1102","n":12,"q":"關於「水溶性纖維」與「非水溶性纖維」的差異，下列敘述何者最適當？","o":["水溶性纖維會促進肝臟將膽固醇代謝為膽酸","水溶性纖維不會產生熱量","非水溶性纖維有抑制膽固醇合成的作用","果膠、木質素屬於水溶性纖維"],"a":"A","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"9 調整纖維質之飲食","t":"水溶性與非水溶性纖維","ex":"水溶性纖維在腸道結合膽酸隨糞便排出，肝臟只好把更多膽固醇轉成膽酸，因而降低血膽固醇。水溶性纖維經大腸細菌發酵產生短鏈脂肪酸，仍有少量熱量；木質素屬於非水溶性纖維。"},{"id":"114-2-1102-13","p":"114-2-1102","n":13,"q":"對於腸道切除術後的營養處置，下列敘述何者最不適當？","o":["空腸是營養素吸收的主要部位，因此空腸切除後造成的營養問題通常比迴腸切除來得嚴重","大部分小腸切除術後的病人需要使用一段時間的靜脈營養來維持營養狀況","小腸切除術後開始腸道營養時，使用複合完整營養素配方比元素或預解配方更能刺激腸道黏膜復原","因為大腸癌而施行迴腸造口術（ileostomy）的病人建議術後6～8週使用低渣飲食"],"a":"A","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"9 調整纖維質之飲食","t":"小腸切除後的營養問題","ex":"迴腸是維生素 B12 與膽鹽唯一的吸收部位，而且無法由空腸代償；空腸切除後迴腸可以適應代償。所以迴腸切除的營養問題通常比空腸切除嚴重，A 說反了。"},{"id":"114-2-1102-14","p":"114-2-1102","n":14,"q":"下列何種疾病需要採用低纖維飲食？","o":["chronic cholecystitis","diverticulitis","irritable bowel syndrome","colon polyps"],"a":"B","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"9 調整纖維質之飲食","t":"需要低纖維飲食的疾病","ex":"憩室炎急性期腸道發炎，要先讓腸道休息，採低纖維（低渣）飲食；發炎緩解後再改高纖預防復發。大腸激躁症、大腸息肉、慢性膽囊炎不需要低纖維飲食。"},{"id":"114-2-1102-15","p":"114-2-1102","n":15,"q":"有關肝性腦病變（hepatic encephalopathy）的敘述，下列何者正確？","o":["在輕度肝性腦病變發生時，建議開始限制蛋白質以防止症狀惡化","益生菌可能有助於降低血液氨（ammonia）的濃度","rifaximin是作為治療的抗生素，主要是為了避免肝性腦病變病人發生腸道感染","研究證實使用BCAA有助於症狀改善並提高存活率"],"a":"B","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"肝性腦病變的處置","ex":"益生菌可改變腸道菌叢、減少產氨的細菌，可能降低血氨。輕度肝性腦病變不建議限制蛋白質，以免營養不良；rifaximin 是用來減少腸道產氨的細菌；支鏈胺基酸可改善症狀，但沒有證實提高存活率。"},{"id":"114-2-1102-16","p":"114-2-1102","n":16,"q":"有關small intestinal bacterial overgrowth（SIBO）的敘述，下列何者錯誤？","o":["易導致脂肪吸收不良","易導致cobalamin缺乏","可用抗生素治療","不影響醣類吸收"],"a":"D","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"小腸細菌過度增生","ex":"小腸細菌過度增生時，細菌使膽鹽去結合而造成脂肪吸收不良，並消耗維生素 B12；細菌發酵醣類並傷害刷狀緣的雙醣酶，也會影響醣類吸收，造成腹脹腹瀉。治療用抗生素。"},{"id":"114-2-1102-17","p":"114-2-1102","n":17,"q":"有關消化性潰瘍生理病理學之敘述，下列何者錯誤？","o":["胃潰瘍較常發生於胃小彎；十二指腸潰瘍大部分發生在十二指腸前端近幽門處的部位","胃潰瘍病人胃酸分泌量正常或減低，造成胃黏膜損傷主因是胃黏膜障壁減弱","十二指腸潰瘍病人大部分有胃酸分泌量增加的現象","進食可減輕胃潰瘍腹部疼痛不適，但會加重十二指腸潰瘍疼痛"],"a":"D","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"胃潰瘍與十二指腸潰瘍的差異","ex":"進食會中和胃酸，所以十二指腸潰瘍吃東西後疼痛減輕；胃潰瘍則是進食後疼痛加重。D 說反了。"},{"id":"114-2-1102-18","p":"114-2-1102","n":18,"q":"推薦給糖尿病前期病人以降低糖尿病風險之生活型態，下列何者最不適當？","o":["規律運動及減少熱量攝取來達成體重控制目標","遵循地中海型飲食","減少飽和脂肪酸攝取","戒菸並鼓勵沒有喝酒習慣的病人每日適當飲酒"],"a":"D","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"糖尿病前期的生活型態","ex":"不應鼓勵沒有喝酒習慣的人開始飲酒。糖尿病前期建議減重、規律運動、地中海型飲食、減少飽和脂肪、戒菸。"},{"id":"114-2-1102-19","p":"114-2-1102","n":19,"q":"有關糖尿病的飲食原則，下列何者最不適當？","o":["減重有助於改善血糖控制，對於肥胖糖尿病人，營養師應聚焦於以減重為中心的飲食計畫","第1型糖尿病的青少年，應定期追蹤其生長及發育，嚴格飲食限制來預防肥胖可能會導致飲食失調的發展","應符合個人及文化的偏好，鼓勵病人選擇合適份量的健康食物","提供多樣性食物選擇來維持飲食的樂趣"],"a":"A","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"糖尿病的飲食原則","ex":"現行指引強調以個人化的飲食型態與整體健康為中心，不是只以減重為中心；減重雖有助血糖控制，但不是唯一目標。其餘三項都是正確的原則。"},{"id":"114-2-1102-20","p":"114-2-1102","n":20,"q":"有關妊娠糖尿病的照護，下列敘述何者最適當？","o":["空腹血糖控制目標＜120 mg/dL","醣類食物要分配至3餐與2～4份點心","應避免餵母乳以減少新生兒罹病風險","糖化血色素控制目標＜5.6%"],"a":"B","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"妊娠糖尿病的照護","ex":"妊娠糖尿病的醣類要分散到三餐和 2～4 次點心，避免餐後高血糖與夜間酮體。空腹血糖目標是 95 mg/dL 以下，不是 120；鼓勵哺餵母乳；孕期的糖化血色素目標一般是 6% 左右。"},{"id":"114-2-1102-21","p":"114-2-1102","n":21,"q":"有關糖尿病之黎明現象（dawn phenomenon），下列敘述何者正確？","o":["是半夜低血糖後在黎明時反彈的現象","此現象起源於低血糖時分泌反調節荷爾蒙的結果","是黎明前胰島素減少或夜間肝臟葡萄糖產生過多所致","可減少晚上胰島素劑量或改長效胰島素避免此現象發生"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"黎明現象與 Somogyi 現象","ex":"黎明現象是清晨生長激素、皮質醇等分泌增加，加上夜間胰島素作用減弱、肝臟葡萄糖產生過多，使清晨血糖升高。半夜低血糖後反彈的是 Somogyi 現象，處理方式才是減少晚上的胰島素。"},{"id":"114-2-1102-22","p":"114-2-1102","n":22,"q":"下列有關預防腎結石復發的敘述，何者最不適當？","o":["發炎性腸道疾病（inflammatory bowel disease）會增加草酸鈣結石的發生率","酸性尿液（low urine pH）是導致尿酸腎結石的重要原因","預防胱胺酸結石（cystine stone）復發，每日水分攝取量需要超過4公升以上","鹼化尿液（raising urine pH）可以預防磷酸氨鎂結石（struvite stone）"],"a":"D","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"腎結石的預防","ex":"磷酸銨鎂結石（感染性結石）在鹼性尿液中形成，鹼化尿液會促進結石，應治療感染並酸化尿液。其餘正確：發炎性腸道疾病使草酸吸收增加；酸性尿液促成尿酸結石；胱胺酸結石需要大量喝水。"},{"id":"114-2-1102-23","p":"114-2-1102","n":23,"q":"劉先生，170公分，76公斤，糖尿病腎病變病人，其血液生化值如下（括弧內數值為正常值範圍）：HbA1c 9.7%、BUN 47（7～20）mg/dL、creatinine 2.1（0.5～1.3）mg/dL、potassium 5.5（3.5～5.5）mEq/L、phosphorus 4.8（2.3～5.1）mg/dL、血壓150/98 mmHg，有關劉先生的治療建議，下列何者最不適當？","o":["良好血糖控制對延緩腎功能惡化的影響大於降低蛋白質的攝取量","血壓控制好對延緩腎功能惡化的影響大於降低蛋白質的攝取量","維持血磷正常可以延緩副甲狀腺亢進與骨病變發生","此時使用得舒飲食（DASH diet）能延緩腎功能喪失速度"],"a":"D","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"糖尿病腎病變的營養處置","ex":"劉先生的血鉀已在上限（5.5 mEq/L），得舒飲食富含鉀、磷與蛋白質，不適合腎功能已下降、血鉀偏高的病人。控制血糖與血壓對延緩腎功能惡化的效果大於限制蛋白質；維持血磷正常可延緩副甲狀腺亢進與骨病變。"},{"id":"114-2-1102-24","p":"114-2-1102","n":24,"q":"蔡先生是規律血液透析的病人，下列何種維生素最不易在透析時流失？","o":["維生素B12","維生素B6","維生素C","葉酸"],"a":"A","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"血液透析與維生素流失","ex":"水溶性維生素分子小、在血漿中游離，透析時容易流失，例如維生素 B6、C、葉酸。維生素 B12 在血中與運鈷胺蛋白結合，分子大，最不易被透析移除。"},{"id":"114-2-1102-25","p":"114-2-1102","n":25,"q":"有關醫師評估透析病人乾體重（dry weight）的目的，下列何者錯誤？","o":["維持體內最佳體液容積","維持正常血壓","減少蛋白尿","降低死亡率"],"a":"C","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"透析病人的乾體重","ex":"乾體重是透析後體內沒有多餘水分、血壓正常的體重，目的是維持適當的體液量與血壓、降低心血管併發症與死亡率。乾體重與蛋白尿無關。"},{"id":"114-2-1102-26","p":"114-2-1102","n":26,"q":"依據美國心臟協會（American Heart Association）和美國心臟醫學會（American College of Cardiology）於2018年所提出的飲食減鈉指引，下列何者錯誤？","o":["血壓偏高的成年人應將每日鈉攝取量減至1,500 mg以下","血壓正常的成年人每日不宜攝取超過6 g的鹽","高血壓病人應將每日鈉攝取量控制在1,000 mg以下","多數成年人應試著至少減少1,000 mg的每日鈉攝取量"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"6 調整礦物質之飲食","t":"高血壓的鈉攝取建議","ex":"美國心臟協會與美國心臟醫學會的指引建議：血壓偏高或高血壓的成人，理想目標是每天鈉 1,500 mg 以下，至少減少 1,000 mg；鹽 6 公克約含鈉 2,400 mg。指引沒有把 1,000 mg 以下當作建議值。"},{"id":"114-2-1102-27","p":"114-2-1102","n":27,"q":"下列何種飲食成分與降低血清膽固醇濃度最無關？","o":["plant stanols","vitamin E","nicotinic acid","soluble fiber"],"a":"B","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"降血膽固醇的飲食成分","ex":"植物固醇與甾烷醇減少腸道吸收膽固醇；菸鹼酸（大劑量）可降低 LDL、提高 HDL；水溶性纖維結合膽酸。維生素 E 是抗氧化劑，不會降低血膽固醇。"},{"id":"114-2-1102-28","p":"114-2-1102","n":28,"q":"依據2013年美國心臟醫學會（American College of Cardiology）／美國心臟協會（American Heart Association）發表的臨床指引，下列何種運動型態最適合用於防治高血壓？","o":["中至高強度的有氧運動，每週至少3～4次，平均每次40分鐘","輕至中強度的有氧運動，每週至少3～4次，平均每次40分鐘","中至高強度的有氧運動，每週至少3～4次，平均每次30分鐘","輕至中強度的有氧運動，每週至少3～4次，平均每次30分鐘"],"a":"A","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"防治高血壓的運動建議","ex":"2013 年 AHA/ACC 生活型態指引建議：中至高強度的有氧運動，每週 3～4 次，每次平均 40 分鐘，可降低血壓與血脂。"},{"id":"114-2-1102-29","p":"114-2-1102","n":29,"q":"有關心臟衰竭stage C及stage D（依據American Heart Association定義分類）之主要營養治療原則，下列敘述何者最不適當？","o":["以健康飲食、有氧運動及多喝水等進行生活型態改善","若使用利尿劑，則視需要補充鎂及維生素B1","每日鈉攝取控制在2公克，水份攝取可先以每天小於2,000 c.c.為原則","惡病質或營養狀況不佳，可考慮腸道或靜脈營養，但要注意體液進出量之平衡"],"a":"A","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"心臟衰竭的營養治療","ex":"心臟衰竭 C、D 期常有水分滯留，需要限制鈉與水分（每天小於 2,000 c.c.），不能鼓勵多喝水。使用利尿劑可能流失鎂與維生素 B1；營養不良時可考慮管灌或靜脈營養，但要注意體液平衡。"},{"id":"114-2-1102-30","p":"114-2-1102","n":30,"q":"在發生創傷（traumatic injury）或敗血症（sepsis）後，人體對蛋白質之利用及代謝會發生改變，下列對於重症病人體內蛋白質代謝的敘述何者最不適當？","o":["肌肉蛋白質會大量分解成支鏈胺基酸（branched-chain amino acids, BCAAs）以提供肌肉能量來源","此時肝臟會大量製造急性期蛋白質（acute-phase protein）來調控生理的損傷或感染，而製造急性期蛋白質的原料主要來自於體內的瘦體組織（lean body mass）","由於肌肉蛋白質大量分解，鉀、磷及鈣離子會大量從尿中流失","病人體內容易呈現負氮平衡（negative nitrogen balance），而此現象要在控制好病人的發炎反應後才得以改善"],"a":"C","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症的蛋白質代謝","ex":"肌肉分解時，細胞內的鉀、磷、鎂隨氮從尿中大量流失；鈣主要存在骨骼，不會因肌肉蛋白質分解而大量從尿中流失，所以 C 最不適當。肝臟用肌肉來的胺基酸合成急性期蛋白質，病人呈負氮平衡，要控制發炎後才能改善。"},{"id":"114-2-1102-31","p":"114-2-1102","n":31,"q":"有關加速術後康復（enhanced recovery after surgery, ERAS）的步驟，下列敘述何者錯誤？","o":["為了避免手術時發生吸入性嗆傷，術前不可給與任何型態的食物","在腹部或大腸手術前可以給與富含碳水化合物的飲料，以促進血糖的調控並減少氮的流失","在手術中需注意水分的補充量，避免過度補充","術後如果胃腸道功能正常，給與固態食物飲食比給與清流質飲食佳"],"a":"A","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"加速術後康復（ERAS）","ex":"ERAS 不主張術前長時間禁食：術前 6 小時仍可吃固體食物、2 小時前可喝清流質，並在術前補充含碳水化合物的飲料，減少胰島素阻抗與氮流失。術中避免過量輸液，術後腸胃功能正常就盡早由口進食。"},{"id":"114-2-1102-32","p":"114-2-1102","n":32,"q":"王先生在進行捷運架高工程時，不甚從高處跌落後被巨大落石壓傷，被緊急送醫後，因右側大腿粉碎性骨折後截肢，病人因敗血症與呼吸衰竭進行急救後由急診收治外科加護病房。王先生收治後五天，其血液動力學（hemodynamics）狀態漸漸穩定，其BMI為26，要開始進行營養支持，但仍因呼吸衰竭持續以呼吸機支持、體內呈現酸中毒（acidosis）的狀態。下列何者為最適當的熱量需求估算方式？","o":["以indirect calorimetry的測量為基準","每公斤體重35～40大卡","每公斤體重25～30大卡","每公斤體重35大卡＋500大卡"],"a":"C","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症病人的熱量估算","ex":"間接熱量測定是重症熱量估算的首選，但病人有酸中毒時，代償性的過度換氣會改變二氧化碳排出，使測量不準。這時改用簡易公式，重症急性期以每公斤 25～30 大卡為宜，避免過度餵食。"},{"id":"114-2-1102-33","p":"114-2-1102","n":33,"q":"承上題，關於王先生灌食前後的血液動力學（hemodynamics）狀態，其監控項目或標準何者錯誤？","o":["血糖控制80～110 mg/dL","mean arterial pressure（MAP）＞50 mmHg","cardiac output","oxygen saturation"],"a":"A","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症灌食的監測","ex":"重症病人的血糖控制目標一般是 140～180 mg/dL；嚴格控制在 80～110 mg/dL 會增加低血糖與死亡風險。開始灌食前後要監測平均動脈壓、心輸出量與血氧飽和度，確認血液動力學穩定。"},{"id":"114-2-1102-34","p":"114-2-1102","n":34,"q":"有關tuberculosis病人之每日蛋白質建議攝取量，下列何者最適當？","o":["0.6～0.8 g/kg","0.9～1.1 g/kg","1.2～1.5 g/kg","1.6～2.0 g/kg"],"a":"C","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"結核病的蛋白質需要量","ex":"結核病是消耗性疾病，蛋白質建議每公斤 1.2～1.5 公克，以修復組織、維持免疫功能。"},{"id":"114-2-1102-35","p":"114-2-1102","n":35,"q":"有關慢性阻塞性肺病（COPD）病人營養照護的主要目標，下列何者最不相關？","o":["維持瘦肉組織與脂肪組織適當的比例","減少藥物和營養素的交互作用","維持水分的平衡","預防高三酸甘油酯血症"],"a":"D","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"慢性阻塞性肺病的營養目標","ex":"COPD 營養照護的目標包括維持瘦體組織與脂肪組織的比例、避免藥物與營養素交互作用、維持水分平衡（稀釋痰液）、避免過度餵食產生過多二氧化碳。預防高三酸甘油酯血症不是主要目標。"},{"id":"114-2-1102-36","p":"114-2-1102","n":36,"q":"有關酒精與癌症的敘述，下列何者最不適當？","o":["酒精對食道癌而言是可改變風險因素之一","酒精會增加罹患肝癌的風險，並增加倖存者的死亡率","同時使用菸草和酒精會增加上消化道癌症風險","建議女性每日酒精攝取量不超過2酒精當量"],"a":"D","c":"膳食療養","c2":"","ch":"第8章 腫瘤與癌症","ch2":"","t":"酒精與癌症","ex":"為降低癌症風險，飲酒的建議是女性每天不超過 1 個酒精當量、男性不超過 2 個。其餘三項正確：酒精是食道癌、肝癌、上消化道癌的可改變危險因子，與菸草並用風險加乘。"},{"id":"114-2-1102-37","p":"114-2-1102","n":37,"q":"有關cancer cachexia，下列敘述何者錯誤？","o":["會持續性的減輕體重其機制類似慢性飢餓狀態","增加脂質分解並減少脂肪組織質量","增加蛋白質分解與肌肉耗損","增加基礎代謝率因而增加能量消耗"],"a":"A","c":"膳食療養","c2":"","ch":"第8章 腫瘤與癌症","ch2":"","t":"癌症惡病質","ex":"癌症惡病質和單純飢餓不同：飢餓時身體會降低代謝率、保留蛋白質；惡病質受發炎細胞激素驅動，代謝率上升、肌肉與脂肪持續分解，單靠增加進食也難以逆轉。"},{"id":"114-2-1102-38","p":"114-2-1102","n":38,"q":"依據2019亞洲肌少症工作小組（Asian Working Group for Sarcopenia, AWGS）對肌少症之共識，建議基層醫療可以使用下列何種問卷篩檢肌少症？","o":["Mini Nutritional Assessment（MNA）","Strength, Assistance with walking, Rising from a chair, Climbing stairs, and Falls（SARC-F）","Malnutrition Universal Screening Tool（MUST）","Subjective Global Assessment（SGA）"],"a":"B","c":"膳食療養","c2":"營養評估","ch":"第1章 營養照護","ch2":"臨床評估與篩檢工具","t":"肌少症的篩檢工具","ex":"2019 亞洲肌少症工作小組建議基層醫療以小腿圍或 SARC-F 問卷篩檢肌少症。SARC-F 五題是肌力、行走輔助、從椅子站起、爬樓梯、跌倒。MNA、MUST、SGA 是營養不良的篩檢或評估工具。"},{"id":"114-2-1102-39","p":"114-2-1102","n":39,"q":"有關脂肪酸氧化的遺傳代謝失常（genetic metabolic disorder）的治療飲食，下列何者最不適當？","o":["避免禁食","低脂飲食","低醣飲食","攝取足夠熱量"],"a":"C","c":"膳食療養","c2":"","ch":"第13章 小兒科之營養照護","ch2":"","t":"脂肪酸氧化代謝異常的飲食","ex":"脂肪酸氧化缺陷的病人無法利用脂肪產能，飢餓時容易低血糖。飲食原則是避免禁食、低脂、高醣、攝取足夠熱量（必要時用中鏈脂肪或生玉米澱粉）。低醣飲食會讓身體依賴脂肪，最不適當。"},{"id":"114-2-1102-40","p":"114-2-1102","n":40,"q":"有關出血性和缺血性腦中風的敘述，下列何者最適當？","o":["八成五以上的腦中風患者屬於出血性腦中風","缺血性中風發作時，患者通常會有頭痛、嘔吐、意識障礙之後昏迷","右側大腦中動脈栓塞可能會引發失語症","高血壓是出血性和缺血性腦中風共同的危險因子"],"a":"D","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"腦中風的類型與危險因子","ex":"高血壓是出血性與缺血性中風共同的危險因子。腦中風以缺血性為主（約八成）；頭痛、嘔吐、意識障礙較常見於出血性中風；失語症多發生在左側（優勢）大腦半球受損時。"},{"id":"114-2-2102-1","p":"114-2-2102","n":1,"q":"下列何者不屬於商業營利性之團膳組織？","o":["航空空廚","餐盒工廠","外燴辦桌","軍隊膳食"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"營利與非營利團膳","ex":"航空空廚、餐盒工廠、外燴辦桌都是以營利為目的的商業團膳；軍隊、學校、醫院等機構膳食以服務成員為主，屬於非營利性。"},{"id":"114-2-2102-2","p":"114-2-2102","n":2,"q":"醫院依照住院病患病情所需供應各種治療性團體伙食，下列敘述何者正確？","o":["低鹽飲食：飲食不需調整，可依患者口味進行供餐","低渣飲食：常用於腸胃手術前後病患的飲食，建議提供牛奶來補充蛋白質以修補組織","減重飲食：仍以均衡飲食為主，進行熱量調整供餐","低蛋白飲食：因限制蛋白質供應量可能導致熱量攝取不足，建議補充全穀類來增加熱量攝取"],"a":"C","c":"膳食計畫與供應","c2":"膳食療養實驗（二）","ch":"供膳型態","ch2":"1 一般飲食","t":"醫院治療飲食的供應","ex":"減重飲食仍以均衡飲食為基礎，只調整總熱量。低鹽飲食要調整鈉；低渣飲食要避免牛奶（乳糖與殘渣）；低蛋白飲食要用低氮澱粉補足熱量，全穀類含蛋白質較多，不適合拿來補熱量。"},{"id":"114-2-2102-3","p":"114-2-2102","n":3,"q":"依民國109年修訂學校午餐食物內容及營養基準之目標值，對於國小學童午餐供應下列何者錯誤？","o":["全穀雜糧類替代品不得超過2份／週","乳品類3份／週","魚類及各式海鮮供應至少2份／週","豆製品2份以上／週"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"學校午餐食物內容及營養基準","ex":"依標準答案，C 的魚類與海鮮供應次數不符合 109 年基準的規定；其餘三項是基準中的目標值。"},{"id":"114-2-2102-4","p":"114-2-2102","n":4,"q":"某自助餐廳供應12,500人份，每人可由主菜4選1、半葷菜8選2、蔬菜5選1，其中蔬菜5道中有2道使用乾香菇（膨脹收縮率為280％，廢棄損耗率10％），每道欲提供每人5公克的熟香菇，試問蔬菜每道菜至少需製作多少人份及購買多少公斤的乾香菇？","o":["蔬菜2,500人份；約10公斤","蔬菜1,250人份；約7.5公斤","蔬菜2,500人份；約7.5公斤","蔬菜1,250人份；約5公斤"],"a":"A","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"依膨脹率與廢棄率計算採購量","ex":"蔬菜 5 選 1，每道約 12,500 ÷ 5 ＝ 2,500 人份。兩道用香菇共 5,000 人份 × 5 公克 ＝ 25 公斤熟香菇；乾香菇泡發膨脹為 280%：25 ÷ 2.8 ≈ 8.9 公斤；再除以可用率 90%：約 9.9 公斤，所以約 10 公斤。"},{"id":"114-2-2102-5","p":"114-2-2102","n":5,"q":"有關團體膳食菜單設計應注意事項，下列何者錯誤？","o":["應註明餐次與類型","個別供應對象的營養需求","考量餐食供應型態","考量廚房設備種類"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"團膳菜單設計的考量","ex":"團體膳食菜單是依供應「群體」的營養需求設計，不是逐一考量每個人；個別需求是個人化治療飲食的做法。要註明餐次與類型、考量供應型態與廚房設備。"},{"id":"114-2-2102-6","p":"114-2-2102","n":6,"q":"關於循環菜單（cyclical menu）之擬定，何者敘述較不適當？","o":["因應節慶需求宜適度修正菜單","循環週期不宜太短以避免菜色單調","應避免同一循環週期內出現相同菜色","菜單的循環天數與每週或每月供應天數相同"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"循環菜單的擬定","ex":"循環天數若和每週供應天數相同（例如 5 天），同一道菜每次都在同一天出現，容易讓人厭膩，所以循環天數不宜與每週或每月的供應天數相同。"},{"id":"114-2-2102-7","p":"114-2-2102","n":7,"q":"依據請領單所領取的食材及物品後不會再撥發到那個作業區？","o":["驗收區","前處理區","烹調區","包裝區"],"a":"A","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"領料與作業區動線","ex":"領料是把庫房的食材撥發給後續作業區（前處理、烹調、包裝）。驗收區在食材入庫之前，領出來的食材不會再回到驗收區。"},{"id":"114-2-2102-8","p":"114-2-2102","n":8,"q":"下列何種水果不需放入可調氣的冷藏庫貯存？","o":["大西瓜","蘋果","檸檬","木瓜"],"a":"A","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"調氣貯藏的水果","ex":"調氣貯藏用於蘋果、檸檬、木瓜等呼吸作用旺盛、需要延長貯存期的水果。大西瓜外皮厚、貯存性好，一般冷藏或陰涼處即可，不需要調氣冷藏。"},{"id":"114-2-2102-9","p":"114-2-2102","n":9,"q":"有關團膳食材盤點的敘述，下列何者正確？","o":["依時期可分成全部盤點與循環盤點","盤存目的為了解食材實際庫存數量以作為採購人員查價之參考","盤點卡法係指一品一卡以連續多次紀錄的格式盤點","循環盤點又分為區劃盤點與上限盤點"],"a":"C","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"庫存盤點的方法","ex":"盤點卡法是一種品項一張卡，連續記錄進出與結存。盤點依時期可分定期盤點與循環盤點；盤點目的在掌握實際庫存、計算成本與控制存量，不是為了查價。"},{"id":"114-2-2102-10","p":"114-2-2102","n":10,"q":"脫脂鮮奶的乳脂肪含量應在多少以下？","o":["0.8％","0.7％","0.5％","不得檢出"],"a":"C","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"脫脂鮮乳的規格","ex":"依國家標準，脫脂鮮乳的乳脂肪含量在 0.5% 以下；低脂鮮乳為 0.5～1.5%。"},{"id":"114-2-2102-11","p":"114-2-2102","n":11,"q":"下列何者不是冷藏冷凍庫管理的正確使用注意事項？","o":["定期維護冷凝器及清潔濾網","每日應定期查看溫度並記錄之","同一置物架生食在上、熟食在下，以避免交互污染","食品最大盛裝容量為該空間的50～60％"],"a":"C","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"冷藏冷凍庫的管理","ex":"同一個置物架應熟食在上、生食在下，以免生食的汁液滴到熟食造成交叉污染。C 說反了。"},{"id":"114-2-2102-12","p":"114-2-2102","n":12,"q":"下列採購方法之敘述，何者錯誤？","o":["聯合採購可以節省採購及驗收時間","招標採購適合大宗食材採購","詢價採購適合小額貨品採購","議價採購適合緊急採購"],"a":"A","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"採購方法的特性","ex":"聯合採購是幾個單位合併採購，以量制價、降低成本，但要協調規格與數量，並不能節省採購與驗收的時間。"},{"id":"114-2-2102-13","p":"114-2-2102","n":13,"q":"有關蔬菜的味道，下列何者錯誤？","o":["辣椒含辣椒素（capsaicine）帶有辣味","老薑含薑油酮（gingeron）帶有辣味","新鮮白蘿蔔含有乙醛二甲硫醇（acetaldehydedimethyl mercaptan）帶有鮮苦味","芹菜含芹菜子交酯（sedanolide）帶有特殊氣味"],"a":"C","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"蔬果","t":"蔬菜的風味成分","ex":"新鮮白蘿蔔的辛辣味來自異硫氰酸酯類（芥子油），由硫配糖體經酵素分解產生。甲硫醇類的硫化物氣味是蘿蔔煮過或久放後才產生的。"},{"id":"114-2-2102-14","p":"114-2-2102","n":14,"q":"製作泰式酸辣魚，使用何種烹調方式和魚種較適合？","o":["蒸或烤，秋刀魚","煮或燒，白帶魚","煮或燒，柳葉魚","蒸或烤，吳郭魚"],"a":"D","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"肉類與水產","t":"菜色與魚種的搭配","ex":"泰式酸辣魚常用整尾吳郭魚（或鱸魚）蒸或烤，再淋上酸辣醬汁。秋刀魚、柳葉魚多用烤或炸，白帶魚多用煎或紅燒。"},{"id":"114-2-2102-15","p":"114-2-2102","n":15,"q":"下列何種烹調方式醬油使用量最多？","o":["滷","炸","蒸","炒"],"a":"A","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"調味料與其他","t":"烹調方式與醬油用量","ex":"滷是把食材長時間浸在以醬油為主的大量滷汁中加熱，醬油用量最多。"},{"id":"114-2-2102-16","p":"114-2-2102","n":16,"q":"有關澱粉糊精化之敘述，下列何者正確？","o":["澱粉加水加熱會形成糊精","溫度越低糊精化速度越快","爆米香及炒麵茶都是澱粉糊精化產品","糊精化澱粉分子較大，可溶於水且易消化"],"a":"C","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"穀類與澱粉","t":"澱粉的糊精化","ex":"糊精化是澱粉在乾熱（不加水）下分解成較小的糊精，溫度越高越快；爆米香、炒麵茶、烤吐司表面都是。澱粉加水加熱是糊化；糊精分子比澱粉小，易溶於水、易消化。"},{"id":"114-2-2102-17","p":"114-2-2102","n":17,"q":"馬鈴薯發芽後會產生那種毒素？","o":["羽扇豆鹼（lupinine）","氧化鹼（oxidized alkaloid）","苦參鹼（matrine）","茄鹼（solanin）"],"a":"D","c":"團體膳食製備","c2":"食品衛生與安全","ch":"食物製備","ch2":"天然毒素與汙染物","t":"發芽馬鈴薯的毒素","ex":"馬鈴薯發芽或表皮變綠時，芽眼與綠皮的茄鹼（solanine）增加，大量攝取會引起嘔吐、腹瀉與神經症狀。"},{"id":"114-2-2102-18","p":"114-2-2102","n":18,"q":"下列何者最不適合做為團膳菜色？","o":["醉雞","奶油焗白菜","竹筍炒肉絲","羅宋湯"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"團膳不宜的菜色","ex":"醉雞是熟雞肉浸泡酒汁後冷藏、冷食供應，烹調後還要經過多次處理且不再加熱，衛生風險高；又含酒精，不適合學生等團膳對象。"},{"id":"114-2-2102-19","p":"114-2-2102","n":19,"q":"有關油菜籽油、大豆油、奶油、椰子油四種油脂的比較，下列敘述何者錯誤？","o":["碘價－奶油最高","飽和脂肪酸－椰子油最高","多元不飽和脂肪酸－大豆油最高","單元不飽和脂肪酸－油菜籽油最高"],"a":"A","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"油脂","t":"常見油脂的脂肪酸組成","ex":"碘價代表不飽和度，大豆油的多元不飽和脂肪酸最多，碘價最高；奶油以飽和脂肪酸為主，碘價低。椰子油飽和脂肪酸最高；油菜籽油（芥花油）單元不飽和脂肪酸最高。"},{"id":"114-2-2102-20","p":"114-2-2102","n":20,"q":"經公告應取得食品安全衛生管理系統驗證之業者，依規定未取得驗證及取得驗證後如違反食安相關規定之處分，下列何者錯誤？","o":["未建立追溯或追蹤系統經命限期改正，屆期不改正者處新臺幣3萬元以上3百萬元以下罰鍰","未開立電子發票致無法為食品之追溯或追蹤經命限期改正，屆期不改正者處新臺幣6萬元以上30萬元以下罰鍰","違反食品安全衛生管理法及其相關法規規定，且情節重大者將廢止其驗證","已取得食品安全衛生管理系統驗證之業者若經廢止登錄，一年內不得再重新申請"],"a":"B","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品安全衛生法規","t":"食品業者未取得驗證或追溯的罰則","ex":"依標準答案 B 錯：未依規定開立電子發票致無法追溯追蹤，經限期改正而不改正，罰鍰和未建立追溯系統相同，是新臺幣 3 萬元以上 300 萬元以下，不是 6 萬至 30 萬元。"},{"id":"114-2-2102-21","p":"114-2-2102","n":21,"q":"有關PDCA循環之基本步驟，下列何者錯誤？","o":["P（計畫）：擬定策略","D（實施）：執行策略","C（檢討）：確認效果","A（處置）：現狀把握"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"PDCA 循環","ex":"PDCA 的 A（Act，處置）是把有效的做法標準化、無效的檢討改進，進入下一個循環。「現狀把握」是計畫（P）階段的工作。"},{"id":"114-2-2102-22","p":"114-2-2102","n":22,"q":"下列那種品質管制統計方法是以簡單的記號標註並加以統計整理？","o":["檢核表","柏拉圖","散佈圖","魚骨圖"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"品管七大手法：檢核表","ex":"檢核表（查檢表）用簡單的記號登記資料，方便統計整理。柏拉圖找出重要的少數原因；散佈圖看兩個變數的關係；魚骨圖分析特性與原因。"},{"id":"114-2-2102-23","p":"114-2-2102","n":23,"q":"製作標準程序書時應列出5W1H，下列那一項不包括？","o":["Where","When","Why","Which"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"標準作業程序的 5W1H","ex":"5W1H 是 What、Why、Where、When、Who、How，沒有 Which。"},{"id":"114-2-2102-24","p":"114-2-2102","n":24,"q":"團體膳食實施HACCP的優點與傳統衛生管理比較，下列敘述何者正確？","o":["HACCP注重最終產品的檢驗以確保食品安全品質；傳統衛生安全管理強調製程管理","HACCP實施需花費相當之時間、龐大的人力、物力與檢驗費用；傳統衛生安全管理較節省人力、成本等","HACCP實施強調事前預防管制制度可有效抑制安全之三大危害發生；傳統衛生安全管理則無法明確找出污染原因","HACCP實施成效也可能造成產品回收、商譽受損的情形；傳統衛生管理實施結果通常為事後補救措施，重複製程疏失難防止"],"a":"C","c":"膳食計畫與供應","c2":"食品衛生與安全","ch":"品質管理","ch2":"衛生管理與 HACCP","t":"HACCP 與傳統衛生管理的比較","ex":"HACCP 強調事前預防、全程管制，可以有效抑制生物性、化學性、物理性危害；傳統衛生管理依賴最終產品檢驗，屬事後補救，也較難找出污染原因。A、B、D 把兩者的特性說反了。"},{"id":"114-2-2102-25","p":"114-2-2102","n":25,"q":"有關品質管理活動5S運動的敘述，下列何者錯誤？","o":["5S中的清潔是指徹底執行整理、整頓及清掃後，應維持良好的狀態","5S是源自日本的品管方法，成功關鍵在於持之以恆","5S中的整頓是指把要與不要的物品區分清楚","5S中包括紀律（教養）"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"5S 運動","ex":"5S 是整理、整頓、清掃、清潔、教養。把要與不要的物品區分開是「整理」；「整頓」是把需要的物品定位放好、方便取用。"},{"id":"114-2-2102-26","p":"114-2-2102","n":26,"q":"爐灶點火順序，下列何者正確？①按壓點火槍　②打開母火開關　③點燃母火　④打開子火開關　⑤點燃子火","o":["①②③④⑤","①④⑤②③","②①③④⑤","④①⑤②③"],"a":"A","c":"團體膳食製備","c2":"","ch":"設備與器具","ch2":"","t":"爐灶的點火順序","ex":"爐灶點火要先備好火源再開瓦斯，避免瓦斯積聚造成氣爆：先按壓點火槍，打開母火開關點燃母火，再打開子火開關由母火點燃子火。"},{"id":"114-2-2102-27","p":"114-2-2102","n":27,"q":"選購廚房設備與用品應考慮的因素，下列何者錯誤？","o":["具省力與增加產能的器具","具有符合人體工學的設計","廠商提供維修與售後服務","清潔劑需符合工業級標準"],"a":"D","c":"團體膳食製備","c2":"","ch":"設備與器具","ch2":"","t":"廚房設備與用品的選購","ex":"廚房使用的清潔劑要符合食品用洗潔劑的衛生標準，不是工業級。其他考量包括省力、增加產能、符合人體工學、廠商的維修與售後服務。"},{"id":"114-2-2102-28","p":"114-2-2102","n":28,"q":"下列何者不屬於人力資源計畫？","o":["獎勵薪資制度","員工訓練與培育","招募與徵選新員工","員工排班與加班管理"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"人力資源計畫的內容","ex":"人力資源計畫是長期規劃：招募與甄選、訓練與培育、薪資與獎勵制度等。每天的排班與加班管理屬於日常作業管理。"},{"id":"114-2-2102-29","p":"114-2-2102","n":29,"q":"某醫院廚房工作人員排班採輪班制，余大智為替班人員，星期一上12：00～20：00班，余大智隔天星期二被排定下列何種班別則違反勞動基準法規定？","o":["6：00～14：00班","8：00～16：00班","11：00～19：00班","12：00～20：00班"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"輪班間隔的勞基法規定","ex":"勞動基準法規定輪班制更換班次時，至少要有連續 11 小時的休息時間。星期一 20:00 下班，星期二 6:00 上班只間隔 10 小時，違反規定。"},{"id":"114-2-2102-30","p":"114-2-2102","n":30,"q":"花枝羹每碗售價50元，每碗食材包含60公克生花枝和其他配料共40公克，若花枝售價由60元／斤上漲為90元／斤，而其他配料維持每碗10元的成本，下列何者正確？","o":["食材供應量不變情況下，食物成本百分比為30%","若要維持相同售價和利潤，每碗生花枝供應量調整為40公克","維持相同售價和供應量食，每碗淨利潤為30元","若要維持相同供應量和利潤，售價應調整為每碗55元"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"食材漲價時的成本計算","ex":"花枝 60 元／斤（600 公克）時，60 公克 ＝ 6 元，每碗成本 16 元；漲到 90 元／斤後同量為 9 元，成本 19 元。要維持原成本 16 元，花枝只能花 6 元：6 ÷（90 ÷ 600）＝ 40 公克。A 的成本率是 38%；C 的淨利無法只由食材算出；D 要售價 53 元。"},{"id":"114-2-2102-31","p":"114-2-2102","n":31,"q":"自助餐廳去年一年的損益表顯示，總營業額500萬元，固定費用占35％，利潤為125萬元，今年初買了一台新設備，固定費用比去年增加15萬元，若變動成本百分比不變，此餐廳今年損益平衡點的營業額與下何者最接近？","o":["280萬元","320萬元","360萬元","400萬元"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"損益平衡點","ex":"去年固定費用 500 × 35% ＝ 175 萬，變動成本 ＝ 500 − 175 − 125 ＝ 200 萬，變動成本率 40%。今年固定費用 190 萬，損益平衡點 ＝ 190 ÷（1 − 40%）≈ 317 萬元，最接近 320 萬元。"},{"id":"114-2-2102-32","p":"114-2-2102","n":32,"q":"學生餐廳4月30日庫房盤點，雞胸肉庫存15箱，每箱單價650元，5月9日及24日各進貨30、15箱，單價分別為600元、750元，5月30日盤存剩16箱，以加權平均法計算此月使用的雞胸肉平均單價是一箱多少元？","o":["617","650","667","697"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"加權平均法計算單價","ex":"加權平均單價 ＝（期初存貨＋本期進貨的總金額）÷ 總數量 ＝（15 × 650 ＋ 30 × 600 ＋ 15 × 750）÷ 60 ＝ 39,000 ÷ 60 ＝ 650 元。"},{"id":"114-2-2102-33","p":"114-2-2102","n":33,"q":"欲供應450人份之糖醋里肌肉，每份供應量為100公克，里肌肉可食部分占90％，收縮率為85％，約需購買多少公斤的里肌肉？","o":["50","53","56","59"],"a":"D","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"由可食率與收縮率計算採購量","ex":"熟品 450 × 100 公克 ＝ 45 公斤；收縮率 85%：45 ÷ 0.85 ≈ 52.9 公斤可食部分；可食率 90%：52.9 ÷ 0.9 ≈ 58.8 公斤，約 59 公斤。"},{"id":"114-2-2102-34","p":"114-2-2102","n":34,"q":"有關火災的防範和處置，下列敘述何者正確？","o":["發生火災時滅火人員應站在下風位置","每三百平方公尺面積應設置滅火器一枚","二氧化碳滅火器適用於油類和電器類火災之滅火","泡沫滅火器適合用於金屬火災之滅火"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"危機處理","ch2":"","t":"火災的滅火方式","ex":"二氧化碳滅火器不導電、不殘留，適用於油類（B 類）與電器（C 類）火災。滅火時應站在上風處；泡沫滅火器不能用於金屬與電器火災。"},{"id":"114-2-2102-35","p":"114-2-2102","n":35,"q":"有關餐飲機構病媒之管理，下列措施對於隔絕蒼蠅較無效果？","o":["在作業區出入口加裝塑膠簾","作業區內以波長350～370 nm紫外線燈照射","在驗貨區入口設置捕蠅燈","廚房出入口加裝空氣簾"],"a":"B","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"防治蒼蠅的方法","ex":"塑膠簾、空氣簾是把蒼蠅擋在外面；捕蠅燈設在入口外圍可以誘捕。在作業區內開紫外線燈反而會把蒼蠅吸引進來，對隔絕效果最差。"},{"id":"114-2-2102-36","p":"114-2-2102","n":36,"q":"某小學學生家長臨時決定贈送生日特餐給某班當午餐，營養師應如何處理該班未食用完之食物？","o":["剩餘沾料可在下一餐儘速供應使用","食物應冷藏於10℃以下避免細菌迅速繁殖","食物復熱中心溫度需在74℃以上方可食用","剩餘食物在室溫下應於3小時內處理完畢"],"a":"C","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"剩餘食物的處理","ex":"剩餘食物要再供應，復熱的中心溫度須達 74℃ 以上。冷藏要在 7℃ 以下；熟食在室溫下不得超過 2 小時；用過的沾料不應再供應。"},{"id":"114-2-2102-37","p":"114-2-2102","n":37,"q":"團膳業若使用耐熱性較差的器具時，可以用配製多少ppm有效氯水來消毒？","o":["200","300","400","500"],"a":"A","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"有效氯消毒的濃度","ex":"不耐熱的器具不能用熱水或蒸氣，可浸泡在有效氯 200 ppm 的氯液中 2 分鐘以上消毒。"},{"id":"114-2-2102-38","p":"114-2-2102","n":38,"q":"學校為減少無心廠商午餐委外作業投標，在招標資料中請廠商準備一張支票，若廠商有違反投標規定則學校得據以招標文件之規定不予發還，這個金額名稱為何？","o":["押標金","保證金","滯納金","履約保證金"],"a":"A","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"押標金","ex":"押標金是投標時繳交的保證金，用來防止廠商不實投標；違反投標規定時不予發還。履約保證金是得標後簽約時繳交，確保廠商依約履行。"},{"id":"114-2-2102-39","p":"114-2-2102","n":39,"q":"學校午餐委託民間廠商辦理時，學校成立管理委員會的主要目的，不包括下列何者？","o":["定期與承包廠商舉行督導會議，協助廠商順利進行供膳計畫","幫助承包商進行供膳場所設計、設備採購與空間佈局","推動承包商能衛生自主管理，並督導執行供膳業務","監督承包商依據合約執行履約"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"學校午餐委外的管理委員會","ex":"管理委員會的工作是督導與監督：定期開督導會議、督導廠商衛生自主管理、監督依約履行。供膳場所設計、設備採購是廠商自己的責任，不是委員會的目的。"},{"id":"114-2-2102-40","p":"114-2-2102","n":40,"q":"關於諾羅病毒的敘述，下列何者錯誤？","o":["糞口傳染為其主要傳染方式","受到污染的食品或飲水及處理食品的人罹病皆可能污染食品","檢出諾羅病毒陽性廚工在症狀解除後即可恢復調理食品的工作","預防主要在「勤洗手」，特別在如廁後、進食與準備餐食前"],"a":"C","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品微生物與食品中毒","t":"諾羅病毒的防治","ex":"諾羅病毒感染者在症狀解除後仍會排出病毒，所以廚工要在症狀解除至少 48 小時後才能恢復調理食品的工作。病毒主要經糞口傳染，預防以正確洗手最重要（酒精效果有限）。"},{"id":"114-2-3102-1","p":"114-2-3102","n":1,"q":"關於骨骼肌在中度運動（moderate exercise）期間提供三磷酸腺苷（ATP）來源的順序，下列何者優先？","o":["磷酸肌酸（creatine phosphate）","肝醣（glycogen）","葡萄糖（glucose）","脂肪酸（fatty acid）"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"肌肉","ch2":"","t":"運動時 ATP 的供應順序","ex":"運動一開始最先動用肌肉中現成的 ATP 與磷酸肌酸（磷酸原系統），可維持約 10 秒；接著是肌肝醣的無氧與有氧分解，運動時間越長，血糖與脂肪酸的比重越高。"},{"id":"114-2-3102-2","p":"114-2-3102","n":2,"q":"關於心肌的興奮－收縮耦合（excitation-contraction coupling）的敘述，下列何者錯誤？","o":["以鈣誘發性鈣釋放（calcium-induced calcium release）機制來活化細肌絲","雷恩諾鹼接受器（ryanodine receptors）活化可回收鈣離子","L型鈣離子通道（L-type Ca²⁺ channels）為電位感受器（voltage sensor）","流入細胞質的鈣離子會促使肌漿網（sarcoplasmic reticulum）釋放出更大量的鈣離子"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"心肌的興奮－收縮耦合","ex":"心肌細胞膜上的 L 型鈣通道感受去極化而開啟，流入的少量鈣再刺激肌漿網上的雷恩諾鹼受器釋放大量鈣（鈣誘發性鈣釋放）。雷恩諾鹼受器負責「釋放」鈣；回收鈣靠肌漿網上的 SERCA 鈣幫浦。"},{"id":"114-2-3102-3","p":"114-2-3102","n":3,"q":"有關平滑肌之橫橋活化（cross-bridge activation）過程的敘述，下列何者正確？","o":["鈣離子與攜鈣素（calmodulin）結合，導致肌凝蛋白（myosin）磷酸化","鈣離子與旋轉素（troponin）結合，導致肌凝蛋白（myosin）磷酸化","鈣離子與攜鈣素（calmodulin）結合，導致旋轉肌球素（tropomyosin）磷酸化","鈣離子與旋轉素（troponin）結合，導致旋轉肌球素（tropomyosin）磷酸化"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"肌肉","ch2":"","t":"平滑肌的收縮機制","ex":"平滑肌沒有旋轉素。鈣與攜鈣素結合後活化肌凝蛋白輕鏈激酶（MLCK），使肌凝蛋白輕鏈磷酸化，橫橋才能和肌動蛋白結合。旋轉素－旋轉肌球素系統是骨骼肌與心肌的調節方式。"},{"id":"114-2-3102-4","p":"114-2-3102","n":4,"q":"關於人類細胞膜蛋白的敘述，下列何者最適當？","o":["嵌入膜蛋白（integral membrane proteins）只具有非極性（nonpolar）特性","嵌入膜蛋白（integral membrane proteins）不具雙極性（amphipathic）特性","周邊膜蛋白（peripheral membrane proteins）具有非極性（nonpolar）特性","周邊膜蛋白（peripheral membrane proteins）不具雙極性（amphipathic）特性"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"細胞生理與膜運輸","ch2":"","t":"細胞膜蛋白的極性","ex":"嵌入膜蛋白穿過脂雙層，埋在膜內的部分是非極性、露在兩側的部分是極性，屬於雙極性（amphipathic）分子。周邊膜蛋白只附著在膜表面，以極性作用和膜脂質或嵌入蛋白結合，不具雙極性。"},{"id":"114-2-3102-5","p":"114-2-3102","n":5,"q":"吞嚥反射包括一連串的步驟，其中何者可避免食物誤入氣管？","o":["咽部化學感覺受器（chemoreceptor）的刺激","舌頭向軟腭部（soft palate）上頂","食道上端括約肌（upper esophageal sphincter）的收縮","會厭軟骨（epiglottis）的位置變化"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"吞嚥反射","ex":"吞嚥時喉部上提、會厭軟骨向下蓋住喉口，加上聲門關閉，避免食物進入氣管。舌頭上頂與軟腭上提是封住鼻咽，防止食物進入鼻腔。"},{"id":"114-2-3102-6","p":"114-2-3102","n":6,"q":"消化道的掃蕩排空運動（migrating myoelectrical complex, MMC）於何時產生？","o":["吃高量纖維之後","兩餐之間空腹時間","吃高蛋白食物之後","享用辣食之後"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"移行性運動複合波（MMC）","ex":"MMC 在兩餐之間空腹時出現，約每 90～120 分鐘一次，由胃往小腸推進，把殘渣與細菌掃向大腸；受胃動素（motilin）調控，進食後就停止。"},{"id":"114-2-3102-7","p":"114-2-3102","n":7,"q":"下列何種營養素主要靠擴散作用進入小腸表皮細胞？","o":["單糖","脂肪酸","胺基酸","鐵質"],"a":"B","c":"人體生理學與實驗","c2":"營養學","ch":"消化","ch2":"脂質","t":"營養素的吸收方式","ex":"脂肪酸與單酸甘油酯脂溶性高，由微膠粒帶到小腸表皮後，以簡單擴散通過細胞膜（也有部分經運輸蛋白）。葡萄糖與半乳糖靠 SGLT1 次級主動運輸，胺基酸多為鈉偶合的主動運輸，鐵靠 DMT1 運輸蛋白。"},{"id":"114-2-3102-8","p":"114-2-3102","n":8,"q":"病人進行全胃切除後，主要會對消化道產生下列何種影響？","o":["食道取代胃的消化功能","小腸易產生低張性內容物","大量水分由消化道經滲透作用進入循環系統","大量食物進入小腸，造成腹瀉和營養素吸收不良"],"a":"D","c":"人體生理學與實驗","c2":"膳食療養","ch":"消化","ch2":"第5章 消化道及肝、膽、胰臟疾病","t":"胃切除後的傾食症候群","ex":"全胃切除後沒有胃的儲存與緩慢排空功能，大量高張食物直接進入小腸，水分由血管滲入腸腔（不是從腸腔進入循環），造成腹脹、腹瀉與營養素吸收不良，即傾食症候群。小腸內容物是高張性，不是低張性。"},{"id":"114-2-3102-9","p":"114-2-3102","n":9,"q":"關於健康人體腎臟功能之敘述，下列何者最不適當？","o":["調節血壓（blood pressure）","生成紅血球生成素（erythropoietin），刺激紅血球生成","排除蛋白質代謝產物尿素（urea）及胺基酸（amino acid）","分泌腎素（renin）"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎臟的功能","ex":"腎臟可調節血壓、分泌腎素與紅血球生成素、活化維生素 D。尿素是蛋白質代謝的含氮廢物，會排出；但胺基酸在近曲小管幾乎完全被再吸收，健康人不會從尿中排除胺基酸。"},{"id":"114-2-3102-10","p":"114-2-3102","n":10,"q":"下列關於腎臟之敘述，何者最適當？","o":["腎臟位於腹腔脊柱兩側，左及右邊腎臟等高且大小一致","相較於皮質（cortex），腎臟髓質（medulla）的血流較多","輸尿管利用混和運動（mixing movement）及重力將尿液經腎門（hilum）送至膀胱儲存","供應腎臟的血液來自於腹主動脈（abdominal aorta）的腎動脈分枝"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎臟的構造與血流","ex":"腎動脈是腹主動脈的分支。右腎因肝臟壓在上方，位置比左腎稍低；腎皮質的血流遠多於髓質；輸尿管靠蠕動把尿液送到膀胱，不是混合運動。"},{"id":"114-2-3102-11","p":"114-2-3102","n":11,"q":"關於腎元（nephron）之敘述，下列何者錯誤？","o":["腎元是腎臟的最小功能單位，可以透過腎絲球過濾（glomerular filtration），腎小管分泌（tubular secretion）及再吸收（reabsorption）來製造尿液","腎絲球微血管的基底膜（basal lamina）為帶負電醣蛋白，蛋白質常會被阻礙而無法通過，但可進入鮑氏囊（Bowman's capsule）","腎絲球微血管的內皮細胞有較大的窗孔（fenestrae），因此其對水及一些可通透溶質之通透度較一般骨骼肌微血管高","腎絲球過濾之濾液會進入腎小管中，而未被過濾之微血管血液則經出球小動脈（efferent arteriole）流出"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎絲球過濾屏障","ex":"腎絲球基底膜帶負電，會阻擋血漿蛋白（尤其帶負電的白蛋白），所以蛋白質通常不會進入鮑氏囊；健康人的濾液幾乎不含蛋白質。B 的後半句錯。"},{"id":"114-2-3102-12","p":"114-2-3102","n":12,"q":"關於排尿（micturition）的敘述，下列何者正確？","o":["主要由大腦排尿中樞（micturition center）活化並刺激交感神經（sympathetic neurons）所引發","此現象只發生在膀胱尿液尚未完全充滿前所引發之神經反射","會引發逼尿肌（detrusor muscle）收縮及外尿道括約肌（external urethral sphincter）收縮","人類以意識控制允許排尿的能力，約可在孩童2～3歲時開始發展並學習完成"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"排尿反射","ex":"排尿反射由膀胱充滿時的牽張刺激引發，經薦部脊髓的副交感神經使逼尿肌收縮、內括約肌放鬆，同時外尿道括約肌放鬆。幼兒約 2～3 歲開始能以意識控制外括約肌。"},{"id":"114-2-3102-13","p":"114-2-3102","n":13,"q":"下列何種激素分泌明顯下降時，可能出現高血壓？","o":["腎上腺素（epinephrine）","醛固酮（aldosterone）","心房利鈉胜肽（atrial natriuretic peptide）","皮質醇（cortisol）"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"心房利鈉胜肽與血壓","ex":"心房利鈉胜肽（ANP）在心房被撐大時分泌，增加鈉與水的排出、舒張血管、抑制腎素與醛固酮，使血壓下降；分泌不足時容易出現高血壓。醛固酮、腎上腺素、皮質醇分泌過多才會升高血壓。"},{"id":"114-2-3102-14","p":"114-2-3102","n":14,"q":"甲狀腺功能亢進時，血液檢查最可能呈現的現象為何？","o":["甲促素（TSH）偏高，甲狀腺素偏高","甲促素（TSH）偏低，甲狀腺素偏低","甲促素（TSH）偏高，甲狀腺素偏低","甲促素（TSH）偏低，甲狀腺素偏高"],"a":"D","c":"人體生理學與實驗","c2":"膳食療養","ch":"內分泌與生殖","ch2":"第12章 內分泌與新陳代謝疾病","t":"甲狀腺功能亢進的檢驗值","ex":"原發性甲狀腺功能亢進（如葛瑞夫茲病）時甲狀腺素過多，經負回饋抑制腦下垂體，所以 TSH 偏低、甲狀腺素偏高。"},{"id":"114-2-3102-15","p":"114-2-3102","n":15,"q":"下列何者不是類固醇激素的特性？","o":["可自由穿過細胞膜","合成後儲存在細胞核中","合成後可立刻離開細胞","在血液中不易被分解"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"類固醇激素的特性","ex":"類固醇激素是脂溶性，合成後立即擴散出細胞，不會預先儲存；在血液中與運輸蛋白結合，不易被分解，可穿過細胞膜作用在細胞內受體。胜肽類激素才會先儲存在分泌顆粒中。"},{"id":"114-2-3102-16","p":"114-2-3102","n":16,"q":"副甲狀腺素（parathyroid hormone）對調節血液磷酸鹽濃度的直接作用為何？","o":["減少噬骨細胞分解骨質","增加血液磷酸鹽濃度","增加小腸對磷酸鹽的吸收","減少腎小管對磷酸鹽的再吸收"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"副甲狀腺素對磷的作用","ex":"副甲狀腺素直接作用在腎臟，減少近曲小管對磷酸鹽的再吸收，使尿磷增加；同時促進骨質分解、活化維生素 D。小腸吸收磷增加是活化維生素 D 的間接作用。"},{"id":"114-2-3102-17","p":"114-2-3102","n":17,"q":"下列何種激素在口服後，於人體內仍可產生顯著效用？","o":["腎上腺素（epinephrine）","胰島素（insulin）","褪黑激素（melatonin）","副甲狀腺素（parathyroid hormone）"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"口服激素的效用","ex":"胰島素、副甲狀腺素是胜肽，口服會被消化酶分解；腎上腺素口服後在腸道與肝臟被快速代謝。褪黑激素是小分子吲哚胺，口服可以吸收並發揮作用。"},{"id":"114-2-3102-18","p":"114-2-3102","n":18,"q":"下列何者是藉由外在控制（extrinsic control）引發小動脈舒張？","o":["主動性充血（active hyperemia）","血流自我調節（flow autoregulation）","腎素血管張力素系統（renin angiotensin system）","非腎上腺非膽鹼性神經元（non-adrenergic, non-cholinergic neuron）"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"小動脈的外在調控","ex":"外在控制是指神經與激素的調控。非腎上腺非膽鹼性神經元釋放一氧化氮等物質使血管舒張，屬神經性外在控制。主動性充血與血流自我調節是組織局部的內在控制；腎素血管張力素系統是外在控制，但使血管收縮。"},{"id":"114-2-3102-19","p":"114-2-3102","n":19,"q":"下列何者可使正常成人心臟之心搏量（stroke volume）增加？","o":["心跳頻率增加","左心室舒張末期體積增加","主動脈壓增加","左心房壓力下降"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"心搏量的影響因素","ex":"依法蘭克－史達林定律，舒張末期體積（前負荷）增加時，心肌被拉長，收縮力與心搏量增加。心跳過快會縮短充血時間；主動脈壓升高是後負荷增加，使心搏量下降。"},{"id":"114-2-3102-20","p":"114-2-3102","n":20,"q":"關於造成水腫（edema）的因素，下列敘述何者錯誤？","o":["動脈血壓升高","組織中蛋白質濃度升高","靜脈回流增加","淋巴系統阻塞"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"水腫的成因","ex":"微血管靜水壓升高、組織間液蛋白濃度升高、淋巴回流受阻都會造成水腫。靜脈回流增加會降低微血管壓力，不會造成水腫；靜脈回流受阻（靜脈壓升高）才會。"},{"id":"114-2-3102-21","p":"114-2-3102","n":21,"q":"適度發燒可降低血漿中何種離子，以抑制細菌活性？","o":["鐵離子","銅離子","鋁離子","鉀離子"],"a":"A","c":"人體生理學與實驗","c2":"營養學","ch":"血液","ch2":"礦物質（微量）","t":"發燒與血漿鐵","ex":"發炎與發燒時，介白素刺激肝臟分泌鐵調素（hepcidin），使鐵滯留在巨噬細胞與腸細胞中，血漿鐵降低；細菌生長需要鐵，降低血鐵可以抑制細菌。"},{"id":"114-2-3102-22","p":"114-2-3102","n":22,"q":"下列那些神經元或細胞，主要釋放乙醯膽鹼（acetylcholine）？①副交感神經系統的節後神經元（postganglionic neuron）　②交感神經系統節前神經元（preganglionic neuron）　③體運動神經系統的運動神經元（motor neuron）　④腎上腺髓質的嗜鉻細胞（chromaffin cell）","o":["①②③","②③④","①②④","僅①③"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"釋放乙醯膽鹼的神經元","ex":"交感與副交感的節前神經元、副交感的節後神經元、體運動神經元都釋放乙醯膽鹼。腎上腺髓質的嗜鉻細胞受乙醯膽鹼刺激，但它釋放的是腎上腺素與正腎上腺素。"},{"id":"114-2-3102-23","p":"114-2-3102","n":23,"q":"下列何者是掌控大塊肌肉群收縮，並維持身體站立姿勢穩定的主要神經路徑？","o":["腦幹路徑（brainstem pathway）","背柱路徑（dorsal column pathway）","側皮質脊髓路徑（lateral corticospinal tract）","前側脊髓視丘路徑（anterolateral spinothalamic tract）"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"運動神經路徑","ex":"腦幹路徑（內側路徑，如前庭脊髓徑、網狀脊髓徑）控制軀幹與近端大肌群，維持姿勢與平衡。側皮質脊髓徑控制遠端肢體的精細動作；背柱與脊髓視丘路徑是感覺路徑。"},{"id":"114-2-3102-24","p":"114-2-3102","n":24,"q":"除了氧氣和二氧化碳的交換外，呼吸系統還具有那些功能？①參與激素的合成　②捕獲並溶解血液中血栓　③去除血液中的生化物質　④有助於調節血液的pH值","o":["僅①②③","僅②③④","僅①③④","①②③④"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"呼吸","ch2":"","t":"呼吸系統的非呼吸功能","ex":"肺部可把血管張力素 I 轉為 II（參與激素合成）、肺微血管可攔截並溶解小血栓、可移除血中的部分物質（如緩激肽、血清素），並藉二氧化碳的排出調節血液 pH。"},{"id":"114-2-3102-25","p":"114-2-3102","n":25,"q":"細胞外液中，下列何者最容易刺激呼吸中樞化學感受器（central chemoreceptors）？","o":["高氧","低氧","高氫離子","低氫離子"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"呼吸","ch2":"","t":"中樞化學感受器","ex":"延腦的中樞化學感受器對腦脊髓液的氫離子最敏感；血中二氧化碳進入腦脊髓液後形成氫離子而刺激呼吸。低氧主要由頸動脈體等周邊化學感受器偵測。"},{"id":"114-2-3102-26","p":"114-2-3102","n":26,"q":"紅血球細胞於糖解過程所產生的何種中間產物可降低血紅素（hemoglobin）與氧之親和力？","o":["1,3-bisphosphoglycerate","2,3-bisphosphoglycerate","2-phosphoglycerate","3-phosphoglycerate"],"a":"B","c":"人體生理學與實驗","c2":"生物化學（二）","ch":"血液","ch2":"醣類代謝","t":"2,3-BPG 與氧親和力","ex":"紅血球糖解時，1,3-BPG 經 BPG 變位酶轉成 2,3-BPG，2,3-BPG 結合在去氧血紅素上，降低血紅素對氧的親和力，使氧解離曲線右移、組織較易得到氧。高海拔或貧血時 2,3-BPG 增加。"},{"id":"114-2-3102-27","p":"114-2-3102","n":27,"q":"下列何種生化代謝反應屬於anabolism？","o":["glycolysis","glycogenolysis","glycogenesis","fatty acid beta oxidation"],"a":"C","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"同化作用與異化作用","ex":"同化作用（anabolism）是由小分子合成大分子、消耗能量。肝醣生成（glycogenesis）是由葡萄糖合成肝醣；糖解、肝醣分解、β-氧化都是異化作用。"},{"id":"114-2-3102-28","p":"114-2-3102","n":28,"q":"有關gluconeogenesis之敘述，下列何者正確？","o":["Cori cycle中，gluconeogenesis發生於肌肉組織","acetyl-CoA是pyruvate carboxylase的調節因子","glycerol、lactate與ethanol可作為gluconeogenesis的前驅物","oxaloacetate可穿透粒線體膜，在細胞質中經phosphoenolpyruvate carboxykinase催化轉變成phosphoenolpyruvate"],"a":"B","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"糖質新生","ex":"乙醯輔酶 A 是丙酮酸羧化酶的必需活化劑：脂肪酸氧化產生大量乙醯輔酶 A 時，促進丙酮酸轉成草醯醋酸以進行糖質新生。Cori 循環的糖質新生在肝臟；乙醇不是前驅物；草醯醋酸不能穿過粒線體膜，要轉成蘋果酸或天門冬胺酸才能出來。"},{"id":"114-2-3102-29","p":"114-2-3102","n":29,"q":"哺乳動物進行糖質新生反應時，利用丙酮酸羧化酶（pyruvate carboxylase）催化丙酮酸合成草醯醋酸（oxaloacetate），此酵素需要何種輔酵素參與？","o":["核黃素腺嘌呤二核苷酸（flavin adenine dinucleotide, FAD）","生物素（biotin）","硫胺素焦磷酸（thiamin pyrophosphate, TPP）","鈷胺素（cobalamin）"],"a":"B","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"丙酮酸羧化酶的輔酶","ex":"羧化酶以生物素作為 CO₂ 的攜帶者，丙酮酸羧化酶、乙醯輔酶 A 羧化酶、丙醯輔酶 A 羧化酶都需要生物素。"},{"id":"114-2-3102-30","p":"114-2-3102","n":30,"q":"人體於飲食攝取葡萄糖後的兩小時內，在各組織中的葡萄糖利用，下列何者錯誤？","o":["在腦部可被氧化而產生ATP","在紅血球可進入糖解作用","在脂肪組織可成為合成三酸甘油酯的原料","在肝臟優先進入脂肪酸合成途徑"],"a":"D","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"進食後葡萄糖的利用","ex":"進食後肝臟先把葡萄糖合成肝醣儲存，肝醣補滿後，多餘的葡萄糖才轉成脂肪酸。腦部氧化葡萄糖產生 ATP；紅血球只能靠糖解；脂肪細胞用葡萄糖產生的甘油－3－磷酸合成三酸甘油酯。"},{"id":"114-2-3102-31","p":"114-2-3102","n":31,"q":"有關脂肪酸進行氧化作用的敘述，下列何者正確？","o":["脂肪酸為高活化能分子，需換成較低活化能的fatty acyl-CoA始能進入粒線體","脂肪酸透過fatty acyl-CoA synthetase可轉換成fatty acyl-CoA，轉換過程需要ATP分子","fatty acyl-CoA經由carnitine acyltransferase和肉鹼（carnitine）結合能進入粒線體間膜進行氧化","carnitine acyltransferase為脂肪酸分解的速率關鍵酵素，會受到acetyl-CoA回饋抑制"],"a":"B","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"脂肪酸的活化與進入粒線體","ex":"脂肪酸在細胞質由醯基輔酶 A 合成酶活化成醯基輔酶 A，消耗 ATP（轉為 AMP 與焦磷酸）。醯基經肉鹼醯基轉移酶 I 接到肉鹼上進入粒線體「基質」；CPT-I 是速率決定步驟，受丙二醯輔酶 A 抑制，不是乙醯輔酶 A。"},{"id":"114-2-3102-32","p":"114-2-3102","n":32,"q":"有關人體合成及利用酮體（ketone bodies）的敘述，下列何者正確？","o":["肝臟細胞的細胞質為合成酮體的場所，所產生酮體再運送至肝外組織作能量來源","酮體合成材料是acetyl-CoA和malonyl-CoA，生成的中間產物為3-hydroxy-3-methylglutaryl-CoA（HMG-CoA）","人體產生的酮體包括acetone、acetoacetate、β-hydroxylmethylbutyrate","酮體運送至肝外組織後會分解為acetyl-CoA而進入檸檬酸循環"],"a":"D","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"酮體的合成與利用","ex":"酮體在肝臟粒線體由乙醯輔酶 A 經 HMG-CoA 合成，包括乙醯醋酸、β-羥丁酸與丙酮。肝外組織把乙醯醋酸活化成乙醯醋醯輔酶 A，再分解為兩個乙醯輔酶 A 進入檸檬酸循環。丙二醯輔酶 A 是脂肪酸合成的原料；β-羥基-β-甲基丁酸（HMB）是白胺酸的代謝物，不是酮體。"},{"id":"114-2-3102-33","p":"114-2-3102","n":33,"q":"關於脂聯素（adiponectin）的敘述，下列何者正確？","o":["是肝臟製造而儲存於脂肪組織的一種荷爾蒙","會在下視丘和其接受器結合後促進neuropeptide Y分泌而降低食慾","會增加骨骼肌細胞中脂肪酸的β-oxidation而促進能量利用","和脂肪含量具相關性，在肥胖者血液中的脂聯素濃度偏高"],"a":"C","c":"生物化學（二）","c2":"人體生理學與實驗","ch":"生物能量與整合代謝","ch2":"內分泌與生殖","t":"脂聯素","ex":"脂聯素由脂肪細胞分泌，可活化 AMPK、增加肌肉的脂肪酸氧化與胰島素敏感性。它和體脂肪呈負相關，肥胖者血中濃度反而偏低。"},{"id":"114-2-3102-34","p":"114-2-3102","n":34,"q":"參與脂質代謝途徑的維生素，下列敘述何者正確？","o":["泛酸以coenzyme A之輔酶型式參與，於細胞質中大量使用於脂肪酸氫化反應途徑","維生素B12以methylcobalamin之輔酶型式，參與奇數碳脂肪酸代謝成succinyl-CoA","propionyl-CoA carboxylase帶有生物素的酵素，參與奇數碳脂肪酸代謝途徑","acyl-CoA dehydrogenase需維生素B2以FMN型式，參與脂肪酸之氧化作用"],"a":"C","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"參與脂質代謝的維生素","ex":"奇數碳脂肪酸最後產生丙醯輔酶 A，經含生物素的丙醯輔酶 A 羧化酶轉成甲基丙二醯輔酶 A，再由需要腺苷鈷胺素（adenosylcobalamin，不是 methylcobalamin）的變位酶轉成琥珀醯輔酶 A。醯基輔酶 A 去氫酶用的是 FAD，不是 FMN。"},{"id":"114-2-3102-35","p":"114-2-3102","n":35,"q":"關於脂肪酸合成的敘述，下列何者錯誤？","o":["脂肪酸合成酶（fatty acid synthase）為一複合體，其中含有acyl carrier protein（ACP）","合成時一次以兩個碳為單位進行延長，每增加兩個碳消耗兩分子NADPH","合成過程的活化位置ACP的輔酶為葉酸","乙醯輔酶A（acetyl-CoA）合成malonyl-CoA過程，需要生物素作為輔酶"],"a":"C","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"脂肪酸合成","ex":"ACP 的活化位置是 4′-磷酸泛醯巰乙胺，來自泛酸，不是葉酸。脂肪酸合成酶每延長兩個碳消耗 2 個 NADPH；乙醯輔酶 A 羧化成丙二醯輔酶 A 需要生物素。"},{"id":"114-2-3102-36","p":"114-2-3102","n":36,"q":"有關胺基酸代謝的敘述，下列何者錯誤？","o":["arginine代謝為glutamate的過程中會解離出urea","glutamine和histidine皆可代謝為α-ketoglutamate","Maple syrup urine disease是因為攝入太多支鏈胺基酸所致","acetoacetate是tryptophan的代謝終產物之一"],"a":"C","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"胺基酸代謝與楓糖尿症","ex":"楓糖尿症是先天缺乏支鏈 α-酮酸去氫酶，支鏈胺基酸（白胺酸、異白胺酸、纈胺酸）與其酮酸無法分解而堆積，不是攝取太多所致。"},{"id":"114-2-3102-37","p":"114-2-3102","n":37,"q":"下列代謝反應何者不需要pyridoxal phosphate作為輔酶？","o":["glutamate生成α-ketoglutarate","histidine生成histamine","glutamate生成γ-aminobutyrate","arginine生成nitric acid"],"a":"D","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"需要 PLP 的反應","ex":"轉胺、脫羧都需要 PLP：麩胺酸轉胺成 α-酮戊二酸、組胺酸脫羧成組織胺、麩胺酸脫羧成 GABA。精胺酸生成一氧化氮由一氧化氮合成酶催化，需要 NADPH、BH₄、FAD、FMN 等，不需 PLP。D 的 nitric acid 應是 nitric oxide。"},{"id":"114-2-3102-38","p":"114-2-3102","n":38,"q":"有關3-hydroxy-3-methylglutaryl-CoA（HMG-CoA）及HMG-CoA lyase的敘述，下列何者錯誤？","o":["leucine降解生成的中間產物被HMG-CoA lyase作用後可產生酮體","HMG-CoA參與膽固醇的生合成","HMG-CoA參與輔酶Q10的生合成","HMG-CoA lyase在細胞質內進行支鏈胺基酸的降解作用"],"a":"D","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"HMG-CoA 的去向","ex":"HMG-CoA 在細胞質中經 HMG-CoA 還原酶走向膽固醇與輔酶 Q 等類異戊二烯合成；在粒線體中經 HMG-CoA 裂解酶產生乙醯醋酸（酮體）。白胺酸分解也會產生 HMG-CoA。HMG-CoA 裂解酶位於粒線體，不是細胞質。"},{"id":"114-2-3102-39","p":"114-2-3102","n":39,"q":"Trypsinogen是如何轉變成活化型式的trypsin？","o":["與鈣離子結合後活化","形成trypsinogen dimers後活化","經enteropeptidase作用後活化","經protein kinase磷酸化後活化"],"a":"C","c":"生物化學（二）","c2":"人體生理學與實驗","ch":"酵素","ch2":"消化","t":"胰蛋白酶原的活化","ex":"胰蛋白酶原進入十二指腸後，由腸黏膜分泌的腸激酶（enteropeptidase）切下一段胜肽而活化成胰蛋白酶，再由胰蛋白酶活化其他蛋白酶原。這是酵素原經部分水解而活化的例子。"},{"id":"114-2-3102-40","p":"114-2-3102","n":40,"q":"在pH 7.0溶液中，下列何種胺基酸帶負電荷？","o":["離胺酸（lysine）","組胺酸（histidine）","精胺酸（arginine）","天門冬胺酸（aspartate）"],"a":"D","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"胺基酸在中性下的電荷","ex":"天門冬胺酸側鏈羧基 pKa 約 3.9，在 pH 7 時解離成 COO⁻，帶負電。離胺酸、精胺酸側鏈帶正電；組胺酸 pKa 約 6，pH 7 時大多不帶電。"},{"id":"114-2-3102-41","p":"114-2-3102","n":41,"q":"DNA甲基化（DNA methylation）調控基因轉錄時，甲基化是作用在那個核苷？","o":["adenylate","cytidylate","guanylate","thymidine"],"a":"B","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"DNA 甲基化","ex":"哺乳類的 DNA 甲基化發生在 CpG 序列中胞嘧啶（cytidylate）的第 5 個碳，形成 5-甲基胞嘧啶，啟動子甲基化通常抑制基因轉錄。"},{"id":"114-2-3102-42","p":"114-2-3102","n":42,"q":"有關遺傳密碼（genetic code）特性的敘述，下列何者正確？","o":["譯碼規則（coding）中，多個密碼子（codon）轉譯相同胺基酸的特性，稱之為退化性（degeneracy）","譯碼規則在不同生物體轉譯成胺基酸時，皆有不同規則，即表示無普遍廣泛性（non-universal）","同一個密碼（code）可重複在不同密碼子（codon）轉譯成不同胺基酸，呈現所謂的重疊（overlapping）譯碼規則","正確表示遺傳密碼訊號序列時，不同密碼子之間需有位點區隔（punctuated）"],"a":"A","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"遺傳密碼的特性","ex":"一種胺基酸可由多個密碼子編碼，稱為退化性（簡併性）。遺傳密碼幾乎所有生物通用；不重疊；密碼子之間沒有間隔（連續讀取）。"},{"id":"114-2-3102-43","p":"114-2-3102","n":43,"q":"下列何者不是提供嘌呤（purine）生合成環狀結構中氮的來源？","o":["丙胺酸（alanine）","天門冬胺酸（aspartate）","麩醯胺酸（glutamine）","甘胺酸（glycine）"],"a":"A","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"嘌呤環氮原子的來源","ex":"嘌呤環的 4 個氮來自麩醯胺酸（2 個）、甘胺酸（1 個）、天門冬胺酸（1 個）。丙胺酸不參與。"},{"id":"114-2-3102-44","p":"114-2-3102","n":44,"q":"有關真核生物轉譯作用（translation）的敘述，下列何者正確？","o":["真核生物與原核生物轉譯作用之起始胺基酸皆為甲醯甲硫胺酸（formyl methionine）","轉譯作用中的延伸過程（elongation），是將新加入之單一胺基酸加至含多個胺基酸之多胜肽（polypeptide）上","轉譯作用中的延伸過程（elongation），核糖體會沿著mRNA移動，每次移動距離為1組密碼子（codon）","轉譯作用中的終止過程遇到終止密碼子（stop codon）後，需要供給ATP協助水解已合成之多胜肽（polypeptide）"],"a":"C","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"真核生物的轉譯","ex":"延伸時核糖體每次沿 mRNA 移動一個密碼子（3 個核苷酸）。真核生物的起始胺基酸是甲硫胺酸，甲醯甲硫胺酸是原核生物；延伸是把整條胜肽鏈轉接到新進入的胺基醯 tRNA 上；終止時的釋放與水解需要 GTP。"},{"id":"114-2-3102-45","p":"114-2-3102","n":45,"q":"G蛋白（G protein）需依序與下列何者結合活化後，進行訊息傳遞？","o":["GTP；adenylate cyclase","GTP；GTPase","GDP；adenylate cyclase","GDP；GTPase"],"a":"A","c":"生物化學（二）","c2":"人體生理學與實驗","ch":"生物能量與整合代謝","ch2":"內分泌與生殖","t":"G 蛋白的訊息傳遞","ex":"受體被激素活化後，G 蛋白的 α 次單元釋放 GDP、結合 GTP 而活化，再去活化下游的腺苷酸環化酶產生 cAMP。α 次單元本身的 GTPase 活性把 GTP 水解成 GDP 後就停止作用。"},{"id":"114-2-3102-46","p":"114-2-3102","n":46,"q":"Homocysteine經cystathionine synthase催化產生cystathionine時，需要下列何者作為輔酶？","o":["pyridoxal phosphate（PLP）","nicotinamide adenine dinucleotide（NAD）","thiamin pyrophosphate（TPP）","flavin adenine dinucleotide（FAD）"],"a":"A","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"胱硫醚合成酶的輔酶","ex":"同半胱胺酸與絲胺酸經胱硫醚 β-合成酶縮合成胱硫醚，此酵素需要 PLP（維生素 B6）。所以 B6 缺乏也會使同半胱胺酸升高。"},{"id":"114-2-3102-47","p":"114-2-3102","n":47,"q":"下列何種酵素可用來評估vitamin B 1的營養狀況？","o":["kynureninase","formiminotransferase","transketolase","glutathione reductase"],"a":"C","c":"生物化學（二）","c2":"營養評估","ch":"維生素與輔酶","ch2":"生化評估","t":"評估維生素 B1 營養狀況的酵素","ex":"轉酮醇酶（transketolase）以 TPP 為輔酶，測紅血球轉酮醇酶活性及加入 TPP 後的活化程度，可評估 B1 狀況。犬尿胺酸酶評估 B6；亞胺甲基轉移酶（FIGLU）評估葉酸；穀胱甘肽還原酶評估 B2。"},{"id":"114-2-3102-48","p":"114-2-3102","n":48,"q":"在酵素動力學中，非競爭性抑制劑（noncompetitive inhibitor）對酵素反應的Vmax與Km影響為何？","o":["Vmax與Km都下降","Vmax與Km都上升","Vmax下降；Km不變","Vmax不變；Km上升"],"a":"C","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"非競爭性抑制","ex":"非競爭性抑制劑結合在活性位以外，不影響受質結合，所以 Km 不變；但降低了有作用的酵素量，Vmax 下降。競爭性抑制是 Km 上升、Vmax 不變。"},{"id":"114-2-3102-49","p":"114-2-3102","n":49,"q":"下列何種胺基酸不能做為酵素執行酸／鹼催化（acid/base catalysis）時的活性中心（active site）？","o":["組胺酸（histidine）","甲硫胺酸（methionine）","天門冬胺酸（aspartic acid）","離胺酸（lysine）"],"a":"B","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"酸鹼催化的胺基酸","ex":"酸鹼催化需要能接受或給出質子的側鏈，例如組胺酸（咪唑基）、天門冬胺酸與麩胺酸（羧基）、離胺酸（胺基）、半胱胺酸、酪胺酸。甲硫胺酸側鏈是硫醚，不易解離，不能做酸鹼催化。"},{"id":"114-2-3102-50","p":"114-2-3102","n":50,"q":"下列那些維生素參與丙酮酸去氫酶（pyruvate dehydrogenase）催化的反應？①B1　②B2　③niacin　④folate　⑤pantothenate　⑥B6　⑦lipoic acid","o":["①③④⑤⑥","②③⑤⑥⑦","①②④⑤⑦","①②③⑤⑦"],"a":"D","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"丙酮酸去氫酶複合體的輔酶","ex":"丙酮酸去氫酶複合體需要 5 種輔因子：TPP（B1）、硫辛酸、輔酶 A（泛酸）、FAD（B2）、NAD⁺（菸鹼酸）。"},{"id":"114-2-4102-1","p":"114-2-4102","n":1,"q":"下列何者屬於可溶性纖維（soluble fiber）？","o":["纖維素（cellulose）","半纖維素（hemicellulose）","木質素（lignin）","果膠（pectin）"],"a":"D","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"可溶性與不可溶性纖維","ex":"果膠、植物膠、β-葡聚醣、黏質屬於可溶性纖維，可延緩胃排空、降低血膽固醇。纖維素、木質素與大部分半纖維素屬於不可溶性纖維，主要增加糞便體積。"},{"id":"114-2-4102-2","p":"114-2-4102","n":2,"q":"一杯標準份量（standard drink）酒類是指提供約多少量酒精？","o":["7公克酒精","14公克酒精","21公克酒精","28公克酒精"],"a":"B","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"標準杯的酒精量","ex":"國際上常用的一標準杯（standard drink）約含 14 公克酒精，例如約 350 毫升啤酒、150 毫升葡萄酒或 45 毫升烈酒。我國衛福部的「一份酒精」則以 10 公克計，兩者要分清楚。"},{"id":"114-2-4102-3","p":"114-2-4102","n":3,"q":"ㄧ般標示於烈酒上的強度標準（proof）與酒精百分比，其中酒精含量如何換算？","o":["1 proof＝0.5％酒精","1 proof＝1％酒精","1 proof＝2％酒精","1 proof＝4％酒精"],"a":"A","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"酒精強度 proof 的換算","ex":"美國的 proof 是酒精體積百分比的兩倍，所以 1 proof ＝ 0.5% 酒精；80 proof 的烈酒含 40% 酒精。"},{"id":"114-2-4102-4","p":"114-2-4102","n":4,"q":"下列由葡萄糖所構成之同元多醣（homopolysaccharides）中，何者對日常飲食所貢獻的熱量最多？","o":["amylose","amylopectin","glycogen","cellulose"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"膳食中主要的熱量來源","ex":"日常飲食的熱量主要來自穀類與根莖類的澱粉，澱粉中支鏈澱粉（amylopectin）約占 70～80%，比直鏈澱粉多。肝醣在食物中含量很少，纖維素人體無法消化。"},{"id":"114-2-4102-5","p":"114-2-4102","n":5,"q":"葡萄糖於小腸細胞的主要吸收方式為下列何者？","o":["被動擴散（passive diffusion）","依賴果糖的主動運輸（active transport with fructose）","促進性運輸（facilitated transport）","依賴鈉的主動運輸（active transport with sodium）"],"a":"D","c":"營養學","c2":"人體生理學與實驗","ch":"醣類","ch2":"消化","t":"葡萄糖的吸收方式","ex":"葡萄糖與半乳糖經小腸刷狀緣的 SGLT1 與鈉離子一起進入細胞，屬於依賴鈉的次級主動運輸；再經基底側膜的 GLUT2 進入血液。果糖則以 GLUT5 促進性擴散吸收。"},{"id":"114-2-4102-6","p":"114-2-4102","n":6,"q":"下列何者不是屬於糖醇（sugar alcohols）？","o":["乳糖醇（laclitol）","甘露醇（mannitol）","山梨醇（sorbitol）","木糖醇（xylitol）"],"a":"A","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"糖醇的種類","ex":"山梨醇、甘露醇、木糖醇都是單醣還原而成的糖醇。依標準答案，乳糖醇不算在內；但乳糖醇（lactitol）其實是乳糖還原而成的雙醣糖醇，題目把它拼成 laclitol。"},{"id":"114-2-4102-7","p":"114-2-4102","n":7,"q":"神經傳導物質血清素是由何種胺基酸合成而來？","o":["色胺酸（tryptophan）","組胺酸（histamine）","精胺酸（arginine）","離胺酸（lysine）"],"a":"A","c":"營養學","c2":"生物化學（二）","ch":"蛋白質","ch2":"胺基酸與蛋白質代謝","t":"血清素的前驅物","ex":"色胺酸經羥化與脫羧形成血清素（5-羥色胺），血清素在松果體可再轉成褪黑激素；色胺酸也可轉成菸鹼酸。"},{"id":"114-2-4102-8","p":"114-2-4102","n":8,"q":"下列何種組合最可能提供所有的必需胺基酸？","o":["麥片加小米粥","腰果加米飯","青豆加紅蘿蔔","綠豆稀飯"],"a":"D","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質的互補作用","ex":"穀類缺乏離胺酸、豆類缺乏甲硫胺酸，兩者一起吃可以互補。綠豆稀飯是米（穀類）加綠豆（豆類），最可能提供所有必需胺基酸。麥片加小米都是穀類；腰果是堅果；青豆加紅蘿蔔蛋白質都少。"},{"id":"114-2-4102-9","p":"114-2-4102","n":9,"q":"當身體無法分泌鹽酸（hydrochloric acid）時，下列何種消化酵素的功能較會受到影響？","o":["pepsin","transaminase","pancreatic proteases","intestinal peptidase"],"a":"A","c":"營養學","c2":"人體生理學與實驗","ch":"蛋白質","ch2":"消化","t":"胃酸與胃蛋白酶","ex":"胃蛋白酶原要在胃酸的酸性環境下才會活化成胃蛋白酶，且胃蛋白酶的最適 pH 約 2。沒有胃酸時，胃蛋白酶的功能最先受影響。"},{"id":"114-2-4102-10","p":"114-2-4102","n":10,"q":"下列何者不是長期缺乏蛋白質及熱量會產生的症狀？","o":["水腫及腹水","生長遲緩","基礎代謝率增加","脂肪細胞體積變小"],"a":"C","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質熱量營養不良的症狀","ex":"長期缺乏蛋白質與熱量時，身體為了節省能量，基礎代謝率會「下降」。水腫與腹水（低白蛋白）、生長遲緩、脂肪細胞變小都是常見表現。"},{"id":"114-2-4102-11","p":"114-2-4102","n":11,"q":"將胰凝乳蛋白酶原活化為胰凝乳蛋白酶的因子是：","o":["膽囊收縮素","腸胜肽酶","胃蛋白酶","胰蛋白酶"],"a":"D","c":"營養學","c2":"人體生理學與實驗","ch":"蛋白質","ch2":"消化","t":"胰臟蛋白酶原的活化","ex":"胰蛋白酶原先被腸胜肽酶（腸激酶）活化成胰蛋白酶，再由胰蛋白酶活化胰凝乳蛋白酶原、羧基胜肽酶原等其他蛋白酶原。"},{"id":"114-2-4102-12","p":"114-2-4102","n":12,"q":"大明為一健康的上班族，飲食正常、不愛運動、愛吃肉，每天蛋白質攝取量為建議量的兩倍，其體內會呈現何種氮平衡狀態？","o":["氮平衡","正氮平衡","負氮平衡","無法評估"],"a":"A","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"氮平衡","ex":"健康成人體重穩定時，多吃的蛋白質會被分解，氮從尿素排出，攝入氮等於排出氮，維持氮平衡。蛋白質吃得多並不會變成正氮平衡；正氮平衡出現在生長、懷孕、傷口恢復期。"},{"id":"114-2-4102-13","p":"114-2-4102","n":13,"q":"下列何者不是製造商用來取代脂肪的油脂替代物？","o":["starch derivatives","fiber","protein","alcohol"],"a":"D","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"脂肪替代物","ex":"脂肪替代物可分為以醣類為基礎（澱粉衍生物、纖維、膠類）、以蛋白質為基礎（微粒化蛋白）與以脂肪為基礎（如蔗糖聚酯）。酒精不是脂肪替代物。"},{"id":"114-2-4102-14","p":"114-2-4102","n":14,"q":"下列有關脂肪組織敘述，何者正確？","o":["肥胖者含有棕色脂肪量多於體重正常者","相較於白色脂肪組織，棕色脂肪組織較可增加胰島素敏感度","白色脂肪組織的uncoupling protein 1含量多於棕色脂肪組織","棕色脂肪組織的mitochondria含量少於白色脂肪組織"],"a":"B","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"棕色與白色脂肪","ex":"棕色脂肪粒線體多、含大量解偶聯蛋白 UCP1，可以產熱並增加葡萄糖與脂肪的利用，改善胰島素敏感度。肥胖者的棕色脂肪通常較少。"},{"id":"114-2-4102-15","p":"114-2-4102","n":15,"q":"下列有關HDL在人體內扮演的角色，何者錯誤？","o":["血液中的HDL大部分由肝臟和小腸製造","血液中的HDL可將膽固醇送至肝臟代謝","氧化的HDL會升高心血管疾病的風險","HDL膽固醇的建議標準值，女性高於男性"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"HDL 的功能","ex":"HDL 由肝臟與小腸製造，把周邊組織的膽固醇送回肝臟（逆向膽固醇運輸）；女性 HDL 建議值（＞50 mg/dL）高於男性（＞40 mg/dL）。依標準答案 C 錯；但氧化或功能失常的 HDL 會失去保護作用，有研究認為可能增加心血管風險。"},{"id":"114-2-4102-16","p":"114-2-4102","n":16,"q":"下列何種激素，會在脂肪抵達小腸時最先被分泌？","o":["膽汁","輔脂酶","胰脂肪酶","膽囊收縮素"],"a":"D","c":"營養學","c2":"人體生理學與實驗","ch":"脂質","ch2":"消化","t":"脂肪消化的激素調控","ex":"脂肪與胺基酸進入十二指腸時，腸道 I 細胞最先分泌膽囊收縮素（CCK），使膽囊收縮排出膽汁，並促進胰臟分泌脂肪酶。膽汁、輔脂酶、胰脂肪酶都不是激素。"},{"id":"114-2-4102-17","p":"114-2-4102","n":17,"q":"有關n-3多元不飽和脂肪酸（polyunsaturated fatty acids）的敘述，下列何者正確？","o":["植物油都不是n-3多元不飽和脂肪酸的良好來源","花生四烯酸（arachidonic acid）屬於n-3多元不飽和脂肪酸","生長於冷洋魚種的n-3多元不飽和脂肪酸含量較高","n-3多元不飽和脂肪酸與體內前列腺素的生合成無關"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"n-3 脂肪酸","ex":"冷水域的鮭魚、鯖魚、秋刀魚含較多 EPA 與 DHA。亞麻仁油、紫蘇油、芥花油也富含 n-3 的 α-次亞麻油酸；花生四烯酸是 n-6；EPA 是前列腺素 3 系列的前驅物。"},{"id":"114-2-4102-18","p":"114-2-4102","n":18,"q":"下列那種荷爾蒙由脂肪細胞分泌，且隨著體脂越高而分泌越多？","o":["瘦素（leptin）","脂聯素（adiponectin）","胰島素（insulin）","升糖素類似胜肽（GLP-1）"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"瘦素","ex":"瘦素由脂肪細胞分泌，體脂越多分泌越多，作用在下視丘抑制食慾、增加能量消耗。脂聯素也由脂肪細胞分泌，但肥胖者濃度反而較低。"},{"id":"114-2-4102-19","p":"114-2-4102","n":19,"q":"下列何者是調控食慾或飽足感最重要的部位？","o":["下視丘","松果體","延腦","小腦"],"a":"A","c":"營養學","c2":"人體生理學與實驗","ch":"能量代謝與體重","ch2":"內分泌與生殖","t":"食慾的調控中樞","ex":"下視丘有攝食中樞（外側）與飽食中樞（腹內側），弓狀核整合瘦素、胰島素、飢餓素等訊號，是調控食慾與飽足感最重要的部位。"},{"id":"114-2-4102-20","p":"114-2-4102","n":20,"q":"下列何者不是與調控食慾及能量恆定有關的gut hormone？","o":["peptide YY","glucagon-like peptide-1","cholecystokinin","endorphin"],"a":"D","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"調控食慾的腸道激素","ex":"PYY、GLP-1、CCK 都是腸道分泌、抑制食慾的激素；飢餓素則由胃分泌促進食慾。腦內啡（endorphin）是中樞神經的類鴉片胜肽，不是腸道激素。"},{"id":"114-2-4102-21","p":"114-2-4102","n":21,"q":"張先生每天的能量消耗約為2,200大卡，其中食物產熱效應（thermic effect of food；diet-induced thermogenesis）粗估約占多少大卡？","o":["220","440","550","1,100"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"食物產熱效應","ex":"食物產熱效應約占每日總能量消耗的 10%，2,200 × 10% ＝ 220 大卡。"},{"id":"114-2-4102-22","p":"114-2-4102","n":22,"q":"有關能量平衡的敘述，下列何者錯誤？","o":["成人攝取過多熱量時，多餘的熱量會儲存於脂肪組織","老年人體重增加的主要原因，是熱量攝取量增加","嬰幼兒時期需達到正的能量平衡，以維持正常生長","肥胖者減重時，應維持負的能量平衡，以降低體重"],"a":"B","c":"營養學","c2":"生命期營養","ch":"能量代謝與體重","ch2":"老年期","t":"能量平衡","ex":"老年人體重增加主要是因為瘦體組織減少、基礎代謝率下降，加上活動量減少，熱量消耗變少，而不是熱量攝取增加。"},{"id":"114-2-4102-23","p":"114-2-4102","n":23,"q":"為研擬膽鹼適當攝取量之科學依據時，攝食缺乏膽鹼的飲食最易造成那些組織器官損傷？","o":["肝臟與肌肉","腎臟與脾臟","小腸與胰臟","結腸與胃食道"],"a":"A","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"膽鹼缺乏的影響","ex":"訂定膽鹼足夠攝取量的依據是：缺乏膽鹼的飲食會造成脂肪肝、肝功能異常與肌肉損傷（血中肌酸激酶上升）。膽鹼是磷脂醯膽鹼與乙醯膽鹼的原料，參與脂蛋白的輸出。"},{"id":"114-2-4102-24","p":"114-2-4102","n":24,"q":"下列何種食物的泛酸（pantothenic acid）含量最豐富？","o":["牛奶（1杯）","葵花子（2盎司）","酪梨（1/2杯）","火雞肉（3盎司）"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"泛酸的食物來源","ex":"泛酸廣泛存在於食物中，以肝臟、蛋黃、全穀、豆類、堅果種子含量較高。依標準答案，2 盎司葵花子的泛酸最多。"},{"id":"114-2-4102-25","p":"114-2-4102","n":25,"q":"下列有關維生素B6之敘述，何者正確？","o":["維生素B6營養狀況的直接評估方法是測量血漿天門冬胺酸轉胺酶（aspartic aminotransferase）活性","維生素B6嚴重缺乏時可能會導致peripheral neuropathy及microcytic hypochromic anemia","維生素B6以磷酸吡哆醇（pyridoxine phosphate）型式擔任輔酶參與許多身體內的代謝反應","維生素B6代謝後主要會以吡哆酸（4-pyridoxic acid）型式儲存在體內"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 B6","ex":"B6 嚴重缺乏時會出現周邊神經病變、痙攣，以及小球性低色素貧血（血基質合成需要 PLP）。B6 的輔酶型式是磷酸吡哆醛（PLP），不是磷酸吡哆醇；4-吡哆酸是排出尿中的代謝物，不儲存；直接評估是測血漿 PLP，轉胺酶活性是間接（功能性）指標。"},{"id":"114-2-4102-26","p":"114-2-4102","n":26,"q":"若甲硫胺酸（methionine）濃度已足夠人體需求時，甲硫胺酸會促使同半胱胺酸（homocysteine）進行轉硫作用形成半胱胺酸（cysteine），此過程中需要下列何種維生素擔任輔酶？","o":["葉酸","維生素B12","維生素B6","維生素B2"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"維生素（水溶性）","ch2":"維生素與輔酶","t":"同半胱胺酸的轉硫作用","ex":"甲硫胺酸足夠時，同半胱胺酸走轉硫途徑：與絲胺酸經胱硫醚 β-合成酶形成胱硫醚，再由胱硫醚裂解酶產生半胱胺酸，兩步驟都需要 PLP（B6）。甲硫胺酸不足時則走再甲基化，需要葉酸與 B12。"},{"id":"114-2-4102-27","p":"114-2-4102","n":27,"q":"衛生福利部對成年人維生素C的每日膳食建議攝取量為多少毫克？","o":["60","100","150","200"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 的建議量","ex":"國人 DRIs 第八版成人維生素 C 的建議攝取量為每天 100 毫克；懷孕期增加 10 毫克、哺乳期增加 40 毫克。"},{"id":"114-2-4102-28","p":"114-2-4102","n":28,"q":"以下何種食物的Vitamin B 12含量最高？","o":["3盎司烤牛肉","1杯牛奶","1個雞蛋","3盎司牡蠣"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 B12 的食物來源","ex":"B12 只存在於動物性食物，以內臟與貝類最多。3 盎司牡蠣約含 B12 數十微克，遠高於牛肉、牛奶、雞蛋。"},{"id":"114-2-4102-29","p":"114-2-4102","n":29,"q":"依據國人膳食營養素參考攝取量修訂第八版（DRIs），有關維生素D參考攝取量的敘述，下列何者正確？","o":["制定了維生素D的Adequate Intakes","沒有制定維生素D上限攝取量","1～3歲幼兒參考攝取量大於0～12月嬰兒","孕婦的維生素D參考攝取量高於同年齡的成人"],"a":"A","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 D 的 DRIs","ex":"國人 DRIs 第八版的維生素 D 是足夠攝取量（AI）：0～50 歲 10 微克，51 歲以上 15 微克；懷孕與哺乳不另外增加；上限攝取量為嬰兒 25 微克、1 歲以上 50 微克。"},{"id":"114-2-4102-30","p":"114-2-4102","n":30,"q":"下列那些營養素，與維生素E的抗氧化功能密切相關？①vitamin A　②vitamin C　③selenium　④zinc","o":["①②","②③","①④","②④"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 E 的抗氧化夥伴","ex":"維生素 E 清除自由基後變成生育酚自由基，由維生素 C 還原再生；硒是穀胱甘肽過氧化酶的成分，分解過氧化物，可以節省維生素 E。"},{"id":"114-2-4102-31","p":"114-2-4102","n":31,"q":"有關胡蘿蔔素的敘述，下列何者錯誤？","o":["胡蘿蔔素是透過乳糜微粒來吸收","胡蘿蔔素主要儲存在肝臟","肝臟內的類胡蘿蔔素透過脂蛋白運送到周圍組織","非provitamin A的類胡蘿蔔素具有抗氧化能力"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"胡蘿蔔素的吸收與儲存","ex":"胡蘿蔔素經微膠粒吸收後隨乳糜微粒運送，到肝臟後由脂蛋白送往周邊組織。類胡蘿蔔素主要儲存在脂肪組織，不是肝臟；儲存在肝臟的是視網醇（維生素 A）。茄紅素、葉黃素雖不是維生素 A 前驅物，仍有抗氧化作用。"},{"id":"114-2-4102-32","p":"114-2-4102","n":32,"q":"下列有關維生素K的敘述，何者正確？","o":["動物性食品為飲食維生素K的主要來源","細胞所需要的維生素K是透過VLDL來運送","腸道菌叢可提供人體每日維生素K需要量的一半","維生素K的主要功能是調節血鈣濃度"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 K","ex":"維生素 K 隨乳糜微粒吸收，到肝臟後經 VLDL（及 LDL）送到周邊組織。主要來源是深綠色蔬菜（K1）；腸道菌合成的 K2 量有限，不到需要量的一半；主要功能是凝血因子與骨鈣素的 γ-羧化。"},{"id":"114-2-4102-33","p":"114-2-4102","n":33,"q":"下列何種電解質參與胃酸的製造？","o":["鈉離子","鉀離子","磷酸根離子","氯離子"],"a":"D","c":"營養學","c2":"人體生理學與實驗","ch":"礦物質（巨量）","ch2":"消化","t":"胃酸的製造","ex":"胃壁細胞以氫鉀幫浦把氫離子送入胃腔，同時氯離子經通道分泌出去，合成鹽酸。氯離子是胃酸的成分。"},{"id":"114-2-4102-34","p":"114-2-4102","n":34,"q":"下列何者為鉀缺乏的高危險群？","o":["以馬鈴薯為主食者","長期食用低鈉鹽","服用利尿劑的病患","經常食用雞精或肉湯者"],"a":"C","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鉀缺乏的高危險群","ex":"服用利尿劑（特別是噻嗪類與環利尿劑）會增加尿鉀流失，是低血鉀的高危險群。馬鈴薯、低鈉鹽（以氯化鉀取代）、雞精與肉湯都含有較多鉀。"},{"id":"114-2-4102-35","p":"114-2-4102","n":35,"q":"下列那一個族群對鈣的吸收率最高？","o":["停經後婦女","懷孕婦女","成年男性","運動員"],"a":"B","c":"營養學","c2":"生命期營養","ch":"礦物質（巨量）","ch2":"懷孕與哺乳期","t":"鈣吸收率","ex":"懷孕時活化維生素 D 增加，鈣吸收率可提高到 50% 以上，以供應胎兒骨骼需要。停經後婦女因雌激素減少，鈣吸收率下降。"},{"id":"114-2-4102-36","p":"114-2-4102","n":36,"q":"下列何種組織或器官與維持體內正常血鈣濃度最無關？","o":["腎臟","胰臟","小腸","骨骼"],"a":"B","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"維持血鈣恆定的器官","ex":"血鈣由副甲狀腺素、活化維生素 D、降鈣素調控，作用在骨骼（釋出或沉積）、腎臟（再吸收與活化維生素 D）、小腸（吸收）。胰臟和血鈣調控無直接關係。"},{"id":"114-2-4102-37","p":"114-2-4102","n":37,"q":"下列何者不是超氧化物岐化酶（superoxide dismutase, SOD）的成分？","o":["copper","iron","manganese","zinc"],"a":"B","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"超氧化物歧化酶的金屬","ex":"人體的 SOD 有細胞質的銅鋅 SOD 與粒線體的錳 SOD。含鐵的 SOD 存在於細菌與植物，不是人體 SOD 的成分。"},{"id":"114-2-4102-38","p":"114-2-4102","n":38,"q":"下列何種礦物質是穀胱甘肽過氧化酶（glutathione peroxidase）的成分之一？","o":["鉬","矽","硒","鋅"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"穀胱甘肽過氧化酶","ex":"穀胱甘肽過氧化酶含硒（以硒半胱胺酸的形式），把過氧化氫與脂質過氧化物還原為水與醇。鉬是黃嘌呤氧化酶、亞硫酸氧化酶的輔因子。"},{"id":"114-2-4102-39","p":"114-2-4102","n":39,"q":"Goitrogen會減少那一種礦物質的生物利用率（bioavailability）？","o":["碘","鋅","鐵","錳"],"a":"A","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"致甲狀腺腫物質","ex":"致甲狀腺腫素（goitrogen）會干擾甲狀腺攝取碘或合成甲狀腺素，降低碘的利用率，常見於十字花科蔬菜、樹薯、黃豆。"},{"id":"114-2-4102-40","p":"114-2-4102","n":40,"q":"根據國人膳食營養素參考攝取量修訂第八版（DRIs）的資料，成年女性鈣與磷的每日建議攝取量（recommended dietary allowances），分別為多少？","o":["鈣800 mg，磷800 mg","鈣800 mg，磷1,000 mg","鈣1,000 mg，磷800 mg","鈣1,000 mg，磷1,000 mg"],"a":"C","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鈣與磷的 DRIs","ex":"國人 DRIs 第八版成年人鈣的足夠攝取量為 1,000 毫克，磷為 800 毫克（男女相同）。題目稱為建議攝取量，嚴格說兩者都是足夠攝取量（AI）。"},{"id":"114-2-4102-41","p":"114-2-4102","n":41,"q":"下列有關磷的敘述，何者正確？","o":["成人對膳食磷的吸收率約有20％","活化的1,25(OH)₂維生素D會降低磷的吸收","人體內約有20％的磷是以PO₄³⁻的形式存在於細胞及細胞外液中","穀類與豆類中的磷主要是以植酸的形式存在，人體很容易吸收"],"a":"C","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"磷的吸收與分布","ex":"人體約 85% 的磷在骨骼與牙齒，其餘在軟組織與體液。成人膳食磷的吸收率約 55～70%；活化維生素 D 會增加
