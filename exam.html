":"114-2-4102-41","p":"114-2-4102","n":41,"q":"下列有關磷的敘述，何者正確？","o":["成人對膳食磷的吸收率約有20％","活化的1,25(OH)₂維生素D會降低磷的吸收","人體內約有20％的磷是以PO₄³⁻的形式存在於細胞及細胞外液中","穀類與豆類中的磷主要是以植酸的形式存在，人體很容易吸收"],"a":"C","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"磷的吸收與分布","ex":"人體約 85% 的磷在骨骼與牙齒，其餘在軟組織與體液。成人膳食磷的吸收率約 55～70%；活化維生素 D 會增加磷的吸收；穀類與豆類的植酸磷不易被人體吸收。依標準答案 C 正確。"},{"id":"114-2-4102-42","p":"114-2-4102","n":42,"q":"下列何種食物不含goitrogen？","o":["西瓜","綠花椰菜","高麗菜","黃豆"],"a":"A","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"含致甲狀腺腫物質的食物","ex":"十字花科蔬菜（高麗菜、花椰菜、芥菜）含硫配醣體，黃豆含異黃酮，都屬致甲狀腺腫素的來源。西瓜不含。"},{"id":"114-2-4102-43","p":"114-2-4102","n":43,"q":"下列何種營養素可以增強selenium的抗氧化功能？","o":["chromium","維生素C","維生素E","維生素A"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"硒與維生素 E 的協同作用","ex":"維生素 E 在細胞膜上阻斷脂質過氧化，硒依賴的穀胱甘肽過氧化酶把已形成的過氧化物分解，兩者互相節省，協同抗氧化。"},{"id":"114-2-4102-44","p":"114-2-4102","n":44,"q":"有關幼兒喝牛奶後引發脹氣、腹痛和腹瀉之原因，下列何者正確？","o":["乳酸中毒","麩質不耐症","乳糖不耐症","酮酸中毒"],"a":"C","c":"生命期營養","c2":"營養學","ch":"幼兒與學齡期","ch2":"醣類","t":"乳糖不耐症","ex":"幼兒斷奶後乳糖酶活性下降，喝牛奶後乳糖未被消化，進入大腸被細菌發酵產氣並吸水，造成脹氣、腹痛和腹瀉。"},{"id":"114-2-4102-45","p":"114-2-4102","n":45,"q":"有關青少年長期吃全素最易缺乏的維生素，下列何者正確？","o":["葉酸","維生素B2","維生素B6","維生素B12"],"a":"D","c":"生命期營養","c2":"營養學","ch":"青春期","ch2":"維生素（水溶性）","t":"全素者易缺乏的維生素","ex":"維生素 B12 只存在於動物性食品，全素者長期不補充最容易缺乏，可能出現巨球性貧血與神經症狀。"},{"id":"114-2-4102-46","p":"114-2-4102","n":46,"q":"有關老化造成的變化，下列敘述何者正確？","o":["骨量不變","瘦體組織不變","體脂肪百分比增加","血壓降低"],"a":"C","c":"生命期營養","c2":"","ch":"老年期","ch2":"","t":"老化的身體組成變化","ex":"老化時骨量與瘦體組織減少、體脂肪百分比增加，血壓通常上升。"},{"id":"114-2-4102-47","p":"114-2-4102","n":47,"q":"下列何種組織或器官是在懷孕時的胚胎發育過程中最早開始發育？","o":["心臟","眼睛","外生殖器","中樞神經系統"],"a":"D","c":"生命期營養","c2":"","ch":"懷孕與哺乳期","ch2":"","t":"胚胎器官的發育順序","ex":"神經管在受孕後第 3～4 週形成，中樞神經系統最早開始發育，所以孕前與孕早期要補充葉酸預防神經管缺陷。心臟稍後在第 3 週末開始跳動。"},{"id":"114-2-4102-48","p":"114-2-4102","n":48,"q":"懷孕第一期及第二期時不建議增加，但至懷孕第三期時建議增加何種營養素的攝取？","o":["蛋白質、鈣","維生素D、磷","維生素A、鐵","維生素B1、鎂"],"a":"C","c":"生命期營養","c2":"營養學","ch":"懷孕與哺乳期","ch2":"維生素（脂溶性）","t":"懷孕第三期增加的營養素","ex":"國人 DRIs 第八版懷孕第三期維生素 A 增加 100 微克 RE、鐵增加 30 毫克（第一、二期不增加）。蛋白質第二期起增加；鈣、磷、維生素 D 懷孕各期都不增加。"},{"id":"114-2-4102-49","p":"114-2-4102","n":49,"q":"根據國人膳食營養素參考攝取量修訂第八版（DRIs），51歲以上的成年人維生素D建議攝取量為多少？","o":["5微克","5毫克","15微克","15毫克"],"a":"C","c":"營養學","c2":"生命期營養","ch":"維生素（脂溶性）","ch2":"老年期","t":"51 歲以上的維生素 D 攝取量","ex":"國人 DRIs 第八版 51 歲以上維生素 D 的足夠攝取量為 15 微克（600 IU），高於 50 歲以下的 10 微克。"},{"id":"114-2-4102-50","p":"114-2-4102","n":50,"q":"有關多酚物質（polyphenols）的敘述，下列何者錯誤？","o":["包含許多種類，其中flavonoid占最大的比例","綠茶或紅茶內的主要活性組成分，皆屬於多酚類","其具有降低心血管疾病及癌症發生的作用，這可能與其抗氧化及抗發炎活性有關","在食物內主要以游離的形式存在，可在胃腸道立即被有效的吸收"],"a":"D","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"多酚類","ex":"多酚種類很多，類黃酮占最大部分；茶的兒茶素、茶黃素都屬多酚，有抗氧化與抗發炎作用。食物中的多酚大多以醣苷或聚合物形式存在，要經腸道菌分解，吸收率低。"},{"id":"114-2-5102-1","p":"114-2-5102","n":1,"q":"依據第八版國人膳食營養素參考攝取量（Dietary Reference Intakes, DRIs），有關碘的建議何者正確？","o":["成年男性的RDA比同年齡層女性高，但比女性懷孕期及哺乳期低","哺乳期的RDA為200 μg/d","懷孕期的RDA為225 μg/d","懷孕期EAR比哺乳期高"],"a":"C","c":"公共衛生營養學","c2":"營養學","ch":"飲食指標與營養標示","ch2":"礦物質（微量）","t":"碘的 DRIs","ex":"國人 DRIs 第八版碘的建議量：成人男女都是 150 微克，懷孕期增加 75 微克（225 微克），哺乳期增加 100 微克（250 微克）。所以男女相同、哺乳期需要量高於懷孕期。"},{"id":"114-2-5102-2","p":"114-2-5102","n":2,"q":"下列有關每日飲食指南的規劃原則與目標，何者錯誤？","o":["將降低心臟血管代謝疾病及癌症風險的飲食原則列入考量","以預防營養素缺乏為目標，建議營養素攝取量須達97.5％ DRIs以上","以實證營養學的原則，試算多種飲食組成，最後提出適合多數國人的飲食建議","三大營養素占總熱量比例之範圍為：蛋白質10～20％、脂質20～30％、醣類50～60％"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"每日飲食指南的規劃原則","ex":"每日飲食指南以 DRIs 為基礎，目標是營養素攝取量達到 DRIs 的 100%（不是 97.5%），並把降低慢性病風險列入考量。97.5% 是 RDA 能滿足的人群比例，題目把兩者混在一起。"},{"id":"114-2-5102-3","p":"114-2-5102","n":3,"q":"下列何者為國民飲食指標對國人身體活動的建議量？","o":["每天至少60分鐘的中等費力身體活動","每天至少30分鐘的中等費力身體活動","每週累積至少150分鐘的中等費力身體活動","每週累積至少75分鐘的中等費力身體活動"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"身體活動的建議量","ex":"國民飲食指標建議成人每週累積至少 150 分鐘中等費力身體活動（例如每週 5 天、每天 30 分鐘），或 75 分鐘的費力身體活動。"},{"id":"114-2-5102-4","p":"114-2-5102","n":4,"q":"下列有關國民飲食指標中對飲食的敘述，何者錯誤？","o":["建議選用加碘鹽","若飲酒，每日不宜超過2杯（每杯酒精10公克）","每日飲食中「添加糖」的攝取量，不宜超過總熱量的10％","每日鈉的攝取量，應限制在2,400毫克以下，包括加工品、食物本身與調味料所含的鈉"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"國民飲食指標的內容","ex":"國民飲食指標建議：若飲酒，男性每天不宜超過 2 杯，女性不宜超過 1 杯（每杯 10 公克酒精）。B 沒有區分性別所以錯。其餘：選用加碘鹽、添加糖低於總熱量 10%、鈉 2,400 毫克以下。"},{"id":"114-2-5102-5","p":"114-2-5102","n":5,"q":"國人膳食營養素參考攝取量Dietary Reference Intakes（DRIs）中，對於成年人的建議量下列何項營養素為AI（Adequate Intakes）？","o":["鈣","鎂","葉酸","維生素C"],"a":"A","c":"公共衛生營養學","c2":"營養學","ch":"飲食指標與營養標示","ch2":"礦物質（巨量）","t":"DRIs 中的 AI 項目","ex":"國人 DRIs 第八版中，鈣、磷、氟、維生素 D、維生素 K、泛酸、生物素、膽鹼等是足夠攝取量（AI）；鎂、葉酸、維生素 C 有建議攝取量（RDA）。"},{"id":"114-2-5102-6","p":"114-2-5102","n":6,"q":"食品中何種成份可以列在營養標示中？","o":["糖醇","葡萄糖胺","膠原蛋白","比菲德士菌"],"a":"A","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"營養標示可列的成分","ex":"包裝食品營養標示可以自願標示糖醇、膳食纖維、反式脂肪等營養成分。葡萄糖胺、膠原蛋白、益生菌不是營養素，不能列在營養標示表格中，只能另外標示。"},{"id":"114-2-5102-7","p":"114-2-5102","n":7,"q":"臺灣的母乳庫之母乳優先使用對象，下列何者錯誤？","o":["低出生體重嬰兒（＜2,500 g）","經醫生評估需要之早產兒","經醫生評估手術過後重症嬰兒","母親因本身疾病或服藥而無法親自哺乳者"],"a":"A","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"母乳庫的優先使用對象","ex":"母乳庫優先提供給經醫師評估需要的早產兒、極低出生體重兒（＜1,500 公克）、術後或重症嬰兒、腸道疾病嬰兒等。一般的低出生體重兒（＜2,500 公克）不在優先之列。"},{"id":"114-2-5102-8","p":"114-2-5102","n":8,"q":"亞洲肌少症共識會（Asian Working Group for Sarcopenia, AWGS）2019年更新肌少症診斷，長者可採用自我檢測的SARC-F問卷進行篩檢。關於SARC-F的評估項目，下列何者錯誤？","o":["肌力（strength）","步行（assistance in walking）","食慾（appetite）","登階（climb stairs）"],"a":"C","c":"公共衛生營養學","c2":"營養評估","ch":"生命期與特殊族群政策","ch2":"臨床評估與篩檢工具","t":"SARC-F 問卷","ex":"SARC-F 的 5 個項目是：肌力（Strength）、行走輔助（Assistance in walking）、起身（Rise from a chair）、登階（Climb stairs）、跌倒（Falls）。沒有食慾。"},{"id":"114-2-5102-9","p":"114-2-5102","n":9,"q":"2020世界衛生大會（WHA）提出因應高齡化社會的整合性照護（Integrated Care for Older People, ICOPE），並以推廣至臺灣社區。下列ICOPE評估項目，何者錯誤？","o":["聽力","牙齒數量","體重突然降低","認知"],"a":"B","c":"公共衛生營養學","c2":"營養評估","ch":"生命期與特殊族群政策","ch2":"臨床評估與篩檢工具","t":"ICOPE 的評估項目","ex":"ICOPE 評估 6 項內在能力：認知、行動、營養（體重減輕、食慾）、視力、聽力、憂鬱。牙齒數量不是評估項目。"},{"id":"114-2-5102-10","p":"114-2-5102","n":10,"q":"為了協助民眾落實健康生活型態，政府於何時開始設立「社區營養推廣中心」，由營養師走入社區提供專業服務？","o":["民國105年","民國107年","民國109年","民國103年"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社區營養推廣中心","ex":"國民健康署自民國 107 年起補助各縣市設立社區營養推廣中心，由營養師進入社區提供營養教育與諮詢，特別是長者營養服務。"},{"id":"114-2-5102-11","p":"114-2-5102","n":11,"q":"目前國內推動學校午餐之具體做法，下列何者錯誤？","o":["推動學校午餐全面使用國產可溯源食材","實施校園午餐食材登錄","推動學校午餐使用三章一Q標章（示）食材","全面推動學校中央廚房計畫，供餐鄰近學校"],"a":"D","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"學校午餐的政策","ex":"學校午餐的具體作法包括推動國產可溯源食材、校園食材登錄平臺、三章一Q。中央廚房並沒有全面推動；學校可依規模選擇自設廚房、公辦公營或委外，D 錯。"},{"id":"114-2-5102-12","p":"114-2-5102","n":12,"q":"原住民申請長照居家營養服務年齡下限為：","o":["65歲","60歲","55歲","50歲"],"a":"C","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"長照服務的年齡","ex":"長照 2.0 的服務對象包括 65 歲以上失能長者、55 歲以上失能原住民、50 歲以上失智者，以及失能的身心障礙者。"},{"id":"114-2-5102-13","p":"114-2-5102","n":13,"q":"依食品安全衛生管理法第28條第3項，所訂之不適合兒童長期食用之食品廣告及促銷規範，下列何者正確？","o":["購買炸雞、薯條兒童餐可以贈送炭治郎公仔","晚間6點在兒童頻道刊播廣告，可處新臺幣4萬元至400萬元罰鍰","晚間8點以後就可以在兒童頻道刊播廣告，不會受罰","洋芋片的廣告若以鮮奶配洋芋片當早餐，可推廣兒童多喝牛奶，就符合規範"],"a":"B","c":"公共衛生營養學","c2":"食品衛生與安全","ch":"營養政策與法規","ch2":"食品安全衛生法規","t":"不適合兒童長期食用之食品廣告及促銷","ex":"規範規定：每天 17 點到 21 點不得在兒童頻道播放不適合兒童長期食用食品的廣告；不得用玩具等贈品促銷；廣告不得以健康形象誤導。違反者依食安法處新臺幣 4 萬至 400 萬元罰鍰。"},{"id":"114-2-5102-14","p":"114-2-5102","n":14,"q":"下列何者不符合國民中小學校園一份飲品及點心食品之販售範圍？","o":["熱量應在250大卡以下","鈉含量應在400毫克以下","飽和脂肪所提供之熱量應在10%以下","糖個別所占之熱量不得超過總熱量之10%"],"a":"D","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"校園飲品與點心販售範圍","ex":"校園販售的一份點心：熱量 250 大卡以下、脂肪熱量 30% 以下、飽和脂肪熱量 10% 以下、添加糖熱量 10% 以下、鈉 400 毫克以下。D 把限制說成「糖個別」所占熱量，和規定的寫法不同，依標準答案 D 不符合。"},{"id":"114-2-5102-15","p":"114-2-5102","n":15,"q":"學校應加強辦理健康促進及建立健康生活行為等活動，其法源依據為何？","o":["學校餐廳廚房員生消費合作社衛生管理辦法","發展與改進學校午餐計畫","學校衛生法","營養師法"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"學校健康促進的法源","ex":"學校衛生法規定學校應加強辦理健康促進與建立健康生活行為等活動。"},{"id":"114-2-5102-16","p":"114-2-5102","n":16,"q":"有關主觀整體營養評估（Subjective Global Assessment, SGA）之敘述何者正確？","o":["一般照顧者即可使用","評估後以量表得分評估營養狀況","以病史記錄與身體臨床檢查為評估項目","適用於早期偵測評估工具"],"a":"C","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"主觀整體營養評估（SGA）","ex":"SGA 由受過訓練的醫療人員執行，評估項目是病史（體重變化、飲食攝取、腸胃症狀、功能、疾病）與身體檢查（皮下脂肪、肌肉耗損、水腫），最後主觀分為 A、B、C 三級，不計分。"},{"id":"114-2-5102-17","p":"114-2-5102","n":17,"q":"有關膳食調查之敘述，下列何者錯誤？","o":["肥胖者使用24小時回憶法，易傾向低估","使用24小時回憶法，健康的食物易傾向高估","飲食記錄法常會高估或出現遺漏","估計式飲食記錄法常使用家用量器進行記錄"],"a":"C","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"膳食調查的誤差","ex":"飲食記錄法常因受試者改變飲食或遺漏記錄而「低估」攝取量，不會高估。24 小時回憶法則容易低估肥胖者的攝取、高估健康食物。"},{"id":"114-2-5102-18","p":"114-2-5102","n":18,"q":"關於Histidine loading test係用以評估下列何種維生素之狀況？","o":["Vitamin B6","Vitamin B12","Folacin","Biotin"],"a":"C","c":"營養評估","c2":"營養學","ch":"生化評估","ch2":"維生素（水溶性）","t":"組胺酸負荷試驗","ex":"葉酸是組胺酸代謝中亞胺甲基轉移酶的輔酶。給予組胺酸後若尿中 FIGLU（亞胺甲基麩胺酸）增加，表示葉酸（或 B12）不足。"},{"id":"114-2-5102-19","p":"114-2-5102","n":19,"q":"Beriberi與下列何種營養素缺乏有關？","o":["Vitamin B1","Vitamin B2","Vitamin B3","Vitamin B12"],"a":"A","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"維生素（水溶性）","t":"腳氣病","ex":"腳氣病（beriberi）是維生素 B1（硫胺）缺乏，有乾性（神經病變）與濕性（心臟衰竭、水腫）兩型。"},{"id":"114-2-5102-20","p":"114-2-5102","n":20,"q":"有關營養素缺乏與皮膚異常之敘述，下列何者正確？","o":["必需脂肪酸缺乏與異位性皮膚炎有關","維生素D缺乏與水腫有關","鋅缺乏與紫斑症有關","維生素K缺乏與剝落式皮膚炎有關"],"a":"A","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"脂質","t":"營養缺乏的皮膚症狀","ex":"必需脂肪酸缺乏會造成皮膚乾燥、脫屑，與異位性皮膚炎有關。維生素 K 缺乏是紫斑與出血；鋅缺乏是皮膚炎與傷口癒合差；水腫與蛋白質或 B1 缺乏有關。"},{"id":"114-2-5102-21","p":"114-2-5102","n":21,"q":"關於兒童與青少年肥胖定義，是以BMI高於同年齡層多少百分位來判別為過重的切點？","o":["75","85","95","99"],"a":"B","c":"營養評估","c2":"生命期營養","ch":"體位評估","ch2":"幼兒與學齡期","t":"兒童過重與肥胖的切點","ex":"兒童與青少年以同年齡、同性別 BMI 的百分位判斷：第 85 百分位以上為過重，第 95 百分位以上為肥胖。"},{"id":"114-2-5102-22","p":"114-2-5102","n":22,"q":"評估7歲兒童生長狀況，下列何者正確？","o":["利用「兒童與青少年生長身體質量指數建議值」可了解生長趨勢","利用「兒童與青少年生長身體質量指數建議值」可評估體位狀況","利用「兒童生長曲線百分位圖」可了解飲食營養攝取狀況","利用「兒童生長曲線百分位圖」可了解體適能狀況"],"a":"B","c":"營養評估","c2":"生命期營養","ch":"體位評估","ch2":"幼兒與學齡期","t":"兒童生長的評估工具","ex":"兒童與青少年 BMI 建議值是評估當下體位（過輕、正常、過重、肥胖）。生長曲線百分位圖要多次測量才能看出生長趨勢；兩者都無法直接了解飲食攝取或體適能。"},{"id":"114-2-5102-23","p":"114-2-5102","n":23,"q":"下列那些飲食評估方法屬於個人短期飲食調查？①家戶盤存法　②24小時飲食回憶法　③食物攝取頻率法　④飲食記錄法","o":["僅②④","僅①②④","僅①③④","①②③④"],"a":"A","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"個人短期飲食調查","ex":"24 小時回憶法與飲食記錄法是調查個人短期攝取。家戶盤存法是調查家庭；食物頻率問卷評估長期飲食型態。"},{"id":"114-2-5102-24","p":"114-2-5102","n":24,"q":"使用短版迷你營養評估量表（Short-Form Mini Nutritional Assessment, MNA-SF）時，若無法取得個案之身體質量指數，可用那一項人體測量替代？","o":["三頭肌皮層厚度","上臂中圍","小腿圍","腰圍"],"a":"C","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"MNA-SF 的替代測量","ex":"MNA-SF 在無法取得 BMI 時，可用小腿圍代替：小於 31 公分為 0 分，31 公分以上為 3 分。"},{"id":"114-2-5102-25","p":"114-2-5102","n":25,"q":"有關營養篩檢（nutritional screening）工具，下列敘述何者錯誤？","o":["迷你營養評估適用於老人","迷你營養評估表，第一階段呈現營養狀況佳者，不須進行第二階段評估","主觀性綜合評估（subjective global assessment, SGA）含身體臨床檢查及病史","使用DETERMINE Your Nutritional Health Checklist，需要良好訓練的專業人員執行才具信度"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"營養篩檢工具","ex":"DETERMINE 是給社區長者或家屬自行填寫的篩檢表，不需要專業人員。MNA 適用老人，第一階段篩檢正常就不必做第二階段；SGA 包括病史與身體檢查。"},{"id":"114-2-5102-26","p":"114-2-5102","n":26,"q":"某份試卷進行預試時，高分組和低分組各100人，答對某題之高分組85人，低分組45人，其鑑別度為何？","o":["0.2","0.4","0.65","1.3"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"試題鑑別度","ex":"鑑別度 ＝ 高分組答對率 − 低分組答對率 ＝ 85% − 45% ＝ 0.4。"},{"id":"114-2-5102-27","p":"114-2-5102","n":27,"q":"下列何種訪問調查的型態，最適合在研究初期階段實施？","o":["無結構性訪問（unstructured interview）","半無結構性訪問（semi-unstructured interview）","半結構性訪問（semi-structured interview）","結構性訪問（structured interview）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"訪問調查的類型","ex":"研究初期對議題還不了解，適合用無結構性訪問，讓受訪者自由說，收集多種想法；研究後期再用結構性訪問做量化。"},{"id":"114-2-5102-28","p":"114-2-5102","n":28,"q":"以學校為場域，提升同校學生認同多吃蔬果，屬於計畫行為理論（The Theory of Planned Behavior）中的那個因素？","o":["行為態度","主觀規範","知覺行為控制","行為動力"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"計畫行為理論","ex":"主觀規範是個人感受到重要他人（同學、家人、老師）對某行為的期待。在學校營造同儕都認同多吃蔬果的氛圍，屬於主觀規範。"},{"id":"114-2-5102-29","p":"114-2-5102","n":29,"q":"溝通理論強調諮商應該注重有效的溝通，下列何者錯誤？","o":["講述是語言溝通中最重要的技巧","面部表情、講話手勢、講述語調皆屬於非語言溝通","非語言溝通有時比語言溝通更能表達人的態度","營養師可用語言表達同理心，以建立良好諮商關係"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"諮商的溝通技巧","ex":"諮商中最重要的語言溝通技巧是「傾聽」，不是講述。非語言溝通（表情、手勢、語調）有時更能傳達態度；營養師可用語言表達同理心。"},{"id":"114-2-5102-30","p":"114-2-5102","n":30,"q":"教學目標中的認知領域（cognitive domain），有下列四項學習思考層次，由低至高的排列何者正確？①應用（application）　②分析（analysis）　③整合（synthesis）　④理解（comprehension）","o":["④③②①","②④③①","②④①③","④①②③"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"認知領域的層次","ex":"布魯姆（Bloom）的認知領域由低到高為：知識、理解、應用、分析、綜合、評鑑。所以是理解 → 應用 → 分析 → 整合。"},{"id":"114-2-5102-31","p":"114-2-5102","n":31,"q":"講述教學是最常用的教學方法，缺點是時間一長，聽眾就無法專注。對於高中生來說，時間最好控制在多久？","o":["10分鐘","20分鐘","30分鐘","50分鐘"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"講述教學的時間","ex":"高中生專注時間有限，講述教學最好控制在約 20 分鐘，再穿插討論或活動。"},{"id":"114-2-5102-32","p":"114-2-5102","n":32,"q":"社會支持是指個人可以感受、察覺或接受來自他人的關心或協助，例如「一時無法改變飲食習慣，不代表你無能」，是屬於下列何種社會支持？","o":["自尊（esteem）","情感（emotional）","網絡支持（network）","實質性或工具性（tangible or instrumental）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"社會支持的類型","ex":"自尊支持是肯定對方的能力與價值，例如「一時改不過來不代表你無能」。情感支持是表達關心與同理；工具性支持是給予實際協助。"},{"id":"114-2-5102-33","p":"114-2-5102","n":33,"q":"策略行銷觀念應用在社區營養計畫，有8個步驟，下列何者應列在最後？","o":["市場區隔","產品定位","市場混合多樣性","設定目標"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"策略行銷的步驟","ex":"策略行銷的順序大致是：分析環境 → 設定目標 → 市場區隔 → 選擇目標市場 → 產品定位 → 最後擬定行銷組合（4P，市場混合）。"},{"id":"114-2-5102-34","p":"114-2-5102","n":34,"q":"某血糖控制方案花費25萬元，該方案參與者的糖尿病併發症因而下降節省80萬元的醫療費用，二者相減之差異為55萬元，其屬於下列何種經濟成本分析？","o":["成本利益分析","成本效益分析","成本價值分析","成本最小值分析"],"a":"A","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"經濟評估的方法","ex":"成本利益分析是把成本與結果都換成金錢比較，例如花 25 萬元、省下 80 萬元，淨利益 55 萬元。成本效益分析的結果是健康單位（如每降低 1% 糖化血色素的成本）。"},{"id":"114-2-5102-35","p":"114-2-5102","n":35,"q":"社區營養計畫，訂出七成的肥胖民眾參加減重計畫6個月後，體重降低5％之目標，此屬於下列何種計畫目標？","o":["過程","結構","結果","中期"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫目標的類型","ex":"結果目標是計畫要達到的成效，例如「七成參加者 6 個月後體重降低 5%」。過程目標是執行的活動量（如辦幾場課）；結構目標是資源與人力。"},{"id":"114-2-5102-36","p":"114-2-5102","n":36,"q":"編列高血壓社區防治營養計畫預算時，下列何項支出不屬於業務費？","o":["水電費","文具紙張","臨時工資","專家出席費"],"a":"A","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫預算的分類","ex":"政府計畫的業務費包括文具紙張、臨時工資、出席費、印刷、差旅等執行計畫所需的費用。水電費屬於行政管理費（或由機關支應），不是業務費。"},{"id":"114-2-5102-37","p":"114-2-5102","n":37,"q":"營養師以SWOT分析社區營養服務據點的現況，其中政府目前正挹注經費大力推動「長照2.0」，此部分應屬於SWOT分析法中的：","o":["S（Strength）","W（Weakness）","O（Opportunity）","T（Threat）"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"SWOT 分析","ex":"S、W 是組織內部的優勢與弱勢；O、T 是外部環境的機會與威脅。政府大力推動長照 2.0、挹注經費，是外部的機會。"},{"id":"114-2-5102-38","p":"114-2-5102","n":38,"q":"依據民國102～105年國民營養健康狀況變遷調查調查結果顯示，以血清濃度判別兩性19歲以上者之維生素A、D、E、B6、B 12與葉酸缺乏盛行率，下列敘述何者正確？","o":["六項維生素缺乏盛行率以維生素B12最高","葉酸缺乏盛行率高於維生素B6","三項脂溶性維生素缺乏盛行率以維生素E最高","維生素A缺乏盛行率高於維生素D"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人維生素缺乏盛行率","ex":"依標準答案，102～105 年調查中 19 歲以上者六項維生素的血清缺乏盛行率以 B12 最高。"},{"id":"114-2-5102-39","p":"114-2-5102","n":39,"q":"有關國民營養健康狀況變遷調查，維生素D的營養狀況，下列何者正確？","o":["歷年來國民營養健康狀況變遷調查皆使用臺灣食品成分資料庫中維生素D的含量資料，推算國人維生素D的攝取狀況","根據1993～2002年間的營養調查顯示，魚、魚肉製品、奶類及蕈類是國人最重要的維生素D來源","比較2013～2015年與1993～2001年，國人的維生素D平均攝取量未改善","血清中25-hydroxyvitamin D的濃度，不包含內源性的維生素D"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人維生素 D 的來源","ex":"依標準答案，1993～2002 年的營養調查顯示，國人維生素 D 主要來自魚與魚製品、奶類及蕈類。血清 25(OH)D 包括食物與皮膚合成的維生素 D。"},{"id":"114-2-5102-40","p":"114-2-5102","n":40,"q":"民國102年起，全國營養調查之敘述，下列何者正確？","o":["由衛生福利部食品藥物管理署接管","以5年為一期展開調查","改以全國分北中南三層調查","收集肺功能與體適能數據"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"民國 102 年起的國民營養調查","ex":"民國 102 年起國民營養健康狀況變遷調查改為連續性調查，由國民健康署主辦，每 4 年為一期，並加入肺功能、體適能等身體檢查項目。"},{"id":"114-2-5102-41","p":"114-2-5102","n":41,"q":"現階段的國民營養健康調查（NAHSIT），樣本抽樣方式最接近下列何者？","o":["分層多階段集束抽樣","分層隨機抽樣","簡單隨機抽樣","集束抽樣"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的抽樣方式","ex":"國民營養健康調查以分層多階段集束抽樣：先依地區分層，再依序抽鄉鎮市區、村里、戶與個人。"},{"id":"114-2-5102-42","p":"114-2-5102","n":42,"q":"自民國102年起，「國民營養健康狀況變遷調查」由衛生福利部所屬的那一個機關主責？","o":["中央健康保險署","食品藥物管理署","疾病管制署","國民健康署"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的主辦機關","ex":"民國 102 年起，國民營養健康狀況變遷調查由衛生福利部國民健康署主責。"},{"id":"114-2-5102-43","p":"114-2-5102","n":43,"q":"聯合國糧食及農業組織（Food and Agriculture Organization of the United Nations, FAO）建議各國應建立以食物為基礎的飲食指標（Food-based dietary guidelines），其目的未包含下列何者？","o":["公共衛生營養推廣的基礎","可作為農業政策制定之用","提供一般大眾促進健康的飲食建議","可節省膳食支出費用，提高糧食可獲性"],"a":"D","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"以食物為基礎的飲食指標","ex":"FAO 推動以食物為基礎的飲食指標（FBDG），作為公共衛生營養推廣、教育一般大眾、並可提供農業與糧食政策的參考。節省膳食支出、提高糧食可獲性不是它的目的。"},{"id":"114-2-5102-44","p":"114-2-5102","n":44,"q":"有關聯合國糧食及農業組織（Food And Agricalture Organization of the United Nations, FAO）所公告之2021年世界糧食安全和營養狀況，下列敘述何者錯誤？","o":["糧食安全程度使用家庭糧食不安全獲取量表（Household Food Insecurity Access Scale）評估","2020年，全球近三分之一的人無法獲得足夠的食物","女性中度或重度糧食不安全盛行率比男性高10％","營養不足人口最多的地區是亞洲"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"2021 年世界糧食安全與營養狀況","ex":"FAO 是以「糧食不安全經驗量表」（Food Insecurity Experience Scale, FIES）評估糧食安全，不是家庭糧食不安全獲取量表（HFIAS）。2020 年全球近三分之一人口無法取得足夠食物，營養不足人數以亞洲最多。"},{"id":"114-2-5102-45","p":"114-2-5102","n":45,"q":"我國於2011年召開之全國糧食安全會議訂定，我國之糧食自給率於2020年應達到多少？","o":["40%","50%","60%","70%"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"我國糧食自給率目標","ex":"2011 年全國糧食安全會議設定我國糧食自給率（以熱量計）於 2020 年達到 40%。"},{"id":"114-2-5102-46","p":"114-2-5102","n":46,"q":"內政部公布民國109年度國人平均壽命達81.3歲。下列那一個解讀正確？","o":["民國109年出生的嬰兒，預估可活至81.3歲","民國109年死亡的人當中，最高比率是在81.3歲時發生死亡","民國109年死亡的人，平均死亡年齡為81.3歲","民國109年，年齡超過82歲的人，無法估算還剩幾年壽命"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"平均壽命的意義","ex":"平均壽命是指 0 歲的平均餘命，表示該年出生的嬰兒在當年的死亡率條件下，預估平均可活到幾歲。不是當年死亡者的平均年齡。"},{"id":"114-2-5102-47","p":"114-2-5102","n":47,"q":"糖尿病人接受「臨床諮詢及教育」以遏止疾病惡化，此措施屬於公共衛生三段五級預防的那一個階段？","o":["促進健康","特殊保護","復健","限制失能"],"a":"D","c":"公共衛生營養學","c2":"膳食療養","ch":"流行病學與研究方法","ch2":"第6章 糖尿病","t":"三段五級預防","ex":"三段五級：初段預防為健康促進、特殊保護；次段預防為早期診斷與適當治療；三段預防為限制失能、復健。已經確診的糖尿病人接受諮詢與教育以避免惡化、併發症，屬於限制失能。"},{"id":"114-2-5102-48","p":"114-2-5102","n":48,"q":"某研究於2000～2020年間，共追蹤1,000名攝取高脂飲食及800名正常飲食者，在追蹤期間分別有30名及10名研究對象罹患大腸癌，攝取高脂飲食者產生大腸癌的相對危險性（relative risk, RR）是多少？","o":["0.03","0.42","2.4","1.2"],"a":"C","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"相對危險性的計算","ex":"RR ＝ 暴露組發生率 ÷ 非暴露組發生率 ＝（30 ÷ 1,000）÷（10 ÷ 800）＝ 0.03 ÷ 0.0125 ＝ 2.4。"},{"id":"114-2-5102-49","p":"114-2-5102","n":49,"q":"某社區健康中心調查資料顯示，該地區1,000名成年人中，民國110年初高血壓人數120名，民國111年初高血壓人數180名，據此可推估該地區民國110～111年間高血壓之狀況如何？","o":["盛行率為6.0%","盛行率為18.0%","發生率為6.0%","發生率為18.0%"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"盛行率與發生率","ex":"盛行率是某時間點的所有病例 ÷ 總人口：111 年初 180 ÷ 1,000 ＝ 18%。發生率要用新病例除以「原本沒病的人」：（180 − 120）÷ 880 ≈ 6.8%，不是 6%。"},{"id":"114-2-5102-50","p":"114-2-5102","n":50,"q":"召募某特定族群未罹癌者二萬人，評估其抗氧化營養素攝取量，預定在未來10年，監測其各種癌症的發生情形。此種研究方法稱為：","o":["世代研究（Cohort study）","生態學研究（Ecological study）","回溯性研究（Retrospective study）","病例對照研究（Case-control study）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的類型","ex":"先找一群未罹病的人，測量暴露（抗氧化營養素攝取）後往後追蹤疾病發生，是前瞻性世代研究。"},{"id":"114-2-6102-1","p":"114-2-6102","n":1,"q":"依據食品良好衛生規範準則之規定，有關物流業低溫食品之理貨及裝卸，應於攝氏幾度以下之場所進行？","o":["18","20","15","25"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"物流業低溫食品的理貨","ex":"食品良好衛生規範準則規定，物流業低溫食品的理貨及裝卸應在攝氏 15 度以下的場所進行，且應在短時間內完成，以免溫度上升。"},{"id":"114-2-6102-2","p":"114-2-6102","n":2,"q":"在HACCP系統使用CCP判定樹（CCP decision tree）評估一加工步驟是否為顯著危害的四個問題（4Qs）中，不包含下列何者？","o":["基於衛生安全的考量，評估本步驟是否需要控制","本步驟設計是否可以消除或降低可能發生的危害至可接受的水準","本顯著性危害所造成的污染若不加以管控，是否會造成不可接受的水準","持續步驟可將此顯著性危害消除或降低至可接受的水準"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"CCP 判定樹的四個問題","ex":"CCP 判定樹的四個問題依序是：Q1 此步驟是否有預防措施？（以及是否需要管制）Q2 此步驟的設計是否能消除或降低危害到可接受水準？Q3 污染是否可能超過可接受水準？Q4 後續步驟能否消除或降低此危害？依標準答案，A 不包含在內。"},{"id":"114-2-6102-3","p":"114-2-6102","n":3,"q":"依據食品良好衛生規範準則，下列何者可進入現場從事與食品接觸之工作？","o":["B型肝炎患者","A型肝炎患者","傷寒患者","結核病患者"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品從業人員的健康要求","ex":"準則規定患有 A 型肝炎、手部皮膚病、出疹、膿瘡、外傷、結核病、傷寒或其他可能造成食品污染的疾病者，不得從事與食品接觸的工作。B 型肝炎主要經血液與體液傳染，不經食物，可以從事。"},{"id":"114-2-6102-4","p":"114-2-6102","n":4,"q":"下列何種營養素屬於「可補充攝取」之營養素含量宣稱項目？","o":["鉻","單元不飽和脂肪酸","葉黃素","膳食纖維"],"a":"D","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"飲食指標與營養標示","t":"營養宣稱的「可補充攝取」","ex":"「可補充攝取」的營養宣稱項目包括膳食纖維、維生素 A、B1、B2、C、E、鈣、鐵等；要達到每 100 公克（毫升）一定含量以上才能宣稱「來源」或「高」。鉻、單元不飽和脂肪酸、葉黃素不在列表中。"},{"id":"114-2-6102-5","p":"114-2-6102","n":5,"q":"食品安全管制系統計畫之執行紀錄，應經下列何者的簽署及註記日期？","o":["負責人或其指定人員","廠長或經理","衛生管理人員或管理衛生人員","食品技師或營養師"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 紀錄的簽署","ex":"食品安全管制系統準則規定，執行紀錄應由負責人或其指定人員簽署，並註記日期。"},{"id":"114-2-6102-6","p":"114-2-6102","n":6,"q":"依據食品良好衛生規範準則之規定，下列針對餐飲業洗滌作業場所之敘述，何者錯誤？","o":["具有洗滌、沖洗及有效殺菌之三槽式餐具洗滌殺菌設施","若無充足之流動自來水者，應提供用畢即行丟棄之餐具","洗滌槽之水龍頭高度，應和水槽滿水位時等高，防水逆流污染","應有足夠之水量及供水設施"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"衛生與安全","t":"餐飲業的洗滌場所","ex":"洗滌槽的水龍頭出水口要高於水槽的滿水位，留出空氣間隔，避免水回流污染自來水管線。C 說「等高」是錯的。"},{"id":"114-2-6102-7","p":"114-2-6102","n":7,"q":"依據我國食品良好衛生規範準則，食品業者應指派管理衛生人員，該人員應符合下列何種資格或條件？","o":["每年應接受食品衛生相關機構舉辦之衛生講習8小時以上","經食品安全管制系統訓練60小時以上","專科以上學校之食品、營養等相關科系所畢業","沒有特別規定"],"a":"#","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"管理衛生人員的資格","ex":"本題考選部更正為「一律給分」，選哪一個都算對。考選部沒有公布更正理由；食品良好衛生規範準則要求業者指派管理衛生人員負責督導衛生管理，但對這個人員資格的規定和選項的寫法不完全一致，可能因此沒有唯一正確的答案。"},{"id":"114-2-6102-8","p":"114-2-6102","n":8,"q":"下列何者不屬於教育部與農業部推動國中小學營養午餐採用三章一Q之食材標章？","o":["臺灣有機農產品標章","吉園圃標章","產銷履歷農產品標章","臺灣農產品生產追溯QR Code"],"a":"B","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"生命期與特殊族群政策","t":"三章一 Q","ex":"三章一 Q 是 CAS 台灣優良農產品標章、產銷履歷標章、有機農產品標章，以及臺灣農產品生產追溯 QR Code。吉園圃（安全蔬果標章）已在民國 108 年後退場，不在其中。"},{"id":"114-2-6102-9","p":"114-2-6102","n":9,"q":"下列有關微生物對碳源利用之敘述，何者錯誤？","o":["微生物可利用酯類、醇類等碳源產生能量","當氮源較多時，會抑制微生物利用碳水化合物的能力","與細菌相較，黴菌可在糖濃度較高的環境中生長","大部分微生物利用葡萄糖作為碳源"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"微生物的碳源利用","ex":"大部分微生物以葡萄糖為碳源；有些可利用醇類、酯類、有機酸；黴菌比細菌耐高糖。氮源多寡並不會抑制微生物利用碳水化合物；B 錯。"},{"id":"114-2-6102-10","p":"114-2-6102","n":10,"q":"一般家庭式所製造之麵包會發生黏絲腐敗現象，主要是何種微生物所引起？","o":["產氣莢膜桿菌（Clostridium perfringens）","地衣桿菌（Bacillus licheniformis）","嗜酸乳酸桿菌（Lactobacillus acidophilus）","乳酸鏈球菌（Streptococcus lactis）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"麵包的黏絲病","ex":"麵包黏絲病由枯草桿菌（Bacillus subtilis）與地衣桿菌等芽孢桿菌引起，芽孢耐烘烤，在溫暖潮濕時生長，分解澱粉與蛋白質而產生黏絲。"},{"id":"114-2-6102-11","p":"114-2-6102","n":11,"q":"下列何種食品之腐敗或變質與假單胞菌屬（Pseudomonas）較無直接相關性？","o":["乳製品凝固且產生苦味","真空包裝肉品變綠","罐頭食品的平酸腐敗","蛋類食品黑變"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"假單胞菌的腐敗","ex":"假單胞菌是嗜冷性好氧菌，會造成冷藏乳品苦味凝固、肉品變綠或產生黏液、蛋類黑變與螢光。罐頭的平酸腐敗是嗜熱脂肪芽孢桿菌（Geobacillus stearothermophilus）產酸不產氣所致。"},{"id":"114-2-6102-12","p":"114-2-6102","n":12,"q":"依據食品中微生物衛生標準之規定，下列何項食品不需檢測腸桿菌科微生物？","o":["鮮乳","冷藏殺菌液蛋","食用冰塊","嬰兒配方食品"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸桿菌科的檢驗項目","ex":"依標準答案，冷藏殺菌液蛋不需檢測腸桿菌科。依我的記憶，蛋類液蛋的規定是檢驗沙門氏桿菌與生菌數。"},{"id":"114-2-6102-13","p":"114-2-6102","n":13,"q":"食品中自由水（free water）的含量遠低於微生物細胞內自由水含量時，微生物會產生什麼變化，而無法進行正常生理代謝？","o":["細胞脹大","細胞萎縮","細胞增生","細胞分化"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"水活性與微生物","ex":"食品的自由水比微生物細胞內少（高滲透壓）時，細胞內的水分向外滲出，細胞脫水萎縮（質壁分離），無法正常代謝。這是醃漬、糖漬保存食品的原理。"},{"id":"114-2-6102-14","p":"114-2-6102","n":14,"q":"以lauryl sulfate tryptose（LST）broth培養基測定飯糰中coliform菌數，所得數據之單位，下列何者正確？","o":["CFU/g","CFU/mL","MPN/g","MPN/mL"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"大腸桿菌群的 MPN 法","ex":"LST 培養液是用最確數（MPN）法以發酵產氣判定大腸桿菌群。飯糰是固體樣品，單位是 MPN/g；液體樣品用 MPN/mL。CFU 用在平板菌落計數。"},{"id":"114-2-6102-15","p":"114-2-6102","n":15,"q":"柑橘青黴菌（Penicillium citrinum）對柑橘水果會造成軟腐，與微生物產生的何種酵素有關？","o":["蛋白酶","溶菌酶","植酸酶","果膠酶"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"柑橘青黴菌的軟腐","ex":"黴菌分泌果膠酶分解植物細胞壁之間的果膠，使組織軟化、軟腐。"},{"id":"114-2-6102-16","p":"114-2-6102","n":16,"q":"下列有關安姆氏試驗（Ames test）之敘述何者錯誤？","o":["利用突變種沙門氏菌發生回復突變，突變回復成野生種沙門氏菌","野生種沙門氏菌無法自體合成組胺酸，是組胺酸需求菌","使用不同突變種沙門氏菌可用以鑑別突變原類型","致突變原物質可使突變種沙門氏菌發生回復突變"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"安姆氏試驗","ex":"安姆氏試驗使用「組胺酸需求型」的突變沙門氏菌（無法自己合成組胺酸）。若受試物有致突變性，會讓突變株回復突變成能自行合成組胺酸的野生型，在不含組胺酸的培養基上長出菌落。B 把野生型與突變型說反了。"},{"id":"114-2-6102-17","p":"114-2-6102","n":17,"q":"下列有關致畸試驗的敘述，何者錯誤？","o":["檢測試驗物質對於胚胎著床的影響","觀察實驗仔鼠的骨骼外觀作為畸形性的評估","於胎兒器官形成期間每天餵食試驗物質","檢測環境與試驗物質的交互作用對於胎兒存活率的影響"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"致畸試驗","ex":"致畸試驗在胚胎器官形成期每天給予受試物，觀察著床、胚胎死亡與吸收、胎兒外觀、內臟與骨骼畸形。試驗不是用來測環境與受試物的交互作用。"},{"id":"114-2-6102-18","p":"114-2-6102","n":18,"q":"在食品添加物安全試驗中，下列何者是由急性毒性試驗結果推算？","o":["無毒害作用劑量（NOAEL）","半致死劑量（LD 50）","生物安全劑量（VSD）","每日攝取容許量（ADI）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"急性毒性試驗","ex":"急性毒性試驗是單次大劑量給予，觀察 14 天內的死亡，用來推算半致死劑量（LD50）。NOAEL 由亞慢性或慢性試驗取得；ADI ＝ NOAEL ÷ 安全係數。"},{"id":"114-2-6102-19","p":"114-2-6102","n":19,"q":"在致癌試驗中，若試驗物質作用於生物體的器官或組織，使其形成容易癌化的條件，則該物質屬於下列何者？","o":["一級致癌物","二級致癌物","致癌起始劑","三級致癌物"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"致癌物的分類","ex":"依標準答案，這類物質稱為二級致癌物（promoter 促進劑）：不直接造成 DNA 突變，而是促進已起始的細胞增生形成腫瘤。一級致癌物（起始劑）直接作用於 DNA。"},{"id":"114-2-6102-20","p":"114-2-6102","n":20,"q":"有關健康食品安全性評估試驗，下列敘述何者錯誤？","o":["依據「分層試驗法（tiered approach）」概念，由急性毒性試驗取得NOEL量，得依序執行相關試驗","得依據經濟合作暨發展組織（OECD）化學品測試指引方法（Guidelines for the Testing of Chemicals）來實施","實驗動物的測試樣品每日介入量應低於每日總飲食攝取量的5％","應優先採用國際認可之減量、減低痛苦或縮短時程之活體試驗方法"],"a":"A","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"健康食品的安全性評估","ex":"分層試驗法是由基因毒性、28 天或 90 天餵食試驗等依序評估，不是由「急性毒性試驗」取得 NOEL。NOEL 要由重複劑量試驗求得。"},{"id":"114-2-6102-21","p":"114-2-6102","n":21,"q":"依據我國食品器具容器包裝衛生標準，若使用正版紙為食品包裝容器材料者，其紙質材料的保存期限最多為幾個月？","o":["6","12","18","24"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"紙類包裝的衛生標準","ex":"依標準答案，使用正版紙（原生紙漿）作為食品包裝材料時，紙質材料的保存期限最多 24 個月。"},{"id":"114-2-6102-22","p":"114-2-6102","n":22,"q":"有關清潔劑中界面活性劑壬基苯酚的敘述，下列何者錯誤？","o":["具雌激素效應，屬環境賀爾蒙","對免疫與神經系統具低劑量效應","屬於持久性環境污染物","水溶性極高，易被微生物分解"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"壬基苯酚","ex":"壬基苯酚是壬基苯酚聚乙氧基醇類界面活性劑分解後的產物，具有類雌激素作用，屬環境荷爾蒙；脂溶性高、不易被微生物分解，會在環境與生物體中累積。"},{"id":"114-2-6102-23","p":"114-2-6102","n":23,"q":"依據我國食品器具容器包裝衛生標準，食品容器與食品直接接觸面為金屬合金者，除鉛、鎘之外，還對下列何種重金屬的溶出量有限制標準？","o":["汞","鉻","砷","錫"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"金屬容器的溶出試驗","ex":"依標準答案，金屬容器直接接觸食品的部分，除鉛、鎘外，也限制砷的溶出量。"},{"id":"114-2-6102-24","p":"114-2-6102","n":24,"q":"下列何種添加物常用於麵包及蛋糕，使食品形成多孔性之膨脹效果？","o":["碳酸氫鈉（sodium bicarbonate）","去水醋酸（dehydroacetic acid）","亞硫酸鈉（sodium sulfite）","苯甲酸鹽（benzoate）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"膨脹劑","ex":"碳酸氫鈉（小蘇打）加熱或遇酸分解產生二氧化碳，使麵包與蛋糕膨鬆多孔。去水醋酸、苯甲酸是防腐劑；亞硫酸鈉是漂白劑。"},{"id":"114-2-6102-25","p":"114-2-6102","n":25,"q":"下列何種化合物曾被違法用於增加食品之彈性及保水性？","o":["乳酸鈣","硼砂","丁香醇","焦磷酸鈉"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"違法添加物","ex":"硼砂曾被違法加在年糕、油麵、魚丸等，增加彈性與保水性，但對腎臟有毒，禁止使用。焦磷酸鈉是合法的品質改良劑。"},{"id":"114-2-6102-26","p":"114-2-6102","n":26,"q":"下列何種洗潔劑適用於去除一般洗潔劑無法去除的礦物質沉澱和污漬？","o":["多用途洗潔劑","除油型洗潔劑","擦拭型洗潔劑","酸性型洗潔劑"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"洗潔劑的用途","ex":"酸性洗潔劑可溶解鹼性的礦物質沉積（水垢、鈣垢、鏽漬），一般中性或鹼性洗潔劑無法去除。"},{"id":"114-2-6102-27","p":"114-2-6102","n":27,"q":"使用食品用洗潔劑進行消毒以降低截切生鮮蔬果之微生物危害時，下列敘述何者正確？","o":["使用氯系食品用洗潔劑，洗淨後殘留之總氯濃度不得低於10 ppm","使用氯系食品用洗潔劑進行消毒時，須控制水中總氯濃度於100 ppm以下","火鍋店使用之截切蔬菜於截切製程應以氯系食品用洗潔劑消毒","直接生食之截切蔬果，截切後應使用食品用洗潔劑清洗與消毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"截切蔬果的消毒","ex":"依標準答案，使用氯系食品用洗潔劑消毒截切蔬果時，水中總氯濃度要控制在 100 ppm 以下，B 正確。洗淨後殘留應越低越好；火鍋店蔬菜會加熱，不一定要氯消毒。"},{"id":"114-2-6102-28","p":"114-2-6102","n":28,"q":"被海邊礁石割傷引起蜂窩性組織炎或菌血症，主要是何種病原菌所導致？","o":["創傷弧菌（Vibrio vulnificus）","霍亂弧菌（Vibrio cholerae）","志賀氏桿菌（Shigella spp.）","仙人掌桿菌（Bacillus cereus）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"創傷弧菌","ex":"創傷弧菌存在於溫暖海水中，經傷口感染會造成蜂窩性組織炎、壞死性筋膜炎；肝病患者生食海鮮也可能引起致死性敗血症。"},{"id":"114-2-6102-29","p":"114-2-6102","n":29,"q":"下列有關狂牛症的敘述，何者錯誤？","o":["可能因牛隻攝入病原污染之牛骨粉飼料所導致","感染牛隻會出現腦部組織空洞，呈現腦海綿狀病變","預防牛海綿狀腦病，首重源頭管理","狂牛症的病原普利昂（prion）可經煮沸加熱破壞"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"狂牛症","ex":"狂牛症（牛海綿狀腦病）由普利昂蛋白引起，牛隻吃到受污染的肉骨粉飼料而感染，腦部呈海綿狀空洞。普利昂非常耐熱，一般煮沸無法破壞。"},{"id":"114-2-6102-30","p":"114-2-6102","n":30,"q":"有關樹薯及竹筍中的含氰配醣體（cyanogenic glycosides〉，下列敘述何者錯誤？","o":["較常見的有苦杏素（amygdalin）、皇帝豆素（linamarin）等","煮沸無法破壞該類毒素","氰酸（HCN）為導致中毒的主要原因，會造成呼吸困難","以樹薯為主食可能發生神經萎縮、視覺失明"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"含氰配醣體","ex":"樹薯、竹筍、苦杏仁含氰配醣體，分解後釋出氫氰酸，抑制細胞色素氧化酶造成呼吸困難。氰配醣體與氫氰酸怕熱、易揮發，充分煮沸並去除煮汁可以破壞，B 錯。"},{"id":"114-2-6102-31","p":"114-2-6102","n":31,"q":"下列有關諾羅病毒性腸胃炎的敘述，何者正確？","o":["感染後即可產生完全的保護力","使用消毒用酒精能有效殺滅病毒","間接接觸被病患污染的物品就可能感染","在群聚感染事件中，食餘檢體一定能檢出諾羅病毒"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"諾羅病毒","ex":"諾羅病毒傳染力極強，接觸被污染的物品表面也會感染；感染後免疫力短暫，可能再感染；酒精效果差，要用含氯漂白水；群聚事件的食物檢體不一定能檢出病毒。"},{"id":"114-2-6102-32","p":"114-2-6102","n":32,"q":"食品從業人員手部有化膿傷口未適當處理，則容易帶有下列何種病原菌而造成食物中毒？","o":["病原性大腸桿菌","肉毒桿菌","沙門氏菌","金黃色葡萄球菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"金黃色葡萄球菌","ex":"金黃色葡萄球菌常見於人體皮膚、鼻腔與化膿傷口，經手污染食物後產生耐熱的腸毒素，造成嘔吐腹瀉。所以手部有傷口要包紮並戴手套。"},{"id":"114-2-6102-33","p":"114-2-6102","n":33,"q":"有關黃麴毒素（aflatoxins）之敘述，下列何者錯誤？","o":["對熱不穩定，對酸和鹼具安定性","對肝臟具有高度致癌性","毒性以B1型為最強","我國規定花生之總黃麴毒素限量為15 ppb以下"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"黃麴毒素","ex":"黃麴毒素相當耐熱，一般烹調無法破壞，但在強鹼下可被分解。B1 毒性最強，是強力肝癌致癌物；我國花生的總黃麴毒素限量為 15 ppb。"},{"id":"114-2-6102-34","p":"114-2-6102","n":34,"q":"下列那一種寄生蟲容易藉由生菜類經口攝入感染？","o":["鉤蟲","旋毛蟲","無鉤絛蟲","肺吸蟲"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"經生菜感染的寄生蟲","ex":"鉤蟲、蛔蟲的蟲卵隨人糞污染土壤與蔬菜，生吃沒洗乾淨的蔬菜就可能感染（鉤蟲也可經皮膚鑽入）。旋毛蟲來自豬肉；無鉤絛蟲來自牛肉；肺吸蟲來自淡水蝦蟹。"},{"id":"114-2-6102-35","p":"114-2-6102","n":35,"q":"依據我國歷年食品中毒發生狀況累計統計資料顯示，發生率最高的食品病原菌主要為何？","o":["金黃色葡萄球菌、肉毒桿菌","病原性大腸桿菌、李斯特菌","腸炎弧菌、曲狀桿菌","腸炎弧菌、金黃色葡萄球菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"國內常見的食品中毒病原","ex":"依我國歷年統計，已知病因的食品中毒以腸炎弧菌、金黃色葡萄球菌、仙人掌桿菌，以及近年的諾羅病毒最常見。"},{"id":"114-2-6102-36","p":"114-2-6102","n":36,"q":"下列有關非洲豬瘟之敘述，何者正確？","o":["非洲豬瘟病毒會傳染給人，造成人類的疾病","非洲豬瘟病毒傳染豬隻，造成豬隻發高熱，內臟出血","人攝食病畜製品會引發食物中毒","非洲豬瘟病毒容易傳染家禽，引起經濟重大的損失"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"非洲豬瘟","ex":"非洲豬瘟只感染豬科動物，造成高燒、內臟出血與高死亡率；不會傳染給人，人吃了病豬產品也不會中毒，也不會傳染家禽。"},{"id":"114-2-6102-37","p":"114-2-6102","n":37,"q":"肺吸蟲常見於下列那種食物中？","o":["未充分加熱之鰹魚","未澈底洗淨之雞蛋","未充分加熱之豬肉","未煮熟之淡水蝦蟹"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"肺吸蟲","ex":"肺吸蟲的中間宿主是淡水螺與淡水蝦蟹，生吃或吃未煮熟的蝦蟹（如醉蟹）就可能感染。"},{"id":"114-2-6102-38","p":"114-2-6102","n":38,"q":"有關低酸性罐頭食品之敘述，下列何者錯誤？","o":["殺菌指標是PA3679","殺菌條件是針對肉毒桿菌之毒素","產品屬於pH 4.6以上且Aw 0.85以上者","應高溫殺菌以防止腐敗及中毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"低酸性罐頭","ex":"低酸性罐頭是 pH 大於 4.6、水活性大於 0.85 的罐頭，要以高溫殺菌破壞肉毒桿菌的「芽孢」，殺菌效果以較耐熱的 PA3679 作指標。殺菌是針對芽孢，不是毒素。"},{"id":"114-2-6102-39","p":"114-2-6102","n":39,"q":"下列何種病原菌所引起的食物中毒症狀為腹痛、水瀉、血便，且大部分患者不會有發燒症狀，但嚴重時會引起溶血性貧血與腎功能障礙？","o":["痢疾桿菌","腸出血型大腸桿菌","李斯特菌","下痢型仙人掌桿菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸出血性大腸桿菌","ex":"腸出血性大腸桿菌（如 O157:H7）產生志賀毒素，引起腹痛、水瀉轉血便，通常不發燒；嚴重時併發溶血性尿毒症候群（溶血性貧血、血小板減少、腎衰竭）。"},{"id":"114-2-6102-40","p":"114-2-6102","n":40,"q":"依據我國食品中污染物質及毒素衛生標準，新鮮馬鈴薯的總配醣生物鹼（total glycoalkaloids）限量標準為多少ppm？","o":["20","50","100","200"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"馬鈴薯的配醣生物鹼限量","ex":"依標準答案，新鮮馬鈴薯的總配醣生物鹼（茄鹼等）限量為 200 ppm。"},{"id":"114-2-6102-41","p":"114-2-6102","n":41,"q":"依據食品安全衛生管理法規定，應設置衛生管理人員之食品製造工廠類別及規模，不包含下列何者？","o":["罐頭食品製造業且資本額5千萬","食品添加物製造業資本額3千萬且食品從業人員6人","肉類加工食品業且資本額1.5億元","即食餐食業資本額2千萬且食品從業人員4人"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"應設置衛生管理人員的工廠","ex":"依標準答案，D 不在規定範圍內。罐頭食品、食品添加物製造業與一定資本額以上的肉類加工、乳品等工廠都要設置衛生管理人員。"},{"id":"114-2-6102-42","p":"114-2-6102","n":42,"q":"碳酸鈉與碳酸氫鈉屬於下列何種性質的食品用洗潔劑？","o":["酸性","中性","鹼性","界面活性"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"鹼性洗潔劑","ex":"碳酸鈉（蘇打）與碳酸氫鈉溶於水呈鹼性，可皂化油脂、分解蛋白質，屬鹼性洗潔劑。"},{"id":"114-2-6102-43","p":"114-2-6102","n":43,"q":"下列有關廚房常用設備與器具材質之敘述，何者正確？","o":["常用不鏽鋼為304系列，為鎳鉻錳合金","不鏽鋼之特性為表面光滑易清洗、不易變形","食品容器適合使用的塑膠材質包括聚氯乙烯類（PVC）及聚碳酸鹽類（PC）","鋁質結構輕軟，不易被清潔劑腐蝕"],"a":"B","c":"食品衛生與安全","c2":"團體膳食製備","ch":"容器包裝與洗潔劑","ch2":"設備與器具","t":"廚房設備的材質","ex":"不鏽鋼表面光滑、易清洗、不易變形。常用的 304 不鏽鋼是鉻鎳合金（18-8），不是鎳鉻錳；PVC 與 PC 有塑化劑與雙酚 A 的疑慮；鋁質輕軟，容易被酸鹼清潔劑腐蝕。"},{"id":"114-2-6102-44","p":"114-2-6102","n":44,"q":"有關食材驗收與管理之敘述，下列何者正確？①所有食材要有供貨來源及流向的追溯系統　②不合格的食材僅須明確標示不用另外放置　③冷凍產品的運輸條件需要驗收　④倉庫內食材應分類貯放在棧板、貨架上","o":["①②④","②③④","①③④","①②③"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"採購與驗收","t":"食材的驗收與管理","ex":"食材要能追溯來源與流向；冷凍品要檢查運輸溫度；倉庫食材應分類放在棧板或貨架上，離地離牆。不合格的食材除了標示外，也要另外隔離放置，以免誤用。"},{"id":"114-2-6102-45","p":"114-2-6102","n":45,"q":"有關我國食品良好衛生規範準則之敘述，下列何者正確？","o":["次氯酸水為鹽水電解而得，安全性高，使用不需三專管理","用於清洗作業之洗衣粉應標明其毒性、使用及緊急處理方法","味精屬於調味料，不必記錄用量","市售居家用的殺蟲劑毒性較低，可置放於作業現場，方便病媒防治"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"準則中的化學物質管理","ex":"清潔劑、消毒劑等化學物質應標明毒性、使用方法與緊急處理方法，並專人、專櫃、專冊管理。次氯酸水也是消毒劑，要三專管理；味精屬食品添加物，要記錄用量；殺蟲劑不能放在作業場所。"},{"id":"114-2-6102-46","p":"114-2-6102","n":46,"q":"採購時可請供應商提供相關檢驗證明，下列配對何者錯誤？","o":["蜂蜜－農藥殘留","地瓜粉－順丁烯二酸酐","雞肉－動物用藥殘留","大豆油－單氯丙二醇"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"採購檢驗證明的對應","ex":"蜂蜜檢驗農藥殘留、地瓜粉檢驗順丁烯二酸酐（毒澱粉）、雞肉檢驗動物用藥殘留都正確。單氯丙二醇是酸水解醬油的檢驗項目，大豆油一般不以它作為檢驗證明。"},{"id":"114-2-6102-47","p":"114-2-6102","n":47,"q":"依據我國飲用水水質標準，飲用水總菌數應在多少CFU/mL以下？","o":["250","200","150","100"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"飲用水的總菌落數","ex":"依飲用水水質標準，總菌落數限值為 100 CFU/mL，大腸桿菌群為 6 CFU/100mL。"},{"id":"114-2-6102-48","p":"114-2-6102","n":48,"q":"利用碘試驗法主要是檢測餐具或容器之何種殘留物？","o":["清潔劑","蛋白質","澱粉","脂肪"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"衛生與安全","t":"餐具的殘留檢驗","ex":"碘試驗是把碘液滴在餐具上，若有澱粉殘留會呈藍紫色。脂肪殘留用蘇丹 IV 試驗；清潔劑殘留用甲基藍試驗。"},{"id":"114-2-6102-49","p":"114-2-6102","n":49,"q":"依據我國食品安全衛生管理法規定，食品原料中非故意攙入基因改造食品原料超過多少％即視為基因改造食品？","o":["0.3","1","2","3"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"基因改造食品的標示門檻","ex":"我國規定食品原料中非故意攙入基因改造原料超過 3% 時，即視為基因改造食品，應標示。"},{"id":"114-2-6102-50","p":"114-2-6102","n":50,"q":"下列有關食品過敏原標示規定之敘述，何者正確？","o":["餐廳菜單應揭露食品過敏原資訊","銷售給食品製造業者的花生醬，於外包裝得免標過敏原警語","若食品標示的內容物已展開過敏原成分，不需標示過敏原警語","蕎麥屬於含麩質穀物，應標示過敏原資訊"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"過敏原的標示","ex":"過敏原標示規定只用在直接販售給消費者的包裝食品；售給食品業者作為原料的產品可免標。餐廳菜單目前不強制揭露；即使內容物已列出過敏原，仍要另外標示警語；蕎麥屬過敏原，但不是含麩質穀物。"},{"id":"113-2-1102-1","p":"113-2-1102","n":1,"q":"下列何者為提供具成本效益（cost-effective）營養照護（nutrition care process）的第一步？","o":["營養篩檢（nutrition screening）","營養評估（nutrition assessment）","營養診斷（nutrition diagnosis）","營養監測（nutrition monitor）"],"a":"A","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養照護的第一步","ex":"營養篩檢可以用簡單的工具快速找出有營養風險的病人，再對這些人做完整的營養評估，避免每個人都做詳細評估，所以是具成本效益的營養照護的第一步。"},{"id":"113-2-1102-2","p":"113-2-1102","n":2,"q":"有關營養診斷（nutrition diagnosis），下列敘述何者錯誤？","o":["營養診斷是經由評估5個面向（domains）所獲結果，謹慎判斷和決策，準確提出營養問題","進行營養診斷可減少住院時間、併發症及死亡率","營養診斷的目的為透過營養醫療專業人員的營養治療／營養介入來改善或解決特定營養問題","營養問題的早期診斷和及時介入可以提供好的醫療支持"],"a":"B","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養診斷","ex":"營養診斷是由評估資料判斷出營養問題，以 PES（問題、病因、徵候）敘述，目的是讓後續介入能改善或解決這個問題。依標準答案 B 錯：減少住院天數、併發症與死亡率是整個營養照護（包括介入）帶來的成果，不是「進行營養診斷」本身的作用。"},{"id":"113-2-1102-3","p":"113-2-1102","n":3,"q":"臥床病人，可利用那一種儀器設備測量氧氣的消耗量及二氧化碳生成量，用以評估熱量需求？","o":["直接熱量測定儀","彈卡儀","標定儀","間接熱量測定儀"],"a":"D","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"間接熱量測定","ex":"間接熱量測定儀測量氧氣消耗量與二氧化碳生成量，以韋爾公式算出能量消耗，可在床邊測臥床病人。直接熱量測定要讓人待在密閉隔熱室測量散熱；彈卡儀是測食物熱量。"},{"id":"113-2-1102-4","p":"113-2-1102","n":4,"q":"癌症病人因化學治療引起持續性嘔吐，生理檢查腸音正常，提供下列何種營養支持模式較為適合？","o":["oral intake fortified food","nasojejunal feeding","total parenteral nutrition","gastrostomy"],"a":"B","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"持續嘔吐時的營養支持途徑","ex":"腸音正常表示腸道功能還在，應優先使用腸道營養。持續嘔吐時食物進胃容易吐出與吸入，所以把管子放到幽門後（鼻空腸管），越過胃直接灌食。短期使用選經鼻管路，不必做胃造口。"},{"id":"113-2-1102-5","p":"113-2-1102","n":5,"q":"腸道營養與靜脈營養之併發症比較，下列敘述何者錯誤？","o":["腸道營養容易發生全身性發炎反應（SIRS）","對於極度營養不良之個案，二者均可能發生refeeding syndrome","靜脈營養較易有膽汁鬱積（cholestasis）","靜脈營養易導致腸黏膜組織萎縮"],"a":"A","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"腸道營養與靜脈營養的併發症","ex":"靜脈營養讓腸道沒有使用，腸黏膜萎縮，腸道屏障變差，細菌移位，比較容易引起全身性發炎反應與感染；長期使用也容易有膽汁鬱積。兩者在極度營養不良時都可能發生再餵食症候群。"},{"id":"113-2-1102-6","p":"113-2-1102","n":6,"q":"有關使用全靜脈營養（TPN）時醣類過量的併發症，下列何者最不常見？","o":["高血糖","脂肪肝","高血磷","高二氧化碳血症"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"TPN 醣類過量的併發症","ex":"葡萄糖給太多會造成高血糖、脂肪肝（多餘葡萄糖轉成脂肪），以及二氧化碳生成增加（呼吸商上升）造成高碳酸血症。葡萄糖帶動磷進入細胞，常見的是「低」血磷，不是高血磷。"},{"id":"113-2-1102-7","p":"113-2-1102","n":7,"q":"長期使用corticosteroids類的藥物，如prednisone會導致電解質不平衡和營養素的流失，下列調整何者最適當？","o":["補充鈉","補充鈣","限制鉀","限制鎂"],"a":"B","c":"膳食療養","c2":"","ch":"第14章 飲食、營養與藥物的交互作用","ch2":"","t":"類固醇對營養素的影響","ex":"類固醇會減少腸道鈣吸收、增加尿鈣排出並促進骨質流失，長期使用要補充鈣與維生素 D。類固醇也會造成鈉滯留、鉀流失，所以應限制鈉、補充鉀。"},{"id":"113-2-1102-8","p":"113-2-1102","n":8,"q":"人體脂肪堆積的情形，下列敘述何者錯誤？","o":["android obesity常見胰島素阻抗","android obesity常好發於40歲前女性","gynoid obesity的脂肪分布大多在臀部及大腿","gynoid obesity罹患心血管疾病的機率較低"],"a":"B","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"脂肪分布型態","ex":"男性型（android，蘋果型）肥胖脂肪堆積在腹部，常見胰島素阻抗與心血管疾病風險，多見於男性與停經後女性。停經前女性多是女性型（gynoid，西洋梨型），脂肪在臀部與大腿，心血管風險較低。"},{"id":"113-2-1102-9","p":"113-2-1102","n":9,"q":"有關以Very-Low-Calorie Diet減重的敘述，下列何者最不適當？","o":["不易罹患膽結石","易疲勞無力暈眩","易電解質不平衡","易便秘或腹瀉"],"a":"A","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"極低熱量飲食的副作用","ex":"極低熱量飲食（每天約 800 大卡以下）體重下降快，膽汁中膽固醇過飽和、膽囊收縮減少，反而容易形成膽結石。其他常見副作用有疲倦暈眩、電解質不平衡、便秘或腹瀉。"},{"id":"113-2-1102-10","p":"113-2-1102","n":10,"q":"治療神經性厭食症病人飲食中蛋白質、醣類、脂質比例建議為何？","o":["20%、50%、30%","10%、50%、40%","30%、40%、30%","25%、40%、35%"],"a":"A","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"神經性厭食症的飲食比例","ex":"神經性厭食症的營養復健採均衡飲食，三大營養素比例約蛋白質 15～20%、醣類 50～60%、脂質 25～30%，最接近 A。"},{"id":"113-2-1102-11","p":"113-2-1102","n":11,"q":"缺乏維生素D是影響老年人骨質健康和骨折危險性的因素之一，有關老年人缺乏維生素D的危險因子，下列何者最不適當？","o":["皮下脂肪變厚","日曬機會減少","腎功能下降","體脂肪量增加"],"a":"A","c":"膳食療養","c2":"生命期營養","ch":"第12章 內分泌與新陳代謝疾病","ch2":"老年期","t":"老年人維生素 D 缺乏的危險因子","ex":"老年人皮膚變薄、皮膚中的 7-去氫膽固醇減少，合成維生素 D 的能力下降；加上日曬少、腎臟活化能力下降、維生素 D 被脂肪組織留住（體脂多），都增加缺乏風險。皮下脂肪「變厚」不是老化的特徵，也不是危險因子。"},{"id":"113-2-1102-12","p":"113-2-1102","n":12,"q":"有關rheumatoid arthritis，下列敘述何者正確？","o":["藥物治療主要使用非固醇類抗發炎藥","男性發生率較高","長期高油飲食引發的關節炎症","飲食建議補充n-6 PUFA"],"a":"A","c":"膳食療養","c2":"","ch":"第12章 內分泌與新陳代謝疾病","ch2":"","t":"類風濕性關節炎","ex":"類風濕性關節炎是自體免疫疾病，女性較多。藥物治療常用非類固醇抗發炎藥（以及類固醇與疾病調節藥物）。飲食建議增加 n-3 脂肪酸（魚油）以減少發炎，n-6 脂肪酸會產生促發炎的類二十碳酸。"},{"id":"113-2-1102-13","p":"113-2-1102","n":13,"q":"某些腸胃道疾病會建議使用low FODMAPs diet，下列那一種食物成分不在low FODMAPs diet的限制之內？","o":["果糖","糖醇","半乳寡糖","纖維素"],"a":"D","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"低 FODMAP 飲食","ex":"FODMAP 是可發酵的寡醣（果聚醣、半乳寡糖）、雙醣（乳糖）、單醣（過量果糖）與多元醇（糖醇）。纖維素不會被腸道菌大量發酵，不在限制之內。"},{"id":"113-2-1102-14","p":"113-2-1102","n":14,"q":"肝硬化病人腹水的原因和許多因素有關，下列何者錯誤？","o":["門靜脈高壓（portal hypertension）","腎素（renin）與醛固酮（aldosterone）分泌被抑制","低白蛋白血症（hypoalbuminemia）","抗利尿激素（ADH）分泌增加"],"a":"B","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"肝硬化腹水的成因","ex":"肝硬化時門靜脈高壓、白蛋白低使膠體滲透壓下降；有效循環血量減少，反而「活化」腎素－血管張力素－醛固酮系統並增加抗利尿激素，造成鈉水滯留。B 說被抑制是錯的。"},{"id":"113-2-1102-15","p":"113-2-1102","n":15,"q":"關於膽囊疾病的營養處置，下列敘述何者最不適當？","o":["膽汁淤積可能和長期NPO有關","急性膽囊發炎須暫停進食","慢性膽囊發炎建議攝取較低脂肪的飲食，約占總熱量25～30%","膽囊切除術後通常需要終生使用低脂肪飲食，建議占總熱量20%以下"],"a":"D","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"5 調整脂肪之飲食","t":"膽囊疾病的飲食","ex":"長期禁食使膽囊不收縮、膽汁淤積；急性膽囊炎要暫停進食；慢性膽囊炎採較低脂飲食。膽囊切除後膽汁直接流入腸道，短期內少量多餐、低脂，之後可逐漸恢復一般飲食，不需終生低脂。"},{"id":"113-2-1102-16","p":"113-2-1102","n":16,"q":"有關cholelithiasis的危險因子，下列敘述何者錯誤？","o":["Crohn's disease","male gender","high-fat diet","rapid weight loss"],"a":"B","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"膽結石的危險因子","ex":"膽結石的危險因子包括女性、肥胖、懷孕、快速減重、高脂飲食，以及克隆氏症（迴腸病變使膽鹽吸收減少）。女性較多，所以「男性」不是危險因子。"},{"id":"113-2-1102-17","p":"113-2-1102","n":17,"q":"下列與短腸症相關之敘述，何者錯誤？","o":["小腸前段100公分，負責大部分營養素吸收作用","小腸切除30%，即會有短腸症","distal ileum切除，會影響bile salt之吸收","ileum切除，會增加結石的風險"],"a":"B","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"短腸症","ex":"一般小腸切除超過 50%，或剩餘長度少於約 200 公分才會出現短腸症，切除 30% 通常可以代償。迴腸末端負責膽鹽與 B12 吸收，切除後膽鹽流失、脂肪吸收不良，鈣與脂肪酸結合，草酸吸收增加，容易形成腎結石。"},{"id":"113-2-1102-18","p":"113-2-1102","n":18,"q":"有關第2型糖尿病婦女懷孕，下列何者錯誤？","o":["血糖儘量控制在接近正常，能減少孕產期合併症，但也增加低血糖的風險","胰島素的需求在懷孕第二期及第三期會大幅度增加，生產前可能會到達孕前需求的2～3倍","應攝取消夜以避免半夜低血糖","懷孕期間熱量或醣類攝取不足可能引發酮血症，建議規律地在睡前監測尿酮"],"a":"D","c":"膳食療養","c2":"生命期營養","ch":"第6章 糖尿病","ch2":"懷孕與哺乳期","t":"第 2 型糖尿病婦女懷孕","ex":"懷孕期胰島素需求在第二、三期大幅增加；血糖控制嚴格也增加低血糖風險；需要睡前點心避免半夜低血糖。尿酮建議在「早晨空腹」或血糖異常時監測，B 依標準答案錯在睡前監測。"},{"id":"113-2-1102-19","p":"113-2-1102","n":19,"q":"下列檢驗值何者屬於「糖尿病前期」？","o":["隨機血糖值：210 mg/dL","糖化血色素（A1C）：6.8%","75公克口服葡萄糖耐糖試驗（OGTT）：2小時血糖值126 mg/dL","空腹血糖值：112 mg/dL"],"a":"D","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"糖尿病前期的診斷值","ex":"糖尿病前期：空腹血糖 100～125 mg/dL、口服葡萄糖耐量試驗 2 小時 140～199 mg/dL、糖化血色素 5.7～6.4%。A（隨機血糖 ≥200 且有症狀）、B（≥6.5%）已達糖尿病；C 的 126 mg/dL 低於 140，屬正常。"},{"id":"113-2-1102-20","p":"113-2-1102","n":20,"q":"關於降血糖藥物的主要作用機制，下列敘述何者正確？","o":["sulfonylureas類抑制腸道對葡萄糖的吸收","biguanides類刺激胰臟β-cell分泌胰島素","thiazolidinediones類減少周邊組織對葡萄糖的利用率","acarbose為α-glucosidase抑制劑，延緩醣類吸收"],"a":"D","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"口服降血糖藥的機轉","ex":"阿卡波糖抑制小腸 α-葡萄糖苷酶，延緩醣類分解吸收。磺醯脲類刺激 β 細胞分泌胰島素；雙胍類（metformin）減少肝臟葡萄糖生成；噻唑烷二酮類增加周邊組織對胰島素的敏感度與葡萄糖利用。"},{"id":"113-2-1102-21","p":"113-2-1102","n":21,"q":"針對胰島素注射的糖尿病病人應自我血糖監控（self-monitoring of blood glucose），下列例行監測時機何者最適當？","o":["每天起床後半小時內","三餐飯後及睡前","三正餐及點心前","每天監控至少8次"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"血糖自我監測的時機","ex":"使用胰島素的病人需依血糖調整劑量，例行監測時機是三餐與點心前（必要時加睡前、飯後或半夜），可據以調整下一次的胰島素。"},{"id":"113-2-1102-22","p":"113-2-1102","n":22,"q":"王小姐自小罹患腎絲球疾病（glomerular disease），一直門診追蹤控制，在大學期間發生食慾下降、疲倦乏力、嗜睡、眼皮四周及下肢水腫，體重增加，轉入院檢查後發現尿中蛋白3＋～4＋、血液albumin 1.8g/dL（低白蛋白血症）， cholesterol 580 mg/dL、Na 125 mEq/L（低血鈉），被診斷為nephrotic syndrome。請依序回答下列三題：王小姐的飲食建議為何？","o":["蛋白質每公斤體重1.5公克、低膽固醇、高鈉飲食","蛋白質每公斤體重1.5公克、低膽固醇、低鈉飲食","蛋白質每公斤體重0.8公克、低膽固醇、高鈉飲食","蛋白質每公斤體重0.8公克、低膽固醇、低鈉飲食"],"a":"D","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第7章 腎臟疾病","ch2":"8 調整蛋白質之飲食","t":"腎病症候群的飲食","ex":"腎病症候群會大量蛋白尿、低白蛋白、高膽固醇與水腫。高蛋白飲食會增加尿蛋白、加速腎功能惡化，所以蛋白質約每公斤 0.8 公克（加尿蛋白流失量）；同時限制鈉以控制水腫，並採低膽固醇飲食。低血鈉是稀釋性的，不應補高鈉。"},{"id":"113-2-1102-23","p":"113-2-1102","n":23,"q":"王小姐畢業後出國工作一直沒有追蹤腎功能，十年後返臺進行全身健康檢查發現glomerular filtration rate為42 mL/min/1.73m2 、三個月後再追蹤仍為40 mL/min/1.73m2，王小姐目前為chronic kidney disease的第幾期？","o":["G2","G3a","G3b","G4a"],"a":"C","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"慢性腎臟病的分期","ex":"依 KDIGO：G3a 是 GFR 45～59，G3b 是 30～44，G4 是 15～29（沒有 G4a）。GFR 42 與 40 持續三個月，屬 G3b。"},{"id":"113-2-1102-24","p":"113-2-1102","n":24,"q":"王小姐身高162公分、體重60公斤，平日有健身重訓，在此階段，下列何飲食處方最不適合王小姐？","o":["熱量2,100大卡、蛋白質45公克","熱量2,100大卡、蛋白質36公克","熱量2,100大卡、蛋白質90公克","熱量1,680大卡、蛋白質36公克"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第7章 腎臟疾病","ch2":"8 調整蛋白質之飲食","t":"慢性腎臟病第 3b 期的飲食處方","ex":"慢性腎臟病第 3～5 期未透析時，蛋白質每公斤 0.6～0.8 公克：60 公斤約 36～48 公克，熱量每公斤 30～35 大卡約 1,800～2,100 大卡。C 的蛋白質 90 公克（每公斤 1.5 公克）太高，最不適合；即使有重訓也不應增加蛋白質。"},{"id":"113-2-1102-25","p":"113-2-1102","n":25,"q":"預防鈣質腎結石復發的飲食原則，下列何者最不適當？","o":["降低動物性蛋白質攝取量","降低鈣質攝取量","降低鈉的攝取量","降低草酸的攝取量"],"a":"B","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第7章 腎臟疾病","ch2":"6 調整礦物質之飲食","t":"預防鈣結石復發的飲食","ex":"預防草酸鈣結石要維持正常鈣攝取，鈣在腸道可與草酸結合，減少草酸吸收；限鈣反而使草酸吸收增加。應減少動物性蛋白質、鈉與高草酸食物，並多喝水。"},{"id":"113-2-1102-26","p":"113-2-1102","n":26,"q":"65歲的丁先生平日安靜狀態下的血壓約為SBP 140～145 mmHg，DBP 85～88 mmHg。丁先生的血壓狀態如何？","o":["正常","偏高（elevated）但尚未達高血壓","高血壓第1期（stage 1）","高血壓第2期（stage 2）"],"a":"D","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"血壓的分類","ex":"依 2017 年 ACC/AHA 指引：正常 <120/<80；偏高 120～129/<80；第 1 期 130～139 或 80～89；第 2 期 ≥140 或 ≥90。收縮壓 140～145 已達第 2 期（只要一項達到就歸到較高的一級）。"},{"id":"113-2-1102-27","p":"113-2-1102","n":27,"q":"有關心臟衰竭（heart failure）病人的營養狀況和飲食治療策略，下列何者錯誤？","o":["補充維生素B12（500微克／天）可以改善左心室血液射出率和症狀","必須謹慎使用鈣補充劑，以免惡化病人心律不整","環形利尿劑治療可能增加病人維生素B1缺乏的風險","鎂缺乏與預後較差有關，應測量病人血鎂濃度"],"a":"A","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"心臟衰竭的營養","ex":"環利尿劑增加維生素 B1 排出，B1 缺乏會使心臟衰竭惡化，補充 B1 可改善射出率與症狀；所以 A 錯在 B12。鎂缺乏與預後不良有關；鈣補充要小心心律不整。"},{"id":"113-2-1102-28","p":"113-2-1102","n":28,"q":"與心血管疾病風險相關的發炎指標（Inflammatory markers），下列何者最不相關？","o":["fibrinogen","glutathione","C-reactive protein","trimethylamine-N-oxide"],"a":"B","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"心血管疾病的發炎指標","ex":"纖維蛋白原、C 反應蛋白是發炎指標；氧化三甲胺（TMAO）是腸道菌代謝膽鹼與肉鹼的產物，與動脈硬化風險相關。穀胱甘肽是細胞內的抗氧化物，不是發炎指標。"},{"id":"113-2-1102-29","p":"113-2-1102","n":29,"q":"心臟移植術後病人之營養建議，下列何者錯誤？","o":["術後長期維持日常所需之熱量需求為30～35 kcal/kg/day","術後住院期間，蛋白質建議1.3～2.0 g/kg/day","碳水化合物建議占總熱量的50%以下","術後血糖過高時，脂肪占總熱量，可大於30%"],"a":"A","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"心臟移植後的營養","ex":"依標準答案 A 錯：術後長期以維持理想體重與預防肥胖、高血脂（免疫抑制劑的副作用）為主，熱量不需要高到每公斤 30～35 大卡。術後住院期蛋白質 1.3～2.0 g/kg；類固醇使血糖升高時，醣類可降到 50% 以下，脂肪比例可以提高。"},{"id":"113-2-1102-30","p":"113-2-1102","n":30,"q":"有關重大燒燙傷後水分補充的方式及量，下列敘述何者錯誤？","o":["輸液復甦（fluid resuscitation）需在燒燙傷後24～48小時內立即進行","輸液復甦給予的量為2～4 mL/kg bw/%總燒傷面積（total body surface area, TBSA），且在燒傷後12小時內需灌輸計算總量的一半","輸液復甦完成後水分補充仍要足夠，由傷口流失的水分亦需補充，其計算公式為2～3.1 mL/kg bw/%TBSA/day","需要監測血中鈉離子含量、滲透壓之改變及體重變化來觀察液體補充之狀態"],"a":"B","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"燒傷的輸液復甦","ex":"常用的 Parkland 公式是每公斤體重每 %TBSA 給 4 毫升（指引為 2～4 毫升），其中一半在燒傷後「8 小時」內給完，其餘在之後 16 小時給。B 說 12 小時是錯的。"},{"id":"113-2-1102-31","p":"113-2-1102","n":31,"q":"當病人進行腹腔手術或是有腸道瘻管時，下列對於手術後之併發症及營養照顧敘述何者錯誤？","o":["腹腔手術後常有腹部腔室症候群（abdominal compartment syndrome），為腹腔內壓增加而造成腹腔內的器官缺血","計算腹腔手術後病人蛋白質攝取量時，需考慮腹腔引流液所造成的蛋白質流失，每流失1公升的引流液需額外給予15～30公克的蛋白質","對腹腔手術後病人如處於穩定時期，不需要額外補充灌輸液或是增壓劑，可給予腸道營養支持","如腸道瘻管液體流出超過500毫升／天時，則需要立即使用腸道營養支持方式補充營養素"],"a":"D","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"腹部手術與腸瘻管的營養","ex":"腸瘻管流出量每天超過 500 毫升屬高流量瘻管，腸道營養會增加流出量，通常改用靜脈營養並讓腸道休息。D 說要立即用腸道營養是錯的。"},{"id":"113-2-1102-32","p":"113-2-1102","n":32,"q":"目前重症病人營養治療目標，最不需要考慮下列何者？","o":["attenuate the metabolic response to stress","increase body weight","modulate immune response","prevent oxidative cellular injury"],"a":"B","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症病人的營養治療目標","ex":"重症營養治療的目標是減緩壓力代謝反應、調節免疫、預防氧化傷害、維持瘦體組織。急性期增加體重不是目標，過度餵食反而有害。"},{"id":"113-2-1102-33","p":"113-2-1102","n":33,"q":"單純飢餓與高生理壓力下之代謝比較，下列那一項最不常見？","o":["壓力下呼吸商（respiratory quotient, RQ）較低","飢餓下常會產生酮體（ketone body）","壓力下有較高的糖質新生作用及基礎能量消耗（BEE）","壓力下有較高的骨骼肌蛋白質分解及負氮平衡"],"a":"A","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"飢餓與壓力代謝的比較","ex":"單純飢餓時身體以脂肪為主要燃料，呼吸商低（約 0.7），並產生酮體。壓力下葡萄糖、蛋白質、脂肪混合氧化，糖質新生與基礎能量消耗增加，呼吸商較高，酮體少。A 說壓力下呼吸商較低是錯的。"},{"id":"113-2-1102-34","p":"113-2-1102","n":34,"q":"有關營養不良對肺部系統的影響，下列敘述何者不適當？","o":["蛋白質和鐵缺乏會使血液hemoglobin濃度下降，影響紅血球攜氧能力","當細胞內鈣、鎂、磷和鉀濃度過低時會影響呼吸肌的功能","hypoalbuminemia會使血漿中膠質滲透壓下降，可能引發肺水腫","肺病病人需注意膠原蛋白的足夠攝取，以強化肺部的結締組織"],"a":"D","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"營養不良對肺部的影響","ex":"蛋白質與鐵缺乏使血紅素下降；鈣、鎂、磷、鉀過低影響呼吸肌；低白蛋白可能引起肺水腫。肺部結締組織的膠原蛋白由身體自己合成，需要維生素 C 與足夠蛋白質，而不是吃膠原蛋白。"},{"id":"113-2-1102-35","p":"113-2-1102","n":35,"q":"慢性阻塞性肺病（COPD）病人容易罹患骨質疏鬆症（osteoporosis）的可能原因，下列何者較無關？","o":["抽菸","自體免疫疾病","類固醇的使用","維生素D缺乏"],"a":"B","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"COPD 與骨質疏鬆","ex":"COPD 病人骨質疏鬆的原因包括抽菸、長期使用類固醇、活動量少、維生素 D 缺乏與慢性發炎。COPD 不是自體免疫疾病。"},{"id":"113-2-1102-36","p":"113-2-1102","n":36,"q":"接受化療藥物的病人，當發生噁心和嘔吐時，其飲食相關建議下列何者正確？","o":["進食後，頭部位置要抬高30分鐘","增加高濃度食物，以提高熱量攝取","飯前散步促進腸胃道蠕動","供應含有液體或醬汁的食物"],"a":"A","c":"膳食療養","c2":"","ch":"第8章 腫瘤與癌症","ch2":"","t":"化療引起噁心嘔吐的飲食","ex":"進食後保持頭部抬高約 30 分鐘到 1 小時，可減少逆流與嘔吐。宜少量多餐、選清淡乾的食物，避免太甜太油；餐中少喝液體，湯汁與飲料在兩餐之間喝。"},{"id":"113-2-1102-37","p":"113-2-1102","n":37,"q":"用於癌症病人之營養篩選或評估量表，下列何者包括「活動狀態」之評估？","o":["Patient-Generated Subjective Global Assessment（PG-SGA）","Malnutrition Screening Tool（MST）","Malnutrition Universal Screening Tool（MUST）","Nutrition Risk Screening 2002（NRS 2002）"],"a":"A","c":"膳食療養","c2":"營養評估","ch":"第8章 腫瘤與癌症","ch2":"臨床評估與篩檢工具","t":"PG-SGA","ex":"PG-SGA 由病人自填體重、攝食、症狀與「活動與功能」四部分，再由醫療人員評估疾病、代謝壓力與身體檢查，是癌症病人常用的評估工具。MST、MUST、NRS 2002 沒有活動狀態的項目。"},{"id":"113-2-1102-38","p":"113-2-1102","n":38,"q":"營養評估時需獲得病人之營養相關背景資料（nutrition-related history data）包括那些？①攝食量　②活動量　③藥物　④身體功能　⑤健康行為　⑥知識與信念","o":["①②③④⑤⑥","僅①②④⑤⑥","僅①②③⑥","僅①②④⑤"],"a":"A","c":"膳食療養","c2":"營養評估","ch":"第1章 營養照護","ch2":"飲食評估","t":"食物與營養相關病史","ex":"營養照護流程中，食物／營養相關病史包括食物與營養攝取、藥物與補充品、知識與信念、行為、可取得的食物，以及身體活動與功能。六項都包括。"},{"id":"113-2-1102-39","p":"113-2-1102","n":39,"q":"阿茲海默症（Alzheimer Disease）病人進展至那一階段時會出現無法順利咀嚼並吞嚥食物的問題？","o":["amnesia","aphasia","apraxia","anorexia"],"a":"C","c":"膳食療養","c2":"","ch":"第13章 小兒科之營養照護","ch2":"","t":"阿茲海默症的吞嚥問題","ex":"失用症（apraxia）是失去有目的動作的能力，病人不知道如何咀嚼與吞嚥，食物含在口中。失憶症、失語症是記憶與語言的障礙；厭食症是食慾問題。"},{"id":"113-2-1102-40","p":"113-2-1102","n":40,"q":"有吞嚥障礙者，如需使用國際吞嚥障礙飲食標準化創辦組織（the International Dysphagia Diet Standardisation Initiative, IDDSI）第四級飲食，下列食物組合那一項較適宜？","o":["糙米飯泥、紅蘿蔔泥、紅龍果泥、豆花","糙米粥、紅蘿蔔粒、紅龍果泥、豆腐","糙米飯、紅蘿蔔丁、紅龍果丁、板豆腐","糙米飯泥、紅蘿蔔汁、紅龍果汁、豆漿"],"a":"A","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"2 調整質地之飲食","t":"IDDSI 第四級","ex":"IDDSI 第 4 級是泥狀（pureed）：質地均勻、不需咀嚼、可用湯匙舀起成形。糙米飯泥、紅蘿蔔泥、紅龍果泥、豆花都符合。粒、丁是較高等級；果汁與豆漿是飲品。"},{"id":"113-2-2102-1","p":"113-2-2102","n":1,"q":"有關營利性和非營利性團膳的敘述，下列何者正確？","o":["營利性團膳之食材成本百分比較非營利性團膳高","營利性團膳較常配合消費者喜好而改變菜單內容","營利性團膳較非營利性團膳常使用循環菜單","公立學校學童午餐屬於營利性團膳機構的一種"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"營利與非營利團膳","ex":"營利性團膳（餐廳、空廚、便當業）要吸引消費者，常依顧客喜好調整菜單；非營利性團膳（學校、醫院、軍隊）對象固定，較常用循環菜單，食材成本比例也較高。公立學校午餐屬非營利性。"},{"id":"113-2-2102-2","p":"113-2-2102","n":2,"q":"幼兒園每日供應包含早點、午餐及午點，4～6歲兒童此三餐次之脂肪攝取總量不得超過多少公克？","o":["23","27","30","33"],"a":"A","c":"膳食計畫與供應","c2":"生命期營養","ch":"菜單設計與營養基準","ch2":"幼兒與學齡期","t":"幼兒園餐點的脂肪上限","ex":"依標準答案，幼兒園 4～6 歲兒童早點、午餐、午點三餐次的脂肪總量不得超過 23 公克。"},{"id":"113-2-2102-3","p":"113-2-2102","n":3,"q":"某醫院500位員工以自助餐的方式用餐，員工可從15道菜中任選3道菜，平均每道菜應設計多少人份？","o":["45","75","100","225"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"自助餐每道菜的人份","ex":"500 人 × 每人 3 道 ＝ 1,500 份；15 道菜平均分配：1,500 ÷ 15 ＝ 每道 100 人份。"},{"id":"113-2-2102-4","p":"113-2-2102","n":4,"q":"有關循環菜單之敘述，下列何者最不適當？","o":["依機構適合之天數設計循環菜單依序循環使用","循環菜單使用多次可增加員工操作熟練度","嚴格遵守循環週期內，應盡量避免連續2天相同菜餚","若遇颱風或節慶時不須修正菜單"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"循環菜單的使用","ex":"循環菜單依機構的天數依序使用，可提高員工熟練度、方便採購與成本控制。但遇到颱風（食材缺貨、價格上漲）或節慶時，應彈性修正菜單。"},{"id":"113-2-2102-5","p":"113-2-2102","n":5,"q":"有關2019年新版食物代換表內容，下列敘述何者正確？","o":["3份（Ex）蝦米為45公克","雞蛋屬於低脂－豆魚蛋肉類","2.5份（Ex）雞胸肉為87.5公克","豬大腸屬於中脂－豆魚蛋肉類"],"a":"A","c":"膳食計畫與供應","c2":"營養學","ch":"菜單設計與營養基準","ch2":"總覽","t":"2019 年食物代換表","ex":"2019 年版：蝦米每份 15 公克，3 份 45 公克；雞蛋屬中脂豆魚蛋肉類；雞胸肉每份 30 公克，2.5 份是 75 公克；豬大腸屬超高脂。"},{"id":"113-2-2102-6","p":"113-2-2102","n":6,"q":"依教育部公告之「學校午餐食物內容及營養基準」，下列關於午餐設計應注意事項，何者正確？","o":["每日至少有2種以上蔬菜供應","油炸品頻率1週不超過3次","公告菜單只需呈現菜餚名稱","應儘量避免提供甜品，供應頻率1週不超過2次"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"學校午餐食物內容及營養基準","ex":"基準規定每天至少供應 2 種以上蔬菜（其中 1 種為深色蔬菜）。油炸品與甜品的頻率要依基準的限制；公告菜單除菜餚名稱外，還要標示食材、份數與熱量等資訊。"},{"id":"113-2-2102-7","p":"113-2-2102","n":7,"q":"有關食品包裝標示之敘述，下列何者正確？","o":["營養標示中的「糖」是指食品製造過程中額外添加之單醣和雙醣的總和","大豆沙拉油依規定應標示含有致過敏性內容物警語","使用基因改造食品原料若終產品已不含轉殖基因片段或轉殖蛋白質者得免全標示","需經復水的產品若未有營養宣稱，則可用復水前或後為標示基準，並須註明其復水方式"],"a":"D","c":"膳食計畫與供應","c2":"食品衛生與安全","ch":"菜單設計與營養基準","ch2":"食品安全衛生法規","t":"包裝食品標示","ex":"需復水的產品若沒有營養宣稱，可以用復水前或復水後為基準標示，但要註明復水方式。營養標示的「糖」是單醣與雙醣的總和，包括天然存在的；高度精製的大豆油免標過敏原；基因改造原料的高層次加工品仍要標示。"},{"id":"113-2-2102-8","p":"113-2-2102","n":8,"q":"團膳業者選擇的食材供應商應落實三級品管制度，下列何者錯誤？","o":["對於供應食材皆須主動進行源頭管理並記錄","自設檢驗室逐批檢驗食材屬於第一級品管制度","團膳業者進行稽查抽驗屬於第三級品管制度","將食材送交第三方驗證單位檢驗屬於二級品管制度"],"a":"C","c":"團體膳食製備","c2":"食品衛生與安全","ch":"採購與驗收","ch2":"食品安全衛生法規","t":"三級品管","ex":"三級品管：第一級是業者自主管理（含自設檢驗室）；第二級是委託第三方驗證機構驗證或檢驗；第三級是政府主管機關的稽查抽驗。團膳業者自己稽查屬第一級，C 錯。"},{"id":"113-2-2102-9","p":"113-2-2102","n":9,"q":"若櫛瓜的生廢棄率為5%，收縮率為15%，1人份供應80公克，今要供應500人份，則最適採購量為多少台斤？","o":["43","50","72","83"],"a":"D","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"由廢棄率與收縮率計算採購量","ex":"熟重 80 × 500 ＝ 40 公斤；收縮率 15%：40 ÷ 0.85 ≈ 47.1 公斤可食生重；廢棄率 5%：47.1 ÷ 0.95 ≈ 49.5 公斤。1 台斤 600 公克：49.5 ÷ 0.6 ≈ 82.6，約 83 台斤。"},{"id":"113-2-2102-10","p":"113-2-2102","n":10,"q":"下列何者不屬於驗收時使用之工具或檢測試劑？","o":["磅秤","餘氯試劑","雙氧試劑","溫度計"],"a":"B","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"驗收的工具","ex":"驗收要用磅秤秤重、溫度計測冷藏冷凍溫度，必要時用雙氧水試劑檢測豆製品、麵製品是否殘留過氧化氫。餘氯試劑是檢查水或消毒液的氯濃度，不是驗收食材用的。"},{"id":"113-2-2102-11","p":"113-2-2102","n":11,"q":"庫房管理設有「庫房管制卡」，下列何者不屬於此卡的紀錄項目？","o":["進／出貨日期","結餘量","撥發量","保存期限"],"a":"D","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"庫房管制卡","ex":"庫房管制卡記錄每一品項的進貨與撥發日期、數量與結餘量，以掌握存量。保存期限標在食材包裝上，以先進先出管理，不是管制卡的記錄項目。"},{"id":"113-2-2102-12","p":"113-2-2102","n":12,"q":"下列何種蔬菜適合貯存於陰涼乾燥的地方？","o":["南瓜","萵苣","菠菜","青豌豆"],"a":"A","c":"團體膳食製備","c2":"食物學原理","ch":"貯存與庫房管理","ch2":"蔬果","t":"蔬菜的貯存","ex":"南瓜、洋蔥、馬鈴薯、地瓜等根莖與瓜類外皮厚，適合放在陰涼乾燥處。萵苣、菠菜等葉菜與青豌豆易失水萎凋，要冷藏。"},{"id":"113-2-2102-13","p":"113-2-2102","n":13,"q":"製備1份綜合水果沙拉，內含可食之五爪蘋果50 g、香吉士32.5 g、紅西瓜45 g、泰國芭樂56 g、葡萄乾5g、低脂原味優格70 g和乳酪絲6 g，這份沙拉含有幾份（Ex）水果和乳品類？","o":["水果1.5 Ex和乳品類0.33 Ex","水果2.0 Ex和乳品類0.33 Ex","水果1.5 Ex和乳品類0.5 Ex","水果2.0 Ex和乳品類0.5 Ex"],"a":"C","c":"膳食計畫與供應","c2":"營養學","ch":"菜單設計與營養基準","ch2":"總覽","t":"水果與乳品的份數計算","ex":"依食物代換表，各種水果每份可食重量不同，加總五爪蘋果、香吉士、紅西瓜、泰國芭樂、葡萄乾約為 1.5 份水果。低脂優格與乳酪絲合計約 0.5 份乳品。"},{"id":"113-2-2102-14","p":"113-2-2102","n":14,"q":"為了提升油炸油的穩定與品質，有關調整油脂物化特性的方法，下列何者正確？","o":["提高食用油的酸價","選擇已產生聚合作用的油脂","選擇發煙點較高的油炸油較為安全","添加乳化劑降低油脂黏度以增加炸油穩定性"],"a":"C","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"油脂","t":"油炸油的選擇與品質","ex":"發煙點較高的油耐高溫，油炸時較不易冒煙裂解，比較安全。酸價提高、已聚合的油都是劣化的油；乳化劑會降低發煙點並使油起泡，反而不穩定。"},{"id":"113-2-2102-15","p":"113-2-2102","n":15,"q":"有關冷凍食品的特性和應用之敘述，下列何者錯誤？","o":["冷凍裹粉產品可在凍結狀態下直接下鍋油炸，但一次下鍋量不宜過多以免油溫驟降影響品質","部分小體積的冷凍調理食品（例如湯圓等）可不需解凍直接加熱調理","冷凍肉品的保存期限通常較冷藏肉品更長","冷凍肉品如需緊急使用，可在包裝完整的情形下浸泡於流動之溫熱水中加速解凍"],"a":"D","c":"團體膳食製備","c2":"","ch":"食物製備","ch2":"","t":"冷凍食品的處理","ex":"冷凍肉品緊急解凍應在包裝完整下浸泡於流動的「冷水」中，溫熱水會讓表面進入細菌易生長的危險溫度帶。小體積的冷凍調理食品可以直接加熱，冷凍裹粉產品可直接油炸。"},{"id":"113-2-2102-16","p":"113-2-2102","n":16,"q":"有關豆製品之敘述，下列何者錯誤？","o":["盒裝豆腐可以直接冷藏","同重量的百頁豆腐與板豆腐熱量相近","隔天使用的板豆腐需冷藏","豆干及干絲烹煮前先加以川燙以去除可能殘留的過氧化氫"],"a":"B","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"調味料與其他","t":"豆製品的特性","ex":"百頁豆腐製程中加入大量植物油，熱量遠高於板豆腐（代換表歸為高脂）。盒裝豆腐與隔夜的板豆腐都要冷藏；豆干、干絲川燙可去除可能殘留的過氧化氫。"},{"id":"113-2-2102-17","p":"113-2-2102","n":17,"q":"關於食物製備方法之敘述，下列何者錯誤？","o":["宮保是指在菜品中加入乾辣椒","開陽白菜是指在白菜中加入乾蝦米","魚香是指在菜品添加爆香的小魚乾","回鍋肉是指將白煮豬肉再切片回鍋煸炒"],"a":"C","c":"團體膳食製備","c2":"","ch":"食物製備","ch2":"","t":"中式菜餚名稱","ex":"魚香是川菜的調味方式，用泡辣椒、薑、蒜、蔥、糖、醋調成，菜裡並沒有魚。宮保用乾辣椒；開陽是蝦米；回鍋肉是先白煮再切片回鍋炒。"},{"id":"113-2-2102-18","p":"113-2-2102","n":18,"q":"下列那一種魚肉的鐵質最高？","o":["鮪魚","鱈魚","旗魚","鮭魚"],"a":"A","c":"團體膳食製備","c2":"營養學","ch":"食物製備","ch2":"礦物質（微量）","t":"魚肉的鐵含量","ex":"紅肉魚（鮪魚、鰹魚）肌紅蛋白多，鐵含量比白肉魚（鱈魚、旗魚）高。"},{"id":"113-2-2102-19","p":"113-2-2102","n":19,"q":"配膳熱食菜餚之保溫設備其溫度宜保持在：","o":["≧18°C","≧30°C","40°C～60°C","≧60°C"],"a":"D","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"熱食的保溫溫度","ex":"熱食保溫應維持在 60℃ 以上，避開 7～60℃ 的細菌易生長溫度帶。"},{"id":"113-2-2102-20","p":"113-2-2102","n":20,"q":"依食品安全管制系統準則規定之供膳單位應成立管制小組，下列敘述何者正確？","o":["管制小組人員至少應有2名，且負責人或其指定人員為必要之成員","成員應曾接受中央主管機關認可之訓練機關（構）辦理之相關課程至少30小時，並領有合格證明書","從業期間應持續接受與本系統有關之訓練，每3年累計至少8小時","執行之工作應作成書面紀錄，連同相關文件彙整為檔案，妥善保存至少3年"],"a":"B","c":"膳食計畫與供應","c2":"食品衛生與安全","ch":"品質管理","ch2":"衛生管理與 HACCP","t":"HACCP 管制小組","ex":"食品安全管制系統準則：管制小組至少 3 人；成員要受過 30 小時以上認可課程並取得合格證明；之後每 3 年至少再訓練 12 小時；紀錄保存至少 5 年。"},{"id":"113-2-2102-21","p":"113-2-2102","n":21,"q":"某便當工廠最近不良率增加，可用下列何種圖表來確認最大的影響因素？","o":["柏拉圖","散布圖","管制圖","特性要因圖"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"品管七大手法：柏拉圖","ex":"柏拉圖把不良原因依發生次數由多到少排列，找出「重要的少數」，可確認最大的影響因素。特性要因圖（魚骨圖）是找出可能的原因；散布圖看兩變數的關係；管制圖監控製程是否穩定。"},{"id":"113-2-2102-22","p":"113-2-2102","n":22,"q":"有關學校餐廳管理內容，下列敘述何者正確？","o":["學校辦理餐飲衛生業務只能由營養師擔任督導人員","餐飲從業人員每學年應參加衛生講習至少16小時","每週至少1次餐飲衛生自主檢查表紀錄，紀錄應留存3年","每餐供應之餐食均須標示日期及餐別，冷藏10℃留存48小時"],"a":"C","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品安全衛生法規","t":"學校餐廳的衛生管理","ex":"依標準答案，學校餐廳每週至少 1 次自主衛生檢查並記錄，紀錄保存 3 年。餐食留樣應冷藏 7℃ 以下保存 48 小時；督導人員不限營養師。"},{"id":"113-2-2102-23","p":"113-2-2102","n":23,"q":"團膳公司在每餐製備完成的成品中，抽存乙份貯留備檢，應放置保存於下列何種狀況？","o":["冷藏1天","冷藏2天","冷凍1天","冷凍2天"],"a":"B","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"餐食的留樣","ex":"每餐成品抽存一份，標示日期與餐別，冷藏（7℃ 以下）保存 48 小時（2 天），以備發生食品中毒時檢驗。"},{"id":"113-2-2102-24","p":"113-2-2102","n":24,"q":"有關細菌性食品中毒，下列敘述何者錯誤？","o":["生鮮魚貝類易遭腸炎弧菌污染，只要經60℃以上並加熱15～20分鐘即可殺死腸炎弧菌","製備人員手部有傷口膿瘡直接處理食物，易致金黃色葡萄球菌感染","米飯於室溫下長期不當貯存，最容易導致沙門氏菌污染中毒","真空包裝調味豆乾因殺菌不完全，易致肉毒桿菌中毒"],"a":"C","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品微生物與食品中毒","t":"細菌性食品中毒","ex":"米飯在室溫下放太久，最常見的是仙人掌桿菌（嘔吐型）食物中毒，不是沙門氏菌。腸炎弧菌不耐熱；手部傷口與金黃色葡萄球菌有關；殺菌不完全的真空包裝豆乾可能有肉毒桿菌。"},{"id":"113-2-2102-25","p":"113-2-2102","n":25,"q":"有關HACCP的危害因子，下列敘述何者正確？","o":["抗生素殘留是物理性因子","炸油酸價過高是物理性因子","蔬菜裡面有沙子是化學性因子","烤雞肉中心溫度不足是生物性因子"],"a":"D","c":"膳食計畫與供應","c2":"食品衛生與安全","ch":"品質管理","ch2":"衛生管理與 HACCP","t":"HACCP 的危害分類","ex":"烤雞中心溫度不足使細菌存活，屬生物性危害。抗生素殘留、酸價過高是化學性；沙子是物理性。"},{"id":"113-2-2102-26","p":"113-2-2102","n":26,"q":"若每人每餐以0.3平方公尺（m2）來估算，試問欲設計供應300人份的廚房，下列何者為最適宜的廚房面積？（1m2 = 0.3025坪）","o":["24坪","28坪","80坪","90坪"],"a":"B","c":"團體膳食製備","c2":"","ch":"設備與器具","ch2":"","t":"廚房面積的估算","ex":"300 人 × 0.3 平方公尺 ＝ 90 平方公尺；90 × 0.3025 ≈ 27.2 坪，最接近 28 坪。"},{"id":"113-2-2102-27","p":"113-2-2102","n":27,"q":"廚房設計規劃中烹煮設備的排列方式與說明，下列敘述何者錯誤？","o":["廚房主要設備靠牆排成一直線為直線型排列","於空間較小或不宜採直線排列的廚房可選擇L形排列","背對背排列適用於小型廚房，又稱島嶼式排列","平行排列指廚房主要烹煮設備及工作檯橫置於廚房中間，兩工作檯中無通道"],"a":"D","c":"團體膳食製備","c2":"","ch":"設備與器具","ch2":"","t":"烹煮設備的排列方式","ex":"平行排列是設備分成兩排面對面，兩排之間是工作通道。設備放在廚房中間、背靠背、四周都可走動的才是島嶼式。D 說兩工作檯中無通道是錯的。"},{"id":"113-2-2102-28","p":"113-2-2102","n":28,"q":"有關管理員工績效策略，下列敘述何者錯誤？","o":["工作動機與能力均強者，則給予工作表現機會及適當獎勵","工作動機與能力均弱者，則給予直接降級、甚至資遣解僱","工作動機強但能力不足者，則給予訓練、任務指派協助其發展","工作能力強但動機弱者，則給予直接回饋與獎酬、參與團隊工作"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"員工績效的管理策略","ex":"動機與能力都弱的員工，應先了解原因、設定明確目標並給予訓練與督導，不是直接降級或資遣。"},{"id":"113-2-2102-29","p":"113-2-2102","n":29,"q":"關於勞工工作時間分配，依勞動基準法規定，下列敘述何者正確？","o":["雇主應置備勞工出勤紀錄（應逐日記載），並保存3年","每日正常工作時間為12小時，每週工作總時數不得超過48小時","針對無工會之事業單位，經勞資會議同意後，得將8週內之正常工作時數加以分配","雇主得視勞工照顧家庭成員需要，允許勞工彈性調整工作開始及終止之時間在2小時範圍內"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"勞動基準法的工時規定","ex":"勞基法：出勤紀錄保存 5 年；每日正常工時 8 小時、每週 40 小時；經工會（沒有工會時經勞資會議）同意，可把 8 週內的正常工時重新分配；為照顧家庭成員，可彈性調整上下班時間 1 小時。"},{"id":"113-2-2102-30","p":"113-2-2102","n":30,"q":"自助餐廳去年1年的損益表顯示，總營業額500萬元，固定費用占35%，利潤為125萬元，此餐廳損益平衡點的營業額與下列何者最接近？","o":["250萬元","300萬元","350萬元","400萬元"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"損益平衡點","ex":"固定費用 500 × 35% ＝ 175 萬；變動成本 ＝ 500 − 175 − 125 ＝ 200 萬，變動成本率 40%。損益平衡點 ＝ 175 ÷（1 − 0.4）≈ 292 萬元，最接近 300 萬元。"},{"id":"113-2-2102-31","p":"113-2-2102","n":31,"q":"食物中毒保險費屬於下列何種成本？","o":["固定成本","變動成本","人事成本","食物成本"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"固定成本","ex":"保險費不論營業量多少都要支付，屬固定成本。"},{"id":"113-2-2102-32","p":"113-2-2102","n":32,"q":"某一學生餐廳之初期存貨為20,000元，本月進貨15,000元，月底時尚有存貨12,000元，當月總營收額72,000元，則該餐廳之食物成本為多少%？","o":["24","29","32","35"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"食物成本百分比","ex":"食物成本 ＝ 期初存貨 ＋ 本期進貨 − 期末存貨 ＝ 20,000 ＋ 15,000 − 12,000 ＝ 23,000 元；23,000 ÷ 72,000 ≈ 32%。"},{"id":"113-2-2102-33","p":"113-2-2102","n":33,"q":"某團膳公司的固定成本140,000元，變動成本占售價的60%，銷售實收500,000元，其利潤為多少元？","o":["160,000元","96,000元","60,000元","6,000元"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"利潤的計算","ex":"利潤 ＝ 營收 − 變動成本 − 固定成本 ＝ 500,000 × (1 − 0.6) − 140,000 ＝ 200,000 − 140,000 ＝ 60,000 元。"},{"id":"113-2-2102-34","p":"113-2-2102","n":34,"q":"有關滅火器之保養及安裝，下列敘述何者錯誤？","o":["滅火器的放置應固定於取用方便之明顯處所","化學泡沫滅火器應每年實施1次性能檢查","二氧化碳滅火器應每年稱重1次","廚房樓地板面積每25平方公尺應放手提滅火器1枚"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"危機處理","ch2":"","t":"滅火器的保養","ex":"依標準答案 C 錯。二氧化碳滅火器是以稱重檢查藥劑是否洩漏，依消防法規的檢修頻率為每半年。"},{"id":"113-2-2102-35","p":"113-2-2102","n":35,"q":"下列何者為工作人員在工作前使用含酒精飲料或使用藥物造成職業災害的原因？","o":["不安全的行為","不安全的設備","不安全的工作環境","工作人員之危險狀況"],"a":"AD","c":"膳食計畫與供應","c2":"","ch":"危機處理","ch2":"","t":"職業災害的原因","ex":"考選部更正為 A、D 都給分。工作前喝酒或用藥是人的因素：屬於「不安全的行為」，也可以看成工作人員本身的危險狀況。設備與環境是物的因素。"},{"id":"113-2-2102-36","p":"113-2-2102","n":36,"q":"依據「食品良好衛生規範準則」，關於廁所之規定，下列敘述何者錯誤？","o":["應於明顯處標示「如廁後應洗手」之字樣","廁所應正面開向食品作業場所","設置地點應防止污染水源","不得有不良氣味"],"a":"B","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"衛生管理與 HACCP","t":"廁所的衛生規定","ex":"食品良好衛生規範準則規定廁所不得正面開向食品作業場所，以免污染；要標示「如廁後應洗手」、設在不會污染水源的地方、保持無不良氣味。"},{"id":"113-2-2102-37","p":"113-2-2102","n":37,"q":"食品作業場所之工作檯面的照明光度須在多少米燭光以上？","o":["100","200","300","540"],"a":"B","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"衛生管理與 HACCP","t":"作業場所的照明","ex":"食品良好衛生規範準則規定，工作檯面或調理檯面的光度應在 200 米燭光以上。"},{"id":"113-2-2102-38","p":"113-2-2102","n":38,"q":"在開標過程中要了解承包商是否具有衛生觀念及熟悉餐廳作業程序等專業知識，最直接的方法為何？","o":["進行面談遴選","查看經營計畫書","由廠商以往的經營實績","了解承包商的背景"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"委外廠商的評選","ex":"面談可以直接詢問並觀察承包商對衛生觀念與餐廳作業的了解。經營計畫書、過去實績、背景資料是書面或間接資訊。"},{"id":"113-2-2102-39","p":"113-2-2102","n":39,"q":"關於進口牛肉的管理，下列敘述何者錯誤？","o":["牛的脊髓、頭骨不准進口","進口牛肉僅開放3歲以下的牛肉與產品","牛肉的檢驗項目包含硝基呋喃代謝物、氯黴素、乙型受體素類、Quinolone類","牛肉出口商必須於外箱包裝上明確標示品名、原產地、製造廠、有效日期等訊息"],"a":"B","c":"團體膳食製備","c2":"食品衛生與安全","ch":"採購與驗收","ch2":"食品安全衛生法規","t":"進口牛肉的管理","ex":"我國已開放 30 月齡以上的美國牛肉，B 說只開放 3 歲以下的牛肉是錯的。脊髓、頭骨等高風險部位仍不得進口；牛肉要檢驗動物用藥殘留；外箱要標示品名、原產地、製造廠與有效日期。"},{"id":"113-2-2102-40","p":"113-2-2102","n":40,"q":"關於團膳業務委外之事業單位責任，下列敘述何者錯誤？","o":["業務交付承攬前，應告知該承攬人有關其事業工作環境","簽立合約時，應將安全管理、安全衛生管理納入合約中","承攬契約中應明確列舉可能發生的災害類型及防範措施","實施承攬人之工作人員的衛生訓練、安全防護、健康管理及自主檢查等"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"委外承攬的責任","ex":"事業單位在交付承攬前要告知工作環境與危害，並把安全衛生管理納入合約。承攬人員工的訓練、防護、健康管理與自主檢查是承攬人（廠商）自己的責任。"},{"id":"113-2-3102-1","p":"113-2-3102","n":1,"q":"關於氫離子ATP水解酶（H⁺-ATPase）的敘述，下列何者正確？","o":["位於粒線體的內膜上，可維持基質（matrix）的高H⁺濃度","位於溶酶體的膜上，可增加此胞器內部的H⁺濃度","位於細胞膜上，可視細胞內外H⁺濃度，決定運輸方向","位於細胞膜上，除了H⁺以外，亦可共同運輸HCO₃⁻，達到電位中和"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"細胞生理與膜運輸","ch2":"","t":"氫離子幫浦的位置與功能","ex":"溶酶體膜上的 V 型 H⁺-ATPase 消耗 ATP 把氫離子打進溶酶體，使內部維持 pH 約 5，水解酵素才能作用。粒線體內膜上的 ATP 合成酶是讓氫離子順著梯度流回基質合成 ATP，基質的 H⁺ 濃度反而較低；主動運輸幫浦方向固定，不會隨濃度改變。"},{"id":"113-2-3102-2","p":"113-2-3102","n":2,"q":"在小腸上皮細胞中，由幾個胺基酸組成的胜肽（peptide）會與氫離子共同被吸收？","o":["2～3個","5～10個","15～30個","大於50個"],"a":"A","c":"人體生理學與實驗","c2":"營養學","ch":"消化","ch2":"蛋白質","t":"小胜肽的吸收","ex":"雙胜肽與三胜肽經小腸刷狀緣的 PepT1 運輸蛋白，與氫離子共同運輸進入細胞，在細胞內再被胜肽酶分解為胺基酸。"},{"id":"113-2-3102-3","p":"113-2-3102","n":3,"q":"下列何者是調控人體膽固醇恆定的器官？","o":["胃","胰臟","脾臟","肝臟"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"膽固醇的恆定","ex":"肝臟合成膽固醇（HMG-CoA 還原酶受回饋調控）、以 LDL 受體回收血中膽固醇，並把膽固醇轉成膽酸由膽汁排出，是調控膽固醇恆定的主要器官。"},{"id":"113-2-3102-4","p":"113-2-3102","n":4,"q":"關於副甲狀腺素（parathyroid hormone）功能的敘述，下列何者正確？","o":["增加骨骼釋放鈣離子至血漿","促進皮膚合成維生素D","增加腸道吸收食物中的維生素D","增加腎臟小管對鈣離子的排泄作用"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"副甲狀腺素的功能","ex":"副甲狀腺素促進骨質分解釋出鈣、增加腎小管對鈣的再吸收（減少排出）、減少磷的再吸收，並活化腎臟的 1α-羥化酶生成活化維生素 D。皮膚合成維生素 D 靠紫外線。"},{"id":"113-2-3102-5","p":"113-2-3102","n":5,"q":"肥大細胞（mast cell）受到刺激活化後會引發過敏反應，主要是因為過敏原與下列何種形式的抗體接合所致？","o":["IgG","IgE","IgM","IgA"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"血液","ch2":"","t":"過敏反應的抗體","ex":"過敏原與結合在肥大細胞表面的 IgE 交互連結，使肥大細胞釋出組織胺等介質，引起第 I 型（立即型）過敏反應。"},{"id":"113-2-3102-6","p":"113-2-3102","n":6,"q":"下列何種器官或組織僅由交感神經系統支配？","o":["消化道括約肌","心肌","皮膚之汗腺","呼吸道平滑肌"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"只受交感神經支配的器官","ex":"汗腺、豎毛肌、大部分血管與腎上腺髓質只受交感神經支配；汗腺的交感節後纖維釋放乙醯膽鹼。消化道、心臟、呼吸道都受交感與副交感雙重支配。"},{"id":"113-2-3102-7","p":"113-2-3102","n":7,"q":"負責記得如何騎腳踏車的程序性記憶（procedural memory）的主要腦區為何？","o":["海馬迴","小腦","杏仁核","大腦前額葉"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"程序性記憶的腦區","ex":"騎腳踏車這類動作技能屬程序性記憶，主要由小腦與基底核負責。海馬迴負責把陳述性（事實、事件）記憶轉成長期記憶；杏仁核與情緒記憶有關。"},{"id":"113-2-3102-8","p":"113-2-3102","n":8,"q":"正常情況下，大多數在細胞代謝作用後產生的二氧化碳，在血液中主要是以何種形式被運送至肺，進而呼出體外？","o":["二氧化碳氣體","碳酸氫根（bicarbonate）離子","碳氧血紅蛋白（carboxyhemoglobin）","碳酸鎂"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"呼吸","ch2":"","t":"二氧化碳的運輸","ex":"血液中約 70% 的二氧化碳在紅血球內經碳酸酐酶轉成碳酸氫根，送到肺部再轉回二氧化碳呼出；約 20～23% 與血紅素結合為胺甲醯血紅素，約 7～10% 溶在血漿中。碳氧血紅蛋白是一氧化碳與血紅素的結合物。"},{"id":"113-2-3102-9","p":"113-2-3102","n":9,"q":"關於哺乳類動物的細胞膜，下列敘述何者錯誤？","o":["主要脂質為磷脂質（phospholipids）","細胞膜上的磷脂質（phospholipids）之間無化學鍵結","細胞膜上的膽固醇（cholesterol）不具有極性（polar）特性","細胞膜上的膽固醇（cholesterol）參與維持細胞膜之流動性"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"細胞生理與膜運輸","ch2":"","t":"細胞膜的組成","ex":"膽固醇的羥基是極性的，朝向膜外側；固醇環與側鏈是非極性的，所以膽固醇是雙極性分子，可調節膜的流動性。磷脂質之間靠疏水作用聚集，沒有共價鍵結。"},{"id":"113-2-3102-10","p":"113-2-3102","n":10,"q":"關於鐮狀細胞特徵（sickle-cell trait）疾病的敘述，下列何者正確？","o":["導致疾病發生是因血紅素之α次單位產生基因突變","導致疾病發生是因血紅素之β次單位產生基因突變","由於血紅素α次單位的多個纈胺酸（valine）被剔除所導致","由於血紅素β次單位的多個纈胺酸（valine）被剔除所導致"],"a":"B","c":"人體生理學與實驗","c2":"生物化學（二）","ch":"血液","ch2":"胺基酸與蛋白質代謝","t":"鐮刀型貧血的成因","ex":"鐮刀型貧血是血紅素 β 鏈第 6 個胺基酸由麩胺酸被「置換」為纈胺酸（單一點突變），去氧時血紅素聚集，紅血球變成鐮刀狀。不是 α 鏈，也不是纈胺酸被刪除。"},{"id":"113-2-3102-11","p":"113-2-3102","n":11,"q":"骨骼肌於等長收縮（isometric contraction）運動時，連續強直性收縮（fused tetanus）所產生之張力遠大於單次收縮（single twitch）之張力，下列敘述何者最適當？","o":["連續性動作電位傳遞之作用下，促使產生更多的力擊（power stroke）","肌腱（muscle tendon）與微絲蛋白（titin）的彈性作用，促使張力累積","肌漿質（sarcoplasm）中鈣離子減少，造成橫橋（cross-bridge）數量增加","肌凝蛋白（myosin）緩慢地與肌動蛋白（actin）結合，延長收縮作用時間"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"肌肉","ch2":"","t":"強直收縮的張力","ex":"連續的動作電位使肌漿網持續釋放鈣，細胞質鈣濃度維持在高點，更多橫橋反覆進行力擊，彈性成分也被充分拉緊，張力因此累積到單次收縮的數倍。"},{"id":"113-2-3102-12","p":"113-2-3102","n":12,"q":"腸道結構的那一部分受損，最易使腸道的免疫功能下降？","o":["環肌層","縱肌層","漿膜層","黏膜層"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"腸道的免疫屏障","ex":"腸道黏膜層包括上皮細胞的緊密連接、黏液、固有層中的淋巴組織（如培氏斑）與分泌型 IgA，是腸道免疫的主要部位，受損時免疫功能最容易下降。"},{"id":"113-2-3102-13","p":"113-2-3102","n":13,"q":"肚子餓的時候看到好吃的食物，所產生的生理反應主要機制為何？","o":["由下視丘飽食中樞引起反射","由體神經系統引起肌肉反射","由中樞神經系統引起長反射","由腸道神經系統引起短反射"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"頭期反射","ex":"看到、聞到或想到食物時，大腦經迷走神經使唾液、胃酸與胃泌素分泌增加，是由中樞神經系統引起的長反射（頭期）。腸道神經系統的短反射在食物進入腸胃後才發生。"},{"id":"113-2-3102-14","p":"113-2-3102","n":14,"q":"甲君在炎熱的夏日爬山，下列何種狀況不合理？","o":["發生熱衰竭時，會昏倒且體溫稍微增加","臉部潮紅且大量流汗，會造成血壓上升","散熱隨著運動反射性增加，體溫穩定","體溫持續上升但不出汗，會發生熱休克"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"熱環境中的生理反應","ex":"炎熱時皮膚血管擴張、大量出汗，周邊阻力下降、血量減少，血壓會下降而不是上升，嚴重時造成熱衰竭昏倒。體溫持續上升又不出汗表示體溫調節失效，是熱中暑（熱休克）。"},{"id":"113-2-3102-15","p":"113-2-3102","n":15,"q":"戰鬥或逃跑（fight-or-flight）反應及運動時，都會增加交感神經活性。此時對腎臟的影響，下列敘述何者正確？","o":["入球小動脈（afferent arteriole）舒張","腎絲球過濾速率（glomerular filtration rate）下降","增加尿液生成量","出球小動脈（efferent arteriole）收縮"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"交感神經對腎臟的影響","ex":"交感神經興奮時，入球小動脈收縮較明顯，腎血流與腎絲球過濾率下降，尿量減少，把血液留給肌肉與重要器官。"},{"id":"113-2-3102-16","p":"113-2-3102","n":16,"q":"下列何者是造成腎臟髓質組織間隙能夠維持高張性（hypertonicity）的主要原因？","o":["氯化鈉（NaCl）和尿素（urea）","氯化鈉（NaCl）和氨（ammonia）","氯化鉀（KCl）和尿酸（uric acid）","氯化鉀（KCl）和尿素（urea）"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎髓質的高張性","ex":"亨利氏環上行支把氯化鈉送到髓質間隙（逆流倍增），集尿管的尿素在抗利尿激素作用下滲入內髓質（尿素再循環），兩者共同維持髓質的高滲透壓。"},{"id":"113-2-3102-17","p":"113-2-3102","n":17,"q":"腎絲球過濾液之體積，會因大部分的鹽分及水分再吸收回血液循環而持續下降，而由腎絲球囊（glomerular capsule）過濾至近曲小管之濾液，其滲透壓大約為何？","o":["200 mOsm","300 mOsm","400 mOsm","500 mOsm"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎絲球濾液的滲透壓","ex":"腎絲球濾液除了蛋白質外，成分與血漿相近，滲透壓約 300 mOsm/kg H₂O，與血漿等滲。"},{"id":"113-2-3102-18","p":"113-2-3102","n":18,"q":"關於賽氏細胞（Sertoli cells）的敘述，下列何者正確？","o":["受黃體生成素（luteinizing hormone）調控刺激精子生成","受濾泡刺激素（follicle-stimulating hormone）調控生成雌激素（estrogen）","負責分泌睪固酮（testosterone）","形成細胞屏障，滋養發育中精子"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"賽氏細胞","ex":"賽氏細胞形成血睪屏障，滋養與支持發育中的精子；受 FSH 刺激分泌雄性素結合蛋白與抑制素，也可把睪固酮轉成雌激素。分泌睪固酮的是受 LH 調控的萊氏細胞。"},{"id":"113-2-3102-19","p":"113-2-3102","n":19,"q":"下列何種賀爾蒙的生合成是由酵素轉換而非基因表達而來？","o":["醛固酮（aldosterone）","昇糖素（glucagon）","生長激素（growth hormone）","泌乳素（prolactin）"],"a":"A","c":"人體生理學與實驗","c2":"生物化學（二）","ch":"內分泌與生殖","ch2":"脂質代謝","t":"類固醇激素的合成","ex":"醛固酮是類固醇激素，由膽固醇經一連串酵素（側鏈切割酶、羥化酶等）轉換而成，不是直接由基因轉譯出來。升糖素、生長激素、泌乳素是胜肽或蛋白質激素，由基因轉錄轉譯產生。"},{"id":"113-2-3102-20","p":"113-2-3102","n":20,"q":"下列何種賀爾蒙的作用為促進骨蝕作用（bone resorption）及血鈣增加？","o":["降血鈣素（calcitonin）","生長激素（growth hormone）","副甲狀腺素（parathyroid hormone）","骨化三醇（1, 25-dihydroxyvitamin D3）"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"副甲狀腺素與骨吸收","ex":"副甲狀腺素刺激成骨細胞分泌 RANKL，間接活化蝕骨細胞進行骨吸收，使血鈣升高。降鈣素抑制骨吸收；活化維生素 D 主要增加腸道吸收鈣。"},{"id":"113-2-3102-21","p":"113-2-3102","n":21,"q":"關於細胞介導免疫系統（cell-mediated immunity）的敘述，下列何者錯誤？","o":["主要是靠抗體防禦入侵至血液和淋巴中的外來抗原","此系統主要是攻擊病原體感染的細胞或腫瘤細胞","細胞毒性T細胞（cytotoxic T cells）參與此機制","輔助T細胞（helper T cells）間接參與此機制"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"血液","ch2":"","t":"細胞性免疫","ex":"細胞性免疫由 T 細胞執行：毒殺型 T 細胞直接殺死被感染的細胞與腫瘤細胞，輔助型 T 細胞分泌細胞激素協助。以抗體對付血液與淋巴中的抗原是 B 細胞的體液性免疫。"},{"id":"113-2-3102-22","p":"113-2-3102","n":22,"q":"關於壓力感應反射（baroreceptor reflex）的敘述，下列何者錯誤？","o":["壓力感受器（baroreceptor）主要位於主動脈體（aortic body）及頸動脈體（carotid body）","壓力感受器（baroreceptor）的感覺神經纖維動作電位頻率隨著動脈血壓上升而增加","壓力感受器（baroreceptor）的感覺神經活動通過迷走神經（vagus nerve）和舌咽神經（glossopharyngeal nerve）傳到延髓","壓力感應反射是藉由交感和副交感神經支配心臟和血管調節血壓"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"壓力感受器反射","ex":"壓力感受器位於主動脈弓與頸動脈竇。主動脈體與頸動脈體是偵測氧氣、二氧化碳與 pH 的周邊化學感受器。"},{"id":"113-2-3102-23","p":"113-2-3102","n":23,"q":"李先生的動脈收縮壓是120 mmHg，動脈舒張壓是90 mmHg，心搏出量（stroke volume）是80 mL，心律是60bpm，其總周邊阻力（total peripheral resistance）最接近下列何者？","o":["10 mmHg×min/L","20 mmHg×min/L","30 mmHg×min/L","40 mmHg×min/L"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"總周邊阻力的計算","ex":"平均動脈壓 ≈ 舒張壓 ＋（收縮壓 − 舒張壓）÷ 3 ＝ 90 ＋ 10 ＝ 100 mmHg。心輸出量 ＝ 80 mL × 60 ＝ 4.8 L/min。總周邊阻力 ＝ 100 ÷ 4.8 ≈ 21 mmHg·min/L，最接近 20。"},{"id":"113-2-3102-24","p":"113-2-3102","n":24,"q":"閉眼放鬆時，出現之腦電波（electroencephalogram）頻率範圍為下列何者？","o":["Alpha波（8～12 Hz）","Beta波（13～40 Hz）","Theta波（4～8 Hz）","Delta波（< 4 Hz）"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"腦電波","ex":"清醒、閉眼放鬆時出現 α 波（8～13 Hz）；睜眼專注時是 β 波；θ 波見於淺睡；δ 波見於深睡。"},{"id":"113-2-3102-25","p":"113-2-3102","n":25,"q":"關於呼吸頻率的調控，下列敘述何者錯誤？","o":["位於延腦的背呼吸群（dorsal respiratory group）控制吸氣運動神經元","位於延腦的腹呼吸群（ventral respiratory group）控制呼氣運動神經元","位於中腦的呼吸調節中樞（pneumotaxic center）使吸氣與呼氣更順暢","呼吸頻率也受到周邊化學接受器（peripheral chemoreceptor）所調控"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"呼吸","ch2":"","t":"呼吸的調控中樞","ex":"呼吸調節中樞（pneumotaxic center）位於「橋腦」，不是中腦，可縮短吸氣、調整呼吸頻率。延腦的背呼吸群主要控制吸氣，腹呼吸群在用力呼吸時控制呼氣；周邊化學感受器也影響呼吸。"},{"id":"113-2-3102-26","p":"113-2-3102","n":26,"q":"下列何種酵素未參與肝醣合成之反應？","o":["glycogen synthase","amylo-(1,4→1,6) transglycosylase","phosphoglucomutase","glucan transferase"],"a":"D","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"肝醣合成的酵素","ex":"肝醣合成：葡萄糖-6-磷酸經磷酸葡萄糖變位酶轉成葡萄糖-1-磷酸，再形成 UDP-葡萄糖，由肝醣合成酶延長 α-1,4 鏈，分支酶（amylo-(1,4→1,6) 轉醣苷酶）形成分支。葡聚醣轉移酶是肝醣分解時去分支酶的一部分。"},{"id":"113-2-3102-27","p":"113-2-3102","n":27,"q":"關於肝醣合成酶（glycogen synthase）的敘述，下列何者錯誤？","o":["此酵素之反應受質為glucose-6-phosphate","催化在非還原端以α(1→4) glycosidic linkage方式延長肝醣鏈","昇糖素（glucagon）可經由cyclic AMP之作用降低此酵素活性","此酵素之特定絲胺酸殘基（serine residue）被磷酸化後，則不具活性"],"a":"A","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"肝醣合成酶","ex":"肝醣合成酶的受質是 UDP-葡萄糖，不是葡萄糖-6-磷酸（G6P 是它的變構活化劑）。它在非還原端以 α-1,4 鍵延長；升糖素經 cAMP 與蛋白質激酶 A 使它磷酸化而失去活性。"},{"id":"113-2-3102-28","p":"113-2-3102","n":28,"q":"關於脂溶性維生素A與D的共同點，下列敘述何者錯誤？","o":["魚肝油中富含此兩種維生素","在構造上皆屬於類異戊烯（isoprenoid）","兩者皆有保護眼睛之功效","兩者在細胞中皆有類似荷爾蒙之作用"],"a":"C","c":"生物化學（二）","c2":"營養學","ch":"維生素與輔酶","ch2":"維生素（脂溶性）","t":"維生素 A 與 D 的共同點","ex":"魚肝油同時富含維生素 A 與 D；兩者的活性形式（視網酸、骨化三醇）都經核受體調控基因，有類似荷爾蒙的作用。維生素 A 與視覺有關，維生素 D 沒有保護眼睛的功能。"},{"id":"113-2-3102-29","p":"113-2-3102","n":29,"q":"胺基酸必經由何種作用來產生具有生物功能的胺類（amines），例如精胺（spermine）、組織胺（histamine）與多巴胺（dopamine）等物質？","o":["氧化作用（oxidation）","羥化作用（hydroxylation）","脫羧作用（decarboxylation）","甲基化作用（methylation）"],"a":"C","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"生物胺的生成","ex":"胺基酸經脫羧酶（多需要 PLP）去除羧基形成生物胺：組胺酸 → 組織胺、多巴 → 多巴胺、鳥胺酸 → 腐胺 → 精胺。"},{"id":"113-2-3102-30","p":"113-2-3102","n":30,"q":"代謝疾病alkaptonuria可能起因於無法降解下列何種胺基酸？","o":["valine","asparagine","methionine","phenylalanine"],"a":"D","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"黑尿症","ex":"黑尿症是缺乏尿黑酸氧化酶，苯丙胺酸與酪胺酸分解途徑中的尿黑酸無法分解，由尿排出後氧化變黑。"},{"id":"113-2-3102-31","p":"113-2-3102","n":31,"q":"關於雙股核酸分子：①DNA-DNA　②RNA-RNA　③DNA-RNA，對熱穩定性的比較，下列排序何者正確？","o":["①＞③＞②","①＞②＞③","②＞③＞①","②＞①＞③"],"a":"C","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"雙股核酸的熱穩定性","ex":"RNA 的 2′-羥基使雙股呈較緊密的 A 型螺旋，RNA-RNA 雙股最穩定，其次是 DNA-RNA 雜合，DNA-DNA 最低。"},{"id":"113-2-3102-32","p":"113-2-3102","n":32,"q":"何種化合物與草醯醋酸（oxaloacetate）反應進入檸檬酸循環？","o":["丙酮酸（pyruvate）","乙醯輔酶A（acetyl CoA）","輔酶A（coenzyme A）","α-酮基戊二酸（α-ketoglutarate）"],"a":"B","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"檸檬酸循環的第一步","ex":"乙醯輔酶 A 與草醯醋酸在檸檬酸合成酶作用下縮合成檸檬酸，開始檸檬酸循環。"},{"id":"113-2-3102-33","p":"113-2-3102","n":33,"q":"下列何者不參與維生素E氧化還原循環（redox cycle）？","o":["維生素B1","維生素C","穀胱甘肽（glutathione）","硒（selenium）"],"a":"A","c":"生物化學（二）","c2":"營養學","ch":"維生素與輔酶","ch2":"維生素（脂溶性）","t":"維生素 E 的再生","ex":"維生素 E 清除自由基後由維生素 C 還原再生，維生素 C 再由穀胱甘肽（及 NADPH）還原；硒是穀胱甘肽過氧化酶的成分。維生素 B1 不參與這個循環。"},{"id":"113-2-3102-34","p":"113-2-3102","n":34,"q":"關於維生素參與代謝的敘述，下列何者錯誤？","o":["Transketolase的活性可以用於評估維生素B1之營養狀況","維生素B2參與glutathione peroxidase與glutathione reductase的反應，故對紅血球有抗氧化及保護之作用","Pyruvate carboxylase需要biotin作為輔因子","Niacin缺乏與乳酸症的發生有關"],"a":"D","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"維生素參與的代謝反應","ex":"依標準答案 D 錯。乳酸堆積與 B1 缺乏較直接相關（丙酮酸去氫酶需要 TPP），菸鹼酸缺乏則是癩皮病。B2 以 FAD 參與穀胱甘肽還原酶，維持紅血球的抗氧化能力；轉酮醇酶評估 B1；丙酮酸羧化酶需要生物素。"},{"id":"113-2-3102-35","p":"113-2-3102","n":35,"q":"於糖解作用中，常見何種酵素之缺陷可能會導致紅血球之溶血性貧血？","o":["六碳糖激酶（hexokinase）","葡萄糖-6-磷酸激酶（glucose-6-phosphate kinase）","磷酸果糖激酶（phosphofructose kinase）","丙酮酸激酶（pyruvate kinase）"],"a":"D","c":"生物化學（二）","c2":"人體生理學與實驗","ch":"醣類代謝","ch2":"血液","t":"紅血球的丙酮酸激酶缺乏","ex":"紅血球沒有粒線體，只能靠糖解產生 ATP。丙酮酸激酶缺乏是糖解酵素缺陷中最常見的，ATP 不足使紅血球膜無法維持而溶血。"},{"id":"113-2-3102-36","p":"113-2-3102","n":36,"q":"下列何者是直接連結糖解作用、糖質新生、五碳糖磷酸途徑、肝醣合成與分解的重要化合物？","o":["乙醯輔酶A（acetyl-CoA）","葡萄糖-6-磷酸（glucose-6-phosphate）","丙酮酸（pyruvic acid）","草醋酸（oxaloacetate）"],"a":"B","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"葡萄糖-6-磷酸的樞紐角色","ex":"葡萄糖-6-磷酸可進入糖解、在糖質新生最後一步被水解成葡萄糖、進入五碳糖磷酸途徑，也可轉成葡萄糖-1-磷酸參與肝醣的合成與分解，是醣類代謝的樞紐。"},{"id":"113-2-3102-37","p":"113-2-3102","n":37,"q":"長期高量葡萄糖或果糖攝取，會導致肝臟何種脂質的堆積，造成非酒精性脂肪肝的生成？","o":["蠟脂","磷脂質","三酸甘油酯","肌醇三磷酸"],"a":"C","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"非酒精性脂肪肝","ex":"長期吃太多葡萄糖或果糖，肝臟把多餘的醣轉成脂肪酸（果糖繞過磷酸果糖激酶的調控，更容易生成脂肪），合成三酸甘油酯堆積在肝細胞中。"},{"id":"113-2-3102-38","p":"113-2-3102","n":38,"q":"酮體於肝臟合成後，會透過血液循環送至肝外組織，血液中的酮體主要型態為何？","o":["乙醯輔酶A（acetyl-CoA）","乙醯乙酸（acetoacetate）","β-羥基丁酸（β-hydroxybutyric acid）","β-羥甲基丁酸（β-hydroxymethylbutyric acid）"],"a":"C","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"血液中的酮體","ex":"肝臟產生的乙醯乙酸大部分被還原成 β-羥丁酸，血液中的酮體以 β-羥丁酸為主（約占 70～80%），飢餓與糖尿病酮酸中毒時比例更高。"},{"id":"113-2-3102-39","p":"113-2-3102","n":39,"q":"關於神經磷脂質（sphingolipid）的敘述，下列何者錯誤？","o":["神經磷脂質結構組成是以甘油作為骨架","存在於腦部組織中，為構成神經細胞膜的主要成分","結構碳骨架上接有脂肪酸","腦磷脂（ceramide）與神經節糖苷（ganglioside）都是屬於神經磷脂質類別"],"a":"A","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"鞘脂質","ex":"鞘脂質以鞘胺醇（sphingosine）為骨架，不是甘油；鞘胺醇接上脂肪酸形成神經醯胺（ceramide），再接上磷酸膽鹼形成鞘磷脂，接上醣類形成腦苷脂與神經節苷脂。題目把 ceramide 譯為腦磷脂，一般譯為神經醯胺。"},{"id":"113-2-3102-40","p":"113-2-3102","n":40,"q":"下列那一個apolipoprotein發生突變，將造成細胞無法獲取（uptake）低密度脂蛋白，導致高膽固醇血症？","o":["apolipoprotein A-1","apolipoprotein B-48","apolipoprotein B-100","apolipoprotein E"],"a":"C","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"LDL 受體的辨識","ex":"LDL 上唯一的脂蛋白元是 apoB-100，它是 LDL 受體辨識的配體；apoB-100 突變（家族性 apoB-100 缺陷）會使 LDL 無法被細胞攝入而造成高膽固醇血症。apoB-48 在乳糜微粒上；apoE 主要讓殘餘顆粒被肝臟攝取。"},{"id":"113-2-3102-41","p":"113-2-3102","n":41,"q":"關於血紅素（hemoglobin）的敘述，下列何者正確？","o":["運送氧氣的重要蛋白質分子，不論原核或是真核生物體內都存在","高等脊椎動物體內的血紅素，由四個次單元（tetrameric α2β2）組合而成","血紅素分子表面有兩個可以結合氧氣分子的位置","紅血球中含有2,3-bisphosphoglycerate（2,3-BPG）參與血紅素與氧分子結合的親和性，登山時體內的2,3-BPG會降低，以提高氧分子的使用效率"],"a":"B","c":"生物化學（二）","c2":"人體生理學與實驗","ch":"胺基酸與蛋白質代謝","ch2":"血液","t":"血紅素的構造","ex":"成人血紅素由兩條 α 鏈與兩條 β 鏈組成四聚體（α2β2），每個次單元有一個血基質，可結合 4 個氧分子。登山時 2,3-BPG 增加，使氧更容易釋放到組織。原核生物一般沒有血紅素蛋白。"},{"id":"113-2-3102-42","p":"113-2-3102","n":42,"q":"關於肌酸（creatine）的敘述，下列何者正確？","o":["來自於肉類及魚類食物，是身體可以自行合成的一種蛋白質，主要功能為參與能量代謝","大約95%的肌酸儲存在肝臟中","心臟受傷時可促使心肌細胞釋放肌酸激酶（creatine kinase），以增加肌酸的生成，有助於心臟的自我修護","肌酸被作為運動員的運動增補劑，被認為可促進肌肉能量代謝"],"a":"D","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"肌酸","ex":"肌酸由精胺酸、甘胺酸與甲硫胺酸合成，是含氮化合物而不是蛋白質；約 95% 儲存在骨骼肌中。補充肌酸可增加肌肉中的磷酸肌酸，作為運動增補劑。心肌受損時肌酸激酶會漏到血中，是診斷指標，不是修護機制。"},{"id":"113-2-3102-43","p":"113-2-3102","n":43,"q":"下列何者為含硒成分的metalloenzymes（含金屬離子的酵素）？","o":["Kinase","Alcohol dehydrogenase","Cytochrome oxidase","Glutathione peroxidase"],"a":"D","c":"生物化學（二）","c2":"營養學","ch":"酵素","ch2":"礦物質（微量）","t":"含硒的酵素","ex":"穀胱甘肽過氧化酶的活性位含硒半胱胺酸。細胞色素氧化酶含鐵與銅；醇去氫酶含鋅；激酶需要鎂。"},{"id":"113-2-3102-44","p":"113-2-3102","n":44,"q":"關於廣效抗生素四環黴素（tetracycline）主要作用機制的敘述，下列何者正確？","o":["抑制原核生物（prokaryotes）ATP生成","抑制原核生物（prokaryotes）DNA複製（replication）","抑制原核生物（prokaryotes）RNA轉錄作用（transcription）","抑制原核生物（prokaryotes）轉譯蛋白質作用（translation）"],"a":"D","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"四環黴素的作用機制","ex":"四環黴素結合原核生物核糖體的 30S 次單元，阻止胺基醯 tRNA 進入 A 位，抑制蛋白質轉譯。"},{"id":"113-2-3102-45","p":"113-2-3102","n":45,"q":"抗癌藥物methotrexate主要是抑制下列何種生化作用？","o":["二氫葉酸（dihydrofolate）還原作用（reduction）","生育醇（tocopherol）還原作用（reduction）","脂肪酸（fatty acid）氧化作用（oxidation）","葡萄糖（glucose）氧化作用（oxidation）"],"a":"A","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"methotrexate 的作用","ex":"methotrexate 是葉酸類似物，抑制二氫葉酸還原酶，使四氫葉酸不足，胸腺嘧啶與嘌呤無法合成，抑制快速分裂的癌細胞。"},{"id":"113-2-3102-46","p":"113-2-3102","n":46,"q":"下列何者為嘌呤（purine）之類似物（analog），可作為減緩痛風（gout）症狀之用藥？","o":["Allopurinol","8-Azaquanine","5-Fluouracil","Statin"],"a":"A","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"痛風的用藥","ex":"allopurinol 是次黃嘌呤的類似物，抑制黃嘌呤氧化酶，減少尿酸生成。5-氟尿嘧啶是嘧啶類似物的抗癌藥；statin 是降膽固醇藥。"},{"id":"113-2-3102-47","p":"113-2-3102","n":47,"q":"若哺乳動物DNA損傷時，不完整之DNA複製（replication）會發生在細胞週期（cell cycle）之那一期？","o":["G1期","G2期","M期","S期"],"a":"D","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"DNA 複製的時期","ex":"DNA 複製在細胞週期的 S 期進行。DNA 受損時，若在 S 期複製，可能發生不完整的複製。"},{"id":"113-2-3102-48","p":"113-2-3102","n":48,"q":"下列何者生化淨反應需要消耗ATP？①異化分解（catabolism）　②同化合成（anabolism）　③肌肉收縮　④神經傳遞　⑤主動運輸（active transport）　⑥被動運輸（passive transport）","o":["①③④⑤","②③④⑤","①③④⑥","②③④⑥"],"a":"B","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"需要消耗 ATP 的反應","ex":"同化作用、肌肉收縮、神經傳遞（恢復離子梯度、釋放神經傳遞物）、主動運輸都需要消耗 ATP。異化作用的淨結果是產生 ATP；被動運輸順著濃度梯度，不需 ATP。"},{"id":"113-2-3102-49","p":"113-2-3102","n":49,"q":"酵素動力學利用kcat/Km來評估酵素的催化效率（catalytic efficiency）；kcat的單位是s⁻¹，Km的單位是mol/L，kcat/Km的單位為下列何者？","o":["係數沒有單位","含量單位（mole）","時間單位（sec）","速率單位（M⁻¹s⁻¹）"],"a":"D","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"催化效率的單位","ex":"kcat 的單位是 s⁻¹，Km 的單位是 M，所以 kcat/Km 的單位是 M⁻¹s⁻¹，與二級反應速率常數相同。"},{"id":"113-2-3102-50","p":"113-2-3102","n":50,"q":"下列何種抗氧化物在粒線體內膜參與電子傳遞？","o":["硫辛酸（lipoic acid）","抗壞血酸（ascorbic acid）","輔酶Q（coenzyme Q）或稱泛醌","生育醌（tocopherol quinone）"],"a":"C","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"輔酶 Q","ex":"輔酶 Q（泛醌）是脂溶性分子，在粒線體內膜中把電子由複合體 I、II 傳到複合體 III；還原態的泛醇也有抗氧化作用。"},{"id":"113-2-4102-1","p":"113-2-4102","n":1,"q":"若以蔗糖之相對甜度1.0為基準值，下列糖類或人工甜味劑之相對甜度由高至低排列，何者正確？","o":["fructose＞sucrose＞glucose＞maltose","sucrose＞maltose＞lactose＞sorbitol","glucose＞fructose＞maltose＞lactose","aspartame＞saccharin＞fructose＞sucrose"],"a":"A","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"糖的相對甜度","ex":"以蔗糖為 1.0：果糖約 1.2～1.7、蔗糖 1.0、葡萄糖約 0.7、麥芽糖約 0.3～0.5、乳糖約 0.2～0.4、山梨醇約 0.6。阿斯巴甜約 180～200 倍、糖精約 300～500 倍，所以 D 的前兩項順序反了。"},{"id":"113-2-4102-2","p":"113-2-4102","n":2,"q":"人體無法消化纖維素（cellulose）的原因為何？","o":["人體的消化道只分泌α-amylase","人體的消化道所分泌β-amylase量不足","纖維素對人體消化道所分泌的β-amylase具有抗性","纖維素的β-鍵結太強無法水解"],"a":"A","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"人體無法消化纖維素","ex":"人體消化道只分泌水解 α-1,4 糖苷鍵的 α-澱粉酶，沒有能水解纖維素 β-1,4 鍵的纖維素酶。β-澱粉酶存在於植物，人體不分泌；纖維素的 β 鍵並不是「太強」，而是沒有對應的酵素。"},{"id":"113-2-4102-3","p":"113-2-4102","n":3,"q":"依據衛生福利部國民健康署公布之食物代換表，下列何種食物組合之醣類含量最高？","o":["蘿蔔糕100公克＋魚丸湯（含不包肉魚丸55公克）","燒餅油條一套（含燒餅80公克＋油條60公克）","玉米蛋餅（含蛋餅皮35公克＋玉米粒85公克）","餐包60公克＋酪梨牛奶（含酪梨40公克與全脂奶240毫升）"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"由食物代換表估算醣類","ex":"依食物代換表，燒餅與油條都屬全穀雜糧類（油條另含油脂），140 公克燒餅油條換算的主食份數最多，醣類最高。其他組合的蘿蔔糕、蛋餅皮、玉米、餐包份數較少，牛奶與魚丸的醣類有限。"},{"id":"113-2-4102-4","p":"113-2-4102","n":4,"q":"下列何種雙糖或多醣的糖－糖間是β鍵結？","o":["蔗糖","乳糖","肝醣","麥芽糖"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"雙醣與多醣的鍵結","ex":"乳糖是半乳糖與葡萄糖以 β-1,4 鍵結合。蔗糖是 α1→β2 鍵；麥芽糖與肝醣是 α-1,4（肝醣分支為 α-1,6）。"},{"id":"113-2-4102-5","p":"113-2-4102","n":5,"q":"肌肉及脂肪組織因缺乏下列何種酵素，無法進行糖質新生作用？","o":["pyruvate kinase","lactate dehydrogenase","glucose-6-phosphatase","acetyl CoA carboxylase"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"醣類","ch2":"醣類代謝","t":"糖質新生的關鍵酵素","ex":"糖質新生最後一步要靠葡萄糖-6-磷酸酶把 G6P 水解成葡萄糖釋出到血液，這個酵素只存在於肝臟與腎臟。肌肉缺乏它，肝醣只能供自己使用。"},{"id":"113-2-4102-6","p":"113-2-4102","n":6,"q":"下列何者是膳食纖維的特性？","o":["大量食用可促進礦物質的吸收","較容易由精製加工後的食物獲得","容易造成大腸憩室症","分為水溶性和非水溶性纖維"],"a":"D","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"膳食纖維的特性","ex":"膳食纖維依溶解度分為水溶性與非水溶性。大量攝取會與礦物質結合、降低吸收；精製加工會去除纖維；高纖飲食可預防憩室症，低纖飲食才容易造成憩室。"},{"id":"113-2-4102-7","p":"113-2-4102","n":7,"q":"下列何種胺基酸人體可以自行合成，不需從食物中獲得？","o":["白胺酸（leucine）","離胺酸（lysine）","丙胺酸（alanine）","色胺酸（tryptophan）"],"a":"C","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"非必需胺基酸","ex":"丙胺酸可由丙酮酸經轉胺作用合成，是非必需胺基酸。白胺酸、離胺酸、色胺酸是必需胺基酸。"},{"id":"113-2-4102-8"
