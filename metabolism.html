<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代謝路徑圖解</title>
<meta name="description" content="營養生化代謝路徑圖解：醣類、脂質、蛋白質、核苷酸代謝，含位置圖、環狀循環圖與填空練習">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f1;--surface:#fff;--soft:#f1ede6;--soft2:#e9e4db;--ink:#2a2723;--muted:#6f685e;--muted2:#a39b8f;--line:#e7e0d4;--line2:#cfc6b8;
--carb:#e07a2f;--lipid:#c39100;--protein:#2f72c8;--nuc:#8a56c2;--other:#1f9286;
--atp:#2e9a4e;--nadh:#2f6fd0;--nadph:#8a4fd0;--fad:#d97d1f;--co2:#7d7d7d;--vit:#c2477a;--bad:#d64545;--ok:#2e9a4e;--acc:var(--carb)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--surface:#262421;--soft:#2f2c28;--soft2:#3a3631;--ink:#eee8de;--muted:#b3aa9d;--muted2:#7d756a;--line:#3a3631;--line2:#575047}}
:root[data-theme="dark"]{--bg:#1b1a18;--surface:#262421;--soft:#2f2c28;--soft2:#3a3631;--ink:#eee8de;--muted:#b3aa9d;--muted2:#7d756a;--line:#3a3631;--line2:#575047}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;text-decoration:none;font-size:17px}
header.top .brand small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
#menu{display:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1280px;margin:0 auto}
#side{position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;padding:14px 12px 40px;border-right:1px solid var(--line)}
#q{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
#navlist a{text-decoration:none;display:block;border-radius:6px}
.nav-home{padding:6px 8px;font-weight:700}
.nav-cat{margin-top:12px}
.nav-cat-t{display:flex;justify-content:space-between;padding:4px 8px;font-weight:700;color:var(--acc);border-left:4px solid var(--acc);border-radius:0!important}
.nav-cat-t small{color:var(--muted);font-weight:400}
.nav-cat ul{list-style:none;margin:4px 0 0;padding:0}
.nav-cat li a{padding:3px 8px 3px 16px;font-size:14px;color:var(--muted)}
#navlist a:hover{background:var(--soft)}
#navlist a.on{background:color-mix(in srgb,var(--acc) 15%,var(--surface));color:var(--ink);font-weight:500}
main{padding:22px 28px 60px;min-width:0}
.page{max-width:880px}
.crumb{font-size:13px;color:var(--acc);text-decoration:none;font-weight:500}
h1{font-size:28px;margin:4px 0 0;line-height:1.3}
.en-t{color:var(--muted);margin:2px 0 14px;font-style:italic}
h3{font-size:18px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.lead{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.info{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.info th{width:120px;text-align:left;background:color-mix(in srgb,var(--acc) 10%,var(--surface));padding:8px 12px;font-weight:500;font-size:14px;vertical-align:top}
.info td{padding:8px 12px;border-top:1px solid var(--line)}
.info tr:first-child td{border-top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th{background:color-mix(in srgb,var(--acc) 12%,var(--surface));text-align:left;padding:8px 10px;white-space:nowrap}
table.grid td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.cat td:first-child{min-width:150px}
table.cat a{color:var(--acc)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin:2px 4px 2px 0;border:1px solid currentColor;line-height:1.5;background:var(--surface)}
.c-atp{color:var(--atp)}.c-nadh{color:var(--nadh)}.c-nadph{color:var(--nadph)}.c-fad{color:var(--fad)}.c-co2{color:var(--co2)}.c-vit{color:var(--vit)}.c-bad{color:var(--bad)}
.bd{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin:2px 4px 2px 0;font-weight:500;vertical-align:middle}
.bd-rl{background:var(--bad);color:#fff}.bd-irr{background:var(--soft2);color:var(--ink)}.bd-cyc{background:var(--acc);color:#fff;font-size:13px}
/* where */
.where-grid{display:flex;flex-wrap:wrap;gap:12px}
.where figure{margin:0;flex:1 1 260px;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.where figcaption{text-align:center;font-size:13px;color:var(--muted)}
.where-txt{font-size:14px;color:var(--muted);margin:6px 2px 0}
svg.body{display:block;max-height:260px;width:100%}
svg.cell{display:block;width:100%}
.olab{font-size:11px;font-weight:700}
.clab{font-size:12px}.clab.on{font-weight:700}
/* ring */
.ringwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.ring{display:block;width:100%;max-width:680px;margin:0 auto}
.rn-en{font-size:15px;font-weight:700;fill:var(--ink)}.rn-zh{font-size:13px;fill:var(--muted)}
.rnum{font-size:14px;font-weight:700;fill:#fff}
.ran{font-size:15px;font-weight:700}.ran-in{fill:var(--atp)}.ran-out{fill:var(--fad)}.ran-tag{fill:var(--muted)}
.rc1{font-size:23px;font-weight:700;fill:var(--acc)}.rc2{font-size:15px;fill:var(--muted)}
.zlab{font-size:18px;font-weight:700}.zsub{font-size:11px;fill:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px}
/* flow */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#score{font-weight:700;color:var(--acc)}
.flow{max-width:620px}
.node{--nc:var(--acc);background:var(--surface);border:2px solid var(--nc);border-left-width:7px;border-radius:12px;padding:8px 12px;position:relative}
.node b{display:block;font-size:15px}
.node small{color:var(--muted);font-size:13px}
.ntag{position:absolute;right:8px;top:-10px;color:#fff;font-size:11px;padding:0 8px;border-radius:999px;line-height:18px}
.edge{display:flex;gap:12px;padding-left:20px}
.arr{flex:none;width:28px;position:relative;display:flex;justify-content:center}
.arr::before{content:"";position:absolute;top:0;bottom:8px;left:13px;width:3px;background:var(--acc)}
.arr::after{content:"";position:absolute;bottom:0;left:7px;border:7px solid transparent;border-top:10px solid var(--acc);border-bottom:0}
.arr .num{position:relative;z-index:1;margin-top:14px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ebody{flex:1;min-width:0;padding:10px 0 12px}
.enz{display:inline-block;max-width:100%;background:color-mix(in srgb,var(--acc) 11%,var(--surface));border-left:3px solid var(--acc);border-radius:6px;padding:5px 10px}
.enz b{display:block;font-size:14px;font-weight:700}
.enz small{color:var(--muted);font-size:13px}
.meta{margin-top:4px}
.enote{font-size:13px;color:var(--muted);margin-top:2px}
.cross{font-size:13px;margin-bottom:4px;padding:2px 8px;border:1px dashed var(--line2);border-radius:6px;display:inline-block;background:var(--soft)}
.loop{margin-top:6px;border:2px dashed var(--acc);border-radius:12px;padding:8px 12px;color:var(--acc);font-weight:500}
select.q{max-width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
select.q.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
select.q.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fb{display:block;font-size:13px;font-weight:500;margin-top:3px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.q-node{padding:8px}
.br li,.keys li{margin:4px 0}
.keys ul{background:color-mix(in srgb,var(--acc) 8%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 32px;margin:0}
.br{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 32px;margin:0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;color:var(--acc);font-weight:500}
/* home */
.q3{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.q3 ol{margin:4px 0 0;padding-left:22px}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.maps section{min-width:0}
.hubwrap,.cellmapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
svg.hub,svg.cellmap{display:block;width:100%;max-width:440px;margin:0 auto}
.hn{font-size:11.5px;font-weight:700;fill:var(--ink)}.hz{font-size:10px;fill:var(--muted)}
.hl{font-size:10.5px;fill:var(--muted);font-weight:500}
.go{cursor:pointer}.go:hover rect{stroke-width:2.5}
text.go:hover{text-decoration:underline}
.cm{font-size:12.5px;font-weight:500}.cmt{font-size:13.5px;font-weight:700}.cms{font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:12px;padding:12px 14px}
.card b{color:var(--acc);font-size:16px}.card small{color:var(--muted);margin-left:6px}
.card span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
/* practice */
.nav-pr{color:var(--carb);margin-top:2px}
.lbl{font-size:14px;color:var(--muted);align-self:center}
.btn.big{font-size:16px;padding:10px 18px;margin:4px 10px 4px 0}
.prog{font-size:14px;color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pitem{position:relative;display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:8px 12px}
.pitem b{display:block;font-size:15px}.pitem small{color:var(--muted);font-size:12px}
.pitem.done{background:color-mix(in srgb,var(--acc) 7%,var(--surface))}
.pscore{position:absolute;right:8px;top:8px;font-size:12px;font-weight:700;color:var(--muted)}.pscore.full{color:var(--ok)}
.qbar2{margin:14px 0 0}.score2{font-weight:700;color:var(--acc)}
.hintbox{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hintbox summary{cursor:pointer;font-weight:500}
.learnlink{font-size:14px}.learnlink a{color:var(--acc)}
.prbanner{display:block;text-decoration:none;margin:22px 0 4px;background:var(--carb);color:#fff;border-radius:14px;padding:14px 18px}
.prbanner b{display:block;font-size:19px}.prbanner span{font-size:14px;opacity:.92}
.pn #rnd{color:var(--muted)}
/* journey */
.nav-jr{color:var(--other)}
.jrbanner{background:var(--other)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.jleft{position:sticky;top:64px}
.jmapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.jmap{display:block;width:100%;max-width:460px;margin:0 auto}
.jb{font-size:12.5px;font-weight:700}.jbs{font-size:10px;fill:var(--muted)}
.jst .jc{fill:var(--surface);stroke:var(--line2);stroke-width:2;transition:all .3s}
.jst .jn{font-size:11px;font-weight:700;fill:var(--muted)}
.jst .jl{font-size:12px;fill:var(--muted);font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.jst.past .jc{fill:color-mix(in srgb,var(--acc) 35%,var(--surface));stroke:var(--acc)}
.jst.past .jn{fill:var(--ink)}
.jst.now .jc{fill:var(--acc);stroke:var(--acc);r:13}
.jst.now .jn{fill:#fff}.jst.now .jl{fill:var(--ink);font-weight:700}
.jtok{transition:transform .8s cubic-bezier(.45,.05,.3,1)}
.jtok rect{fill:var(--ink)}.jtok text{fill:var(--bg);font-size:12px;font-weight:700}.jtokp{fill:var(--ink)}
.jctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.jctrl #jstep{font-weight:700;color:var(--acc);font-size:14px}
.jctrl .btn{font-size:15px;padding:8px 14px}.btn:disabled{opacity:.4;cursor:default}
.jctrl2{display:flex;gap:8px;margin-top:8px}
.jcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:14px 16px}
.jhead{display:flex;gap:10px;align-items:flex-start}
.jnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.jhead b{display:block;font-size:17px;line-height:1.4}
.jwhere{display:inline-block;margin-top:4px;font-size:13px;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--bc) 16%,var(--surface));color:var(--ink)}
.jform{margin:12px 0 6px;font-size:14px}.jform span,.jout span{display:inline-block;font-size:12px;color:var(--muted);margin-right:8px}
.jform b{font-size:16px;background:var(--ink);color:var(--bg);padding:1px 10px;border-radius:999px}
.jhow{margin:6px 0;padding-left:20px}.jhow li{margin:4px 0}
.jout{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--soft);font-weight:500}
.jtip{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.jlinks{margin-top:10px;font-size:14px}.jlinks a{color:var(--acc);margin-right:10px;white-space:nowrap;font-weight:500}
.jtl{list-style:none;padding:0;margin:0;counter-reset:j}
.jtl li{counter-increment:j;position:relative;padding:8px 10px 8px 42px;border-left:3px solid var(--line2);margin-left:14px;cursor:pointer;border-radius:0 8px 8px 0}
.jtl li::before{content:counter(j);position:absolute;left:-14px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jtl li.on{background:color-mix(in srgb,var(--acc) 10%,var(--surface))}.jtl li.on::before{background:var(--acc);color:#fff}
.jtl b{display:block;font-size:15px}.jtl small{color:var(--muted);font-size:13px}
.jtlb{float:right;color:#fff;font-size:11px;padding:0 8px;border-radius:999px;margin-left:6px}
.jref{font-size:14px;margin:10px 0 0;padding:8px 12px;background:color-mix(in srgb,var(--other) 9%,var(--surface));border-radius:10px}
.jref a{color:var(--other);font-weight:500;margin-left:8px;white-space:nowrap}
.jhub span{font-size:12.5px}
.fsbar{margin:6px 0 10px;font-size:15px}
.feedwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.feed{display:block;width:100%;max-width:520px;margin:0 auto}
.fo{font-size:16px;font-weight:700}.fnum{font-size:12px;font-weight:700;fill:#fff}
.flegend{list-style:none;counter-reset:f;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.flegend li{counter-increment:f;position:relative;padding:6px 10px 6px 40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:14px}
.flegend li::before{content:counter(f);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--fc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flegend b{display:block;font-size:13px;color:var(--fc)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--oc);border-radius:10px;padding:8px 12px}
.fcard b{display:block;color:var(--oc)}.fcard span{font-size:14px}
@media (max-width:860px){.jgrid{grid-template-columns:1fr}.jleft{position:static}}
/* tts */
#ttsbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(32,30,27,.95);color:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
#ttsbar.on{display:flex}
#ttsbar .tcap{flex:1;min-width:0;font-size:15px;line-height:1.5;max-height:4.5em;overflow:auto}
#ttsbar .tcap a{color:#ffd28a}
#ttsbar .tbtns{display:flex;align-items:center;gap:6px;flex:none}
#ttsbar button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#222;font-size:16px;cursor:pointer}
#ttsbar label{font-size:12px;color:#ddd}#ttsbar select{font:inherit;font-size:13px;border-radius:6px;padding:2px}
#ttsbar{flex-wrap:wrap}#ttsbar .tv select{max-width:150px}
#ttsbar .ttip{flex-basis:100%;font-size:13px;line-height:1.6}
#ttsbar .ttip button{width:auto;height:auto;border-radius:8px;padding:4px 10px;font-size:13px;background:#ffd28a}
#ttsbar #ttipt{margin-top:6px;max-height:40vh;overflow:auto}
body.tts-on main{padding-bottom:150px}
.speaking{outline:3px solid var(--acc);outline-offset:4px;border-radius:10px;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.lecbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin:4px 0 12px}
.lecbar .btn{font-size:15px;padding:8px 16px}
.script{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.script summary{cursor:pointer;color:var(--muted)}.script p{margin:8px 0}
.jcard .lecbar{margin:12px 0 0}
.termseg button{font-size:13px;padding:7px 10px}
@media (max-width:600px){#ttsbar{padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}#ttsbar .tcap{font-size:14px}#ttsbar .tbtns{flex-direction:column;gap:4px}#ttsbar button{width:36px;height:36px;font-size:14px}#ttsbar label{font-size:0}#ttsbar .tv select{max-width:96px}#ttsbar select{font-size:12px}}
/* routes */
.nav-rt{color:#c0392b}
.rtsel{font:inherit;font-size:15px;padding:7px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);max-width:100%}
.rtgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.rtmapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:64px}
svg.rtmap{display:block;width:100%;max-width:480px;margin:0 auto}
.rtn rect{fill:var(--surface);stroke:var(--line2);stroke-width:1.5}.rtn text{font-size:13px;fill:var(--muted);font-weight:500}
.rtn.org rect{fill:var(--soft);stroke:var(--ink);stroke-width:1.5}.rtn.org text{fill:var(--ink);font-weight:700}
.rtsm{font-size:11px;fill:var(--muted)}
.rtflow{stroke-dasharray:10 7;animation:rtf 0.9s linear infinite}
@keyframes rtf{to{stroke-dashoffset:-17}}
.rtlab text{font-size:10.5px;font-weight:700;fill:#fff}
.rtinfo{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--rc);border-radius:14px;padding:14px 16px}
.rtinfo>b{display:block;font-size:18px;color:var(--rc)}.rtinfo>small{color:var(--muted)}
.rtpath{margin:10px 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:15px;line-height:1.8}
.rtcarry{font-size:14px;margin-bottom:6px}.rtcarry span{display:inline-block;font-size:12px;color:#fff;background:var(--rc);border-radius:999px;padding:0 8px;margin-right:6px}
.rtinfo ul{padding-left:20px;margin:6px 0}.rtinfo li{margin:3px 0;font-size:14.5px}
.rtcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.rtcard{text-align:left;font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:10px;padding:8px 12px}
.rtcard b{display:block;font-size:14.5px}.rtcard span{font-size:12.5px;color:var(--muted)}
.rtcard.on{background:color-mix(in srgb,var(--rc) 12%,var(--surface))}
@media (max-width:860px){.rtgrid{grid-template-columns:1fr}.rtmapwrap{position:static}}
@media (prefers-reduced-motion:reduce){.rtflow{animation:none}}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px 16px 30px}
@media (max-width:900px){
  .maps{grid-template-columns:1fr}
}
@media (max-width:860px){
  #menu{display:inline-block}
  .app{display:block}
  #side{display:none;position:fixed;inset:53px 0 0 0;height:auto;background:var(--bg);z-index:15;border:0;padding:14px 16px 60px}
  body.navopen #side{display:block}
  main{padding:16px 16px 50px}
  h1{font-size:23px}
  .edge{padding-left:6px}
  .info th{width:96px;padding:8px}
}

const LECT_J = {
glucose:[
 '好，我們從一口白飯開始講。白飯裡最多的是 starch，你可以把它想成一長串 glucose 手牽手連在一起。飯一放進嘴巴，唾液裡的 salivary amylase 就開始動手，把這條長鏈剪成比較短的 dextrin。不過大家想一想，飯在嘴巴裡停留多久？其實沒幾秒就吞下去了。到了胃，胃酸很強，salivary amylase 馬上就失去活性。所以口腔只是開個頭而已，醣類真正消化的地方，在後面的小腸。',
 '食物離開胃，進到小腸的第一段 duodenum。這時候 pancreas 會送來胰液。胰液裡有 bicarbonate，先把從胃下來的酸中和掉，酵素才能好好工作。接著主角登場，就是 pancreatic amylase，大部分的 starch 都是在這裡被切開的。切完之後剩下 maltose 這種雙醣，還有一些帶著分支的 dextrin。不過要注意喔，到這裡分子還是太大，小腸細胞還吸收不了。',
 '那最後一刀在哪裡切呢？在小腸絨毛表面，我們叫它 brush border。這裡的酵素是直接長在細胞膜上的。maltase 把 maltose 切成兩個 glucose，sucrase 把 sucrose 切成 glucose 跟 fructose，lactase 把 lactose 切成 glucose 跟 galactose。這裡國考很愛考 lactose intolerance。如果 lactase 不夠，lactose 沒被切開，就一路跑到大腸給細菌吃掉，細菌一發酵，就會脹氣、拉肚子。所以請記住一句話，人體只能吸收單醣。',
 '好，現在 glucose 要進到小腸細胞，也就是 enterocyte 裡面。它搭的交通工具叫做 SGLT1，而且一定要跟鈉離子一起上車。這種運送可以逆著濃度梯度，把 glucose 一直往細胞裡送，所以叫 secondary active transport。那鈉的濃度差是誰維持的呢？是細胞底部的 sodium potassium pump，它一直消耗 ATP，把鈉打出去。fructose 就比較悠閒了，它走 GLUT5，順著濃度慢慢擴散進來，不用花能量。順便一提，生病拉肚子喝的 oral rehydration solution，裡面同時放糖和鹽，就是利用 SGLT1，把水一起帶進身體。',
 'glucose 進了小腸細胞之後，要從另一側出去，這次它走的門叫 GLUT2。出來以後進到微血管，再匯集到 portal vein，也就是肝門靜脈。這裡有一個很重要的觀念，大家一定要記起來：水溶性的營養素，像 glucose、amino acid，都是先經過 portal vein 送到肝臟。等一下講脂肪的時候，你會發現它走的路完全不一樣。',
 '肝臟是 glucose 到的第一站，你可以把它想成一個物流中心。glucose 經由 GLUT2 進到肝細胞，這一步不需要 insulin。一進來，glucokinase 馬上幫它掛上一個磷酸根，變成 glucose 6 phosphate。掛了磷酸根就出不去了，等於被鎖在細胞裡。glucokinase 有個特性，它的 Km 很高，平常血糖不高的時候它懶得工作，要等到吃飽、血糖衝上來，它才大量運作。吃飽的時候，肝臟會先把 glucose 存成 glycogen；存滿了還有多的，就轉成 fatty acid，包進 VLDL 送出去。',
 '肝臟沒有留下來的 glucose，就進到全身的血液循環，這就是我們平常量的血糖。肌肉和脂肪細胞想要拿 glucose，需要 insulin 來幫忙開門。insulin 會讓細胞把 GLUT4 從裡面搬到細胞膜上，門一打開，glucose 才進得去。那腦和紅血球呢？腦用 GLUT3，紅血球用 GLUT1，它們都不需要 insulin。這樣設計很合理，因為就算血糖偏低，腦還是要優先拿到糖。type 2 diabetes 的 insulin resistance，問題就出在 GLUT4 搬不上去，血糖就降不下來。',
 'glucose 進到肌肉細胞以後，先在 cytosol 進行 glycolysis。hexokinase 先幫它掛上磷酸根，接著經過整條路最關鍵的關卡 PFK1，最後一個 glucose 被切成兩個 pyruvate。整個 glycolysis 算下來，淨賺兩個 ATP 跟兩個 NADH，而且完全不需要氧氣。那如果氧氣不夠呢？或者像紅血球根本沒有 mitochondria 呢？這時候 pyruvate 就會變成 lactate，送回肝臟重新做成 glucose，這就是我們等一下會講的 Cori cycle。',
 '如果氧氣充足，pyruvate 就會進到 mitochondria 裡面。第一個關卡是 PDH，它把三個碳的 pyruvate 變成兩個碳的 acetyl CoA，順便放出一個 CO2。PDH 需要五個輔因子，這個一定要背：B1、B2、B3、B5，還有 lipoic acid。所以喝很多酒、缺 B1 的人，這一步就卡住了，pyruvate 只好變成 lactate 堆起來。acetyl CoA 接著進入 TCA cycle，轉一圈會放出兩個 CO2。到這裡，glucose 原本的六個碳，已經全部變成 CO2 了。',
 '大家可能會問，碳都變成 CO2 了，那能量去哪裡了？其實能量大部分還存在 NADH 跟 FADH2 裡面，你可以把它們想成充飽電的電池。這些電池送到 mitochondria 的內膜，在 electron transport chain 放電。電子一路傳下去，最後交給 oxygen，變成水。在傳電子的同時，proton 被打到膜外面，形成濃度差，proton 再流回來的時候，就推動 ATP synthase 做出大量的 ATP。一個 glucose 完全燒完，大約可以得到三十到三十二個 ATP。要特別注意，我們吸進來的 oxygen，最後是變成水，不是變成 CO2。',
 '好，旅程的終點到了。CO2 會溶在血液裡，主要以 bicarbonate 的形式送到肺，再呼出去。水就留在身體裡，我們叫它 metabolic water。ATP 呢，就拿去讓肌肉收縮、做主動運輸、合成身體需要的東西。最後我們整個串起來：glucose 在小腸被切出來，靠 SGLT1 吸收，經過 portal vein 先到肝，再靠 GLUT4 進到肌肉，在 cytosol 做 glycolysis，在 mitochondria 燒完。這就是一口飯完整的旅程。'
],
fat:[
 '這一趟我們來追一口油，也就是 triglyceride。大家先記住脂肪最大的特色：它不溶於水。可是我們身體裡到處都是水，所以這趟旅程你會一直看到，身體想盡辦法把油包起來運送。在嘴巴和胃裡面，lingual lipase 和 gastric lipase 會分解一點點的油，這對喝母乳的嬰兒比較重要。大人的話，胃主要是靠攪拌，把油打散成比較大的油滴，真正的消化要等到小腸。',
 '油滴一進到 duodenum，小腸就會分泌一個荷爾蒙叫 CCK。CCK 做兩件事：讓 gallbladder 收縮，把 bile 擠出來，同時叫 pancreas 送酵素過來。bile 裡的 bile salts 就像洗碗精，把大油滴打散成很多小油滴，這叫 emulsification。油滴變小，表面積變大，酵素才有地方下手。接著 pancreatic lipase 在 colipase 的幫忙下，把 triglyceride 切成一個 monoglyceride 和兩個 fatty acid。這裡要小心，bile salts 只負責乳化，它本身不是酵素。',

 '終於進到 mitochondria，開始 beta oxidation。每一輪有四個步驟，口訣是：oxidation、hydration、oxidation、thiolysis。每轉一輪，就從碳鏈切下兩個碳，變成一個 acetyl CoA，同時產生一個 FADH2 跟一個 NADH。像十六個碳的 palmitate，要轉七輪，最後得到八個 acetyl CoA。還有一點，beta oxidation 一定要有氧氣才能進行，所以脂肪只能在有氧的情況下燃燒。',

protein:[

ketogenesis:['ketogenesis 是肝臟把多出來的 acetyl CoA 做成 ketone bodies，在 mitochondria 裡面進行。',
 '什麼時候會大量做 ketone bodies？飢餓、極低醣飲食，還有 type 1 diabetes 缺 insulin 的時候。這時候 oxaloacetate 被拿去做 glucose，acetyl CoA 進不了 TCA cycle，只好轉成 ketone bodies。ketone bodies 有三種，其中 acetone 會從呼吸排出，聞起來有水果味。太多的話就會變成 diabetic ketoacidosis。'],
ketolysis:['肝臟做好的 ketone bodies，會送到腦、心臟和肌肉，在那裡重新變回 acetyl CoA 拿來燒。',

'fa-synthesis':['吃飽的時候，多出來的糖會在肝臟和脂肪組織變成脂肪，這叫 fatty acid synthesis，在 cytosol 進行。',
 '有個小麻煩：acetyl CoA 是在 mitochondria 做的，可是它自己出不來，所以要先變成 citrate 運出來，這叫 citrate shuttle。限速酶是 acetyl CoA carboxylase，需要 biotin，insulin 會讓它更活躍。做一個 palmitate 要用掉十四個 NADPH，這些 NADPH 主要來自 pentose phosphate pathway。'],
elongation:['palmitate 做好以後，可以在 endoplasmic reticulum 把它加長，或是加上雙鍵，讓脂肪酸的種類變多。',
 '這裡最重要的考點是 essential fatty acid。人體只能在比較前面的位置加雙鍵，後面的位置做不到，所以 linoleic acid 跟 alpha linolenic acid 一定要從食物攝取。omega 6 最後會變成 arachidonic acid，omega 3 會變成 EPA 跟 DHA，兩個系列會搶同一組酵素。'],
'tag-synthesis':['TAG synthesis 就是把 glycerol 當骨架，接上三條 fatty acid，做成我們儲存的油。',
 '脂肪組織做 TAG 的時候，glycerol 骨架要從 glucose 來，所以脂肪組織要囤油，也需要糖。小腸則是用吸收進來的 monoglyceride 直接重組。如果肝臟做太多 TAG，又送不出去，就會堆在肝臟裡，變成 fatty liver。'],
phospholipid:['phospholipid 是細胞膜最主要的材料，在 endoplasmic reticulum 合成，其中最重要的是 phosphatidylcholine，也就是大家常聽到的 lecithin。',
 'phosphatidylcholine 除了做細胞膜，還是肝臟包裝 VLDL 一定要用的材料。所以如果 choline 吃不夠，肝臟做好的油送不出去，就會變成 fatty liver。肺裡面幫助肺泡張開的 surfactant，主成分也是它。'],
cholesterol:['cholesterol 主要在肝臟合成，原料一樣是 acetyl CoA。',
 '這條路的限速酶是 HMG CoA reductase，降膽固醇的藥 statin 就是作用在這裡。其實身體每天自己做的 cholesterol，比吃進來的還多。cholesterol 可以拿來做細胞膜、bile acid、荷爾蒙，還有 vitamin D，所以它不是只有壞處。'],
'bile-acid':['bile acid synthesis 是身體排掉 cholesterol 最主要的方法，在肝臟進行。',
 '限速酶是 7 alpha hydroxylase。做好的 bile acid 送到腸道幫忙消化脂肪，大約百分之九十五會在 ileum 被回收，送回肝臟再用。水溶性膳食纖維會黏住 bile acid，讓它排出去，肝臟只好再拿 cholesterol 去補做，血液裡的 cholesterol 就降下來了。'],
steroid:['steroid hormone 都是用 cholesterol 做的，主要在 adrenal cortex 和性腺。',
 '第一步是把 cholesterol 變成 pregnenolone，這是限速步驟，ACTH 會促進它。adrenal cortex 分三層，口訣是鹽、糖、性：最外層做 aldosterone 管鹽分，中間層做 cortisol 管血糖，最裡層做 androgen。如果 21 hydroxylase 天生缺乏，就是 congenital adrenal hyperplasia。'],
vitd:['vitamin D 要經過三個地方才會活化：皮膚、肝臟、腎臟。',
 '皮膚曬到陽光做出 vitamin D，到肝臟加工成 25 hydroxyvitamin D，這是血液裡儲存的形式，我們驗 vitamin D 就是驗它。最後到腎臟，變成有活性的 calcitriol。所以慢性腎臟病的病人，最後這一步做不好，要直接補充活性 vitamin D。'],
eicosanoid:['eicosanoid 是從二十個碳的脂肪酸做出來的局部荷爾蒙，包括 prostaglandin、thromboxane 和 leukotriene，跟發炎、凝血都有關係。',
 '第一步是 phospholipase A2 把 arachidonic acid 從細胞膜放出來，類固醇藥物就是擋這一步來消炎。下一步是 COX，aspirin 就是擋 COX，所以可以止痛，也能預防血栓。從 omega 6 做出來的偏向促進發炎，從 omega 3 做出來的作用比較溫和，這就是 fish oil 能抗發炎的原因。'],
lipoprotein:['油不溶於水，要包成 lipoprotein 才能在血液裡運送。我們來看肝臟送出的 VLDL，是怎麼一步一步變成 LDL 的。',
 'lipoprotein 大家記四種就好：chylomicron 運吃進來的油；VLDL 運肝臟做的油；LDL 把 cholesterol 送到全身，所以叫壞膽固醇；HDL 把多的 cholesterol 收回肝臟，所以叫好膽固醇。如果 LDL receptor 天生有問題，LDL 收不回來，就是 familial hypercholesterolemia。'],
transamination:['amino acid 要分解，第一步通常是 transamination，就是把身上的胺基，轉交給另一個分子。',
 '最重要的兩個酵素是 ALT 和 AST，它們都需要 vitamin B6。ALT 主要在肝臟，所以肝發炎的時候 ALT 會特別高，這就是健檢報告上的肝指數。胺基多半交給 alpha ketoglutarate，變成 glutamate，集中起來再一起處理。'],
deamination:['transamination 把胺基集中到 glutamate 身上以後，肝臟再把 ammonia 從 glutamate 上拿下來，這叫 oxidative deamination。',
 '這兩步合起來，就是 amino acid 脫掉氮的主要方式。肝臟以外的組織，會把 ammonia 接到 glutamate 上變成 glutamine，這樣就能安全地在血液裡運送。'],
urea:['ammonia 對腦有毒，所以肝臟要把它變成沒有毒、又溶於水的 urea，這就是 urea cycle。它比較特別，是橫跨 mitochondria 和 cytosol 的。',
 '我們來整理一下。urea 上面的兩個氮，一個來自 ammonia，一個來自 aspartate。做一個 urea 要花三個 ATP。限速酶是 CPS1。肝硬化的病人這個循環做不好，ammonia 會堆積，影響腦部，所以飲食要控制蛋白質，也常會使用 branched chain amino acid 的配方。'],
'carbon-skeleton':['amino acid 拿掉胺基以後，剩下的碳骨架會從不同的入口進入代謝，決定它能不能拿來生糖。',
 '能進到 TCA cycle 中間站的，可以變成 glucose，叫 glucogenic；只能變成 acetyl CoA 的，只能做 ketone bodies，叫 ketogenic。只能生酮的只有兩個：leucine 跟 lysine。兩種都可以的有五個：isoleucine、phenylalanine、tyrosine、tryptophan、threonine。其他的都是生糖的。'],
neaa:['non essential amino acid 是身體可以自己做的 amino acid，原料大多是醣類代謝的中間產物。',
 '大家比較要注意的是兩個條件性必需的：cysteine 要用 methionine 來做，tyrosine 要用 phenylalanine 來做。所以 PKU 的病人沒辦法把 phenylalanine 變成 tyrosine，對他們來說，tyrosine 就變成一定要吃的了。'],
'phe-tyr':['phenylalanine 先在肝臟變成 tyrosine，tyrosine 再拿去做很多重要的東西，像 dopamine、epinephrine、甲狀腺素和黑色素。我們來看做 epinephrine 這一條。',
 '第一步的酵素如果天生缺乏，就是 PKU，phenylketonuria。PKU 的寶寶要限制 phenylalanine，連代糖 aspartame 都不能吃，這也是新生兒篩檢的項目。另外，如果做黑色素的酵素有問題，就是 albinism。'],
tryptophan:['tryptophan 可以做成 serotonin 和 melatonin，在肝臟還可以做成 niacin。我們先看 serotonin 和 melatonin 這一條。',
 'serotonin 跟情緒有關，melatonin 跟睡眠有關，天黑的時候做得比較多。tryptophan 也能做成 niacin，大約六十毫克換一毫克。所以如果主食都是玉米，niacin 和 tryptophan 都不夠，就會得 pellagra。'],
bcaa:['branched chain amino acid 是 leucine、isoleucine、valine 這三個。它們跟其他 amino acid 不太一樣，主要是在肌肉裡分解，而不是在肝臟。',
 '如果分解它們的酵素天生缺乏，就是 maple syrup urine disease，尿液聞起來像楓糖漿，會傷害神經，飲食要限制這三種 amino acid。肝病的病人反而會補充 branched chain amino acid，因為肌肉可以直接拿來用。'],
methionine:['methionine cycle 在肝臟進行，它的工作是提供甲基，同時把用過的 homocysteine 回收。',
 'SAM 是身體最主要的甲基來源。用完以後會變成 homocysteine，要回收的話需要 B12 和 folate，或是走另一條需要 B6 的路。所以 folate、B12、B6 只要缺一個，homocysteine 就會升高，心血管疾病的風險也跟著升高。'],
'heme-synthesis':['heme 是血紅素裡面抓氧氣的那個部分，主要在骨髓和肝臟合成，原料是 glycine 和 succinyl CoA。',
 '限速酶是 ALA synthase，需要 vitamin B6。鉛中毒會卡住這條路的兩個酵素，造成貧血。這條路也是橫跨 mitochondria 和 cytosol 的，大家記口訣「糖尿血」，這個「血」就是 heme。'],
'heme-degradation':['紅血球大約活一百二十天，老的紅血球在脾臟被拆掉，裡面的 heme 會被分解成 bilirubin，最後排出去。',
 'bilirubin 一開始不溶於水，要黏著 albumin 送到肝臟。肝臟幫它接上 glucuronic acid，變得溶於水，再跟著膽汁排出去。新生兒的這個酵素還不成熟，所以很多寶寶出生後會有黃疸。'],
'aa-derivatives':['amino acid 除了拿來蓋蛋白質，還會被做成很多有功能的小分子。',
 '大家記幾個常考的：tyrosine 做 dopamine 和 epinephrine，tryptophan 做 serotonin，histidine 做 histamine，glutamate 做 GABA，arginine 做 nitric oxide，三個 amino acid 一起做 creatine，還有 glutathione 也是三個 amino acid 組成的。這類反應大多需要 vitamin B6。'],
'purine-denovo':['purine 是 adenine 和 guanine，是做 DNA 和 RNA 的材料。它的合成方式很特別，是直接在 ribose 上面一塊一塊把環蓋起來。',
 '蓋 purine 環的材料有 glycine、aspartate、glutamine，還有 folate 提供的碳。所以抗癌藥 methotrexate 擋住 folate，就能讓快速分裂的細胞做不出 DNA。'],
'purine-salvage':['自己從頭做 purine 很花能量，所以身體也會把拆下來的 purine 撿回來再用，這叫 salvage pathway。',
 '負責回收的主要酵素是 HGPRT。如果它天生完全缺乏，就是 Lesch Nyhan syndrome，purine 回收不了，尿酸大量增加，還會有自殘行為。'],
pyrimidine:['pyrimidine 是 cytosine、thymine、uracil。跟 purine 相反，它是先把環做好，最後才接到 ribose 上面。',
 '這裡要小心不要搞混：做 pyrimidine 的是 CPS2，在 cytosol；urea cycle 用的是 CPS1，在 mitochondria。名字很像，但是位置跟功能都不一樣。'],
dntp:['DNA 用的糖是 deoxyribose，要從 RNA 的 ribose 還原來；而且 DNA 用的是 thymine，不是 uracil，所以要另外做。',
 '這兩步都是抗癌藥的目標，因為癌細胞分裂很快，最需要做 DNA。這裡也需要 folate，所以 folate 或 B12 不夠的時候，DNA 做不出來，骨髓的紅血球長不好，就會出現 megaloblastic anemia。'],
'purine-degradation':['purine 分解到最後會變成 uric acid，跟痛風直接有關。',
 '最後兩步都是 xanthine oxidase 負責，痛風的藥 allopurinol 就是擋住它。人類沒辦法再把尿酸分解下去，尿酸又不太溶於水，太多就會結晶，變成 gout。所以痛風的人要少吃內臟、海鮮、濃肉湯，也要少喝酒、多喝水。'],
alcohol:['喝下去的 ethanol 主要在肝臟代謝，先變成 acetaldehyde，再變成 acetate。',
 '台灣大約一半的人，ALDH2 這個酵素比較弱，acetaldehyde 代謝得慢，所以一喝酒就臉紅、心跳快，長期喝酒食道癌的風險也比較高。代謝酒精會做出大量的 NADH，讓肝臟比較不會燒脂肪、反而容易做脂肪，這就是酒精性脂肪肝的原因。'],
drug:['藥物和毒物大多是油溶性的，肝臟要把它們變成水溶性，才能排出去。這分成兩個階段。',
 '第一階段主要靠 cytochrome P450，幫藥物加上一個把手；第二階段再接上 glucuronic acid 這類分子，讓它溶於水。大家常聽到吃藥不要配葡萄柚汁，就是因為葡萄柚會擋住 P450，讓某些藥在血液裡的濃度變得太高。'],
antioxidant:['細胞在代謝的時候，會產生一些自由基，抗氧化系統就是負責把它們清掉。',
 'SOD 需要銅、鋅或錳，glutathione peroxidase 需要 selenium。glutathione 用完以後，要靠 NADPH 把它還原回來，而 NADPH 來自 pentose phosphate pathway。所以 G6PD 缺乏的人，NADPH 不夠，紅血球就容易被氧化而破掉。'],
vitk:['vitamin K cycle 在肝臟進行，它的工作是活化凝血因子，讓血液可以凝固。',
 'vitamin K 可以重複使用，所以每天需要的量很少。抗凝血藥 warfarin 就是卡住這個循環。有吃 warfarin 的病人，不是完全不能吃深綠色蔬菜，而是每天吃的量要固定。新生兒出生時會打一針 vitamin K，就是為了預防出血。']
};

  '葡萄糖進到細胞質，開始糖解作用。先被己糖激酶磷酸化，再經過限速酶 PFK-1，一路切成兩個丙酮酸。整個糖解淨賺 2 個 ATP 和 2 個 NADH，而且不需要氧氣。如果細胞缺氧，或者像紅血球根本沒有粒線體，丙酮酸就會變成乳酸，送回肝臟重新做成葡萄糖，這就是 Cori 循環。',
  '有氧的時候，丙酮酸會進入粒線體。第一關是丙酮酸去氫酶複合體，簡稱 PDH，把三個碳的丙酮酸變成兩個碳的乙醯輔酶 A，同時放出一個二氧化碳。PDH 需要五個輔因子：B1、B2、B3、B5 和硫辛酸，這一定要背。乙醯輔酶 A 接著進入檸檬酸循環，轉一圈會放出兩個二氧化碳，產生 3 個 NADH、1 個 FADH2 和 1 個 GTP。到這裡，葡萄糖的六個碳已經全部變成二氧化碳了。',
  '前面收集到的 NADH 和 FADH2，像是裝滿電子的充電電池，要送到粒線體內膜上的電子傳遞鏈放電。電子一路傳過複合體一到四，最後交給氧氣，形成水。電子傳遞的同時，氫離子被打到膜間隙，形成濃度差，氫離子流回來時推動 ATP 合成酶，大量製造 ATP。一個葡萄糖完全氧化，大約可以得到 30 到 32 個 ATP。請注意：我們吸進來的氧氣，最後是變成水，不是變成二氧化碳。',
  '旅程的終點。二氧化碳主要以碳酸氫根的形式在血液中運送，到肺部呼出去；水成為體液的一部分，叫做代謝水；ATP 則拿去讓肌肉收縮、做主動運輸、合成身體需要的物質。最後幫大家整理一個數字：醣類的呼吸商是 1，脂肪大約 0.7，蛋白質大約 0.8。這樣，一個葡萄糖從飯碗到肺的旅程就走完了。'
 ]},
fat:{
 intro:'脂肪最大的特色是不溶於水，可是身體裡到處都是水。所以這趟旅程，你會一直看到身體想辦法把油「包起來」運送。',
 stages:[
  '先從嘴巴和胃開始。舌脂酶和胃脂酶會分解一點點三酸甘油酯，它們比較喜歡短鏈和中鏈的脂肪酸。對嬰兒來說，這一步在消化母乳的脂肪時比較重要。成人的話，胃主要是靠攪拌把油打散成大油滴，真正的消化還在後面。',
  '油滴進到十二指腸，會刺激小腸分泌膽囊收縮素，也就是 CCK。CCK 讓膽囊收縮、擠出膽汁，同時讓胰臟分泌酵素。膽汁裡的膽鹽像洗碗精，把大油滴乳化成很多小油滴，增加表面積。接著胰脂酶在共脂酶的幫忙下，把三酸甘油酯切成一個二號位的單酸甘油酯和兩個脂肪酸。提醒大家，膽鹽只負責乳化，它本身不是酵素。',
  '切好的單酸甘油酯和脂肪酸還是油，過不了腸壁表面那層水。這時膽鹽會把它們，連同膽固醇和脂溶性維生素 A、D、E、K，一起包成很小的微膠粒，送到刷狀緣。到了細胞表面，脂質就擴散進入細胞。膽鹽自己留在腸道裡，到迴腸末端被回收，送回肝臟再利用，這叫做腸肝循環。所以迴腸切除的病人，膽鹽回收不了，就容易脂肪痢、缺乏脂溶性維生素。',
  '進到小腸細胞以後，身體做了一件很有意思的事：把剛剛切開的東西再接回去。在內質網裡，單酸甘油酯和脂肪酸重新合成三酸甘油酯，再跟膽固醇、磷脂和 apoB-48 一起包成乳糜微粒。但是短鏈和中鏈脂肪酸不用這麼麻煩，可以直接進入肝門靜脈。所以臨床上，脂肪吸收不良的病人會使用中鏈三酸甘油酯，也就是 MCT 油。',
  '乳糜微粒的體積太大，鑽不進微血管，只好先走淋巴。它從絨毛中間的乳糜管出發，經過胸管，最後在左鎖骨下靜脈匯入血液。所以長鏈脂肪的第一站不是肝，這和葡萄糖、胺基酸完全不同。吃完一頓很油的餐點後抽血，血漿看起來會白白濁濁的，就是乳糜微粒造成的。',
  '乳糜微粒隨著血液流到脂肪組織、肌肉和心臟的微血管，在這裡遇到脂蛋白脂解酶，簡稱 LPL。LPL 要靠 apoC-II 活化，把乳糜微粒裡的三酸甘油酯切成脂肪酸和甘油卸下來。吃飽的時候胰島素高，會增加脂肪組織的 LPL，所以脂肪酸大多被存進脂肪細胞。卸完貨的乳糜殘粒，就由肝臟回收。',
  '現在換個情境，假設已經空腹一段時間。升糖素和腎上腺素會透過 cAMP 活化脂肪細胞裡的荷爾蒙敏感性脂解酶，也就是 HSL，把儲存的三酸甘油酯拆成脂肪酸和甘油；胰島素則會抑制這個酵素。脂肪酸不溶於水，要跟白蛋白結合才能在血液裡運送，送到肌肉和肝當燃料。甘油則送到肝臟去做糖質新生。這裡有個重點：脂肪酸不能變成葡萄糖，但是甘油可以。',
  '脂肪酸進到細胞以後，要先被活化。脂醯輔酶 A 合成酶把脂肪酸接上輔酶 A，變成脂醯輔酶 A。這一步會把 ATP 變成 AMP，等於花掉兩個高能磷酸鍵。等一下算棕櫚酸總共產生多少 ATP 時，記得要把這兩個扣掉。',
  '活化後的長鏈脂肪酸不能直接穿過粒線體內膜，要靠肉鹼來搬運，這叫做肉鹼穿梭。第一個酵素 CPT-I 先把脂醯基轉到肉鹼上，它就是整個 β 氧化的限速步驟。接著轉位酶把它帶過內膜，CPT-II 再在基質裡把它換回脂醯輔酶 A。合成脂肪酸時會產生丙二醯輔酶 A，它會抑制 CPT-I，這樣身體就不會一邊合成脂肪、一邊又把它燒掉。',
  '終於進到粒線體基質，開始 β 氧化。每一輪有四個步驟：氧化、水合、再氧化、硫解，口訣就是這四個詞。每轉一輪，碳鏈從尾巴切下兩個碳，變成一個乙醯輔酶 A，同時產生一個 FADH2 和一個 NADH。十六個碳的棕櫚酸要轉七輪，得到八個乙醯輔酶 A。β 氧化一定要有氧氣才能進行。',
  '最後的去向有三條。第一，乙醯輔酶 A 進入檸檬酸循環和電子傳遞鏈，燒成二氧化碳和水，棕櫚酸淨得大約 106 個 ATP，所以一克脂肪有 9 大卡。第二，在肝臟，如果飢餓或吃很低醣的飲食，乙醯輔酶 A 太多，就會轉成酮體送給腦、心臟和肌肉使用，但肝臟自己不能用酮體。第三，吃得太多的時候，就存回脂肪組織。脂肪的旅程就講到這裡。'
 ]},
protein:{
 intro:'蛋白質的旅程和前兩條不一樣。它的主要任務不是產能，而是建造身體。另外要特別留意「氮」：它最後怎麼離開身體，是這條旅程的重點。',
 stages:[
  '蛋白質的消化從胃開始。胃酸先讓蛋白質變性，把原本摺疊好的結構打開，酵素才切得進去。胃分泌的是胃蛋白酶原，它在酸性環境中被活化成胃蛋白酶，把蛋白質切成長短不一的多胜肽。為什麼要先分泌酶原？因為如果一出來就有活性，會先把自己的胃壁消化掉。',
  '進到小腸以後，胰臟送來一整組蛋白酶，但一開始也都是酶原。關鍵的開關是小腸分泌的腸激酶，它把胰蛋白酶原活化成胰蛋白酶。胰蛋白酶再去活化胰凝乳蛋白酶、彈性蛋白酶和羧肽酶。所以胰蛋白酶就像第一張骨牌。有的酵素從中間切，有的從尾端一個一個切。',
  '接著由刷狀緣上的胺肽酶和雙胜肽酶做最後的修剪，從胜肽的頭端切下胺基酸，或把雙胜肽切開。最後的產物有三種：游離胺基酸、雙胜肽和三胜肽。這三種都可以被吸收。',
  '胺基酸進入小腸細胞有好幾套運送系統，多數是和鈉一起進去的主動運輸。雙胜肽和三胜肽則走另一個運送蛋白 PepT1，是搭著氫離子進去的，而且吸收速度比游離胺基酸還快，進到細胞裡面再切成胺基酸。小腸細胞自己最喜歡的燃料是麩醯胺酸。補充一個考點：Hartnup 病是中性胺基酸的運送有缺陷，色胺酸吸收不好，會出現類似糙皮病的症狀。',
  '胺基酸經由肝門靜脈先到肝臟，肝會先拿走大部分。它用胺基酸來合成白蛋白、凝血因子這些血漿蛋白，也合成非必需胺基酸、肌酸和穀胱甘肽。但是支鏈胺基酸，也就是白胺酸、異白胺酸和纈胺酸，肝臟比較少代謝，大多被放行到肌肉去用。臨床上，血清白蛋白偏低，可以反映長期蛋白質營養不良，或者肝功能不好。',
  '胺基酸最重要的用途是合成蛋白質。細胞依照信使 RNA 的密碼，在核糖體上把胺基酸一個一個接起來，做成肌肉、酵素、激素和抗體。合成時，所有必需胺基酸都要同時到齊；最先用完、數量最不夠的那一個，叫做限制胺基酸。穀類的限制胺基酸通常是離胺酸，豆類通常是甲硫胺酸，所以飯配豆子可以互補。胺基酸也用來做神經傳導物質和血基質。',
  '如果胺基酸吃得太多，或是在飢餓的時候分解肌肉蛋白，胺基酸就會被拿來分解。第一步是轉胺作用：轉胺酶，像 ALT 和 AST，在維生素 B6 的幫忙下，把胺基交給 α 酮戊二酸，變成麩胺酸。拿掉胺基後剩下的碳骨架，可以進入檸檬酸循環產能、做糖質新生，或者變成酮體。純生酮的胺基酸只有兩個：白胺酸和離胺酸。',
  '拆下來的氮最後會變成氨，而氨對腦有毒，不能讓它在血液裡大量跑來跑去。所以肌肉會把胺基接到丙酮酸上，變成丙胺酸送到肝臟，這就是葡萄糖丙胺酸循環。其他組織則用麩醯胺酸合成酶，把氨接到麩胺酸上，變成麩醯胺酸運送。所以麩醯胺酸是血液中含量最多的胺基酸。',
  '氮送到肝臟以後，麩胺酸去氫酶先把氨釋放出來。接著進入尿素循環：前兩步在粒線體，限速酶是胺甲醯磷酸合成酶一，也就是 CPS-I，需要 N 乙醯麩胺酸來活化；後三步在細胞質，最後由精胺酸酶切出尿素。尿素上的兩個氮，一個來自氨，另一個來自天門冬胺酸。肝硬化的病人尿素循環做不好，氨堆積在血液裡，就會造成肝性腦病變。',
  '旅程的最後一站在腎臟。尿素經由血液送到腎臟，過濾後從尿液排出，抽血檢查時看到的就是血中尿素氮 BUN。腎臟也會利用麩醯胺酸產生銨離子排出，順便幫身體排酸。肌肉裡的肌酸代謝成肌酸酐，同樣由腎臟排出。所以腎衰竭的時候，BUN 和肌酸酐都會上升，慢性腎病的病人也要控制蛋白質的攝取量。蛋白質的旅程就到這裡結束。'
 ]},
feed:{
 fed:'先看吃飽的時候。剛吃完飯，血糖和胺基酸上升，胰島素是主角。胰島素的意思是：現在東西很多，趕快存起來。所以肝會合成肝醣，也會把多的葡萄糖做成脂肪酸，包進 VLDL 送出去；肌肉打開 GLUT4 吸收葡萄糖，做成肌肝醣、合成蛋白質；脂肪組織則用 LPL 把三酸甘油酯卸下來存著。腦呢？不管什麼時候，腦都用葡萄糖。',
 fast:'接下來是空腹，大約是隔夜十二到二十四小時。這時胰島素下降，升糖素上升，意思是：要開始動用存款了。肝先分解肝醣放出葡萄糖，同時開始糖質新生，原料是脂肪組織送來的甘油、肌肉送來的乳酸和丙胺酸。脂肪組織用 HSL 分解脂肪，送出脂肪酸。肌肉很懂事，改用脂肪酸當燃料，把葡萄糖留給腦。',
 starve:'最後是長期飢餓，超過三天。肝醣大約一天就用完了，這時身體的目標變成：盡量保護肌肉。脂肪組織持續分解脂肪，肝臟把大量脂肪酸變成酮體。腦慢慢適應，大約三分之二的能量改用酮體，這樣就不需要那麼多葡萄糖，也就不用一直分解肌肉蛋白來做糖質新生。這是身體很聰明的適應機制，也是國考很常考的整合題。'
}
};

  talk:'第一條，也是最重要的一條，叫做肝門靜脈循環⟦hepatic portal circulation⟧。胃、小腸、大腸、脾臟和胰臟的靜脈血，不會直接回心臟，而是先匯集到肝門靜脈⟦hepatic portal vein⟧，送進肝臟。它的特別之處，是兩端都是微血管：一端是腸道的微血管，另一端是肝臟裡的肝竇，所以叫門脈系統。小腸吸收的單醣、胺基酸、中短鏈脂肪酸、水溶性維生素和礦物質，都走這條路，先讓肝臟處理一遍，這就是藥物的首渡效應。肝臟處理完，血液經由肝靜脈⟦hepatic vein⟧進入下腔靜脈，回到右心房。考試常考：肝臟的血大約四分之三來自門靜脈，四分之一來自肝動脈。肝硬化的時候門靜脈的血流不進肝臟，壓力升高，就會出現食道靜脈曲張和腹水。'},
 {id:'lymph', zh:'淋巴路徑（乳糜微粒）', en:'Lymphatic route of chylomicrons', col:'#c39100',
  edges:['int_lym','lym_sub','sub_rh','rh_lung','lung_lh','lh_aorta','aorta_tis'],
  path:'小腸絨毛中央乳糜管 → 腸淋巴管 → 乳糜池 → 胸管 → 左鎖骨下靜脈與左頸內靜脈交會處（左靜脈角）→ 左頭臂靜脈 → 上腔靜脈 → 右心房 → 肺 → 左心 → 主動脈 → 全身微血管（LPL 卸下 TAG）',
  carry:'乳糜微粒：長鏈脂肪酸重組的三酸甘油酯、膽固醇、磷脂、脂溶性維生素 A、D、E、K',
  key:['長鏈脂肪不先經過肝臟（繞過首渡）','中鏈脂肪酸（MCT）不走淋巴，直接走門靜脈','胸管是全身最大的淋巴管；受傷時淋巴液漏到胸腔叫乳糜胸','乳糜微粒先到脂肪與肌肉，被 LPL 卸貨後，殘粒才回到肝臟'],
  talk:'第二條是淋巴路徑⟦lymphatic route⟧，專門運送脂肪。長鏈脂肪在小腸細胞裡重新組成三酸甘油酯，包成乳糜微粒⟦chylomicron⟧，因為太大進不了微血管，只能先進到絨毛中央的乳糜管⟦lacteal⟧。接著沿著腸淋巴管匯集到腹腔的乳糜池⟦cisterna chyli⟧，再往上經過胸管⟦thoracic duct⟧，在左鎖骨下靜脈和左頸內靜脈交會的地方注入血液，經左頭臂靜脈、上腔靜脈回到右心。然後經過肺、回到左心，由主動脈送到全身，在脂肪和肌肉的微血管被脂蛋白脂解酶卸下三酸甘油酯。所以重點是：長鏈脂肪吸收後不會先經過肝臟。中鏈脂肪酸則不一樣，它走門靜脈，這也是 MCT 用在脂肪吸收不良病人的原因。'},
 {id:'hepart', zh:'肝動脈（肝的雙重血液供應）', en:'Hepatic artery – dual blood supply', col:'#d64545',

  path:'左心室 → 主動脈 → 腹腔動脈幹 → 肝總動脈 → 肝固有動脈 → 肝竇（與門靜脈血混合）→ 中央靜脈 → 肝靜脈 → 下腔靜脈',
  carry:'氧氣（肝細胞所需的氧主要來自這裡），以及從全身回來的物質',
  key:['肝臟同時接受肝動脈與肝門靜脈兩套血流，在肝竇混合','肝動脈約佔肝血流 25%，但供應約一半的氧','膽管的血液主要由肝動脈供應'],
  talk:'第三條是肝動脈⟦hepatic artery⟧。肝臟很特別，它有兩套進來的血：門靜脈帶來營養，肝動脈帶來氧氣。肝動脈從主動脈經腹腔動脈幹分出來，進到肝臟以後，和門靜脈的血在肝竇裡混在一起，再一起流到中央靜脈、肝靜脈，回到下腔靜脈。肝動脈的血量只佔四分之一左右，但肝細胞需要的氧氣大約一半來自它。'},
 {id:'systemic', zh:'體循環', en:'Systemic circulation', col:'#e07a2f',

  carry:'送出：氧氣、葡萄糖、胺基酸、脂蛋白、激素；收回：二氧化碳、乳酸、尿素、代謝廢物',

  talk:'第四條是體循環⟦systemic circulation⟧，也叫大循環。血液從左心室打出去，經過主動脈、動脈、小動脈，到達全身的微血管。營養素真正交給細胞的地方就在微血管：先滲到組織間液，再經過細胞膜上的運送蛋白，例如葡萄糖用的 GLUT，進入細胞。細胞產生的二氧化碳和廢物，則經由小靜脈、靜脈，匯集到上、下腔靜脈，回到右心房。要注意的是，腸道的靜脈血不會直接回心臟，而是先經過門靜脈到肝臟，這是體循環裡的一個例外。'},

  key:['肺動脈內是缺氧血、肺靜脈內是含氧血（和體循環相反）','血液中的 CO₂ 大部分以碳酸氫根 HCO₃⁻ 形式運送','呼吸商 RQ = 產生的 CO₂ ÷ 消耗的 O₂'],
  talk:'第五條是肺循環⟦pulmonary circulation⟧，也叫小循環。營養素在粒線體被燒掉以後，碳變成二氧化碳，溶在血液裡，大部分以碳酸氫根的形式運送。血液回到右心以後，由右心室經肺動脈送到肺泡的微血管，二氧化碳在這裡排出去，同時吸進氧氣，再由肺靜脈回到左心房。要注意，肺動脈裡流的是缺氧血，肺靜脈裡流的是含氧血，剛好和體循環相反。'},
 {id:'enterohep', zh:'腸肝循環', en:'Enterohepatic circulation', col:'#2a9a6a',
  edges:['liver_gb','gb_duo','duo_int','int_portal2','portal_liver'],
  path:'肝細胞分泌膽汁 → 膽小管 → 肝管 → 膽囊（儲存濃縮）→ 總膽管 → 十二指腸 → 小腸（幫忙乳化脂肪）→ 迴腸末端再吸收 → 肝門靜脈 → 回到肝臟',

  talk:'第六條是腸肝循環⟦enterohepatic circulation⟧。肝臟用膽固醇做出膽酸，接上甘胺酸或牛磺酸變成膽鹽，隨膽汁經過肝管存到膽囊。吃到油脂時，膽囊收縮，膽汁經總膽管流進十二指腸，幫忙乳化脂肪。用完的膽鹽並沒有丟掉，大約百分之九十五會在迴腸末端被再吸收，經門靜脈送回肝臟，再分泌一次，一天可以循環好幾次，所以叫腸肝循環。臨床上，迴腸切除的病人膽鹽回收不了，就會脂肪痢；而水溶性纖維會把膽酸帶走，肝臟只好用更多膽固醇去補做，血中膽固醇就下降了。'},

  carry:'膽汁：膽鹽、膽固醇、磷脂、膽紅素；胰液：消化酵素（澱粉酶、脂解酶、蛋白酶原）、碳酸氫根',
  key:['CCK 讓膽囊收縮、Oddi 括約肌放鬆，並刺激胰臟分泌酵素','secretin（胰泌素）刺激胰臟分泌碳酸氫根','膽道阻塞 → 結合型膽紅素上升、灰白便（阻塞性黃疸）'],
  talk:'第七條是膽汁和胰液進入小腸的管道。膽汁由肝細胞分泌，經過膽小管、左右肝管匯成總肝管，平常會轉進膽囊管，存在膽囊裡濃縮。吃到油脂時，十二指腸分泌膽囊收縮素⟦cholecystokinin⟧，讓膽囊收縮，膽汁經總膽管流出。胰液則從胰臟的主胰管流出，兩條管子在肝胰壺腹會合，通過 Oddi 括約肌進入十二指腸。膽囊收縮素同時刺激胰臟分泌酵素，胰泌素⟦secretin⟧則刺激胰臟分泌碳酸氫根，中和胃酸。'},
 {id:'renal', zh:'腎臟排泄路徑', en:'Renal excretion', col:'#7a55b8',

  carry:'尿素、肌酸酐、尿酸、銨離子、多餘的水與電解質、水溶性藥物代謝物',

  talk:'第八條是腎臟的排泄路徑。血液經由腎動脈進入腎臟，在腎絲球⟦glomerulus⟧過濾，濾液進到腎小管，有用的葡萄糖、胺基酸、水和電解質被再吸收回去，不要的尿素、肌酸酐、尿酸和銨離子則留下來，經集尿管、腎盂、輸尿管送到膀胱，最後排出。乾淨的血則經腎靜脈回到下腔靜脈。蛋白質代謝產生的氮，最後幾乎都是走這條路離開身體，所以腎功能不好的時候，BUN 和肌酸酐會上升，要控制蛋白質。'},
 {id:'cori', zh:'Cori 循環的血液路線', en:'Cori cycle route', col:'#e07a2f',

  key:['乳酸不是直接「流」到肝，而是隨體循環繞經心肺再到肝','肌肉賺 2 ATP、肝花 6 ATP，整體淨耗 4 ATP'],
  talk:'第九條是 Cori 循環⟦Cori cycle⟧的實際路線。課本畫的是肌肉和肝臟之間的一個圈，但血液其實要繞一大圈：肌肉做出的乳酸進入靜脈，經下腔靜脈回到右心，經過肺、左心，再由主動脈送到肝臟，大部分經肝動脈，也有一部分先流過腸道，再由門靜脈進入肝臟。肝臟把乳酸做回葡萄糖，從肝靜脈出來，又經過心肺、主動脈，才回到肌肉。葡萄糖丙胺酸循環也是走同樣的路，只是去程運的是丙胺酸，還多帶了氮。'},
 {id:'ffa', zh:'空腹時脂肪酸的運輸', en:'Fatty acid transport in fasting', col:'#d1a520',

  key:['脂肪酸不溶於水，靠白蛋白攜帶','腦不能直接用脂肪酸（不易通過血腦障壁），長期飢餓改用肝臟做的酮體','甘油可以生糖，脂肪酸不行'],
  talk:'第十條是空腹時脂肪酸的運輸。脂肪組織的荷爾蒙敏感性脂解酶把三酸甘油酯拆開，放出的游離脂肪酸不溶於水，要黏在白蛋白⟦albumin⟧上，經過靜脈、心肺，再由主動脈送到肌肉、心臟和肝臟當燃料。甘油則送到肝臟做糖質新生。腦不太能直接使用脂肪酸，所以長期飢餓時，是由肝臟把脂肪酸轉成酮體，再送給腦用。'},
 {id:'lipo', zh:'脂蛋白的運輸（VLDL、LDL、HDL）', en:'Lipoprotein transport', col:'#8a56c2',

  path:'VLDL：肝 → 肝靜脈 → 心肺 → 主動脈 → 脂肪與肌肉（LPL 卸 TAG）→ IDL → LDL → 經 LDL 受體進入周邊細胞與肝；HDL（逆向膽固醇運輸）：周邊組織 → 血液（LCAT 酯化）→ 肝 → 膽汁排出',
  carry:'VLDL：肝臟做的 TAG；LDL：膽固醇送往周邊；HDL：周邊多餘膽固醇送回肝',

  talk:'第十一條是脂蛋白的運輸。肝臟把自己做的三酸甘油酯包成 VLDL，從肝靜脈出發，經過心肺、主動脈，到脂肪和肌肉的微血管被脂蛋白脂解酶卸貨，慢慢變成 IDL、再變成 LDL。LDL 帶著膽固醇，靠細胞表面的 LDL 受體進入周邊細胞，所以叫壞膽固醇。反方向的是 HDL，它從周邊組織把多餘的膽固醇收集起來，經 LCAT 酯化後送回肝臟，肝臟再把膽固醇做成膽酸，隨膽汁排出，這叫逆向膽固醇運輸⟦reverse cholesterol transport⟧，所以 HDL 叫好膽固醇。'}

function routeSVG() {
  const W = 420, H = 570, X0 = -30;
  const box = k => { const [x, y, t] = RT_N[k]; const w = Math.max(54, [...t].length * 14 + 16); return {x, y, w, h: 30}; };
  const edgePt = (a, b) => { const A = box(a), B = box(b); const dx = B.x - A.x, dy = B.y - A.y; const t = Math.min(dx ? (A.w / 2 + 3) / Math.abs(dx) : 9, dy ? (A.h / 2 + 3) / Math.abs(dy) : 9); return [A.x + dx * t, A.y + dy * t]; };
  let s = `<svg viewBox="${X0} 0 ${W - X0} ${H}" class="rtmap" role="img" aria-label="營養素輸送路線圖"><defs>`;
  for (const r of ROUTES) s += `<marker id="ah-rt-${r.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${r.col}"/></marker>`;
  s += `<marker id="ah-rt-base" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--line2)"/></marker></defs>`;
  
  const paths = {};
  for (const [id, [a, b, nm, c]] of Object.entries(RT_E)) {
    let d;
    if (id === 'lung_out') { const [x, y] = RT_N.lung; d = `M${x + 30},${y - 6} L${x + 70},${y - 26}`; }
    else if (c) { const [x1, y1] = edgePt(a, b), [x2, y2] = edgePt(b, a); d = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${c[0]},${c[1]} ${x2.toFixed(1)},${y2.toFixed(1)}`; }

const ORGPOS = { Br:[110,24], B:[110,68], H:[98,88], RBC:[84,104], Sp:[90,124], L:[127,112], GB:[124,130], AG:[118,142], K:[128,154], A:[86,168], I:[110,184], Go:[110,208], M:[160,150], S:[60,120], BM:[93,258] };

    for (let i = 0; i < seq.length - 1; i++) {

/* ---------- 環狀圖 ---------- */
function ringSVG(p, R0, hideNames) {
  const n = R0.ring.length;
  const R = n >= 7 ? 215 : n >= 6 ? 175 : 140, W = 2 * R + 300, H = 2 * R + 190, cx = W / 2, cy = H / 2;
  const bws = R0.ring.map(([en]) => Math.max(96, (hideNames ? 1 : en.length) * 8.4 + 20)), BH = 46;
  const offAt = (i, a) => { const r = a * Math.PI / 180; return ((Math.abs(Math.sin(r)) * bws[i] / 2 + Math.abs(Math.cos(r)) * BH / 2) / R) * 180 / Math.PI + 4; };
  const ang = R0.ang || R0.ring.map((_, i) => -90 + i * 360 / n);
  const end = R0.end != null ? R0.end : (R0.ang ? ang[0] + 360 : ang[0] + 360);
  const dir = (ang[1] ?? end) > ang[0] ? 1 : -1;
  const pt = (a, r = R) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const colOf = k => (codeInfo(k) || {col: 'var(--acc)'}).col;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="ring" role="img" aria-label="${esc(p.zh)} 環狀圖"><defs><marker id="ah-r-${p.id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--acc)"/></marker></defs>`;
  if (R0.zones) {
    const z = R0.zones, A = codeInfo(z.a), B = codeInfo(z.b);
    if (z.type === 'h') {
      s += `<rect x="0" y="0" width="${W}" height="${cy}" rx="18" fill="${A.col}" opacity=".09"/><rect x="0" y="${cy}" width="${W}" height="${H - cy}" rx="18" fill="${B.col}" opacity=".09"/>`;
      s += `<line x1="8" y1="${cy}" x2="${W - 8}" y2="${cy}" stroke="var(--muted2)" stroke-dasharray="6 5"/>`;
      s += `<text x="14" y="26" class="zlab" fill="${A.col}">${A.zh}</text><text x="14" y="${H - 14}" class="zlab" fill="${B.col}">${B.zh}</text>`;
    } else {
      s += `<rect x="0" y="0" width="${cx}" height="${H}" rx="18" fill="${A.col}" opacity=".09"/><rect x="${cx}" y="0" width="${W - cx}" height="${H}" rx="18" fill="${B.col}" opacity=".09"/>`;
      s += `<line x1="${cx}" y1="8" x2="${cx}" y2="${H - 8}" stroke="var(--muted2)" stroke-dasharray="6 5"/>`;
      s += `<text x="14" y="26" class="zlab" fill="${A.col}">${A.zh}</text><text x="${W - 14}" y="26" text-anchor="end" class="zlab" fill="${B.col}">${B.zh}</text>`;
    }
  }
  // arcs
  for (let i = 0; i < n; i++) {
    const a1 = ang[i], a2 = i < n - 1 ? ang[i + 1] : end;
    const j = (i + 1) % n;
    const sA = a1 + dir * offAt(i, a1), eA = a2 - dir * offAt(j, a2);
    const [x1, y1] = pt(sA), [x2, y2] = pt(eA);
    const large = Math.abs(eA - sA) > 180 ? 1 : 0, sweep = dir > 0 ? 1 : 0;
    s += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large} ${sweep} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="3" marker-end="url(#ah-r-${p.id})"/>`;
    const m = (a1 + a2) / 2; const [mx, my] = pt(m);
    const ei = R0.arcEdge ? R0.arcEdge[i] : i;
    if (ei >= 0) s += `<circle cx="${mx}" cy="${my}" r="13" fill="var(--acc)"/><text x="${mx}" y="${my + 5}" text-anchor="middle" class="rnum">${ei + 1}</text>`;
    const an = (R0.ann || {})[i];
    if (an) {
      const [ax, ay] = pt(m, R + 50); const c = Math.cos(m * Math.PI / 180);
      const anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
      const y0 = ay - (an.length - 1) * 9 + 5;
      an.forEach(([t, txt], j) => { s += `<text x="${ax.toFixed(1)}" y="${(y0 + j * 18).toFixed(1)}" text-anchor="${anchor}" class="ran ran-${t}">${esc(txt)}</text>`; });
    }
  }
  // nodes
  R0.ring.forEach(([en, zh, w], i) => {
    const [x, y] = pt(ang[i]);
    const shown = hideNames ? '?' : en;
    const bw = bws[i], bh = BH;
    s += `<rect x="${(x - bw / 2).toFixed(1)}" y="${y - bh / 2}" width="${bw.toFixed(1)}" height="${bh}" rx="10" fill="var(--surface)" stroke="${colOf(w)}" stroke-width="2.5"/>`;
    s += `<text x="${x}" y="${hideNames ? y + 5 : y - 4}" text-anchor="middle" class="rn-en">${esc(shown)}</text>`;
    if (!hideNames) s += `<text x="${x}" y="${y + 15}" text-anchor="middle" class="rn-zh">${esc(zh)}</text>`;
  });
  s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="rc1">${esc(R0.center[0])}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" class="rc2">${esc(R0.center[1] || '')}</text>`;
  return s + `</svg>`;
}

/* ---------- 路徑流程（直式） ---------- */
function pool(p, kind) {
  const mine = kind === 'enz' ? p.edges.map(e => e.e) : p.nodes.slice(1);
  const uniq = [...new Set(mine)];
  const others = [...new Set(P.filter(q => q.cat === p.cat && q.id !== p.id).flatMap(q => kind === 'enz' ? q.edges.map(e => e.e) : q.nodes))].filter(x => !uniq.includes(x));
  const extra = shuffle(others).slice(0, Math.max(2, 7 - uniq.length));
  return shuffle(uniq.concat(extra));
}
function sel(opts, ans) {
  return `<select class="q" data-ans="${esc(ans)}"><option value="">— 選擇 —</option>` +
    opts.map(o => { const [en, zh] = sp(o); return `<option value="${esc(o)}">${esc(label(en, zh))}</option>`; }).join('') + `</select><span class="fb"></span>`;
}
function flowHTML(p) {
  const w = WH[p.id] || {}; const n = w.n;
  const multi = n && new Set(n).size > 1;
  const quiz = S.mode === 'quiz';
  const optE = quiz && S.blank === 'enz' ? pool(p, 'enz') : null;
  const optN = quiz && S.blank === 'met' ? pool(p, 'met') : null;
  let h = `<div class="flow">`;
  p.nodes.forEach((nd, i) => {
    const [en, zh] = sp(nd);
    const ci = multi ? codeInfo(n[i]) : null;
    const st = ci ? ` style="--nc:${ci.col}"` : '';
    const tag = ci ? `<span class="ntag" style="background:${ci.col}">${ci.zh}</span>` : '';
    if (optN && i > 0) h += `<div class="node q-node"${st}>${tag}${sel(optN, nd)}</div>`;
    else h += `<div class="node"${st}>${tag}<b>${esc(en)}</b>${S.lang !== 'en' && zh ? `<small>${esc(zh)}</small>` : ''}</div>`;
    if (i < p.edges.length) {
      const e = p.edges[i]; const [een, ezh] = sp(e.e);
      let cross = '';
      if (multi && n[i] !== n[i + 1]) { const a = codeInfo(n[i]), b = codeInfo(n[i + 1]); cross = `<div class="cross">⇢ 移動：<b style="color:${a.col}">${a.zh}</b> → <b style="color:${b.col}">${b.zh}</b></div>`; }
      const badges = (e.rl ? `<span class="bd bd-rl">限速 Rate-limiting</span>` : '') + (e.irr ? `<span class="bd bd-irr">不可逆</span>` : '');
      const enz = optE ? `<div class="enz q-enz">${sel(optE, e.e)}</div>` :
        `<div class="enz"><b>${esc(een)}</b>${S.lang !== 'en' && ezh ? `<small>${esc(ezh)}</small>` : ''}</div>`;
      h += `<div class="edge"><div class="arr"><span class="num">${i + 1}</span></div><div class="ebody">${cross}${enz}<div class="meta">${badges}${chips(e.c)}</div>${e.n ? `<div class="enote">${esc(e.n)}</div>` : ''}</div></div>`;
    }
  });
  if (p.loop) h += `<div class="loop">↻ ${esc(p.loop)}</div>`;
  return h + `</div>`;
}

    glycogen:[62,40,'Glycogen','肝醣','glycogenesis'], glucose:[212,40,'Glucose','葡萄糖','glycolysis'], nuc:[362,40,'Nucleotides','核苷酸','purine-denovo'],

    fa:[62,275,'Fatty acids','脂肪酸','beta-ox'], acoa:[212,275,'Acetyl-CoA','乙醯-CoA','pdh'], urea:[362,275,'Urea','尿素','urea'],
    tag:[62,355,'TAG','三酸甘油酯','tag-synthesis'], tca:[212,355,'TCA cycle','檸檬酸循環','tca'], ket:[362,355,'Ketone bodies','酮體','ketogenesis'],
    atp:[212,435,'ETC → ATP','電子傳遞鏈','etc'], chol:[362,435,'Cholesterol','膽固醇','cholesterol']
  };
  const E = [['glucose','glycogen','⇄','glycogenesis','carb'],['glucose','g6p','','glycolysis','carb'],['g6p','ppp','五碳糖','ppp','carb'],['ppp','nuc','核糖','purine-denovo','nuc'],
    ['g6p','pyr','糖解 ⇅ 糖質新生','glycolysis','carb'],['pyr','lac','Cori','cori','carb'],['pyr','acoa','PDH','pdh','carb'],['aa','pyr','碳骨架','carbon-skeleton','protein'],
    ['aa','urea','尿素循環','urea','protein'],['fa','acoa','β-ox','beta-ox','lipid'],['acoa','ket','酮體生成','ketogenesis','lipid'],['acoa','chol','膽固醇合成','cholesterol','lipid'],
    ['acoa','tca','','tca','carb'],['tca','atp','NADH・FADH₂','etc','carb'],['fa','tag','TAG 合成','tag-synthesis','lipid'],['aa','acoa','','carbon-skeleton','protein']];
  const hw = 54, hh = 18;
  const clip = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; const t = Math.min(dx ? hw / Math.abs(dx) : 9, dy ? hh / Math.abs(dy) : 9); return [x1 + dx * t, y1 + dy * t, x2 - dx * t, y2 - dy * t]; };
  let s = `<svg viewBox="0 0 424 470" class="hub" role="img" aria-label="代謝總地圖"><defs><marker id="ah-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
  for (const [a, b, l, go, cat] of E) {
    const [x1, y1] = N[a], [x2, y2] = N[b]; const [sx, sy, ex, ey] = clip(x1, y1, x2, y2);
    s += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${CATS[cat].color}" stroke-width="2.4" marker-end="url(#ah-h)"/>`;
    if (l) { const f = Math.abs(x1 - x2) > 5 && Math.abs(y1 - y2) > 5 ? 0.4 : 0.5; const mx = x1 + (x2 - x1) * f, my = y1 + (y2 - y1) * f; const vert = Math.abs(x1 - x2) < 5, diag = !vert && Math.abs(y1 - y2) > 5;
      s += `<text x="${vert ? mx + 6 : diag ? mx + 8 : mx}" y="${vert ? my + 4 : diag ? my - 6 : my - 5}" text-anchor="${vert || diag ? 'start' : 'middle'}" class="hl go" data-go="${go}">${l}</text>`; }
  }
  for (const [x, y, en, zh, go] of Object.values(N)) {
    s += `<g class="go" data-go="${go}"><rect x="${x - hw}" y="${y - hh}" width="${hw * 2}" height="${hh * 2}" rx="9" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/><text x="${x}" y="${y - 2}" text-anchor="middle" class="hn">${en}</text><text x="${x}" y="${y + 11}" text-anchor="middle" class="hz">${zh}</text></g>`;
  }
  return s + `</svg>`;
}

   <a class="prbanner" href="#/practice"><b>✏️ 進入練習模式</b><span>${PRACT.length} 條路徑・下拉選單填空・自動記錄成績</span></a>
   <h3>📚 分類</h3><div class="cards">${Object.entries(CATS).map(([k, c]) => `<a class="card" href="#/cat/${k}" style="--acc:${c.color}"><b>${c.zh}</b><small>${P.filter(p => p.cat === k).length} 條路徑</small><span>${esc(c.intro)}</span></a>`).join('')}
    ${Object.entries(REFS).map(([k, r]) => `<a class="card" href="#/ref/${k}" style="--acc:var(--muted)"><b>${r.zh}</b><span>${esc(r.intro)}</span></a>`).join('')}</div>
   <h3>🎨 顏色說明</h3><p class="legend2"><span class="chip c-atp">ATP／GTP</span><span class="chip c-nadh">NADH</span><span class="chip c-nadph">NADPH</span><span class="chip c-fad">FAD／FADH₂</span><span class="chip c-vit">維生素／礦物質輔因子</span><span class="chip c-co2">CO₂／H₂O／O₂</span><span class="bd bd-rl">限速</span><span class="bd bd-irr">不可逆</span></p>
  </article>`;
  bindGo();
}
function bindGo() { document.querySelectorAll('.go[data-go]').forEach(g => g.addEventListener('click', () => location.hash = '#/' + g.dataset.go)); }

/* ---------- 路由 ---------- */
function route() {
  let h = (location.hash || '#/').slice(2);
  if (!location.hash && /practice|quiz/.test(location.search)) h = 'practice';
  S.pr = false; if (typeof jStop === 'function') jStop(); TTS.stop();
  const jm = h.match(/^journey\/(\w+)(?:\/(\d+))?$/), fm = h.match(/^feedstate(?:\/(\w+))?$/);
  const rm = h.match(/^routes(?:\/(\w+))?$/);
  if (rm) renderRoutes(rm[1]);
  else if (h === 'journey') renderJourneyHub();
  else if (jm && JOURNEYS[jm[1]]) renderJourney(jm[1], jm[2]);
  else if (fm) renderFeed(fm[1] || 'fed');
  else if (h === 'practice') renderPractice();
  else if (h.startsWith('q/') && byId[h.slice(2)] && byId[h.slice(2)].edges.length) { S.pr = true; S.mode = 'quiz'; renderPath(h.slice(2)); }
  else if (h.startsWith('cat/') && CATS[h.slice(4)]) renderCat(h.slice(4));
  else if (h.startsWith('ref/') && REFS[h.slice(4)]) renderRef(h.slice(4));
  else if (byId[h]) { renderPath(h); }
  else renderHome();
  markNav(); window.scrollTo(0, 0);
  document.body.classList.remove('navopen');
}
window.addEventListener('hashchange', () => { S.mode = 'learn'; route(); });
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#navlist li').forEach(li => { const a = li.querySelector('a'); li.style.display = !v || a.dataset.s.includes(v) ? '' : 'none'; });
});
$('#menu').onclick = () => document.body.classList.toggle('navopen');
buildNav(); route();

</script>
</body>
</html>
