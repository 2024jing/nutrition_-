  $('title').textContent = t[1]; $('subtitle').textContent = t[2]; $('tools').innerHTML = '';
  $('tabbar').querySelectorAll('[data-app]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-app') === app); });
  ({ nutrition: viewNutrition, fx: viewFx, therapy: viewTherapy, weight: viewWeight })[app]();
  window.scrollTo(0, 0);
}
function buildNav() {
  var h = TABS.map(function (t) { return '<button data-app="' + t[0] + '" type="button">' + ICON[t[0]] + t[1] + '</button>'; }).join('');
  h += BASE ? '<a href="' + esc(BASE) + '?page=menu" target="_top">' + ICON.menu + '團體膳食</a>' : '<button type="button" disabled style="opacity:.4">' + ICON.menu + '團體膳食</button>';
  $('tabbar').innerHTML = h;
  $('tabbar').querySelectorAll('[data-app]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-app')); }; });
}

  var M = d[3] != null ? d[3] : t[2], V = t[3], Fr = t[4], G, P, O, guide = W.basis === '每日飲食指南';
  G = guide ? t[5] : r05((gC - 12 * M - 5 * V - 15 * Fr) / 15);
  P = guide ? t[6] : r05((gP - 8 * M - 1 * V - 2 * G) / 7);
  O = guide ? t[7] : r05((gF - MF * M - PF * P) / 5);
  var rows = [['乳品類', M, 8, MF, 12, MK, '1 杯 240 毫升'], ['蔬菜類', V, 1, 0, 5, 25, '煮熟約半碗'], ['水果類', Fr, 0, 0, 15, 60, '約 1 個拳頭'],
    ['全榖雜糧類', G, 2, 0, 15, 70, '1 碗飯 ＝ 4 份'], ['豆魚蛋肉類', P, 7, PF, 0, PK, '雞蛋 1 個、傳統豆腐 80 g'], ['油脂與堅果種子類', O, 0, 5, 0, 45, '油 1 茶匙 5 g']];
  var sum = [0, 0, 0, 0]; rows.forEach(function (r) { sum[0] += r[1] * r[2]; sum[1] += r[1] * r[3]; sum[2] += r[1] * r[4]; sum[3] += r[1] * r[5]; });
  var diff = sum[3] / K - 1, okd = Math.abs(diff) <= 0.05;
  h += '<div class="card pad"><h2>六大類份數</h2><div class="seg" id="w_basis" style="margin-top:8px">' + ['三大營養素反推', '每日飲食指南'].map(function (m) { return '<button type="button" class="' + (m === W.basis ? 'on' : '') + '">' + m + '</button>'; }).join('') + '</div>' +
    '<div class="grid2" style="margin-top:8px"><label class="f">乳品種類<select id="w_milk">' + opt(['全脂', '低脂', '脫脂'], W.milk) + '</select></label><label class="f">豆魚蛋肉脂肪等級<select id="w_prot">' + opt(['低脂', '中脂'], W.prot) + '</select></label></div>' +
    '<div class="scroll"><table style="margin-top:10px"><tr><th>類別</th><th>份數</th><th>蛋白質</th><th>脂肪</th><th>醣類</th><th>熱量</th></tr>' +
    rows.map(function (r) { return '<tr><td><b>' + r[0] + '</b><div class="small muted">' + r[6] + '</div></td><td><b style="font-size:16px">' + r[1] + '</b></td><td>' + fmt(r[1] * r[2], 1) + '</td><td>' + fmt(r[1] * r[3], 1) + '</td><td>' + fmt(r[1] * r[4], 1) + '</td><td>' + fmt(r[1] * r[5]) + '</td></tr>'; }).join('') +
    '<tr><td><b>試算合計</b></td><td></td><td><b>' + fmt(sum[0]) + '</b></td><td><b>' + fmt(sum[1]) + '</b></td><td><b>' + fmt(sum[2]) + '</b></td><td><b>' + fmt(sum[3]) + '</b></td></tr>' +
    '<tr><td class="muted">設計目標</td><td></td><td>' + gP + '</td><td>' + gF + '</td><td>' + gC + '</td><td>' + K + '</td></tr></table></div>' +
    '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge ' + (okd ? 'ok' : 'bad') + '">熱量差距 ' + (diff >= 0 ? '+' : '') + (diff * 100).toFixed(1) + '%</span>' +
    '<span class="small muted">' + (okd ? '在 ±5% 內' : '超過 ±5%，請到 Excel「個人設定」用自訂份數微調') + '</span></div>' +
    '<div class="small muted" style="margin-top:6px">' + (guide ? '六大類都直接查每日飲食指南 ' + t[1] + ' 大卡那一列。' : '乳品、蔬菜、水果查每日飲食指南 ' + t[1] + ' 大卡那一列，再依序用剩下的醣類算全榖、蛋白質算豆魚蛋肉、脂肪算油脂，取到 0.5 份。') +
    (d[3] === 0 ? '　' + esc(d[0]) + '不供應乳品。' : '') + '</div>' +
    '<button type="button" class="linkbtn" data-go="fx">到食物代換查每份重量</button></div>';
  h += '<div class="card"><details class="acc"><summary><div class="tx"><b>減重怎麼設計</b><span class="d">熱量、速度與注意事項</span></div>' + CHEV + '</summary><div class="body"><ul class="dots">' +
    ['過重、肥胖者用每公斤體重法時，表一會自動採較低的係數（例如輕度活動 25 大卡／公斤，以「標準體重」計，不是現在體重）', '另一種常見做法：每天比維持熱量少 500 大卡，約每週減 0.5 公斤', '速度以每週 0.5–1 公斤為宜，6 個月先減原體重的 5–10%', '設計熱量一般不宜低於基礎需求（常見下限：女性 1200、男性 1500 大卡），更低需醫療監督', '蛋白質維持足夠、搭配肌力運動，減少肌肉流失', '腰圍：男 ≥ 90 公分、女 ≥ 80 公分為腹部肥胖'].map(li).join('') +
    '</ul></div></details>' +
    '<details class="acc"><summary><div class="tx"><b>查表來源</b><span class="d">表一、表二、每日飲食指南</span></div>' + CHEV + '</summary><div class="body"><ul class="dots">' +
    ['表一 每公斤體重所需熱量：輕度、中度、重度三列依衛生單位常用的體重管理熱量表；臥床列為常見教材值', '表二 DRIs 第八版熱量參考攝取量：依總表整理，尚未逐格與官方核對，請以國健署原表為準', '每日飲食指南（107 年版）各熱量的六大類份數；2700 大卡的乳品取 2 份', '第九版 DRIs 與新版每日飲食指南公告後，Excel 與這裡都需要一起更新'].map(li).join('') +
    '</ul></div></details></div>' +
    '<p class="note">算法與 Excel「個人設定」相同；三餐分配與選菜請在 Excel 的「個人菜單」完成。</p>';
  out.innerHTML = h;
  $('w_basis').querySelectorAll('button').forEach(function (b) { b.onclick = function () { W.basis = b.textContent; wCalc(); }; });
  $('w_milk').onchange = function () { W.milk = this.value; wCalc(); };
  $('w_prot').onchange = function () { W.prot = this.value; wCalc(); };
  out.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-go')); }; });
}

/* ---------- 啟動 ---------- */
buildNav();
var q0 = (location.search.match(/[?&]app=([a-z]+)/) || [])[1];
var s0 = /^[a-z]+$/.test(START) ? START : (q0 || 'nutrition');
document.body.classList.add('solo');   // 一律只顯示單一單元；沒帶 app= 時預設營養學
go(TABS.some(function (t) { return t[0] === s0; }) ? s0 : 'nutrition');
</script>
