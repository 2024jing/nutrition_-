<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歷屆考題</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1f2a24; --muted: #5f6a63; --line: #e2e5df;
    --brand: #2f6b4f; --brand-soft: #e3efe8; --on-brand: #ffffff; --ok: #2e7d4f; --ok-soft: #e1f2e7; --on-ok: #ffffff;
    --bad: #b3261e; --bad-soft: #fbe5e3; --on-bad: #ffffff; --warm: #fff3d6; --chip: #eef0eb; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --on-ok: #10251a; --bad: #ff8a80; --bad-soft: #3a1f1d; --on-bad: #2a0f0d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --on-ok: #10251a; --bad: #ff8a80; --bad-soft: #3a1f1d; --on-bad: #2a0f0d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
  .hd { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; }
  .hd .tt { flex: 1; min-width: 0; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 4px 16px 32px; max-width: 720px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); margin: 12px 0; overflow: hidden; }
  .pad { padding: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .lab { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .lab:first-child { margin-top: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--card); padding: 7px 13px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .chips button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chips button .c { opacity: .7; font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 4px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .btn { display: block; width: 100%; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); border-radius: 12px; padding: 13px 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.plain { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600; }
  .btn.warn { background: transparent; color: var(--bad); border-color: var(--bad-soft); font-weight: 600; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .xbtn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin: 2px 4px 2px 0; }
  .tag.k { background: var(--brand-soft); color: var(--brand); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--chip); border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat.hl { background: var(--brand-soft); } .stat.hl b { color: var(--brand); }
  .prog { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 8px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .prog i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .2s; }
  .qt { font-size: 17px; line-height: 1.65; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px; margin-top: 8px; cursor: pointer; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  .opt .k { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .opt .x { flex: 1; min-width: 0; padding-top: 2px; }
  .opt .m { flex: 0 0 auto; font-size: 12px; font-weight: 700; padding-top: 5px; white-space: nowrap; }
  .opt.sel { border-color: var(--brand); background: var(--brand-soft); } .opt.sel .k { background: var(--brand); color: var(--on-brand); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.right .k { background: var(--ok); color: var(--on-ok); } .opt.right .m { color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt.wrong .k { background: var(--bad); color: var(--on-bad); } .opt.wrong .m { color: var(--bad); }
  .opt[disabled] { cursor: default; color: var(--ink); opacity: 1; }
  .fb { border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .fb.ok { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); }
  .fb b.v { font-size: 15px; } .fb.ok b.v { color: var(--ok); } .fb.bad b.v { color: var(--bad); }
  .exp { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
  .exp h3 { margin: 0 0 4px; font-size: 13px; color: var(--brand); }
  .foot { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  details.rv { border-top: 1px solid var(--line); }
  details.rv:first-child { border-top: 0; }
  details.rv > summary { list-style: none; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; cursor: pointer; }
  details.rv > summary::-webkit-details-marker { display: none; }
  details.rv .mk { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  details.rv .mk.ok { background: var(--ok-soft); color: var(--ok); } details.rv .mk.bad { background: var(--bad-soft); color: var(--bad); } details.rv .mk.na { background: var(--chip); color: var(--muted); }
  details.rv .st { flex: 1; min-width: 0; } details.rv .st .q1 { overflow-wrap: anywhere; }
  details.rv .bd { padding: 0 14px 14px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; }
  .note { color: var(--muted); font-size: 12px; margin: 16px 2px; }
  .tip { background: var(--warm); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .paper { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; margin-top: 8px; cursor: pointer; }
  .paper.on { border-color: var(--brand); background: var(--brand-soft); }
  .paper b { flex: 1; min-width: 0; font-size: 15px; } .paper span { color: var(--muted); font-size: 13px; white-space: nowrap; }
</style>
</head>

  <div class="hd">
    <div class="tt"><h1 id="title">歷屆考題</h1><div class="sub" id="subtitle"></div></div>
    <button type="button" class="xbtn" id="quit" hidden>結束</button>
  </div>
  <div class="prog" id="prog" hidden><i id="progi"></i></div>
</header>
<main id="main"></main>

<script>
/* ---------- 題庫（由「國考題分類表」Excel 轉出，請勿手動修改） ---------- */
var DATA = {"papers":[{"id":"115-1-4102","y":115,"t":1,"subj":"營養學"}],"courses":["營養學","營養評估","生命期營養","膳食療養","膳食療養實驗（二）","人體生理學與實驗","生物化學（二）","營養化學概論","食品化學","食物學原理","團體膳食製備","膳食計畫與供應","公共衛生營養學","食品衛生與安全","保健營養專業倫理"],"chapters":{"營養學":["總覽","醣類","脂質","蛋白質","維生素（脂溶性）","維生素（水溶性）","礦物質（巨量）","礦物質（微量）","水","能量代謝與體重","運動營養"],"生命期營養":["懷孕與哺乳期","嬰兒期","幼兒與學齡期","青春期","成年期","老年期"],"膳食療養":["第1章 營養照護","第2章 營養支持","第3章 體重控制與管理","第4章 高血壓、高脂血症及心臟疾病","第5章 消化道及肝、膽、胰臟疾病","第6章 糖尿病","第7章 腎臟疾病","第8章 腫瘤與癌症","第9章 生理壓力：手術、創傷、燒傷及敗血症","第10章 肺部疾病","第11章 貧血","第12章 內分泌與新陳代謝疾病","第13章 小兒科之營養照護","第14章 飲食、營養與藥物的交互作用"],"膳食療養實驗（二）":["1 一般飲食","2 調整質地之飲食","3 營養支持之飲食","4 調整熱量之飲食","5 調整脂肪之飲食","6 調整礦物質之飲食","7 調整醣類之飲食","8 調整蛋白質之飲食","9 調整纖維質之飲食","10 特殊飲食"],"膳食計畫與供應":["菜單設計與營養基準"],"食品衛生與安全":["食品安全衛生法規","食品微生物與食品中毒","食品添加物","天然毒素與汙染物","衛生管理與 HACCP"]},"q":[{"id":"115-1-4102-1","p":"115-1-4102","n":1,"q":"人體攝入富含蛋白質的食物後，主要是由那個器官開始消化蛋白質？","o":["口腔","胃","腸道","肝臟"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質消化的起始位置","ex":"口腔的唾液不含蛋白質分解酵素，只有咀嚼的機械作用。蛋白質的化學性消化從胃開始：胃酸使蛋白質變性，並把胃蛋白酶原活化成胃蛋白酶，將蛋白質切成較短的多胜肽；之後才到小腸由胰蛋白酶等繼續分解。肝臟不分泌消化蛋白質的酵素。"},{"id":"115-1-4102-2","p":"115-1-4102","n":2,"q":"下列何者含有反式脂肪酸？","o":["葵花油","牛油","豬油","花生油"],"a":"B","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"天然反式脂肪酸來源","ex":"反芻動物（牛、羊）瘤胃裡的細菌會對不飽和脂肪酸進行生物氫化，產生少量天然反式脂肪酸，所以牛油、羊油與乳脂含有反式脂肪酸。豬不是反芻動物；葵花油、花生油等未經氫化的植物油幾乎不含反式脂肪酸。"},{"id":"115-1-4102-3","p":"115-1-4102","n":3,"q":"成年人每日基礎代謝率（BMR）約1,200大卡，約相當於5,000 kJ。ATP水解產生的能量約50kJ/mol，ATP的分子量是551 g/mol。估計每天基礎代謝率需要的ATP總量，下列那一個數值最不合理？","o":["約100莫耳（mol/day）","約55公克（g/day）","約5,000 千焦（kJ/day）","約55公斤（kg/day）"],"a":"B","c":"營養學","c2":"生物化學（二）","ch":"能量代謝與體重","ch2":"","t":"ATP 與能量換算","ex":"需要的 ATP 莫耳數 ＝ 5,000 kJ ÷ 50 kJ/mol ＝ 100 mol；換算重量 ＝ 100 mol × 551 g/mol ＝ 55,100 g，約 55 公斤。所以 A、C、D 都合理，B 的 55 公克少了 1,000 倍。體內 ATP 存量很少，是靠不斷分解再合成來周轉。"},{"id":"115-1-4102-4","p":"115-1-4102","n":4,"q":"下列營養素之組合，何者降低高同半胱胺酸血症之效果最佳？","o":["維生素B1、維生素B2、維生素B3","維生素E、維生素C、生物素","維生素B12、葉酸、維生素B6","泛酸、卵磷脂、維生素K"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"同半胱胺酸與 B6、B12、葉酸","ex":"同半胱胺酸有兩條代謝路徑：再甲基化成甲硫胺酸，需要葉酸（提供甲基）與維生素 B12（甲硫胺酸合成酶的輔酶）；經轉硫作用變成半胱胺酸，需要維生素 B6。三者同時足夠，降同半胱胺酸的效果最好。"},{"id":"115-1-4102-5","p":"115-1-4102","n":5,"q":"下列何者為人體皮膚可用來合成維生素D3的原料？","o":["7-oxycholesterol","7-dehydrocholesterol","ergosterol","cholecalciferol"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 D3 的前驅物","ex":"皮膚中的 7-脫氫膽固醇（7-dehydrocholesterol）經紫外線 UVB 照射後轉變成維生素 D3 前驅物，再異構化為維生素 D3。cholecalciferol 就是維生素 D3 本身，是產物不是原料；ergosterol（麥角固醇）是植物與菇類中維生素 D2 的前驅物。"},{"id":"115-1-4102-6","p":"115-1-4102","n":6,"q":"低鹽飲食的病人，尿中的氯會與何種礦物質同時降低？","o":["鈣","磷","鉀","鈉"],"a":"D","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鈉與氯","ex":"飲食中的氯幾乎都來自食鹽（氯化鈉），鈉與氯在腸道一起吸收，在腎臟也一起被再吸收或排出。低鹽飲食時鈉、氯攝取同時減少，腎臟保留鈉的同時也保留氯，所以尿鈉與尿氯會一起降低。"},{"id":"115-1-4102-7","p":"115-1-4102","n":7,"q":"根據最新版「國人膳食營養素參考攝取量」，哺乳期婦女相較懷孕第三期婦女不需要額外增加下列那些營養素的攝取？①蛋白質　②葉酸　③維生素E　④維生素B12　⑤鋅　⑥鐵","o":["①②③","②⑤⑥","③④⑥","①④⑤"],"a":"B","c":"生命期營養","c2":"","ch":"懷孕與哺乳期","ch2":"","t":"DRIs：懷孕期與哺乳期比較","ex":"依國人膳食營養素參考攝取量第八版的增加量，懷孕第三期／哺乳期分別為：蛋白質 +10／+15 g、維生素 E +2／+3 mg、維生素 B12 +0.2／+0.4 μg，哺乳期較高；葉酸 +200／+100 μg，哺乳期較低；鋅 +3／+3 mg、鐵 +30／+30 mg，兩者相同。所以哺乳期不需要再額外增加的是葉酸、鋅、鐵（②⑤⑥）。"},{"id":"115-1-4102-8","p":"115-1-4102","n":8,"q":"下列何者不是造成老年人食量減少的主要原因？","o":["神經內分泌的變化","服用藥物造成味覺和嗅覺改變","憂鬱","運動量增加"],"a":"D","c":"生命期營養","c2":"","ch":"老年期","ch2":"","t":"老年期食量減少的原因","ex":"老年人食量減少常見的原因包括：飽足感荷爾蒙與胃排空等神經內分泌變化、藥物造成味覺嗅覺改變或口乾、憂鬱與獨居等心理社會因素。運動量增加會提高能量需求與食慾，而且老年人的活動量通常是減少的，所以不是原因。"},{"id":"115-1-4102-9","p":"115-1-4102","n":9,"q":"有關乙醇對維生素A代謝的影響，下列何者最適當？","o":["會抑制肝臟對視黃醇的氧化","以競爭性抑制視黃醇轉換","在小腸促進視黃醇去氫酶的活性","提高視黃醇轉換為視黃醛的速率"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"酒精與維生素 A 代謝","ex":"乙醇和視黃醇都是醇類，共用醇去氫酶（ADH）等酵素代謝。乙醇存在時會和視黃醇競爭酵素，抑制視黃醇氧化成視黃醛、再變成視黃酸，所以 C、D 說反了。長期飲酒還會誘發肝臟微粒體酵素，加速維生素 A 分解、耗損肝臟儲存量，並不是抑制肝臟的氧化作用。"},{"id":"115-1-4102-10","p":"115-1-4102","n":10,"q":"下列何種營養素的耗盡不是運動造成疲勞的主要原因？","o":["蛋白質","碳水化合物","水分","電解質"],"a":"A","c":"營養學","c2":"","ch":"運動營養","ch2":"","t":"運動疲勞的原因","ex":"運動疲勞主要和肌肉與肝臟的肝醣（碳水化合物）耗盡、脫水、流汗造成的電解質流失有關。蛋白質在運動中供能的比例很低（一般約 5%，長時間耐力運動也只到一成多），耗盡蛋白質不是疲勞的主因。"},{"id":"115-1-4102-11","p":"115-1-4102","n":11,"q":"有關憩室炎患者急性期的飲食調整，下列何者最適當？","o":["多補充蔬果","多選擇全穀","多選擇豆類","多補充水分"],"a":"D","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"9 調整纖維質之飲食","t":"憩室炎急性期的飲食","ex":"憩室炎急性期腸道正在發炎，飲食要讓腸道休息：視嚴重程度先禁食或採清流質，再進展到低渣（低纖維）飲食，並補足水分。蔬果、全穀、豆類都是高纖食物，急性期應避免；等發炎緩解後才逐步恢復高纖飲食，預防憩室炎復發。"},{"id":"115-1-4102-12","p":"115-1-4102","n":12,"q":"下列何者的熱量較高且較難消化？","o":["米粉不含湯半碗","小湯圓20粒","蘿蔔糕50克","年糕30克"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"全榖雜糧類的份量與消化性","ex":"依食物代換表，米粉（濕）半碗、蘿蔔糕 50 克、年糕 30 克都是 1 份全榖雜糧類（約 70 大卡）；小湯圓（無餡）10 粒是 1 份，20 粒就是 2 份、約 140 大卡，熱量最高。湯圓是糯米製品，支鏈澱粉多、黏性高，也比較不容易消化。"},{"id":"115-1-4102-13","p":"115-1-4102","n":13,"q":"有關海藻糖的敘述，下列何者正確？","o":["可分解為葡萄糖和果糖","在小腸由海藻糖酶分解","與蔗糖甜度相同","不會被吸收代謝，故無熱量"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"海藻糖的消化","ex":"海藻糖是兩個葡萄糖以 α-1,1 鍵結合的雙醣，在小腸刷狀緣由海藻糖酶分解成兩分子葡萄糖後吸收，每公克一樣提供 4 大卡。分解成葡萄糖和果糖的是蔗糖；海藻糖的甜度大約只有蔗糖的一半。"},{"id":"115-1-4102-14","p":"115-1-4102","n":14,"q":"測量鮮奶的升糖指數（GI）時，應攝取幾杯鮮奶？（四捨五入至整數）","o":["1杯","2杯","3杯","4杯"],"a":"D","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"升糖指數的測定方法","ex":"測定升糖指數時，受試食物的份量要含有 50 公克可利用的醣類。鮮奶每杯（240 毫升）含醣約 12 公克，50 ÷ 12 ≈ 4.2，四捨五入為 4 杯。"},{"id":"115-1-4102-15","p":"115-1-4102","n":15,"q":"Leucine脫胺作用（deamination）後的碳骨架（carbon skeleton）無法形成下列何種物質？","o":["cholesterol","fatty acid","glucose","ketones"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"蛋白質","ch2":"","t":"生酮性胺基酸的碳骨架去向","ex":"白胺酸（leucine）是純生酮性胺基酸，碳骨架代謝成乙醯輔酶 A 與乙醯乙酸，可以用來合成酮體、脂肪酸和膽固醇。乙醯輔酶 A 無法淨合成葡萄糖，所以白胺酸不能進行醣質新生。純生酮性胺基酸只有白胺酸和離胺酸。"},{"id":"115-1-4102-16","p":"115-1-4102","n":16,"q":"下列何種情況是「負氮平衡」狀態？","o":["胰島素分泌增加時","能量攝取不足時","健身練重訓的過程","疾病復原期"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"氮平衡","ex":"負氮平衡是氮的排出大於攝取。能量攝取不足時，身體會分解體蛋白質當作能量來源，含氮廢物排出增加。胰島素促進蛋白質合成；重量訓練增肌、疾病復原期都在建造組織，屬於正氮平衡。"},{"id":"115-1-4102-17","p":"115-1-4102","n":17,"q":"下列何者為hyperphagia的意思？","o":["over-eating","increased cell number","increased cell size","difficulty swallowing"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"名詞：hyperphagia","ex":"hyper- 是過多，-phagia 是吃，hyperphagia 指攝食過量（over-eating）。細胞數目增加是 hyperplasia（增生），細胞體積增大是 hypertrophy（肥大），吞嚥困難是 dysphagia。"},{"id":"115-1-4102-18","p":"115-1-4102","n":18,"q":"Harris-Benedict equations可以用於預測下列何者？","o":["resting metabolic rate（RMR）","ideal body weight","osteoporosis","atherosclerosis"],"a":"A","c":"營養學","c2":"營養評估","ch":"能量代謝與體重","ch2":"","t":"Harris-Benedict 公式","ex":"Harris-Benedict 公式用性別、體重、身高、年齡來估算基礎（休息）能量消耗，也就是 RMR／REE。算出來之後再乘上活動因子與壓力因子，才是一天的總能量需求。"},{"id":"115-1-4102-19","p":"115-1-4102","n":19,"q":"總能量之消耗是由不同physical activity level（PAL）乘上何者估計而得？","o":["resting metabolic rate","body mass index","total energy expenditure","thermic effect of food"],"a":"A","c":"營養學","c2":"營養評估","ch":"能量代謝與體重","ch2":"","t":"總能量消耗的估算（PAL）","ex":"總能量消耗（TEE）＝ 休息代謝率（RMR）× 身體活動程度（PAL）。TEE 是計算的結果；攝食產熱效應（TEF）只占總消耗約一成；BMI 是體位指標，不是能量。"},{"id":"115-1-4102-20","p":"115-1-4102","n":20,"q":"下列那一種酵素的作用不需要維生素C的參與？","o":["prolyl hydroxylase","glycogen phosphorylase","tyrosine hydroxylase","dopamine β-hydroxylase"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 參與的酵素","ex":"肝醣磷酸化酶（glycogen phosphorylase）的輔酶是維生素 B6（PLP），與維生素 C 無關。維生素 C 是還原劑，負責讓羥化酶裡的鐵或銅維持還原態：prolyl hydroxylase（膠原蛋白合成）、dopamine β-hydroxylase（多巴胺轉成正腎上腺素）都需要它，tyrosine hydroxylase 所在的兒茶酚胺合成路徑也需要維生素 C 參與。"},{"id":"115-1-4102-21","p":"115-1-4102","n":21,"q":"下列何者的滲透壓感測器（osmoreceptors）會偵測到體內滲透壓的升高，促使抗利尿激素分泌以保留水分？","o":["hypothalamus","hippocampus","pituitary gland","cerebral cortex"],"a":"A","c":"營養學","c2":"人體生理學與實驗","ch":"水","ch2":"","t":"滲透壓感測與抗利尿激素","ex":"偵測血漿滲透壓的感受器位在下視丘。滲透壓升高時，下視丘一方面引起口渴，一方面讓它製造的抗利尿激素（ADH）從腦下垂體後葉釋出，使腎臟集尿管多回收水分。腦下垂體只負責儲存與釋放，不負責偵測。"},{"id":"115-1-4102-22","p":"115-1-4102","n":22,"q":"關於鉀離子的排泄，下列何者正確？","o":["鉀主要經由糞便排出，尿液中排泄量較少","腎臟遠端小管和集尿管能依身體需求排出或再吸收鉀離子","鉀離子排泄量與體內鉀攝取量無關","酸中毒（acidosis）會促進鉀離子的排泄"],"a":"B","c":"營養學","c2":"人體生理學與實驗","ch":"礦物質（巨量）","ch2":"","t":"鉀的腎臟排泄","ex":"鉀約九成由尿液排出，糞便只占少量。腎絲球濾出的鉀大部分先被再吸收，最後由遠端小管與集尿管依身體需求（受醛固酮調節）分泌或再吸收，所以攝取越多排出越多。酸中毒時氫離子進入細胞、鉀移出細胞，腎臟排鉀減少，容易高血鉀。"},{"id":"115-1-4102-23","p":"115-1-4102","n":23,"q":"有關膳食鐵的吸收，下列何者正確？","o":["鐵在小腸刷狀緣的吸收是藉由簡單擴散和主動運輸","長期服用制酸劑者會降低血基質鐵（heme iron）的吸收","飲食中的植酸或草酸較不影響血基質鐵（heme iron）的吸收","同時攝取深綠色蔬菜和全穀類有利於鐵的吸收"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鐵的吸收","ex":"血基質鐵以完整的血基質形式被吸收，幾乎不受植酸、草酸、多酚等飲食因子影響。A：非血基質鐵要先還原成二價鐵，再由 DMT1 運輸蛋白送入細胞，不是簡單擴散。B：制酸劑減少胃酸，主要降低的是非血基質鐵的吸收。D：深綠色蔬菜的草酸與全穀的植酸會抑制非血基質鐵的吸收。"},{"id":"115-1-4102-24","p":"115-1-4102","n":24,"q":"教育部訂定的「學校午餐食物內容及營養基準」中，高中男生午餐的食物內容目標值，下列何者錯誤？","o":["蔬菜類2份／餐","水果類1份／餐","豆魚蛋肉類3份／餐","全穀雜糧類4～5份／餐"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"學校午餐食物內容及營養基準","ex":"依教育部「學校午餐食物內容及營養基準」的目標值，高中男生每餐為全榖雜糧類 6～7.5 份、豆魚蛋肉類 3 份、蔬菜類 2 份、水果類 1 份。4～5 份的全榖雜糧類明顯不足，接近國小階段的份量。"},{"id":"115-1-4102-25","p":"115-1-4102","n":25,"q":"35週出生的嬰兒最容易缺乏下列何種礦物質？","o":["fluoride","copper","zinc","iron"],"a":"D","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"早產兒易缺乏的礦物質","ex":"胎兒體內的鐵主要在懷孕最後三個月累積。35 週出生的早產兒鐵儲存量少，出生後追趕生長又快、需求高，所以最容易缺鐵，通常需要補充鐵劑。"},{"id":"115-1-4102-26","p":"115-1-4102","n":26,"q":"有關營養素及免疫系統的敘述，下列何者錯誤？","o":["碳水化合物於致病原之免疫辨識及抗原結合，扮演重要作用","脂肪酸可提供免疫系統能量來源及扮演訊息傳遞的角色","維生素A、C、D、E有助於維持細胞表皮的完整性，保護組織免於感染","Fe可以促進氧自由基的生成，因此會降低免疫系統的作用"],"a":"D","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"營養素與免疫","ex":"鐵是免疫細胞增殖與功能所必需：嗜中性球和巨噬細胞就是靠含鐵酵素產生氧自由基來殺菌，缺鐵會讓免疫功能下降。所以「促進氧自由基生成，因此降低免疫作用」的推論是錯的。其餘三項都正確。"},{"id":"115-1-4102-27","p":"115-1-4102","n":27,"q":"關於胺基酸的敘述，下列何者錯誤？","o":["色胺酸是合成血清素的前驅物","酪胺酸是合成副甲狀腺素的前驅物","甲硫胺酸是人體重要的甲基供應者","精胺酸參與內皮細胞一氧化氮的生成"],"a":"B","c":"營養學","c2":"生物化學（二）","ch":"蛋白質","ch2":"","t":"胺基酸的衍生物與功能","ex":"酪胺酸是甲狀腺素（T3、T4）、兒茶酚胺（多巴胺、正腎上腺素、腎上腺素）和黑色素的前驅物。副甲狀腺素是由 84 個胺基酸組成的多胜肽荷爾蒙，不是由酪胺酸衍生。其餘三項正確。"},{"id":"115-1-4102-28","p":"115-1-4102","n":28,"q":"有關蛋白質結構的敘述，下列何者正確？","o":["二級結構是多胜肽摺疊成三度空間的立體形狀","三級結構是多條多胜肽集合在一起","四級結構可被加熱破壞","鐮刀型貧血是因為tRNA出錯影響血紅素的蛋白質三級結構"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"蛋白質","ch2":"","t":"蛋白質的結構層級","ex":"一級結構是胺基酸序列；二級是 α-螺旋與 β-摺板；三級是一條多胜肽摺疊成立體形狀（A 講的是三級）；四級是多條多胜肽組合在一起（B 講的是四級）。加熱會使蛋白質變性，破壞二、三、四級結構，只有一級結構不受影響。鐮刀型貧血是血紅素基因突變，使一個麩胺酸變成纈胺酸，改變的是一級結構，不是 tRNA 出錯。"},{"id":"115-1-4102-29","p":"115-1-4102","n":29,"q":"下列那一年齡層的腸道細胞，最易吸收未經分解的蛋白質？","o":["3月齡嬰兒","3歲幼兒","13歲少年","73歲老年人"],"a":"A","c":"營養學","c2":"生命期營養","ch":"蛋白質","ch2":"","t":"嬰兒吸收完整蛋白質","ex":"嬰兒出生後頭幾個月腸道黏膜還沒成熟、通透性高，可以直接吸收未分解的完整蛋白質，例如母乳中的免疫球蛋白；這也是太早接觸某些食物蛋白質容易引起過敏的原因。隨著腸道成熟，這種能力會消失。"},{"id":"115-1-4102-30","p":"115-1-4102","n":30,"q":"下列食物的組合，何者的蛋白質品質最差？","o":["饅頭＋豆漿","薏仁＋紅豆","毛豆＋白飯","紫米＋黑豆"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質互補","ex":"黃豆、毛豆、黑豆屬於豆魚蛋肉類，是高品質蛋白質，離胺酸豐富，和缺離胺酸的穀類（饅頭、白飯、紫米）搭配有互補作用。紅豆屬於全榖雜糧類，以澱粉為主，蛋白質含量和品質都不如黃豆類，和薏仁搭配的蛋白質品質最差。"},{"id":"115-1-4102-31","p":"115-1-4102","n":31,"q":"下列那一類脂蛋白涉及reverse cholesterol transport？","o":["chylomicron","very low density lipoprotein","low density lipoprotein","high density lipoprotein"],"a":"D","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"脂蛋白與膽固醇逆運輸","ex":"膽固醇逆運輸是高密度脂蛋白（HDL）把周邊組織多餘的膽固醇帶回肝臟，再代謝或隨膽汁排出。乳糜微粒運送食物來的脂肪，VLDL 運送肝臟合成的三酸甘油酯，LDL 把膽固醇送往周邊組織。"},{"id":"115-1-4102-32","p":"115-1-4102","n":32,"q":"下列何者不是次亞麻油酸（α-linolenic acid）的代謝衍生物？","o":["prostaglandin-3","thromboxane-3","lipoxin-5","leukotriene-5"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"脂質","ch2":"","t":"n-3 脂肪酸的類二十碳酸衍生物","ex":"α-次亞麻油酸（n-3）在體內轉成 EPA，再生成第 3 系列的前列腺素與血栓素，以及第 5 系列的白三烯素。教科書中的脂氧素（lipoxin）是由 n-6 的花生四烯酸生成的第 4 系列產物，不列為 α-次亞麻油酸的代謝衍生物。"},{"id":"115-1-4102-33","p":"115-1-4102","n":33,"q":"依據最新版的「國人膳食營養素參考攝取量」，成年人每日脂質與脂肪酸的可接受範圍（acceptable macronutrient distribution ranges, AMDR）占總熱量百分比，下列何者錯誤？","o":["脂質20～30％","飽和脂肪酸＜10％","n-3多元不飽和脂肪酸10％","n-6多元不飽和脂肪酸4～8％"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"DRIs：脂質與脂肪酸的 AMDR","ex":"國人膳食營養素參考攝取量第八版的 AMDR：脂質 20～30%、飽和脂肪酸 <10%、n-6 多元不飽和脂肪酸 4～8%、n-3 多元不飽和脂肪酸 0.6～1.2%。n-3 寫成 10% 高出太多。"},{"id":"115-1-4102-34","p":"115-1-4102","n":34,"q":"下列何種油的α-linolenic acid含量相對最高？","o":["玉米油（corn oil）","大豆油（soybean oil）","亞麻仁油（flaxseed oil）","葵花籽油（sunflower oil）"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"α-次亞麻油酸的食物來源","ex":"亞麻仁油的脂肪酸有一半以上是 α-次亞麻油酸，是常見食用油中最高的。大豆油約 7%；玉米油、葵花籽油以 n-6 的亞麻油酸為主，α-次亞麻油酸很少。"},{"id":"115-1-4102-35","p":"115-1-4102","n":35,"q":"下列何者最能作為評估動脈粥狀硬化性心血管疾病風險的預測指標？","o":["總膽固醇濃度","血中small dense LDL的濃度","HDL濃度","飯後的血中三酸甘油酯濃度"],"a":"B","c":"營養學","c2":"膳食療養","ch":"脂質","ch2":"第4章 高血壓、高脂血症及心臟疾病","t":"心血管疾病風險指標","ex":"小而緻密的 LDL（small dense LDL）顆粒小，容易穿過血管內皮、容易被氧化、在血中停留時間長，致動脈粥狀硬化的能力最強，比總膽固醇更能預測風險。總膽固醇包含有保護作用的 HDL，無法區分好壞。"},{"id":"115-1-4102-36","p":"115-1-4102","n":36,"q":"葉酸以輔酶型式參與人體的代謝作用，下列組合何者正確？","o":["二氫葉酸（dihydrofolate）及DNA合成","二氫葉酸（dihydrofolate）及胺基酸代謝","四氫葉酸（tetrahydrofolate）及單碳代謝","四氫葉酸（tetrahydrofolate）及轉硫作用"],"a":"C","c":"營養學","c2":"生物化學（二）","ch":"維生素（水溶性）","ch2":"","t":"葉酸的輔酶型式與單碳代謝","ex":"葉酸要還原成四氫葉酸（THF）才是有活性的輔酶型式，負責攜帶並轉移單碳基團（甲基、亞甲基、甲醯基），用於合成嘌呤、胸腺嘧啶與同半胱胺酸的再甲基化。二氫葉酸是中間產物；轉硫作用的輔酶是維生素 B6。"},{"id":"115-1-4102-37","p":"115-1-4102","n":37,"q":"有關維生素缺乏所導致的症狀，下列何者錯誤？","o":["thiamin；Wernicke-Korsakoff syndrome","riboflavin；ariboflavinosis","folate；neural tube defects","pantothenic acid；seborrheic dermatitis"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 B 群缺乏症","ex":"泛酸分布很廣，缺乏很罕見，典型症狀是腳部灼熱感（burning feet syndrome）。脂漏性皮膚炎見於核黃素、維生素 B6 或生物素缺乏。其餘三項配對正確。"},{"id":"115-1-4102-38","p":"115-1-4102","n":38,"q":"有關抗壞血酸在腸道中的吸收，下列敘述何者正確？","o":["抗壞血酸的吸收率約為70～95％與單次攝取量無關","抗壞血酸於腸道中主要透過簡單擴散作用被吸收","脫氫抗壞血酸於腸道中主要透過簡單擴散作用被吸收","脫氫抗壞血酸被吸收後大部分會在腸細胞內被還原成抗壞血酸"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 的吸收","ex":"抗壞血酸靠鈉依賴型運輸蛋白（SVCT）以主動運輸吸收，吸收率會隨單次攝取量增加而下降，所以 A、B 錯。氧化型的脫氫抗壞血酸是經葡萄糖運輸蛋白（GLUT）以促進性擴散進入腸細胞，不是簡單擴散，C 錯；進入細胞後大部分會被還原回抗壞血酸。"},{"id":"115-1-4102-39","p":"115-1-4102","n":39,"q":"若健康成年女性攝取約710微克的膳食葉酸當量（dietary folate equivalents），除了進食中攝取300微克葉酸補充劑外，還需從飲食中攝取約多少微克的葉酸？","o":["410","260","200","118"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"膳食葉酸當量（DFE）計算","ex":"膳食葉酸當量（DFE）＝ 食物葉酸 ＋ 1.7 × 隨餐吃的葉酸補充劑。補充劑 300 μg 相當於 1.7 × 300 ＝ 510 μg DFE，所以還需要從食物攝取 710 − 510 ＝ 200 μg。"},{"id":"115-1-4102-40","p":"115-1-4102","n":40,"q":"體內約80～95％的維生素A儲存於肝臟的何種細胞中？","o":["Kupffer cells","stellate cells","hepatocytes","bile duct epithelial cells"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 A 的儲存細胞","ex":"維生素 A 以視黃酯的形式儲存在肝臟的星狀細胞（stellate cells，又稱 Ito 細胞）。肝細胞（hepatocytes）負責接收乳糜微粒殘餘物帶來的維生素 A，再轉送給星狀細胞儲存；Kupffer 細胞是肝臟的巨噬細胞。"},{"id":"115-1-4102-41","p":"115-1-4102","n":41,"q":"有關維生素E主要吸收的位置與方式，下列何者正確？","o":["十二指腸；主動轉運","空腸；被動擴散為主","迴腸；Na⁺伴隨轉運","胃；質子驅動運輸"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 E 的吸收","ex":"維生素 E 是脂溶性，需要膽鹽與胰液把它併入微膠粒，主要在空腸以被動擴散進入腸細胞，再包進乳糜微粒經淋巴系統運送。它不靠鈉伴隨運輸或質子驅動運輸，也不在胃吸收。"},{"id":"115-1-4102-42","p":"115-1-4102","n":42,"q":"新生兒在出生後數小時內需接受維生素K注射的原因為何？","o":["新生兒對乳製品中的維生素K過敏","新生兒腸道細菌會大量分解維生素K","新生兒的腸道尚未建立正常菌叢，無法合成足夠維生素K","維生素K只能由成人的肝臟合成，嬰兒無法合成"],"a":"C","c":"營養學","c2":"生命期營養","ch":"維生素（脂溶性）","ch2":"","t":"新生兒與維生素 K","ex":"維生素 K 不易通過胎盤，母乳含量也低，新生兒腸道還沒有菌叢可以合成維生素 K，肝臟儲存量又少，容易發生新生兒出血症，所以出生後常規注射維生素 K。"},{"id":"115-1-4102-43","p":"115-1-4102","n":43,"q":"有關人體吸收和排除水分的敘述，下列何者錯誤？","o":["約85％的水分是在空腸和迴腸吸收","每天約有1至1.5公升水進入結腸，幾乎都隨糞便排出","健康成人每天主要透過尿液排出1至2公升水分","呼吸道的蒸發和汗液，皆是水分排出途徑"],"a":"B","c":"營養學","c2":"","ch":"水","ch2":"","t":"水分的吸收與排出","ex":"每天進入結腸的 1 至 1.5 公升水分，絕大部分會被結腸再吸收，隨糞便排出的只有大約 100～200 毫升。其餘三項敘述正確。"},{"id":"115-1-4102-44","p":"115-1-4102","n":44,"q":"下列何種食物可提供豐富的硫？","o":["燙青菜","杏仁奶","薏仁漿","舒肥雞"],"a":"D","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"硫的食物來源","ex":"人體的硫主要來自含硫胺基酸（甲硫胺酸、半胱胺酸），所以蛋白質豐富的食物才是硫的良好來源。四個選項中舒肥雞的蛋白質最多；青菜、杏仁奶、薏仁漿的蛋白質含量都低。"},{"id":"115-1-4102-45","p":"115-1-4102","n":45,"q":"下列何種酵素之活性不需要鐵離子參與？","o":["peroxidase","aconitase","cytochrome c oxidase","DNA polymerase"],"a":"D","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"含鐵酵素","ex":"peroxidase（過氧化酶）含血基質鐵；aconitase（烏頭酸酶）是檸檬酸循環中的鐵硫蛋白；cytochrome c oxidase 含血基質鐵與銅。DNA polymerase 的輔因子是鎂，不需要鐵。DNA 合成過程中需要鐵的是核糖核苷酸還原酶。"},{"id":"115-1-4102-46","p":"115-1-4102","n":46,"q":"有關鋅的敘述，下列何者錯誤？","o":["素食者、酗酒者、短腸症與克隆氏症患者為易缺乏族群","海鮮、肉類及乳製品為良好的來源","缺乏時易發生小球型低血色素貧血、毛髮異常、骨骼異常等","19歲以上男性的足夠攝取量為15 mg/day"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鋅","ex":"缺鋅的表現是生長遲緩、味覺變差、傷口癒合慢、皮膚炎、掉髮、腹瀉、免疫力下降與性腺發育不良。小球型低血色素貧血是缺鐵的典型表現，不是缺鋅。其餘三項正確：國人成年男性鋅的建議量為每日 15 毫克。"},{"id":"115-1-4102-47","p":"115-1-4102","n":47,"q":"有關氟的敘述，下列何者正確？","o":["臺灣長年施行氟化自來水的公共衛生政策","氟結晶可對抗口腔細菌產酸對琺瑯質的腐蝕","市售瓶裝水含有豐富的氟，可有效預防齲齒","氟主要經由糞便排泄途徑，以維持體內平衡"],"a":"B","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"氟","ex":"氟會取代琺瑯質羥磷灰石中的氫氧基，形成更耐酸的氟磷灰石結晶，並抑制口腔細菌產酸。臺灣沒有實施自來水加氟，而是推廣含氟牙膏、塗氟、含氟漱口水與氟鹽；瓶裝水含氟量通常很低；氟主要由腎臟隨尿液排出。"},{"id":"115-1-4102-48","p":"115-1-4102","n":48,"q":"有關selenium的敘述，下列何者正確？","o":["土壤會影響農作物的礦物質含量，蔬果是selenium最佳來源","成人建議攝取量依據血液中selenoprotein的濃度而訂定","含硒酵素的主要活性形式是selenocysteine","組織中，selenocysteine可以作為selenium的儲存庫"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"硒","ex":"麩胱甘肽過氧化酶等含硒酵素的活性中心是硒半胱胺酸（selenocysteine）。A：硒的良好來源是海鮮、內臟與肉類，蔬果含量低而且隨土壤變動。B：建議量是依血漿含硒酵素的「活性」達到最大來訂定，不是濃度。D：組織中儲存硒的形式是硒甲硫胺酸（selenomethionine）。"},{"id":"115-1-4102-49","p":"115-1-4102","n":49,"q":"根據最新版「國人膳食營養素參考攝取量」，青春期對鈣的建議攝取量為何？","o":["鈣的建議量男女有別","鈣的建議攝取量採用RDA","13～18歲建議攝取量為1,200 mg/day","青春期上限攝取量為2,000 mg/day"],"a":"C","c":"營養學","c2":"生命期營養","ch":"礦物質（巨量）","ch2":"","t":"DRIs：青春期鈣","ex":"國人膳食營養素參考攝取量第八版中，13～18 歲的鈣為每日 1,200 毫克，是各年齡層最高。鈣採用的是足夠攝取量（AI）而不是 RDA，男女相同，上限攝取量是 2,500 毫克。"},{"id":"115-1-4102-50","p":"115-1-4102","n":50,"q":"足月產的嬰兒出生至5個月大都以全母乳哺餵時，下列何項建議最適當？","o":["母乳中氟含量很低，建議額外提供含氟飲用水來預防齲齒","若母親患有pernicious anemia，嬰兒可能需要額外補充葉酸","嬰兒滿6個月後，可以一般市售鮮牛乳作為補充","除非有食物過敏家族史，此時加入副食品無需特別避開易引發過敏的食物"],"a":"D","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"嬰兒期哺餵與副食品","ex":"目前的建議是嬰兒約 4～6 個月開始添加副食品，不需要刻意延後或避開蛋、花生等容易致敏的食物，延後並不能預防過敏。A：6 個月以下不需要補充氟。B：惡性貧血缺的是維生素 B12，嬰兒需要補充的是 B12 不是葉酸。C：滿 1 歲以前不適合用鮮牛乳取代母乳或配方奶。"}]};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function paperOf(q) { for (var i = 0; i < PAPERS.length; i++) if (PAPERS[i].id === q.p) return PAPERS[i]; return null; }
function paperName(p) { return p.y + ' 年第' + ['一', '二'][p.t - 1] + '次　' + p.subj; }
function isRight(q, k) { return q.a === '#' || q.a.indexOf(k) >= 0; }
function ansText(q) { return q.a === '#' ? '一律給分' : q.a.split('').join(' 或 '); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function byNo(a) { return a.slice().sort(function (x, y) { return x.p === y.p ? x.n - y.n : (x.p < y.p ? 1 : -1); }); }

try { REC = JSON.parse(localStorage.getItem(REC_KEY) || '{}') || {}; localStorage.setItem(REC_KEY + '-t', '1'); } catch (e) { STORE_OK = false; REC = {}; }

(function () {   // LINE 連結可帶 ?course=營養學&chapter=醣類 或 ?paper=115-1-4102
  var m = {}; location.search.replace(/[?&]([a-z]+)=([^&]*)/g, function (_, k, v) { try { m[k] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {} });
  if (m.paper && PAPERS.some(function (p) { return p.id === m.paper; })) { S.by = 'paper'; S.paper = m.paper; }
  if (m.course && COURSES.indexOf(m.course) >= 0) { S.by = 'course'; S.course = m.course; if (m.chapter && (CHAPTERS[m.course] || []).indexOf(m.chapter) >= 0) S.chapter = m.chapter; }
})();
function inCourse(q, c) { return q.c === c || q.c2 === c; }
function inChapter(q, c, ch) { return (q.c === c && q.ch === ch) || (q.c2 === c && q.ch2 === ch); }
function pool() {
  if (S.by === 'paper') return Q.filter(function (q) { return q.p === S.paper; });
  if (!S.course) return Q;
  if (S.chapter) return Q.filter(function (q) { return inChapter(q, S.course, S.chapter); });
  return Q.filter(function (q) { return inCourse(q, S.course); });
}
function seg(id, items, cur) { return '<div class="seg" id="' + id + '">' + items.map(function (x) { return '<button type="button" data-v="' + esc(x[0]) + '" class="' + (String(x[0]) === String(cur) ? 'on' : '') + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>'; }
function onSeg(id, fn) { var el = $(id); if (el) el.querySelectorAll('button').forEach(function (b) { b.onclick = function () { fn(b.getAttribute('data-v')); }; }); }

    '<div class="lab">出題順序</div>' + seg('s_order', [['rand', '隨機'], ['no', '照題號']], S.order) +
    '<div class="lab">對答案與看解析的時機</div>' + seg('s_mode', [['now', '每題作答後'], ['end', '全部寫完交卷後']], S.mode) +
    '<div style="margin-top:16px"><button type="button" class="btn" id="go"' + (n ? '' : ' disabled') + '>' + (n ? '開始測驗（' + size + ' 題）' : '這個範圍目前沒有題目') + '</button></div>' +
    '<div class="small muted" style="margin-top:8px;text-align:center">這個範圍共 ' + n + ' 題</div></div>';

  var done = Q.filter(function (q) { return REC[q.id]; }).length, wl = wrongList();
  h += '<div class="card pad"><h2>我的紀錄</h2>';
  if (!STORE_OK) h += '<div class="small muted">這個瀏覽器無法儲存資料，作答紀錄與錯題不會保留；請改用手機的 Chrome 或 Safari 開啟。</div>';
  else h += '<div class="grid3" style="margin-top:8px"><div class="stat"><span>做過的題目</span><b>' + done + '</b> ／' + Q.length + '</div><div class="stat"><span>目前錯題</span><b>' + wl.length + '</b> 題</div>' +
    '<div class="stat"><span>累計作答</span><b>' + Q.reduce(function (s, q) { return s + (REC[q.id] ? REC[q.id].n : 0); }, 0) + '</b> 次</div></div>' +
    '<div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="redo"' + (wl.length ? '' : ' disabled') + '>練習錯題</button><button type="button" class="btn warn" id="clr"' + (done ? '' : ' disabled') + '>清除紀錄</button></div>' +
    '<div class="small muted" style="margin-top:8px">錯題是最後一次答錯的題目，之後答對就會從錯題移除。</div>';
  h += '</div>';
  h += '<p class="note">試題與標準答案來源：考選部「考畢試題查詢平臺」。考選部只公布答案；上課科目與章節的分類、參考解析都是自行整理，不是官方內容，僅供複習使用，若與課本或老師的說明不同，以課本與老師為準。</p>' +
    (STORE_OK ? '<p class="note">作答紀錄只存在這支手機的瀏覽器。清除瀏覽器資料、LINE 清除快取、換手機，或 iPhone 超過一週沒打開，紀錄會消失；題目不受影響。</p>' : '');
  $('main').innerHTML = h;

  onSeg('s_by', function (v) { S.by = v; savePref(); home(); });
  onSeg('s_course', function (v) { S.course = v; S.chapter = ''; home(); });
  onSeg('s_chapter', function (v) { S.chapter = v; home(); });
  onSeg('s_size', function (v) { S.size = v === 'all' ? 'all' : +v; savePref(); home(); });
  onSeg('s_order', function (v) { S.order = v; savePref(); home(); });
  onSeg('s_mode', function (v) { S.mode = v; savePref(); home(); });
  document.querySelectorAll('.paper').forEach(function (b) { b.onclick = function () { S.paper = b.getAttribute('data-p'); home(); }; });
  $('go').onclick = function () {
    var list = S.order === 'rand' ? shuffle(pool()) : byNo(pool());
    if (S.size !== 'all') list = list.slice(0, +S.size);
    if (S.order !== 'rand') list = byNo(list);
    start(list, S.mode);
  };
  if ($('redo')) $('redo').onclick = function () { start(shuffle(wrongList()), 'now'); };
  if ($('clr')) $('clr').onclick = function () { if (confirm('確定要清除所有作答紀錄與錯題嗎？清除後無法復原。')) { REC = {}; saveRec(); home(); } };
  window.scrollTo(0, 0);
}

/* ---------- 作答 ---------- */
function start(list, mode) { if (!list.length) return; SES = { qs: list, i: 0, picks: {}, mode: mode, done: false }; showQ(); }
function answered() { return SES.qs.filter(function (q) { return SES.picks[q.id]; }).length; }
function meta(q) {
  return '<div style="margin-top:8px"><span class="tag k">' + esc(q.c) + '</span><span class="tag">' + esc(q.ch) + '</span>' + (q.c2 ? '<span class="tag">也屬於 ' + esc(q.c2) + (q.ch2 ? '・' + esc(q.ch2) : '') + '</span>' : '') + '</div>' +
    (q.t ? '<div class="small muted" style="margin-top:4px">考點：' + esc(q.t) + '</div>' : '');
}
function optHtml(q, pick, reveal, lock) {
  return KEYS.map(function (k, i) {
    var cls = '', mark = '';
    if (reveal) { if (isRight(q, k)) { cls = ' right'; mark = '正確答案'; } else if (pick === k) { cls = ' wrong'; mark = '你的答案'; } if (pick === k && isRight(q, k)) mark = '你答對了'; }
    else if (pick === k) cls = ' sel';
    return '<button type="button" class="opt' + cls + '" data-k="' + k + '"' + (lock ? ' disabled' : '') + '><span class="k">' + k + '</span><span class="x">' + esc(q.o[i]) + '</span>' + (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');
}
function expl(q) { return q.ex ? '<div class="exp"><h3>參考解析</h3>' + esc(q.ex).replace(/\n/g, '<br>') + '</div>' : ''; }
function feedback(q, pick) {
  var ok = pick && isRight(q, pick);
  return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b class="v">' + (ok ? '答對了' : pick ? '答錯了' : '未作答') + '</b>　正確答案：<b>' + esc(ansText(q)) + '</b>' + meta(q) + '</div>' + expl(q);
}
function showQ() {
  var q = SES.qs[SES.i], n = SES.qs.length, pick = SES.picks[q.id], now = SES.mode === 'now', reveal = now && !!pick, last = SES.i === n - 1, p = paperOf(q);
  head('第 ' + (SES.i + 1) + ' ／ ' + n + ' 題', now ? '每題作答後對答案' : '已作答 ' + answered() + ' 題・交卷後對答案', true);
  $('progi').style.width = ((SES.i + (pick ? 1 : 0)) / n * 100) + '%';
  var h = '<div class="card pad"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' +
    '<div class="qt">' + esc(q.q) + '</div>' + optHtml(q, pick, reveal, reveal) + (reveal ? feedback(q, pick) : '') + '</div>';
  h += '<div class="foot"><div class="row">';
  if (now) h += '<button type="button" class="btn" id="nx"' + (pick ? '' : ' disabled') + '>' + (last ? '看成績' : '下一題') + '</button>';
  else h += '<button type="button" class="btn plain" id="pv"' + (SES.i ? '' : ' disabled') + '>上一題</button>' + (last ? '<button type="button" class="btn" id="fin">交卷</button>' : '<button type="button" class="btn" id="nx">下一題</button>');
  h += '</div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () {
    if (now && SES.picks[q.id]) return;
    SES.picks[q.id] = b.getAttribute('data-k'); if (now) record(q, SES.picks[q.id]);
    var y = window.pageYOffset; showQ(); window.scrollTo(0, y);
  }; });
  if ($('nx')) $('nx').onclick = function () { if (last) finish(); else { SES.i++; showQ(); window.scrollTo(0, 0); } };
  if ($('pv')) $('pv').onclick = function () { SES.i--; showQ(); window.scrollTo(0, 0); };
  if ($('fin')) $('fin').onclick = function () { var left = n - answered(); if (!left || confirm('還有 ' + left + ' 題沒有作答，確定要交卷嗎？')) finish(); };
}
$('quit').onclick = function () {
  if (!SES) return;
  var a = answered();
  if (!a) { home(); return; }
  if (SES.mode === 'now') { if (confirm('要結束這次測驗嗎？已作答的 ' + a + ' 題會算成績。')) finish(); }
  else if (confirm('要結束這次測驗嗎？\n\n按「確定」交卷看成績，按「取消」繼續作答。')) finish();
};
function finish() {
  if (SES.mode === 'end' && !SES.done) SES.qs.forEach(function (q) { if (SES.picks[q.id]) record(q, SES.picks[q.id]); });
  SES.done = true; SES.show = 'all'; result(); window.scrollTo(0, 0);
}

/* ---------- 成績 ---------- */
function result() {
  var qs = SES.qs, right = 0, wrong = 0, none = 0, by = {}, order = [];
  qs.forEach(function (q) {
    var k = SES.picks[q.id], key = q.c + '・' + q.ch; if (!by[key]) { by[key] = [0, 0]; order.push(key); }
    if (!k) { none++; return; } by[key][1]++; if (isRight(q, k)) { right++; by[key][0]++; } else wrong++;
  });
  var done = right + wrong, pct = done ? Math.round(right / done * 100) : 0;
  head('測驗結果', '共 ' + qs.length + ' 題', false);
  var h = '<div class="card pad"><div class="grid3"><div class="stat hl"><span>答對率</span><b>' + pct + '</b> %</div><div class="stat"><span>答對</span><b>' + right + '</b> 題</div><div class="stat"><span>答錯</span><b>' + wrong + '</b> 題</div></div>' +
    '<div class="small muted" style="margin-top:8px">答對率 ＝ 答對 ÷ 已作答的 ' + done + ' 題' + (none ? '；另有 ' + none + ' 題未作答，不列入計算' : '') + '。</div>' +
    '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="again"' + (wrong ? '' : ' disabled') + '>再練這次的錯題</button><button type="button" class="btn" id="back">回首頁</button></div></div>';
  var keys = order.filter(function (k) { return by[k][1]; });
  if (keys.length > 1) h += '<div class="card pad"><h2>各章節表現</h2><table style="margin-top:4px"><tr><th>科目・章節</th><th>答對</th><th>作答</th></tr>' +
    keys.sort(function (a, b) { return by[a][0] / by[a][1] - by[b][0] / by[b][1]; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + by[k][0] + '</td><td>' + by[k][1] + '</td></tr>'; }).join('') + '</table></div>';
  h += seg('r_show', [['all', '全部 ' + qs.length], ['bad', '答錯 ' + wrong]], SES.show);
  var list = qs.filter(function (q) { var k = SES.picks[q.id]; return SES.show === 'all' || (k && !isRight(q, k)); });
  h += '<div class="card">' + (list.length ? list.map(function (q) {
    var k = SES.picks[q.id], ok = k && isRight(q, k), p = paperOf(q);
    return '<details class="rv"><summary><span class="mk ' + (!k ? 'na' : ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (!k ? '－' : ok ? '○' : '✕') + '</span><div class="st"><div class="q1">' + esc(q.q) + '</div>' +
      '<div class="small muted" style="margin-top:2px">' + (!k ? '未作答' : ok ? '答對' : '答錯') + '・你的答案 ' + (k || '—') + '・正確答案 ' + esc(ansText(q)) + '</div></div></summary>' +
      '<div class="bd"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' + optHtml(q, k, true, true) + meta(q) + expl(q) + '</div></details>';
  }).join('') : '<div class="empty">這次沒有答錯的題目</div>') + '</div><p class="note">點題目可以看選項、正確答案與參考解析。</p>';
  $('main').innerHTML = h;
  onSeg('r_show', function (v) { SES.show = v; var y = window.pageYOffset; result(); window.scrollTo(0, y); });
  $('back').onclick = home;
  $('again').onclick = function () { start(shuffle(qs.filter(function (q) { var k = SES.picks[q.id]; return k && !isRight(q, k); })), 'now'); window.scrollTo(0, 0); };
}

home();
</script>
</body>
</html>
