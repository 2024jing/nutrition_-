<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歷屆考題</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1f2a24; --muted: #5f6a63; --line: #e2e5df;
    --brand: #2f6b4f; --brand-soft: #e3efe8; --on-brand: #ffffff; --ok: #2e7d4f; --ok-soft: #e1f2e7; --on-ok: #ffffff;
    --bad: #b3261e; --bad-soft: #fbe5e3; --on-bad: #ffffff; --warm: #fff3d6; --chip: #eef0eb; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --on-ok: #10251a; --bad: #ff8a80; --bad-soft: #3a1f1d; --on-bad: #2a0f0d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --on-ok: #10251a; --bad: #ff8a80; --bad-soft: #3a1f1d; --on-bad: #2a0f0d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
  .hd { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; }
  .hd .tt { flex: 1; min-width: 0; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 4px 16px 32px; max-width: 720px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); margin: 12px 0; overflow: hidden; }
  .pad { padding: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .lab { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .lab:first-child { margin-top: 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--card); padding: 7px 13px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .chips button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chips button[disabled] { opacity: .45; cursor: default; }
  .glab { font-size: 12px; font-weight: 700; color: var(--brand); margin: 12px 0 6px; }
  .lnk { border: 0; background: transparent; color: var(--brand); font-size: 13px; font-weight: 600; padding: 8px 0 0; cursor: pointer; text-decoration: underline; }
  .chips button .c { opacity: .7; font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 4px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .btn { display: block; width: 100%; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); border-radius: 12px; padding: 13px 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.plain { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600; }
  .btn.warn { background: transparent; color: var(--bad); border-color: var(--bad-soft); font-weight: 600; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .xbtn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin: 2px 4px 2px 0; }
  .tag.k { background: var(--brand-soft); color: var(--brand); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--chip); border-radius: 12px; padding: 8px 10px; min-width: 0; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat.hl { background: var(--brand-soft); } .stat.hl b { color: var(--brand); }
  .prog { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 8px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .prog i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .2s; }
  .qt { font-size: 17px; line-height: 1.65; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px; margin-top: 8px; cursor: pointer; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  .opt .k { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .opt .x { flex: 1; min-width: 0; padding-top: 2px; }
  .opt .m { flex: 0 0 auto; font-size: 12px; font-weight: 700; padding-top: 5px; white-space: nowrap; }
  .opt.sel { border-color: var(--brand); background: var(--brand-soft); } .opt.sel .k { background: var(--brand); color: var(--on-brand); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.right .k { background: var(--ok); color: var(--on-ok); } .opt.right .m { color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt.wrong .k { background: var(--bad); color: var(--on-bad); } .opt.wrong .m { color: var(--bad); }
  .opt[disabled] { cursor: default; color: var(--ink); opacity: 1; }
  .fb { border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .fb.ok { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); }
  .fb b.v { font-size: 15px; } .fb.ok b.v { color: var(--ok); } .fb.bad b.v { color: var(--bad); }
  .exp { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
  .exp h3 { margin: 0 0 4px; font-size: 13px; color: var(--brand); }
  .foot { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  details.rv { border-top: 1px solid var(--line); }
  details.rv:first-child { border-top: 0; }
  details.rv > summary { list-style: none; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; cursor: pointer; }
  details.rv > summary::-webkit-details-marker { display: none; }
  details.rv .mk { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  details.rv .mk.ok { background: var(--ok-soft); color: var(--ok); } details.rv .mk.bad { background: var(--bad-soft); color: var(--bad); } details.rv .mk.na { background: var(--chip); color: var(--muted); }
  details.rv .st { flex: 1; min-width: 0; } details.rv .st .q1 { overflow-wrap: anywhere; }
  details.rv .bd { padding: 0 14px 14px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; }
  .note { color: var(--muted); font-size: 12px; margin: 16px 2px; }
  .tip { background: var(--warm); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .paper { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; margin-top: 8px; cursor: pointer; }
  .paper.on { border-color: var(--brand); background: var(--brand-soft); }
  .paper b { flex: 1; min-width: 0; font-size: 15px; } .paper span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .jump { display: flex; align-items: center; gap: 10px; margin: 12px 0; padding: 12px 14px; border: 1px solid var(--brand); border-radius: 14px; background: var(--brand-soft); color: var(--ink); text-decoration: none; }
  .jump b { display: block; font-size: 15px; color: var(--brand); } .jump span { display: block; font-size: 12px; color: var(--muted); } .jump b, .jump span { flex: 1 1 100%; min-width: 0; } .jump { flex-wrap: wrap; position: relative; padding-right: 34px; } .jump i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 20px; color: var(--brand); }
</style>
</head>

鈉飲食寫在A","可以用24小時飲食回憶法評估每天鈉的攝取量並記錄在M和E","每日熱量需求為1,600大卡應寫在E"],"a":"C","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"營養照護流程 ADIME 的記錄位置","ex":"ADIME 是 Assessment（評估）、Diagnosis（診斷）、Intervention（介入）、Monitoring & Evaluation（監測與評值）。身高、體重是評估資料，寫在 A；給低鈉飲食是介入，寫在 I；每日熱量需求也不是寫在 E。用 24 小時飲食回憶法追蹤鈉的攝取量，是監測與評值的工作，寫在 M 和 E。"},{"id":"115-1-1102-2","p":"115-1-1102","n":2,"q":"當營養師不能直接針對營養診斷的病因治療時，營養治療應注重於下列那一方面？","o":["改善診斷表徵和症狀","改變營養評估方式","改善營養介入方式","改變營養監測方式"],"a":"A","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"無法處理病因時的營養介入方向","ex":"營養診斷的 PES 敘述包含問題、病因、徵候與症狀。營養介入原則上針對病因；病因不是營養師能處理的（例如疾病本身）時，介入就改以減輕徵候與症狀為目標。"},{"id":"115-1-1102-3","p":"115-1-1102","n":3,"q":"急性期身體發炎狀態（inflammation）時的反應，下列血液生化值的變化何者錯誤？","o":["fibrinogen上升","C-reactive protein上升","ferritin上升","transferrin上升"],"a":"D","c":"膳食療養","c2":"","ch":"第1章 營養照護","ch2":"","t":"發炎時的急性期蛋白","ex":"發炎時肝臟增加合成正急性期蛋白，包括 C 反應蛋白、纖維蛋白原、儲鐵蛋白、銅藍蛋白；負急性期蛋白則下降，包括白蛋白、前白蛋白、運鐵蛋白、視網醇結合蛋白。所以運鐵蛋白是下降，不是上升。"},{"id":"115-1-1102-4","p":"115-1-1102","n":4,"q":"有關給與胃造口泥狀飲食灌食（pureed by gastrostomy tube diet, PBGT）的原則，下列敘述何者最不適當？","o":["需要有專業營養師為之設計配方","可以提供完整營養且熱量設計屬於熱量密度較高的飲食","需要利用幫浦穩定的供應病人故成本較高","可以促進病人想利用經口進食之意願"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第2章 營養支持","ch2":"3 營養支持之飲食","t":"胃造口攪打飲食的灌食方式","ex":"攪打成泥狀的天然食物配方質地濃稠，通常用灌食空針分次批式灌入胃造口，不需要也不適合用幫浦連續灌食，成本也比商業配方低。它仍需由營養師設計，才能確保營養完整與熱量密度。"},{"id":"115-1-1102-5","p":"115-1-1102","n":5,"q":"更年期婦女使用荷爾蒙療法estrogen（Premarin）建議額外補充何種營養素？","o":["鐵和維生素C","維生素A和維生素D","鈣和維生素D","鋅和維生素A"],"a":"C","c":"膳食療養","c2":"","ch":"第14章 飲食、營養與藥物的交互作用","ch2":"","t":"雌激素療法與鈣、維生素 D","ex":"雌激素療法常用於停經後婦女，停經後骨質流失加速，所以建議同時補足鈣與維生素 D，預防骨質疏鬆。"},{"id":"115-1-1102-6","p":"115-1-1102","n":6,"q":"王先生腸阻塞住院使用全靜脈營養，下列敘述何者錯誤？","o":["10%脂質乳劑每毫升提供1.1大卡","胺基酸溶液中每1公克胺基酸提供4大卡","葡萄糖溶液中每1公克葡萄糖提供4大卡","20%脂質乳劑每毫升提供2.0大卡"],"a":"C","c":"膳食療養","c2":"","ch":"第2章 營養支持","ch2":"","t":"靜脈營養各成分的熱量","ex":"靜脈營養用的是含水葡萄糖（dextrose monohydrate），每公克提供 3.4 大卡，不是 4 大卡。胺基酸每公克 4 大卡；脂肪乳劑因含甘油與乳化劑，10% 每毫升 1.1 大卡、20% 每毫升 2.0 大卡。"},{"id":"115-1-1102-7","p":"115-1-1102","n":7,"q":"吳先生腸胃道功能正常，因喝農藥自殺導致食道嚴重灼傷，醫師評估1年後才可能由口進食，治療期間需使用灌食才能獲得足夠營養。下列何種灌食管置放方式最適合？","o":["nasogastric tube","nasoduodenal tube","laparoscopic gastrostomy","percutaneous endoscopic jejunostomy"],"a":"C","c":"膳食療養","c2":"","ch":"第2章 營養支持","ch2":"","t":"長期管灌的途徑選擇","ex":"預期灌食超過 4～6 週應選造口。腸胃道功能正常，灌到胃即可，不必到空腸。鼻胃管、鼻十二指腸管要經過灼傷的食道，而且只適合短期；經皮內視鏡造口也要讓內視鏡通過食道，風險高。所以以腹腔鏡做胃造口最適合。"},{"id":"115-1-1102-8","p":"115-1-1102","n":8,"q":"有關肥胖的體重管理，下列何者錯誤？","o":["減輕原始體重的5～10%能改善血糖、血壓、血脂及多種發炎指標","65歲以上的老人減重可能會導致lean body mass流失","6個月內減輕10%體重後的6個月內應將重點放在維持體重","同樣熱量限制下，肥胖程度較高者減重速度通常慢於肥胖程度較低者"],"a":"D","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"肥胖的體重管理原則","ex":"在相同的熱量限制下，肥胖程度較高的人體重大、能量消耗高，熱量赤字也大，減重速度通常比較快，不是比較慢。其餘三項都是體重管理的正確原則。"},{"id":"115-1-1102-9","p":"115-1-1102","n":9,"q":"有關神經性厭食症（Anorexia nervosa）病人的營養評估，下列何者正確？","o":["內臟蛋白（visceral protein）顯著減少","通常血清albumin濃度過低","血清prealbumin濃度為較敏感的營養不良指標","常有高膽固醇血症，需介入低脂飲食"],"a":"C","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"神經性厭食症的營養評估","ex":"神經性厭食症屬於熱量長期不足的消瘦型營養不良，內臟蛋白質通常還能維持，血清白蛋白多在正常範圍，所以 A、B 錯。病人常見高膽固醇血症，但體重恢復後會改善，不需要低脂飲食。前白蛋白半衰期只有約 2 天，比白蛋白更能反映近期的營養變化。"},{"id":"115-1-1102-10","p":"115-1-1102","n":10,"q":"下列何者可作為診斷代謝症候群的相關指標？","o":["血糖不耐、痛風、高血壓","痛風、高血壓、高膽固醇","血糖不耐、高血壓、高三酸甘油酯","低血糖、高血壓、中間型肥胖"],"a":"C","c":"膳食療養","c2":"","ch":"第3章 體重控制與管理","ch2":"","t":"代謝症候群的判定指標","ex":"代謝症候群的五項指標是腹部肥胖、血壓偏高、空腹血糖偏高、三酸甘油酯偏高、高密度脂蛋白膽固醇偏低，符合三項即成立。痛風、總膽固醇、低血糖都不在指標內。"},{"id":"115-1-1102-11","p":"115-1-1102","n":11,"q":"飲食中鈣質攝取不足時，人體維持鈣恆定作用（calcium homeostasis）的機制，下列何者正確？①鈣三醇（calcitriol）促進腸道的鈣吸收率　②副甲狀腺素減少尿鈣流失　③甲狀腺素促進破骨作用（bone resorption）　④骨骼貯存的鈣質可供維持血中濃度所需　⑤成骨細胞（osteoblasts）活性增加","o":["①②③","①②④","①④⑤","②③④"],"a":"B","c":"膳食療養","c2":"","ch":"第12章 內分泌與新陳代謝疾病","ch2":"","t":"鈣恆定的調節","ex":"鈣攝取不足使血鈣下降時，副甲狀腺素分泌增加：促進腎臟再吸收鈣（減少尿鈣流失）、促進腎臟活化維生素 D，鈣三醇再提高腸道鈣吸收率；同時刺激破骨作用，由骨骼釋出鈣。促進破骨的是副甲狀腺素，不是甲狀腺素；成骨細胞活性也不會增加。"},{"id":"115-1-1102-12","p":"115-1-1102","n":12,"q":"某病人服用allopurinol（Zyloprim）藥物，下列何者是此藥物主要功效？","o":["抑制HMG-CoA reductase","抑制xanthine oxidase","抑制HMG-CoA synthase","治療高膽固醇血症"],"a":"B","c":"膳食療養","c2":"","ch":"第12章 內分泌與新陳代謝疾病","ch2":"","t":"痛風用藥 allopurinol 的作用","ex":"allopurinol 抑制黃嘌呤氧化酶，減少尿酸生成，用於治療痛風與高尿酸血症。抑制 HMG-CoA 還原酶、治療高膽固醇血症的是 statin 類藥物。"},{"id":"115-1-1102-13","p":"115-1-1102","n":13,"q":"關於消化性潰瘍（peptic ulcer）的處置方法，下列何者正確？","o":["可使用非固醇類抗發炎藥物（NSAIDs）止痛","沒有幽門螺旋桿菌感染，也要使用抗生素和止痛藥治療以免病情惡化","抽菸可減少病人的壓力，降低壓力即可以改善消化性潰瘍症狀","可以增加味噌、優格等醱酵類食物攝取"],"a":"D","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"消化性潰瘍的處置","ex":"非類固醇抗發炎藥本身就是造成潰瘍的原因，不能用來止痛；抗生素只用在有幽門螺旋桿菌感染時；抽菸會延緩潰瘍癒合。味噌、優格等發酵食物含益生菌，可以適量增加。"},{"id":"115-1-1102-14","p":"115-1-1102","n":14,"q":"陳先生日前因進行部分胃切除手術，造成進食後發生了腹痛、腹脹、噁心、嘔吐、潮紅、頭痛等症狀，下列飲食原則何者正確？","o":["應給與含水量豐富的流質、半流質食物","用餐後需要坐正，以利消化","應選擇水溶性膳食纖維比較豐富的食物","喝牛奶比吃起司的耐受性高"],"a":"C","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"7 調整醣類之飲食","t":"傾食症候群的飲食原則","ex":"這是胃切除後的傾食症候群。飲食原則是少量多餐、用餐時不喝湯水（液體在兩餐之間喝）、餐後平躺 20～30 分鐘、避免濃縮甜食。水溶性纖維（如果膠）可以延緩胃排空、減緩症狀。胃切除後常有乳糖不耐，起司乳糖少，耐受性比牛奶好。"},{"id":"115-1-1102-15","p":"115-1-1102","n":15,"q":"有關治療便秘的藥物，下列那一項不是藉由增加腸道滲透壓的原理來改善？","o":["magnesium oxide","sorbitol","bisacodyl","lactulose"],"a":"C","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"瀉劑的作用機轉","ex":"氧化鎂、山梨醇、乳果糖都是滲透性瀉劑，把水分留在腸腔內軟化糞便。bisacodyl 是刺激性瀉劑，直接刺激腸壁蠕動。"},{"id":"115-1-1102-16","p":"115-1-1102","n":16,"q":"關於腹瀉的處置，下列敘述何者正確？","o":["腹瀉時應減少含乳糖的食物，而蔗糖及果糖對腹瀉的影響較小，可以不必限制","WHO建議兒童急性腹瀉時使用低滲透壓的補水水溶液（oral rehydration solution）比等滲透壓的補水水溶液更能減少排便量及嘔吐","發生腹瀉時應採用低纖維飲食，水溶性及非水溶性纖維均應該避免","目前對於困難梭狀桿菌（Clostridium difficile）感染最好的治療方法是抗生素治療"],"a":"B","c":"膳食療養","c2":"","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"","t":"腹瀉的處置","ex":"世界衛生組織建議使用低滲透壓的口服補水液，比舊配方更能減少排便量與嘔吐。A：果糖、蔗糖、糖醇也會造成滲透性腹瀉，同樣要限制。C：水溶性纖維能吸水使糞便成形，不必避免。D：困難梭狀桿菌感染常由抗生素引起，復發的個案以糞便微菌叢移植效果較好。"},{"id":"115-1-1102-17","p":"115-1-1102","n":17,"q":"病人需要gluten-free diet的飲食醫囑時，下列那一種食物需要被排除？","o":["蕎麥","黑麥","杏仁","黃豆"],"a":"B","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"10 特殊飲食","t":"無麩質飲食要排除的穀類","ex":"麩質存在於小麥、大麥、黑麥（rye）及其製品。蕎麥名稱有「麥」但不含麩質，杏仁、黃豆也不含。"},{"id":"115-1-1102-18","p":"115-1-1102","n":18,"q":"李小明13歲，為第1型糖尿病病人，平日以彈性胰島素注射治療，他的早餐ICR（insulin to carbohydrate ratio）為5 g/U，餐前血糖值為128 mg/dL，他想吃一個摩斯鱈魚堡（CHO：41g），他早餐前建議注射幾單位胰島素最適當？","o":["6U","7U","8U","9U"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"依醣類比值計算餐前胰島素","ex":"醣類 41 公克 ÷ 每單位胰島素可處理 5 公克 ＝ 8.2 單位，約 8 單位。餐前血糖 128 mg/dL 在目標範圍內，不需要再加校正劑量。"},{"id":"115-1-1102-19","p":"115-1-1102","n":19,"q":"有關糖尿病的急性併發症敘述，下列何者錯誤？","o":["diabetic ketoacidosis（DKA）症狀多為呼吸急促有丙酮氣味","diabetic ketoacidosis（DKA）治療目標以矯正電解質及適量胰島素為主","hyperglycemic hyperosmolar state（HHS）常見於胰島素治療的第1型病人","hyperglycemic hyperosmolar state（HHS）脫水較DKA嚴重，常見於高齡臥床者"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"糖尿病急性併發症 DKA 與 HHS","ex":"高血糖高滲透壓狀態（HHS）常見於第 2 型糖尿病的年長者，尤其是臥床、水分攝取不足的人，脫水比酮酸中毒更嚴重。酮酸中毒（DKA）才常見於第 1 型糖尿病。"},{"id":"115-1-1102-20","p":"115-1-1102","n":20,"q":"有關糖尿病的代謝異常，下列敘述何者錯誤？","o":["肝臟糖質新生作用增加","肌肉的蛋白質異化作用增加","脂解作用降低","血中游離脂肪酸濃度增加"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"糖尿病的代謝異常","ex":"胰島素作用不足時，脂肪組織的脂解作用會增加，血中游離脂肪酸上升，進而產生酮體。肝臟糖質新生增加、肌肉蛋白質分解增加也都是胰島素不足的結果。"},{"id":"115-1-1102-21","p":"115-1-1102","n":21,"q":"關於胰島素使用的敘述，下列何者錯誤？","o":["長效胰島素多用做為基礎胰島素","避免清晨時的高血糖，入睡時可使用ultralente","為了有最好的效果，NPH需在飯前30～60分鐘注射","注射insulin lispro後應儘快進食"],"a":"C","c":"膳食療養","c2":"","ch":"第6章 糖尿病","ch2":"","t":"各類胰島素的作用時間與注射時機","ex":"NPH 是中效胰島素，作用開始得慢、持續時間長，用來提供基礎量，不需要配合在飯前 30～60 分鐘注射；要在飯前約 30 分鐘注射的是短效的 regular insulin。速效的 lispro 注射後應立即進食。"},{"id":"115-1-1102-22","p":"115-1-1102","n":22,"q":"張先生170公分，88公斤，使用腹膜透析治療後因蛋白質流失多，血液白蛋白濃度低但是體重卻一直增加，有關他的每日飲食熱量建議應如何調整？","o":["30～35 kcal/kg加上透析時蛋白質流失的熱量","30～35 kcal/kg加上代謝透析液消耗的熱量","30～35 kcal/kg扣除由透析液吸收的脂肪熱量","30～35 kcal/kg扣除由透析液吸收的葡萄量熱量"],"a":"D","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"腹膜透析的熱量建議","ex":"腹膜透析液含高濃度葡萄糖，留置時會被吸收，每天可多出數百大卡。病人體重持續增加時，熱量建議要用 30～35 大卡／公斤，再扣掉由透析液吸收的葡萄糖熱量。"},{"id":"115-1-1102-23","p":"115-1-1102","n":23,"q":"張先生178公分，乾體重80公斤，無尿，每週一、三、五血液透析。週五透析前他可以增加的水重是多少？","o":["體重增加不超過乾體重的4～5%為原則","體重增加不超過2～3磅為原則","體重增加不超過4～5公斤為原則","以每日水分攝取500 mL＋urine output量為原則"],"a":"A","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"血液透析兩次之間的體重增加","ex":"血液透析病人兩次透析之間的體重增加，以不超過乾體重的 4～5% 為原則，增加太多表示水分與鈉攝取過量。「前一天尿量加 500 毫升」是估計每日水分攝取量的方法，不是在回答體重可以增加多少。"},{"id":"115-1-1102-24","p":"115-1-1102","n":24,"q":"關於評估末期腎病變病患的透析效率，下列敘述何者正確？","o":["URR（urea reduction ratio）是透析前後BUN的廓清率","Kt/V是一次血液透析時間內的BUN降低率","PNA（protein-nitrogen appearance）的參考值是1.4～3.2","eKt/V其中的e為考慮到透析停止後尿素在細胞膜上達到平衡所花費的時間"],"a":"D","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"透析效率指標 URR、Kt/V、PNA","ex":"URR 是透析前後血中尿素氮下降的百分比，不是廓清率。Kt/V 是透析器的尿素廓清率乘以透析時間、再除以尿素分布體積，代表透析劑量。PNA 的參考值大約是每公斤 0.8～1.4 公克。eKt/V 的 e 是 equilibrated，考慮了透析結束後尿素從組織回到血液、重新達到平衡的現象。"},{"id":"115-1-1102-25","p":"115-1-1102","n":25,"q":"有關腎臟移植後的異常現象，下列何者較不常見？","o":["hyperphosphatemia","hyperkalemia","hyperglycemia","hyperlipidemia"],"a":"A","c":"膳食療養","c2":"","ch":"第7章 腎臟疾病","ch2":"","t":"腎臟移植後的代謝異常","ex":"腎臟移植後使用類固醇與其他免疫抑制劑，常見高血糖、高血脂與高血鉀。血磷則常偏低，因為移植腎排磷增加、副甲狀腺素仍然偏高，所以高血磷較不常見。"},{"id":"115-1-1102-26","p":"115-1-1102","n":26,"q":"有關高血壓的危險因子，下列何者錯誤？","o":["persistent diastolic pressure 100～115 mmHg","impaired renal function","diabetes mellitus","heart failure"],"a":"A","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"高血壓的危險因子","ex":"舒張壓持續在 100～115 mmHg 是高血壓本身的嚴重程度，不是危險因子。腎功能不良、糖尿病、心臟衰竭則是與高血壓相關、會影響預後的因子。"},{"id":"115-1-1102-27","p":"115-1-1102","n":27,"q":"張先生66歲（身高168公分，體重80公斤），為高血壓患者，平時多外食，口味偏重。請問其飲食衛教重點最適合優先考量下列何者？","o":["每日補充鉀2,000毫克以上","教導外食如何選擇低鹽菜色","使用含單元不飽和脂肪酸高的油脂烹調","每週運動3次，每次30分鐘"],"a":"B","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"6 調整礦物質之飲食","t":"高血壓個案的衛教優先順序","ex":"個案的主要問題是常外食、口味重，鈉攝取量高，所以優先教他外食時如何選擇低鹽菜色。鉀應由蔬果等食物取得，不是「補充」；用油與運動也重要，但不是最優先。"},{"id":"115-1-1102-28","p":"115-1-1102","n":28,"q":"下列何者不是粥狀動脈硬化（atherosclerosis）的危險因子？","o":["HDL偏低","低同半胱胺酸血症（hypohomocysteinemia）","活動量偏低","個人基因特性"],"a":"B","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"動脈粥狀硬化的危險因子","ex":"同半胱胺酸偏高才是動脈粥狀硬化的危險因子，偏低不是。高密度脂蛋白偏低、活動量不足、遺傳體質都是危險因子。"},{"id":"115-1-1102-29","p":"115-1-1102","n":29,"q":"下列有關DASH Diet之敘述，何者最不適當？","o":["DASH Diet增加鎂的攝取，有助於改善血壓","DASH Diet加上鈉攝取量之控制，可更有效降低血壓","DASH Diet適用於末期腎臟病（end-stage renal disease）病人","DASH Diet適用於高膽固醇血症病人"],"a":"C","c":"膳食療養","c2":"","ch":"第4章 高血壓、高脂血症及心臟疾病","ch2":"","t":"DASH 飲食的適用對象","ex":"DASH 飲食強調蔬果、全穀、低脂乳品與堅果，鉀、磷、鎂、蛋白質含量都高。末期腎臟病病人需要限制鉀與磷，不適合採用。"},{"id":"115-1-1102-30","p":"115-1-1102","n":30,"q":"有關重症病人在異化作用（catabolism）發生時，體內營養素代謝作用之變化，下列敘述何者錯誤？","o":["醣類代謝方面，因促進糖質新生（gluconeogenesis）、肝醣分解（glycogenolysis）及組織胰島素阻抗（insulin resistance）而有高血糖（hyperglycemia）現象","脂質代謝方面，因促進脂質分解（lipolysis）而產生的游離脂肪酸（free fatty acid）可作為大部分組織能量來源","蛋白質代謝方面，因促進肌肉蛋白質分解而產生的胺基酸可提供肝臟利用，合成急性期蛋白質（acute phase protein）","礦物質代謝方面，當伴隨發炎反應及肝臟合成急性期蛋白質，血中鐵、鋅及血漿銅藍蛋白（ceruloplasmin）濃度皆會下降"],"a":"D","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症時三大營養素與礦物質的代謝變化","ex":"發炎與急性期反應時，血中的鐵與鋅會下降；但銅藍蛋白是正急性期蛋白，血中的銅與銅藍蛋白反而上升。其餘三項關於醣類、脂質、蛋白質代謝的敘述都正確。"},{"id":"115-1-1102-31","p":"115-1-1102","n":31,"q":"對於急重症病人，評估其營養不良程度之條件，下列敘述何者正確？","o":["在能量攝取方面，每日熱量攝取量≦50%之設定總熱量，且時間≧5天可評估為嚴重的營養不良","在體重流失方面，在一個月的時間下體重流失重量超過原來體重的7.5%可評估為非嚴重的營養不良","在手的握力方面，經測量如果握力下降則可以評估為非嚴重的營養不良","在體內水分堆積方面，中等至嚴重程度之水腫則可評估為非嚴重的營養不良"],"a":"A","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"急重症營養不良的判定標準","ex":"依成人營養不良的判定共識，急性疾病時熱量攝取在需求的 50% 以下達 5 天以上，屬於嚴重營養不良。一個月內體重流失超過 5% 就算嚴重，所以 7.5% 不是「非嚴重」；握力明顯下降、中度到重度水腫也都列在嚴重等級。"},{"id":"115-1-1102-32","p":"115-1-1102","n":32,"q":"關於燒燙傷病人營養支持，下列敘述何者錯誤？","o":["對於總燒傷面積（total body surface area, TBSA）為15%的病人，宜積極以管灌營養支持的方式達到營養目標","燒燙傷病人當出現胃部功能不良，可以鼻腸管灌營養支持的方式達到營養目標","當需要用靜脈營養支持時，若以大豆油為主的脂肪乳劑輸液則可能會有免疫抑制現象","臨床上鼓勵病人儘快由口進食，且可利用含高熱量濃度及高蛋白質之飲料來補充"],"a":"A","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"10 特殊飲食","t":"燒燙傷的營養支持","ex":"燒傷面積在 20% 以下的病人，通常可以由口進食高熱量、高蛋白的飲食達到需求；面積超過 20% 才建議積極以管灌補足。所以 15% 就積極管灌並不適當。"},{"id":"115-1-1102-33","p":"115-1-1102","n":33,"q":"在計算給予重症病人所需要的熱量時，下列敘述何者正確？","o":["可利用公式計算，將病人之理想體重帶入公式25～30 kcal/kg bw/day","所有重症病人每日所需的熱量皆能使用間接能量測定儀（indirect calorimetry, IC）準確計算出來","熱量給予過量，除了可能會引發重症病人血糖過高及脂肪肝外，有可能會增加呼吸器的使用時間","當重症病人以呼吸器來維持血中氧氣含量時，使用間接能量測定儀更能精確評估其熱量需求"],"a":"C","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"重症病人的熱量估算","ex":"熱量給太多會造成高血糖、脂肪肝，並增加二氧化碳產量，加重呼吸負擔、延長呼吸器使用時間。A：公式用的不是一律代入理想體重。B、D：間接能量測定在吸入氧濃度很高、管路漏氣等情況下並不準確，不是所有重症病人都能測。"},{"id":"115-1-1102-34","p":"115-1-1102","n":34,"q":"有關cystic fibrosis（CF）病人的症狀，下列何者最不常見？","o":["腎絲球腎炎","脂肪肝","胰臟功能異常","呼吸困難、肺炎"],"a":"A","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"囊狀纖維化的臨床表現","ex":"囊狀纖維化是外分泌腺的遺傳疾病，黏稠分泌物阻塞肺、胰臟、肝膽與腸道，造成反覆肺部感染、胰臟外分泌不足與相關糖尿病、脂肪肝等。腎絲球腎炎不是它的常見表現。"},{"id":"115-1-1102-35","p":"115-1-1102","n":35,"q":"有關肺部惡病質（pulmonary cachexia）的症狀和營養照護敘述，下列何者錯誤？","o":["anorexia是典型的症狀","熱量需求依目前體重給予40 kcal/kg","病人肌肉大量流失，有嚴重的負氮平衡","當熱量攝取不足或脫水時可能會造成疲勞和便秘"],"a":"B","c":"膳食療養","c2":"","ch":"第10章 肺部疾病","ch2":"","t":"肺部惡病質的營養照護","ex":"肺部惡病質的熱量需求偏高，但給予過多會增加二氧化碳產量、加重呼吸負擔，所以不是直接用目前體重乘以每公斤 40 大卡。厭食、肌肉流失與負氮平衡、疲勞和便秘都是常見的情形。"},{"id":"115-1-1102-36","p":"115-1-1102","n":36,"q":"有關癌症病人身體脫水（dehydration）後的徵兆，下列何者最不常見？","o":["體重減輕","尿量增加","口腔黏膜乾燥","尿液深色"],"a":"B","c":"膳食療養","c2":"","ch":"第8章 腫瘤與癌症","ch2":"","t":"癌症病人脫水的徵兆","ex":"脫水時身體會保留水分，尿量減少、尿色變深，並有口腔黏膜乾燥、體重減輕等表現。尿量增加不是脫水的徵兆。"},{"id":"115-1-1102-37","p":"115-1-1102","n":37,"q":"有關癌症導致的能量代謝改變，下列何者正確？","o":["增加葡萄糖有氧代謝，因此熱量需要增加","增加細胞激素（cytokines）分泌，是導致惡病質的重要原因","脂質氧化大量增加，因此增加胰島素敏感性加速醣類代謝","增加蛋白質合成率以因應肌肉分解增加"],"a":"B","c":"膳食療養","c2":"","ch":"第8章 腫瘤與癌症","ch2":"","t":"癌症的代謝改變與惡病質","ex":"腫瘤與宿主分泌的細胞激素（如 TNF-α、IL-6）是造成惡病質的重要原因。A：腫瘤主要增加的是無氧糖解。C：會出現胰島素阻抗，不是敏感性增加。D：肌肉蛋白質合成減少、分解增加。"},{"id":"115-1-1102-38","p":"115-1-1102","n":38,"q":"短式迷你營養評估（Mini Nutritional Assessment-Short Form, MNA-SF）可用於篩檢營養不良的老年人，其評估指標不包括那一項？","o":["近三個月體重改變情況","目前活動能力","精神心理狀態","體脂率百分比"],"a":"D","c":"膳食療養","c2":"營養評估","ch":"第1章 營養照護","ch2":"臨床評估與篩檢工具","t":"MNA-SF 的評估項目","ex":"MNA-SF 有六題：近三個月進食量減少、近三個月體重減輕、活動能力、近三個月有無心理壓力或急性疾病、神經精神問題、身體質量指數（無法測量時改用小腿圍）。不包括體脂率。"},{"id":"115-1-1102-39","p":"115-1-1102","n":39,"q":"依據美國國家壓力性損傷諮詢委員會等組織於2019年的指引，針對第II～IV級壓力性損傷的病人建議補充那些營養素？①鋅　②富含精胺酸的蛋白質　③ω-3脂肪酸　④鐵　⑤抗氧化營養素","o":["①③④","②④⑤","②③⑤","①②⑤"],"a":"D","c":"膳食療養","c2":"","ch":"第9章 生理壓力：手術、創傷、燒傷及敗血症","ch2":"","t":"壓力性損傷的營養補充","ex":"2019 年的國際壓力性損傷指引建議：第 II 級以上、營養不良或有風險的成人，提供高熱量、高蛋白，並含精胺酸、鋅與抗氧化營養素的營養補充品。ω-3 脂肪酸和鐵不在建議內。"},{"id":"115-1-1102-40","p":"115-1-1102","n":40,"q":"下列何種症狀不是預測老年人死亡率的重要指標？","o":["presbycusis","sarcopenia","dysgeusia","dysphagia"],"a":"A","c":"生命期營養","c2":"","ch":"老年期","ch2":"","t":"老年人死亡率的預測指標","ex":"肌少症（sarcopenia）、吞嚥困難（dysphagia）、味覺異常（dysgeusia）都會影響進食與營養狀態，和老年人的死亡率有關。presbycusis 是老年性聽力退化，不是預測死亡率的重要指標。"},{"id":"115-1-2102-1","p":"115-1-2102","n":1,"q":"有關影響亞健康高齡者飲食之因素，下列敘述何者錯誤？","o":["高齡者唾液分泌增加造成吞嚥困難","高齡者消化道蠕動減緩及小腸細胞吸收率下降會影響營養素吸收","高齡者視覺及聽覺退化，降低對食物辨識度與進食能力而影響食慾","高齡者使用不當假牙導致纖維量攝取降低"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"高齡者影響進食的生理變化","ex":"高齡者的唾液分泌是減少，不是增加；口乾使食物不易形成食團，才造成咀嚼與吞嚥困難。其餘三項都是影響高齡者飲食的常見因素。"},{"id":"115-1-2102-2","p":"115-1-2102","n":2,"q":"衛生福利部國民健康署推動「我的餐盤」6口訣，下列何者錯誤？","o":["每餐水果拳頭大","菜比水果多一點","飯跟蔬菜一樣多","堅果種子1湯匙"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"我的餐盤六口訣","ex":"我的餐盤六口訣是：每天早晚一杯奶、每餐水果拳頭大、菜比水果多一點、飯跟蔬菜一樣多、豆魚蛋肉一掌心、堅果種子一茶匙。堅果種子是每餐一茶匙，不是一湯匙。"},{"id":"115-1-2102-3","p":"115-1-2102","n":3,"q":"依民國109年修訂幼兒園餐點食物內容及營養基準及食譜範例，下列敘述何者錯誤？","o":["一律採用國內在地豬肉食材","甜品應以低糖之全穀雜糧類為宜，如：綠豆湯","餐食應充分加熱，避免冷食，如：壽司","可提供果凍方便幼兒食用"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"幼兒園餐點的供應原則","ex":"果凍質地滑溜，幼兒容易噎到，營養價值也低，不適合提供。其餘三項都是基準中的原則：選用國產食材、甜品以低糖的全穀雜糧為宜、餐食要充分加熱避免冷食。"},{"id":"115-1-2102-4","p":"115-1-2102","n":4,"q":"臺灣農作物最易受到下列何者天然災害影響？","o":["乾旱、焚風、氣爆","爆炸、地層下陷、颱風","水災、環境污染、焚風","水災、颱風、乾旱"],"a":"D","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"影響農作物供應的天然災害","ex":"臺灣農作物最常受到的天然災害是颱風、水災（豪雨）與乾旱。氣爆、爆炸、環境污染不是天然災害。"},{"id":"115-1-2102-5","p":"115-1-2102","n":5,"q":"下列何者是西式菜單正確的命名方法？","o":["chilled apple juice是以供應食物溫度為特徵來命名","new potato是以食物色彩為特徵來命名","Italian macaroni是以供應食物調味為特徵來命名","sweet-sour pork是以食物製備方法為特徵來命名"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"西式菜單的命名方式","ex":"chilled apple juice 的 chilled 是冰鎮，以供應溫度命名。new potato 是以食材的生長時期命名；Italian macaroni 是以產地或國名命名；sweet-sour pork 是以調味命名。"},{"id":"115-1-2102-6","p":"115-1-2102","n":6,"q":"下列中英名詞配對，何者正確？","o":["As purchase：使用量","Edible portion：廢棄率","Cafeteria service：速簡餐食服務","Buffet service：定量供餐"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"供膳型態","ch2":"","t":"團膳常用中英名詞","ex":"As purchased（AP）是購買量；Edible portion（EP）是可食量；Buffet 是自助取用、不定量的供餐方式。Cafeteria service 是顧客沿配膳線自取、依所取菜餚計價的速簡餐食服務。"},{"id":"115-1-2102-7","p":"115-1-2102","n":7,"q":"有關食物貯存，下列敘述何者錯誤？","o":["將豆腐泡水冷藏可延長保存期限","魚買回後不去除內臟可直接冷凍以免細菌污染造成腐壞","豬肉絲建議依使用量分裝並壓扁以利貯存","白米若能保存在10℃及水分13%較不易變質"],"a":"B","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"各類食材的貯存方法","ex":"魚買回來要先去鱗、去鰓、去內臟並洗淨，再分裝冷凍；內臟帶有大量細菌與酵素，不去除會加速腐敗。其餘三項都是正確的貯存方式。"},{"id":"115-1-2102-8","p":"115-1-2102","n":8,"q":"有關蛋品驗收標準，下列敘述何者錯誤？","o":["蛋殼無破損且外表清潔","帶殼蛋色澤正常且經抽驗搖動有聲音","冷藏殺菌液體蛋需包裝完整並標示完全","液體蛋應冷藏運送且不得有回溫或變質現象"],"a":"B","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"蛋品的驗收標準","ex":"蛋搖動時有聲音，表示水分蒸發、氣室變大、蛋白變稀，是不新鮮的蛋，驗收時應該是搖動沒有聲音。"},{"id":"115-1-2102-9","p":"115-1-2102","n":9,"q":"有關大量採買食材應儘量避免向下列何種廠商購買？","o":["零批商","批發商","代理商","零售商"],"a":"D","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"大量採購的供應商選擇","ex":"零售商是供應鏈的最末端，價格最高、供應量也小，大量採購應向批發商、代理商或產地直接購買。"},{"id":"115-1-2102-10","p":"115-1-2102","n":10,"q":"下列何種採購制度適用於緊急採購？","o":["集中採購","議價採購","招標採購","報價採購"],"a":"B","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"緊急採購適用的採購制度","ex":"議價採購是直接和特定廠商協商價格與條件，程序最快，適合緊急採購或只有獨家供應的情形。招標採購程序長；集中採購是多個單位合併採購。"},{"id":"115-1-2102-11","p":"115-1-2102","n":11,"q":"油脂的分級標準不包含下列何者？","o":["外觀","TBA價","皂化價","比重"],"a":"B","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"油脂的分級標準","ex":"油脂的分級是看外觀色澤、比重、折射率、酸價、皂化價、碘價等性質。TBA 價是測定脂質氧化酸敗程度的指標，多用在肉品與含油食品的品質檢測，不在分級標準內。"},{"id":"115-1-2102-12","p":"115-1-2102","n":12,"q":"下列何者屬不公開的採購方法？","o":["報價採購","招標採購","比價採購","牌價收購"],"a":"A","c":"團體膳食製備","c2":"","ch":"採購與驗收","ch2":"","t":"公開與不公開的採購方法","ex":"報價採購是買方直接請廠商提供報價單再從中決定，過程不對外公告。招標採購要公告並公開開標；牌價收購是依公告的牌價收購，都屬於公開的方法。"},{"id":"115-1-2102-13","p":"115-1-2102","n":13,"q":"下列關於肉品之特性與烹調製備之敘述，何者正確？","o":["為維持雞肉安全衛生，烹調時中心溫度達60℃即可","新鮮的肉品中平均重量占比最高的是蛋白質，水分和油脂次之","雞肉組織的纖維較短而鬆散，在製備時較適合順紋切割","里肌肉比胛心肉更適合用於紅燒和滷煮"],"a":"C","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"肉類與水產","t":"肉品特性與切割、烹調","ex":"雞肉的肌纖維短而鬆散，順著紋路切，烹調後才不容易碎裂。A：禽肉中心溫度要達 74℃ 以上。B：新鮮肉品含量最多的是水分，約七成。D：里肌肉結締組織少，適合快炒或炸；胛心肉才適合紅燒和滷煮。"},{"id":"115-1-2102-14","p":"115-1-2102","n":14,"q":"下列何種蔬菜在大量製備時，經滾水殺菁後易變色？","o":["竹筍","茄子","彩椒","苦瓜"],"a":"B","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"蔬果","t":"蔬菜殺菁後的變色","ex":"茄子外皮的紫色是水溶性的花青素，遇熱和水容易溶出、氧化而變成褐色。大量製備時通常改用過油或加酸來保色。"},{"id":"115-1-2102-15","p":"115-1-2102","n":15,"q":"有關蓮藕之敘述，下列何者正確？","o":["有增進潤肺及催吐之食補效用","切割後可泡在小蘇打液中避免氧化變色","在前處理時用毛刷刷洗後再切節取段","為蓮生長在水中的莖部"],"a":"C","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"蔬果","t":"蓮藕的特性與前處理","ex":"蓮藕表面和節的地方容易夾帶泥沙，前處理要先用毛刷刷洗，再切節取段。B：切開後要泡在醋水這類酸性溶液中防止變色，鹼性的小蘇打會讓顏色變深。D：蓮藕是長在水底泥土中的地下莖。"},{"id":"115-1-2102-16","p":"115-1-2102","n":16,"q":"欲供應100人份水餃，每人12個，每張餃皮重8公克，擀製餃皮時手粉需1公斤，須準備多少麵粉及加入多少水較適當？","o":["麵粉5.7公斤、水4.9公斤","麵粉7.2公斤、水3.4公斤","麵粉8.2公斤、水2.4公斤","麵粉9.6公斤、水1公斤"],"a":"B","c":"團體膳食製備","c2":"","ch":"食物製備","ch2":"","t":"大量製備水餃皮的麵粉與水量","ex":"餃皮共 100 人 × 12 個 × 8 公克 ＝ 9.6 公斤麵糰。冷水麵糰的加水量大約是麵粉的 55%，所以麵粉約 6.2 公斤、水約 3.4 公斤；再加上手粉 1 公斤，總共準備麵粉 7.2 公斤。"},{"id":"115-1-2102-17","p":"115-1-2102","n":17,"q":"醬油膏是添加了下列何者才顯得濃稠？","o":["洋菜","麵粉","太白粉","糯米粉"],"a":"D","c":"團體膳食製備","c2":"食物學原理","ch":"食物製備","ch2":"調味料與其他","t":"醬油膏的增稠原料","ex":"醬油膏是在醬油中加入糯米粉（糯米漿）加熱糊化，才有濃稠的質地。"},{"id":"115-1-2102-18","p":"115-1-2102","n":18,"q":"熟食於室溫下存放，不得超過幾小時？","o":["2小時","5小時","7小時","10小時"],"a":"A","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"熟食在室溫存放的時間限制","ex":"7～60℃ 是細菌容易繁殖的危險溫度帶，熟食在室溫下存放不得超過 2 小時，超過就應冷藏或熱存。"},{"id":"115-1-2102-19","p":"115-1-2102","n":19,"q":"有關油脂的儲存方法，下列敘述何者錯誤？","o":["置於陰涼乾燥處，避免油脂加速氧化","不同油脂互相混合，不會加速油脂酸敗","油炸油應過濾，避免油中殘渣加速破壞油脂","金屬會促進油脂氧化，故不應使用銅或鐵之容器來盛裝油脂"],"a":"B","c":"團體膳食製備","c2":"","ch":"貯存與庫房管理","ch2":"","t":"油脂的儲存","ex":"不同種類的油、或新油和舊油混在一起，已經氧化的油會帶動其他油脂加速酸敗。光、熱、空氣、金屬離子與油中殘渣都會促進油脂氧化。"},{"id":"115-1-2102-20","p":"115-1-2102","n":20,"q":"依食品良好衛生規範準則，有關真空包裝即時食品之貯存及販售規定，下列敘述何者正確？","o":["水活性在0.85以上，得以常溫25℃貯存及販售","pH值在4.6以上，需以冷藏7℃且保存期限在10日內","水活性在0.94以上，需以冷藏7℃且保存期限在10日內","有添加亞硝酸鹽者，需以冷藏7℃且保存期限在10日內"],"a":"D","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品安全衛生法規","t":"真空包裝即食食品的貯存規定","ex":"依食品良好衛生規範準則的附表，真空包裝即食食品要在常溫貯存販售，必須符合水活性 0.85 以下、pH 值 9.0 以上、經商業滅菌等條件之一，所以 A 的「0.85 以上」不能放常溫。標準答案為 D。"},{"id":"115-1-2102-21","p":"115-1-2102","n":21,"q":"食品安全管制系統準則是依據下列何種法令？","o":["食品安全衛生管理法","食品衛生安全管理法","食品良好衛生規範準則","衛生安全管制系統"],"a":"A","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品安全衛生法規","t":"食品安全管制系統準則的法源","ex":"食品安全管制系統準則是依據食品安全衛生管理法第 8 條的授權訂定。法律的正確名稱是「食品安全衛生管理法」，B 的字序不對；C 是同一條授權訂定的另一個準則。"},{"id":"115-1-2102-22","p":"115-1-2102","n":22,"q":"下列何種食品業者應取得衛生安全管理系統驗證？①食用油脂製造業　②乳品加工食品　③食品添加物製造業　④供應鐵路運輸餐盒　⑤麵粉食品製造業","o":["僅①②","僅②③④","僅①③④⑤","①②③④⑤"],"a":"D","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"食品安全衛生法規","t":"應取得衛生安全管理系統驗證的業別","ex":"食品安全衛生管理法第 8 條規定，經中央主管機關公告類別與規模的食品業，應取得衛生安全管理系統的驗證。依標準答案，題目列出的五種業別都在公告範圍內。"},{"id":"115-1-2102-23","p":"115-1-2102","n":23,"q":"團膳業者之品管圈（quality control cycle）活動依PDCA循環方式進行，其步驟不包括下列何者？","o":["計畫（plan）","實施（do）","排除（clean）","處置（action）"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"品管圈的 PDCA 循環","ex":"PDCA 循環是計畫（Plan）、實施（Do）、查核（Check）、處置（Act），沒有「排除（clean）」這個步驟。"},{"id":"115-1-2102-24","p":"115-1-2102","n":24,"q":"利用統計學的理論，以少數的樣本探求整批產品的品質合乎規格或標準之品質管制方式是：","o":["管制圖法","抽樣檢驗法","統計分析法","實驗計畫法"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"品質管理","ch2":"","t":"品質管制的方法","ex":"抽樣檢驗法是從整批產品中抽取少數樣本檢驗，再用統計方法推斷整批是否合乎標準。"},{"id":"115-1-2102-25","p":"115-1-2102","n":25,"q":"依據食品良好衛生規範準則規定，廚房用水的蓄水池（水塔、水槽）設置地點應距離污穢場所（如化糞池等）至少多遠？","o":["1.5公尺","2公尺","3公尺","15公尺"],"a":"C","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"蓄水池與污穢場所的距離","ex":"食品良好衛生規範準則規定，蓄水池（塔、槽）應保持清潔，設置地點應距離污穢場所、化糞池等污染源 3 公尺以上。"},{"id":"115-1-2102-26","p":"115-1-2102","n":26,"q":"餐盒留驗是將當餐餐盒隨機抽取1份放置於？","o":["-18℃以下，冷凍2天","7℃以下，冷藏2天","5℃～60℃，保存2天","60℃以上，熱藏2天"],"a":"B","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"餐盒留樣的條件","ex":"供應的餐食每樣菜應留樣一份，以保鮮膜包好、標示日期與餐別，放在 7℃ 以下冷藏保存 48 小時，發生食品中毒時可以送驗。留樣不能冷凍，冷凍會影響細菌的檢出。"},{"id":"115-1-2102-27","p":"115-1-2102","n":27,"q":"下列那些屬於食品從業人員洗手應具有的設備？①流動自來水　②清潔劑　③洗手刷　④擦手紙或乾手器　⑤正確洗手掛圖　⑥鏡子","o":["①②④⑤⑥","①②③④⑥","①②③④⑤","①③④⑤⑥"],"a":"C","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"洗手設施應有的設備","ex":"洗手設施應有流動的自來水、清潔劑、洗手刷、擦手紙巾或烘手器，並在明顯的地方張貼正確洗手步驟的掛圖。鏡子不是必要設備。"},{"id":"115-1-2102-28","p":"115-1-2102","n":28,"q":"下列何者不是電磁爐用於食物調理作業之特性？","o":["可提高工作人員作業舒適性","爐台表面較易維持清潔","廚房換氣通風需求較小","加熱速度慢"],"a":"D","c":"團體膳食製備","c2":"","ch":"設備與器具","ch2":"","t":"電磁爐的特性","ex":"電磁爐以電磁感應直接讓鍋具發熱，熱效率高、加熱速度快；沒有明火和廢熱，所以廚房比較涼爽、爐面好清潔、通風需求也小。"},{"id":"115-1-2102-29","p":"115-1-2102","n":29,"q":"有關勞動基準法所提員工休息與休假之相關規定，下列何者錯誤？","o":["勞工繼續工作4小時，至少應有30分鐘之休息","女工分娩前後，應停止工作，給予產假6星期","勞工每7日中至少應有1日之休息，作為例假","勞工在同一雇主或事業單位，繼續工作滿1年以上2年未滿者，給予特別休假7日"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"勞動基準法的休息與休假","ex":"勞動基準法規定女工分娩前後應停止工作，給予產假 8 星期，不是 6 星期。其餘三項都符合規定。"},{"id":"115-1-2102-30","p":"115-1-2102","n":30,"q":"餐飲從業人員須重視個人的衛生管理，下列敘述何者錯誤？","o":["個人飲水杯可攜入工作場所固定集中放置","從事熟食配膳人員手部應每隔半小時消毒1次","製作現場應有手部消毒的設備（75%酒精）","完整體檢項目僅含A型肝炎抽血、手部皮膚病檢查"],"a":"D","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"從業人員的個人衛生與體檢","ex":"餐飲從業人員每年的健康檢查，除了 A 型肝炎和手部皮膚病，還包括出疹、膿瘡、外傷、結核病、傷寒等可能造成食品污染的疾病，不是只有兩項。"},{"id":"115-1-2102-31","p":"115-1-2102","n":31,"q":"若青江菜生廢棄率為8%，收縮率為15%，每公斤55元，1人份熟品可食量100公克，則供應500人份炒青江菜，最接近的食材成本為多少元？","o":["2,145元","3,410元","3,520元","3,650元"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"由廢棄率與收縮率計算採購量與成本","ex":"熟品 500 人 × 100 公克 ＝ 50 公斤。收縮率 15%：生的可食量 ＝ 50 ÷ 0.85 ≈ 58.8 公斤。廢棄率 8%：採購量 ＝ 58.8 ÷ 0.92 ≈ 63.9 公斤。成本 ＝ 63.9 × 55 ≈ 3,517 元，最接近 3,520 元。"},{"id":"115-1-2102-32","p":"115-1-2102","n":32,"q":"某餐廳1月份營業金額20萬元，材料費用12萬元，人事費用及其他費用5萬元，則：","o":["淨利5萬元","淨損5萬元","淨利3萬元","淨損3萬元"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"淨利的計算","ex":"淨利 ＝ 營業收入 − 材料費 − 人事及其他費用 ＝ 20 − 12 − 5 ＝ 3 萬元。"},{"id":"115-1-2102-33","p":"115-1-2102","n":33,"q":"某道菜餚之食物成本百分比訂為25%，食物原物料費用共40元，人事成本為35元，其他雜項成本為10元，則此道菜建議售價應為多少元？","o":["120","140","160","180"],"a":"C","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"用食物成本百分比訂售價","ex":"售價 ＝ 食物成本 ÷ 食物成本百分比 ＝ 40 ÷ 25% ＝ 160 元。人事與雜項成本不代入這個公式。"},{"id":"115-1-2102-34","p":"115-1-2102","n":34,"q":"本月因工作量增加，員工有加班，並請了2名臨時工讀生，下列對成本之敘述，何者正確？","o":["員工基本薪水＋加班費屬半變動成本","臨時工讀生屬於半變動成本","臨時工讀生屬於固定成本","員工基本薪水屬變動成本"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"成本控制","ch2":"","t":"固定、變動與半變動成本","ex":"員工的基本薪水是固定成本，加班費隨工作量變動，兩者合計屬於半變動成本。臨時工讀生的薪資隨工作量增減，是變動成本。"},{"id":"115-1-2102-35","p":"115-1-2102","n":35,"q":"有關員工教育訓練方法之敘述，下列何者錯誤？","o":["演講法為一次同時訓練多人，是教導基礎觀念與理念最常使用的方法之一","討論法為學習者無需具備基本專業知識即可與其他學員討論","示範法為學習者在指導者指導下完成操作程序與動作技巧的練習","視聽教學法為透過影像教學搭配解說可使受訓學員理解法規和操作程序"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"員工教育訓練的方法","ex":"討論法要學習者先具備基本的專業知識或經驗，才能提出看法、互相交流；沒有基礎就無法進行有效的討論。"},{"id":"115-1-2102-36","p":"115-1-2102","n":36,"q":"為使火災發生時能迅速展開消防作業，下列何者不是廚房員工緊急應變項目？","o":["通報、報警","收拾物品、快速帶走","滅火、撲救","疏散、避難"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"危機處理","ch2":"","t":"廚房火災的緊急應變","ex":"火災時的緊急應變是通報與報警、滅火與撲救、疏散與避難。收拾物品會延誤逃生，不是應變項目。"},{"id":"115-1-2102-37","p":"115-1-2102","n":37,"q":"依據「女性勞工母性健康保護實施辦法」，母性健康保護期間是指雇主於得知女性勞工妊娠之日起至分娩後多久之期間？","o":["半年","一年","二年","三年"],"a":"B","c":"膳食計畫與供應","c2":"","ch":"人事與組織管理","ch2":"","t":"母性健康保護的期間","ex":"母性健康保護期間是指雇主得知女性勞工妊娠之日起，到分娩後一年為止。"},{"id":"115-1-2102-38","p":"115-1-2102","n":38,"q":"若醫院發生大規模飛沫傳染疾病而必須封院時，營養部門的防護措施為何？","o":["落實區隔送餐路線與病患運送動線，以避免感染","供應傳染病房之餐食，包裝要註明消毒餐，以避免感染","各類食材廠商應保持供貨，降低庫存量，以減少交叉感染","為降低感染源散播，工作人員應在緩衝區內用餐，減少進出隔離區次數"],"a":"A","c":"膳食計畫與供應","c2":"","ch":"危機處理","ch2":"","t":"傳染病封院時營養部門的防護","ex":"封院時最重要的是把送餐路線和病患運送動線分開，避免交叉感染。供應隔離病房應改用免洗餐具；食材應提高安全庫存，以防供貨中斷；工作人員也不應在緩衝區內用餐。"},{"id":"115-1-2102-39","p":"115-1-2102","n":39,"q":"當發生食品中毒事件時之處理方式，下列敘述何者錯誤？","o":["食品檢體檢驗應由當地衛生局檢驗單位或衛生福利部食品藥物管理署認可檢驗機構進行","環境檢體應由餐飲業者自主採樣送交檢驗機構進行檢驗以釐清原因","符合「中毒人數達50人或以上者」，得填寫支援申請單向衛生福利部疾病管制署申請啟動流行病學調查","醫療機構應依食品安全衛生管理法第6條規定於24小時內向當地主管機關報告"],"a":"B","c":"膳食計畫與供應","c2":"食品衛生與安全","ch":"危機處理","ch2":"食品微生物與食品中毒","t":"食品中毒事件的處理","ex":"發生食品中毒時，食品檢體和環境檢體都應由衛生機關的人員採樣送驗，不是由業者自行採樣；業者要做的是保留留樣餐盒與現場、配合調查。"},{"id":"115-1-2102-40","p":"115-1-2102","n":40,"q":"有關非洲豬瘟之相關敘述，何者錯誤？","o":["非洲豬瘟是人畜共通傳染病","非洲豬瘟病毒於無蛋白質的環境中可存活於pH 3.9～11.5","人類吃入含有非洲豬瘟病毒的食物，病毒不會經消化道粘膜進入體內繁殖","在人類胃酸及消化道酵素作用下，非洲豬瘟病毒絕大多數會被殺死，很難在糞便中檢出非洲豬瘟病毒"],"a":"A","c":"團體膳食製備","c2":"","ch":"衛生與安全","ch2":"","t":"非洲豬瘟的基本知識","ex":"非洲豬瘟只感染家豬和野豬，不會傳染給人，不是人畜共通傳染病。它的病毒在環境中很耐受，所以要嚴防含病毒的豬肉製品和廚餘進入養豬場。"},{"id":"115-1-3102-1","p":"115-1-3102","n":1,"q":"下列何者為紅血球生成三磷酸腺苷（ATP）之最主要途徑？","o":["糖解作用（glycolysis）","克氏循環（Krebs cycle）","氧化磷酸化（oxidative phosphorylation）","β-氧化作用（β-oxidation）"],"a":"A","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"紅血球的能量來源","ex":"成熟的紅血球沒有粒線體，無法進行克氏循環、氧化磷酸化和 β-氧化，只能靠糖解作用把葡萄糖分解成乳酸來產生 ATP。"},{"id":"115-1-3102-2","p":"115-1-3102","n":2,"q":"關於多單元（multiunit）平滑肌的敘述，下列何者正確？","o":["有很少量的間隙接合（gap junctions），並與神經末梢形成終板（end-plate）","有大量的間隙接合（gap junctions），並與神經末梢形成終板（end-plate）","有很少量的間隙接合（gap junctions），與神經末梢不會形成終板（end-plate）","有大量的間隙接合（gap junctions），與神經末梢不會形成終板（end-plate）"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"肌肉","ch2":"","t":"多單元平滑肌的特性","ex":"多單元平滑肌的每個肌細胞各自接受神經支配、獨立收縮，細胞之間的間隙接合很少。支配平滑肌的自主神經是在軸突膨大處釋放傳遞物質，不像骨骼肌那樣形成運動終板。"},{"id":"115-1-3102-3","p":"115-1-3102","n":3,"q":"下列何種營養物質於攝取相同量時，需要消耗較多能量於消化、吸收及儲存該物質？","o":["蛋白質","醣類","脂質","礦物質"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"能量代謝","ch2":"","t":"三大營養素的攝食產熱效應","ex":"攝食產熱效應以蛋白質最高，約占所含熱量的 20～30%；醣類約 5～10%；脂質最低，約 0～3%。"},{"id":"115-1-3102-4","p":"115-1-3102","n":4,"q":"食安風暴中辣椒粉含蘇丹紅，食入經腸道吸收後，下一步會到達那個器官？","o":["肝","肺","腦","脾"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"腸道吸收後的首站器官","ex":"小腸吸收的物質先進入微血管，匯集到肝門靜脈送往肝臟，由肝臟先行代謝，之後才進入全身循環。"},{"id":"115-1-3102-5","p":"115-1-3102","n":5,"q":"下列那種病徵的主要症狀不是腹瀉？","o":["乳糖不耐症","幽門狹窄","膽結石","霍亂"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"腹瀉與嘔吐的病因","ex":"幽門狹窄使胃內容物排不出去，主要症狀是嘔吐。乳糖不耐症是未分解的乳糖造成滲透性腹瀉；霍亂毒素造成大量分泌性水瀉；膽結石阻礙膽汁排出時，脂肪消化不良也會腹瀉。"},{"id":"115-1-3102-6","p":"115-1-3102","n":6,"q":"臨床上使用組織胺受體拮抗劑的藥物，可改善下列何種症狀？","o":["膽囊結石","大腸激躁症","胃食道逆流","慢性肝炎"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"組織胺受體拮抗劑的用途","ex":"胃壁細胞上的第二型組織胺受體會促進胃酸分泌。組織胺受體拮抗劑抑制胃酸分泌，可以改善胃食道逆流與消化性潰瘍。"},{"id":"115-1-3102-7","p":"115-1-3102","n":7,"q":"對骨骼的生長同時具有刺激和停止雙重作用的激素為何？","o":["性腺激素","甲狀腺素","副甲狀腺素","生長激素"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"影響骨骼生長的激素","ex":"性腺激素（雌激素與睪固酮）在青春期促進骨骼快速生長，造成生長衝刺；同時也促使長骨的骨骺板閉合，使身高停止增加。"},{"id":"115-1-3102-8","p":"115-1-3102","n":8,"q":"紅血球的血基質（heme）在那個器官中被分解為膽紅素（bilirubin）？","o":["膽囊","淋巴結","皮膚","脾臟"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"血液","ch2":"","t":"血基質分解成膽紅素的位置","ex":"老化的紅血球主要在脾臟被巨噬細胞吞噬，血紅素的血基質先分解成膽綠素，再還原成膽紅素，之後送到肝臟結合、由膽汁排出。"},{"id":"115-1-3102-9","p":"115-1-3102","n":9,"q":"自主神經系統對於心臟作用的敘述，下列何者正確？","o":["刺激交感神經對於竇房結（SA node）會明顯減少其節律電位（pacemaker potential）的斜率","刺激副交感神經對竇房結（SA node）節律電位（pacemaker potential）的斜率無顯著影響","刺激交感神經明顯減少心房肌肉之收縮力量","刺激副交感神經對於心室收縮力量無顯著影響"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"自主神經對心臟的作用","ex":"副交感神經主要分布在竇房結、房室結與心房，心室的分布很少，所以對心室收縮力沒有明顯影響。交感神經會增加節律電位的斜率使心跳加快，並增強心房與心室的收縮力；副交感神經則降低斜率使心跳變慢。"},{"id":"115-1-3102-10","p":"115-1-3102","n":10,"q":"關於左、右大腦半球功能側化（cerebral laterization）的敘述，下列那些正確？①左手的體感覺（somatosensory）是由右大腦半球處理　②來自左眼的視覺只由右大腦半球處理　③單側身體的運動由同側大腦半球控制　④語言中樞位於左大腦半球","o":["①②","②③","③④","①④"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"大腦半球的功能側化","ex":"身體的體感覺和運動都由對側大腦半球負責，所以①對、③錯。視覺是依左右視野交叉，每一隻眼睛的訊息都會送到兩側大腦，②錯。大多數人的語言中樞在左大腦半球，④對。"},{"id":"115-1-3102-11","p":"115-1-3102","n":11,"q":"下列何種物質不以擴散（diffusion）方式，使其由細胞外部通過細胞膜而進入細胞內？","o":["尿素（urea）","氧氣（oxygen）","乙醇（ethanol）","葡萄糖（glucose）"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"細胞生理與膜運輸","ch2":"","t":"物質通過細胞膜的方式","ex":"尿素、氧氣、乙醇是小分子或脂溶性分子，可以直接擴散通過細胞膜。葡萄糖是較大的極性分子，必須靠葡萄糖運輸蛋白才能進入細胞。"},{"id":"115-1-3102-12","p":"115-1-3102","n":12,"q":"關於細胞間交界處的連結構造與其功能的敘述，下列何者錯誤？","o":["緊密接合（tight junction）：血腦屏障維持","緊密接合（tight junction）：腸道上皮通透性調節","胞橋體（desmosome）：骨骼韌帶交接","間隙接合（gap junction）：平滑肌細胞間膜電位傳導"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"細胞生理與膜運輸","ch2":"","t":"細胞間連結構造的功能","ex":"胞橋體是把相鄰細胞牢牢固定在一起的構造，常見於皮膚表皮和心肌，提供機械強度。骨骼和韌帶的交接是靠膠原纖維，不是細胞間的連結。其餘三項配對正確。"},{"id":"115-1-3102-13","p":"115-1-3102","n":13,"q":"關於胃腸道激素的功能配對，下列何者錯誤？","o":["血清素（serotonin）－胃部舒張","胃泌素（gastrin）－刺激胃酸分泌","膽囊收縮素（cholecystokinin）－肝臟細胞分泌膽汁進入膽管","體抑素（somatostatin）－抑制胃酸分泌"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"消化","ch2":"","t":"胃腸道激素的功能","ex":"膽囊收縮素的作用是讓膽囊收縮、歐迪氏括約肌放鬆，把已儲存的膽汁排入十二指腸，並刺激胰臟分泌消化酵素。刺激肝臟與膽管分泌膽汁的主要是胰泌素。"},{"id":"115-1-3102-14","p":"115-1-3102","n":14,"q":"若糖尿病控制不良時，下列敘述何者最適當？","o":["近端小管與遠端小管對於葡萄糖排出皆減少","亨利氏管上行支及遠端小管對於葡萄糖排出皆增加","近端小管對於葡萄糖及水分排出皆增加","亨利氏管下行支及遠端小管對於水分排出皆減少"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"糖尿病的滲透性利尿","ex":"血糖超過腎閾值時，近端小管的葡萄糖運輸蛋白達到飽和，葡萄糖無法完全再吸收而留在小管中，把水也留在管腔內，造成滲透性利尿，所以葡萄糖和水分的排出都增加。"},{"id":"115-1-3102-15","p":"115-1-3102","n":15,"q":"關於膀胱排尿（micturition）之敘述，下列何者最適當？","o":["交感神經興奮可使膀胱逼尿肌（detrusor muscle）收縮","交感神經興奮可使尿道內括約肌（internal urethral sphincter）舒張","乙醯膽鹼毒蕈鹼型受體（muscarinic ACh receptor）阻斷之藥物，可減緩排尿的動作","漲尿時（filling）膀胱感覺神經訊號會傳回脊髓，引起防衛反射（guarding reflex）使膀胱收縮"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"排尿的神經控制","ex":"排尿是由副交感神經釋放乙醯膽鹼，作用在逼尿肌的毒蕈鹼型受體使它收縮。阻斷這個受體的藥物會抑制逼尿肌收縮、減緩排尿。交感神經的作用是讓逼尿肌放鬆、內括約肌收縮，幫助儲尿；防衛反射是讓外括約肌收縮以防漏尿。"},{"id":"115-1-3102-16","p":"115-1-3102","n":16,"q":"下列何者不是測量腎臟功能的常用參考指標？","o":["尿液白蛋白排泄率（urinary albumin excretion rate）","血漿白蛋白濃度（plasma albumin concentration）","血漿菊糖清除率（clearance of inulin）","血漿肌酸酐清除率（clearance of creatinine）"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎功能的評估指標","ex":"血漿白蛋白濃度反映的是營養狀態和肝臟合成功能，不是腎功能指標。尿液白蛋白排泄率、菊糖清除率、肌酸酐清除率都用來評估腎臟的過濾功能或損傷。"},{"id":"115-1-3102-17","p":"115-1-3102","n":17,"q":"關於腎臟對電解質及酸鹼平衡的敘述，下列何者錯誤？","o":["腎臟可調節血液中的Na⁺、K⁺、HCO₃⁻及H⁺等離子之濃度","高血鉀會刺激腎素－血管收縮素系統，造成腎上腺髓質分泌醛固酮（aldosterone）來調節血鉀","近90％被過濾的Na⁺和K⁺可在到達遠曲小管前被再吸收，而不需受激素調節","低血鈣會刺激副甲狀腺素（parathyroid hormone）分泌，而作用於腎臟以調節血鈣"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"腎臟與體液","ch2":"","t":"腎臟對電解質與酸鹼的調節","ex":"醛固酮是由腎上腺「皮質」分泌，不是髓質；而且高血鉀是直接刺激腎上腺皮質分泌醛固酮，不需要經過腎素－血管收縮素系統。其餘三項正確。"},{"id":"115-1-3102-18","p":"115-1-3102","n":18,"q":"在血糖60 mg/dL的狀態下，仍然能由血液中獲取大量葡萄糖的器官組織為何？","o":["肝臟","脂肪","肌肉","大腦"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"能量代謝","ch2":"","t":"低血糖時仍能攝取葡萄糖的組織","ex":"大腦使用不需要胰島素、對葡萄糖親和力很高的葡萄糖運輸蛋白，血糖偏低時仍能大量攝取葡萄糖。肌肉和脂肪要靠胰島素才能攝取；肝臟在低血糖時是釋出葡萄糖。"},{"id":"115-1-3102-19","p":"115-1-3102","n":19,"q":"有關女性一生中特定時期之敘述，下列何者正確？","o":["啟動胚胎時期之女性表型發育需要雌激素（estrogen）瞬間增加","青春期的啟動需要促性腺激素釋放激素（GnRH）的分泌","初經（menarche）的啟動需要卵巢持續分泌黃體素（progesterone）","女性更年期的啟動需要濾泡刺激素（FSH）的間歇分泌"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"女性各時期的內分泌變化","ex":"青春期的啟動是下視丘開始脈衝式分泌促性腺激素釋放激素，帶動腦下垂體分泌濾泡刺激素與黃體生成素。女性表型是胚胎的預設發育方向，不需要雌激素；更年期是卵巢濾泡耗盡造成的。"},{"id":"115-1-3102-20","p":"115-1-3102","n":20,"q":"關於停經後雌激素的敘述，下列何者正確？","o":["主要由脂肪細胞製造出雌固酮（estrone）","主要由脂肪細胞製造出雌三醇（estriol）","主要由脂肪細胞製造出雌二醇（estradiol）","主要由腎上腺皮質（adrenal cortex）製造出雌二醇（estradiol）"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"內分泌與生殖","ch2":"","t":"停經後雌激素的來源","ex":"停經後卵巢不再分泌雌二醇，體內的雌激素主要是脂肪組織把腎上腺分泌的雄性素轉換成雌固酮（estrone）。"},{"id":"115-1-3102-21","p":"115-1-3102","n":21,"q":"關於伐氏操作（Valsalva maneuver）的敘述，下列何者最不適當？","o":["是持續的閉氣用力，防止空氣通過口鼻逸出，增加胸內壓","會暫時減少靜脈回心血流量","會先暫時減少動脈壓再增加動脈壓","會暫時降低心率"],"a":"C","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"伐氏操作的血壓與心跳變化","ex":"伐氏操作是閉氣用力使胸內壓上升。一開始胸內壓壓迫主動脈，動脈壓先短暫上升；接著靜脈回流減少，心輸出量下降，動脈壓才下降，心跳反射性加快。所以「先減少再增加」的順序說反了。"},{"id":"115-1-3102-22","p":"115-1-3102","n":22,"q":"主動脈血壓在下列那一個時期與左心室壓最接近？","o":["二尖瓣關閉到動脈瓣關閉","動脈瓣打開到動脈瓣關閉","動脈瓣關閉到二尖瓣打開","二尖瓣打開到二尖瓣關閉"],"a":"B","c":"人體生理學與實驗","c2":"","ch":"心臟血管","ch2":"","t":"心動週期中主動脈與左心室的壓力","ex":"主動脈瓣打開到關閉的這段時間是心室射血期，左心室和主動脈相通，兩者的壓力最接近。"},{"id":"115-1-3102-23","p":"115-1-3102","n":23,"q":"普羅卡因（procaine）是一種可阻斷電位閘控型鈉通道（voltage-gated sodium channel）作用的藥物。投藥後對神經膜電位可能造成的影響，下列敘述那些正確？①仍能形成階梯電位（graded potential）　②影響動作電位的去極化（depolarization）　③影響動作電位的再極化（repolarization）　④造成膜電位發生過極化（hyperpolarization）","o":["①②","②③","③④","①④"],"a":"A","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"鈉通道阻斷劑對膜電位的影響","ex":"電位閘控型鈉通道負責動作電位的去極化，被阻斷後動作電位無法產生，②對。階梯電位是由配體或機械閘控的通道產生，不受影響，①對。再極化靠鉀通道，藥物也不會造成過極化，③④錯。"},{"id":"115-1-3102-24","p":"115-1-3102","n":24,"q":"下列那一種支持細胞主要位於周邊神經系統？","o":["微小膠細胞（microglia）","星狀細胞（astrocytes）","室管膜細胞（ependymal cells）","許旺細胞（Schwann cells）"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"神經系統","ch2":"","t":"周邊神經系統的支持細胞","ex":"周邊神經系統的支持細胞是許旺細胞和衛星細胞。微小膠細胞、星狀細胞、室管膜細胞和寡突膠細胞都在中樞神經系統。"},{"id":"115-1-3102-25","p":"115-1-3102","n":25,"q":"調節呼吸的周邊化學感受器（peripheral chemoreceptors）位於下列何處？","o":["頸動脈體（carotid bodies）及頸動脈竇（carotid sinus）","頸動脈竇（carotid sinus）及主動脈弓（aortic arches）","主動脈弓（aortic arches）及主動脈體（aortic bodies）","頸動脈體（carotid bodies）及主動脈體（aortic bodies）"],"a":"D","c":"人體生理學與實驗","c2":"","ch":"呼吸","ch2":"","t":"周邊化學感受器的位置","ex":"周邊化學感受器位在頸動脈體和主動脈體，偵測血中氧分壓下降、二氧化碳分壓上升和酸鹼值下降。頸動脈竇和主動脈弓是偵測血壓的壓力感受器。"},{"id":"115-1-3102-26","p":"115-1-3102","n":26,"q":"下列何者為糖解作用的中間產物，並可調控糖質新生作用（gluconeogenesis）？","o":["dihydroxyacetone phosphate","fructose-6-phosphate","lactate","2-phosphoglycerate"],"a":"B","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"糖解與糖質新生的交互調控","ex":"fructose-6-phosphate 是糖解作用的中間產物，也是合成 fructose-2,6-bisphosphate 的原料。後者會活化糖解的 PFK-1，同時抑制糖質新生的 fructose-1,6-bisphosphatase，是兩條路徑交互調控的關鍵。"},{"id":"115-1-3102-27","p":"115-1-3102","n":27,"q":"NADPH是五碳糖磷酸途徑（pentose phosphate pathway）重要的產物，下列酵素何者依賴此分子參與反應？","o":["glutathione reductase","glutathione peroxidase","glucose 6-phosphate dehydrogenase","malate dehydrogenase"],"a":"A","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"五碳糖磷酸途徑產生的 NADPH 的用途","ex":"glutathione reductase 利用 NADPH 把氧化型的穀胱甘肽還原回還原型，維持細胞的抗氧化能力。glucose 6-phosphate dehydrogenase 是「產生」NADPH 的酵素；glutathione peroxidase 用的是還原型穀胱甘肽。"},{"id":"115-1-3102-28","p":"115-1-3102","n":28,"q":"肌肉細胞因缺乏下列何種酵素，而無法釋出葡萄糖於血液中？","o":["fumarase","glucose-6-phosphatase","hexokinase","pyruvate dehydrogenase"],"a":"B","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"肌肉為何無法釋出葡萄糖","ex":"肝臟和腎臟有 glucose-6-phosphatase，可以把 glucose-6-phosphate 去掉磷酸變成葡萄糖釋入血液。肌肉缺乏這個酵素，肝醣分解的產物只能留在肌肉細胞內自己使用。"},{"id":"115-1-3102-29","p":"115-1-3102","n":29,"q":"下列何種glycogenolysis的allosteric調節因子，可促進不活化態phosphorylase b轉變為活化態？","o":["ADP","AMP","ATP","cAMP"],"a":"B","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"肝醣磷酸化酶的異位調節","ex":"肌肉能量不足時 AMP 上升，AMP 以異位調節的方式活化肝醣磷酸化酶 b。ATP 是抑制因子。cAMP 是透過蛋白激酶把酵素磷酸化，屬於共價修飾，不是異位調節。"},{"id":"115-1-3102-30","p":"115-1-3102","n":30,"q":"下列何者具有保護細胞膜的作用，缺乏時易造成溶血性貧血（hemolytic anemia）？","o":["鈷胺素（cobalamin）","視網醇（retinol）","四氫葉酸（tetrahydrofolate）","生育醇（tocopherol）"],"a":"D","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"維生素 E 與溶血性貧血","ex":"生育醇（維生素 E）是脂溶性抗氧化劑，保護細胞膜上的多元不飽和脂肪酸不被氧化。缺乏時紅血球膜容易破裂，造成溶血性貧血，早產兒尤其常見。"},{"id":"115-1-3102-31","p":"115-1-3102","n":31,"q":"三大營養素產能代謝途徑中，下列那些是主要的串聯分子？①glucose-6-phosphate　②pyruvate　③acetyl-CoA　④citrate　⑤malate","o":["①②","②③","③④","④⑤"],"a":"B","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"三大營養素代謝的交會分子","ex":"醣類分解成丙酮酸再變成乙醯輔酶 A；脂肪酸經 β-氧化變成乙醯輔酶 A；許多胺基酸的碳骨架也轉成丙酮酸或乙醯輔酶 A。這兩個分子是三大營養素代謝交會的地方。"},{"id":"115-1-3102-32","p":"115-1-3102","n":32,"q":"下列調控酵素活性的方式，何者為不可逆的（irreversible）？","o":["異位調節（allosteric regulation）","磷酸化修飾（phosphorylation modification）","酶原（zymogen）的蛋白質裂解（proteolysis）","不競爭型抑制劑（uncompetitive inhibitor）的結合"],"a":"C","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"不可逆的酵素活性調控","ex":"酶原要切掉一段胜肽才會變成有活性的酵素，胜肽鍵切斷後無法接回去，是不可逆的。異位調節、磷酸化修飾和抑制劑的結合都可以逆轉。"},{"id":"115-1-3102-33","p":"115-1-3102","n":33,"q":"葡萄糖藉由山梨糖醇（sorbitol）轉變為果糖（fructose）的途徑，下列敘述何者正確？","o":["葡萄糖藉醛糖還原酶（aldose reductase）催化形成山梨糖醇，伴隨FADH2還原","葡萄糖藉醛糖還原酶（aldose reductase）催化形成山梨糖醇，伴隨NADH氧化","山梨糖醇經山梨糖醇去氫酶（sorbitol dehydrogenase）催化形成果糖，伴隨NAD⁺還原","山梨糖醇經山梨糖醇去氫酶（sorbitol dehydrogenase）催化形成果糖，伴隨NADP⁺氧化"],"a":"C","c":"生物化學（二）","c2":"","ch":"醣類代謝","ch2":"","t":"多元醇途徑","ex":"多元醇途徑有兩步：葡萄糖由醛糖還原酶還原成山梨糖醇，消耗 NADPH（NADPH 被氧化）；山梨糖醇再由山梨糖醇去氫酶氧化成果糖，同時把 NAD⁺ 還原成 NADH。"},{"id":"115-1-3102-34","p":"115-1-3102","n":34,"q":"有關合成三酸甘油酯或磷脂質的過程，下列何者錯誤？","o":["合成三酸甘油酯或磷脂質都需要先將glycerol-3-phosphate轉換成磷脂酸（phosphatidic acid）","合成三酸甘油酯時，可將雙酸甘油酯（diacylglycerol）的甘油骨架第1號碳接上脂肪酸","合成磷脂質時，可透過cytidine diphosphate作為雙酸甘油酯（diacylglycerol）的活化載體","合成磷脂質的phosphatidylcholine（PC）需要S-腺核苷甲硫胺酸（S-adenosylmethionine）提供甲基來源"],"a":"B","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"三酸甘油酯與磷脂質的合成","ex":"三酸甘油酯的合成是先在甘油骨架的第 1、2 號碳接上脂肪酸形成磷脂酸，去掉磷酸成為雙酸甘油酯，最後一個脂肪酸是接在第 3 號碳上，不是第 1 號碳。其餘三項正確。"},{"id":"115-1-3102-35","p":"115-1-3102","n":35,"q":"人類因缺乏何種酵素而無法由linoleic acid合成α-linolenic acid（ALA）？","o":["∆12 desaturase","∆12 elongase","∆15 desaturase","∆15 elongase"],"a":"C","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"必需脂肪酸與去飽和酶","ex":"亞麻油酸要在第 15 號碳再加一個雙鍵才會變成 α-次亞麻油酸，這需要 ∆15 去飽和酶，只有植物才有。人類也缺乏 ∆12 去飽和酶，所以這兩種脂肪酸都必須從食物取得。"},{"id":"115-1-3102-36","p":"115-1-3102","n":36,"q":"腦磷脂（cephalin）完全水解後，可產生磷酸、脂肪酸、甘油以及下列何種產物？","o":["sphingosine","inositol","choline","ethanolamine"],"a":"D","c":"生物化學（二）","c2":"","ch":"脂質代謝","ch2":"","t":"腦磷脂的組成","ex":"腦磷脂就是磷脂醯乙醇胺，水解後得到甘油、脂肪酸、磷酸和乙醇胺（ethanolamine）。水解後得到膽鹼的是卵磷脂。"},{"id":"115-1-3102-37","p":"115-1-3102","n":37,"q":"下列何種胺基酸不是體內神經傳導物質的前驅物 ？","o":["tryptophan","glutamate","lysine","tyrosine"],"a":"C","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"神經傳導物質的胺基酸前驅物","ex":"色胺酸是血清素的前驅物；麩胺酸本身是興奮性神經傳導物質，也是 GABA 的前驅物；酪胺酸是多巴胺、正腎上腺素和腎上腺素的前驅物。離胺酸不是神經傳導物質的前驅物。"},{"id":"115-1-3102-38","p":"115-1-3102","n":38,"q":"有關轉甲基作用（transmethylation）在體內胺基酸代謝過程的敘述，下列何者正確？","o":["tyrosine代謝為fumarate和acetoacetate的過程需要轉甲基作用","苯酮尿症（phenylketonuria）是因為phenylalanine hydroxylase的缺陷，使體內的轉甲基作用無法順利運作","體內合成phosphatidylcholine和creatine的過程，皆與轉甲基作用有關","人體內生成（de novo synthesis）methionine的過程無需轉甲基作用"],"a":"C","c":"生物化學（二）","c2":"","ch":"胺基酸與蛋白質代謝","ch2":"","t":"轉甲基作用","ex":"S-腺核苷甲硫胺酸是體內主要的甲基提供者，磷脂醯乙醇胺轉成磷脂醯膽鹼、以及肌酸的合成都要靠它。酪胺酸的分解和苯酮尿症都與轉甲基無關；甲硫胺酸是必需胺基酸，體內只能由同半胱胺酸接受甲基再生，這個反應本身就是轉甲基作用。"},{"id":"115-1-3102-39","p":"115-1-3102","n":39,"q":"有關葉酸參與胺基酸代謝之敘述，下列何者正確？","o":["葉酸之輔酶結構上帶有多個麩醯胺酸（glutamine）單元，可與酵素緊密結合催化單碳分子轉移","5-甲基四氫葉酸（5-methyltetrahydrofolate）需要維生素B12，輔助甲硫胺酸（methionine）合成","維生素B12缺乏會影響四氫葉酸攜帶單碳原子，阻礙絲胺酸（serine）合成甘胺酸（glycine）之反應進行","過多的維生素B2、葉酸、維生素B12易導致同半胱胺酸（homocysteine）累積，影響心血管健康狀態"],"a":"B","c":"生物化學（二）","c2":"","ch":"維生素與輔酶","ch2":"","t":"葉酸與維生素 B12 的單碳代謝","ex":"5-甲基四氫葉酸要把甲基交給同半胱胺酸生成甲硫胺酸，這個反應需要維生素 B12 當輔酶。A：葉酸輔酶帶的是多個麩胺酸，不是麩醯胺酸。C：絲胺酸轉成甘胺酸需要的是四氫葉酸與維生素 B6。D：是這些維生素「缺乏」才會讓同半胱胺酸累積。"},{"id":"115-1-3102-40","p":"115-1-3102","n":40,"q":"有關高等真核生物蛋白質合成過程所需aminoacyl-tRNA synthetases的敘述，下列何者正確？","o":["其活性缺失可能影響細胞凋亡","參與RNA polymerase校對的步驟","此酵素在蛋白質合成過程中的出錯率較DNA複製低","其作用為產能反應"],"a":"A","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"aminoacyl-tRNA 合成酶","ex":"aminoacyl-tRNA 合成酶把正確的胺基酸接到對應的 tRNA 上，要消耗 ATP，不是產能反應；它和 RNA 聚合酶的校對無關；蛋白質合成的出錯率也比 DNA 複製高。這類酵素另有調節細胞功能的角色，活性缺失可能影響細胞凋亡。"},{"id":"115-1-3102-41","p":"115-1-3102","n":41,"q":"下列那一種基因突變對蛋白質的功能影響最大？","o":["silent mutation（or synonymous）","missense mutation","nonsense mutation","frameshift mutation"],"a":"D","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"基因突變的種類","ex":"框移突變是插入或缺失的鹼基數不是 3 的倍數，使突變點之後所有的密碼子都讀錯，胺基酸序列全部改變，對蛋白質功能的影響最大。"},{"id":"115-1-3102-42","p":"115-1-3102","n":42,"q":"關於細菌質體（bacterial plasmid）的敘述，下列何者正確？","o":["由RNA所組成","非環狀結構","無法被複製","具origin基因"],"a":"D","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"細菌質體的特性","ex":"細菌質體是染色體以外的環狀雙股 DNA，帶有自己的複製起點（origin），可以獨立複製。"},{"id":"115-1-3102-43","p":"115-1-3102","n":43,"q":"萊希－尼亨症候群（Lesch-Nyhan syndrome）遺傳疾病是因何種生化路徑之酵素缺陷，造成hypoxanthine和guanine在體內過量累積？","o":["肝醣分解作用（glycogenolysis）","糖解作用（glycolysis）","嘌呤補救合成途徑（purine salvage pathway)","嘧啶補救合成途徑（pyrimidine salvage pathway)"],"a":"C","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"嘌呤補救途徑與 Lesch-Nyhan 症候群","ex":"Lesch-Nyhan 症候群是嘌呤補救途徑的 HGPRT 酵素缺陷，次黃嘌呤和鳥糞嘌呤無法回收再利用，只能分解成尿酸，造成高尿酸血症與神經症狀。"},{"id":"115-1-3102-44","p":"115-1-3102","n":44,"q":"維生素D如何促進體內鈣吸收相關蛋白之合成？","o":["轉錄調節蛋白為維生素D受器（vitamin D receptor），以鋅手指（zinc finger）蛋白模組與DNA結合","轉錄調節蛋白為維生素D受器，以白胺酸拉鍊（leucine zipper）蛋白模組與DNA結合","25(OH)D負責活化維生素D受器","維生素D藉由轉譯後修飾羧化鈣結合蛋白"],"a":"A","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"維生素 D 受器與基因轉錄","ex":"維生素 D 受器屬於細胞核受體，與活化型的 1,25-二羥基維生素 D 結合後，以鋅手指構造結合到 DNA 上，啟動鈣結合蛋白等基因的轉錄。25(OH)D 不是活化型；轉譯後的羧化修飾是維生素 K 的作用。"},{"id":"115-1-3102-45","p":"115-1-3102","n":45,"q":"關於轉譯作用中wobble hypothesis的敘述，下列何者正確？","o":["tRNA密碼子（codon）之3'端與mRNA反密碼子（anticodon）之5'端可有超過一種鹼基配對方式","tRNA密碼子（codon）之5'端與mRNA反密碼子（anticodon）之3'端可有超過一種鹼基配對方式","tRNA反密碼子（anticodon）之3'端與mRNA密碼子（codon）之5'端可有超過一種鹼基配對方式","tRNA反密碼子（anticodon）之5'端與mRNA密碼子（codon）之3'端可有超過一種鹼基配對方式"],"a":"D","c":"生物化學（二）","c2":"","ch":"核酸與基因表現","ch2":"","t":"密碼子的搖擺假說","ex":"搖擺假說是指 tRNA 反密碼子 5' 端的第一個鹼基，和 mRNA 密碼子 3' 端的第三個鹼基之間，配對比較不嚴格，可以有超過一種配對方式，所以一種 tRNA 能辨認多個密碼子。"},{"id":"115-1-3102-46","p":"115-1-3102","n":46,"q":"下列何者為胺基酸序列不盡相同，但可催化相同生化反應的酵素？","o":["coenzyme","isozyme","apoenzyme","holoenzyme"],"a":"B","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"同功酶","ex":"同功酶（isozyme）是胺基酸序列不完全相同、但催化同一個反應的酵素，例如乳酸去氫酶有五種同功酶。coenzyme 是輔酶；apoenzyme 是還沒有結合輔因子的酵素蛋白；holoenzyme 是結合輔因子後的完整酵素。"},{"id":"115-1-3102-47","p":"115-1-3102","n":47,"q":"瘦體素（leptin）經由訊息傳遞後，會增加下列何種蛋白質的合成，進而導致產熱效應（thermogenesis）？","o":["AMP-activated protein kinase（AMPK）","uncoupling protein 1（UCP1）","adenylyl cyclase","ATP synthase"],"a":"B","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"瘦體素與解偶聯蛋白","ex":"瘦體素作用在下視丘，經由交感神經刺激棕色脂肪組織，增加解偶聯蛋白 1（UCP1）的合成。UCP1 讓質子不經過 ATP 合成酶直接回到粒線體基質，能量以熱的形式散出。"},{"id":"115-1-3102-48","p":"115-1-3102","n":48,"q":"在電子傳遞鏈中，下列那一個分子是電子的最後接受者？","o":["NADH","O2","H2O","CoQ"],"a":"B","c":"生物化學（二）","c2":"","ch":"生物能量與整合代謝","ch2":"","t":"電子傳遞鏈的最終電子接受者","ex":"電子傳遞鏈的電子最後在複合體 IV 交給氧氣，氧氣接受電子和質子後還原成水。"},{"id":"115-1-3102-49","p":"115-1-3102","n":49,"q":"下列何種方法常用來鑑定酵素蛋白質分子的催化中心（active site）3D立體結構？","o":["雙能量X光吸收分析技術（DEXA）、液相層析–高解析度質譜儀（LC-MS）","穿透式電子顯微鏡技術（TEM）、酵素免疫分析技術（ELISA）","X光晶體繞射分析（X-ray crystallography）、核磁共振分析（NMR）","磁振造影技術（MRI）、共軛焦顯微鏡技術（confocal microscopy）"],"a":"C","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"蛋白質立體結構的鑑定方法","ex":"X 光晶體繞射和核磁共振可以解析到原子層級，是鑑定蛋白質立體結構與催化中心最常用的方法。"},{"id":"115-1-3102-50","p":"115-1-3102","n":50,"q":"根據琥珀酸（succinate）的化學結構式（⁻OOC–CH₂–CH₂–COO⁻），下列何者最可能為琥珀酸去氫酶（succinate dehydrogenase）作用於琥珀酸的競爭型抑制劑（competitive inhibitor）？","o":["⁻OOC–CH₂–COO⁻","CH₃–CO–COO⁻","⁻OOC–CH₂–CH₂–CO–S–CoA","⁻OOC–CH(OH)–CH₂–COO⁻"],"a":"A","c":"生物化學（二）","c2":"","ch":"酵素","ch2":"","t":"競爭型抑制劑","ex":"選項 A 是丙二酸（malonate），結構和琥珀酸很像，只少一個 CH₂，可以佔住酵素的活性中心卻無法被脫氫，是琥珀酸去氫酶典型的競爭型抑制劑。B 是丙酮酸，C 是琥珀醯輔酶 A，D 是蘋果酸。"},{"id":"115-1-4102-1","p":"115-1-4102","n":1,"q":"人體攝入富含蛋白質的食物後，主要是由那個器官開始消化蛋白質？","o":["口腔","胃","腸道","肝臟"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質消化的起始位置","ex":"口腔的唾液不含蛋白質分解酵素，只有咀嚼的機械作用。蛋白質的化學性消化從胃開始：胃酸使蛋白質變性，並把胃蛋白酶原活化成胃蛋白酶，將蛋白質切成較短的多胜肽；之後才到小腸由胰蛋白酶等繼續分解。肝臟不分泌消化蛋白質的酵素。"},{"id":"115-1-4102-2","p":"115-1-4102","n":2,"q":"下列何者含有反式脂肪酸？","o":["葵花油","牛油","豬油","花生油"],"a":"B","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"天然反式脂肪酸來源","ex":"反芻動物（牛、羊）瘤胃裡的細菌會對不飽和脂肪酸進行生物氫化，產生少量天然反式脂肪酸，所以牛油、羊油與乳脂含有反式脂肪酸。豬不是反芻動物；葵花油、花生油等未經氫化的植物油幾乎不含反式脂肪酸。"},{"id":"115-1-4102-3","p":"115-1-4102","n":3,"q":"成年人每日基礎代謝率（BMR）約1,200大卡，約相當於5,000 kJ。ATP水解產生的能量約50kJ/mol，ATP的分子量是551 g/mol。估計每天基礎代謝率需要的ATP總量，下列那一個數值最不合理？","o":["約100莫耳（mol/day）","約55公克（g/day）","約5,000 千焦（kJ/day）","約55公斤（kg/day）"],"a":"B","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"ATP 與能量換算","ex":"需要的 ATP 莫耳數 ＝ 5,000 kJ ÷ 50 kJ/mol ＝ 100 mol；換算重量 ＝ 100 mol × 551 g/mol ＝ 55,100 g，約 55 公斤。所以 A、C、D 都合理，B 的 55 公克少了 1,000 倍。體內 ATP 存量很少，是靠不斷分解再合成來周轉。"},{"id":"115-1-4102-4","p":"115-1-4102","n":4,"q":"下列營養素之組合，何者降低高同半胱胺酸血症之效果最佳？","o":["維生素B1、維生素B2、維生素B3","維生素E、維生素C、生物素","維生素B12、葉酸、維生素B6","泛酸、卵磷脂、維生素K"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"同半胱胺酸與 B6、B12、葉酸","ex":"同半胱胺酸有兩條代謝路徑：再甲基化成甲硫胺酸，需要葉酸（提供甲基）與維生素 B12（甲硫胺酸合成酶的輔酶）；經轉硫作用變成半胱胺酸，需要維生素 B6。三者同時足夠，降同半胱胺酸的效果最好。"},{"id":"115-1-4102-5","p":"115-1-4102","n":5,"q":"下列何者為人體皮膚可用來合成維生素D3的原料？","o":["7-oxycholesterol","7-dehydrocholesterol","ergosterol","cholecalciferol"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 D3 的前驅物","ex":"皮膚中的 7-脫氫膽固醇（7-dehydrocholesterol）經紫外線 UVB 照射後轉變成維生素 D3 前驅物，再異構化為維生素 D3。cholecalciferol 就是維生素 D3 本身，是產物不是原料；ergosterol（麥角固醇）是植物與菇類中維生素 D2 的前驅物。"},{"id":"115-1-4102-6","p":"115-1-4102","n":6,"q":"低鹽飲食的病人，尿中的氯會與何種礦物質同時降低？","o":["鈣","磷","鉀","鈉"],"a":"D","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鈉與氯","ex":"飲食中的氯幾乎都來自食鹽（氯化鈉），鈉與氯在腸道一起吸收，在腎臟也一起被再吸收或排出。低鹽飲食時鈉、氯攝取同時減少，腎臟保留鈉的同時也保留氯，所以尿鈉與尿氯會一起降低。"},{"id":"115-1-4102-7","p":"115-1-4102","n":7,"q":"根據最新版「國人膳食營養素參考攝取量」，哺乳期婦女相較懷孕第三期婦女不需要額外增加下列那些營養素的攝取？①蛋白質　②葉酸　③維生素E　④維生素B12　⑤鋅　⑥鐵","o":["①②③","②⑤⑥","③④⑥","①④⑤"],"a":"B","c":"生命期營養","c2":"","ch":"懷孕與哺乳期","ch2":"","t":"DRIs：懷孕期與哺乳期比較","ex":"依國人膳食營養素參考攝取量第八版的增加量，懷孕第三期／哺乳期分別為：蛋白質 +10／+15 g、維生素 E +2／+3 mg、維生素 B12 +0.2／+0.4 μg，哺乳期較高；葉酸 +200／+100 μg，哺乳期較低；鋅 +3／+3 mg、鐵 +30／+30 mg，兩者相同。所以哺乳期不需要再額外增加的是葉酸、鋅、鐵（②⑤⑥）。"},{"id":"115-1-4102-8","p":"115-1-4102","n":8,"q":"下列何者不是造成老年人食量減少的主要原因？","o":["神經內分泌的變化","服用藥物造成味覺和嗅覺改變","憂鬱","運動量增加"],"a":"D","c":"生命期營養","c2":"","ch":"老年期","ch2":"","t":"老年期食量減少的原因","ex":"老年人食量減少常見的原因包括：飽足感荷爾蒙與胃排空等神經內分泌變化、藥物造成味覺嗅覺改變或口乾、憂鬱與獨居等心理社會因素。運動量增加會提高能量需求與食慾，而且老年人的活動量通常是減少的，所以不是原因。"},{"id":"115-1-4102-9","p":"115-1-4102","n":9,"q":"有關乙醇對維生素A代謝的影響，下列何者最適當？","o":["會抑制肝臟對視黃醇的氧化","以競爭性抑制視黃醇轉換","在小腸促進視黃醇去氫酶的活性","提高視黃醇轉換為視黃醛的速率"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"酒精與維生素 A 代謝","ex":"乙醇和視黃醇都是醇類，共用醇去氫酶（ADH）等酵素代謝。乙醇存在時會和視黃醇競爭酵素，抑制視黃醇氧化成視黃醛、再變成視黃酸，所以 C、D 說反了。長期飲酒還會誘發肝臟微粒體酵素，加速維生素 A 分解、耗損肝臟儲存量，並不是抑制肝臟的氧化作用。"},{"id":"115-1-4102-10","p":"115-1-4102","n":10,"q":"下列何種營養素的耗盡不是運動造成疲勞的主要原因？","o":["蛋白質","碳水化合物","水分","電解質"],"a":"A","c":"營養學","c2":"","ch":"運動營養","ch2":"","t":"運動疲勞的原因","ex":"運動疲勞主要和肌肉與肝臟的肝醣（碳水化合物）耗盡、脫水、流汗造成的電解質流失有關。蛋白質在運動中供能的比例很低（一般約 5%，長時間耐力運動也只到一成多），耗盡蛋白質不是疲勞的主因。"},{"id":"115-1-4102-11","p":"115-1-4102","n":11,"q":"有關憩室炎患者急性期的飲食調整，下列何者最適當？","o":["多補充蔬果","多選擇全穀","多選擇豆類","多補充水分"],"a":"D","c":"膳食療養","c2":"膳食療養實驗（二）","ch":"第5章 消化道及肝、膽、胰臟疾病","ch2":"9 調整纖維質之飲食","t":"憩室炎急性期的飲食","ex":"憩室炎急性期腸道正在發炎，飲食要讓腸道休息：視嚴重程度先禁食或採清流質，再進展到低渣（低纖維）飲食，並補足水分。蔬果、全穀、豆類都是高纖食物，急性期應避免；等發炎緩解後才逐步恢復高纖飲食，預防憩室炎復發。"},{"id":"115-1-4102-12","p":"115-1-4102","n":12,"q":"下列何者的熱量較高且較難消化？","o":["米粉不含湯半碗","小湯圓20粒","蘿蔔糕50克","年糕30克"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"全榖雜糧類的份量與消化性","ex":"依食物代換表，米粉（濕）半碗、蘿蔔糕 50 克、年糕 30 克都是 1 份全榖雜糧類（約 70 大卡）；小湯圓（無餡）10 粒是 1 份，20 粒就是 2 份、約 140 大卡，熱量最高。湯圓是糯米製品，支鏈澱粉多、黏性高，也比較不容易消化。"},{"id":"115-1-4102-13","p":"115-1-4102","n":13,"q":"有關海藻糖的敘述，下列何者正確？","o":["可分解為葡萄糖和果糖","在小腸由海藻糖酶分解","與蔗糖甜度相同","不會被吸收代謝，故無熱量"],"a":"B","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"海藻糖的消化","ex":"海藻糖是兩個葡萄糖以 α-1,1 鍵結合的雙醣，在小腸刷狀緣由海藻糖酶分解成兩分子葡萄糖後吸收，每公克一樣提供 4 大卡。分解成葡萄糖和果糖的是蔗糖；海藻糖的甜度大約只有蔗糖的一半。"},{"id":"115-1-4102-14","p":"115-1-4102","n":14,"q":"測量鮮奶的升糖指數（GI）時，應攝取幾杯鮮奶？（四捨五入至整數）","o":["1杯","2杯","3杯","4杯"],"a":"D","c":"營養學","c2":"","ch":"醣類","ch2":"","t":"升糖指數的測定方法","ex":"測定升糖指數時，受試食物的份量要含有 50 公克可利用的醣類。鮮奶每杯（240 毫升）含醣約 12 公克，50 ÷ 12 ≈ 4.2，四捨五入為 4 杯。"},{"id":"115-1-4102-15","p":"115-1-4102","n":15,"q":"Leucine脫胺作用（deamination）後的碳骨架（carbon skeleton）無法形成下列何種物質？","o":["cholesterol","fatty acid","glucose","ketones"],"a":"C","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"生酮性胺基酸的碳骨架去向","ex":"白胺酸（leucine）是純生酮性胺基酸，碳骨架代謝成乙醯輔酶 A 與乙醯乙酸，可以用來合成酮體、脂肪酸和膽固醇。乙醯輔酶 A 無法淨合成葡萄糖，所以白胺酸不能進行醣質新生。純生酮性胺基酸只有白胺酸和離胺酸。"},{"id":"115-1-4102-16","p":"115-1-4102","n":16,"q":"下列何種情況是「負氮平衡」狀態？","o":["胰島素分泌增加時","能量攝取不足時","健身練重訓的過程","疾病復原期"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"氮平衡","ex":"負氮平衡是氮的排出大於攝取。能量攝取不足時，身體會分解體蛋白質當作能量來源，含氮廢物排出增加。胰島素促進蛋白質合成；重量訓練增肌、疾病復原期都在建造組織，屬於正氮平衡。"},{"id":"115-1-4102-17","p":"115-1-4102","n":17,"q":"下列何者為hyperphagia的意思？","o":["over-eating","increased cell number","increased cell size","difficulty swallowing"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"名詞：hyperphagia","ex":"hyper- 是過多，-phagia 是吃，hyperphagia 指攝食過量（over-eating）。細胞數目增加是 hyperplasia（增生），細胞體積增大是 hypertrophy（肥大），吞嚥困難是 dysphagia。"},{"id":"115-1-4102-18","p":"115-1-4102","n":18,"q":"Harris-Benedict equations可以用於預測下列何者？","o":["resting metabolic rate（RMR）","ideal body weight","osteoporosis","atherosclerosis"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"Harris-Benedict 公式","ex":"Harris-Benedict 公式用性別、體重、身高、年齡來估算基礎（休息）能量消耗，也就是 RMR／REE。算出來之後再乘上活動因子與壓力因子，才是一天的總能量需求。"},{"id":"115-1-4102-19","p":"115-1-4102","n":19,"q":"總能量之消耗是由不同physical activity level（PAL）乘上何者估計而得？","o":["resting metabolic rate","body mass index","total energy expenditure","thermic effect of food"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"總能量消耗的估算（PAL）","ex":"總能量消耗（TEE）＝ 休息代謝率（RMR）× 身體活動程度（PAL）。TEE 是計算的結果；攝食產熱效應（TEF）只占總消耗約一成；BMI 是體位指標，不是能量。"},{"id":"115-1-4102-20","p":"115-1-4102","n":20,"q":"下列那一種酵素的作用不需要維生素C的參與？","o":["prolyl hydroxylase","glycogen phosphorylase","tyrosine hydroxylase","dopamine β-hydroxylase"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 參與的酵素","ex":"肝醣磷酸化酶（glycogen phosphorylase）的輔酶是維生素 B6（PLP），與維生素 C 無關。維生素 C 是還原劑，負責讓羥化酶裡的鐵或銅維持還原態：prolyl hydroxylase（膠原蛋白合成）、dopamine β-hydroxylase（多巴胺轉成正腎上腺素）都需要它，tyrosine hydroxylase 所在的兒茶酚胺合成路徑也需要維生素 C 參與。"},{"id":"115-1-4102-21","p":"115-1-4102","n":21,"q":"下列何者的滲透壓感測器（osmoreceptors）會偵測到體內滲透壓的升高，促使抗利尿激素分泌以保留水分？","o":["hypothalamus","hippocampus","pituitary gland","cerebral cortex"],"a":"A","c":"營養學","c2":"","ch":"水","ch2":"","t":"滲透壓感測與抗利尿激素","ex":"偵測血漿滲透壓的感受器位在下視丘。滲透壓升高時，下視丘一方面引起口渴，一方面讓它製造的抗利尿激素（ADH）從腦下垂體後葉釋出，使腎臟集尿管多回收水分。腦下垂體只負責儲存與釋放，不負責偵測。"},{"id":"115-1-4102-22","p":"115-1-4102","n":22,"q":"關於鉀離子的排泄，下列何者正確？","o":["鉀主要經由糞便排出，尿液中排泄量較少","腎臟遠端小管和集尿管能依身體需求排出或再吸收鉀離子","鉀離子排泄量與體內鉀攝取量無關","酸中毒（acidosis）會促進鉀離子的排泄"],"a":"B","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鉀的腎臟排泄","ex":"鉀約九成由尿液排出，糞便只占少量。腎絲球濾出的鉀大部分先被再吸收，最後由遠端小管與集尿管依身體需求（受醛固酮調節）分泌或再吸收，所以攝取越多排出越多。酸中毒時氫離子進入細胞、鉀移出細胞，腎臟排鉀減少，容易高血鉀。"},{"id":"115-1-4102-23","p":"115-1-4102","n":23,"q":"有關膳食鐵的吸收，下列何者正確？","o":["鐵在小腸刷狀緣的吸收是藉由簡單擴散和主動運輸","長期服用制酸劑者會降低血基質鐵（heme iron）的吸收","飲食中的植酸或草酸較不影響血基質鐵（heme iron）的吸收","同時攝取深綠色蔬菜和全穀類有利於鐵的吸收"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鐵的吸收","ex":"血基質鐵以完整的血基質形式被吸收，幾乎不受植酸、草酸、多酚等飲食因子影響。A：非血基質鐵要先還原成二價鐵，再由 DMT1 運輸蛋白送入細胞，不是簡單擴散。B：制酸劑減少胃酸，主要降低的是非血基質鐵的吸收。D：深綠色蔬菜的草酸與全穀的植酸會抑制非血基質鐵的吸收。"},{"id":"115-1-4102-24","p":"115-1-4102","n":24,"q":"教育部訂定的「學校午餐食物內容及營養基準」中，高中男生午餐的食物內容目標值，下列何者錯誤？","o":["蔬菜類2份／餐","水果類1份／餐","豆魚蛋肉類3份／餐","全穀雜糧類4～5份／餐"],"a":"D","c":"膳食計畫與供應","c2":"","ch":"菜單設計與營養基準","ch2":"","t":"學校午餐食物內容及營養基準","ex":"依教育部「學校午餐食物內容及營養基準」的目標值，高中男生每餐為全榖雜糧類 6～7.5 份、豆魚蛋肉類 3 份、蔬菜類 2 份、水果類 1 份。4～5 份的全榖雜糧類明顯不足，接近國小階段的份量。"},{"id":"115-1-4102-25","p":"115-1-4102","n":25,"q":"35週出生的嬰兒最容易缺乏下列何種礦物質？","o":["fluoride","copper","zinc","iron"],"a":"D","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"早產兒易缺乏的礦物質","ex":"胎兒體內的鐵主要在懷孕最後三個月累積。35 週出生的早產兒鐵儲存量少，出生後追趕生長又快、需求高，所以最容易缺鐵，通常需要補充鐵劑。"},{"id":"115-1-4102-26","p":"115-1-4102","n":26,"q":"有關營養素及免疫系統的敘述，下列何者錯誤？","o":["碳水化合物於致病原之免疫辨識及抗原結合，扮演重要作用","脂肪酸可提供免疫系統能量來源及扮演訊息傳遞的角色","維生素A、C、D、E有助於維持細胞表皮的完整性，保護組織免於感染","Fe可以促進氧自由基的生成，因此會降低免疫系統的作用"],"a":"D","c":"營養學","c2":"","ch":"總覽","ch2":"","t":"營養素與免疫","ex":"鐵是免疫細胞增殖與功能所必需：嗜中性球和巨噬細胞就是靠含鐵酵素產生氧自由基來殺菌，缺鐵會讓免疫功能下降。所以「促進氧自由基生成，因此降低免疫作用」的推論是錯的。其餘三項都正確。"},{"id":"115-1-4102-27","p":"115-1-4102","n":27,"q":"關於胺基酸的敘述，下列何者錯誤？","o":["色胺酸是合成血清素的前驅物","酪胺酸是合成副甲狀腺素的前驅物","甲硫胺酸是人體重要的甲基供應者","精胺酸參與內皮細胞一氧化氮的生成"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"胺基酸的衍生物與功能","ex":"酪胺酸是甲狀腺素（T3、T4）、兒茶酚胺（多巴胺、正腎上腺素、腎上腺素）和黑色素的前驅物。副甲狀腺素是由 84 個胺基酸組成的多胜肽荷爾蒙，不是由酪胺酸衍生。其餘三項正確。"},{"id":"115-1-4102-28","p":"115-1-4102","n":28,"q":"有關蛋白質結構的敘述，下列何者正確？","o":["二級結構是多胜肽摺疊成三度空間的立體形狀","三級結構是多條多胜肽集合在一起","四級結構可被加熱破壞","鐮刀型貧血是因為tRNA出錯影響血紅素的蛋白質三級結構"],"a":"C","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質的結構層級","ex":"一級結構是胺基酸序列；二級是 α-螺旋與 β-摺板；三級是一條多胜肽摺疊成立體形狀（A 講的是三級）；四級是多條多胜肽組合在一起（B 講的是四級）。加熱會使蛋白質變性，破壞二、三、四級結構，只有一級結構不受影響。鐮刀型貧血是血紅素基因突變，使一個麩胺酸變成纈胺酸，改變的是一級結構，不是 tRNA 出錯。"},{"id":"115-1-4102-29","p":"115-1-4102","n":29,"q":"下列那一年齡層的腸道細胞，最易吸收未經分解的蛋白質？","o":["3月齡嬰兒","3歲幼兒","13歲少年","73歲老年人"],"a":"A","c":"營養學","c2":"生命期營養","ch":"蛋白質","ch2":"","t":"嬰兒吸收完整蛋白質","ex":"嬰兒出生後頭幾個月腸道黏膜還沒成熟、通透性高，可以直接吸收未分解的完整蛋白質，例如母乳中的免疫球蛋白；這也是太早接觸某些食物蛋白質容易引起過敏的原因。隨著腸道成熟，這種能力會消失。"},{"id":"115-1-4102-30","p":"115-1-4102","n":30,"q":"下列食物的組合，何者的蛋白質品質最差？","o":["饅頭＋豆漿","薏仁＋紅豆","毛豆＋白飯","紫米＋黑豆"],"a":"B","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質互補","ex":"黃豆、毛豆、黑豆屬於豆魚蛋肉類，是高品質蛋白質，離胺酸豐富，和缺離胺酸的穀類（饅頭、白飯、紫米）搭配有互補作用。紅豆屬於全榖雜糧類，以澱粉為主，蛋白質含量和品質都不如黃豆類，和薏仁搭配的蛋白質品質最差。"},{"id":"115-1-4102-31","p":"115-1-4102","n":31,"q":"下列那一類脂蛋白涉及reverse cholesterol transport？","o":["chylomicron","very low density lipoprotein","low density lipoprotein","high density lipoprotein"],"a":"D","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"脂蛋白與膽固醇逆運輸","ex":"膽固醇逆運輸是高密度脂蛋白（HDL）把周邊組織多餘的膽固醇帶回肝臟，再代謝或隨膽汁排出。乳糜微粒運送食物來的脂肪，VLDL 運送肝臟合成的三酸甘油酯，LDL 把膽固醇送往周邊組織。"},{"id":"115-1-4102-32","p":"115-1-4102","n":32,"q":"下列何者不是次亞麻油酸（α-linolenic acid）的代謝衍生物？","o":["prostaglandin-3","thromboxane-3","lipoxin-5","leukotriene-5"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"n-3 脂肪酸的類二十碳酸衍生物","ex":"α-次亞麻油酸（n-3）在體內轉成 EPA，再生成第 3 系列的前列腺素與血栓素，以及第 5 系列的白三烯素。教科書中的脂氧素（lipoxin）是由 n-6 的花生四烯酸生成的第 4 系列產物，不列為 α-次亞麻油酸的代謝衍生物。"},{"id":"115-1-4102-33","p":"115-1-4102","n":33,"q":"依據最新版的「國人膳食營養素參考攝取量」，成年人每日脂質與脂肪酸的可接受範圍（acceptable macronutrient distribution ranges, AMDR）占總熱量百分比，下列何者錯誤？","o":["脂質20～30％","飽和脂肪酸＜10％","n-3多元不飽和脂肪酸10％","n-6多元不飽和脂肪酸4～8％"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"DRIs：脂質與脂肪酸的 AMDR","ex":"國人膳食營養素參考攝取量第八版的 AMDR：脂質 20～30%、飽和脂肪酸 <10%、n-6 多元不飽和脂肪酸 4～8%、n-3 多元不飽和脂肪酸 0.6～1.2%。n-3 寫成 10% 高出太多。"},{"id":"115-1-4102-34","p":"115-1-4102","n":34,"q":"下列何種油的α-linolenic acid含量相對最高？","o":["玉米油（corn oil）","大豆油（soybean oil）","亞麻仁油（flaxseed oil）","葵花籽油（sunflower oil）"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"α-次亞麻油酸的食物來源","ex":"亞麻仁油的脂肪酸有一半以上是 α-次亞麻油酸，是常見食用油中最高的。大豆油約 7%；玉米油、葵花籽油以 n-6 的亞麻油酸為主，α-次亞麻油酸很少。"},{"id":"115-1-4102-35","p":"115-1-4102","n":35,"q":"下列何者最能作為評估動脈粥狀硬化性心血管疾病風險的預測指標？","o":["總膽固醇濃度","血中small dense LDL的濃度","HDL濃度","飯後的血中三酸甘油酯濃度"],"a":"B","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"心血管疾病風險指標","ex":"小而緻密的 LDL（small dense LDL）顆粒小，容易穿過血管內皮、容易被氧化、在血中停留時間長，致動脈粥狀硬化的能力最強，比總膽固醇更能預測風險。總膽固醇包含有保護作用的 HDL，無法區分好壞。"},{"id":"115-1-4102-36","p":"115-1-4102","n":36,"q":"葉酸以輔酶型式參與人體的代謝作用，下列組合何者正確？","o":["二氫葉酸（dihydrofolate）及DNA合成","二氫葉酸（dihydrofolate）及胺基酸代謝","四氫葉酸（tetrahydrofolate）及單碳代謝","四氫葉酸（tetrahydrofolate）及轉硫作用"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"葉酸的輔酶型式與單碳代謝","ex":"葉酸要還原成四氫葉酸（THF）才是有活性的輔酶型式，負責攜帶並轉移單碳基團（甲基、亞甲基、甲醯基），用於合成嘌呤、胸腺嘧啶與同半胱胺酸的再甲基化。二氫葉酸是中間產物；轉硫作用的輔酶是維生素 B6。"},{"id":"115-1-4102-37","p":"115-1-4102","n":37,"q":"有關維生素缺乏所導致的症狀，下列何者錯誤？","o":["thiamin；Wernicke-Korsakoff syndrome","riboflavin；ariboflavinosis","folate；neural tube defects","pantothenic acid；seborrheic dermatitis"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 B 群缺乏症","ex":"泛酸分布很廣，缺乏很罕見，典型症狀是腳部灼熱感（burning feet syndrome）。脂漏性皮膚炎見於核黃素、維生素 B6 或生物素缺乏。其餘三項配對正確。"},{"id":"115-1-4102-38","p":"115-1-4102","n":38,"q":"有關抗壞血酸在腸道中的吸收，下列敘述何者正確？","o":["抗壞血酸的吸收率約為70～95％與單次攝取量無關","抗壞血酸於腸道中主要透過簡單擴散作用被吸收","脫氫抗壞血酸於腸道中主要透過簡單擴散作用被吸收","脫氫抗壞血酸被吸收後大部分會在腸細胞內被還原成抗壞血酸"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 的吸收","ex":"抗壞血酸靠鈉依賴型運輸蛋白（SVCT）以主動運輸吸收，吸收率會隨單次攝取量增加而下降，所以 A、B 錯。氧化型的脫氫抗壞血酸是經葡萄糖運輸蛋白（GLUT）以促進性擴散進入腸細胞，不是簡單擴散，C 錯；進入細胞後大部分會被還原回抗壞血酸。"},{"id":"115-1-4102-39","p":"115-1-4102","n":39,"q":"若健康成年女性攝取約710微克的膳食葉酸當量（dietary folate equivalents），除了進食中攝取300微克葉酸補充劑外，還需從飲食中攝取約多少微克的葉酸？","o":["410","260","200","118"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"膳食葉酸當量（DFE）計算","ex":"膳食葉酸當量（DFE）＝ 食物葉酸 ＋ 1.7 × 隨餐吃的葉酸補充劑。補充劑 300 μg 相當於 1.7 × 300 ＝ 510 μg DFE，所以還需要從食物攝取 710 − 510 ＝ 200 μg。"},{"id":"115-1-4102-40","p":"115-1-4102","n":40,"q":"體內約80～95％的維生素A儲存於肝臟的何種細胞中？","o":["Kupffer cells","stellate cells","hepatocytes","bile duct epithelial cells"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 A 的儲存細胞","ex":"維生素 A 以視黃酯的形式儲存在肝臟的星狀細胞（stellate cells，又稱 Ito 細胞）。肝細胞（hepatocytes）負責接收乳糜微粒殘餘物帶來的維生素 A，再轉送給星狀細胞儲存；Kupffer 細胞是肝臟的巨噬細胞。"},{"id":"115-1-4102-41","p":"115-1-4102","n":41,"q":"有關維生素E主要吸收的位置與方式，下列何者正確？","o":["十二指腸；主動轉運","空腸；被動擴散為主","迴腸；Na⁺伴隨轉運","胃；質子驅動運輸"],"a":"B","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 E 的吸收","ex":"維生素 E 是脂溶性，需要膽鹽與胰液把它併入微膠粒，主要在空腸以被動擴散進入腸細胞，再包進乳糜微粒經淋巴系統運送。它不靠鈉伴隨運輸或質子驅動運輸，也不在胃吸收。"},{"id":"115-1-4102-42","p":"115-1-4102","n":42,"q":"新生兒在出生後數小時內需接受維生素K注射的原因為何？","o":["新生兒對乳製品中的維生素K過敏","新生兒腸道細菌會大量分解維生素K","新生兒的腸道尚未建立正常菌叢，無法合成足夠維生素K","維生素K只能由成人的肝臟合成，嬰兒無法合成"],"a":"C","c":"營養學","c2":"生命期營養","ch":"維生素（脂溶性）","ch2":"","t":"新生兒與維生素 K","ex":"維生素 K 不易通過胎盤，母乳含量也低，新生兒腸道還沒有菌叢可以合成維生素 K，肝臟儲存量又少，容易發生新生兒出血症，所以出生後常規注射維生素 K。"},{"id":"115-1-4102-43","p":"115-1-4102","n":43,"q":"有關人體吸收和排除水分的敘述，下列何者錯誤？","o":["約85％的水分是在空腸和迴腸吸收","每天約有1至1.5公升水進入結腸，幾乎都隨糞便排出","健康成人每天主要透過尿液排出1至2公升水分","呼吸道的蒸發和汗液，皆是水分排出途徑"],"a":"B","c":"營養學","c2":"","ch":"水","ch2":"","t":"水分的吸收與排出","ex":"每天進入結腸的 1 至 1.5 公升水分，絕大部分會被結腸再吸收，隨糞便排出的只有大約 100～200 毫升。其餘三項敘述正確。"},{"id":"115-1-4102-44","p":"115-1-4102","n":44,"q":"下列何種食物可提供豐富的硫？","o":["燙青菜","杏仁奶","薏仁漿","舒肥雞"],"a":"D","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"硫的食物來源","ex":"人體的硫主要來自含硫胺基酸（甲硫胺酸、半胱胺酸），所以蛋白質豐富的食物才是硫的良好來源。四個選項中舒肥雞的蛋白質最多；青菜、杏仁奶、薏仁漿的蛋白質含量都低。"},{"id":"115-1-4102-45","p":"115-1-4102","n":45,"q":"下列何種酵素之活性不需要鐵離子參與？","o":["peroxidase","aconitase","cytochrome c oxidase","DNA polymerase"],"a":"D","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"含鐵酵素","ex":"peroxidase（過氧化酶）含血基質鐵；aconitase（烏頭酸酶）是檸檬酸循環中的鐵硫蛋白；cytochrome c oxidase 含血基質鐵與銅。DNA polymerase 的輔因子是鎂，不需要鐵。DNA 合成過程中需要鐵的是核糖核苷酸還原酶。"},{"id":"115-1-4102-46","p":"115-1-4102","n":46,"q":"有關鋅的敘述，下列何者錯誤？","o":["素食者、酗酒者、短腸症與克隆氏症患者為易缺乏族群","海鮮、肉類及乳製品為良好的來源","缺乏時易發生小球型低血色素貧血、毛髮異常、骨骼異常等","19歲以上男性的足夠攝取量為15 mg/day"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鋅","ex":"缺鋅的表現是生長遲緩、味覺變差、傷口癒合慢、皮膚炎、掉髮、腹瀉、免疫力下降與性腺發育不良。小球型低血色素貧血是缺鐵的典型表現，不是缺鋅。其餘三項正確：國人成年男性鋅的建議量為每日 15 毫克。"},{"id":"115-1-4102-47","p":"115-1-4102","n":47,"q":"有關氟的敘述，下列何者正確？","o":["臺灣長年施行氟化自來水的公共衛生政策","氟結晶可對抗口腔細菌產酸對琺瑯質的腐蝕","市售瓶裝水含有豐富的氟，可有效預防齲齒","氟主要經由糞便排泄途徑，以維持體內平衡"],"a":"B","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"氟","ex":"氟會取代琺瑯質羥磷灰石中的氫氧基，形成更耐酸的氟磷灰石結晶，並抑制口腔細菌產酸。臺灣沒有實施自來水加氟，而是推廣含氟牙膏、塗氟、含氟漱口水與氟鹽；瓶裝水含氟量通常很低；氟主要由腎臟隨尿液排出。"},{"id":"115-1-4102-48","p":"115-1-4102","n":48,"q":"有關selenium的敘述，下列何者正確？","o":["土壤會影響農作物的礦物質含量，蔬果是selenium最佳來源","成人建議攝取量依據血液中selenoprotein的濃度而訂定","含硒酵素的主要活性形式是selenocysteine","組織中，selenocysteine可以作為selenium的儲存庫"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"硒","ex":"麩胱甘肽過氧化酶等含硒酵素的活性中心是硒半胱胺酸（selenocysteine）。A：硒的良好來源是海鮮、內臟與肉類，蔬果含量低而且隨土壤變動。B：建議量是依血漿含硒酵素的「活性」達到最大來訂定，不是濃度。D：組織中儲存硒的形式是硒甲硫胺酸（selenomethionine）。"},{"id":"115-1-4102-49","p":"115-1-4102","n":49,"q":"根據最新版「國人膳食營養素參考攝取量」，青春期對鈣的建議攝取量為何？","o":["鈣的建議量男女有別","鈣的建議攝取量採用RDA","13～18歲建議攝取量為1,200 mg/day","青春期上限攝取量為2,000 mg/day"],"a":"C","c":"營養學","c2":"生命期營養","ch":"礦物質（巨量）","ch2":"","t":"DRIs：青春期鈣","ex":"國人膳食營養素參考攝取量第八版中，13～18 歲的鈣為每日 1,200 毫克，是各年齡層最高。鈣採用的是足夠攝取量（AI）而不是 RDA，男女相同，上限攝取量是 2,500 毫克。"},{"id":"115-1-4102-50","p":"115-1-4102","n":50,"q":"足月產的嬰兒出生至5個月大都以全母乳哺餵時，下列何項建議最適當？","o":["母乳中氟含量很低，建議額外提供含氟飲用水來預防齲齒","若母親患有pernicious anemia，嬰兒可能需要額外補充葉酸","嬰兒滿6個月後，可以一般市售鮮牛乳作為補充","除非有食物過敏家族史，此時加入副食品無需特別避開易引發過敏的食物"],"a":"D","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"嬰兒期哺餵與副食品","ex":"目前的建議是嬰兒約 4～6 個月開始添加副食品，不需要刻意延後或避開蛋、花生等容易致敏的食物，延後並不能預防過敏。A：6 個月以下不需要補充氟。B：惡性貧血缺的是維生素 B12，嬰兒需要補充的是 B12 不是葉酸。C：滿 1 歲以前不適合用鮮牛乳取代母乳或配方奶。"},{"id":"115-1-5102-1","p":"115-1-5102","n":1,"q":"根據國人膳食營養素參考攝取量（DRIs）第八版總表中，19～50歲男性與女性於下列那兩項營養素皆有不相同之建議攝取量？","o":["鐵、鈣","鎂、鋅","維生素A、維生素D","維生素B1、維生素B12"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"DRIs 第八版成年男女建議量的差異","ex":"第八版 19～50 歲男女的建議量：鎂 380／320 毫克、鋅 15／12 毫克，兩項都不同。鈣同為 1,000 毫克、維生素 D 同為 10 微克、維生素 B12 同為 2.4 微克，所以其他選項都有一項男女相同。"},{"id":"115-1-5102-2","p":"115-1-5102","n":2,"q":"有關每日飲食指南對豆魚蛋肉類的攝取建議，下列何者錯誤？","o":["為避免同時攝取不利健康的脂肪，建議選用順序為豆類、魚類與海鮮、蛋類、禽肉、畜肉","若熱量需求1200大卡，建議攝取3份豆魚蛋肉類食物，其中至少1份為高鈣豆製品","應多攝取大豆干、傳統豆腐、五香豆干、素肉（分離黃豆蛋白製造）等高鈣豆製品","黃豆製品雖然甲硫胺酸含量稍低，但可和穀類或堅果種子類等一起食用，達到互補效果"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"每日飲食指南的豆魚蛋肉類建議","ex":"高鈣豆製品是指用含鈣凝固劑製作的傳統豆腐、豆干等。以分離黃豆蛋白製成的素肉含鈣量低，不算高鈣豆製品，而且加工品多含油與鈉，不應鼓勵多吃。其餘三項都是每日飲食指南的內容。"},{"id":"115-1-5102-3","p":"115-1-5102","n":3,"q":"高鈣黑芝麻粉，此產品宣稱「高鈣」，下列敘述何者錯誤？","o":["鈣屬於「可補充攝取」之營養素，當達到或超過規定量，可以宣稱「高」、「多」、「強化」、「富含」或等同意義詞句","因宣稱高鈣，所以此產品在營養標示處須標示鈣的含量","因宣稱高鈣，可以在外包裝處加註「鈣質可以預防骨質疏鬆症」","包裝食品四歲以上鈣的攝取參考值為1,200 mg"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"營養宣稱與不得宣稱療效","ex":"一般食品可以依規定做「高鈣」這類營養宣稱，也可以敘述營養素的生理功能，但不能宣稱醫療效能。「預防骨質疏鬆症」涉及疾病的預防，不得標示。"},{"id":"115-1-5102-4","p":"115-1-5102","n":4,"q":"餅乾營養標示列出每份碳水化合物16公克、糖8公克、膳食纖維3公克，此餅乾碳水化合物提供的熱量為幾大卡？","o":["64","120","58","70"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"營養標示中膳食纖維的熱量計算","ex":"營養標示計算熱量時，碳水化合物每公克 4 大卡，但其中的膳食纖維以每公克 2 大卡計。(16 − 3) × 4 + 3 × 2 ＝ 52 + 6 ＝ 58 大卡。"},{"id":"115-1-5102-5","p":"115-1-5102","n":5,"q":"下列何種包裝食品可以不需要有營養標示？","o":["碘鹽","番茄醬","保鮮膜包裝的滷豆干","宣稱無添加糖的氣泡水"],"a":"C","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"得免營養標示的食品","ex":"營養標示規定適用於完整包裝的食品。以保鮮膜簡易包覆、在現場販售的滷豆干不屬於完整包裝食品，可以不標示。另外，只要做了營養宣稱（例如無添加糖），就一定要有營養標示。"},{"id":"115-1-5102-6","p":"115-1-5102","n":6,"q":"有關我國高齡人口的狀況與政策，下列敘述何者錯誤？","o":["推估至民國115年高齡人口將達21％，成為高齡社會","民國106年起實施長照十年計畫2.0，推動社區整體照顧服務體系","50歲以上失智人口為長照2.0之服務對象","現行長期照顧服務體系，主要法源依據為民國104年公布之「長期照顧服務法」"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"高齡人口與長期照顧政策","ex":"65 歲以上人口占 14% 是「高齡社會」，臺灣在民國 107 年已經達到；占 20% 以上是「超高齡社會」。A 把超高齡社會說成高齡社會，所以錯。"},{"id":"115-1-5102-7","p":"115-1-5102","n":7,"q":"關於美國的「婦女、嬰兒與兒童特別營養補助計畫－Women, Infants, and Children（WIC）Program」的敘述，下列何者錯誤？","o":["低收入的婦女是美國農業部WIC計畫的補助對象之一","參與WIC的民眾可以獲得食物券到超市購買任何食物與民生必需品","參與WIC的民眾必須定期接受營養評估與衛教","WIC有提供母乳哺餵的諮詢"],"a":"B","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"美國 WIC 計畫","ex":"WIC 發給的是只能兌換指定營養食品的憑證，例如牛奶、蛋、全穀、蔬果、嬰兒配方食品，不能用來買任何食物或民生必需品。參加者要定期接受營養評估與衛教，計畫也提供母乳哺餵的支持。"},{"id":"115-1-5102-8","p":"115-1-5102","n":8,"q":"有關我國兒童生長曲線，下列敘述何者錯誤？","o":["適用於0至5歲的兒童","依據國民營養調查0到5歲健康兒童之身高體重繪製而成","生長指標落在第97及第3百分位兩線間均屬正常","生長曲線圖按照性別各分為身高、體重與頭圍三個生長指標的百分位圖"],"a":"B","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"兒童生長曲線的依據","ex":"現行的兒童生長曲線採用世界衛生組織的 0～5 歲兒童生長標準，是以多國純母乳哺育的健康兒童為樣本繪製，不是依據我國的國民營養調查。"},{"id":"115-1-5102-9","p":"115-1-5102","n":9,"q":"為提高癌症早期發現、早期治療，以提升存活率，政府於民國111年起，除原有的「四癌篩檢」外，新增的第五種癌症篩檢為何？","o":["肝癌","前列腺癌","肺癌","胃癌"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"癌症篩檢政策","ex":"原有的四癌篩檢是大腸癌、口腔癌、子宮頸癌與乳癌。民國 111 年起新增對肺癌高風險族群的低劑量電腦斷層篩檢。"},{"id":"115-1-5102-10","p":"115-1-5102","n":10,"q":"依據2025衛生福利政策白皮書，提供多元醫療保健資訊，例如編製多種語言版本提供新住民或外國籍病患運用。下列何者未包括？","o":["阿拉伯文","西班牙文","柬埔寨文","泰文"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"衛生福利政策白皮書的多語資訊","ex":"依標準答案，西班牙文不在白皮書列舉的多語版本內。政府的多語衛教資訊主要以新住民與移工常用的語言為主。"},{"id":"115-1-5102-11","p":"115-1-5102","n":11,"q":"下列何者屬於國際母乳代用品銷售守則規範的範疇？","o":["媽媽乳頭保護罩","電動擠奶器","6～12個月嬰兒適用米麥粉","3歲前嬰兒配方與幼兒成長奶粉"],"a":"D","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"國際母乳代用品銷售守則的範圍","ex":"守則規範的是母乳代用品，包括嬰兒配方、較大嬰兒配方與到 3 歲為止的幼兒成長奶粉，以及奶瓶和奶嘴。乳頭保護罩、擠奶器和不是用來取代母乳的副食品不在範圍內。"},{"id":"115-1-5102-12","p":"115-1-5102","n":12,"q":"2030年兒童醫療與健康政策建言書提到，2016年臺灣兒科醫學會對於嬰兒營養補充的建議，下列何者正確？","o":["給予滿三個月的嬰兒副食品","純母乳哺餵嬰兒不建議補充維生素D","純母乳哺餵嬰兒應自出生起補充鐵1 mg/kg/day","以純配方奶餵食之嬰兒，奶量不足1000 mL者應補充維生素D"],"a":"D","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"嬰兒的維生素 D 與鐵補充建議","ex":"臺灣兒科醫學會建議：純母乳或部分母乳哺育的嬰兒，從新生兒開始每天補充維生素 D 400 IU；喝配方奶但每天奶量不到 1,000 毫升的嬰兒也要補充。副食品在 4～6 個月開始；純母乳哺育的嬰兒是 4 個月後還沒吃副食品才補充鐵。"},{"id":"115-1-5102-13","p":"115-1-5102","n":13,"q":"在每份不超過250大卡的前提下，下列那項食品不符合國民中小學「校園飲品及點心販售範圍」之規定？","o":["含有占總熱量15％飽和脂肪的麵包","含有占總熱量20％糖做成的豆漿","含有占總熱量25％的油與糖（5％飽和脂肪＋10％不飽和脂肪＋10％糖）做成的餅乾","含有占總熱量35％的油與糖（20％不飽和脂肪＋15％糖）做成的餅乾"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"校園飲品及點心販售範圍","ex":"校園販售的點心對飽和脂肪占熱量的比例有上限，A 的飽和脂肪占到 15%，超過規定。其餘三項依標準答案都符合規定。"},{"id":"115-1-5102-14","p":"115-1-5102","n":14,"q":"有關營養師執業之相關規範，下列敘述何者錯誤？","o":["營養師執業應接受專業繼續教育，每6年應完成120點","營養師應於執業執照屆滿後三十日內提出更新","營養師執行業務應製作紀錄需妥善保管至少5年","營養師停業、歇業時，應於事實發生之日起三十日內，報請原發執業執照機關備查"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"營養師法的執業規定","ex":"營養師的執業執照每 6 年更新一次，應該在有效期限「屆滿前」6 個月內申請，不是屆滿後才提出。其餘三項都符合營養師法及相關規定。"},{"id":"115-1-5102-15","p":"115-1-5102","n":15,"q":"某國小每一年級有六個班級，依學校衛生法，有關該校自辦學校午餐的相關規定，下列敘述何者正確？","o":["該校至少應設置一位營養師","應成立學校午餐供應會，且委員組成中現任家長應占三分之一以上","學校為落實餐飲衛生自主管理機制，每天應至少檢查餐飲場所一次","教育局每學年至少一次應會同農業及衛生主管機關定期抽查學校餐飲衛生"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養政策與法規","ch2":"","t":"學校衛生法的午餐規定","ex":"學校衛生法規定主管機關每學年至少一次會同農業與衛生主管機關，抽查學校的餐飲衛生。A：班級數 40 班以上才須設置營養師，這所學校是 36 班。B：午餐供應會的現任家長應占四分之一以上。C：餐飲場所是每週至少檢查一次。"},{"id":"115-1-5102-16","p":"115-1-5102","n":16,"q":"下列臨床生化指標，何者最不適合評估碘營養狀態？","o":["Thyroid hormone","Serum thyroglobulin","Serum thyroid-stimulating hormone","Urinary iodine"],"a":"A","c":"營養評估","c2":"","ch":"生化評估","ch2":"","t":"碘營養狀態的評估指標","ex":"評估碘營養常用的指標是尿碘（反映近期攝取）、血清甲狀腺球蛋白和促甲狀腺激素。甲狀腺素要到碘缺乏相當嚴重時才會下降，最不敏感。"},{"id":"115-1-5102-17","p":"115-1-5102","n":17,"q":"以健康飲食指數（Healthy Eating Index）評估大學生的飲食營養狀況，不適合用下列何種方法收集飲食攝取資料？","o":["Food frequency questionnaire","24-hour dietary recall","Household inventory","Food record"],"a":"C","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"飲食評估方法的適用層級","ex":"健康飲食指數是評估「個人」的飲食品質，需要個人層級的攝取資料。家戶食物盤存法只能知道全家的食物消耗量，無法得知個人吃了什麼。"},{"id":"115-1-5102-18","p":"115-1-5102","n":18,"q":"24小時飲食回憶法（24-hour dietary recall）最不適用於下列何種類型的研究？","o":["橫斷面研究（Cross-sectional study）","病例對照研究（Case-control study）","前瞻式世代研究（Prospective cohort study）","介入研究（Intervention study）"],"a":"B","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"24 小時飲食回憶法的適用研究","ex":"病例對照研究要了解發病「之前」長期的飲食習慣，24 小時飲食回憶法只反映最近一天，而且病人患病後飲食往往已經改變，所以最不適用。"},{"id":"115-1-5102-19","p":"115-1-5102","n":19,"q":"使用工具性日常生活活動（Instrumental Activities of Daily Living, IADLs）量表綜合評估老年人營養狀況時，下列那一項非IADLs評估項目之一？","o":["自行準備餐食","自行採購食物和日用品","自行洗衣晾曬","自行上下樓梯"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"IADL 的評估項目","ex":"工具性日常生活活動共八項：使用電話、購物、備餐、處理家務、洗衣、外出交通、服用藥物、處理財務。上下樓梯屬於基本日常生活活動（巴氏量表）的項目。"},{"id":"115-1-5102-20","p":"115-1-5102","n":20,"q":"有關迷你營養評估量表（Mini Nutritional Assessment, MNA），下列敘述何者錯誤？","o":["MNA兼具營養篩檢與營養評估的功能","長照機構在住民入住72小時內須完成MNA的篩檢","MNA滿分30分，小於17分代表具營養不良風險","MNA-SF（MNA短版）有6個題項，適合社區老人的營養篩檢"],"a":"C","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"MNA 的計分與判讀","ex":"MNA 滿分 30 分：24 分以上營養狀況正常；17～23.5 分有營養不良的風險；低於 17 分是營養不良。C 把低於 17 分說成「具風險」，所以錯。"},{"id":"115-1-5102-21","p":"115-1-5102","n":21,"q":"根據心血管疾病流行病學研究指出，下列那些選項用於預測心臟血管疾病的危險性相對較敏感？①Hip-circumference　②Body weight　③Waist circumference　④Sagittal abdominal diameter（SAD）　⑤Knee-height","o":["①②","③④","③⑤","②⑤"],"a":"B","c":"營養評估","c2":"","ch":"體位評估","ch2":"","t":"預測心血管疾病風險的體位指標","ex":"腰圍和腹部矢狀徑（平躺時腹部的前後徑）都反映腹部與內臟脂肪的堆積，和心血管疾病風險的關係比體重、臀圍密切。膝高是用來推估身高的。"},{"id":"115-1-5102-22","p":"115-1-5102","n":22,"q":"迷你營養評估（Mini Nutritional Assessment, MNA）量表之評估項目，不包括下列那一項？","o":["血清白蛋白濃度","神經精神問題","BMI","進食的型式"],"a":"A","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"MNA 的評估項目","ex":"MNA 的項目包括體位測量（身體質量指數、臂圍、小腿圍、體重變化）、整體評估（活動力、用藥、神經精神問題）、飲食評估（餐次、進食型式等）和自我評估，完全不需要抽血，不包含血清白蛋白。"},{"id":"115-1-5102-23","p":"115-1-5102","n":23,"q":"下列臟器蛋白質之半衰期，何者最長？","o":["白蛋白（albumin）","運鐵蛋白（transferrin）","視網醇結合蛋白（retinol-binding protein）","甲狀腺素前白蛋白（thyroxin-binding prealbumin）"],"a":"A","c":"營養評估","c2":"","ch":"生化評估","ch2":"","t":"內臟蛋白質的半衰期","ex":"半衰期由長到短：白蛋白約 14～20 天、運鐵蛋白約 8～10 天、前白蛋白約 2～3 天、視網醇結合蛋白約 12 小時。"},{"id":"115-1-5102-24","p":"115-1-5102","n":24,"q":"紫斑症（purpura）與下列何種營養素缺乏有關？","o":["Vitamin A","Vitamin D","Vitamin E","Vitamin K"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"營養素缺乏的臨床徵候","ex":"維生素 K 缺乏時凝血因子無法活化，容易皮下出血，出現紫斑。"},{"id":"115-1-5102-25","p":"115-1-5102","n":25,"q":"有關體位測量，下列敘述何者錯誤？","o":["Gynoid型肥胖會增加胰島素阻抗的風險","相對體重（relative weights）範圍的90～120％為正常","Quetelet's index以公斤／平方公尺為單位","身高體重表（height-weight tables）無法提供身體組成資訊"],"a":"A","c":"營養評估","c2":"","ch":"體位評估","ch2":"","t":"體位測量與肥胖型態","ex":"會增加胰島素阻抗和代謝疾病風險的是 android 型（蘋果型、腹部）肥胖。gynoid 型（梨型）的脂肪堆積在臀部和大腿，風險較低。"},{"id":"115-1-5102-26","p":"115-1-5102","n":26,"q":"關於問卷題目的編製，下列何者錯誤？","o":["結構性題目可取自焦點團體訪談的結論","問卷題目的詞句須考慮受試對象的教育程度、職業和年齡等因素","開放性題目與結構性題目不會同時出現在問卷裡","問卷題目的反向題可檢驗問卷的信度"],"a":"C","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"問卷題目的編製","ex":"一份問卷可以同時有結構性（封閉式）和開放性的題目，兩者經常搭配使用。"},{"id":"115-1-5102-27","p":"115-1-5102","n":27,"q":"在設計營養態度量表過程中，下列那個步驟執行後，須作內部一致性檢驗？","o":["經專家審查並做問卷修改後","找背景相似的受試者進行預試後","經焦點團體訪談並編製問卷題目後","確認研究對象並有效抽樣後"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"量表的預試與信度檢驗","ex":"量表初稿完成後，要先找背景和正式對象相似的人做預試，再用預試的資料做項目分析與內部一致性（例如 Cronbach's α）的信度檢驗。"},{"id":"115-1-5102-28","p":"115-1-5102","n":28,"q":"教案設計中，下列敘述何者並非訂定教學目標時需考慮的事項？","o"
