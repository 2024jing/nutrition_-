<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代謝路徑圖解</title>
<meta name="description" content="營養生化代謝路徑圖解：醣類、脂質、蛋白質、核苷酸代謝，含位置圖、環狀循環圖與填空練習">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f1;--surface:#fff;--soft:#f1ede6;--soft2:#e9e4db;--ink:#2a2723;--muted:#6f685e;--muted2:#a39b8f;--line:#e7e0d4;--line2:#cfc6b8;
--carb:#e07a2f;--lipid:#c39100;--protein:#2f72c8;--nuc:#8a56c2;--other:#1f9286;
--atp:#2e9a4e;--nadh:#2f6fd0;--nadph:#8a4fd0;--fad:#d97d1f;--co2:#7d7d7d;--vit:#c2477a;--bad:#d64545;--ok:#2e9a4e;--acc:var(--carb)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--surface:#262421;--soft:#2f2c28;--soft2:#3a3631;--ink:#eee8de;--muted:#b3aa9d;--muted2:#7d756a;--line:#3a3631;--line2:#575047}}
:root[data-theme="dark"]{--bg:#1b1a18;--surface:#262421;--soft:#2f2c28;--soft2:#3a3631;--ink:#eee8de;--muted:#b3aa9d;--muted2:#7d756a;--line:#3a3631;--line2:#575047}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;text-decoration:none;font-size:17px}
header.top .brand small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
#menu{display:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1280px;margin:0 auto}
#side{position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;padding:14px 12px 40px;border-right:1px solid var(--line)}
#q{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
#navlist a{text-decoration:none;display:block;border-radius:6px}
.nav-home{padding:6px 8px;font-weight:700}
.nav-cat{margin-top:12px}
.nav-cat-t{display:flex;justify-content:space-between;padding:4px 8px;font-weight:700;color:var(--acc);border-left:4px solid var(--acc);border-radius:0!important}
.nav-cat-t small{color:var(--muted);font-weight:400}
.nav-cat ul{list-style:none;margin:4px 0 0;padding:0}
.nav-cat li a{padding:3px 8px 3px 16px;font-size:14px;color:var(--muted)}
#navlist a:hover{background:var(--soft)}
#navlist a.on{background:color-mix(in srgb,var(--acc) 15%,var(--surface));color:var(--ink);font-weight:500}
main{padding:22px 28px 60px;min-width:0}
.page{max-width:880px}
.crumb{font-size:13px;color:var(--acc);text-decoration:none;font-weight:500}
h1{font-size:28px;margin:4px 0 0;line-height:1.3}
.en-t{color:var(--muted);margin:2px 0 14px;font-style:italic}
h3{font-size:18px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--acc)}
h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.lead{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.info{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.info th{width:120px;text-align:left;background:color-mix(in srgb,var(--acc) 10%,var(--surface));padding:8px 12px;font-weight:500;font-size:14px;vertical-align:top}
.info td{padding:8px 12px;border-top:1px solid var(--line)}
.info tr:first-child td{border-top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th{background:color-mix(in srgb,var(--acc) 12%,var(--surface));text-align:left;padding:8px 10px;white-space:nowrap}
table.grid td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.cat td:first-child{min-width:150px}
table.cat a{color:var(--acc)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin:2px 4px 2px 0;border:1px solid currentColor;line-height:1.5;background:var(--surface)}
.c-atp{color:var(--atp)}.c-nadh{color:var(--nadh)}.c-nadph{color:var(--nadph)}.c-fad{color:var(--fad)}.c-co2{color:var(--co2)}.c-vit{color:var(--vit)}.c-bad{color:var(--bad)}
.bd{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin:2px 4px 2px 0;font-weight:500;vertical-align:middle}
.bd-rl{background:var(--bad);color:#fff}.bd-irr{background:var(--soft2);color:var(--ink)}.bd-cyc{background:var(--acc);color:#fff;font-size:13px}
/* where */
.where-grid{display:flex;flex-wrap:wrap;gap:12px}
.where figure{margin:0;flex:1 1 260px;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.where figcaption{text-align:center;font-size:13px;color:var(--muted)}
.where-txt{font-size:14px;color:var(--muted);margin:6px 2px 0}
svg.body{display:block;max-height:260px;width:100%}
svg.cell{display:block;width:100%}
.olab{font-size:11px;font-weight:700}
.clab{font-size:12px}.clab.on{font-weight:700}
/* ring */
.ringwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.ring{display:block;width:100%;max-width:680px;margin:0 auto}
.rn-en{font-size:15px;font-weight:700;fill:var(--ink)}.rn-zh{font-size:13px;fill:var(--muted)}
.rnum{font-size:14px;font-weight:700;fill:#fff}
.ran{font-size:15px;font-weight:700}.ran-in{fill:var(--atp)}.ran-out{fill:var(--fad)}.ran-tag{fill:var(--muted)}
.rc1{font-size:23px;font-weight:700;fill:var(--acc)}.rc2{font-size:15px;fill:var(--muted)}
.zlab{font-size:18px;font-weight:700}.zsub{font-size:11px;fill:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px}
/* flow */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#score{font-weight:700;color:var(--acc)}
.flow{max-width:620px}
.node{--nc:var(--acc);background:var(--surface);border:2px solid var(--nc);border-left-width:7px;border-radius:12px;padding:8px 12px;position:relative}
.node b{display:block;font-size:15px}
.node small{color:var(--muted);font-size:13px}
.ntag{position:absolute;right:8px;top:-10px;color:#fff;font-size:11px;padding:0 8px;border-radius:999px;line-height:18px}
.edge{display:flex;gap:12px;padding-left:20px}
.arr{flex:none;width:28px;position:relative;display:flex;justify-content:center}
.arr::before{content:"";position:absolute;top:0;bottom:8px;left:13px;width:3px;background:var(--acc)}
.arr::after{content:"";position:absolute;bottom:0;left:7px;border:7px solid transparent;border-top:10px solid var(--acc);border-bottom:0}
.arr .num{position:relative;z-index:1;margin-top:14px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ebody{flex:1;min-width:0;padding:10px 0 12px}
.enz{display:inline-block;max-width:100%;background:color-mix(in srgb,var(--acc) 11%,var(--surface));border-left:3px solid var(--acc);border-radius:6px;padding:5px 10px}
.enz b{display:block;font-size:14px;font-weight:700}
.enz small{color:var(--muted);font-size:13px}
.meta{margin-top:4px}
.enote{font-size:13px;color:var(--muted);margin-top:2px}
.cross{font-size:13px;margin-bottom:4px;padding:2px 8px;border:1px dashed var(--line2);border-radius:6px;display:inline-block;background:var(--soft)}
.loop{margin-top:6px;border:2px dashed var(--acc);border-radius:12px;padding:8px 12px;color:var(--acc);font-weight:500}
select.q{max-width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
select.q.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
select.q.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fb{display:block;font-size:13px;font-weight:500;margin-top:3px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.q-node{padding:8px}
.br li,.keys li{margin:4px 0}
.keys ul{background:color-mix(in srgb,var(--acc) 8%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 32px;margin:0}
.br{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 32px;margin:0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;color:var(--acc);font-weight:500}
/* home */
.q3{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.q3 ol{margin:4px 0 0;padding-left:22px}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.maps section{min-width:0}
.hubwrap,.cellmapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
svg.hub,svg.cellmap{display:block;width:100%;max-width:440px;margin:0 auto}
.hn{font-size:11.5px;font-weight:700;fill:var(--ink)}.hz{font-size:10px;fill:var(--muted)}
.hl{font-size:10.5px;fill:var(--muted);font-weight:500}
.go{cursor:pointer}.go:hover rect{stroke-width:2.5}
text.go:hover{text-decoration:underline}
.cm{font-size:12.5px;font-weight:500}.cmt{font-size:13.5px;font-weight:700}.cms{font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:12px;padding:12px 14px}
.card b{color:var(--acc);font-size:16px}.card small{color:var(--muted);margin-left:6px}
.card span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
/* practice */
.nav-pr{color:var(--carb);margin-top:2px}
.lbl{font-size:14px;color:var(--muted);align-self:center}
.btn.big{font-size:16px;padding:10px 18px;margin:4px 10px 4px 0}
.prog{font-size:14px;color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pitem{position:relative;display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:8px 12px}
.pitem b{display:block;font-size:15px}.pitem small{color:var(--muted);font-size:12px}
.pitem.done{background:color-mix(in srgb,var(--acc) 7%,var(--surface))}
.pscore{position:absolute;right:8px;top:8px;font-size:12px;font-weight:700;color:var(--muted)}.pscore.full{color:var(--ok)}
.qbar2{margin:14px 0 0}.score2{font-weight:700;color:var(--acc)}
.hintbox{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hintbox summary{cursor:pointer;font-weight:500}
.learnlink{font-size:14px}.learnlink a{color:var(--acc)}
.prbanner{display:block;text-decoration:none;margin:22px 0 4px;background:var(--carb);color:#fff;border-radius:14px;padding:14px 18px}
.prbanner b{display:block;font-size:19px}.prbanner span{font-size:14px;opacity:.92}
.pn #rnd{color:var(--muted)}
/* journey */
.nav-jr{color:var(--other)}
.jrbanner{background:var(--other)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.jleft{position:sticky;top:64px}
.jmapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.jmap{display:block;width:100%;max-width:460px;margin:0 auto}
.jb{font-size:12.5px;font-weight:700}.jbs{font-size:10px;fill:var(--muted)}
.jst .jc{fill:var(--surface);stroke:var(--line2);stroke-width:2;transition:all .3s}
.jst .jn{font-size:11px;font-weight:700;fill:var(--muted)}
.jst .jl{font-size:12px;fill:var(--muted);font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.jst.past .jc{fill:color-mix(in srgb,var(--acc) 35%,var(--surface));stroke:var(--acc)}
.jst.past .jn{fill:var(--ink)}
.jst.now .jc{fill:var(--acc);stroke:var(--acc);r:13}
.jst.now .jn{fill:#fff}.jst.now .jl{fill:var(--ink);font-weight:700}
.jtok{transition:transform .8s cubic-bezier(.45,.05,.3,1)}
.jtok rect{fill:var(--ink)}.jtok text{fill:var(--bg);font-size:12px;font-weight:700}.jtokp{fill:var(--ink)}
.jctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.jctrl #jstep{font-weight:700;color:var(--acc);font-size:14px}
.jctrl .btn{font-size:15px;padding:8px 14px}.btn:disabled{opacity:.4;cursor:default}
.jctrl2{display:flex;gap:8px;margin-top:8px}
.jcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:14px 16px}
.jhead{display:flex;gap:10px;align-items:flex-start}
.jnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.jhead b{display:block;font-size:17px;line-height:1.4}
.jwhere{display:inline-block;margin-top:4px;font-size:13px;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--bc) 16%,var(--surface));color:var(--ink)}
.jform{margin:12px 0 6px;font-size:14px}.jform span,.jout span{display:inline-block;font-size:12px;color:var(--muted);margin-right:8px}
.jform b{font-size:16px;background:var(--ink);color:var(--bg);padding:1px 10px;border-radius:999px}
.jhow{margin:6px 0;padding-left:20px}.jhow li{margin:4px 0}
.jout{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--soft);font-weight:500}
.jtip{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.jlinks{margin-top:10px;font-size:14px}.jlinks a{color:var(--acc);margin-right:10px;white-space:nowrap;font-weight:500}
.jtl{list-style:none;padding:0;margin:0;counter-reset:j}
.jtl li{counter-increment:j;position:relative;padding:8px 10px 8px 42px;border-left:3px solid var(--line2);margin-left:14px;cursor:pointer;border-radius:0 8px 8px 0}
.jtl li::before{content:counter(j);position:absolute;left:-14px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jtl li.on{background:color-mix(in srgb,var(--acc) 10%,var(--surface))}.jtl li.on::before{background:var(--acc);color:#fff}
.jtl b{display:block;font-size:15px}.jtl small{color:var(--muted);font-size:13px}
.jtlb{float:right;color:#fff;font-size:11px;padding:0 8px;border-radius:999px;margin-left:6px}
.jref{font-size:14px;margin:10px 0 0;padding:8px 12px;background:color-mix(in srgb,var(--other) 9%,var(--surface));border-radius:10px}
.jref a{color:var(--other);font-weight:500;margin-left:8px;white-space:nowrap}
.jhub span{font-size:12.5px}
.fsbar{margin:6px 0 10px;font-size:15px}
.feedwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.feed{display:block;width:100%;max-width:520px;margin:0 auto}
.fo{font-size:16px;font-weight:700}.fnum{font-size:12px;font-weight:700;fill:#fff}
.flegend{list-style:none;counter-reset:f;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.flegend li{counter-increment:f;position:relative;padding:6px 10px 6px 40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:14px}
.flegend li::before{content:counter(f);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--fc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flegend b{display:block;font-size:13px;color:var(--fc)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--oc);border-radius:10px;padding:8px 12px}
.fcard b{display:block;color:var(--oc)}.fcard span{font-size:14px}
@media (max-width:860px){.jgrid{grid-template-columns:1fr}.jleft{position:static}}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px 16px 30px}
@media (max-width:900px){
  .maps{grid-template-columns:1fr}
}
@media (max-width:860px){
  #menu{display:inline-block}
  .app{display:block}
  #side{display:none;position:fixed;inset:53px 0 0 0;height:auto;background:var(--bg);z-index:15;border:0;padding:14px 16px 60px}
  body.navopen #side{display:block}
  main{padding:16px 16px 50px}
  h1{font-size:23px}
  .edge{padding-left:6px}
  .info th{width:96px;padding:8px}
}
</style>
</head>
<body>
<header class="top"><button id="menu" aria-label="開啟目錄">☰ 目錄</button><a class="brand" href="#/">代謝路徑圖解<small>保健營養菜單研究室</small></a></header>
<div class="app">
  <nav id="side"><input id="q" type="search" placeholder="搜尋路徑（中文或英文）"><div id="navlist"></div></nav>
  <main id="main"></main>
</div>
<footer>整理：蕭靜 · 內容為營養師國考複習用，以課本與現行指引為準</footer>
<script>
// ===== 代謝路徑資料 =====
// node: '英文|中文'   edge: {e:'英文|中文', c:[輔因子/產物], rl:限速, irr:不可逆, n:補充}
const CATS = {
  carb:   {zh:'醣類代謝', en:'Carbohydrate Metabolism', color:'var(--carb)',
           intro:'醣類以產能為主：有氧時 1 分子葡萄糖約得 30–32 ATP，無氧糖解只得 2 ATP。'},
  lipid:  {zh:'脂質代謝', en:'Lipid Metabolism', color:'var(--lipid)',
           intro:'脂肪只能在有氧下燃燒；β-氧化每輪切 2 碳，α-氧化只切 1 碳且不產生 ATP，用來處理支鏈脂肪酸。'},
  protein:{zh:'蛋白質與胺基酸代謝', en:'Protein & Amino Acid Metabolism', color:'var(--protein)',

function feedSVG(st) {
  const O = FEEDSTATE.org; const S0 = FEEDSTATE.states[st];
  const box = k => { const [x, y, zh, code] = O[k]; return k === 'blood' ? {x, y, w: 84, h: 84} : {x, y, w: 100, h: 46}; };
  const edge = (a, b) => { // 從 a 中心往 b，停在 a 的邊界
    const A = box(a), B = box(b); const dx = B.x - A.x, dy = B.y - A.y;
    const t = a === 'blood' ? 42 / Math.hypot(dx, dy) : Math.min(dx ? A.w / 2 / Math.abs(dx) : 9, dy ? A.h / 2 / Math.abs(dy) : 9);

  const pairs = {};
  S0.flows.forEach(([a, b]) => { pairs[[a, b].sort().join()] = (pairs[[a, b].sort().join()] || 0) + 1; });
  const labels = [];
  S0.flows.forEach(([a, b, lab], fi) => {
    let [x1, y1] = edge(a, b), [x2, y2] = edge(b, a);
    const both = pairs[[a, b].sort().join()] > 1;
    const L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
    const off = both ? 7 : 0;
    x1 += nx * off; y1 += ny * off; x2 += nx * off; y2 += ny * off;
    let d;
    if (a === 'gut' && b === 'adipose') { const g = box('gut'); x1 = g.x - 50; y1 = g.y + 10; d = `M${x1},${y1} C -25,120 -25,330 ${box('adipose').x - 50},${box('adipose').y}`; labels.push([-14, 265, fi]); }

      labels.push([x1 + (x2 - x1) * .42 + nx * (both ? 9 : 0), y1 + (y2 - y1) * .42 + ny * (both ? 9 : 0), fi]); }

  }
  labels.forEach(([x, y, fi]) => { s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${S0.col}" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle" class="fnum">${fi + 1}</text>`; });
  return s + `</svg>`;
}

/* ---------- 環狀圖 ---------- */
function ringSVG(p, R0, hideNames) {
  const n = R0.ring.length;
  const R = n >= 7 ? 215 : n >= 6 ? 175 : 140, W = 2 * R + 300, H = 2 * R + 190, cx = W / 2, cy = H / 2;
  const bws = R0.ring.map(([en]) => Math.max(96, (hideNames ? 1 : en.length) * 8.4 + 20)), BH = 46;
  const offAt = (i, a) => { const r = a * Math.PI / 180; return ((Math.abs(Math.sin(r)) * bws[i] / 2 + Math.abs(Math.cos(r)) * BH / 2) / R) * 180 / Math.PI + 4; };
  const ang = R0.ang || R0.ring.map((_, i) => -90 + i * 360 / n);
  const end = R0.end != null ? R0.end : (R0.ang ? ang[0] + 360 : ang[0] + 360);
  const dir = (ang[1] ?? end) > ang[0] ? 1 : -1;
  const pt = (a, r = R) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const colOf = k => (codeInfo(k) || {col: 'var(--acc)'}).col;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="ring" role="img" aria-label="${esc(p.zh)} 環狀圖"><defs><marker id="ah-r-${p.id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--acc)"/></marker></defs>`;
  if (R0.zones) {
    const z = R0.zones, A = codeInfo(z.a), B = codeInfo(z.b);
    if (z.type === 'h') {
      s += `<rect x="0" y="0" width="${W}" height="${cy}" rx="18" fill="${A.col}" opacity=".09"/><rect x="0" y="${cy}" width="${W}" height="${H - cy}" rx="18" fill="${B.col}" opacity=".09"/>`;
      s += `<line x1="8" y1="${cy}" x2="${W - 8}" y2="${cy}" stroke="var(--muted2)" stroke-dasharray="6 5"/>`;
      s += `<text x="14" y="26" class="zlab" fill="${A.col}">${A.zh}</text><text x="14" y="${H - 14}" class="zlab" fill="${B.col}">${B.zh}</text>`;
    } else {
      s += `<rect x="0" y="0" width="${cx}" height="${H}" rx="18" fill="${A.col}" opacity=".09"/><rect x="${cx}" y="0" width="${W - cx}" height="${H}" rx="18" fill="${B.col}" opacity=".09"/>`;
      s += `<line x1="${cx}" y1="8" x2="${cx}" y2="${H - 8}" stroke="var(--muted2)" stroke-dasharray="6 5"/>`;
      s += `<text x="14" y="26" class="zlab" fill="${A.col}">${A.zh}</text><text x="${W - 14}" y="26" text-anchor="end" class="zlab" fill="${B.col}">${B.zh}</text>`;
    }
  }
  // arcs
  for (let i = 0; i < n; i++) {
    const a1 = ang[i], a2 = i < n - 1 ? ang[i + 1] : end;
    const j = (i + 1) % n;
    const sA = a1 + dir * offAt(i, a1), eA = a2 - dir * offAt(j, a2);
    const [x1, y1] = pt(sA), [x2, y2] = pt(eA);
    const large = Math.abs(eA - sA) > 180 ? 1 : 0, sweep = dir > 0 ? 1 : 0;
    s += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large} ${sweep} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="3" marker-end="url(#ah-r-${p.id})"/>`;
    const m = (a1 + a2) / 2; const [mx, my] = pt(m);
    const ei = R0.arcEdge ? R0.arcEdge[i] : i;
    if (ei >= 0) s += `<circle cx="${mx}" cy="${my}" r="13" fill="var(--acc)"/><text x="${mx}" y="${my + 5}" text-anchor="middle" class="rnum">${ei + 1}</text>`;
    const an = (R0.ann || {})[i];
    if (an) {
      const [ax, ay] = pt(m, R + 50); const c = Math.cos(m * Math.PI / 180);
      const anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
      const y0 = ay - (an.length - 1) * 9 + 5;
      an.forEach(([t, txt], j) => { s += `<text x="${ax.toFixed(1)}" y="${(y0 + j * 18).toFixed(1)}" text-anchor="${anchor}" class="ran ran-${t}">${esc(txt)}</text>`; });
    }
  }
  // nodes
  R0.ring.forEach(([en, zh, w], i) => {
    const [x, y] = pt(ang[i]);
    const shown = hideNames ? '?' : en;
    const bw = bws[i], bh = BH;
    s += `<rect x="${(x - bw / 2).toFixed(1)}" y="${y - bh / 2}" width="${bw.toFixed(1)}" height="${bh}" rx="10" fill="var(--surface)" stroke="${colOf(w)}" stroke-width="2.5"/>`;
    s += `<text x="${x}" y="${hideNames ? y + 5 : y - 4}" text-anchor="middle" class="rn-en">${esc(shown)}</text>`;
    if (!hideNames) s += `<text x="${x}" y="${y + 15}" text-anchor="middle" class="rn-zh">${esc(zh)}</text>`;
  });
  s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="rc1">${esc(R0.center[0])}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" class="rc2">${esc(R0.center[1] || '')}</text>`;
  return s + `</svg>`;
}

/* ---------- 路徑流程（直式） ---------- */
function pool(p, kind) {
  const mine = kind === 'enz' ? p.edges.map(e => e.e) : p.nodes.slice(1);
  const uniq = [...new Set(mine)];
  const others = [...new Set(P.filter(q => q.cat === p.cat && q.id !== p.id).flatMap(q => kind === 'enz' ? q.edges.map(e => e.e) : q.nodes))].filter(x => !uniq.includes(x));
  const extra = shuffle(others).slice(0, Math.max(2, 7 - uniq.length));
  return shuffle(uniq.concat(extra));
}
function sel(opts, ans) {
  return `<select class="q" data-ans="${esc(ans)}"><option value="">— 選擇 —</option>` +
    opts.map(o => { const [en, zh] = sp(o); return `<option value="${esc(o)}">${esc(label(en, zh))}</option>`; }).join('') + `</select><span class="fb"></span>`;
}
function flowHTML(p) {
  const w = WH[p.id] || {}; const n = w.n;
  const multi = n && new Set(n).size > 1;
  const quiz = S.mode === 'quiz';
  const optE = quiz && S.blank === 'enz' ? pool(p, 'enz') : null;
  const optN = quiz && S.blank === 'met' ? pool(p, 'met') : null;
  let h = `<div class="flow">`;
  p.nodes.forEach((nd, i) => {
    const [en, zh] = sp(nd);
    const ci = multi ? codeInfo(n[i]) : null;
    const st = ci ? ` style="--nc:${ci.col}"` : '';
    const tag = ci ? `<span class="ntag" style="background:${ci.col}">${ci.zh}</span>` : '';
    if (optN && i > 0) h += `<div class="node q-node"${st}>${tag}${sel(optN, nd)}</div>`;
    else h += `<div class="node"${st}>${tag}<b>${esc(en)}</b>${S.lang !== 'en' && zh ? `<small>${esc(zh)}</small>` : ''}</div>`;
    if (i < p.edges.length) {
      const e = p.edges[i]; const [een, ezh] = sp(e.e);
      let cross = '';
      if (multi && n[i] !== n[i + 1]) { const a = codeInfo(n[i]), b = codeInfo(n[i + 1]); cross = `<div class="cross">⇢ 移動：<b style="color:${a.col}">${a.zh}</b> → <b style="color:${b.col}">${b.zh}</b></div>`; }
      const badges = (e.rl ? `<span class="bd bd-rl">限速 Rate-limiting</span>` : '') + (e.irr ? `<span class="bd bd-irr">不可逆</span>` : '');
      const enz = optE ? `<div class="enz q-enz">${sel(optE, e.e)}</div>` :
        `<div class="enz"><b>${esc(een)}</b>${S.lang !== 'en' && ezh ? `<small>${esc(ezh)}</small>` : ''}</div>`;
      h += `<div class="edge"><div class="arr"><span class="num">${i + 1}</span></div><div class="ebody">${cross}${enz}<div class="meta">${badges}${chips(e.c)}</div>${e.n ? `<div class="enote">${esc(e.n)}</div>` : ''}</div></div>`;
    }
  });
  if (p.loop) h += `<div class="loop">↻ ${esc(p.loop)}</div>`;
  return h + `</div>`;
}

    atp:[212,435,'ETC → ATP','電子傳遞鏈','etc'], chol:[362,435,'Cholesterol','膽固醇','cholesterol']
  };
  const E = [['glucose','glycogen','⇄','glycogenesis','carb'],['glucose','g6p','','glycolysis','carb'],['g6p','ppp','五碳糖','ppp','carb'],['ppp','nuc','核糖','purine-denovo','nuc'],
    ['g6p','pyr','糖解 ⇅ 糖質新生','glycolysis','carb'],['pyr','lac','Cori','cori','carb'],['pyr','acoa','PDH','pdh','carb'],['aa','pyr','碳骨架','carbon-skeleton','protein'],

    ['acoa','tca','','tca','carb'],['tca','atp','NADH・FADH₂','etc','carb'],['fa','tag','TAG 合成','tag-synthesis','lipid'],['aa','acoa','','carbon-skeleton','protein']];
  const hw = 54, hh = 18;
  const clip = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; const t = Math.min(dx ? hw / Math.abs(dx) : 9, dy ? hh / Math.abs(dy) : 9); return [x1 + dx * t, y1 + dy * t, x2 - dx * t, y2 - dy * t]; };
  let s = `<svg viewBox="0 0 424 470" class="hub" role="img" aria-label="代謝總地圖"><defs><marker id="ah-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
  for (const [a, b, l, go, cat] of E) {

    if (l) { const f = Math.abs(x1 - x2) > 5 && Math.abs(y1 - y2) > 5 ? 0.4 : 0.5; const mx = x1 + (x2 - x1) * f, my = y1 + (y2 - y1) * f; const vert = Math.abs(x1 - x2) < 5, diag = !vert && Math.abs(y1 - y2) > 5;
      s += `<text x="${vert ? mx + 6 : diag ? mx + 8 : mx}" y="${vert ? my + 4 : diag ? my - 6 : my - 5}" text-anchor="${vert || diag ? 'start' : 'middle'}" class="hl go" data-go="${go}">${l}</text>`; }
  }
  for (const [x, y, en, zh, go] of Object.values(N)) {

  }
  return s + `</svg>`;
}

function route() {
  let h = (location.hash || '#/').slice(2);
  if (!location.hash && /practice|quiz/.test(location.search)) h = 'practice';
  S.pr = false; if (typeof jStop === 'function') jStop();
  const jm = h.match(/^journey\/(\w+)(?:\/(\d+))?$/), fm = h.match(/^feedstate(?:\/(\w+))?$/);
  if (h === 'journey') renderJourneyHub();
  else if (jm && JOURNEYS[jm[1]]) renderJourney(jm[1], jm[2]);
  else if (fm) renderFeed(fm[1] || 'fed');
  else if (h === 'practice') renderPractice();
  else if (h.startsWith('q/') && byId[h.slice(2)] && byId[h.slice(2)].edges.length) { S.pr = true; S.mode = 'quiz'; renderPath(h.slice(2)); }
  else if (h.startsWith('cat/') && CATS[h.slice(4)]) renderCat(h.slice(4));
  else if (h.startsWith('ref/') && REFS[h.slice(4)]) renderRef(h.slice(4));
  else if (byId[h]) { renderPath(h); }
  else renderHome();
  markNav(); window.scrollTo(0, 0);
  document.body.classList.remove('navopen');
}
window.addEventListener('hashchange', () => { S.mode = 'learn'; route(); });
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#navlist li').forEach(li => { const a = li.querySelector('a'); li.style.display = !v || a.dataset.s.includes(v) ? '' : 'none'; });
});
$('#menu').onclick = () => document.body.classList.toggle('navopen');
buildNav(); route();

</script>
</body>
