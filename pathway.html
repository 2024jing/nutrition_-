<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圖解生化</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1f2a24; --muted: #5f6a63; --line: #e2e5df; --rail: #c9d2cb;
    --brand: #2f6b4f; --brand-soft: #e3efe8; --on-brand: #ffffff; --ok: #2e7d4f; --ok-soft: #e1f2e7;
    --bad: #b3261e; --bad-soft: #fbe5e3; --warm: #fff3d6; --chip: #eef0eb; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    --k6: #fbe9c6; --k6s: #b8791c; --k5: #dce9f7; --k5s: #3f73a8; --k4: #d4eeee; --k4s: #2c8088; --k3: #f9e0e6; --k3s: #b8506c; --k2: #e9e2f6; --k2s: #6f57ab;
    --e-atp: #c96f14; --e-nadh: #4558b8; --e-fad: #7a4fb0; --e-co2: #77817a; --on-tag: #ffffff; --hl: #fff1a8; --w-k: #a8560a; --w-d: #3c4fb0;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --rail: #3a443e; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --bad: #ff8a80; --bad-soft: #3a1f1d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark;
    --k6: #3b2e12; --k6s: #e0b878; --k5: #1b2b3c; --k5s: #9cb7d6; --k4: #16302f; --k4s: #7fc4c4; --k3: #3a1e27; --k3s: #e0a1b0; --k2: #2a2340; --k2s: #b9a8e6;
    --e-atp: #f0a44c; --e-nadh: #9aa8f0; --e-fad: #c3a2ee; --e-co2: #9aa49e; --on-tag: #14181a; --hl: #5a4d12; --w-k: #f0a44c; --w-d: #9aa8f0; } }
  :root[data-theme="dark"] {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --rail: #3a443e; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --bad: #ff8a80; --bad-soft: #3a1f1d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark;
    --k6: #3b2e12; --k6s: #e0b878; --k5: #1b2b3c; --k5s: #9cb7d6; --k4: #16302f; --k4s: #7fc4c4; --k3: #3a1e27; --k3s: #e0a1b0; --k2: #2a2340; --k2s: #b9a8e6;
    --e-atp: #f0a44c; --e-nadh: #9aa8f0; --e-fad: #c3a2ee; --e-co2: #9aa49e; --on-tag: #14181a; --hl: #5a4d12; --w-k: #f0a44c; --w-d: #9aa8f0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
  .hd { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; }
  .hd .tt { flex: 1; min-width: 0; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 4px 16px 40px; max-width: 720px; margin: 0 auto; }
  button, select { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); margin: 12px 0; overflow: hidden; }
  .pad { padding: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .card p { margin: 6px 0; }
  .card ul { margin: 6px 0; padding-left: 20px; } .card li { margin: 4px 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .xbtn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); flex: 0 0 auto; }
  .seg button { border: 0; background: transparent; padding: 6px 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--brand); color: var(--on-brand); }
  .btn { display: block; width: 100%; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); border-radius: 12px; padding: 13px 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn.plain { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .glab { font-size: 12px; font-weight: 700; color: var(--brand); margin: 18px 2px 6px; }
  .item { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; margin-top: 8px; cursor: pointer; }
  .item b { flex: 1; min-width: 0; font-size: 15px; } .item b span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .item i { font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .item[disabled] { opacity: .5; cursor: default; }
  .lv { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .lv::-webkit-scrollbar { display: none; }
  .lv button { flex: 0 0 auto; min-width: 38px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .lv button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .lv button.done:not(.on) { border-color: var(--ok); color: var(--ok); }
  /* 路徑圖：SVG 在下，空格疊在圖上 */
  .dia { position: relative; width: 100%; max-width: 420px; margin: 0 auto; }
  .dia svg { display: block; width: 100%; height: auto; }
  .dia .ln { stroke: var(--rail); } .dia .ar { fill: var(--muted); }
  .dia .pill { fill: var(--chip); stroke: var(--line); } .dia .src { fill: var(--brand-soft); stroke: var(--brand); }
  .dia text { fill: var(--ink); font-family: inherit; }
  .dia text.m { fill: var(--muted); } .dia text.b { fill: var(--brand); font-weight: 700; }
  .dia .num circle { fill: var(--card); stroke: var(--brand); } .dia .num text { fill: var(--brand); font-weight: 700; }
  .bk { position: absolute; transform: translate(-50%, -50%) scale(var(--s, .75)); transform-origin: center; }
  /* 空格：看得到的是 .face，真正的下拉選單透明地蓋在上面（字級 16px，iPhone 點選時畫面才不會自動放大） */
  .pick { position: relative; display: inline-flex; max-width: 100%; vertical-align: middle; }
  .pick select { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .pick select:disabled { cursor: default; }
  .face { position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 0; min-height: 40px; line-height: 1.25; padding: 4px 30px 4px 10px;
    border: 2px dashed var(--brand); border-radius: 10px; background: var(--card); color: var(--ink); }
  .face::after { content: ""; position: absolute; right: 11px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  .face b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; } .face small { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .pick.has .face { border-style: solid; background: var(--brand-soft); }
  .pick.ok .face { border: 2px solid var(--ok); background: var(--ok-soft); }
  .pick:focus-within .face { outline: 2px solid var(--brand); outline-offset: 2px; }
  .bk .pick { display: flex; width: 100%; height: 100%; }
  .bk .face { width: 100%; height: 100%; min-height: 0; padding: 0 6px; border-radius: 999px; align-items: center; text-align: center; white-space: nowrap; overflow: hidden; line-height: 1.2; }
  .bk .face::after { display: none; }
  .bk .face b, .bk .face small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .mk { position: absolute; right: -8px; top: -10px; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; font-size: 13px; font-weight: 700; font-style: normal; color: #fff; }
  .bk.ok .mk { display: grid; background: var(--ok); } .bk.no .mk { display: grid; background: var(--bad); }
  .st { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
  .st:first-of-type { border-top: 0; }
  .st .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--brand); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .st .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .st .w { grid-column: 2; min-width: 0; }
  .st.c { grid-template-columns: minmax(0, 1fr) auto; } .st.c .d { font-size: 15px; color: var(--ink); } .st.c .w { grid-column: auto; text-align: right; }
  .st:not(.c) .pick { display: flex; } .st:not(.c) .face { width: 100%; }
  .st .r, .cz .r { display: none; font-size: 12px; font-weight: 700; margin-top: 3px; }
  .st.ok .r, .cz li.ok .r { display: block; color: var(--ok); } .st.no .r, .cz li.no .r { display: block; color: var(--bad); }
  .cz { margin: 0; padding: 0; list-style: none; } .cz li { padding: 12px 0; border-top: 1px solid var(--line); line-height: 2; margin: 0; } .cz li:first-child { border-top: 0; }
  .cz .pick { margin: 3px 2px; } .cz .face { min-height: 36px; }
  .res { border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; font-size: 14px; }
  .res.ok { background: var(--ok-soft); } .res.bad { background: var(--bad-soft); } .res b { font-size: 15px; }
  .res.ok b { color: var(--ok); } .res.bad b { color: var(--bad); }
  .tip { background: var(--warm); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 12px; margin: 16px 2px; }
  .foot { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; }
  /* 顏色的意思：名稱框的底色＝碳數；小標籤＝這一步花掉或產生什麼；實心編號＝不可逆步驟 */
  .dia rect.k6 { fill: var(--k6); stroke: var(--k6s); } .dia rect.k5 { fill: var(--k5); stroke: var(--k5s); } .dia rect.k4 { fill: var(--k4); stroke: var(--k4s); }
  .dia rect.k3 { fill: var(--k3); stroke: var(--k3s); } .dia rect.k2 { fill: var(--k2); stroke: var(--k2s); }
  .dia .num.irr circle { fill: var(--brand); } .dia .num.irr text { fill: var(--on-brand); }
  .dia .tag rect { stroke-width: 1.2; } .dia .tag text { fill: var(--on-tag); font-weight: 700; }
  .dia .tag.atp rect { fill: var(--e-atp); stroke: var(--e-atp); } .dia .tag.nadh rect { fill: var(--e-nadh); stroke: var(--e-nadh); } .dia .tag.fad rect { fill: var(--e-fad); stroke: var(--e-fad); }
  .dia .tag.co2 rect { fill: var(--e-co2); stroke: var(--e-co2); } .dia .tag.sp rect { fill: var(--card); stroke: var(--e-atp); } .dia .tag.sp text { fill: var(--w-k); }
  .pick .face.k6 { background: var(--k6); } .pick .face.k5 { background: var(--k5); } .pick .face.k4 { background: var(--k4); } .pick .face.k3 { background: var(--k3); } .pick .face.k2 { background: var(--k2); }
  .pick:not(.ok):not(.no) .face.k6 { border-color: var(--k6s); } .pick:not(.ok):not(.no) .face.k5 { border-color: var(--k5s); } .pick:not(.ok):not(.no) .face.k4 { border-color: var(--k4s); }
  .pick:not(.ok):not(.no) .face.k3 { border-color: var(--k3s); } .pick:not(.ok):not(.no) .face.k2 { border-color: var(--k2s); }
  .pick.no .face { border: 2px solid var(--bad); background: var(--bad-soft); }
  .face.tk { box-shadow: inset 6px 0 0 var(--e-atp); padding-left: 16px; } .face.td { box-shadow: inset 6px 0 0 var(--e-nadh); padding-left: 16px; } .face.tf { box-shadow: inset 6px 0 0 var(--e-fad); padding-left: 16px; }
  .lgd { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .lgd span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lgd i { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; font-style: normal; font-size: 9px; font-weight: 700; }
  .lgd i.k6 { background: var(--k6); border-color: var(--k6s); } .lgd i.k5 { background: var(--k5); border-color: var(--k5s); } .lgd i.k4 { background: var(--k4); border-color: var(--k4s); }
  .lgd i.k3 { background: var(--k3); border-color: var(--k3s); } .lgd i.k2 { background: var(--k2); border-color: var(--k2s); }
  .lgd i.irr { border-radius: 50%; background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .lgd i.tk { background: var(--e-atp); border-color: var(--e-atp); } .lgd i.td { background: var(--e-nadh); border-color: var(--e-nadh); } .lgd i.tf { background: var(--e-fad); border-color: var(--e-fad); }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }
  .wk { color: var(--w-k); font-weight: 700; } .wd { color: var(--w-d); font-weight: 700; }
  .glab.k6 { color: var(--k6s); } .glab.k5 { color: var(--k5s); } .glab.k4 { color: var(--k4s); } .glab.k3 { color: var(--k3s); } .glab.k2 { color: var(--k2s); }
  .item.k6 { border-left: 5px solid var(--k6s); } .item.k5 { border-left: 5px solid var(--k5s); } .item.k4 { border-left: 5px solid var(--k4s); } .item.k3 { border-left: 5px solid var(--k3s); } .item.k2 { border-left: 5px solid var(--k2s); }
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="tt"><h1 id="title">圖解生化</h1><div class="sub" id="subtitle"></div></div>
    <div class="seg" id="lang" role="group" aria-label="名稱顯示的語言"><button type="button" data-l="zh">中</button><button type="button" data-l="bi">中英</button><button type="button" data-l="en">EN</button></div>
    <button type="button" class="xbtn" id="back" hidden>目錄</button>
  </div>
  <div class="lv" id="lv" hidden></div>
</header>
<main id="main"></main>

<script>
/* ======================================================================
   名稱的顯示：三種模式  zh 中文／bi 中英對照／en 英文
   每個名詞是 { zh, en, ab(縮寫，可省略), bi(中英對照時的特別寫法，可省略) }
   ====================================================================== */
var LANG = 'bi', FORCE = null;                       // FORCE：某一關固定用某種語言（總複習固定英文）
function M() { return FORCE || LANG; }
function T(zh, en) { return M() === 'en' ? en : zh; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fit(t, w, cap) { var n = 0; for (var i = 0; i < t.length; i++) n += t.charCodeAt(i) > 255 ? 1 : .56; return Math.max(6, Math.min(cap || 12.5, Math.floor((w - 12) / n * 10) / 10)); }
/* 一行的寫法（下拉選單的選項、句子裡的空格） */
function one(o, m, enFirst) {
  m = m || M(); var e = o.en || o.zh; if (m === 'zh' || e === o.zh) return o.zh;
  var E = o.ab ? e + ' (' + o.ab + ')' : e; if (m === 'en') return E;
  if (o.bi) return o.bi; return enFirst ? E + '　' + o.zh : o.zh + '（' + e + '）';
}
/* 兩行的寫法（圖上的名稱、酵素的空格）：英文在上、中文在下。w 是圖上的寬度，英文太長就改用縮寫 */
function two(o, m, w) {
  m = m || M(); var e = o.en || o.zh; if (m === 'zh' || e === o.zh) return [o.zh, ''];
  var ab = o.ab && w && fit(e, w, 12) < 8.5;
  if (m === 'en') return ab ? [o.ab, ''] : [e, o.ab || ''];
  return ab ? [o.ab, o.zh] : [e, o.zh + (o.ab ? '・' + o.ab : '')];
}
function short(o) { return M() === 'zh' ? o.zh : (o.ab || o.en || o.zh); }

/* ---------- 畫圖用的小工具 ---------- */
function PH() { return M() === 'zh' ? 30 : 38; }    // 圖上名稱框的高度：有兩行時高一點
function tx(x, y, t, cls, size, anchor) { return '<text class="' + (cls || '') + '" x="' + x + '" y="' + y + '" text-anchor="' + (anchor || 'middle') + '" font-size="' + (size || 12) + '">' + esc(t) + '</text>'; }
function pill(x, y, w, o, cls) {
  var L = typeof o === 'string' ? [o, ''] : two(o, null, w), h = PH();
  var r = '<rect class="' + (cls || 'pill') + '" x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '"/>';
  if (!L[1]) return r + tx(x, y + 4.5, L[0], '', fit(L[0], w, 12.5));
  return r + tx(x, y - 2, L[0], '', fit(L[0], w, 11.5)) + tx(x, y + 12, L[1], 'm', fit(L[1], w, 10));
}
function arrow(x1, y1, x2, y2, dash) { var a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; return '<line class="ln" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="3"' + (dash ? ' stroke-dasharray="3 3"' : '') + '/><polygon class="ar" points="-8,-6 5,0 -8,6" transform="translate(' + x2 + ',' + y2 + ') rotate(' + a + ')"/>'; }
function badge(x, y, n, irr) { return '<g class="num' + (irr ? ' irr' : '') + '"><circle cx="' + x + '" cy="' + y + '" r="11" stroke-width="1.5"/><text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle" font-size="12">' + n + '</text></g>'; }

function tagW(t) { return Math.round(t.length * 5.7 + 12); }
function tagC(x, y, t, k) { var w = tagW(t); return '<g class="tag ' + k + '"><rect x="' + (x - w / 2) + '" y="' + (y - 7.5) + '" width="' + w + '" height="15" rx="4"/><text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="9.5">' + esc(t) + '</text></g>'; }
/* 說明文字裡的記號：[[必背]]、{k:激酶這一類}、{d:去氫酶這一類} */
function fmt(s) { return s.replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>').replace(/\{k:(.+?)\}/g, '<span class="wk">$1</span>').replace(/\{d:(.+?)\}/g, '<span class="wd">$1</span>'); }

/* ======================================================================
   單元零：開始之前（生化代謝在學什麼、怎麼記英文）
   ====================================================================== */
var PRE = { id: 'pre', zh: '開始之前', en: 'Before you start', alias: '整張地圖・每條路徑問三件事・英文字根與縮寫', layout: 'none', nodes: [], steps: [], enz: {}, prod: {},
  dict: {
    glc: { zh: '葡萄糖', en: 'Glucose' }, fa: { zh: '脂肪酸', en: 'Fatty acids' }, aa: { zh: '胺基酸', en: 'Amino acids' }, lac: { zh: '乳酸', en: 'Lactate' }, ket: { zh: '酮體', en: 'Ketone bodies' },

  return '<b>' + esc(label(b, v)) + '</b>';
}
/* 空格的顏色：圖上的空格＝這個位置的碳數；圖下的空格＝選到的答案是哪一類（激酶與 ATP 橘色、去氫酶與 NADH 藍色、FADH₂ 紫色） */
function faceCls(b) {
  var v = ST.ans[b.id] || '', c = 'face';
  if (b.where === 'node' && b.c) c += ' k' + b.c;
  if (b.where === 'row' && v) { var e = b.src[v].en || ''; c += /kinase|ATP|GTP/.test(e) ? ' tk' : /dehydrogenase|NADH/.test(e) ? ' td' : /FADH/.test(e) ? ' tf' : ''; }
  return c;
}
function sel(b) {
  var v = ST.ans[b.id] || '';
  return '<span class="pick' + (v ? ' has' : '') + '"><span class="' + faceCls(b) + '">' + face(b) + '</span><select data-b="' + b.id + '" aria-label="空格"><option value="">' + (b.where === 'node' ? '？' : '請選擇') + '</option>' +
    b.opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(label(b, o)) + '</option>'; }).join('') + '</select></span>';
}

/* ---------- 一關的畫面 ---------- */
function level() {
  var U = CUR, L = U.levels[LV], n = U.levels.length; FORCE = L.force || null;
  if (!ST) ST = { blanks: buildBlanks(U, L), ans: {}, checked: false, shown: false };
  $('title').textContent = U.zh; $('subtitle').textContent = '第 ' + (LV + 1) + ' 關，共 ' + n + ' 關・' + L.t;
  $('back').hidden = false; seg();
  $('lv').hidden = false; $('lv').innerHTML = U.levels.map(function (_, i) { var d = isDone(U.id, i); return '<button type="button" data-i="' + i + '" class="' + (i === LV ? 'on' : '') + (d ? ' done' : '') + '" aria-label="第 ' + (i + 1) + ' 關' + (d ? '（已完成）' : '') + '">' + (i + 1) + (d ? ' ✓' : '') + '</button>'; }).join('');
  $('lv').querySelectorAll('button').forEach(function (b) { b.onclick = function () { open(U, +b.getAttribute('data-i')); }; });
  var on = $('lv').querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });

  var h = '<div class="card pad"><h2>' + esc(L.t) + '</h2>' + L.intro.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') + (L.tip ? '<div class="tip">' + fmt(esc(L.tip)) + '</div>' : '') + '</div>';
  var by = function (w) { return ST.blanks.filter(function (b) { return b.where === w; }); }, nodes = by('node'), rows = by('row'), cnt = by('count');
  var passed = ST.checked && !ST.shown && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; });
  var E = L.energy || (L.rows === 'prod' && (ST.shown || passed)) ? 'all' : L.carbon ? 'co2' : '';      // 算帳那一關：全對或看答案後，圖上才出現能量標籤
  var lg = (L.legend || (L.kind === 'map' && !L.plain ? U.nodes.map(function (n) { return n.c; }).concat(U.layout === 'cycle' ? [2] : []).filter(function (c, i, a) { return c && a.indexOf(c) === i; }).sort(function (a, b) { return b - a; }) : []))
    .map(function (c) { return '<span><i class="k' + c + '"></i>' + c + ' 碳</span>'; });
  if (L.kind === 'map' && L.rows && U.steps.some(function (s) { return s.irr; })) lg.push('<span><i class="irr">1</i>實心編號＝不可逆步驟</span>');
  if (L.kind !== 'cloze') { var H = L.kind === 'ov' ? L.h : mapH(U), fh = Math.round(PH() / .75);
    h += '<div class="card pad"><div class="dia" id="dia"><svg viewBox="0 0 360 ' + H + '" role="img" aria-label="' + esc(U.zh) + '路徑圖">' + (L.kind === 'ov' ? L.svg() : mapSvg(U, L, E)) + '</svg>' +
      nodes.map(function (b) { return '<span class="bk" data-k="' + b.id + '" style="left:' + (b.x / 360 * 100) + '%;top:' + (b.y / H * 100) + '%"><span style="display:block;width:' + Math.round(b.w / .75) + 'px;height:' + fh + 'px">' + sel(b) + '</span><i class="mk"></i></span>'; }).join('') + '</div>' +
      (lg.length ? '<div class="lgd">' + (L.kind === 'ov' || !L.plain ? '<span>底色＝碳數</span>' : '') + lg.join('') + '</div>' : '') + (nodes.length ? '<div class="small muted" style="text-align:center;margin-top:6px">點虛線框選答案</div>' : '') + '</div>'; }
  if (rows.length) h += '<div class="card pad"><h2>' + esc(L.rowsTitle || '') + '</h2><div class="lgd" style="justify-content:flex-start;margin:0 0 4px">' + (L.rows === 'enz' ? '<span><i class="tk"></i>激酶 kinase</span><span><i class="td"></i>去氫酶 dehydrogenase</span>' : '<span><i class="tk"></i>ATP、GTP</span><span><i class="td"></i>NADH</span>' + (U.prod.fad ? '<span><i class="tf"></i>FADH₂</span>' : '')) + '</div>' + rows.map(function (b) { var s = U.steps[b.step];
    return '<div class="st" data-k="' + b.id + '"><span class="n">' + (b.step + 1) + '</span><span class="d">' + esc(short(U.map[s.f])) + ' → ' + esc(short(U.map[s.t])) + (s.also ? ' ＋ ' + esc(short(U.map[s.also])) : '') + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (cnt.length) h += '<div class="card pad"><h2>' + esc(L.countsTitle || '') + '</h2>' + cnt.map(function (b) {
    return '<div class="st c" data-k="' + b.id + '"><span class="d">' + esc(b.label) + '</span><span class="w">' + sel(b) + '<div class="r"></div></span></div>'; }).join('') + '</div>';
  if (L.kind === 'cloze') { var zb = by('cloze'); h += '<div class="card pad"><ol class="cz">' + L.cloze.map(function (row, i) {
    return '<li data-k="z' + i + '">' + row.map(function (x) { return typeof x === 'string' ? (x === '。' ? '' : esc(x)) : sel(zb[i]); }).join('') + '<div class="r"></div></li>'; }).join('') + '</ol></div>'; }
  h += '<div id="res"></div><div class="foot"><div class="row" id="acts"></div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.pick select').forEach(function (el) { el.onchange = function () {
    var id = el.getAttribute('data-b'), b = ST.blanks.filter(function (x) { return x.id === id; })[0];
    ST.ans[id] = el.value; el.parentNode.classList.toggle('has', !!el.value); var fe = el.parentNode.querySelector('.face'); fe.className = faceCls(b); fe.innerHTML = face(b);
    if (ST.checked) { ST.checked = false; clearMarks(); acts(); }
  }; });
  if (ST.shown) document.querySelectorAll('.pick select').forEach(function (el) { el.disabled = true; });
  scaleDia(); if (ST.checked) mark(); acts();
}
function scaleDia() { var d = $('dia'); if (d) d.style.setProperty('--s', (d.clientWidth / 360 * .75).toFixed(3)); }
window.addEventListener('resize', scaleDia);
function holder(b) { return document.querySelector('[data-k="' + b.id + '"]'); }
function clearMarks() {
  document.querySelectorAll('.pick').forEach(function (el) { el.classList.remove('ok', 'no'); });
  document.querySelectorAll('[data-k]').forEach(function (el) { el.classList.remove('ok', 'no'); var r = el.querySelector('.r'); if (r) r.textContent = ''; var m = el.querySelector('.mk'); if (m) m.textContent = ''; });
  $('res').innerHTML = '';
}
function mark() {
  var right = 0, total = ST.blanks.length, L = CUR.levels[LV];
  ST.blanks.forEach(function (b) {
    var v = ST.ans[b.id] || '', ok = v === b.ans, el = holder(b), s = el.querySelector('.pick');
    if (ok) right++;
    s.classList.remove('ok', 'no'); el.classList.remove('ok', 'no'); s.classList.add(ok ? 'ok' : 'no'); el.classList.add(ok ? 'ok' : 'no');
    var m = el.querySelector('.mk'); if (m) m.textContent = ok ? '✓' : '✕';
    var o = b.src && b.src[b.ans], zh = o && (b.lang || M()) === 'en' && o.zh !== (o.en || o.zh) ? o.zh : '';      // 用英文作答的空格，答對後補上中文
    var r = el.querySelector('.r'); if (r) r.textContent = ok ? '✓ 正確' + (zh ? '：' + zh : '') : (v ? '✕ 再想想' : '✕ 還沒填');
  });
  var all = right === total, last = LV === CUR.levels.length - 1;
  if (all && !ST.shown) { if (!SAVE.done[CUR.id]) SAVE.done[CUR.id] = {}; SAVE.done[CUR.id][LV] = 1; save(); var c = $('lv').querySelectorAll('button')[LV]; c.classList.add('done'); if (c.textContent.indexOf('✓') < 0) c.textContent += ' ✓'; }
  $('res').innerHTML = '<div class="res ' + (all ? 'ok' : 'bad') + '"><b>' + (ST.shown ? '這是正確答案' : all ? '全對！' : '答對 ' + right + ' ／ ' + total) + '</b>　' +
    (ST.shown ? '看熟之後按「重來」，自己再填一次才算過關。' : all ? (last ? '這個單元完成了。' : '可以進下一關了。') : '紅色的空格再改一次，改完再按「對答案」。') + '</div>' +
    (all && !ST.shown && L.done ? '<div class="card pad"><h2>記住這幾件事</h2><ul>' + L.done.map(function (t) { return '<li>' + fmt(esc(t)) + '</li>'; }).join('') + '</ul></div>' : '');
  return all;
}
function acts() {
  var last = LV === CUR.levels.length - 1, all = ST.checked && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; }) && !ST.shown, h = '';
  if (all) h = '<button type="button" class="btn plain" id="redo">重來</button><button type="button" class="btn" id="next">' + (last ? '回目錄' : '下一關') + '</button>';
  else if (ST.checked) h = '<button type="button" class="btn plain" id="' + (ST.shown ? 'redo' : 'show') + '">' + (ST.shown ? '重來' : '看正確答案') + '</button><button type="button" class="btn" id="chk"' + (ST.shown ? ' disabled' : '') + '>對答案</button>';
  else h = '<button type="button" class="btn" id="chk">對答案</button>';
  $('acts').innerHTML = h;
  if ($('chk')) $('chk').onclick = function () { ST.checked = true; var L = CUR.levels[LV]; if (L.rows === 'prod' && ST.blanks.every(function (b) { return ST.ans[b.id] === b.ans; })) level(); else { mark(); acts(); } var r = $('res'); if (r.scrollIntoView) r.scrollIntoView({ block: 'nearest' }); };
  if ($('show')) $('show').onclick = function () { ST.shown = true; ST.blanks.forEach(function (b) { ST.ans[b.id] = b.ans; }); level(); };
  if ($('redo')) $('redo').onclick = function () { ST = null; level(); window.scrollTo(0, 0); };
  if ($('next')) $('next').onclick = function () { if (last) home(); else open(CUR, LV + 1); };
}

$('back').onclick = home;
$('lang').querySelectorAll('button').forEach(function (b) { b.onclick = function () { LANG = b.getAttribute('data-l'); SAVE.lang = LANG; save(); if (CUR) { var y = window.pageYOffset; level(); window.scrollTo(0, y); } else home(); }; });
(function () { var m = (location.search.match(/[?&]p=([a-z]+)/) || [])[1]; if (m && UNITS[m]) open(UNITS[m], firstTodo(UNITS[m])); else home(); })();
</script>
</body>
</html>
