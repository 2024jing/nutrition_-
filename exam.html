,"p":"113-2-4102","n":8,"q":"下列何種食物的生物價（BV）是100，且蛋白質含量最高？","o":["小麥","牛奶","白米","蛋白"],"a":"D","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"生物價","ex":"雞蛋的生物價最高（約 94～100），常作為參考蛋白。蛋白（蛋清）幾乎全是蛋白質，含量比牛奶、穀類高很多。"},{"id":"113-2-4102-9","p":"113-2-4102","n":9,"q":"有關蛋白質消化吸收的敘述，下列何者錯誤？","o":["蛋白質的消化始於胃，胃蛋白酶可將蛋白質分解成較短的胜肽","食糜進入小腸會刺激胰臟分泌胰蛋白酶，將蛋白質分解成短胜肽和胺基酸","在腸道被分解的胺基酸會以滲透、擴散的方式進入小腸細胞","在嬰兒期的早期，有些未經分解的蛋白質可進入腸道細胞"],"a":"C","c":"營養學","c2":"人體生理學與實驗","ch":"蛋白質","ch2":"消化","t":"蛋白質的消化吸收","ex":"游離胺基酸主要經小腸刷狀緣依賴鈉的主動運輸（次級主動運輸）進入細胞，雙胜肽與三胜肽則經 PepT1 與氫離子共同運輸，不是靠滲透或擴散。新生兒早期腸道可吸收完整蛋白質（如母乳抗體）。"},{"id":"113-2-4102-10","p":"113-2-4102","n":10,"q":"下列何者不是蛋白質在體內的主要功能？","o":["提供能量","參與免疫反應","維持體液平衡","支撐細胞和組織結構"],"a":"A","c":"營養學","c2":"","ch":"蛋白質","ch2":"","t":"蛋白質的功能","ex":"蛋白質的主要功能是構成組織、酵素與激素、抗體、運輸蛋白，並維持體液與酸鹼平衡。雖然每公克可提供 4 大卡，但在熱量足夠時，提供能量不是它的主要功能。"},{"id":"113-2-4102-11","p":"113-2-4102","n":11,"q":"根據衛生福利部對國人膳食營養素參考攝取量（DRIs）第八版的建議，哺乳期間每日的蛋白質攝取量應比未懷孕前多增加幾公克？","o":["10公克","15公克","20公克","25公克"],"a":"B","c":"營養學","c2":"生命期營養","ch":"蛋白質","ch2":"懷孕與哺乳期","t":"哺乳期的蛋白質建議量","ex":"國人 DRIs 第八版哺乳期每日蛋白質建議比孕前增加 15 公克。"},{"id":"113-2-4102-12","p":"113-2-4102","n":12,"q":"下列何種胺基酸在體內會合成黑色素（melanin）？","o":["色胺酸（tryptophan）","麩胺酸（glutamate）","脯胺酸（proline）","酪胺酸（tyrosine）"],"a":"D","c":"營養學","c2":"生物化學（二）","ch":"蛋白質","ch2":"胺基酸與蛋白質代謝","t":"黑色素的前驅物","ex":"酪胺酸經酪胺酸酶氧化成多巴，再形成黑色素；酪胺酸也是多巴胺、正腎上腺素、腎上腺素與甲狀腺素的前驅物。"},{"id":"113-2-4102-13","p":"113-2-4102","n":13,"q":"下列何者含較多短鏈脂肪酸？","o":["葵花油","奶油","氫化油","花生油"],"a":"B","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"含短鏈脂肪酸的油脂","ex":"乳脂肪（奶油）含丁酸等短鏈脂肪酸，是飲食中少數的短鏈脂肪酸來源。植物油以長鏈脂肪酸為主。"},{"id":"113-2-4102-14","p":"113-2-4102","n":14,"q":"一般而言，健康成年人空腹12～14小時後，下列何種脂蛋白不存在於血液中？","o":["Chylomicrons","VLDL","LDL","HDL"],"a":"A","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"空腹時的脂蛋白","ex":"乳糜微粒在進食後由小腸產生，半衰期很短，健康人空腹 12～14 小時後血中就清除了。若空腹仍有乳糜微粒，表示代謝異常。"},{"id":"113-2-4102-15","p":"113-2-4102","n":15,"q":"下列有關脂質的敘述，何者錯誤？","o":["人體可以利用脂質製造賀爾蒙","體內的脂肪可以保護器官免於傷害","可協助維生素A、C、D、E的吸收","脂肪（fat）在室溫下是固體的脂質，油（oil）則是液體的脂質"],"a":"C","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"脂質的功能","ex":"脂質協助脂溶性維生素 A、D、E、K 的吸收；維生素 C 是水溶性。脂質也是類固醇激素的原料、保護器官；室溫下固態稱脂、液態稱油。"},{"id":"113-2-4102-16","p":"113-2-4102","n":16,"q":"下列何項飲食習慣的改變，無助於降低低密度脂蛋白？","o":["儘量少吃人造奶油","保持多元不飽和脂肪酸低於10%總熱量","每日攝取2公克以上植物固醇","每日攝取椰子油達10%總熱量"],"a":"D","c":"營養學","c2":"膳食療養","ch":"脂質","ch2":"第4章 高血壓、高脂血症及心臟疾病","t":"降低 LDL 的飲食","ex":"椰子油含大量飽和脂肪酸（月桂酸、肉豆蔻酸），會升高 LDL 膽固醇。減少人造奶油（反式脂肪）、補充每天 2 公克植物固醇都有助降低 LDL。"},{"id":"113-2-4102-17","p":"113-2-4102","n":17,"q":"在人體代謝中，下列何者不是以膽固醇為先質（precursor）所合成之物質？","o":["cortisone","phytosterol","estradiol","cholecalciferol"],"a":"B","c":"營養學","c2":"生物化學（二）","ch":"脂質","ch2":"脂質代謝","t":"由膽固醇衍生的物質","ex":"可體松、雌二醇是類固醇激素，膽鈣化醇（維生素 D3）由皮膚的 7-去氫膽固醇生成，都來自膽固醇。植物固醇是植物自己合成的，人體不會由膽固醇製造。"},{"id":"113-2-4102-18","p":"113-2-4102","n":18,"q":"小華整天沒吃東西，只喝了一杯全糖的綠茶手搖飲。喝完數小時後，血液中三酸甘油酯暫時升高的原因為何？","o":["乳糜微粒（chylomicron）升高","極低密度脂蛋白（VLDL）升高","低密度脂蛋白（LDL）升高","游離脂肪酸升高"],"a":"B","c":"營養學","c2":"","ch":"脂質","ch2":"","t":"高糖飲料與血中三酸甘油酯","ex":"只喝含糖飲料、沒有吃油脂，所以不是乳糜微粒升高。大量蔗糖（尤其果糖）在肝臟轉成脂肪酸與三酸甘油酯，以 VLDL 送入血液，使血中三酸甘油酯暫時升高。"},{"id":"113-2-4102-19","p":"113-2-4102","n":19,"q":"臨床上，當RQ＜0.7時，表示人體可能處於何種狀態？","o":["酸中毒","攝取高碳水化合物飲食","竭力運動後","飢餓狀態"],"a":"D","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"呼吸商","ex":"醣類的呼吸商是 1.0，脂肪約 0.7，蛋白質約 0.8。呼吸商低於 0.7 表示以脂肪氧化為主並產生酮體，常見於飢餓或極低醣飲食。高醣飲食或脂肪新生時呼吸商會大於 1。"},{"id":"113-2-4102-20","p":"113-2-4102","n":20,"q":"調控人體飢餓與飽食的中樞，位於腦部的那一個區域？","o":["大腦皮質","海馬迴","杏仁核","下視丘"],"a":"D","c":"營養學","c2":"人體生理學與實驗","ch":"能量代謝與體重","ch2":"內分泌與生殖","t":"飢餓與飽食中樞","ex":"下視丘外側區是攝食中樞，腹內側核是飽食中樞，弓狀核整合瘦素、飢餓素與胰島素等訊號，調控飢餓與飽足。"},{"id":"113-2-4102-21","p":"113-2-4102","n":21,"q":"王先生今年28歲，體重75公斤，超出正常體重範圍6公斤，他打算以60天的時間將體重控制在正常範圍內，則減少1公斤的體重約需消耗多少大卡的熱量？","o":["9,000","7,700","6,700","4,500"],"a":"B","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"減少 1 公斤體重的熱量","ex":"體脂肪組織約含 85% 脂肪，每公斤約 7,700 大卡，所以減重 1 公斤約需負平衡 7,700 大卡。"},{"id":"113-2-4102-22","p":"113-2-4102","n":22,"q":"承上題，經營養師指導，王先生每天飲食減少500大卡，並加上慢跑運動（消耗熱量：0.134大卡／公斤／分鐘），理論上王先生每天需要至少慢跑多少分鐘，才能在60天後將體重減至正常範圍內？","o":["27","35","54","40"],"a":"A","c":"營養學","c2":"","ch":"能量代謝與體重","ch2":"","t":"減重計畫的運動時間","ex":"6 公斤 × 7,700 ＝ 46,200 大卡，÷ 60 天 ≈ 770 大卡／天。飲食已減 500 大卡，運動要消耗 270 大卡。慢跑每分鐘消耗 0.134 × 75 ≈ 10 大卡，270 ÷ 10 ≈ 27 分鐘。"},{"id":"113-2-4102-23","p":"113-2-4102","n":23,"q":"下列何者不是人體中維生素C高保留量（retention）的組織器官？","o":["腦下垂體","腎上腺","唾液腺","大腦"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 C 濃度高的組織","ex":"維生素 C 在腦下垂體、腎上腺、眼球水晶體、白血球與腦部的濃度最高，與合成激素、神經傳遞物有關。唾液腺不是高保留的組織。"},{"id":"113-2-4102-24","p":"113-2-4102","n":24,"q":"由色胺酸（tryptophan）合成15毫克的菸鹼素時，需要代謝多少克的蛋白質？","o":["60","90","120","150"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"色胺酸轉成菸鹼素","ex":"約 60 毫克色胺酸可轉成 1 毫克菸鹼素，15 毫克菸鹼素需要 900 毫克色胺酸。蛋白質約含 1% 色胺酸，所以約需 90 公克蛋白質。"},{"id":"113-2-4102-25","p":"113-2-4102","n":25,"q":"有關vitamin B12缺乏的臨床症狀，下列何者錯誤？","o":["巨球性貧血","惡性貧血","神經髓鞘病變","溶血性貧血"],"a":"D","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"維生素 B12 缺乏的症狀","ex":"B12 缺乏會造成巨球性貧血（內在因子缺乏時稱惡性貧血）與神經髓鞘病變。溶血性貧血多見於維生素 E 缺乏（早產兒）或 G6PD 缺乏，不是 B12 缺乏的症狀。"},{"id":"113-2-4102-26","p":"113-2-4102","n":26,"q":"有關膽素生化功能的敘述，下列何者錯誤？","o":["為卵磷脂（lecithin）主要成分，參與神經髓鞘合成","為血清素（serotonin）主要成分，參與神經傳導物質合成","參與甜菜鹼（betaine）合成，提供甲基進行單碳代謝反應","為驅脂因子（lipotropic factor），缺乏膽素導致脂肪肝"],"a":"B","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"膽鹼的功能","ex":"膽鹼是卵磷脂與鞘磷脂的成分，可合成乙醯膽鹼；可氧化成甜菜鹼提供甲基；是抗脂肪肝因子。血清素由色胺酸合成，和膽鹼無關。"},{"id":"113-2-4102-27","p":"113-2-4102","n":27,"q":"楊姓婦人因頭暈目眩，身體平衡機制不好，醫師診斷為內耳不平衡，下列何種維生素具有減輕病症的作用？","o":["vitamin E","folic acid","niacin","ascorbic acid"],"a":"C","c":"營養學","c2":"","ch":"維生素（水溶性）","ch2":"","t":"菸鹼酸與內耳眩暈","ex":"依標準答案，菸鹼酸可擴張血管、改善內耳的微循環，臨床上曾用於減輕內耳性眩暈。"},{"id":"113-2-4102-28","p":"113-2-4102","n":28,"q":"孕婦飲食若缺乏深綠色蔬菜，會缺乏下列何種維生素，導致胎兒neural tube defect（NTD）？","o":["cobalamin","thiamin","choline","folate"],"a":"D","c":"營養學","c2":"生命期營養","ch":"維生素（水溶性）","ch2":"懷孕與哺乳期","t":"葉酸與神經管缺陷","ex":"葉酸（folate 的名稱來自葉子）在深綠色蔬菜中含量豐富。孕前與懷孕初期葉酸不足，會增加胎兒神經管缺陷的風險。"},{"id":"113-2-4102-29","p":"113-2-4102","n":29,"q":"下列何者過量攝取時較無安全性疑慮？","o":["retinoids","cholecalciferol","phylloquinones","niacin"],"a":"C","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"過量攝取的安全性","ex":"維生素 K1（葉綠醌）即使大量攝取也沒有已知毒性，所以沒有訂定上限攝取量。維生素 A、D 過量會中毒；菸鹼酸過量會臉潮紅與肝損傷。"},{"id":"113-2-4102-30","p":"113-2-4102","n":30,"q":"下列何者最不會是因缺乏維生素K造成的新生兒出血症？","o":["母乳中維生素K含量過低","新生兒體內維生素K儲存量低","腸道沒有生成維生素K的微生物","因carboxylated凝血因子無法有效率與Na結合"],"a":"D","c":"營養學","c2":"生命期營養","ch":"維生素（脂溶性）","ch2":"嬰兒期","t":"新生兒維生素 K 缺乏出血","ex":"新生兒出血症的原因是母乳維生素 K 低、維生素 K 不易通過胎盤使嬰兒儲存少、腸道菌叢尚未建立。維生素 K 使凝血因子 γ-羧化，羧化後的凝血因子是與「鈣離子」結合，不是鈉。"},{"id":"113-2-4102-31","p":"113-2-4102","n":31,"q":"下列何者為可運送維生素A至周邊組織的載體？","o":["ceruloplasmin","high density lipoprotein","retinol-binding protein (RBP)","transferrin"],"a":"C","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"維生素 A 的運輸","ex":"肝臟儲存的視網醇與視網醇結合蛋白（RBP）結合，再與運甲狀腺素蛋白形成複合物，運送到周邊組織。藍胞漿素運送銅，運鐵蛋白運送鐵。"},{"id":"113-2-4102-32","p":"113-2-4102","n":32,"q":"膳食維生素D於腸道消化吸收後，利用下列何種物質運輸至肝臟？","o":["血清蛋白","運鐵蛋白","游離膽固醇","乳糜微粒"],"a":"D","c":"營養學","c2":"","ch":"維生素（脂溶性）","ch2":"","t":"飲食維生素 D 的運輸","ex":"飲食的維生素 D 與脂質一起形成微膠粒吸收，包進乳糜微粒，經淋巴進入循環，再隨乳糜微粒殘粒送到肝臟。皮膚合成的維生素 D 則由維生素 D 結合蛋白運送。"},{"id":"113-2-4102-33","p":"113-2-4102","n":33,"q":"健康人因流汗或出血而流失體液時，下列那些礦物質的流失量最大？","o":["potassium及phosphate","calcium及magnesium","sodium及chloride","bicarbonate及sulfate"],"a":"C","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"汗液與血液中的主要電解質","ex":"汗液與細胞外液（血液）的主要陽離子是鈉、陰離子是氯，所以流汗或出血時鈉與氯的流失最多。鉀與磷主要在細胞內。"},{"id":"113-2-4102-34","p":"113-2-4102","n":34,"q":"下列何者有助於體內碳酸（H2CO3）的生成？","o":["angiotensinogen","angiotensin","carbonic anhydrase","renin"],"a":"C","c":"營養學","c2":"人體生理學與實驗","ch":"水","ch2":"腎臟與體液","t":"碳酸的生成","ex":"碳酸酐酶催化二氧化碳與水結合成碳酸，再解離為氫離子與碳酸氫根，在紅血球、腎小管與胃壁細胞中都很重要。"},{"id":"113-2-4102-35","p":"113-2-4102","n":35,"q":"人體喝入的水分，大部分在胃腸道的那一個部位被吸收？","o":["duodenum","jejunum and ileum","ascending colon","transverse colon"],"a":"B","c":"營養學","c2":"人體生理學與實驗","ch":"水","ch2":"消化","t":"水分的吸收部位","ex":"每天進入腸道的水（飲食加消化液）大部分在小腸（空腸與迴腸）吸收，大腸吸收剩餘的一小部分。"},{"id":"113-2-4102-36","p":"113-2-4102","n":36,"q":"有關攝取鉀有助於維持正常血壓的原因，下列何者正確？","o":["高鉀攝取可抑制小腸對鈉離子的吸收","高鉀攝取可減少血液滲透壓","高鉀攝取可減輕過度換氣造成的鹼中毒","高鉀攝取可抑制renin-angiotensin system"],"a":"D","c":"營養學","c2":"膳食療養","ch":"礦物質（巨量）","ch2":"第4章 高血壓、高脂血症及心臟疾病","t":"鉀與血壓","ex":"高鉀攝取增加腎臟排鈉、使血管舒張，並抑制腎素－血管張力素系統，有助於降低血壓。"},{"id":"113-2-4102-37","p":"113-2-4102","n":37,"q":"下列那一種礦物質可加強胰島素的作用，進而調節血糖？","o":["selenium","silicon","chromium","zinc"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鉻與胰島素","ex":"鉻是「葡萄糖耐受因子」的成分，可增強胰島素與受體結合後的作用，幫助血糖調節。"},{"id":"113-2-4102-38","p":"113-2-4102","n":38,"q":"下列有關礦物質的敘述，何者正確？","o":["成年人每日鈣的足夠攝取量為2,500 mg","鈣離子可藉由攜鈣素的作用來控制細胞的代謝","女性停經後雌激素分泌減少，與骨質流失無關","當血鈣降低時，甲狀腺會分泌甲狀腺素，刺激骨骼釋出鈣"],"a":"B","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"鈣的功能與調節","ex":"鈣離子與攜鈣素結合，作為第二傳訊者調控酵素與細胞代謝。成人鈣的足夠攝取量是 1,000 毫克（2,500 毫克是上限）；停經後雌激素下降會加速骨質流失；血鈣低時是副甲狀腺分泌副甲狀腺素。"},{"id":"113-2-4102-39","p":"113-2-4102","n":39,"q":"下列有關磷缺乏的敘述，何者錯誤？","o":["缺磷的症狀包含厭食症","長期缺磷會導致牙齒生長不良","飲食攝取不足的老人容易有缺磷的狀況","天天服用制酸劑的人不會有缺磷的問題"],"a":"D","c":"營養學","c2":"","ch":"礦物質（巨量）","ch2":"","t":"磷缺乏","ex":"含鋁或鎂的制酸劑會與磷結合，降低磷的吸收，長期大量服用反而容易缺磷。缺磷症狀包括厭食、肌肉無力、骨骼與牙齒發育不良；攝取不足的老人也可能缺乏。"},{"id":"113-2-4102-40","p":"113-2-4102","n":40,"q":"下列那種人最容易有iron deficiency anemia？","o":["育齡期婦女","懷孕婦女","青少年","成年男性"],"a":"B","c":"營養學","c2":"生命期營養","ch":"礦物質（微量）","ch2":"懷孕與哺乳期","t":"缺鐵性貧血的高危險群","ex":"懷孕時血量增加、胎兒與胎盤需要鐵，需要量大增（第三期 DRIs 增加 30 毫克），是缺鐵性貧血最高風險的族群。"},{"id":"113-2-4102-41","p":"113-2-4102","n":41,"q":"下列何者與fluorosis較無相關？","o":["飲用水含氟量過高","兒童長期吞入含氟牙膏","造成兒童斑齒（mottled teeth）","鈣質及維生素D攝取不足"],"a":"D","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"氟中毒","ex":"氟中毒（斑齒）是兒童牙齒發育期攝取過多的氟，例如飲用水含氟過高或吞下含氟牙膏。鈣與維生素 D 不足和氟中毒無關。"},{"id":"113-2-4102-42","p":"113-2-4102","n":42,"q":"Cobalt與下列何種營養素有關？","o":["vitamin B12","vitamin B2","vitamin B1","vitamin B6"],"a":"A","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"鈷","ex":"鈷是維生素 B12（鈷胺素）結構中心的金屬，人體需要的鈷都以 B12 的形式取得。"},{"id":"113-2-4102-43","p":"113-2-4102","n":43,"q":"有關嬰幼兒發生蛀牙的主要原因，下列何者錯誤？","o":["口含奶瓶入睡","吃過多甜食","刷牙技巧不熟練","缺乏維生素D"],"a":"D","c":"營養學","c2":"生命期營養","ch":"礦物質（微量）","ch2":"嬰兒期","t":"嬰幼兒齲齒的原因","ex":"奶瓶性齲齒的主因是含著奶瓶入睡、常吃甜食、口腔清潔不足，使細菌發酵醣類產酸侵蝕牙齒。維生素 D 缺乏影響骨骼發育，不是蛀牙的主要原因。"},{"id":"113-2-4102-44","p":"113-2-4102","n":44,"q":"有關年長者欲降低血液中homocysteine時，所需補充的營養素，下列何者錯誤？","o":["維生素B6","維生素B1","葉酸","維生素B12"],"a":"B","c":"營養學","c2":"生命期營養","ch":"維生素（水溶性）","ch2":"老年期","t":"降低同半胱胺酸的營養素","ex":"同半胱胺酸再甲基化需要葉酸與 B12，轉硫途徑需要 B6。維生素 B1 不參與同半胱胺酸代謝。"},{"id":"113-2-4102-45","p":"113-2-4102","n":45,"q":"下列食物組合，何者含有的鐵質總量最多？","o":["1盤甜豌豆莢（100 g）+1份滷牛腱（35 g）+1碗牡蠣湯（35 g）","1盤萵苣（100 g）+1份鱈魚（55 g）+1碗牡蠣湯（35 g）","1盤紅莧菜（100 g）+1個荷包蛋（55 g）+1盤炒豬肝（30 g）","1盤紅鳳菜（100 g）+1片豆腐皮（30 g）+1盤炒豬肝（30 g）"],"a":"C","c":"營養學","c2":"","ch":"礦物質（微量）","ch2":"","t":"食物的鐵含量","ex":"依標準答案，C 組合鐵最多：紅莧菜是鐵含量高的蔬菜，豬肝的鐵含量非常高。"},{"id":"113-2-4102-46","p":"113-2-4102","n":46,"q":"有關嬰兒添加副食品的敘述，下列何者錯誤？","o":["開始添加副食品時，以穀類食品為主","添加新的副食品時，一次只能添加一種","4個月大嬰兒因為澱粉酵素的活性尚不成熟，因此不建議添加米粉類的副食品","4個月大嬰兒體重若已經達出生時的2倍重，可以考慮開始添加副食品"],"a":"C","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"嬰兒副食品的添加","ex":"約 4～6 個月開始添加副食品，通常從米粉、麥粉等穀類開始；一次添加一種新食物，觀察有無過敏；體重達出生時兩倍是可以開始的指標之一。4 個月大嬰兒已經可以消化米粉，C 錯。"},{"id":"113-2-4102-47","p":"113-2-4102","n":47,"q":"嬰兒的生長及發育受到先天基因調控及後天環境的影響，若嬰兒出生時身長位於百分位生長曲線表的10百分位，但其父母身高屬於高大者，且嬰兒的營養狀況良好，則嬰兒在一歲前的生長趨勢為何？","o":["lag-down growth","catch-up growth","growth in channel","stunted growth"],"a":"B","c":"生命期營養","c2":"","ch":"嬰兒期","ch2":"","t":"嬰兒的生長追趕","ex":"嬰兒出生身長受子宮環境影響，出生後會逐漸回到由遺傳決定的生長軌道。父母高大且營養良好，出生時在第 10 百分位的嬰兒，一歲前會向上追趕（catch-up growth）。"},{"id":"113-2-4102-48","p":"113-2-4102","n":48,"q":"有關體重過重的哺乳婦女於哺乳期間需注意之事項，下列何者最適當？","o":["不可限制能量攝取","蛋白質攝取量應比體重正常的母親高","應增加飲水量改善乳汁生成延遲問題","曾接受胃繞道手術者應補充鐵劑增進母乳鐵含量"],"a":"B","c":"生命期營養","c2":"","ch":"懷孕與哺乳期","ch2":"","t":"過重的哺乳婦女","ex":"依標準答案 B 最適當。過重的哺乳婦女可以適度限制熱量（每週減重約 0.5 公斤不影響泌乳），但要維持足夠的蛋白質；多喝水不會加速泌乳；胃繞道手術後要補充鐵，但不會增加乳汁的鐵含量。"},{"id":"113-2-4102-49","p":"113-2-4102","n":49,"q":"規律從事中度運動強度訓練約1小時之運動員，建議攝取多少碳水化合物以因應其能量需求？","o":["每公斤體重1至3克","每公斤體重5至7克","每公斤體重8至12克","每公斤體重15至20克"],"a":"B","c":"營養學","c2":"","ch":"運動營養","ch2":"","t":"運動員的醣類需要量","ex":"國際運動營養建議：輕度運動每公斤 3～5 克；中度運動每天約 1 小時，每公斤 5～7 克；中高強度每天 1～3 小時，每公斤 6～10 克；更高強度每公斤 8～12 克。"},{"id":"113-2-4102-50","p":"113-2-4102","n":50,"q":"申請健康食品認證，如屬第三類非傳統食用食品，可以不用進行下列何種安全性評估？","o":["90日餵食試驗","基因毒性試驗","致畸試驗","致癌性試驗"],"a":"D","c":"營養學","c2":"食品衛生與安全","ch":"總覽","ch2":"毒理與安全性評估","t":"健康食品的安全性評估","ex":"依標準答案，健康食品第三類（非傳統食用的原料）需要進行基因毒性、28 天或 90 天餵食試驗與致畸試驗，不需要致癌性試驗；第四類才需要包括致癌性試驗的完整評估。"},{"id":"113-2-5102-1","p":"113-2-5102","n":1,"q":"依據「包裝食品營養宣稱應遵行事項」，下列何者不可用於包裝食品的「營養宣稱」？","o":["高鈣","低鈉","富含膳食纖維","富含DHA"],"a":"D","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"營養宣稱的項目","ex":"「包裝食品營養宣稱應遵行事項」只開放特定營養素做宣稱：需適量攝取的（熱量、脂肪、飽和脂肪、反式脂肪、膽固醇、鈉、糖）可宣稱低或無；可補充攝取的（膳食纖維、維生素、鈣、鐵等）可宣稱來源或高。DHA 不在可宣稱的列表中。"},{"id":"113-2-5102-2","p":"113-2-5102","n":2,"q":"衛生福利部國民健康署將每日飲食指南的概念繪製成餐盤圖像，帶入類別及份量的概念，提醒民眾每餐皆應攝取到6大類食物，下列敘述何者正確？","o":["餐盤6大類食物的面積，可對應攝取食物的重量","蔬菜比水果多一點","飯比菜多一點，飯至少1/3為未精製全穀雜糧，菜選當季且1/3選深色","每餐攝取堅果種子類1湯匙"],"a":"B","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"我的餐盤","ex":"我的餐盤口訣：每天早晚一杯奶、每餐水果拳頭大、菜比水果多一點、飯跟蔬菜一樣多、豆魚蛋肉一掌心、堅果種子一茶匙。餐盤面積表示比例，不是重量；堅果種子是一茶匙，不是一湯匙。"},{"id":"113-2-5102-3","p":"113-2-5102","n":3,"q":"下列何種產品須有營養標示？","o":["商店販賣由消費者自行以塑膠袋盛裝後過秤，再以壓模機封口包裝的白木耳","僅販賣給餐廳、拉麵店、加工廠之業務用包裝食品原料","菜市場販賣用保鮮膜包裝的滷味豆干","宣稱含有高維生素C的番石榴茶包"],"a":"D","c":"公共衛生營養學","c2":"食品衛生與安全","ch":"飲食指標與營養標示","ch2":"食品安全衛生法規","t":"營養標示的適用範圍","ex":"有容器或包裝、直接售給消費者的食品要有營養標示；只要做了營養宣稱（如高維生素 C）就一定要標示。消費者自行包裝秤重的散裝食品、售給業者的原料、市場現場簡易包裝的食品可免標示。"},{"id":"113-2-5102-4","p":"113-2-5102","n":4,"q":"「國人膳食營養素參考攝取量」中，懷孕婦女營養素攝取量不需額外增加下列何者？","o":["鈣","泛酸","維生素A","維生素E"],"a":"A","c":"公共衛生營養學","c2":"營養學","ch":"飲食指標與營養標示","ch2":"總覽","t":"懷孕期增加的營養素","ex":"國人 DRIs 第八版懷孕期鈣不需額外增加（懷孕時鈣吸收率提高）。泛酸增加 1 毫克、維生素 E 增加 2 毫克、維生素 A 第三期增加 100 微克 RE。"},{"id":"113-2-5102-5","p":"113-2-5102","n":5,"q":"依據衛生福利部之建議，飲食應以清淡為原則，每日鈉攝取量以不超過多少毫克為原則？","o":["2,400","3,000","4,200","6,000"],"a":"A","c":"公共衛生營養學","c2":"","ch":"飲食指標與營養標示","ch2":"","t":"每日鈉的攝取上限","ex":"國民飲食指標建議每日鈉攝取量不超過 2,400 毫克（約 6 公克鹽）。"},{"id":"113-2-5102-6","p":"113-2-5102","n":6,"q":"下列何者不是原住民的傳統食物？","o":["阿拜（A Bai）","娘惹糕（Nyonya Kuih）","奇拿富（Cinavu）","石板烤山豬肉"],"a":"B","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"原住民的傳統食物","ex":"阿拜（阿美族、排灣族等的小米粽）、奇拿富（排灣族、魯凱族的芋頭小米粽）、石板烤山豬肉都是原住民傳統食物。娘惹糕是東南亞峇峇娘惹（土生華人）的糕點。"},{"id":"113-2-5102-7","p":"113-2-5102","n":7,"q":"有關職場健康促進，下列敘述何者錯誤？","o":["WHO建立的「職場周全健康促進推動模式」中強調應包含「生理工作環境」、「社會心理工作環境」、「個人健康資源」及「企業社區參與」四大層面","衛生福利部國民健康署自民國96年起開始辦理全國「健康職場認證」，其績優健康職場的獎項中包含「營養健康獎」，目的是鼓勵職場致力於改變員工飲食行為","職場健康促進計畫之核心價值為「企業／組織的領導承諾」及「員工共同參與」","健康職場認證的實施對象為國內合法設立之公、民營事業單位或機關（構）皆可納入，無資格要求"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"職場健康促進","ex":"健康職場認證有申請資格的規定（例如需是合法設立的事業單位，並符合員工人數等條件），不是「無資格要求」。WHO 的模式包括四個層面；核心是領導承諾與員工參與。"},{"id":"113-2-5102-8","p":"113-2-5102","n":8,"q":"與衛生福利部長期照顧十年計畫1.0（長照1.0）相較，長照2.0擴大納入那些服務對象？","o":["65歲以上失能老人","55歲以上原住民","未滿50歲失能身心障礙者","50歲以上身心障礙者"],"a":"C","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"長照 2.0 擴大的服務對象","ex":"長照 1.0 的對象是 65 歲以上失能老人、55 歲以上失能原住民、50 歲以上失能身心障礙者、65 歲以上僅 IADL 失能的獨居老人。長照 2.0 擴大到 50 歲以上失智者、未滿 50 歲失能身心障礙者、55～64 歲失能平地原住民、65 歲以上衰弱者。"},{"id":"113-2-5102-9","p":"113-2-5102","n":9,"q":"有關人口老化的指數，下列敘述何者錯誤？","o":["老化指數＝老年人口數與幼年人口數之比","老化指數＝每百名工作年齡人口扶養之老年人口數","扶養比＝（0～14歲人口＋65歲以上人口）／15～64歲人口","我國目前老化指數已經超過100"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"人口老化指標","ex":"老化指數 ＝ 65 歲以上人口 ÷ 0～14 歲人口 × 100，我國已超過 100。扶養比 ＝（幼年＋老年人口）÷ 工作年齡人口。每百名工作年齡人口扶養的老年人口數是「扶老比」，不是老化指數。"},{"id":"113-2-5102-10","p":"113-2-5102","n":10,"q":"依據母嬰親善醫院認證所提的產科機構應該要有哺餵母乳的措施，下列敘述何者錯誤？","o":["提供每天8小時的母嬰同室","鼓勵依嬰兒的需求哺餵母乳","教導母親哺餵母乳，及在必須和嬰兒分開的情況下如何維持奶水的分泌","哺餵母乳的嬰兒，不給予人工奶嘴或安撫奶嘴"],"a":"A","c":"公共衛生營養學","c2":"生命期營養","ch":"生命期與特殊族群政策","ch2":"嬰兒期","t":"母嬰親善醫院的措施","ex":"母嬰親善措施要讓母嬰 24 小時同室，不是每天 8 小時。其餘包括依嬰兒需求哺餵、教導母親在分開時維持泌乳、不給母乳哺餵的嬰兒人工奶嘴。"},{"id":"113-2-5102-11","p":"113-2-5102","n":11,"q":"衛生福利部國民健康署倡議，各縣市政府衛生局應至少建置一處社區營養推廣中心，下列何者不是針對長者之營養策略？","o":["吃得多","吃得下","吃得夠","吃得巧"],"a":"A","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社區營養推廣中心的長者策略","ex":"長者營養策略的口號是「吃得下、吃得夠、吃得對、吃得巧」。重點是讓長者吃得夠營養，不是吃得多。"},{"id":"113-2-5102-12","p":"113-2-5102","n":12,"q":"衛生福利部國民健康署近年來致力推動全民肥胖防治工作，建議各縣市依據「渥太華五大行動綱領」制定全方位策略，下列何項策略屬於促使民眾發展個人技巧？","o":["提供健康飲食及運動諮詢服務","超市標示食物熱量及營養標示","開辦健康飲食烹飪班增加製作能力","與農業單位合作推廣在地新鮮食物及五穀主食"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"渥太華五大行動綱領","ex":"渥太華憲章五大行動：建立健康的公共政策、創造支持性環境、強化社區行動、發展個人技巧、調整健康服務方向。開烹飪班增加製作能力屬於發展個人技巧；諮詢服務是調整健康服務；營養標示與推廣在地食物屬於支持性環境。"},{"id":"113-2-5102-13","p":"113-2-5102","n":13,"q":"民國104學年度及之後應屆畢業者，其實習內容與時數，下列那一項不符合「專門職業及技術人員高等考試營養師考試實習認定基準」？","o":["見習營養師；72小時","營養規劃、營養評估及諮詢、營養教育、社區營養服務；72小時","營養評估及諮詢、飲食計劃、營養教育與規劃；144小時","膳食製備與供應、人事管理、行政管理；144小時"],"a":"C","c":"公共衛生營養學","c2":"保健營養專業倫理","ch":"營養政策與法規","ch2":"","t":"營養師考試實習認定基準","ex":"依標準答案，C 的實習內容或時數不符合 104 學年度以後的實習認定基準。"},{"id":"113-2-5102-14","p":"113-2-5102","n":14,"q":"有關「健康食品管理法」之敘述，下列何者錯誤？","o":["健康食品之製造、輸入許可證有效期限為五年，每次展延不得超過五年","健康食品許可證期滿仍須繼續製造、輸入者，應於許可證到期前三個月內申請中央主管機關核准展延之","健康食品許可證若逾期未申請展延或不准展延者，原許可證會自動失效","未經核准擅自製造或輸入健康食品者，處三年以下有期徒刑或科新臺幣一百萬元以下罰金"],"a":"D","c":"公共衛生營養學","c2":"食品衛生與安全","ch":"營養政策與法規","ch2":"食品安全衛生法規","t":"健康食品管理法","ex":"依標準答案 D 錯。健康食品管理法對未經核准擅自製造或輸入健康食品者，是處三年以下有期徒刑，「得併科」新臺幣一百萬元以下罰金。許可證有效期 5 年，期滿前 3 個月內申請展延，每次展延不超過 5 年。"},{"id":"113-2-5102-15","p":"113-2-5102","n":15,"q":"有關校園飲品及點心販售範圍之敘述，下列何者正確？","o":["可於國中以下學校販售的七種飲品應符合TQF標準規格","高級中等學校所販售的包裝食品需取得CAS或TQF驗證標章或校園食品標章","完全中學校園飲品及點心販售，一律比照高中職學校規定辦理","可於國中以下學校販售的校園烘焙食品（麵包、餅乾、米製品），油及糖所提供熱量之總和不得超過總熱量之30％"],"a":"B","c":"公共衛生營養學","c2":"","ch":"生命期與特殊族群政策","ch2":"","t":"校園飲品及點心販售範圍","ex":"依標準答案，高級中等學校販售的包裝食品需取得 CAS、TQF 驗證標章或校園食品標章。"},{"id":"113-2-5102-16","p":"113-2-5102","n":16,"q":"有關常用於老人營養篩檢及營養評估量表，下列敘述何者正確？","o":["Subjective Global Assessment適合用於偵測早期營養不良","DETERMINE可用作臨床診斷營養狀況工具","Malnutrition Screening Tool須評量疾病嚴重程度","Mini Nutritional Assessment適合一般照顧者及專業人員使用"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"老人營養篩檢與評估工具","ex":"MNA 是專為老人設計的工具，題目簡單，一般照顧者與專業人員都能使用。SGA 適合已有營養不良的評估，不擅長偵測早期營養不良；DETERMINE 是自我篩檢表，不能做臨床診斷；MST 只問體重減輕與食慾，不評疾病嚴重度。"},{"id":"113-2-5102-17","p":"113-2-5102","n":17,"q":"相較於訪員當面訪問調查，以電話訪問進行膳食評估時，下列敘述何者錯誤？","o":["較省時、省經費","受訪者較有安全感","換算食物份量時易造成測量誤差","不適用於大規模調查"],"a":"D","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"電話訪問的膳食評估","ex":"電話訪問省時省錢、受訪者較有安全感，但無法用食物模型或量具，份量換算誤差較大。它反而常用於大規模調查，D 錯。"},{"id":"113-2-5102-18","p":"113-2-5102","n":18,"q":"以食物頻率問卷進行膳食評估，下列敘述何者錯誤？","o":["可自我填寫或線上填答","選項具文化敏感度（culturally sensitive）","常用於大型跨國研究比較飲食攝取狀況","結果較飲食記錄法具代表性"],"a":"C","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"食物頻率問卷","ex":"食物頻率問卷的食物清單要符合當地飲食文化，不同國家的問卷內容不同，不適合直接用於跨國比較。它可以自填或線上填答，比少數幾天的飲食記錄更能代表長期攝取。"},{"id":"113-2-5102-19","p":"113-2-5102","n":19,"q":"有關嬰幼兒之體位評估，下列何者較不適用？","o":["Growth charts","BMI（body mass index）","Head circumference","Waist circumference"],"a":"D","c":"營養評估","c2":"生命期營養","ch":"體位評估","ch2":"嬰兒期","t":"嬰幼兒的體位評估","ex":"嬰幼兒常用生長曲線、頭圍、身長、體重與 BMI（2 歲以上）評估。腰圍用來評估成人的腹部肥胖，不適用於嬰幼兒。"},{"id":"113-2-5102-20","p":"113-2-5102","n":20,"q":"某人指甲凹陷呈湯匙狀，可能是下列何種營養素缺乏？","o":["Iodine","Iron","Copper","Zinc"],"a":"B","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"礦物質（微量）","t":"匙狀指甲","ex":"匙狀指甲（指甲凹陷呈湯匙狀）是長期缺鐵的典型徵候。"},{"id":"113-2-5102-21","p":"113-2-5102","n":21,"q":"我國成年人腰圍超過多少公分，可能會增加與肥胖相關疾病的危險性？","o":["女性75公分，男性85公分","女性75公分，男性90公分","女性80公分，男性85公分","女性80公分，男性90公分"],"a":"D","c":"營養評估","c2":"","ch":"體位評估","ch2":"","t":"國人的腰圍切點","ex":"我國成人腹部肥胖的切點是男性腰圍 ≥90 公分、女性 ≥80 公分。"},{"id":"113-2-5102-22","p":"113-2-5102","n":22,"q":"根據美國CDC（Centers for Disease Control and Prevention）提出學校健康教育指引，青少年最理想的營養教育環境是：","o":["家庭","學校","網路","個人"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"青少年營養教育的場域","ex":"依美國 CDC 的學校健康教育指引，學校是青少年營養教育最理想的環境：學生每天在校、有課程與午餐，可結合教學與環境。"},{"id":"113-2-5102-23","p":"113-2-5102","n":23,"q":"下列何種膳食調查方法適合調查長期飲食習慣？","o":["飲食記錄法","24小時飲食回憶法","食物秤重盤存法","食物攝取頻率法"],"a":"D","c":"營養評估","c2":"","ch":"飲食評估","ch2":"","t":"評估長期飲食習慣的方法","ex":"食物頻率問卷詢問過去一段時間（如一個月或一年）各類食物的攝取頻率，適合評估長期飲食習慣。飲食記錄、24 小時回憶、秤重盤存都是評估短期的實際攝取。"},{"id":"113-2-5102-24","p":"113-2-5102","n":24,"q":"有關迷你營養評估（Mini Nutritional Assessment, MNA）之敘述，下列何者錯誤？","o":["須得知個案之身體質量指數","須了解個案近三個月食慾變化","以小腿圍可評估肌肉量的項目","以三頭肌皮層厚度評估體脂肪"],"a":"D","c":"營養評估","c2":"","ch":"臨床評估與篩檢工具","ch2":"","t":"MNA 的評估項目","ex":"完整版 MNA 使用 BMI、上臂中圍、小腿圍（肌肉量）與近三個月食慾和體重變化等項目，沒有三頭肌皮脂厚度。"},{"id":"113-2-5102-25","p":"113-2-5102","n":25,"q":"缺乏維生素B2可能會有的症狀，不包括下列何者？","o":["舌炎","眼畏光","口角炎","點狀皮下出血"],"a":"D","c":"營養評估","c2":"營養學","ch":"臨床評估與篩檢工具","ch2":"維生素（水溶性）","t":"維生素 B2 缺乏的症狀","ex":"B2 缺乏會出現口角炎、唇炎、舌炎、脂漏性皮膚炎與眼睛畏光。點狀皮下出血是維生素 C 缺乏（壞血病）的症狀。"},{"id":"113-2-5102-26","p":"113-2-5102","n":26,"q":"執行一項調查，若問卷回收率太低，可能造成何種問題？","o":["無法執行統計分析","收集到的數據有選擇性偏差","無法充分表現問卷設計的品質","如果調查為隨機取樣，就不會有問題"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"問卷回收率太低","ex":"回收率太低時，回覆的人可能和沒回覆的人特性不同（例如比較重視健康），樣本無法代表母群體，產生選擇性偏差。即使是隨機抽樣也會有這個問題。"},{"id":"113-2-5102-27","p":"113-2-5102","n":27,"q":"有關設計問卷題目的原則，下列敘述何者錯誤？","o":["避免使用過於淺顯的文字","避免有暗示作用的問題","避免雙重否定的問題","避免句子過長"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"問卷題目的設計原則","ex":"問卷題目應使用淺顯易懂的文字，避免暗示、雙重否定與過長的句子。A 說要避免淺顯的文字是錯的。"},{"id":"113-2-5102-28","p":"113-2-5102","n":28,"q":"關於教學目標之敘述，下列何者錯誤？","o":["應以教學者為主體","每個目標應只包含1項學習結果","可敘述學習者在何種情境下表現出預期行為","所敘述的標準是行為表現之最低可接受程度"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"教學目標的敘寫","ex":"教學目標應以「學習者」為主體，敘述學習後能做到的行為，每個目標只寫一個學習結果，並可寫出表現的情境與最低可接受的標準。"},{"id":"113-2-5102-29","p":"113-2-5102","n":29,"q":"在學員飲食行為尚未改變前，營養教案可考慮介入行為改變之中介因子，不包括下列何者？","o":["結果期待","知覺危機","自我效能","自我管理"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"行為改變前的中介因子","ex":"依標準答案，行為改變前的中介因子是結果期待、知覺危機、自我效能等「動機」相關因素；自我管理（目標設定、自我監測）屬於行為已開始改變時的技巧。"},{"id":"113-2-5102-30","p":"113-2-5102","n":30,"q":"某國小實施多喝牛奶長高高計畫，下面策略何者屬於PRECEDE-PROCEED的增強因素（reinforcing factor）？","o":["牛奶試喝活動","牛奶與健康畫畫比賽","親子共同完成「牛奶與健康」學習單","福利社牛奶特價月"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"PRECEDE-PROCEED 的增強因素","ex":"增強因素是行為發生後來自他人的回饋與支持，例如家長、同儕、老師。親子一起完成學習單，讓家長參與與鼓勵，屬增強因素。試喝與畫畫比賽是前傾因素；牛奶特價是促成因素。"},{"id":"113-2-5102-31","p":"113-2-5102","n":31,"q":"營養教育中常講述飲食與慢性疾病風險的學術報告，此為藉由下列何種中介因子的教學策略？","o":["自覺危機","意識覺醒","結果期待","知覺障礙"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"結果期待","ex":"講述飲食與慢性病風險的研究報告，讓學習者了解改變飲食能帶來的好處，屬於增進「結果期待」的教學策略。"},{"id":"113-2-5102-32","p":"113-2-5102","n":32,"q":"營養諮詢領域中常見的動機訪談法（motivational interviewing）中，4個基本技巧以OARS來表示，其中O代表：","o":["開放式問題（Open-ended questions）","機會（Opportunity）","客觀的（Objective）","原型的（Original）"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"動機式晤談的 OARS","ex":"OARS 是 Open-ended questions（開放式問題）、Affirmation（肯定）、Reflective listening（反映式傾聽）、Summarizing（摘要）。"},{"id":"113-2-5102-33","p":"113-2-5102","n":33,"q":"查核某社區營養計畫所應負起之社會責任，屬於下列何種控制機制？","o":["計畫經營控制","財務性控制","有效性控制","策略控制"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫的控制機制","ex":"策略控制是從組織整體方向檢視計畫，包括是否符合組織使命與社會責任。財務控制看預算；經營控制看日常執行；有效性控制看是否達成目標。"},{"id":"113-2-5102-34","p":"113-2-5102","n":34,"q":"某體重控制計畫的結果顯示，75%的參與者達到預期目標體重值，屬於下列何種評價？","o":["效率","效能","效果","效價"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫評價：效能","ex":"效能（effectiveness）是指達成預期目標的程度，例如 75% 參與者達到目標體重。效率是投入與產出的比例。"},{"id":"113-2-5102-35","p":"113-2-5102","n":35,"q":"糖尿病營養教育介入後，可降低病人糖化血色素，屬於下列何者計畫成效評估？","o":["過程評估","臨床結果評估","病人結果評估","成本評估"],"a":"B","c":"公共衛生營養學","c2":"膳食療養","ch":"社區營養計畫","ch2":"第6章 糖尿病","t":"計畫成效評估的類型","ex":"糖化血色素是臨床指標，介入後下降屬於臨床結果評估。病人結果評估看的是生活品質、滿意度、行為改變等；過程評估看執行情形。"},{"id":"113-2-5102-36","p":"113-2-5102","n":36,"q":"兩位不同縣市的社區營養師，採用不同的方案進行體重控制計畫（場地、講師、課程時數、使用設備等不同），計畫執行完畢後，計算每降低1公斤體重所需要的費用，比較兩方案的成本分析，屬於下列何種分析方法？","o":["成本利益（cost-benefit）","成本效益（cost-effectiveness）","成本最小值（cost-minimization）","成本價值（cost-utility）"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"成本效益分析","ex":"成本效益分析是比較達到同一種健康結果（如每減 1 公斤體重）所需的成本。成本利益分析把結果也換成金錢；成本最小值分析是在效果相同下比較成本；成本效用分析用 QALY 等指標。"},{"id":"113-2-5102-37","p":"113-2-5102","n":37,"q":"完成社區需求評估後，訂定解決問題的優先順序時，通常不考慮下列何者？","o":["問題的大小","問題的效益","問題的嚴重性","問題的目標對象"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"問題的優先順序","ex":"排定優先順序時通常考慮問題的大小（影響人數）、嚴重性、可改變性與解決後的效益。目標對象是決定處理哪個問題之後才確定的。"},{"id":"113-2-5102-38","p":"113-2-5102","n":38,"q":"有關歷次全國營養調查中飲食評估之敘述，下列何者錯誤？","o":["1980～1988年，調查對象未針對年齡層來進行調查","1993～2002年，調查對象針對不同年齡層分次進行調查","2005～2008年以後，調查對象針對全國2個月以上民眾進行調查","2013年起，每年進行數據收集"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次國民營養調查的對象","ex":"依標準答案 C 錯。2005～2008 年的調查對象依年齡層分組進行，不是「2 個月以上」全部民眾。"},{"id":"113-2-5102-39","p":"113-2-5102","n":39,"q":"有關歷次全國營養調查內容之敘述，下列何者錯誤？","o":["1986～1988年進行家戶飲食攝取狀況與體位調查","1993～1996年以後，分年齡層，進行飲食、營養、健康狀況調查","2001～2002年以後開始進行體檢測量","2005～2008年首次以CAPI（Computer Assisted Personal Interview）進行訪視"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次國民營養調查的內容","ex":"1993～1996 年的國民營養健康狀況變遷調查就開始做體檢測量（體位與生化檢驗），不是 2001～2002 年才開始。"},{"id":"113-2-5102-40","p":"113-2-5102","n":40,"q":"比較1993～1996年、2005～2008年與2013～2016年國民營養健康狀況變遷調查結果，有關國人慢性病的盛行率，下列敘述何者錯誤？","o":["19歲以上國人之糖尿病盛行率持續上升","歷次調查發現，代謝症候群盛行率有增加的趨勢，且女性增加幅度大於男性","2013～2016年調查發現，45歲以上人口約20～30％有血脂肪異常問題","2013～2016年調查發現，45歲以上糖尿病前期的盛行率，男性高於女性"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人慢性病盛行率的變化","ex":"依標準答案 B 錯：歷次調查中代謝症候群盛行率上升，男性增加幅度大於女性。"},{"id":"113-2-5102-41","p":"113-2-5102","n":41,"q":"依據2013～2016年國民營養健康狀況變遷調查結果，有關國人維生素的營養狀況，下列敘述何者錯誤？","o":["血液分析結果，維生素E測量值嚴重缺乏","飲食攝取分析結果，維生素D與維生素E缺乏嚴重","血液中維生D的濃度與地理分佈有關，呈現北低南高的現象","各年齡層男女性，維生素A、C、B1、B2、菸鹼酸、B6、B12的平均攝取量皆高於DRIs 80%以上"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人維生素營養狀況","ex":"依標準答案 A 錯：2013～2016 年調查的血液分析中，維生素 E 缺乏率並不高。飲食攝取方面，維生素 D 與 E 攝取不足的情形較嚴重；血中維生素 D 呈北低南高。"},{"id":"113-2-5102-42","p":"113-2-5102","n":42,"q":"依據2013～2016國民營養健康狀況變遷調查結果，下列那幾類食物攝取最偏離每日飲食指南建議量？①全榖雜糧類　②奶類　③豆魚蛋肉類　④蔬菜類　⑤水果類　⑥油脂及堅果種子類","o":["①②③","②③④","①②④","②④⑤"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人飲食與飲食指南的落差","ex":"國民營養調查顯示，國人乳品類、蔬菜類、水果類的攝取量與建議量差距最大，豆魚蛋肉類則普遍攝取過多。"},{"id":"113-2-5102-43","p":"113-2-5102","n":43,"q":"食物、衛生和人類安全相互依賴，下列何者不是造成「糧食不安全」的直接原因？","o":["糧食價格上漲","糧食運輸中斷","耕地減少","能源短缺"],"a":"D","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"糧食不安全的直接原因","ex":"糧價上漲、運輸中斷、耕地減少直接影響糧食的取得或供應。能源短缺是透過推高生產與運輸成本間接影響，不是直接原因。"},{"id":"113-2-5102-44","p":"113-2-5102","n":44,"q":"聯合國糧食及農業組織（Food and Agriculture Organization of the United Nations, FAO）提出監測永續發展目標（Sustainable Development Goals, SDGs），核心目標2：「消除飢餓」，該指標是確認糧食不足的人口比率。下列對於此數據來源之敘述，何者正確？","o":["藉由族群的年齡、性別及身高等資料，可換算出族群的熱量供應量","藉由家庭消費和支出，調查糧食消費量，可得知族群獲得膳食熱量的不平等性","藉由國家糧食平衡表，可換算出族群的最低熱量需求","藉由全國健康保險資料庫，可得知膳食熱量不足的人口率"],"a":"B","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"營養不足人口比率的資料來源","ex":"FAO 估算營養不足人口比率，用國家糧食平衡表估算平均熱量供應，用家戶消費與支出調查估算熱量取得的不平等程度，再用年齡、性別、身高推算最低熱量需求。"},{"id":"113-2-5102-45","p":"113-2-5102","n":45,"q":"世界衛生組織對一般健康成人的每日糖攝取建議為何？","o":["少於10公克","少於20公克","低於建議總熱量的10%","低於建議總熱量的15%"],"a":"C","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"WHO 的糖攝取建議","ex":"WHO 建議游離糖攝取低於總熱量的 10%，若能低於 5% 更有益健康。"},{"id":"113-2-5102-46","p":"113-2-5102","n":46,"q":"營養師於社區執行免費健康飲食衛生講座活動，以提升長者的健康飲食習慣。此活動屬於推動公共衛生的何種手段？","o":["強制性手段","消極性手段","積極性手段","擴散性手段"],"a":"C","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"公共衛生的積極性手段","ex":"透過教育、宣導提升民眾健康知識與行為屬於積極性手段；法令規範與處罰屬強制性手段。"},{"id":"113-2-5102-47","p":"113-2-5102","n":47,"q":"下列何種抽樣方法所抽取的樣本，較具集中性與同質性？","o":["簡單隨機抽樣（simple random sampling）","系統隨機抽樣（systematic random sampling）","分層隨機抽樣（stratified random sampling）","集束隨機抽樣（cluster random sampling）"],"a":"D","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"集束抽樣","ex":"集束抽樣以群體（如村里、學校）為單位抽樣，同一群內的人地理位置相近、特性相似，樣本較集中、同質性高。"},{"id":"113-2-5102-48","p":"113-2-5102","n":48,"q":"下列何者不屬於流行病學的研究範圍與方向？","o":["社區疾病型態的描述","疾病自然史與其三段五級的對策","醫藥保健工作的設計與績效評估","細胞訊息傳遞路徑探討"],"a":"D","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"流行病學的研究範圍","ex":"流行病學研究族群的疾病分布與決定因素，包括描述疾病型態、疾病自然史與預防對策、衛生計畫的設計與評估。細胞訊息傳遞是分子生物學的研究範圍。"},{"id":"113-2-5102-49","p":"113-2-5102","n":49,"q":"若不吃蔬菜者得到癌症的風險為1.00，每週吃蔬菜小於1次者風險0.91，每週1～2次者風險0.91，每週3～4次風險0.83，每週≧5次者的風險0.76，且p for trend＝0.001。下列敘述何者正確？","o":["比起每週吃1～2次蔬菜者，每週吃3～4次蔬菜者，有顯著較低的癌症發生風險","比起每週吃1～2次蔬菜者，每週吃5次以上蔬菜者，有顯著較低的癌症發生風險","比起每週吃3～4次蔬菜者，每週吃5次以上蔬菜者，有顯著較低的癌症發生風險","吃蔬菜頻率越高者，有顯著較低的癌症發生風險"],"a":"D","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"劑量效應與趨勢檢定","ex":"p for trend ＝ 0.001 表示吃蔬菜頻率越高、癌症風險越低的趨勢有統計意義。題目沒有給各組的信賴區間，無法判斷兩組之間的差異是否顯著。"},{"id":"113-2-5102-50","p":"113-2-5102","n":50,"q":"營養教育的方式，下列敘述何者錯誤？","o":["示範法適合學習技能","大眾傳播法能觸及較多民眾","課堂教學法可提供較完整之營養知識","一對一接觸教學容易控制進度且花費低"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"營養教育的方法","ex":"一對一教學可依個人調整內容與進度，但需要較多人力與時間，花費較高。示範法適合技能學習；大眾傳播觸及人數多；課堂教學可提供完整知識。"},{"id":"113-2-6102-1","p":"113-2-6102","n":1,"q":"某團膳公司將白飯的蒸煮步驟列為重要管制點，並要求白飯蒸煮後之中心溫度要達85℃。下列何者符合食品安全管制系統所述之驗效（Validation）？","o":["管制界限訂定白飯蒸煮之中心溫度須達85℃以上才安全","白飯蒸煮後若中心溫度未達85℃需重新加熱至90℃","以金屬探針溫度計量測白飯蒸煮之中心溫度，確保達到85℃","白飯蒸煮後中心溫度達85℃，經檢驗後未發現會造成食品腐敗或中毒之微生物"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 的確效","ex":"確效（validation）是用科學證據證明管制措施真的有效，例如檢驗蒸煮到 85℃ 的白飯確實沒有致病或腐敗的微生物。A 是訂定管制界限；B 是矯正措施；C 是監測。"},{"id":"113-2-6102-2","p":"113-2-6102","n":2,"q":"依據食品安全管制系統準則之規定，下列何者正確？","o":["同公司有兩個不同廠區（獨立廠址），只需成立一個管制小組以方便管理兩個廠區","管制小組應該要確認產品的加工流程圖與生產現場作業一致，加工流程圖可簡要表示","團體膳食業或餐飲業所設置專門職業人員可以由畜牧技師、獸醫師或水產養殖技師擔任","未依規定設置專門職業人員之食品業者，依食品安全衛生管理法第47條第4款規定可處新臺幣3萬元以上300萬元以下罰鍰"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品安全管制系統準則","ex":"未依規定設置專門職業人員的業者，依食安法第 47 條處新臺幣 3 萬至 300 萬元罰鍰。不同廠區要各自成立管制小組；流程圖要詳細並與現場一致；團膳與餐飲業的專門職業人員是營養師、食品技師等，不是畜牧技師或獸醫師。"},{"id":"113-2-6102-3","p":"113-2-6102","n":3,"q":"依據食品用洗潔劑衛生標準，食品使用次氯酸鈉為消毒主成分，其殘留濃度以總有效氯計算為：","o":["1 ppm以下","2 ppm以下","20 ppm以下","200 ppm以下"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"次氯酸鈉的殘留標準","ex":"依標準答案，食品用洗潔劑衛生標準規定以次氯酸鈉為消毒主成分時，殘留的總有效氯須在 1 ppm 以下。"},{"id":"113-2-6102-4","p":"113-2-6102","n":4,"q":"下列何者非屬食品良好衛生規範準則涵蓋之範圍？","o":["從業人員","作業場所","設施衛生管理","驗證制度"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品良好衛生規範準則的範圍","ex":"食品良好衛生規範準則規範從業人員、作業場所、設施衛生管理、製程與品質管制、倉儲與運輸等。驗證制度屬另外的驗證規定，不在準則中。"},{"id":"113-2-6102-5","p":"113-2-6102","n":5,"q":"依我國法規規定，以輻射照射下列食品時，何者不以防治蟲害或殺菌為其主要目的：","o":["綠豆","生薑","香辛料","稻米"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"食品輻射照射的目的","ex":"生薑、馬鈴薯、洋蔥、大蒜照射的目的是抑制發芽；綠豆、稻米照射是防治蟲害；香辛料照射是殺菌。"},{"id":"113-2-6102-6","p":"113-2-6102","n":6,"q":"依據包裝食品營養標示應遵行事項規定，包裝食品之營養標示須標示糖含量，此處所稱之糖含量是指下列何者？","o":["10個碳數以下的低分子量醣類之總和","葡萄糖等單醣之總和","蔗糖等雙醣之總和","單醣與雙醣之總和"],"a":"D","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"飲食指標與營養標示","t":"營養標示的糖","ex":"營養標示中的糖是指單醣與雙醣的總和，包括天然存在與添加的糖（不含糖醇）。"},{"id":"113-2-6102-7","p":"113-2-6102","n":7,"q":"依據食品安全衛生管理法，對於食品器具、食品容器或包裝的材質名稱及耐熱溫度之標示規定中，若為二種以上材質組成者，應如何標示？","o":["僅需標示材質所占比例最高者","僅需標示最耐高溫者","僅需標示最不耐高溫者","應就各種材質分別標示"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"器具容器包裝的標示","ex":"食品器具、容器或包裝由兩種以上材質組成時，應就各種材質分別標示材質名稱與耐熱溫度。"},{"id":"113-2-6102-8","p":"113-2-6102","n":8,"q":"冷藏肉品表面形成黑色斑及產生霉味，可能是因為下列何種黴菌污染所導致？","o":["青黴菌（Penicillium）","沙雷氏菌（Serratia）","麴菌（Aspergillus）","梭黴菌（Fusarium）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"冷藏肉品的黑斑","ex":"依標準答案，冷藏肉品表面黑斑與霉味是麴菌污染。黑斑也常見枝孢黴（Cladosporium）引起；沙雷氏菌是細菌，會使食品變紅。"},{"id":"113-2-6102-9","p":"113-2-6102","n":9,"q":"在廚房要預防金黃色葡萄球菌的污染，應特別注意：","o":["餐具","用水","砧板","手指之傷口、膿瘡"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"金黃色葡萄球菌的預防","ex":"金黃色葡萄球菌存在於人體皮膚、鼻腔與化膿傷口，主要經工作人員的手污染食品。手部有傷口膿瘡者不得接觸食品，或要包紮並戴手套。"},{"id":"113-2-6102-10","p":"113-2-6102","n":10,"q":"添加下列何種物質，可改變食物的滲透壓，延長其保存期限？","o":["蔗糖","酪蛋白","維生素E","多元不飽和脂肪酸"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"以滲透壓保存食品","ex":"加入大量蔗糖或鹽可提高滲透壓、降低水活性，使微生物脫水而抑制生長，例如果醬、蜜餞。"},{"id":"113-2-6102-11","p":"113-2-6102","n":11,"q":"下列何種微生物最適合於高還原電位的食品中生長？","o":["絕對好氧菌","微好氧菌","兼性厭氧菌","絕對厭氧菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"氧化還原電位與微生物","ex":"好氧菌需要高氧化還原電位（氧化性環境），絕對厭氧菌需要低氧化還原電位（還原性環境）。依標準答案為絕對厭氧菌，題目的「高還原電位」應是指還原性強（電位低）的環境。"},{"id":"113-2-6102-12","p":"113-2-6102","n":12,"q":"將新鮮水果（Aw 0.99）加工製成中濕性食品水果乾，其水活性常介於：","o":["0.93〜0.98","0.85〜0.93","0.61〜0.85","0.60以下"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"中濕性食品的水活性","ex":"中濕性食品（如果乾、果醬、蜜餞）的水活性約在 0.61～0.85，多數細菌無法生長，但部分黴菌與酵母菌仍可生長。"},{"id":"113-2-6102-13","p":"113-2-6102","n":13,"q":"在肉製品、醬油中添加酚類或苯甲酸防腐劑，主要為了抑制那種微生物的生長？","o":["酵母菌","黴菌","乳酸菌","醋酸菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"苯甲酸與酚類防腐劑","ex":"苯甲酸在酸性下以未解離形式作用，對黴菌與酵母菌效果較好，常用於醬油、果汁與醬菜。"},{"id":"113-2-6102-14","p":"113-2-6102","n":14,"q":"下列何種細菌是低酸性罐頭食品殺菌的目標菌？","o":["Escherichia coli","Clostridium perfringens","Bacillus subtilis","Clostridium botulinum"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"低酸性罐頭的殺菌目標","ex":"低酸性罐頭（pH ＞ 4.6、Aw ＞ 0.85）的殺菌目標是肉毒桿菌的芽孢，要達到 12D 的殺菌值。"},{"id":"113-2-6102-15","p":"113-2-6102","n":15,"q":"某一健康食品經傳統加工製程而得，該產品中含有非傳統食用之原料B，在我國沒有食用的紀錄，廠商表示在他國有半世紀以上的食用歷史且無致癌性，則該項產品屬於健康食品安全性評估中的那一類？","o":["第一類","第二類","第三類","第四類"],"a":"C","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"健康食品安全性評估的分類","ex":"第一類：傳統食用原料且以傳統加工製成；第二類：傳統原料但非傳統加工；第三類：原料非傳統食用，但在他國有長期食用歷史；第四類：原料非傳統食用且無食用歷史。本題屬第三類。"},{"id":"113-2-6102-16","p":"113-2-6102","n":16,"q":"依致癌物質之分類，試驗物質或其代謝物作用於標的細胞之遺傳因子且使其癌化者為何？","o":["一級致癌物","二級致癌物","致癌促進劑","致突變物"],"a":"A","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"一級致癌物","ex":"直接作用於標的細胞的遺傳物質並使其癌化的物質是一級致癌物（致癌起始劑）。"},{"id":"113-2-6102-17","p":"113-2-6102","n":17,"q":"安全性評估試驗中，由無毒害作用劑量（no observed adverse effect level, NOAEL）可以推算出下列何者？","o":["半致死劑量（50% lethal dose）","半致死濃度（50% lethal concentration）","每日攝取安全容許量（acceptable daily intake）","安全係數（safety factor）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"由 NOAEL 推算 ADI","ex":"每日攝取容許量 ADI ＝ NOAEL ÷ 安全係數（通常 100：種間差異 10 × 個體差異 10）。安全係數是設定的，不是由 NOAEL 推算。"},{"id":"113-2-6102-18","p":"113-2-6102","n":18,"q":"以安姆氏試驗法（Ames test）進行食品安全性評估，採用下列何種微生物測試？","o":["Bacillus stearothermophilus","Vibrio parahemolyticus","Salmonella typhimurium","Clostridium botulinum"],"a":"C","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"安姆氏試驗的菌種","ex":"安姆氏試驗使用組胺酸需求型的鼠傷寒沙門氏菌（Salmonella typhimurium）突變株，看受試物能否使它回復突變。"},{"id":"113-2-6102-19","p":"113-2-6102","n":19,"q":"通常使用半致死劑量（50% lethal dose, LD50）來衡量動物實驗中樣品的急性毒性強弱，當LD50為下列何者時，在毒性分級上可被歸類為實際上無毒（practically nontoxic）？","o":["50～500 mg/kg","500～1,000 mg/kg","1～3 g/kg","5～15 g/kg"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"急性毒性分級","ex":"依 LD50 分級：5～15 g/kg 為實際上無毒，大於 15 g/kg 為相對無害；0.5～5 g/kg 為中毒或輕毒，數值越小毒性越強。"},{"id":"113-2-6102-20","p":"113-2-6102","n":20,"q":"下列何種甜味劑不適用於苯丙酮尿症（phenylketonuria，PKU）患者？","o":["山梨醇","阿斯巴甜","糖精","甜菊糖"],"a":"B","c":"食品衛生與安全","c2":"營養學","ch":"食品添加物","ch2":"蛋白質","t":"苯酮尿症與阿斯巴甜","ex":"阿斯巴甜是天門冬胺酸與苯丙胺酸組成的二胜肽甲酯，分解後產生苯丙胺酸，苯酮尿症患者不能使用，產品必須標示。"},{"id":"113-2-6102-21","p":"113-2-6102","n":21,"q":"有關含烷基苯磺酸鹽類界面活性劑之食品用洗潔劑之特性，下列敘述何者正確？","o":["軟性洗潔劑的毒性較硬性者為強","直鏈式烷基苯磺酸鹽之半衰期較長","一般家庭多用硬性洗潔劑","烷基具分支構造者為軟性洗潔劑"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"烷基苯磺酸鹽洗潔劑","ex":"直鏈的軟性洗潔劑易被微生物分解，半衰期短，家庭多用；分支的硬性洗潔劑不易分解，會污染環境。依標準答案，軟性洗潔劑的毒性較強。"},{"id":"113-2-6102-22","p":"113-2-6102","n":22,"q":"有關美耐皿（melamine）餐具的敘述，下列何者正確？","o":["美耐皿是由甲醛與酚聚合製成","美耐皿餐具之水溶出試驗要求甲醛為陰性","美耐皿是一種熱塑性（thermoplastic）樹脂","我國衛生法規規定美耐皿餐具之砷、鉛限量各須小於100 ppm"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"美耐皿餐具","ex":"美耐皿是三聚氰胺與甲醛聚合的熱固性樹脂，不耐高溫，溶出試驗要求甲醛為陰性。酚與甲醛聚合的是酚醛樹脂（電木）。"},{"id":"113-2-6102-23","p":"113-2-6102","n":23,"q":"下列何者為能耐蒸汽殺菌與微波加熱之食品塑膠包裝材料？","o":["聚對苯二甲酸乙二酯（polyethylene terephthalate, PET）","聚乳酸（polylactic acid, PLA）","聚氯乙烯（polyvinyl chloride, PVC）","聚丙烯（polypropylene, PP）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"耐熱的塑膠材料","ex":"聚丙烯（PP，5 號）耐熱約 100～140℃，可以蒸汽殺菌與微波加熱。PET 耐熱約 60～85℃；PLA 不耐熱；PVC 含塑化劑，不適合加熱。"},{"id":"113-2-6102-24","p":"113-2-6102","n":24,"q":"用於消毒食品器具容器包裝等食品接觸面之四級銨化合物（quaternary ammonium compounds），其特性何者正確？","o":["殺菌作用機制之一為影響細菌細胞壁的功能","為陰離子系界面活性劑","溶於熱水中使用時會降低其殺菌效果","針對不同之四級銨種類，我國法規訂有從100至200 ppm間之使用濃度限量"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"四級銨化合物","ex":"四級銨化合物是陽離子界面活性劑，吸附在帶負電的細菌表面，破壞細胞膜與細胞壁的功能；溫度較高時殺菌效果反而增加。"},{"id":"113-2-6102-25","p":"113-2-6102","n":25,"q":"依據「食品安全衛生管理法」，下列何者非食品器具、容器或包裝應標示項目？","o":["有效日期；於必要時得標示製造日期","材質名稱及耐熱溫度","淨重、容量或數量","使用注意事項或微波等其他警語"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"器具容器包裝的標示項目","ex":"食品器具、容器或包裝應標示品名、材質名稱與耐熱溫度、淨重容量或數量、國內負責廠商、原產地、製造日期（必要時加標有效日期）、使用注意事項或警語。A 把製造日期與有效日期的主從弄反了。"},{"id":"113-2-6102-26","p":"113-2-6102","n":26,"q":"依據食品器具容器包裝衛生標準之規定，下列何種塑膠製品之DEHP、DBP、BBP、DIDP、DINP、DMP、DNOP、DEP等八種塑化劑之含量總和不得超出0.1％（重量比）？","o":["聚碳酸酯（polycarbonate, PC）","聚丙烯（polypropylene, PP）","聚對苯二甲酸乙二酯（polyethylene terephthalate, PET）","聚氯乙烯（polyvinyl chloride, PVC）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"PVC 的塑化劑限量","ex":"PVC 為了柔軟要添加塑化劑，衛生標準規定 PVC 製品中 8 種鄰苯二甲酸酯類塑化劑總和不得超過 0.1%。"},{"id":"113-2-6102-27","p":"113-2-6102","n":27,"q":"有關衛生福利部公告之「免洗筷衛生標準」何者正確？","o":["外觀雖少許發霉，但未檢出真菌毒素","過氧化氫殘留量100 ppm以下","二氧化硫殘留量500 ppm以下","聯苯殘留量100 ppm以下"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"免洗筷衛生標準","ex":"依標準答案，免洗筷的二氧化硫殘留量在 500 ppm 以下。免洗筷不得有發霉；過氧化氫應不得檢出；也有聯苯等防霉劑的限量。"},{"id":"113-2-6102-28","p":"113-2-6102","n":28,"q":"下列關於諾羅病毒（Norovirus）之敘述，何者錯誤？","o":["可藉由人群聚集方式而引發人畜共通傳染病（zoonosis）","屬於糞便經口傳染之食源性疾病（foodborne illness）","常在秋、冬季造成腹瀉群聚事件","會引起急性腸胃炎（gastroenteritis）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"諾羅病毒","ex":"諾羅病毒經糞口與飛沫傳染，秋冬季常造成群聚腸胃炎；人是主要宿主，不是人畜共通傳染病。"},{"id":"113-2-6102-29","p":"113-2-6102","n":29,"q":"下列關於金黃色葡萄球菌（Staphylococcus aureus）之敘述，何者錯誤？","o":["此菌為革蘭氏陽性菌，兼性厭氧","常見引起食物中毒的是A型腸毒素","此菌易因人體化膿傷口污染食品","屬於細菌性感染型食物中毒菌"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"金黃色葡萄球菌","ex":"金黃色葡萄球菌在食物中產生耐熱的腸毒素，吃下毒素就發病，屬毒素型食物中毒，不是感染型。它是革蘭氏陽性、兼性厭氧菌，以 A 型腸毒素最常見。"},{"id":"113-2-6102-30","p":"113-2-6102","n":30,"q":"下列食品與其有害成分之組合，何者錯誤？","o":["生蛋白，avidin","棉籽油，gossypol","金針花，solanine","蘆薈，aloin"],"a":"C","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"食品與有害成分","ex":"新鮮金針花含秋水仙鹼，要乾燥處理或煮熟；茄鹼存在於發芽馬鈴薯。生蛋白的卵白素會結合生物素；棉籽油含棉酚；蘆薈含蘆薈素。"},{"id":"113-2-6102-31","p":"113-2-6102","n":31,"q":"下列何種病原菌之致病能力與其是否具有溶血反應有關？①侵入型大腸桿菌　②腸炎弧菌　③李斯特菌　④肉毒桿菌","o":["①②","③④","①④","②③"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"溶血性與致病力","ex":"腸炎弧菌的耐熱性溶血素（神奈川現象）與致病力有關；李斯特菌的李斯特溶血素 O 讓它逃出吞噬體。侵入型大腸桿菌與肉毒桿菌的致病力和溶血無關。"},{"id":"113-2-6102-32","p":"113-2-6102","n":32,"q":"下列何種環境污染物不會引起貧血症狀？","o":["砷","鉛","鋁","鋅"],"a":"#","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"環境污染物與貧血","ex":"考選部更正為「一律給分」。砷、鉛可干擾血基質合成或造成溶血；鋁過量會干擾鐵的利用；鋅過量會抑制銅吸收而造成貧血，四個選項都可能引起貧血，所以沒有正確答案。"},{"id":"113-2-6102-33","p":"113-2-6102","n":33,"q":"計算食品中化學物質殘留容許量的標準時，不需使用下列何種數據？","o":["食品消耗係數","每日攝取安全容許量（ADI）","無作用劑量（NOEL）","參考劑量（RfD）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"殘留容許量的計算","ex":"殘留容許量 ＝ ADI × 體重 ÷ 食品消耗係數；ADI 由 NOEL 除以安全係數得到。依標準答案，參考劑量 RfD 不在計算中（它是美國環保署用於環境污染物的類似指標）。"},{"id":"113-2-6102-34","p":"113-2-6102","n":34,"q":"下列何種胺基酸的裂解物，常出現於高溫燒烤之素肉製品，且該物質具致突變性？","o":["絲胺酸","胱胺酸","離胺酸","色胺酸"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"高溫燒烤的致突變物","ex":"色胺酸高溫裂解產生 Trp-P-1、Trp-P-2 等異環胺，有強致突變性，在高溫燒烤的蛋白質食品（包括素肉）中可能出現。"},{"id":"113-2-6102-35","p":"113-2-6102","n":35,"q":"在酸水解黃豆的化學醬油製作過程中，可能會產生下列何種有害物質？","o":["單氯丙二醇（3-monochloropropane-1,2-diol）","異環胺類化合物（heterocyclic amines）","鄰苯二甲酸二（2-乙基己基）酯（DEHP）","順丁烯二酸酐（maleic anhydride）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"化學醬油的單氯丙二醇","ex":"以鹽酸水解植物蛋白製造醬油時，鹽酸與原料中的脂質（甘油）反應產生單氯丙二醇（3-MCPD），可能致癌，我國訂有限量。"},{"id":"113-2-6102-36","p":"113-2-6102","n":36,"q":"具細胞毒性的蕈類毒性大，誤食時致死率高。有關這類食物中毒，下列敘述何者正確？","o":["蟾蜍色胺（bufotenin）是一種細胞毒素","條蕈（Amanita phalloides）上的phallotoxin經細胞酵素代謝後會產生導致肝細胞受損","具細胞毒性的蕈類一般色彩鮮豔容易辨認","此類蕈類毒素對熱不安定"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"細胞毒性蕈類","ex":"毒鵝膏（Amanita phalloides）含鵝膏毒素與鬼筆毒素，破壞肝細胞，致死率高，毒素耐熱，外觀不一定鮮豔。蟾蜍色胺是神經毒素（引起幻覺），不是細胞毒素。"},{"id":"113-2-6102-37","p":"113-2-6102","n":37,"q":"下列何者不是合法之食用色素？","o":["紅色七號（erythrosine）","紅色二號（orange B）","黃色四號（tartrazine）","黃色五號（sunset yellow）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"合法的食用色素","ex":"我國准用的煤焦色素包括紅色六號、七號、四十號，黃色四號、五號，綠色三號，藍色一號、二號。Orange B（題目稱紅色二號）不在准用名單中。"},{"id":"113-2-6102-38","p":"113-2-6102","n":38,"q":"黃變米（yellowed rice）主要是由下列那一屬的微生物污染所致？","o":["Rhizopus","Fusarium","Penicillium","Claviceps"],"a":"C","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"黃變米","ex":"黃變米是米在貯存中被青黴菌屬（如 P. citreonigrum、P. islandicum、P. citrinum）污染，產生黃色並含黃綠青黴素、橘青黴素等毒素。"},{"id":"113-2-6102-39","p":"113-2-6102","n":39,"q":"細菌生長曲線四個時期中，那一個時期的菌數最沒有變化，但細胞大小會有改變，如能即時控制將可降低食安事件的發生率？","o":["遲滯期（lag phase）","對數期（log phase）","穩定期（stationary phase）","死亡期（death phase）"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"細菌的生長曲線","ex":"遲滯期細菌適應新環境、合成酵素，細胞變大但數目幾乎不增加。此時立即冷藏或加熱，可以阻止細菌進入快速增殖的對數期。"},{"id":"113-2-6102-40","p":"113-2-6102","n":40,"q":"河豚毒素屬於神經性毒素，通常在河豚的那一部位其毒素含量最低？","o":["卵巢","魚腸","魚肝","魚肉"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"河豚毒素的分布","ex":"河豚毒素以卵巢、肝臟含量最高，其次是腸與皮膚，魚肉含量最低（部分種類的肉也可能有毒）。"},{"id":"113-2-6102-41","p":"113-2-6102","n":41,"q":"依據食品良好衛生規範準則，有關食品製程及儲存之溫度管理，下列敘述何者錯誤？","o":["冷藏是指7℃以下，凍結點以上","熱藏需在55℃以上","冷凍是指-18℃以下","低溫食品理貨及裝卸應在15℃以下之場所進行"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"溫度管理的定義","ex":"依食品良好衛生規範準則：冷藏 7℃ 以下、凍結點以上；冷凍 −18℃ 以下；熱藏 60℃ 以上；低溫食品理貨裝卸在 15℃ 以下進行。熱藏是 60℃，不是 55℃。"},{"id":"113-2-6102-42","p":"113-2-6102","n":42,"q":"下列何者不是「食品從業人員正確洗手步驟」所需之設施及物品？","o":["擦手紙與腳踏開蓋式垃圾桶","流動自來水","洗手乳與菜瓜布","烘手機與液體肥皂"],"a":"C","c":"食品衛生與安全","c2":"團體膳食製備","ch":"衛生管理與 HACCP","ch2":"衛生與安全","t":"正確洗手的設施","ex":"洗手設施需要流動自來水、液體清潔劑、擦手紙或烘手機，以及不用手開蓋的垃圾桶。菜瓜布容易藏污納垢、不衛生，不是洗手用品。"},{"id":"113-2-6102-43","p":"113-2-6102","n":43,"q":"若實施食品安全管制系統，下列有關人員教育訓練之敘述，何者錯誤？","o":["當年度之HACCP持續教育時數可抵免衛生講習時數","依規定設置之專門職業人員要受HACCP訓練課程至少30小時，且領有合格證書","管制小組成員三年至少12小時的HACCP持續教育","管理衛生人員要受HACCP訓練課程60小時並領有合格證書"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 人員訓練","ex":"依標準答案 D 錯：管理衛生人員並沒有要求受 60 小時 HACCP 訓練。管制小組成員與專門職業人員要受 30 小時以上訓練並領證，之後每 3 年至少 12 小時持續教育，可抵免衛生講習時數。"},{"id":"113-2-6102-44","p":"113-2-6102","n":44,"q":"有關食品管理之敘述，下列何者正確？","o":["先進先出是以進貨日期為準而不是有效日期","定期檢查食品有效期限，過期品予以拆封銷毀","過期兩天的罐頭食品外觀還是正常者，可以送給弱勢族群以免浪費","拆封後的食品保存狀態佳者，其保存期限跟包裝標示一樣"],"a":"B","c":"團體膳食製備","c2":"食品衛生與安全","ch":"貯存與庫房管理","ch2":"食品安全衛生法規","t":"食品的有效期限管理","ex":"要定期檢查有效期限，過期品應拆封銷毀，以免流入市面。先進先出最好以有效日期為準（先到期先出）；過期食品不得贈送；開封後的保存期限會縮短。"},{"id":"113-2-6102-45","p":"113-2-6102","n":45,"q":"依據食品良好衛生規範準則，有關運輸管制之敘述，下列何者錯誤？","o":["為達到最有效之運輸效率並確保穩固，物品應充分緊密堆疊","車輛於裝載前應檢查其裝備，並保持清潔衛生","運輸有污染成品、半成品或原料之虞的物品或包裝材料，應做好措施以防止交叉污染","運輸過程應避免日照、雨淋與撞擊等，並保持穩定的溫濕度"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"運輸的衛生管理","ex":"運輸時物品應有序堆疊並保留空間，讓冷氣循環、避免擠壓，不是越緊密越好。車輛要清潔，防止交叉污染，避免日照雨淋。"},{"id":"113-2-6102-46","p":"113-2-6102","n":46,"q":"有關餐飲作業場所動線規劃，下列何者錯誤？","o":["人流：配膳區→烹調區→洗滌區","物流：驗收區→烹調區→配膳區","水流：加工調理區→內包裝室→外包裝室","氣流：配膳區→烹調區→洗滌區"],"a":"C","c":"團體膳食製備","c2":"食品衛生與安全","ch":"衛生與安全","ch2":"衛生管理與 HACCP","t":"作業場所的動線","ex":"人流與氣流應由清潔區流向污染區（配膳 → 烹調 → 洗滌）；物流由驗收往配膳。水流（排水）也應由清潔度高的區域流向清潔度低的區域，內包裝室清潔度最高，所以 C 的方向反了。"},{"id":"113-2-6102-47","p":"113-2-6102","n":47,"q":"脂質過度加熱會導致甘油劣變，生成下列何種刺激性物質？","o":["聚碳酸酯（polycarbonate）","偏二氯乙烯（vinylidene chloride）","異環胺類化合物（heterocyclic amines）","丙烯醛（acrolein）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"油脂過熱產生丙烯醛","ex":"油脂過度加熱時，甘油脫水形成丙烯醛，有強烈刺激性，會刺激眼睛與呼吸道，也是油煙的有害成分。"},{"id":"113-2-6102-48","p":"113-2-6102","n":48,"q":"我國對於基因改造食品的標示管理，下列敘述何者正確？","o":["非基因改造食品原料非有意攙入基因改造食品原料超過3％，須標示「基因改造」等字樣","以基因改造食品原料製造之高層次加工品（如黃豆油、醬油、玉米糖漿等），得免標示「基因改造」等字樣","散裝食品可以不用標示「基因改造」等字樣","我國生產的咖啡豆因為確實不是基因改造食品，所以能自行宣稱「非基因改造」"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"基因改造食品的標示","ex":"非故意攙入基因改造原料超過 3% 就要標示「基因改造」。高層次加工品（黃豆油、醬油、玉米糖漿）也要標示；散裝食品也要標示；沒有基因改造品種的作物（如咖啡豆）不得宣稱「非基因改造」。"},{"id":"113-2-6102-49","p":"113-2-6102","n":49,"q":"認定基因改造食品具有「實質等同」，主要取決於下列那兩項特性？①遺傳表現型　②組成分　③過敏原　④標識基因　⑤病原性","o":["①②","③④","④⑤","①⑤"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"實質等同原則","ex":"實質等同是比較基因改造食品與傳統食品的遺傳表現型（性狀）與組成分（營養素、抗營養因子、天然毒素），兩者相同就視為一樣安全。"},{"id":"113-2-6102-50","p":"113-2-6102","n":50,"q":"依據包裝食品營養宣稱應遵行事項之規定，「可補充攝取」營養宣稱之營養素，不包括下列何者？","o":["維生素A","維生素C","維生素D","維生素E"],"a":"C","c":"食品衛生與安全","c2":"公共衛生營養學","ch":"食品安全衛生法規","ch2":"飲食指標與營養標示","t":"「可補充攝取」的營養宣稱","ex":"依標準答案，維生素 D 不在「可補充攝取」營養宣稱的營養素中。"}]};

    var cnt = function (c) { return Q.filter(function (q) { return inCourse(q, c); }).length; };
    var all = G ? Q.filter(function (q) { return inGroup(q, G); }).length : Q.length;
    h += '<div class="lab">上課科目</div><div id="s_course"><div class="chips"><button type="button" data-v="" class="' + (S.course ? '' : 'on') + '">' + (G ? '這一類全部' : '全部') + '<span class="c">' + all + '</span></button></div>' +
      (G ? [G] : GROUPS).map(function (g) {
        return '<div class="glab">' + esc(g.name) + '</div><div class="chips">' + g.courses.map(function (c) { var n = cnt(c);
          return '<button type="button" data-v="' + esc(c) + '" class="' + (c === S.course ? 'on' : '') + '"' + (n ? '' : ' disabled') + '>' + esc(c) + '<span class="c">' + n + '</span></button>'; }).join('') + '</div>';
      }).join('') + '</div>' + (G ? '<button type="button" class="lnk" id="allg">看全部科目</button>' : '');
    var chs = S.course ? (CHAPTERS[S.course] || []).map(function (ch) { return [ch, Q.filter(function (q) { return inChapter(q, S.course, ch); }).length]; }).filter(function (x) { return x[1] > 0; }) : [];
    if (chs.length) h += '<div class="lab">章節</div><div class="chips" id="s_chapter"><button type="button" data-v="" class="' + (S.chapter ? '' : 'on') + '">全部</button>' +
      chs.map(function (x) { return '<button type="button" data-v="' + esc(x[0]) + '" class="' + (x[0] === S.chapter ? 'on' : '') + '">' + esc(x[0]) + '<span class="c">' + x[1] + '</span></button>'; }).join('') + '</div>';
  } else {
    h += '<div class="lab">國考試卷</div>' + PAPERS.map(function (p) { return '<button type="button" class="paper' + (p.id === S.paper ? ' on' : '') + '" data-p="' + esc(p.id) + '"><b>' + esc(paperName(p)) + '</b><span>' + Q.filter(function (q) { return q.p === p.id; }).length + ' 題</span></button>'; }).join('');
  }
  var n = pool().length, size = S.size === 'all' ? n : Math.min(+S.size, n);
  h += '<div class="lab">題數</div>' + seg('s_size', [[10, '10 題'], [20, '20 題'], ['all', '全部']], S.size) +
    '<div class="lab">出題順序</div>' + seg('s_order', [['rand', '隨機'], ['no', '照題號']], S.order) +
    '<div class="lab">對答案與看解析的時機</div>' + seg('s_mode', [['now', '每題作答後'], ['end', '全部寫完交卷後']], S.mode) +
    '<div style="margin-top:16px"><button type="button" class="btn" id="go"' + (n ? '' : ' disabled') + '>' + (n ? '開始測驗（' + size + ' 題）' : '這個範圍目前沒有題目') + '</button></div>' +
    '<div class="small muted" style="margin-top:8px;text-align:center">這個範圍共 ' + n + ' 題</div></div>';

  var done = Q.filter(function (q) { return REC[q.id]; }).length, wl = wrongList();
  h += '<div class="card pad"><h2>我的紀錄</h2>';
  if (!STORE_OK) h += '<div class="small muted">這個瀏覽器無法儲存資料，作答紀錄與錯題不會保留；請改用手機的 Chrome 或 Safari 開啟。</div>';
  else h += '<div class="grid3" style="margin-top:8px"><div class="stat"><span>做過的題目</span><b>' + done + '</b> ／' + Q.length + '</div><div class="stat"><span>目前錯題</span><b>' + wl.length + '</b> 題</div>' +
    '<div class="stat"><span>累計作答</span><b>' + Q.reduce(function (s, q) { return s + (REC[q.id] ? REC[q.id].n : 0); }, 0) + '</b> 次</div></div>' +
    '<div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="redo"' + (wl.length ? '' : ' disabled') + '>練習錯題</button><button type="button" class="btn warn" id="clr"' + (done ? '' : ' disabled') + '>清除紀錄</button></div>' +
    '<div class="small muted" style="margin-top:8px">錯題是最後一次答錯的題目，之後答對就會從錯題移除。</div>';
  h += '</div>';
  h += '<p class="note">試題與標準答案來源：考選部「考畢試題查詢平臺」。考選部只公布答案；上課科目與章節的分類、參考解析都是自行整理，不是官方內容，僅供複習使用，若與課本或老師的說明不同，以課本與老師為準。</p>' +
    (STORE_OK ? '<p class="note">作答紀錄只存在這支手機的瀏覽器。清除瀏覽器資料、LINE 清除快取、換手機，或 iPhone 超過一週沒打開，紀錄會消失；題目不受影響。</p>' : '');
  $('main').innerHTML = h;

  onSeg('s_by', function (v) { S.by = v; savePref(); home(); });
  onSeg('s_course', function (v) { S.course = v; S.chapter = ''; home(); });
  if ($('allg')) $('allg').onclick = function () { S.group = ''; S.course = ''; S.chapter = ''; home(); };
  onSeg('s_chapter', function (v) { S.chapter = v; home(); });
  onSeg('s_size', function (v) { S.size = v === 'all' ? 'all' : +v; savePref(); home(); });
  onSeg('s_order', function (v) { S.order = v; savePref(); home(); });
  onSeg('s_mode', function (v) { S.mode = v; savePref(); home(); });
  document.querySelectorAll('.paper').forEach(function (b) { b.onclick = function () { S.paper = b.getAttribute('data-p'); home(); }; });
  $('go').onclick = function () {
    var list = S.order === 'rand' ? shuffle(pool()) : byNo(pool());
    if (S.size !== 'all') list = list.slice(0, +S.size);
    if (S.order !== 'rand') list = byNo(list);
    start(list, S.mode);
  };
  if ($('redo')) $('redo').onclick = function () { start(shuffle(wrongList()), 'now'); };
  if ($('clr')) $('clr').onclick = function () { if (confirm('確定要清除所有作答紀錄與錯題嗎？清除後無法復原。')) { REC = {}; saveRec(); home(); } };
  window.scrollTo(0, 0);
}

/* ---------- 作答 ---------- */
function start(list, mode) { if (!list.length) return; SES = { qs: list, i: 0, picks: {}, mode: mode, done: false }; showQ(); }
function answered() { return SES.qs.filter(function (q) { return SES.picks[q.id]; }).length; }
function meta(q) {
  return '<div style="margin-top:8px"><span class="tag k">' + esc(q.c) + '</span><span class="tag">' + esc(q.ch) + '</span>' + (q.c2 ? '<span class="tag">也屬於 ' + esc(q.c2) + (q.ch2 ? '・' + esc(q.ch2) : '') + '</span>' : '') + '</div>' +
    (q.t ? '<div class="small muted" style="margin-top:4px">考點：' + esc(q.t) + '</div>' : '');
}
function optHtml(q, pick, reveal, lock) {
  return KEYS.map(function (k, i) {
    var cls = '', mark = '';
    if (reveal) { if (isRight(q, k)) { cls = ' right'; mark = '正確答案'; } else if (pick === k) { cls = ' wrong'; mark = '你的答案'; } if (pick === k && isRight(q, k)) mark = '你答對了'; }
    else if (pick === k) cls = ' sel';
    return '<button type="button" class="opt' + cls + '" data-k="' + k + '"' + (lock ? ' disabled' : '') + '><span class="k">' + k + '</span><span class="x">' + esc(q.o[i]) + '</span>' + (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');
}
function expl(q) { return q.ex ? '<div class="exp"><h3>參考解析</h3>' + esc(q.ex).replace(/\n/g, '<br>') + '</div>' : ''; }
function feedback(q, pick) {
  var ok = pick && isRight(q, pick);
  return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b class="v">' + (ok ? '答對了' : pick ? '答錯了' : '未作答') + '</b>　正確答案：<b>' + esc(ansText(q)) + '</b>' + meta(q) + '</div>' + expl(q);
}
function showQ() {
  var q = SES.qs[SES.i], n = SES.qs.length, pick = SES.picks[q.id], now = SES.mode === 'now', reveal = now && !!pick, last = SES.i === n - 1, p = paperOf(q);
  head('第 ' + (SES.i + 1) + ' ／ ' + n + ' 題', now ? '每題作答後對答案' : '已作答 ' + answered() + ' 題・交卷後對答案', true);
  $('progi').style.width = ((SES.i + (pick ? 1 : 0)) / n * 100) + '%';
  var h = '<div class="card pad"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' +
    '<div class="qt">' + esc(q.q) + '</div>' + optHtml(q, pick, reveal, reveal) + (reveal ? feedback(q, pick) : '') + '</div>';
  h += '<div class="foot"><div class="row">';
  if (now) h += '<button type="button" class="btn" id="nx"' + (pick ? '' : ' disabled') + '>' + (last ? '看成績' : '下一題') + '</button>';
  else h += '<button type="button" class="btn plain" id="pv"' + (SES.i ? '' : ' disabled') + '>上一題</button>' + (last ? '<button type="button" class="btn" id="fin">交卷</button>' : '<button type="button" class="btn" id="nx">下一題</button>');
  h += '</div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () {
    if (now && SES.picks[q.id]) return;
    SES.picks[q.id] = b.getAttribute('data-k'); if (now) record(q, SES.picks[q.id]);
    var y = window.pageYOffset; showQ(); window.scrollTo(0, y);
  }; });
  if ($('nx')) $('nx').onclick = function () { if (last) finish(); else { SES.i++; showQ(); window.scrollTo(0, 0); } };
  if ($('pv')) $('pv').onclick = function () { SES.i--; showQ(); window.scrollTo(0, 0); };
  if ($('fin')) $('fin').onclick = function () { var left = n - answered(); if (!left || confirm('還有 ' + left + ' 題沒有作答，確定要交卷嗎？')) finish(); };
}
$('quit').onclick = function () {
  if (!SES) return;
  var a = answered();
  if (!a) { home(); return; }
  if (SES.mode === 'now') { if (confirm('要結束這次測驗嗎？已作答的 ' + a + ' 題會算成績。')) finish(); }
  else if (confirm('要結束這次測驗嗎？\n\n按「確定」交卷看成績，按「取消」繼續作答。')) finish();
};
function finish() {
  if (SES.mode === 'end' && !SES.done) SES.qs.forEach(function (q) { if (SES.picks[q.id]) record(q, SES.picks[q.id]); });
  SES.done = true; SES.show = 'all'; result(); window.scrollTo(0, 0);
}

/* ---------- 成績 ---------- */
function result() {
  var qs = SES.qs, right = 0, wrong = 0, none = 0, by = {}, order = [];
  qs.forEach(function (q) {
    var k = SES.picks[q.id], key = q.c + '・' + q.ch; if (!by[key]) { by[key] = [0, 0]; order.push(key); }
    if (!k) { none++; return; } by[key][1]++; if (isRight(q, k)) { right++; by[key][0]++; } else wrong++;
  });
  var done = right + wrong, pct = done ? Math.round(right / done * 100) : 0;
  head('測驗結果', '共 ' + qs.length + ' 題', false);
  var h = '<div class="card pad"><div class="grid3"><div class="stat hl"><span>答對率</span><b>' + pct + '</b> %</div><div class="stat"><span>答對</span><b>' + right + '</b> 題</div><div class="stat"><span>答錯</span><b>' + wrong + '</b> 題</div></div>' +
    '<div class="small muted" style="margin-top:8px">答對率 ＝ 答對 ÷ 已作答的 ' + done + ' 題' + (none ? '；另有 ' + none + ' 題未作答，不列入計算' : '') + '。</div>' +
    '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="again"' + (wrong ? '' : ' disabled') + '>再練這次的錯題</button><button type="button" class="btn" id="back">回首頁</button></div></div>';
  var keys = order.filter(function (k) { return by[k][1]; });
  if (keys.length > 1) h += '<div class="card pad"><h2>各章節表現</h2><table style="margin-top:4px"><tr><th>科目・章節</th><th>答對</th><th>作答</th></tr>' +
    keys.sort(function (a, b) { return by[a][0] / by[a][1] - by[b][0] / by[b][1]; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + by[k][0] + '</td><td>' + by[k][1] + '</td></tr>'; }).join('') + '</table></div>';
  h += seg('r_show', [['all', '全部 ' + qs.length], ['bad', '答錯 ' + wrong]], SES.show);
  var list = qs.filter(function (q) { var k = SES.picks[q.id]; return SES.show === 'all' || (k && !isRight(q, k)); });
  h += '<div class="card">' + (list.length ? list.map(function (q) {
    var k = SES.picks[q.id], ok = k && isRight(q, k), p = paperOf(q);
    return '<details class="rv"><summary><span class="mk ' + (!k ? 'na' : ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (!k ? '－' : ok ? '○' : '✕') + '</span><div class="st"><div class="q1">' + esc(q.q) + '</div>' +
      '<div class="small muted" style="margin-top:2px">' + (!k ? '未作答' : ok ? '答對' : '答錯') + '・你的答案 ' + (k || '—') + '・正確答案 ' + esc(ansText(q)) + '</div></div></summary>' +
      '<div class="bd"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' + optHtml(q, k, true, true) + meta(q) + expl(q) + '</div></details>';
  }).join('') : '<div class="empty">這次沒有答錯的題目</div>') + '</div><p class="note">點題目可以看選項、正確答案與參考解析。</p>';
  $('main').innerHTML = h;
  onSeg('r_show', function (v) { SES.show = v; var y = window.pageYOffset; result(); window.scrollTo(0, y); });
  $('back').onclick = home;
  $('again').onclick = function () { start(shuffle(qs.filter(function (q) { var k = SES.picks[q.id]; return k && !isRight(q, k); })), 'now'); window.scrollTo(0, 0); };
}

home();
</script>
</body>
</html>
