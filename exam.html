:["學習者的興趣能力","具體可行的評估方法","誘發學習動機","學習者的起點行為"],"a":"C","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"教學目標的訂定","ex":"訂定教學目標要考慮學習者的起點行為、興趣和能力，目標也要具體、可以評量。誘發學習動機是教學活動的設計，不是訂定目標時考慮的事項。"},{"id":"115-1-5102-29","p":"115-1-5102","n":29,"q":"一減重班課程，講師提出統計數據說明肥胖會增加日後中風機率，並播放中風患者的血管阻塞影片。這個課程活動設計是針對那個飲食行為改變的中介因子？","o":["意識覺醒","自覺危機","社會規範","自我效能"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"健康信念模式的自覺危機","ex":"用統計數據和影片讓學員感受到「自己可能會得」而且「後果很嚴重」，是在提高健康信念模式中的自覺危機（自覺罹患性加上自覺嚴重性）。"},{"id":"115-1-5102-30","p":"115-1-5102","n":30,"q":"使用教學媒體（media）為營養教育的工具，其優點不包含下列那一項？","o":["可短時間傳遞內容給學習者，提高學習效率","記憶保留率較採用觀看法的教學方式高","教學者事先進行內容整理、組織，可節省教學時間","不受場地設備與空間大小影響"],"a":"D","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"教學媒體的優缺點","ex":"使用教學媒體需要相對應的設備、電力和合適的場地，會受到場地設備與空間大小的限制。"},{"id":"115-1-5102-31","p":"115-1-5102","n":31,"q":"依據跨理論模式（Transtheoretical Model），如果一個人運動行為改變階段正處於無意圖期，下列那些有利於改變歷程的介入方法較適用？①增強管理　②自我再評估　③刺激控制　④戲劇慰藉　⑤環境再評估","o":["①④","④⑤","①②","②③"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養教育與行為理論","ch2":"","t":"跨理論模式的改變階段與改變歷程","ex":"無意圖期的人還不認為自己需要改變，適合用認知與情感層面的歷程：意識覺醒、戲劇慰藉（情感喚起）和環境再評估。自我再評估用在意圖期；增強管理和刺激控制是行動期、維持期用的行為層面歷程。"},{"id":"115-1-5102-32","p":"115-1-5102","n":32,"q":"實施體重控制介入計畫中，「體重的改變」是屬於PRECEDE-PROCEED模式的那一種評價？","o":["過程評價（process evaluation）","結果評價（outcome evaluation）","衝擊評價（impact evaluation）","形式評價（format evaluation）"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"PRECEDE-PROCEED 模式的評價類型","ex":"過程評價看的是計畫有沒有照規劃執行；衝擊評價看知識、態度、行為等立即的改變；結果評價看健康狀況與生活品質等最終成效。體重的改變屬於健康狀況，是結果評價。"},{"id":"115-1-5102-33","p":"115-1-5102","n":33,"q":"針對社區老人進行健康促進計畫時，衛教肌少症的飲食與運動，此為計畫的那個步驟？","o":["確認問題","訂定目標","執行計畫","評價計畫"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社區營養計畫的步驟","ex":"實際對社區老人進行衛教，是在執行計畫。"},{"id":"115-1-5102-34","p":"115-1-5102","n":34,"q":"下列何者非社區營養計畫的策略性規劃可利用的4M？","o":["預算（Money）","期間（Meantime）","物質設備（Materials）","行銷（Marketing）"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫規劃可用的資源 4M","ex":"規劃計畫時可運用的資源 4M 是人力（Manpower）、預算（Money）、物質設備（Materials）和時間（Meantime）。行銷不在其中。"},{"id":"115-1-5102-35","p":"115-1-5102","n":35,"q":"社區關懷中心今年舉辦延緩失能講座，共花費300萬元，完成30場講座，拍攝2支宣導短片及舉辦一場園遊會，此為何種計畫評價？","o":["效果","效能","效率","效益"],"a":"C","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫評價：效率","ex":"拿投入的資源（300 萬元）和產出（30 場講座、2 支短片、1 場園遊會）來比較，評的是效率。效果或效能看的是目標達成多少；效益是把成果換算成金錢價值。"},{"id":"115-1-5102-36","p":"115-1-5102","n":36,"q":"為了降低成人肥胖問題，在社區規劃為期三個月的「體重控制飲食與健康課程」，目標設立為三個月後有30％參與者體重下降2公斤或更多，這個目標屬於下列何者？","o":["願景","結果目標","過程目標","結構目標"],"a":"B","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"計畫目標的類型","ex":"結果目標描述的是計畫結束後，目標族群在健康或營養狀況上要達到的改變，例如體重下降多少。過程目標是活動的執行情形；結構目標是人力、經費、設備等資源。"},{"id":"115-1-5102-37","p":"115-1-5102","n":37,"q":"利用企業的策略行銷觀念應用在社區營養計畫，下列那一個步驟可以清楚了解目標族群的需求（needs & wants）？","o":["確認問題","區分特定族群","市場混合多樣化","對社區居民的研究與分析"],"a":"D","c":"公共衛生營養學","c2":"","ch":"社區營養計畫","ch2":"","t":"社會行銷的步驟","ex":"社會行銷以消費者為中心，要了解目標族群的需求，就必須先對社區居民做研究與分析。"},{"id":"115-1-5102-38","p":"115-1-5102","n":38,"q":"有關民國106～109年國民營養健康狀況變遷調查，骨質密度檢測的敘述，下列何者正確？","o":["停經後T-score為-1.5的個案，建議應適度運動，並多攝取含鈣及維生素D的食物或補充品","對於20歲以下個案，使用T-score與同性別、同年齡的骨質密度做比較","檢測後T-score為-2.0代表骨質疏鬆症（osteoporosis）","以「可攜式定量超音波骨密度儀（quantitative ultrasound, QUS）」進行骨質密度檢測"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"骨質密度的判讀","ex":"T 值在 −1.0 到 −2.5 之間是骨質缺乏，建議運動並補足鈣與維生素 D，A 正確。B：20 歲以下要用 Z 值和同齡者比較。C：T 值要低於或等於 −2.5 才是骨質疏鬆症。D：這次調查是用雙能量 X 光吸收儀檢測。"},{"id":"115-1-5102-39","p":"115-1-5102","n":39,"q":"比較民國102～105年與106～109年兩次國民營養健康狀況變遷調查，19歲以上成人慢性疾病罹患情形，下列敘述何者錯誤？","o":["高血壓盛行率小幅上升","糖尿病盛行率下降","高血脂盛行率上升","代謝症候群盛行率上升"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國民營養調查的慢性病盛行率變化","ex":"兩次調查相比，成人的高血壓、糖尿病、高血脂和代謝症候群盛行率都是上升，糖尿病並沒有下降。"},{"id":"115-1-5102-40","p":"115-1-5102","n":40,"q":"我國自那一年的全國營養調查首次採用實際食物測量進行家庭膳食攝取狀況、兒童身體發育調查？","o":["1972年","1980年","1986年","1993年"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次全國營養調查的沿革","ex":"依標準答案，是 1980 年（民國 69 年）開始的第一次全國營養調查。"},{"id":"115-1-5102-41","p":"115-1-5102","n":41,"q":"依據民國106～109年國民營養健康狀況變遷調查，下列何種營養素之攝取量依國人性別、年齡別均達到100％ DRIs之建議？","o":["維生素E","維生素B12","維生素B2","維生素D"],"a":"B","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"國人營養素攝取狀況","ex":"國人維生素 B12 的攝取量在各性別與年齡層都超過建議量。維生素 D、維生素 E 和鈣是普遍攝取不足的營養素。"},{"id":"115-1-5102-42","p":"115-1-5102","n":42,"q":"有關歷次全國營養調查之敘述，下列何者錯誤？","o":["1986～1988年開始進行全國營養調查","1993～1996年將全國營養調查更名為「國民營養健康狀況變遷調查」","2012年以前由衛生福利部食品藥物管理署（原行政院衛生署食品衛生處）委辦調查","2013年後由衛生福利部國民健康署委辦"],"a":"A","c":"公共衛生營養學","c2":"","ch":"營養調查與監測","ch2":"","t":"歷次全國營養調查的沿革","ex":"臺灣第一次全國營養調查是 1980～1981 年，1986～1988 年已經是第二次，所以 A 說「開始進行」是錯的。"},{"id":"115-1-5102-43","p":"115-1-5102","n":43,"q":"世界衛生組織針對反式脂肪酸的六項行動REPLACE中的「A」代表什麼？","o":["Assess－評估食物供應鏈的反式脂肪酸與民眾反式脂肪酸攝取量","Aim－設定反式脂肪酸的目標","Accessibility－降低反式脂肪酸可近性","Affordability－透過課稅提高經濟負擔"],"a":"A","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"世界衛生組織的反式脂肪 REPLACE 行動","ex":"REPLACE 六項行動是：REview 檢視來源、Promote 推廣替代油脂、Legislate 立法、Assess 評估與監測、Create awareness 提高意識、Enforce 落實執法。A 代表評估與監測。"},{"id":"115-1-5102-44","p":"115-1-5102","n":44,"q":"有關糧食不安全經驗量表（Food Insecurity Experience Scale, FIES），下列何者錯誤？","o":["能反映個人或家戶取得食物的能力","用來評估食品安全事件相關後遺症","具跨文化共同性，可提供國際比較","是聯合國農糧署針對永續發展目標2（Zero hunger）採用的監測指標之一"],"a":"B","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"糧食不安全經驗量表","ex":"這個量表衡量的是個人或家戶取得足夠食物的困難程度，也就是糧食安全（food security），和食品安全事件（food safety）無關。"},{"id":"115-1-5102-45","p":"115-1-5102","n":45,"q":"下列那一項不是世界衛生組織全球2025年母親與嬰幼兒營養的目標（Global 2025 Target）？","o":["增加出生6個月內完全哺育母乳率","降低5歲以下孩童生長遲緩（stunting）","降低兒童肥胖率","降低育齡婦女貧血比例"],"a":"C","c":"公共衛生營養學","c2":"","ch":"國際營養","ch2":"","t":"世界衛生組織 2025 全球營養目標","ex":"2025 全球營養目標有六項：降低兒童生長遲緩、降低育齡婦女貧血、降低低出生體重、兒童過重「不再增加」、提高純母乳哺育率、降低兒童消瘦。兒童過重的目標是不增加，不是降低。"},{"id":"115-1-5102-46","p":"115-1-5102","n":46,"q":"政府呼籲國人每年接受季節性流感疫苗注射以降低感染風險，是屬於疾病預防措施的那一階段？","o":["第一段第一級","第一段第二級","第二段第三級","第三段第四級"],"a":"B","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"三段五級預防","ex":"三段五級：第一段有第一級健康促進和第二級特殊保護；第二段是第三級早期診斷與早期治療；第三段有第四級限制殘障和第五級復健。接種疫苗是針對特定疾病的特殊保護，屬於第一段第二級。"},{"id":"115-1-5102-47","p":"115-1-5102","n":47,"q":"世界衛生組織歸納四個增加「非傳染性慢性疾病（Noncommunicable diseases）」風險的代謝危險因子，不包含下列何者？","o":["高血壓","體重過重與肥胖","高血糖","高尿酸"],"a":"D","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"非傳染性疾病的代謝危險因子","ex":"世界衛生組織列出的四個代謝危險因子是血壓升高、過重與肥胖、高血糖、高血脂。高尿酸不在其中。"},{"id":"115-1-5102-48","p":"115-1-5102","n":48,"q":"若要評估「我的餐盤」是否能有效降低血壓，下列那一種研究設計最具科學說服力？","o":["隨機臨床試驗","臨床個案報告","世代研究","準實驗設計"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的證據強度","ex":"隨機臨床試驗把受試者隨機分組，可以控制干擾因子，最能證明因果關係。證據強度依序是隨機試驗、準實驗、世代研究、個案報告。"},{"id":"115-1-5102-49","p":"115-1-5102","n":49,"q":"下列何者為糖尿病防治策略的二段預防（secondary prevention）工作？","o":["成人健檢","視網膜檢查","教導民眾壓力調適","推廣健康生活習慣"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"糖尿病的次段預防","ex":"次段預防是早期發現、早期治療，例如用成人健檢篩檢出血糖異常的人。視網膜檢查是已經罹病者的併發症防治，屬於三段預防；壓力調適和健康生活習慣是初段預防。"},{"id":"115-1-5102-50","p":"115-1-5102","n":50,"q":"某研究定期評估婦女之黃豆日常攝取量及是否罹癌，以了解黃豆與癌症發生之關係，下列何種研究設計最適當？","o":["世代研究法","實驗性研究法","橫斷性研究法","病例對照研究法"],"a":"A","c":"公共衛生營養學","c2":"","ch":"流行病學與研究方法","ch2":"","t":"研究設計的選擇","ex":"先定期記錄婦女的黃豆攝取量，再追蹤日後是否罹癌，是先有暴露資料、再觀察疾病發生的世代研究法。"},{"id":"115-1-6102-1","p":"115-1-6102","n":1,"q":"依據我國食品良好衛生規範準則，食品容器製造業所建立之紀錄，其保存之規定為何？","o":["製造日期後1年以上","製造日期後3年以上","有效日期後1年以上","有效日期後3年以上"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"食品良好衛生規範準則的紀錄保存","ex":"依標準答案，食品容器製造業的紀錄應保存到有效日期後 3 年以上。"},{"id":"115-1-6102-2","p":"115-1-6102","n":2,"q":"依據我國食品良好衛生規範準則，可以在常溫貯存及販賣之真空包裝即食食品之條件，不包括下列何者？","o":["水活性在0.85以下","pH值在9.0以上","pH值小於4.6之天然酸性食品","鹽濃度為5％之發酵食品"],"a":"D","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"真空包裝即食食品的常溫貯存條件","ex":"準則規定可在常溫貯存販售的條件，包括水活性 0.85 以下、pH 值 9.0 以上、經商業滅菌、pH 值小於 4.6 的天然酸性食品，以及發酵後 pH 值小於 4.6 或鹽濃度大於 10% 的發酵食品。鹽濃度只有 5% 的發酵食品不符合。"},{"id":"115-1-6102-3","p":"115-1-6102","n":3,"q":"下列有關食品安全管制系統中管制界線之敘述，何者錯誤？","o":["需考量產品內部及環境因子","可防止病原菌毒素產生","可防止病原菌生長","加工上的管制界限足以影響冷卻速率"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 的管制界限","ex":"依標準答案，C 的敘述是錯的。管制界限是在重要管制點上區分可接受與不可接受的基準，例如溫度、時間、酸鹼值、水活性。"},{"id":"115-1-6102-4","p":"115-1-6102","n":4,"q":"食品安全管制系統計畫書中，須進行產品描述及貯運方式，下列何者不屬於產品特性？","o":["即食性","水活性","pH值","包裝方式"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"HACCP 計畫書的產品描述","ex":"產品描述中的「產品特性」是指產品本身的性質，例如成分、酸鹼值、水活性、是否為即食食品。包裝方式是另外列出的項目，和貯存、運送方式一樣不屬於產品特性。"},{"id":"115-1-6102-5","p":"115-1-6102","n":5,"q":"依據我國包裝食品營養宣稱應遵行事項，包裝食品每100毫升液體之糖含量低於多少公克時，得標示為無糖？","o":["0.5","0.7","0.9","1.0"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"「無糖」的營養宣稱標準","ex":"每 100 公克固體或每 100 毫升液體所含的糖不超過 0.5 公克，才可以標示「無糖」。"},{"id":"115-1-6102-6","p":"115-1-6102","n":6,"q":"依據我國食品安全管制系統準則，下列何項符合「食品安全管制小組成員」之規定？","o":["食品業者負責人與其指定人員，共2人","食品業者負責人與專門職業人員，共2人","食品業者負責人、專門職業人員、生產線幹部，共3人","專門職業人員、衛生管理人員、品質管制人員，共3人"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食品安全管制小組的成員","ex":"管制小組的成員至少 3 人，負責人或他指定的人員是必要成員，另外包括品保、生產、衛生管理人員或專門職業人員等。C 的組成符合規定。"},{"id":"115-1-6102-7","p":"115-1-6102","n":7,"q":"微生物之間可以同時存在，但不會幫助或阻礙彼此的生長，此種現象稱為下列何者？","o":["拮抗作用","共生作用","加乘作用","寄生作用"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"微生物之間的交互作用","ex":"依標準答案為共生作用。拮抗作用是互相抑制，加乘作用是互相促進，寄生作用是一方得利、另一方受害。"},{"id":"115-1-6102-8","p":"115-1-6102","n":8,"q":"食品安全性評估常利用動物實驗結果進行推估，因動物福祉科學，國際間針對實驗動物推動3R原則。下列何者不屬於3R原則的範疇？","o":["減量（Reduction）","負責（Responsibility）","精緻化（Refinement）","替代（Replacement）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"動物實驗的 3R 原則","ex":"實驗動物的 3R 是替代（Replacement）、減量（Reduction）、精緻化（Refinement）。負責不在其中。"},{"id":"115-1-6102-9","p":"115-1-6102","n":9,"q":"有關慢性毒性試驗結果的敘述，下列何者錯誤？","o":["可推算無毒害作用劑量","可推算最低毒害作用劑量","可推估物質的每日攝取容許量","可用來推算半致死劑量"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"慢性毒性試驗的用途","ex":"半致死劑量是由急性毒性試驗求得的。慢性毒性試驗可以得到無毒害作用劑量和最低毒害作用劑量，再除以安全係數推估每日攝取容許量。"},{"id":"115-1-6102-10","p":"115-1-6102","n":10,"q":"安全性屬於第三類的健康食品審查時，無須提供下列何項安全性評估試驗報告？","o":["基因毒性試驗","90天餵食毒性試驗","致畸胎試驗","致癌性試驗"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"健康食品安全性分類與試驗項目","ex":"健康食品的安全性分四類。第三類要做基因毒性試驗、90 天餵食毒性試驗和致畸胎試驗；致癌性試驗和繁殖試驗是第四類才需要。"},{"id":"115-1-6102-11","p":"115-1-6102","n":11,"q":"有關直接使用於消毒或洗滌食品、食品容器及食品包裝之洗潔劑的敘述，下列何者錯誤？","o":["我國以支鏈式烷基苯磺酸鹽的硬性洗潔劑為主","軟性洗潔劑毒性較硬性洗潔劑強，但在環境中易受微生物分解","部分洗潔劑會造成動物肝功能受損或皮膚的刺激","洗潔劑及其含有之輔助劑易造成生態污染"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"食品用洗潔劑的種類","ex":"我國使用的是直鏈式烷基苯磺酸鹽這類軟性洗潔劑，容易被微生物分解。支鏈式的硬性洗潔劑不易分解，會污染環境，早已不使用。"},{"id":"115-1-6102-12","p":"115-1-6102","n":12,"q":"有關我國食品業者使用漂白劑的敘述，下列何者符合法規？","o":["亞硫酸鹽用於免洗竹筷之漂白","吊白塊用於米粉之漂白及防腐","螢光增白劑用於洋菇及吻仔魚之增白","福馬林用於蘿蔔乾之漂白及防腐"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"漂白劑的合法使用","ex":"吊白塊、螢光增白劑和福馬林都不是合法的食品添加物，不得使用於食品。依標準答案，以亞硫酸鹽處理免洗竹筷是符合法規的做法，但二氧化硫的殘留量有限制。"},{"id":"115-1-6102-13","p":"115-1-6102","n":13,"q":"洗潔劑中之壬基苯酚（nonylphenol），對哺乳類動物主要造成下列何種系統損傷？","o":["消化系統","神經系統","生殖系統","循環系統"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"壬基苯酚的毒性","ex":"壬基苯酚是環境荷爾蒙，作用類似雌激素，會干擾內分泌，主要損害生殖系統。"},{"id":"115-1-6102-14","p":"115-1-6102","n":14,"q":"有機磷農藥抑制下列何種酵素活性，影響神經傳導作用，造成急性中毒？","o":["乙醯膽鹼轉化酶（choline acetyltransferase）","乙醯膽鹼酯酶（acetylcholinesterase）","多巴胺β-羥化酶（dopamine β-hydroxylase）","單胺氧化酶（monoamine oxidase）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"有機磷農藥的中毒機轉","ex":"有機磷農藥抑制乙醯膽鹼酯酶，使乙醯膽鹼無法分解而堆積在神經突觸，造成流涎、縮瞳、肌肉顫動、呼吸困難等急性中毒症狀。"},{"id":"115-1-6102-15","p":"115-1-6102","n":15,"q":"我國進口肉品中，下列何項動物組織不得檢出萊克多巴胺？","o":["牛脂","牛肌肉","豬脂","豬肌肉"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"萊克多巴胺的殘留容許量","ex":"我國只對牛的肌肉訂有萊克多巴胺的殘留容許量；豬則訂有肌肉、脂、肝、腎等部位的容許量。沒有訂定容許量的牛脂就是不得檢出。"},{"id":"115-1-6102-16","p":"115-1-6102","n":16,"q":"下列有關於鯖科魚類中毒症（scombrotoxicosis）之敘述，何者錯誤？","o":["食用保存不當之鰹魚、沙丁魚","通常具有致命性","主要是魚體遭受細菌污染所致","因魚體產生高量組織胺而造成中毒"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"組織胺（鯖魚）中毒","ex":"鯖魚、鮪魚、鰹魚、沙丁魚等保存不當時，細菌把魚肉中的組胺酸轉變成組織胺。中毒症狀像過敏，例如臉潮紅、起疹、頭痛、腹瀉，通常在一天內恢復，很少致命。"},{"id":"115-1-6102-17","p":"115-1-6102","n":17,"q":"下列有關餐飲作業場所清潔度區分之敘述，何者錯誤？","o":["內包裝室為清潔作業區","外包裝室為一般作業區","餐具洗滌區為清潔作業區","烹調區為準清潔作業區"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"作業場所的清潔度區分","ex":"餐具洗滌區屬於一般作業區。清潔作業區是內包裝室與配膳、盛裝的區域；準清潔作業區是烹調區；一般作業區包括驗收、洗滌、外包裝和倉庫。"},{"id":"115-1-6102-18","p":"115-1-6102","n":18,"q":"依據我國小包裝食品免一部標示規定，小包裝食品如以「QR Code」或其他電子化方式揭露應標示事項，仍需在外包裝標示下列何者？","o":["品名及有效日期","原產地及應標示之原料原產地","國內負責廠商名稱及電話號碼","過敏原等相關醒語資訊"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"小包裝食品的標示","ex":"小包裝食品用 QR Code 等電子方式揭露標示內容時，包裝上仍然要標示品名和有效日期。"},{"id":"115-1-6102-19","p":"115-1-6102","n":19,"q":"食品安全管制小組在訂定重要管制點監測計畫時，應包括下列那些內容？①項目　②方法　③頻率　④矯正措施　⑤操作人員","o":["①②③⑤","①②③④","②③④⑤","①②④⑤"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"重要管制點的監測計畫","ex":"監測計畫要寫明監測的項目、方法、頻率和執行的人員。矯正措施是管制界限發生偏離時才採取的行動，是 HACCP 的另一個原則，不在監測計畫內。"},{"id":"115-1-6102-20","p":"115-1-6102","n":20,"q":"依據我國食品添加物使用範圍及限量暨規格標準，以過氧化氫做為食品添加物時，下列敘述何者正確？","o":["主要用途是作為漂白劑","本品可使用於魚肉煉製品","本品可使用於麵粉及其製品等食品中","食品中之殘留限量為1 ppm（含）以下"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"過氧化氫的使用規定","ex":"過氧化氫在我國屬於殺菌劑，可以使用於魚肉煉製品和除了麵粉及其製品以外的其他食品，但食品中不得殘留。"},{"id":"115-1-6102-21","p":"115-1-6102","n":21,"q":"關於有機酸型防腐劑，下列敘述何者正確？","o":["未解離酸的濃度愈高，抗菌效果愈好","在pH4.0～6.0之間苯甲酸鹽的抑菌效果比己二烯酸好","有機酸能抑菌主要是因為干擾細菌DNA的複製","醋酸抑制革蘭氏陽性菌之效果優於革蘭氏陰性菌"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"有機酸型防腐劑的作用","ex":"有機酸要在未解離的狀態下才能穿過微生物的細胞膜、進入細胞內發揮作用，所以未解離酸的濃度越高，也就是酸鹼值越低，抗菌效果越好。在 pH 4.0～6.0 之間，己二烯酸未解離的比例比苯甲酸高，效果比較好。"},{"id":"115-1-6102-22","p":"115-1-6102","n":22,"q":"食用冰塊必須檢驗下列那2種微生物，以符合我國食品中微生物衛生標準之規定？","o":["總生菌數、大腸桿菌","腸桿菌科、沙門氏菌","綠膿桿菌、金黃色葡萄球菌","金黃色葡萄球菌、腸炎弧菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"食用冰塊的微生物衛生標準","ex":"依標準答案，食用冰塊要檢驗腸桿菌科和沙門氏菌。"},{"id":"115-1-6102-23","p":"115-1-6102","n":23,"q":"下列何者為低溫菌，並可在以巴斯徳殺菌之冷藏鮮奶中生長？","o":["李斯特菌","沙門氏菌","金黃色葡萄球菌","產氣莢膜桿菌"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"可在冷藏溫度生長的病原菌","ex":"李斯特菌是低溫菌，在 4℃ 的冷藏溫度下仍能生長，鮮奶殺菌後如果再受到污染，它可以在冷藏期間繁殖。"},{"id":"115-1-6102-24","p":"115-1-6102","n":24,"q":"依據我國食品中微生物衛生標準之規範，下列何者為牛乳需檢查之項目？","o":["大腸桿菌","金黃色葡萄球菌腸毒素","仙人掌桿菌","耶爾辛氏菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"乳品的微生物衛生標準","ex":"依標準答案，牛乳需要檢查金黃色葡萄球菌腸毒素。這種腸毒素耐熱，加熱殺菌無法破壞。"},{"id":"115-1-6102-25","p":"115-1-6102","n":25,"q":"有關絕對厭氧菌（obligate anaerobes）之敘述，下列何者錯誤？","o":["氧氣對此類細菌有毒害","啤酒酵母菌為絕對厭氧菌","梭菌屬（Clostridium spp.）為厭氧菌","可由發酵途徑生產能量"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"絕對厭氧菌","ex":"啤酒酵母菌是兼性厭氧菌，有氧時行有氧呼吸，無氧時行酒精發酵，不是絕對厭氧菌。梭菌屬才是絕對厭氧菌。"},{"id":"115-1-6102-26","p":"115-1-6102","n":26,"q":"低溫貯存的肉品產生綠變現象，是因為下列何種物質與肌紅素作用所致？","o":["乙酸","氫氣","硫化氫","碳酸鹽"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"肉品腐敗的綠變","ex":"低溫下某些細菌分解含硫胺基酸產生硫化氫，硫化氫和肌紅素結合成綠色的硫肌紅素，使肉品變綠。"},{"id":"115-1-6102-27","p":"115-1-6102","n":27,"q":"下列四種化學物質半有效劑量（ED50）與半致死劑量（LD50）資料中，請以治療指數（therapeutic index）判定何者於使用上最為安全？","o":["ED50：0.1；LD50：500","ED50：1；LD50：100","ED50：10；LD50：10","ED50：100；LD50：1"],"a":"A","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"治療指數","ex":"治療指數 ＝ 半致死劑量 ÷ 半有效劑量，數值越大越安全。A 是 500 ÷ 0.1 ＝ 5,000，B 是 100，C 是 1，D 是 0.01，所以 A 最安全。"},{"id":"115-1-6102-28","p":"115-1-6102","n":28,"q":"有關食品安全性評估之急性毒性試驗中，下列敘述何者錯誤？","o":["急毒性試驗結果通常為短期試驗，一般不超過14天","急毒性試驗結果可用半致死劑量（LD50）表示","評估產品時，半致死劑量（LD50）越大，產品的危險性越高","其結果可用於決定慢性毒性試驗的劑量"],"a":"C","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"急性毒性試驗與半致死劑量","ex":"半致死劑量越大，表示要吃到越多才會造成半數動物死亡，毒性越低，產品越安全。C 說反了。"},{"id":"115-1-6102-29","p":"115-1-6102","n":29,"q":"下列塑膠材料何者適合製成可微波之食品容器？","o":["聚乙烯（polyethylene）","聚苯乙烯（polystyrene）","聚丙烯（polypropylene）","聚氯乙烯（polyvinylchloride）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"塑膠材質的耐熱性","ex":"聚丙烯（PP）的耐熱溫度約 100～140℃，可以微波。聚乙烯和聚苯乙烯耐熱性較差；聚氯乙烯遇熱可能釋出有害物質。"},{"id":"115-1-6102-30","p":"115-1-6102","n":30,"q":"下列何者不是我國食品添加物中表列之防腐劑？","o":["聯苯（biphenyl）","苯甲酸（benzoic acid）","二丁基羥基甲苯（dibutyl hydroxy toluene）","去水醋酸（dehydroacetic acid）"],"a":"C","c":"食品衛生與安全","c2":"","ch":"食品添加物","ch2":"","t":"防腐劑與抗氧化劑的區分","ex":"二丁基羥基甲苯（BHT）是抗氧化劑，用來防止油脂氧化，不是防腐劑。聯苯、苯甲酸和去水醋酸都是表列的防腐劑。"},{"id":"115-1-6102-31","p":"115-1-6102","n":31,"q":"依據我國食品器具容器包裝衛生標準規定，與食品直接接觸面為金屬合金者，溶出試驗必須檢測下列那些項目？","o":["砷、鉛、鎘","錳、砷、鎘","銻、鉛、錫","錳、銻、汞"],"a":"A","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"金屬容器的溶出試驗項目","ex":"依標準答案，金屬合金材質的食品接觸面要檢測砷、鉛、鎘的溶出量。"},{"id":"115-1-6102-32","p":"115-1-6102","n":32,"q":"依據食品用洗潔劑衛生標準規定，用於食品器具、容器及包裝等食品接觸面之主要消毒成分中，下列何者亦是我國准用於食品之殺菌劑？","o":["二氧化氯","過氧化氫","次氯酸鈉","乳酸"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"洗潔劑消毒成分與食品殺菌劑","ex":"依標準答案為過氧化氫，它也是我國准用的食品殺菌劑。"},{"id":"115-1-6102-33","p":"115-1-6102","n":33,"q":"評估農產品的農藥殘留容許量（maximum residue limits, MRLs），不需要下列那項基本資料？","o":["農藥的半致死劑量（LD50）","農藥的每日攝取容許量（ADI）","每類作物之國民平均攝食量","農藥在農作物之實際殘留量"],"a":"A","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"農藥殘留容許量的訂定","ex":"訂定殘留容許量需要每日攝取容許量、國人對各類作物的取食量，以及田間試驗得到的實際殘留量。半致死劑量是急性毒性的指標，用不到。"},{"id":"115-1-6102-34","p":"115-1-6102","n":34,"q":"有關清洗蔬菜減少農藥殘留之敘述，下列何者錯誤？","o":["清水沖洗可以減少接觸型農藥的殘留","先切除不食用的部分再清洗","食鹽無法增加移除蔬菜殘留農藥之效果","先以清水浸泡數分鐘再以流水沖洗"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"清洗蔬菜去除農藥的方法","ex":"應該先清洗，再切除不吃的部分。先切的話，農藥會隨著水從切口滲進蔬菜裡。"},{"id":"115-1-6102-35","p":"115-1-6102","n":35,"q":"下列何者是最有效去除普利昂（prion）活性的方法？","o":["以消毒性酒精處理","136℃高壓蒸氣滅菌30分鐘","浸泡於次氯酸鈉溶液24小時","以250℃高溫燒烤"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"去除普利昂活性的方法","ex":"普利昂是構造異常的蛋白質，不含核酸，一般的加熱、酒精和常用消毒方法都無法去除活性，要用 134～138℃ 的高壓蒸氣滅菌才有效。"},{"id":"115-1-6102-36","p":"115-1-6102","n":36,"q":"有關熱帶性海魚毒中ciguatoxin的敘述，下列何者錯誤？","o":["內臟中毒素含量高於肌肉","中毒症狀有冷熱感覺異常和肌肉痠痛等","為水溶性物質，加熱可破壞","大型魚類含有較高毒素"],"a":"C","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"熱帶性海魚毒","ex":"雪卡毒素是脂溶性、耐熱的毒素，一般的烹煮、冷凍都無法破壞。它經由食物鏈累積，大型魚和魚的內臟含量較高。"},{"id":"115-1-6102-37","p":"115-1-6102","n":37,"q":"米飯若放在60℃以下保溫一段時間，易造成那一種病原性微生物生長？","o":["沙門氏菌","仙人掌桿菌","金黃色葡萄球菌","肉毒桿菌"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"仙人掌桿菌食品中毒","ex":"仙人掌桿菌的孢子耐熱，煮飯時不會被殺死；米飯放在 60℃ 以下保溫或在室溫放太久，孢子會發芽繁殖並產生毒素。"},{"id":"115-1-6102-38","p":"115-1-6102","n":38,"q":"下列那些病原菌主要是透過糞口感染而造成食物中毒？①沙門氏菌　②彎曲桿菌　③布魯士桿菌　④腸炎弧菌","o":["①②","③④","①③","②④"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"病原菌的傳染途徑","ex":"沙門氏菌和彎曲桿菌存在於動物和人的腸道中，經由糞便污染食物或飲水而傳染。布魯士桿菌主要來自未殺菌的乳品或接觸受感染的動物；腸炎弧菌來自海水和海產。"},{"id":"115-1-6102-39","p":"115-1-6102","n":39,"q":"在雞肉燒烤過程中，較不會產生下列何種有害物質？","o":["多環芳香羥化合物","丙烯醯胺","羊毛胺酸","異環胺類化合物"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"燒烤產生的有害物質","ex":"丙烯醯胺主要是富含澱粉的食物在高溫下，由天門冬醯胺和還原糖反應產生，例如炸薯條、洋芋片。肉類燒烤產生的主要是多環芳香烴和異環胺。"},{"id":"115-1-6102-40","p":"115-1-6102","n":40,"q":"下列關於腸炎弧菌（Vibrio parahaemolyticus）之敘述，何者錯誤？","o":["此菌屬於革蘭氏陽性菌，兼性厭氧","此菌具有鞭毛，不能產生孢子，屬好鹽性","可能透過生食魚類食品引起中毒","可經由器具、容器等造成交叉污染"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"腸炎弧菌的特性","ex":"腸炎弧菌是革蘭氏「陰性」菌，不是陽性菌。它是兼性厭氧、有鞭毛、不產孢子的好鹽菌，常經由生食海鮮或交叉污染引起中毒。"},{"id":"115-1-6102-41","p":"115-1-6102","n":41,"q":"長期攝取紅麴原料製成的食品，較可能有下列那種毒素中毒的風險？","o":["黃麴毒素","橘黴素","赭麴毒素","黃黴毒素"],"a":"B","c":"食品衛生與安全","c2":"","ch":"天然毒素與汙染物","ch2":"","t":"紅麴與橘黴素","ex":"紅麴菌在發酵過程中可能產生橘黴素（citrinin），對腎臟有毒性，所以紅麴製品訂有橘黴素的限量。"},{"id":"115-1-6102-42","p":"115-1-6102","n":42,"q":"下列那一種寄生蟲主要分布在熱帶地區，藉由被糞便污染的水或食物侵入並寄生於腸道，引發噁心嘔吐、潰瘍、水瀉，並伴隨疲倦、寒顫等症狀？","o":["中華肝吸蟲","痢疾阿米巴原蟲","廣節裂頭絛蟲","橫川吸蟲"],"a":"B","c":"食品衛生與安全","c2":"","ch":"食品微生物與食品中毒","ch2":"","t":"經食物與水傳染的寄生蟲","ex":"痢疾阿米巴原蟲的囊體隨糞便排出，經由受污染的水或食物進入人體，寄生在大腸造成潰瘍和腹瀉。中華肝吸蟲、廣節裂頭絛蟲和橫川吸蟲都是吃了生的淡水魚而感染。"},{"id":"115-1-6102-43","p":"115-1-6102","n":43,"q":"依據我國食品良好衛生規範準則，食品業者應指派下列何種人員，就建築與設施及衛生管理情形，按日填報衛生管理紀錄？","o":["管理衛生人員","衛生管理人員","烹調技術人員","廚師"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"衛生管理紀錄的填報人員","ex":"準則規定食品業者應指派「管理衛生人員」，每天填報衛生管理紀錄。「衛生管理人員」是另一個名詞，指特定業別依法必須設置、具有資格的專門人員。"},{"id":"115-1-6102-44","p":"115-1-6102","n":44,"q":"依據我國食品良好衛生規範準則，食品業者之場區廁所應符合之規定，不包括下列何者？","o":["設置地點應防止污染水源","不得正面開向食品作業場所","照明光線應達200勒克斯（Lux）","應於明顯處標示如廁後應洗手"],"a":"C","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"廁所的設置規定","ex":"準則對廁所的要求是設置地點要防止污染水源、不得正面開向食品作業場所、保持整潔，並在明顯的地方標示如廁後應洗手，沒有 200 勒克斯的照明規定。"},{"id":"115-1-6102-45","p":"115-1-6102","n":45,"q":"依據餐具清洗良好作業指引，下列何者不符合餐具洗滌作業中的有效殺菌槽條件？","o":["水溫72℃且浸泡3分鐘","121℃乾熱30分鐘","餘氯量200 ppm氯液且浸泡3分鐘","100℃以上蒸氣加熱3分鐘"],"a":"A","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"餐具的有效殺菌條件","ex":"有效殺菌的方法包括煮沸、100℃ 蒸氣加熱 2 分鐘以上、80℃ 以上熱水浸泡 2 分鐘以上、有效餘氯 200 ppm 的氯液浸泡 2 分鐘以上、110℃ 以上乾熱 30 分鐘以上。72℃ 的水溫不夠。"},{"id":"115-1-6102-46","p":"115-1-6102","n":46,"q":"有關食材採購與驗收的敘述，下列何者錯誤？","o":["廠商採購食材須訂定採購原則","驗收冷凍品其表面溫度需低於零下7℃","為確保食材來源與品質需要供應商提出認證證明","須採源頭式的衛生安全管理"],"a":"B","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"食材的採購與驗收","ex":"冷凍食品驗收時，中心溫度應該在零下 18℃ 以下，表面溫度零下 7℃ 是不夠低的。"},{"id":"115-1-6102-47","p":"115-1-6102","n":47,"q":"含鐵氟龍（Teflon）塗層之不沾鍋，在高溫烹煮食物時可能釋出何種有害物質？","o":["氫氟酸（HF）","全氟辛酸銨（PFOA）","氟化氫（HF)","鄰苯二甲酸二丁酯（DBP）"],"a":"B","c":"食品衛生與安全","c2":"","ch":"容器包裝與洗潔劑","ch2":"","t":"不沾鍋塗層的有害物質","ex":"鐵氟龍塗層在製造過程中曾使用全氟辛酸（PFOA），不沾鍋空燒或過度高溫時，塗層分解可能釋出這類全氟化合物。"},{"id":"115-1-6102-48","p":"115-1-6102","n":48,"q":"依據我國食品良好衛生規範準則，下列有關倉儲管理之敘述，何者錯誤？","o":["原材料、半成品及成品倉庫，依其作業性質或清潔程度，分別設置或予以適當區隔，並有足夠供搬運之空間","物品應予分類，採取有效措施離地貯放，並保持整潔及良好通風","倉庫管理需管制溫溼度者應建立管制方法及基準","倉儲過程中，原材料、半成品及成品，除有合理原因及依據，並作成紀錄者外，得改變原設定之貯存條件"],"a":"D","c":"食品衛生與安全","c2":"","ch":"衛生管理與 HACCP","ch2":"","t":"倉儲管理規定","ex":"準則的規定是倉儲過程中「不得」改變原設定的貯存條件，只有在有合理原因和依據、並且做成紀錄時才是例外。D 把它說成「得改變」，意思相反。"},{"id":"115-1-6102-49","p":"115-1-6102","n":49,"q":"「若肉品中含有0.01 ppm的萊克多巴胺，成人連續每天吃33片（200公克／片），至少5年才可能超過安全攝取量。」以上敘述是屬於食品安全風險評估的那一項？","o":["危害辨識（hazard identification）","危害特徵描述（hazard characterization）","暴露評估（exposure assessment）","風險特徵描述（risk characterization）"],"a":"D","c":"食品衛生與安全","c2":"","ch":"毒理與安全性評估","ch2":"","t":"風險評估的四個步驟","ex":"風險評估有四步：危害辨識、危害特徵描述、暴露評估、風險特徵描述。把安全攝取量和實際的攝取情形放在一起比較，說明風險的大小，是風險特徵描述。"},{"id":"115-1-6102-50","p":"115-1-6102","n":50,"q":"依據我國食品安全衛生管理法及其相關規定，有關基因改造標示下列敘述何者正確？","o":["食品內基因改造生物（GMO）成分含量超過3％，必須標示","食品組成與天然物實質不同，但明確含有基因改造成分者，不須標示","食品組成與天然物實質等同，同時可檢測出含基因改造成分者，不須標示","經高度加工，無法檢驗出含有基因改造成分之DNA或蛋白質之食品，不須標示"],"a":"A","c":"食品衛生與安全","c2":"","ch":"食品安全衛生法規","ch2":"","t":"基因改造食品的標示","ex":"非故意攙入的基因改造成分超過 3% 就視為基因改造食品，必須標示。高度加工、已經驗不出基因改造成分的產品，例如醬油、沙拉油，仍然要標示是用基因改造原料製成的。"}]};

/* ---------- 作答 ---------- */
function start(list, mode) { if (!list.length) return; SES = { qs: list, i: 0, picks: {}, mode: mode, done: false }; showQ(); }
function answered() { return SES.qs.filter(function (q) { return SES.picks[q.id]; }).length; }
function meta(q) {
  return '<div style="margin-top:8px"><span class="tag k">' + esc(q.c) + '</span><span class="tag">' + esc(q.ch) + '</span>' + (q.c2 ? '<span class="tag">也屬於 ' + esc(q.c2) + (q.ch2 ? '・' + esc(q.ch2) : '') + '</span>' : '') + '</div>' +
    (q.t ? '<div class="small muted" style="margin-top:4px">考點：' + esc(q.t) + '</div>' : '');
}
function optHtml(q, pick, reveal, lock) {
  return KEYS.map(function (k, i) {
    var cls = '', mark = '';
    if (reveal) { if (isRight(q, k)) { cls = ' right'; mark = '正確答案'; } else if (pick === k) { cls = ' wrong'; mark = '你的答案'; } if (pick === k && isRight(q, k)) mark = '你答對了'; }
    else if (pick === k) cls = ' sel';
    return '<button type="button" class="opt' + cls + '" data-k="' + k + '"' + (lock ? ' disabled' : '') + '><span class="k">' + k + '</span><span class="x">' + esc(q.o[i]) + '</span>' + (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');
}
function expl(q) { return q.ex ? '<div class="exp"><h3>參考解析</h3>' + esc(q.ex).replace(/\n/g, '<br>') + '</div>' : ''; }
function feedback(q, pick) {
  var ok = pick && isRight(q, pick);
  return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b class="v">' + (ok ? '答對了' : pick ? '答錯了' : '未作答') + '</b>　正確答案：<b>' + esc(ansText(q)) + '</b>' + meta(q) + '</div>' + expl(q);
}
function showQ() {
  var q = SES.qs[SES.i], n = SES.qs.length, pick = SES.picks[q.id], now = SES.mode === 'now', reveal = now && !!pick, last = SES.i === n - 1, p = paperOf(q);
  head('第 ' + (SES.i + 1) + ' ／ ' + n + ' 題', now ? '每題作答後對答案' : '已作答 ' + answered() + ' 題・交卷後對答案', true);

  var h = '<div class="card pad"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' +
    '<div class="qt">' + esc(q.q) + '</div>' + optHtml(q, pick, reveal, reveal) + (reveal ? feedback(q, pick) : '') + '</div>';
  h += '<div class="foot"><div class="row">';
  if (now) h += '<button type="button" class="btn" id="nx"' + (pick ? '' : ' disabled') + '>' + (last ? '看成績' : '下一題') + '</button>';
  else h += '<button type="button" class="btn plain" id="pv"' + (SES.i ? '' : ' disabled') + '>上一題</button>' + (last ? '<button type="button" class="btn" id="fin">交卷</button>' : '<button type="button" class="btn" id="nx">下一題</button>');
  h += '</div></div>';
  $('main').innerHTML = h;
  document.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () {
    if (now && SES.picks[q.id]) return;
    SES.picks[q.id] = b.getAttribute('data-k'); if (now) record(q, SES.picks[q.id]);

function finish() {

/* ---------- 成績 ---------- */
function result() {
  var qs = SES.qs, right = 0, wrong = 0, none = 0, by = {}, order = [];

    var k = SES.picks[q.id], key = q.c + '・' + q.ch; if (!by[key]) { by[key] = [0, 0]; order.push(key); }
    if (!k) { none++; return; } by[key][1]++; if (isRight(q, k)) { right++; by[key][0]++; } else wrong++;
  });
  var done = right + wrong, pct = done ? Math.round(right / done * 100) : 0;
  head('測驗結果', '共 ' + qs.length + ' 題', false);
  var h = '<div class="card pad"><div class="grid3"><div class="stat hl"><span>答對率</span><b>' + pct + '</b> %</div><div class="stat"><span>答對</span><b>' + right + '</b> 題</div><div class="stat"><span>答錯</span><b>' + wrong + '</b> 題</div></div>' +
    '<div class="small muted" style="margin-top:8px">答對率 ＝ 答對 ÷ 已作答的 ' + done + ' 題' + (none ? '；另有 ' + none + ' 題未作答，不列入計算' : '') + '。</div>' +
    '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="again"' + (wrong ? '' : ' disabled') + '>再練這次的錯題</button><button type="button" class="btn" id="back">回首頁</button></div></div>';
  var keys = order.filter(function (k) { return by[k][1]; });
  if (keys.length > 1) h += '<div class="card pad"><h2>各章節表現</h2><table style="margin-top:4px"><tr><th>科目・章節</th><th>答對</th><th>作答</th></tr>' +
    keys.sort(function (a, b) { return by[a][0] / by[a][1] - by[b][0] / by[b][1]; }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + by[k][0] + '</td><td>' + by[k][1] + '</td></tr>'; }).join('') + '</table></div>';
  h += seg('r_show', [['all', '全部 ' + qs.length], ['bad', '答錯 ' + wrong]], SES.show);
  var list = qs.filter(function (q) { var k = SES.picks[q.id]; return SES.show === 'all' || (k && !isRight(q, k)); });
  h += '<div class="card">' + (list.length ? list.map(function (q) {
    var k = SES.picks[q.id], ok = k && isRight(q, k), p = paperOf(q);
    return '<details class="rv"><summary><span class="mk ' + (!k ? 'na' : ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (!k ? '－' : ok ? '○' : '✕') + '</span><div class="st"><div class="q1">' + esc(q.q) + '</div>' +
      '<div class="small muted" style="margin-top:2px">' + (!k ? '未作答' : ok ? '答對' : '答錯') + '・你的答案 ' + (k || '—') + '・正確答案 ' + esc(ansText(q)) + '</div></div></summary>' +
      '<div class="bd"><span class="tag">' + esc(paperName(p).replace('　', ' ')) + '</span><span class="tag">第 ' + q.n + ' 題</span>' + optHtml(q, k, true, true) + meta(q) + expl(q) + '</div></details>';
  }).join('') : '<div class="empty">這次沒有答錯的題目</div>') + '</div><p class="note">點題目可以看選項、正確答案與參考解析。</p>';
  $('main').innerHTML = h;
  onSeg('r_show', function (v) { SES.show = v; var y = window.pageYOffset; result(); window.scrollTo(0, y); });
  $('back').onclick = home;
  $('again').onclick = function () { start(shuffle(qs.filter(function (q) { var k = SES.picks[q.id]; return k && !isRight(q, k); })), 'now'); window.scrollTo(0, 0); };
}

home();
</script>
</body>
</html>
