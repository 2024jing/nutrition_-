  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

function r05(x) { return Math.max(0, Math.round(x / 0.5) * 0.5); }

    '<tr><td>DRIs 年齡對照</td><td>' + T2[ar][1] + '・' + W.sex + '・' + ACTS[a].split('（')[0] + '</td><td>' + (k2 || '—') + '</td></tr></table></div>';

    '<div class="small muted" style="margin-top:6px">每公斤熱量依體位查表：' + ['體重過輕', '體重正常', '過重、肥胖'][col] + '・' + ACTS[a] + ' ＝ ' + fac + ' 大卡／公斤' + (age < 18 ? '（未滿 18 歲以正常欄計）' : '') + '</div></div>';

    '<div class="small muted" style="margin-top:6px">' + esc(d[0]) + '的設計占比；可接受範圍：蛋白質 10–20%、脂肪 20–30%、醣類 50–60%。</div></div>';
