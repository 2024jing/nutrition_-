<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>團體膳食循環菜單</title>
<style>
  /* Layout: sticky header with context controls, scrolling cards, bottom tab bar (菜單／檢核／採購／食譜／更多) */
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1f2a24; --muted: #66706a; --line: #e2e5df;
    --brand: #2f6b4f; --brand-soft: #e3efe8; --on-brand: #ffffff; --ok: #2e7d4f; --ok-soft: #e1f2e7;
    --bad: #b3261e; --bad-soft: #fbe5e3; --warm: #fff3d6; --chip: #eef0eb; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --bad: #ff8a80; --bad-soft: #3a1f1d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #9aa49e; --line: #2c332f; --brand: #7cc4a0; --brand-soft: #1f3329; --on-brand: #10251a;
    --ok: #7cc4a0; --ok-soft: #1d3127; --bad: #ff8a80; --bad-soft: #3a1f1d; --warm: #3a3220; --chip: #252b27; --shadow: none; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: .02em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; width: 40px; height: 40px;
    display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, .row-day:focus-visible, .list-row:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 4px; margin-top: 10px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 1 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 13px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .chips button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .search { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 9px 12px; font: inherit; }
  .demo { background: var(--warm); color: var(--ink); font-size: 12px; border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
  main { padding: 4px 16px 96px; max-width: 720px; margin: 0 auto; }
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  nav.tabbar button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; display: grid; justify-items: center; gap: 2px; padding: 4px 0; cursor: pointer; }
  nav.tabbar button svg { width: 22px; height: 22px; }
  nav.tabbar button.on { color: var(--brand); font-weight: 700; }
  .card { scroll-margin-top: 190px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); margin: 12px 0; overflow: hidden; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; flex-wrap: wrap; }
  .card-h .t { font-weight: 700; font-size: 17px; }
  .card-h .d { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .ok { background: var(--ok-soft); color: var(--ok); }
  .bad { background: var(--bad-soft); color: var(--bad); }
  .neutral { background: var(--chip); color: var(--muted); }
  .veg { background: var(--warm); color: var(--ink); font-weight: 600; }
  .dishes { padding: 2px 14px 4px; }
  .dish { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .dish:last-child { border-bottom: 0; }
  .lab { flex: 0 0 52px; font-size: 12px; color: var(--muted); }
  .nm { font-weight: 600; }
  .mt { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px 14px; background: var(--brand-soft); }
  .stat { text-align: center; min-width: 0; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .six { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 10px 14px 4px; }
  .six div { background: var(--chip); border-radius: 10px; padding: 6px 8px; display: flex; justify-content: space-between; gap: 4px; font-size: 13px; }
  .six b { font-variant-numeric: tabular-nums; }
  .flags { padding: 6px 14px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--brand); font: inherit; font-weight: 600; padding: 10px; cursor: pointer; margin-top: 8px; }
  .detail { padding: 0 14px 12px; }
  .detail h4 { margin: 12px 0 4px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .row-day, .list-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row-day:last-child, .list-row:last-child { border-bottom: 0; }
  .row-day .wd { flex: 0 0 74px; font-size: 13px; color: var(--muted); }
  .row-day .mn, .list-row .mn { flex: 1; font-weight: 600; min-width: 0; }
  .kc { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .small { color: var(--muted); font-size: 12px; font-weight: 400; }
  .sec-t { font-size: 15px; font-weight: 700; margin: 18px 2px 4px; }
  .ov { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .ov:last-child { border-bottom: 0; }
  .ov .i { flex: 1; min-width: 0; } .ov .v { color: var(--muted); font-size: 13px; text-align: right; }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 8px 14px 12px; }
  .kv div { background: var(--chip); border-radius: 10px; padding: 6px 9px; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
  .kv span { color: var(--muted); }
  .item { padding: 9px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .r1 { display: flex; gap: 8px; align-items: baseline; }
  .item .r1 b { flex: 1; min-width: 0; }
  .item .big { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .r2 { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .menu-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left;
    background: transparent; border-left: 0; border-right: 0; border-top: 0; color: var(--ink); font: inherit; }
  .menu-row:last-child { border-bottom: 0; }
  .menu-row .tx { flex: 1; min-width: 0; } .menu-row .tx b { display: block; } .menu-row .tx span { color: var(--muted); font-size: 13px; }
  .menu-row svg { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
  .prose { padding: 4px 14px 12px; font-size: 14px; white-space: pre-line; }
  .prose h3 { font-size: 15px; margin: 14px 0 4px; }
  a { color: var(--brand); word-break: break-all; }
  .msg { text-align: center; color: var(--muted); padding: 48px 16px; }
  .skel { height: 180px; border-radius: 16px; margin: 12px 0; background: linear-gradient(90deg, var(--chip), var(--card), var(--chip)); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel, .icon-btn.spin svg { animation: none; } }
  .note { color: var(--muted); font-size: 12px; margin: 16px 2px; }
  .badge.mod { background: var(--warm); color: var(--ink); }
  .modt { color: var(--ink); background: var(--warm); padding: 1px 6px; border-radius: 6px; font-weight: 700; }
  .dot-mod { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e0a100; margin-left: 4px; vertical-align: 2px; }
  .btn2 { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin-top: 8px; }
  .btn2 .more { margin-top: 0; border-top: 0; } .btn2 .more + .more { border-left: 1px solid var(--line); }
  .editbox { background: var(--chip); border-radius: 12px; margin: 0 14px 12px; padding: 10px 12px; }
  .erow { padding: 8px 0; border-bottom: 1px dashed var(--line); } .erow:last-of-type { border-bottom: 0; }
  .elab { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .erow select, .form select { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 16px; }
  .eex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .stp { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
  .stp button { border: 0; background: transparent; color: var(--brand); font: inherit; font-size: 20px; font-weight: 700; width: 38px; height: 36px; cursor: pointer; }
  .stp button:disabled { color: var(--muted); opacity: .4; cursor: default; }
  .stp b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
  .erow2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .enm { flex: 1 1 100%; font-weight: 600; }
  .ebtn { border: 1px solid var(--line); background: var(--card); color: var(--brand); border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .ebtn.del, .ebtn.warn { color: var(--bad); } .ebtn.warn { margin-top: 10px; } .ebtn[disabled] { opacity: .4; cursor: default; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; } .addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 16px; }
  .lk { width: 13px; height: 13px; vertical-align: -2px; color: var(--muted); }
  .warnbox { background: var(--bad-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  .editbox .warnbox, .detail .warnbox { margin: 8px 0; }
  .badkv { outline: 2px solid var(--bad); }
  .bad-t { color: var(--bad); }
  .muted { color: var(--muted); }
  .form { padding: 4px 14px 8px; } .fr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fr:last-child { border-bottom: 0; } .fr > span { font-size: 14px; } .fr select { max-width: 60%; }
  .nin { display: inline-flex; align-items: center; gap: 6px; } .nin input { width: 92px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 7px 8px; font: inherit; font-size: 16px; text-align: right; }
  .nin span { font-size: 13px; color: var(--muted); }
  .pad2 { padding: 0 14px 12px; } .ebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 10px; }
  .wt-wrap { overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; -webkit-overflow-scrolling: touch; }
  table.wt { border-collapse: separate; border-spacing: 0; min-width: 760px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
  .wt th, .wt td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 6px 6px; vertical-align: top; text-align: left; }
  .wt tr > :first-child { border-left: 0; }
  .wt .stk { position: sticky; left: 0; z-index: 2; background: var(--card); min-width: 76px; max-width: 76px; font-size: 12px; color: var(--ink); font-weight: 700; box-shadow: 1px 0 0 var(--line); }
  .wt th:not(.stk) { min-width: 132px; background: var(--brand-soft); }
  .wt .dh { display: grid; gap: 2px; } .wt .dh span { color: var(--muted); font-weight: 400; font-size: 11px; } .wt .dh .badge { justify-self: start; }
  .wt select { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 4px; font: inherit; font-size: 14px; }
  .wt .exl { margin-top: 5px; } .wt .stp button { width: 30px; height: 28px; font-size: 17px; } .wt .stp b { min-width: 34px; font-size: 13px; }
  .wt .sv { font-size: 11px; color: var(--muted); margin-top: 3px; } .wt .sg { display: block; font-size: 11px; color: var(--brand); }
  .wt td.edc { background: var(--warm); }
  .wt td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .wt td.badc { background: var(--bad-soft); color: var(--bad); font-weight: 700; } .wt .jt { display: block; font-size: 11px; }
  .wt .u { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .wt tr.sec th, .wt tr.sec td { background: var(--chip); font-size: 12px; color: var(--muted); padding: 4px 6px; }
  .wt tr:last-child > * { border-bottom: 0; }
  .ebtn.sm { padding: 3px 8px; font-size: 12px; margin-top: 0; }
  table.rt { min-width: 600px; } table.rt td { vertical-align: middle; } table.rt td.nm2 { font-weight: 600; white-space: nowrap; } table.rt td.ctl { white-space: nowrap; }
  table.rt .stp button { width: 30px; height: 28px; font-size: 17px; } table.rt .stp b { min-width: 34px; font-size: 13px; }
  table.rt tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
  .editbox .scroll { margin: 0 -4px; }
  .detail .editbox { margin: 0 -6px 12px; padding: 8px; }
  main.wide { max-width: 1240px; }
  @media (max-height: 520px) { header { position: static; } }
  table.rt td.nm2 { position: sticky; left: 0; background: var(--chip); z-index: 1; }
  .bkt { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="icon-btn" id="back" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">團體膳食・循環菜單</h1>
  </div>
  <div class="sub" id="sub"></div>
  <div id="ctx"></div>
</header>
<main id="main"></main>
<nav class="tabbar" id="tabbar">
  <button data-v="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>菜單</button>
  <button data-v="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>檢核</button>
  <button data-v="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>採購</button>
  <button data-v="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h7"/></svg>食譜</button>
  <button data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>更多</button>

（循環第 15 天）","slots":[["五穀飯",4.5],["腰果雞丁",2],["蔥燒豆腐",0.5],["蒜炒小白菜",1],["地瓜芋圓湯",1.5]]},{"label":"第4週 星期一（循環第 16 天）","slots":[["糙米飯",6],["香酥魚排",2],["滷豆干海帶",0.5],["蒜炒空心菜",1.5],["番茄蔬菜湯",0.5]]},{"label":"第4週 星期二（循環第 17 天）","slots":[["燕麥飯",5.5],["打拋豬肉",2],["蝦仁滑蛋",0.5],["蒜炒青江菜",1],["橘子",1]]},{"label":"第4週 星期三（循環第 18 天）　奶蛋蔬食日","slots":[["紫米飯",5.5],["滷蛋豆干",2],["彩椒毛豆玉米筍",0.5],["紅蘿蔔炒青花菜",1],["山藥香菇湯",0.5]]},{"label":"第4週 星期四（循環第 19 天）","slots":[["地瓜飯",5],["壽喜燒肉片",2],["白菜滷",0.5],["蒜炒油菜",1],["低脂鮮乳",1]]},{"label":"第4週 星期五（循環第 20 天）","slots":[["小米飯",4.5],["香菇燒雞",2],["豆包炒高麗菜",0.5],["蒜炒菠菜",1],["芋頭西米露",1.5]]}],"readme":[["整體邏輯","食材主檔（每 EX 的克數與營養）→ 食譜資料庫 9 個分頁（每道菜以 1 EX 建檔）→ 菜單設定（選菜＋EX）→ 第1–4週明細（自動展開成每人克數與營養）→ 循環菜單總表與規範檢核。\n換年齡層時，只要在「菜單設定」改供應對象，供應EX 會依倍率自動換算，後面各表全部跟著更新。"],["EX 是什麼","EX＝食物代換表的「份」。資料庫每道菜都換算成「基準類別 1 EX」的配方：主食以全榖 1 EX、主菜與半葷素配菜以豆魚蛋肉 1 EX、蔬菜類以蔬菜 1 EX、水果與乳品各以 1 EX 為基準；沒有對應類別的（如黑糖薑茶）以「份」（整道一份）為基準。\n菜單上的每人克數＝每EX g × 供應EX。例：洋蔥炒雞胸肉每 EX 用雞胸 30 g，供應 2 EX 就是 60 g。"],["工作表","對象設定：各年齡層的目標與倍率。\n菜單設定：20 天 × 5 格，選菜並填設計EX；每天下方有合計與判定。\n第1週–第4週：依您的範例格式自動產生的明細，請勿直接修改。\n循環菜單總表、規範檢核：自動彙整。\n主食／主菜／半葷素／副菜／湯品／附餐／甜湯／水果／乳品：食譜資料庫，可自由增減。「半葷素」是含豆魚蛋肉的配菜，「副菜」是蔬菜類配菜；菜單的副菜一、副菜二兩格都可以從這兩頁選。\n採購單、營養標示：選一天產生採購量與餐盒標示。\n食材主檔：每種食材的類別、每 EX 克數、營養、可食率、膨縮率、單價。\n索引、清單：系統用的輔助表，請勿修改。"],["資料庫內容（161 道）","您原本的 84 道菜（材料與作法來自網路食譜，連結在各列）＋前一份 4 週循環菜單用到的 76 道菜（我自擬的配方，克數依據標「自擬」，作法摘要未附網路來源）＋附餐分頁 1 列示範。\n「參考供應EX」欄：84 道菜是原表份量換算的 EX（成人份量），循環菜單的菜是菜單實際用量。"],["新增或刪除菜","新增：到對應分頁下方空白列，第一列填項目、菜名、烹調法、基準類別，往下每列填材料與「每 EX 的克數」。「基準EX檢核」應為 1.00，紅底表示配方沒有換算成 1 EX。\n刪除：選取該菜的整列刪除。在一道菜中間加材料：複製該菜任一整列後「插入複製的儲存格」。\n材料名稱要和食材主檔一致（否則顯示紅底「查無食材」）；菜名在整個檔案不可重複。新增的菜會自動出現在「菜單設定」的下拉選單。\n各分頁的「菜單使用次數／菜單使用日」會顯示每道菜排在哪幾天（例：1週一 4週一），次數為「-」表示尚未排入菜單。"],["建立另一個年齡層的菜單","①在「對象設定」加一列目標值（倍率會自動算出）。②到「菜單設定」把供應對象改成該對象。③看每天的判定，紅底的再微調設計EX 或換菜。\n若要同時保留多個年齡層的菜單，請另存新檔，一個檔案對應一個對象。"],["採購單與營養標示","「採購單」選週次與星期，就會依 Menu A 的格式列出當天每項食材的 EX、熟重供應量、生品可食重、採購量與總採購量（× 供餐人數），右側另有同食材合計。供餐人數在「菜單設定」F3。\n「營養標示」會跟著採購單選的那一天，列出每道菜的各類份數、糖與熱量，可直接列印。\n膨縮率在「食材主檔」：白米、藜麥、豬里肌、青椒、甜椒、玉米粒、雞蛋、青江菜取自您的 Menu A，其餘是我估的（橘底），請用實測值更新。"],["明細表的列數限制","每天固定列數：主食 7 列、主菜 10 列、副菜各 10 列、副食 6 列。菜的材料數超過時會被截掉，「菜單設定」的材料數欄會變紅提醒。"],["這次為了共用配方所做的調整","同名的菜在資料庫只能有一個配方，所以把上一版循環菜單做了小幅調整，20 天的營養與份數檢核結果不變：\n• 六種主食改為固定比例（如糙米飯＝白米 12 g＋糙米 8 g／EX），供應量改由 EX 決定。\n• 兩道同名不同做法的菜改名：第 2 週週二「蒜拌青江菜」（燙）、第 4 週週三「紅蘿蔔炒青花菜」。\n• 幾道菜的克數微調（如地瓜葉統一為 100 g、京醬肉絲洋蔥 55 g），讓每餐油脂仍為 2.5 EX。\n• 原表的「蒜炒地瓜葉」材料其實是薑絲，改名為「薑絲炒地瓜葉」；「蒜炒空心菜」「香蕉」兩表共用同一配方。"],["請留意","①食材主檔單價為概估行情，不是實際報價。\n②主檔橘底的每 EX 克數與脂肪等級請對照官方代換表確認。\n③84 道菜的調味料克數與炒菜用油多為估計（克數依據欄：綠底＝食譜、橘底＝補估）。\n④「對象設定」的 600／900 大卡兩列是依熱量反推的示範，不是官方基準。這兩列切換後 20 天皆符合；自行新增的對象若目標差距較大，自動換算只是初稿，通常還要微調設計EX。\n⑤公式以 LibreOffice 驗算；下拉選單未在 Excel 實測。"],["10/9 版調整","①全檔營養素順序統一為 P、F、C（與食物代換表一致）：食材主檔、9 個食譜分頁、索引、第1–4週、菜單設定（蛋白質占比在前）、規範檢核，引用都已一併更新。\n②份數級距：食譜每道菜的材料份數(EX)以 0.5 為最小級距；調味料、香油、芝麻、蔥／芹菜／九層塔等辛香料，以及份數不到 0.25 的配料（含 0.25 份以下的少許用油）用 0.1 級距；每EX克數由新份數回推。基準類別合計維持 1 EX（17 道菜有一項材料以 0.1 微調）。\n③菜單設定的設計EX、供應EX、建議供應EX 與食譜的參考供應EX 都改為 0.5 級距；7 天為了維持判定符合另外調整了設計EX。\n④數值顯示到小數點第一位；週表份數內部保留兩位計算，避免逐列進位造成合計偏差。\n⑤湯品：「對象設定」新增每人湯量（暫定 300 mL）與固形物占比上限（暫定 50%），菜單設定每天右側顯示湯品固形物與占比，超過顯示「偏多」（提醒，不列入單日判定）。原表 4 道豆腐湯的參考供應EX 改為 0.5。\n詳細清單見最後的「修改紀錄」分頁。"]],"readme_title":"營養午餐循環菜單系統　使用說明","label_note":"供應對象「國小4–6年級午餐」每餐目標：全榖 5–6.5 份，豆魚蛋肉 2.5 份，蔬菜 2 份以上，油脂 2.5 份，熱量 720–830 大卡","summary_note":"供應對象：國小4–6年級午餐　｜　每餐：1 主食＋1 主菜＋2 副菜＋1 副食　｜　週三奶蛋蔬食日"};
/* ===== 團膳計算引擎：與 Excel「營養午餐循環菜單系統」10/9 版相同算法 ===== */
var ENGINE = (function () {
  var TABS = ['主食', '主菜', '半葷素', '副菜', '湯品', '附餐', '甜湯', '水果', '乳品'];
  var SLOTS = ['主食', '主菜', '副菜一', '副菜二', '副食'];
  var LIM = [7, 10, 10, 10, 6];                       // 週表每格可放的材料列數
  var DAYS = ['星期一', '星期二', '星期三', '星期四', '星期五'];
  var FINE = ['香油', '青蔥', '芹菜', '九層塔', '香菜', '辣椒', '蒜苗', '紅蔥頭'];
  function R(x, n) { var m = Math.pow(10, n || 0), a = Math.abs(x); return (x < 0 ? -1 : 1) * Math.floor(a * m + 0.5 + 1e-9) / m; }
  function isNum(x) { return typeof x === 'number' && !isNaN(x); }
  function N(x) { return isNum(x) ? x : 0; }

  /* model＝Excel 原始資料；ov＝使用者的修改（存在手機） */
  function build(model, ov) {
    ov = ov || {};
    var M = {};                                       // 食材主檔（含修改）
    model.master.forEach(function (r) {
      if (M[r[0]]) return;
      var o = (ov.master || {})[r[0]] || {};
      M[r[0]] = { name: r[0], cat: r[1], unit: r[2], p: r[3], f: r[4], c: r[5], k: r[6], veg: r[7], allergen: r[8], semi: r[9],
        edible: isNum(o.edible) ? o.edible : r[10], price: isNum(o.price) ? o.price : r[11], date: r[12], yieldPct: isNum(o.yieldPct) ? o.yieldPct : r[13],
        yieldSrc: r[14], note: r[15], row: r, edited: !!(ov.master || {})[r[0]] };
    });
    var target = ov.target || model.target;
    var T0 = model.targets[0], T = model.targets.filter(function (t) { return t[0] === target; })[0] || T0;
    var mult = { '全榖': R((T[3] + T[4]) / (T0[3] + T0[4]), 2), '豆魚蛋肉': R(T[5] / T0[5], 2), '蔬菜': R(T[6] / T0[6], 2) };
    var X = model.extras;
    var cfg = { target: target, T: T, mult: mult, servings: isNum(ov.servings) ? ov.servings : model.servings,
      season: isNum(ov.season) ? ov.season : X.season, budget: X.budget, soupV: isNum(ov.soupV) ? ov.soupV : X.soupV, soupR: isNum(ov.soupR) ? ov.soupR : X.soupR };

    /* 食譜（每 1 EX） */
    var REC = {}, ORDER = [];
    model.recipes.forEach(function (d) {
      var ings = (ov.recipes || {})[d.name] || d.ings;
      var r = calcRecipe(d, ings, M); r.edited = !!(ov.recipes || {})[d.name]; r.orig = d;
      if (!REC[d.name]) { REC[d.name] = r; ORDER.push(d.name); }
    });

    /* 20 天 */
    var menu = model.menu.map(function (m, i) {
      return m.slots.map(function (s, k) {
        var o = (ov.menu || {})[i + '-' + k];
        return o ? { dish: o.dish, ex: o.ex, edited: true } : { dish: s[0], ex: s[1], edited: false };
      });
    });
    var days = menu.map(function (sl, i) { return calcDay(i, sl, REC, M, cfg, model); });
    // 食譜的使用次數、使用日（依目前菜單，唯讀）
    ORDER.forEach(function (n) { REC[n].used = 0; REC[n].usedDays = []; });
    days.forEach(function (d) { d.slots.forEach(function (s) { if (REC[s.dish]) { REC[s.dish].used++; var tag = d.week + '週' + d.day.slice(2); if (REC[s.dish].usedDays.indexOf(tag) < 0) REC[s.dish].usedDays.push(tag); } }); });
    return { M: M, REC: REC, ORDER: ORDER, days: days, cfg: cfg, menu: menu, weekly: calcWeekly(days), overall: null };
  }

  function stepOf(name, origEx, cat) {
    if (cat === '調味') return 0;
    if (FINE.indexOf(name) >= 0 || name.indexOf('芝麻') >= 0) return 0.1;
    if (isNum(origEx) && Math.abs(origEx * 2 - Math.round(origEx * 2)) > 1e-6) return 0.1;
    return 0.5;
  }

function curRecIngs(n) { return (OV.recipes[n] || RES.REC[n].orig.ings).map(function (x) { return [x[0], x[1], x[2] || '']; }); }
function setRec(n, ings) {
  var o = RES.REC[n].orig.ings, same = ings.length === o.length && ings.every(function (x, i) { return x[0] === o[i][0] && Math.abs(x[1] - o[i][1]) < 1e-9; });
  if (same) delete OV.recipes[n]; else OV.recipes[n] = ings;
  save();
}
function setMaster(n, f, v) {
  var r = MODEL.master.filter(function (x) { return x[0] === n; })[0], orig = { edible: r[10], price: r[11], yieldPct: r[13] }[f];
  var o = OV.master[n] || {};
  if (Math.abs(v - orig) < 1e-9) delete o[f]; else o[f] = v;
  if (Object.keys(o).length) OV.master[n] = o; else delete OV.master[n];
  save();
}
function keepScroll(fn) { var y = window.pageYOffset; fn(); render(); window.scrollTo(0, y); }

document.addEventListener('click', function (e) {
  var t = e.target.closest('button, .row-day, .list-row');
  if (!t || t.disabled) return;
  var ds = t.dataset;
  if (t.id === 'back') { S.view = 'more'; render(); return window.scrollTo(0, 0); }
  if (ds.v) { S.view = ds.v; render(); return window.scrollTo(0, 0); }
  if (ds.go) { S.view = ds.go; S.bk = ''; render(); return window.scrollTo(0, 0); }
  if (ds.w !== undefined) { S.week = +ds.w; render(); return window.scrollTo(0, 0); }
  if (ds.d !== undefined) { S.day = +ds.d; return render(); }
  if (ds.bt) { S.buyTab = ds.bt; return render(); }
  if (ds.lay) { S.layout = ds.lay; try { localStorage.setItem('tuanshan-layout', ds.lay); } catch (x) {} return render(); }
  if (ds.cat) { S.cat = ds.cat; S.q = ''; render(); return window.scrollTo(0, 0); }
  if (ds.mc) { S.mcat = ds.mc; return render(); }
  if (ds.open) { S.open[ds.open] = !S.open[ds.open]; return keepScroll(function () {}); }
  if (ds.edit) { S.edit[ds.edit] = !S.edit[ds.edit]; if (S.edit[ds.edit] && ds.edit[0] === 'r') S.open[ds.edit] = true; return keepScroll(function () {}); }
  if (ds.goday) { var n = +ds.goday; S.view = 'menu'; S.week = Math.floor((n - 1) / 5); S.edit['d' + n] = true; render(); var el = $('day-' + n); if (el) el.scrollIntoView({ block: 'start' }); return; }
  if (ds.day) { var n2 = +ds.day; S.view = 'menu'; S.week = Math.floor((n2 - 1) / 5); render(); var el2 = $('day-' + n2); if (el2) el2.scrollIntoView({ block: 'start' }); return; }
  if (ds.st) {
    var id = ds.st, dir = +ds.dir, step = +ds.step;
    return keepScroll(function () {
      if (id[0] === 'm') {                                   // 菜單設計EX
        var p = id.slice(1).split('-'), i = +p[0], k = +p[1], s = RES.menu[i][k];
        var v = R(Math.max(0.5, Math.min(12, (isNum(s.ex) ? s.ex : 0) + dir * step)) / 0.5, 0) * 0.5;
        setMenu(i, k, s.dish, v);
      } else {                                               // 食譜材料
        var n = ds.rec, idx = +id.slice(1), ings = curRecIngs(n), m = RES.M[ings[idx][0]];
        if (id[0] === 'g') ings[idx][1] = Math.max(0.1, R(ings[idx][1] + dir * step, 1));
        else { var ex = R(ings[idx][1] / m.unit / step, 0) * step; ex = Math.max(step, R(ex + dir * step, 1)); ings[idx][1] = R(ex * m.unit, 1); }
        setRec(n, ings);
      }
    });
  }
  if (ds.delrow !== undefined) { return keepScroll(function () { var ings = curRecIngs(ds.rec); ings.splice(+ds.delrow, 1); setRec(ds.rec, ings); }); }
  if (ds.addrow) {
    var inp = document.getElementById('add-' + ds.addrow), name = inp ? inp.value.trim() : '', m = RES.M[name];
    if (!m) { if (inp) { inp.setCustomValidity('食材主檔沒有「' + name + '」，請從清單選擇'); inp.reportValidity(); setTimeout(function () { inp.setCustomValidity(''); }, 2500); } return; }
    return keepScroll(function () { var ings = curRecIngs(ds.addrow); var st = ENGINE.stepOf(name, null, m.cat); ings.push([name, m.cat === '調味' ? 1 : R(st * m.unit, 1), '學生新增']); setRec(ds.addrow, ings); });
  }
  if (ds.resetday !== undefined) { return keepScroll(function () { for (var k = 0; k < 5; k++) delete OV.menu[ds.resetday + '-' + k]; save(); }); }
  if (ds.resetrec) { return keepScroll(function () { delete OV.recipes[ds.resetrec]; save(); }); }
  if (ds.resetm) { return keepScroll(function () { delete OV.master[ds.resetm]; save(); }); }
  if (ds.resetcfg) { return keepScroll(function () { delete OV[ds.resetcfg]; save(); }); }
  if (ds.bk) {
    var a = ds.bk, msg = function (x) { if ($('bkmsg')) $('bkmsg').textContent = x; };
    if (a === 'export' || a === 'import') { S.bk = S.bk === a ? '' : a; return keepScroll(function () {}); }
    if (a === 'copy') { var tx = $('bkt'); tx.select(); var ok = function () { msg('已複製，請貼到 LINE 記事本或 Keep'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx.value).then(ok, function () { try { document.execCommand('copy'); ok(); } catch (x) { msg('請長按文字框全選後複製'); } });
      else { try { document.execCommand('copy'); ok(); } catch (x) { msg('請長按文字框全選後複製'); } } return; }
    if (a === 'restore') {
      var mm = String($('bkt').value).match(/備份碼：\s*([A-Za-z0-9+\/=\s]+)/), raw = mm ? mm[1].replace(/\s+/g, '') : String($('bkt').value).trim(), obj = null;
      try { obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (x) { obj = null; }
      if (!obj || !obj.ov || typeof obj.ov !== 'object') { msg('看不懂這段文字，請確認有貼到「備份碼：」那一行'); return; }
      if (!confirm('要用備份取代目前所有修改嗎？')) return;
      OV = obj.ov; ['menu', 'recipes', 'master'].forEach(function (k) { if (!OV[k] || typeof OV[k] !== 'object') OV[k] = {}; });
      Object.keys(OV.recipes).forEach(function (n) { if (!RES.REC[n]) delete OV.recipes[n]; });
      save(); S.bk = ''; render(); alert('已還原備份。'); return;
    }
    if (a === 'resetall') { if (!confirm('確定要全部恢復原版嗎？所有修改都會刪除，無法復原。\n\n建議先按「匯出」留一份備份。')) return; OV = { menu: {}, recipes: {}, master: {} }; save(); S.bk = ''; S.edit = {}; render(); alert('已全部恢復原版。'); }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.dish) { var p = t.dataset.dish.split('-'), i = +p[0], k = +p[1], s = RES.menu[i][k], ex = isNum(s.ex) ? s.ex : 1;
    return keepScroll(function () { setMenu(i, k, t.value, t.value ? ex : ''); }); }
  if (t.dataset.cfg) {
    var f = t.dataset.cfg, v = f === 'target' ? t.value : parseFloat(t.value);
    if (f !== 'target' && (!isNum(v) || v < 0)) return render();
    if (f === 'servings') v = Math.max(1, Math.round(v));
    if (f === 'soupR') v = R(v / 100, 4);
    var orig = { target: MODEL.target, servings: MODEL.servings, season: MODEL.extras.season, soupV: MODEL.extras.soupV, soupR: MODEL.extras.soupR }[f];
    return keepScroll(function () { if (v === orig) delete OV[f]; else OV[f] = v; save(); });
  }
  if (t.dataset.mf) { var v2 = parseFloat(t.value); if (!isNum(v2) || v2 <= 0) return render(); if (t.dataset.mf === 'edible') v2 = R(Math.min(100, v2) / 100, 4);
    return keepScroll(function () { setMaster(t.dataset.mn, t.dataset.mf, v2); }); }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row-day, .list-row')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; renderMain(); }
  if (e.target.id === 'mq') { S.mq = e.target.value; renderMain(); }
});
(function () { var dl = document.createElement('datalist'); dl.id = 'mlist'; dl.innerHTML = MODEL.master.map(function (r) { return '<option value="' + esc(r[0]) + '">' + esc(r[1]) + '</option>'; }).join(''); document.body.appendChild(dl); })();
render();

</script>
</body>
</html>
